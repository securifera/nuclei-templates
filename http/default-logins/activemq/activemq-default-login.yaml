id: activemq-default-login

info:
  name: Apache ActiveMQ Default Login
  author: pdteam
  severity: high
  description: Apache ActiveMQ default login credentials were discovered.
  reference:
    - https://github.com/apache/activemq-artemis/
  classification:
    cpe: cpe:2.3:a:apache:activemq:*:*:*:*:*:*:*:*
  metadata:
    product: activemq
    vendor: apache
    max-request: 2
    shodan-query: title:"ActiveMQ Artemis Console"
  tags: apache,activemq,default-login,vuln

http:
  - raw:
      - |
        GET /admin/ HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    payloads:
      username:
        - user
        - admin
      password:
        - user
        - admin
    attack: pitchfork
    matchers:
      - type: word
        name: activemq
        cpe: cpe:2.3:a:apache:activemq:*:*:*:*:*:*:*:*
        words:
          - 'Welcome to the Apache ActiveMQ Console of <b>'
          - '<h2>Broker</h2>'
        condition: and
