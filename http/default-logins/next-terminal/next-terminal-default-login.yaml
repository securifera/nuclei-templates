id: next-terminal-default-login

info:
  name: Next Terminal - Default Login
  author: ritikchaddha
  severity: high
  description: |
    Next Terminal default login was discovered.
  reference:
    - https://github.com/dushixiang/next-terminal
  classification:
    cpe: cpe:2.3:a:next:next:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Next Terminal"
    vendor: next
    product: next
  tags: default-login,next-terminal,next,vuln

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}","remember":false}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        name: next
        cpe: cpe:2.3:a:next:next:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'message":"success'
          - 'code":1'
          - 'data":"'
        condition: and

      - type: status
        status:
          - 200
