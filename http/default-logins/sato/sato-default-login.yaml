id: sato-default-login

info:
  name: Sato - Default Login
  author: y0no
  severity: high
  description: |
    Sato using default credentials was discovered.
  classification:
    cpe: cpe:2.3:a:sato:sato:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Sato"
    vendor: sato
    product: sato
  tags: sato,default-login,printer,vuln

http:
  - raw:
      - |
        POST /WebConfig/lua/auth.lua HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Referer: {{BaseURL}}

        group={{username}}&pw={{password}}

    attack: pitchfork

    payloads:
      username:
        - 'settings'
        - 'service'
      password:
        - '0310'
        - '6677'

    matchers-condition: and
    matchers:
      - type: word
        name: sato
        cpe: cpe:2.3:a:sato:sato:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"r":0'
          - 'groups":["user'
        condition: and

      - type: word
        name: sato-2
        cpe: cpe:2.3:a:sato:sato:*:*:*:*:*:*:*:*
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
