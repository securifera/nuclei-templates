id: szhe-default-login

info:
  name: Szhe Default Login
  author: pikpikcu
  severity: medium
  description: Szhe default login information was discovered.
  reference:
    - https://github.com/Cl0udG0d/SZhe_Scan
  classification:
    cpe: cpe:2.3:a:szhe:szhe:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:N/A:N
    cvss-score: 5.8
    cwe-id: CWE-522
  metadata:
    max-request: 1
    vendor: szhe
    product: szhe
  tags: szhe,default-login,vuln

http:
  - raw:
      - |
        POST /login/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        email={{username}}&password={{password}}&remeber=true

    payloads:
      username:
        - springbird@qq.com
      password:
        - springbird
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        name: szhe
        cpe: cpe:2.3:a:szhe:szhe:*:*:*:*:*:*:*:*
        words:
          - 'You should be redirected automatically to target URL: <a href="/">/</a>'

      - type: word
        name: szhe-2
        cpe: cpe:2.3:a:szhe:szhe:*:*:*:*:*:*:*:*
        words:
          - 'Set-Cookie: session'
        part: header

      - type: status
        status:
          - 302
