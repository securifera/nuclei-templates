id: ibm-dcbc-default-login

info:
  name: IBM Decision Center Business Console - Default Login
  author: DhiyaneshDK
  severity: high
  reference:
    - https://www.ibm.com/docs/en/odm/8.0.1?topic=users-tutorial-getting-started-decision-center-business-console
  classification:
    cpe: cpe:2.3:a:ibm:ibm:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "title=\"Decision Center | Business Console\""
    vendor: ibm
    product: ibm
  tags: ibm,default-login,decision-center,vuln

http:
  - raw:
      - |
        POST /decisioncenter/j_security_check HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        j_username={{username}}&j_password={{password}}

    host-redirects: true
    max-redirects: 3

    attack: pitchfork
    payloads:
      username:
        - odmAdmin
      password:
        - odmAdmin

    matchers-condition: and
    matchers:
      - type: word
        name: ibm
        cpe: cpe:2.3:a:ibm:ibm:*:*:*:*:*:*:*:*
        part: body
        words:
          - "userName: 'odmAdmin'"
          - "Log out"
        condition: and

      - type: status
        status:
          - 200
