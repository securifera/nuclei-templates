id: rabbitmq-default-login

info:
  name: RabbitMQ Default Login
  author: fyoorer,dwisiswant0
  severity: high
  description: RabbitMQ default admin credentials were discovered.
  reference:
    - https://onlinehelp.coveo.com/en/ces/7.0/administrator/changing_the_rabbitmq_administrator_password.htm
  classification:
    cpe: cpe:2.3:a:rabbitmq:rabbitmq:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
    vendor: rabbitmq
    product: rabbitmq
  tags: rabbitmq,default-login,vuln

http:
  - raw:
      - |
        GET /api/whoami HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Authorization: Basic {{base64(username + ':' + password)}}

    payloads:
      username:
        - guest
      password:
        - guest
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        name: rabbitmq
        cpe: cpe:2.3:a:rabbitmq:rabbitmq:*:*:*:*:*:*:*:*
        words:
          - "application/json"
        part: header

      - type: word
        name: rabbitmq-2
        cpe: cpe:2.3:a:rabbitmq:rabbitmq:*:*:*:*:*:*:*:*
        words:
          - "{\"name\":\"guest\""
        part: body

      - type: status
        status:
          - 200
