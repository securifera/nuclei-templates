id: smartsense-default-login

info:
  name: HortonWorks SmartSense Default Login
  author: Techryptic (@Tech)
  severity: high
  description: HortonWorks SmartSense default admin login information was detected.
  reference:
    - https://docs.cloudera.com/HDPDocuments/SS1/SmartSense-1.2.2/bk_smartsense_admin/content/manual_server_login.html
  classification:
    cpe: cpe:2.3:a:smartsense:smartsense:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
    vendor: smartsense
    product: smartsense
  tags: hortonworks,smartsense,default-login,vuln

http:
  - raw:
      - |
        GET /apt/v1/context HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    payloads:
      username:
        - admin
      password:
        - admin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        name: smartsense
        cpe: cpe:2.3:a:smartsense:smartsense:*:*:*:*:*:*:*:*
        words:
          - "Set-Cookie: SUPPORTSESSIONID"
        part: header

      - type: word
        name: smartsense-2
        cpe: cpe:2.3:a:smartsense:smartsense:*:*:*:*:*:*:*:*
        words:
          - "smartsenseId"

      - type: status
        status:
          - 200
