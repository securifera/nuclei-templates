id: telecom-gateway-default-login

info:
  name: Telecom Gateway - Default Admin Login
  author: ritikchaddha
  severity: high
  description: Telecom Gateway default admin login credentials were successful.
  classification:
    cpe: cpe:2.3:a:telecom:gateway:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: telecom
    product: gateway
  tags: default-login,telecom,gateway,vuln

http:
  - raw:
      - |
        POST /manager/login.php HTTP/1.1
        Host: {{Hostname}}

        Name={{username}}&Pass={{password}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: gateway
        cpe: cpe:2.3:a:telecom:gateway:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>电信网关服务器管理后台</title>"
          - "index-shang.php"
          - "di.php"
        condition: and

      - type: status
        status:
          - 200
