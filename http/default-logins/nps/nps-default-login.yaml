id: nps-default-login

info:
  name: NPS Default Login
  author: pikpikcu
  severity: high
  description: NPS default admin credentials were discovered.
  reference:
    - https://docs.microfocus.com/NNMi/10.30/Content/Administer/Hardening/confCC2b_pwd.htm
  classification:
    cpe: cpe:2.3:a:nps:nps:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
    vendor: nps
    product: nps
  tags: nps,default-login,vuln

http:
  - raw:
      - |
        POST /login/verify HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Referer: {{Hostname}}/login/index

        username={{username}}&password={{password}}

    payloads:
      username:
        - admin
      password:
        - 123
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        name: nps
        cpe: cpe:2.3:a:nps:nps:*:*:*:*:*:*:*:*
        words:
          - "application/json"
        part: header
        condition: and

      - type: word
        name: nps-2
        cpe: cpe:2.3:a:nps:nps:*:*:*:*:*:*:*:*
        words:
          - '"msg": "login success"'
          - '"status": 1'
        part: body
        condition: and

      - type: status
        status:
          - 200
