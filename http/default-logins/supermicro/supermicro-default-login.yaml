id: supermicro-default-login

info:
  name: Supermicro Ipmi - Default Admin Login
  author: For3stCo1d
  severity: high
  description: Supermicro Ipmi default admin login credentials were successful.
  reference:
    - https://www.gearprimer.com/wiki/supermicro-ipmi-default-username-pasword/
  classification:
    cpe: cpe:2.3:a:supermicro:supermicro:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: supermicro
    product: supermicro
  tags: supermicro,default-login,vuln

http:
  - raw:
      - |
        POST /cgi/login.cgi HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        name={{user}}&pwd={{pass}}

    attack: pitchfork
    payloads:
      user:
        - ADMIN
        - admin
      pass:
        - ADMIN
        - admin
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: supermicro
        cpe: cpe:2.3:a:supermicro:supermicro:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'self.location='
          - '/cgi/url_redirect.cgi?url_name=mainmenu'
        condition: and

      - type: status
        status:
          - 200
