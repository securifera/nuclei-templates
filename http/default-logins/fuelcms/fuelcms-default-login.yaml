id: fuelcms-default-login

info:
  name: Fuel CMS - Default Admin Discovery
  author: Adam Crosser
  severity: high
  description: Fuel CMS default admin credentials were discovered.
  reference:
    - https://docs.getfuelcms.com/general/security
  classification:
    cpe: cpe:2.3:a:fuelcms:fuelcms:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 2
    vendor: fuelcms
    product: fuelcms
  tags: fuelcms,default-login,oss,vuln

http:
  - raw:
      - |
        GET /fuel/login HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /fuel/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        user_name={{username}}&password={{password}}&Login=Login&forward=&ci_csrf_token_FUEL={{csrftoken}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        name: fuelcms
        cpe: cpe:2.3:a:fuelcms:fuelcms:*:*:*:*:*:*:*:*
        part: header
        words:
          - "/fuel/dashboard"

      - type: regex
        name: fuelcms-2
        cpe: cpe:2.3:a:fuelcms:fuelcms:*:*:*:*:*:*:*:*
        part: header
        regex:
          - 'fuel_(.*)='

      - type: status
        status:
          - 302

    extractors:
      - type: regex
        part: body
        name: csrftoken
        internal: true
        group: 1
        regex:
          - 'id="ci_csrf_token_FUEL" value="([0-9a-z]+)" \/>'
