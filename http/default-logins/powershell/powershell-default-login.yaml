id: powershell-default-login

info:
  name: PowerShell Universal - Default Login
  author: ap3r
  severity: high
  description: |
    PowerShell Universal default admin credentials were discovered.
  reference:
    - https://ironmansoftware.com/powershell-universal
  classification:
    cpe: cpe:2.3:a:powershell:powershell:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    shodan-query: "html:\"PowerShell Universal\""
    vendor: powershell
    product: powershell
  tags: default-login,powershell-universal,vuln

http:
  - raw:
      - |
        POST /api/v1/signin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}

    attack: clusterbomb
    payloads:
      username:
        - admin
      password:
        - admin
        - password
        - powershell

    host-redirects: true
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: powershell
        cpe: cpe:2.3:a:powershell:powershell:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'Set-Cookie'

      - type: word
        name: powershell-2
        cpe: cpe:2.3:a:powershell:powershell:*:*:*:*:*:*:*:*
        part: body
        words:
          - '{"returnUrl":"/admin"}'

      - type: word
        name: powershell-3
        cpe: cpe:2.3:a:powershell:powershell:*:*:*:*:*:*:*:*
        part: body
        words:
          - '{"errorMessage":"Bad username or password"}'
        negative: true
