id: empirec2-default-login

info:
  name: Empire C2 / Starkiller Interface - Default Login
  author: clem9669,parzival
  severity: high
  description: |
    Empire C2 / Starkiller Default Administrator Credentials Discovered.
  reference:
    - https://github.com/BC-SECURITY/Empire
    - https://github.com/BC-SECURITY/empire-docs/blob/main/restful-api/README.md
  classification:
    cpe: cpe:2.3:a:empirec2:empirec2:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: empirec2
    product: empirec2
  tags: default-login,empire,c2,intrusive,vuln

http:
  - raw:
      - |
        POST /token HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryoZwyedGcQU4FrcFV
        Accept: application/json, text/plain, */*

        ------WebKitFormBoundaryoZwyedGcQU4FrcFV
        Content-Disposition: form-data; name="username"

        {{username}}
        ------WebKitFormBoundaryoZwyedGcQU4FrcFV
        Content-Disposition: form-data; name="password"

        {{password}}
        ------WebKitFormBoundaryoZwyedGcQU4FrcFV--
      - |
        POST /api/admin/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{user}}","password":"{{pass}}"}

    attack: pitchfork
    payloads:
      username:
        - empireadmin
      password:
        - password123
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: empirec2
        cpe: cpe:2.3:a:empirec2:empirec2:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'access_token'
          - '{"token":".*"}'
        condition: or

      - type: word
        name: empirec2-2
        cpe: cpe:2.3:a:empirec2:empirec2:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"code":1001'
        negative: true

      - type: word
        name: empirec2-3
        cpe: cpe:2.3:a:empirec2:empirec2:*:*:*:*:*:*:*:*
        part: content_type
        words:
          - application/json

      - type: status
        status:
          - 200
