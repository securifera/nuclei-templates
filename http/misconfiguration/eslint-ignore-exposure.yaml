id: eslint-ignore-exposure

info:
  name: Eslint Ignore File Exposure
  author: DhiyaneshDk
  severity: low
  description: |
    Eslint Ignore File was exposed.
  reference:
    - https://eslint.org/docs/latest/use/configure/ignore
  classification:
    cpe: cpe:2.3:a:eslint-ignore:eslint-ignore:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: html:"eslintignore"
    vendor: eslint-ignore
    product: eslint-ignore
  tags: eslintignore,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.eslintignore"

    matchers-condition: and
    matchers:
      - type: word
        name: eslint-ignore
        cpe: cpe:2.3:a:eslint-ignore:eslint-ignore:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'xtscancodes.js'

      - type: word
        name: eslint-ignore-2
        cpe: cpe:2.3:a:eslint-ignore:eslint-ignore:*:*:*:*:*:*:*:*
        part: content_type
        words:
          - "application/octet-stream"

      - type: status
        status:
          - 200
