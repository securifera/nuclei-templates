id: exposed-nomad

info:
  name: Nomad - Exposed Jobs
  author: pdteam
  severity: medium
  description: Nomad jobs were discovered.
  reference:
    - https://www.nomadproject.io/docs/internals/security
  classification:
    cpe: cpe:2.3:a:nomad:nomad:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: nomad
    product: nomad
  tags: nomad,devops,hashicorp,panel,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/jobs"

    matchers-condition: and
    matchers:
      - type: word
        name: nomad
        cpe: cpe:2.3:a:nomad:nomad:*:*:*:*:*:*:*:*
        words:
          - "Nomad"
          - "nomad-ui"
        condition: and

      - type: word
        name: nomad-2
        cpe: cpe:2.3:a:nomad:nomad:*:*:*:*:*:*:*:*
        words:
          - "text/html"
        part: header

      - type: status
        status:
          - 200
