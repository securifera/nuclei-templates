id: linktap-gateway-exposure

info:
  name: LinkTap Gateway Exposure
  author: DhiyaneshDk
  severity: low
  description: LinkTap Gateway is exposed.
  classification:
    cpe: cpe:2.3:a:linktap:linktap:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"LinkTap Gateway"
    vendor: linktap
    product: linktap
  tags: misconfig,linktap,iot,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: linktap
        cpe: cpe:2.3:a:linktap:linktap:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Device infomation'
          - 'Ethernet settings'
        condition: and

      - type: status
        status:
          - 200
