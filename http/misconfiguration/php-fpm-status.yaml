id: php-fpm-status

info:
  name: PHP-FPM Status
  author: geeknik
  severity: unknown
  classification:
    cpe: cpe:2.3:a:php-fpm:php-fpm:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: php-fpm
    product: php-fpm
  tags: config,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/status?full"

    matchers-condition: and
    matchers:
      - type: word
        name: php-fpm
        cpe: cpe:2.3:a:php-fpm:php-fpm:*:*:*:*:*:*:*:*
        words:
          - 'pool:'
          - 'process manager:'
          - 'start time:'
          - 'pid:'
        condition: and

      - type: status
        status:
          - 200
