id: bravia-signage

info:
  name: BRAVIA Signage - Exposure
  author: DhiyaneshDK
  severity: medium
  description: Bravia Signage is exposed.
  reference:
    - https://twitter.com/WhiteOakSec/status/1667197552461004800
    - https://www.whiteoaksecurity.com/blog/sony-bravia-remote-code-execution-disclosure/
  classification:
    cpe: cpe:2.3:a:bravia:bravia:*:*:*:*:*:*:*:*
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: title:"BRAVIA Signage"
    vendor: bravia
    product: bravia
  tags: misconfig,exposure,bravia,sony,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/#/settings"

    matchers-condition: and
    matchers:
      - type: word
        name: bravia
        cpe: cpe:2.3:a:bravia:bravia:*:*:*:*:*:*:*:*
        part: body
        words:
          - "BRAVIA Signage"

      - type: status
        status:
          - 200
