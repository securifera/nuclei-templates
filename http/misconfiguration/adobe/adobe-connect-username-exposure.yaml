id: adobe-connect-username-exposure

info:
  name: Adobe Connect Username Exposure
  author: dhiyaneshDk
  severity: low
  description: Adobe Connect Username is exposed.
  reference:
    - https://packetstormsecurity.com/files/161345/Adobe-Connect-10-Username-Disclosure.html
  classification:
    cpe: cpe:2.3:a:adobe:adobe:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: adobe
    product: adobe
  tags: adobe,disclosure,packetstorm,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/system/help/support"

    matchers-condition: and
    matchers:
      - type: word
        name: adobe
        cpe: cpe:2.3:a:adobe:adobe:*:*:*:*:*:*:*:*
        words:
          - 'Administrators name:'
          - 'Support Administrators email address:'
        part: body
        condition: and

      - type: status
        status:
          - 200
