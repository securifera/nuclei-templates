id: adobe-connect-version

info:
  name: Adobe Connect Central Version
  author: dhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:adobe:adobe:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: adobe
    product: adobe
  tags: adobe,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/version.txt"

    matchers-condition: and
    matchers:
      - type: word
        name: adobe
        cpe: cpe:2.3:a:adobe:adobe:*:*:*:*:*:*:*:*
        words:
          - 'package='
        part: body

      - type: word
        name: adobe-2
        cpe: cpe:2.3:a:adobe:adobe:*:*:*:*:*:*:*:*
        words:
          - 'text/plain'
        part: header

      - type: status
        status:
          - 200
