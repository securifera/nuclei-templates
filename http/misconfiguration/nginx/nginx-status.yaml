id: nginx-status

info:
  name: Nginx Status Page
  author: dhiyaneshDK
  severity: info
  classification:
    cpe: cpe:2.3:a:nginx:nginx:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: nginx
    product: nginx
  tags: misconfig,nginx,status,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/nginx_status"
      - "{{BaseURL}}/nginx-status"

    matchers-condition: and
    matchers:
      - type: word
        name: nginx
        cpe: cpe:2.3:a:nginx:nginx:*:*:*:*:*:*:*:*
        words:
          - 'Active connections:'

      - type: status
        status:
          - 200
