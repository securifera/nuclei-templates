id: unauth-cluster-trino

info:
  name: Cluster Overview - Unauthenticated Dashboard Exposure
  author: tess
  severity: medium
  description: Cluster Overview dashboard is exposed.
  classification:
    cpe: cpe:2.3:a:cluster:cluster:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Cluster Overview - Trino"
    vendor: cluster
    product: cluster
  tags: cluster,unauth,trino,misconfig,vuln

http:
  - method: POST
    path:
      - "{{BaseURL}}/ui/login"

    headers:
      Content-Type: application/x-www-form-urlencoded

    body: |
      username={{randstr}}&password=&redirectPath=
    redirects: true

    matchers-condition: and
    matchers:
      - type: word
        name: cluster
        cpe: cpe:2.3:a:cluster:cluster:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Cluster Overview'
          - 'Query Details'
        condition: and

      - type: status
        status:
          - 200
