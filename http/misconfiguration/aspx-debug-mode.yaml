id: aspx-debug-mode

info:
  name: ASP.NET Debugging Enabled
  author: dhiyaneshDk
  severity: info
  reference:
    - https://portswigger.net/kb/issues/00100800_asp-net-debugging-enabled
  classification:
    cpe: cpe:2.3:a:aspx:aspx:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: aspx
    product: aspx
  tags: debug,misconfig,vuln

http:
  - raw:
      - |
        DEBUG /Foobar-debug.aspx HTTP/1.1
        Host: {{Hostname}}
        Command: stop-debug
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Content-Length: 2

    matchers:
      - type: dsl
        name: aspx
        cpe: cpe:2.3:a:aspx:aspx:*:*:*:*:*:*:*:*
        dsl:
          - 'len(body) == 2'
          - 'regex("^OK$", body)'
          - 'status_code == 200'
        condition: and
