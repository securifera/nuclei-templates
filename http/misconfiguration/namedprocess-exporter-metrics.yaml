id: namedprocess-exporter-metrics

info:
  name: Named Process Exporter
  author: DhiyaneshDk
  severity: low
  description: Named process exporter is exposed.
  classification:
    cpe: cpe:2.3:a:namedprocess:namedprocess:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Named Process Exporter"
    vendor: namedprocess
    product: namedprocess
  tags: namedprocess,exposure,debug,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/metrics"

    matchers-condition: and
    matchers:
      - type: word
        name: namedprocess
        cpe: cpe:2.3:a:namedprocess:namedprocess:*:*:*:*:*:*:*:*
        part: body
        words:
          - "namedprocess"
          - "# HELP"
        condition: and

      - type: status
        status:
          - 200
