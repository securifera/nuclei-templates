id: confluence-dashboard

info:
  name: Confluence Dashboard Exposed
  author: tess
  severity: low
  description: Confluence Dashboard is exposed.
  classification:
    cpe: cpe:2.3:a:confluence:confluence:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Dashboard - Confluence"
    vendor: confluence
    product: confluence
  tags: misconfig,exposure,confluence,atlassian,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: confluence
        cpe: cpe:2.3:a:confluence:confluence:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Dashboard - Confluence'
          - 'title="Spaces">'
          - 'Atlassian Confluence'
        condition: and

      - type: word
        name: confluence-2
        cpe: cpe:2.3:a:confluence:confluence:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
