id: buildpath-file-disclosure

info:
  name: .buildpath - File Disclosure
  author: ritikchaddha
  severity: low
  classification:
    cpe: cpe:2.3:a:buildpath:buildpath:*:*:*:*:*:*:*:*
  description: |
    Publicly accessible /.buildpath configuration file was detected, which may expose project structure or sensitive information.
  metadata:
    vendor: buildpath
    product: buildpath
  tags: exposure,files,buildpath,config

http:
  - method: GET
    path:
      - "{{BaseURL}}/.buildpath"

    matchers-condition: and
    matchers:
      - type: word
        name: buildpath
        cpe: cpe:2.3:a:buildpath:buildpath:*:*:*:*:*:*:*:*
        part: body
        words:
          - "</buildpath>"
          - "<?xml"
        condition: and

      - type: status
        status:
          - 200
