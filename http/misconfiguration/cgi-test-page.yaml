id: cgi-test-page

info:
  name: CGI Test page
  author: YASH ANAND @yashanand155
  severity: info
  classification:
    cpe: cpe:2.3:a:cgi:cgi:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: cgi
    product: cgi
  tags: cgi,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/test/test.cgi"

    matchers-condition: and
    matchers:
      - type: word
        name: cgi
        cpe: cpe:2.3:a:cgi:cgi:*:*:*:*:*:*:*:*
        words:
          - HTTP_ACCEPT
          - HTTP_ACCEPT_ENCODING
        condition: and

      - type: status
        status:
          - 200
