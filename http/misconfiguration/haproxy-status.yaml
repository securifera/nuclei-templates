id: haproxy-status

info:
  name: HAProxy Statistics Page - Detect
  author: dhiyaneshDK
  severity: medium
  description: HAProxy statistics page was detected.
  reference:
    - https://www.exploit-db.com/ghdb/4191
  classification:
    cpe: cpe:2.3:a:haproxy:haproxy:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 2
    vendor: haproxy
    product: haproxy
  tags: logs,haproxy,edb,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/haproxy-status"
      - "{{BaseURL}}/haproxy?stats"

    matchers-condition: and
    matchers:
      - type: word
        name: haproxy
        cpe: cpe:2.3:a:haproxy:haproxy:*:*:*:*:*:*:*:*
        words:
          - 'Statistics Report for HAProxy'

      - type: status
        status:
          - 200
