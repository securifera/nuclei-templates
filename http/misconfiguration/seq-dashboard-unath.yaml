id: seq-dashboard-unauth

info:
  name: Seq Dashboard - Unauthenticated
  author: DhiyaneshDK
  severity: high
  description: |
    Seq is exposed without authentication
  classification:
    cpe: cpe:2.3:a:seq:seq:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Seq"
    vendor: seq
    product: seq
  tags: misconfig,exposure,seq,dashboard,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/#/dashboards"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: seq
        cpe: cpe:2.3:a:seq:seq:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Log out'
          - 'dashboards</a>'
        condition: and

      - type: status
        status:
          - 200
