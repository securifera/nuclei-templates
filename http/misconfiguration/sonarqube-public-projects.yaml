id: sonarqube-public-projects

info:
  name: Sonarqube with public projects
  author: sickwell
  severity: low
  description: Sonarqube public projects detected.
  reference:
    - https://next.sonarqube.com/sonarqube/web_api/api/components/suggestions?internal=true
  classification:
    cpe: cpe:2.3:a:sonarqube:sonarqube:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sonarqube
    product: sonarqube
  tags: sonarqube,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/components/suggestions?recentlyBrowsed="

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: sonarqube
        cpe: cpe:2.3:a:sonarqube:sonarqube:*:*:*:*:*:*:*:*
        words:
          - '"results":'
          - '"items":'
          - '"more":'
        part: body
        condition: and
