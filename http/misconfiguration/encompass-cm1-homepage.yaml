id: encompass-cm1-homepage

info:
  name: Encompass CM1 Home Page - Detect
  author: tess
  severity: info
  description: Encompass CM1 home page was detected.
  classification:
    cpe: cpe:2.3:a:encompass:encompass:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Encompass CM1 Home Page"
    vendor: encompass
    product: encompass
  tags: misconfig,encompass,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: encompass
        cpe: cpe:2.3:a:encompass:encompass:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Encompass CM1 Home Page"
          - "DIAGNOSTIC LINKS:"
        condition: and

      - type: word
        name: encompass-2
        cpe: cpe:2.3:a:encompass:encompass:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
