id: laravel-horizon-unauth

info:
  name: Laravel Horizon Dashboard - Unauthenticated
  author: vagnerd
  severity: medium
  description: |
    Laravel Horizon Dashboard unauthenticated was detected.
  remediation: |
    - Configure Authentication in Laravel Horizon.
  reference:
    - https://github.com/laravel/horizon
    - https://laravel.com/docs/10.x/horizon#dashboard-authorization
  classification:
    cpe: cpe:2.3:a:laravel:laravel:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:450899026
    vendor: laravel
    product: laravel
  tags: laravel,unauth,dashboard,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/stats"
      - "{{BaseURL}}/horizon/api/stats"

    matchers-condition: and
    matchers:
      - type: word
        name: laravel
        cpe: cpe:2.3:a:laravel:laravel:*:*:*:*:*:*:*:*
        part: body
        words:
          - "queueWithMaxRuntime"
          - "recentJobs"
          - "status"
        condition: and

      - type: word
        name: laravel-2
        cpe: cpe:2.3:a:laravel:laravel:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
