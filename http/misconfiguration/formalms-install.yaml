id: formalms-install

info:
  name: Formalms Exposed Installation
  author: princechaddha
  severity: high
  description: Formalms Installation is exposed.
  classification:
    cpe: cpe:2.3:a:formalms:formalms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: formalms
    product: formalms
  tags: misconfig,formalms,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/install/'

    matchers-condition: and
    matchers:
      - type: word
        name: formalms
        cpe: cpe:2.3:a:formalms:formalms:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>forma.lms installer</title>'
          - '<h1>forma.lms - Installation</h1>'
        condition: and

      - type: status
        status:
          - 200
