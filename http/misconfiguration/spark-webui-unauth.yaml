id: spark-webui-unauth

info:
  name: Unauthenticated Spark WebUI
  author: princechaddha
  severity: medium
  description: Spark WebUI is exposed to external users without any authentication.
  reference:
    - https://github.com/vulhub/vulhub/tree/master/spark/unacc
  classification:
    cpe: cpe:2.3:a:spark:spark:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: spark
    product: spark
  tags: unauth,vulhub,spark,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: spark
        cpe: cpe:2.3:a:spark:spark:*:*:*:*:*:*:*:*
        words:
          - "<title>Spark Master at spark://"
          - "<strong>URL:</strong>"
        part: body
        condition: and
