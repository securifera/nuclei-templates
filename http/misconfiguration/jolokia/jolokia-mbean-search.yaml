id: jolokia-mbean-search

info:
  name: Jolokia - Searching MBeans
  author: pussycat0x
  severity: low
  description: Unauth users can search Mbeans in Jolokia.
  reference:
    - https://thinkloveshare.com/hacking/ssrf_to_rce_with_jolokia_and_mbeans/
    - https://github.com/laluka/jolokia-exploitation-toolkit
  classification:
    cpe: cpe:2.3:a:jolokia:jolokia:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: jolokia
    product: jolokia
  tags: jolokia,springboot,mbean,tomcat,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/jolokia/search/*:test=test"
      - "{{BaseURL}}/actuator/jolokia/search/*:test=test"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: jolokia
        cpe: cpe:2.3:a:jolokia:jolokia:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"type":"search"'
          - '"value":'
        condition: and
