id: v2x-control

info:
  name: V2X Control - Dashboard Exposure
  author: DhiyaneshDk
  severity: low
  description: V2X Control Dashboard is exposed.
  reference:
    - https://www.facebook.com/photo/?fbid=606940284809828&set=a.467014098802448
  classification:
    cpe: cpe:2.3:a:v2x:control:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"V2X Control"
    vendor: v2x
    product: control
  tags: misconfig,exposure,v2x,control,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: control
        cpe: cpe:2.3:a:v2x:control:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>V2X control</title>'
          - 'Chemtronics'
        condition: and

      - type: status
        status:
          - 200
