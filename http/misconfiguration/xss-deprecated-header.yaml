id: xss-deprecated-header

info:
  name: XSS-Protection Header - Cross-Site Scripting
  author: joshlarsen
  severity: info
  description: Setting the XSS-Protection header is deprecated. Setting the header to anything other than `0` can actually introduce an XSS vulnerability.
  reference:
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
    - https://owasp.org/www-project-secure-headers/#x-xss-protection
  classification:
    cpe: cpe:2.3:a:xss-deprecated-header:xss-deprecated-header:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-79
  metadata:
    max-request: 1
    vendor: xss-deprecated-header
    product: xss-deprecated-header
  tags: xss,misconfig,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        name: xss-deprecated-header
        cpe: cpe:2.3:a:xss-deprecated-header:xss-deprecated-header:*:*:*:*:*:*:*:*
        part: header
        regex:
          - "(?i)x-xss-protection: 0"
        negative: true

      - type: regex
        name: xss-deprecated-header-2
        cpe: cpe:2.3:a:xss-deprecated-header:xss-deprecated-header:*:*:*:*:*:*:*:*
        part: header
        regex:
          - "(?i)x-xss-protection: 1+"

    extractors:
      - type: kval
        part: header
        kval:
          - x_xss_protection
