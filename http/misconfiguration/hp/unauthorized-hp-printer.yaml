id: unauthorized-hp-printer

info:
  name: Unauthorized HP Printer
  author: pussycat0x
  severity: high
  description: HP Printer is exposed.
  classification:
    cpe: cpe:2.3:a:unauthorized-hp-printer:unauthorized-hp-printer:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: unauthorized-hp-printer
    product: unauthorized-hp-printer
  tags: hp,iot,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/SSI/Auth/ip_snmp.htm"

    matchers-condition: and
    matchers:
      - type: word
        name: unauthorized-hp-printer
        cpe: cpe:2.3:a:unauthorized-hp-printer:unauthorized-hp-printer:*:*:*:*:*:*:*:*
        words:
          - "HP"
          - "<h1>SNMP</h1>"
        condition: and

      - type: status
        status:
          - 200
