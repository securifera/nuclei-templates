id: healthchecks-ui-exposure

info:
  name: Healthchecks UI Exposure
  author: tess
  severity: low
  description: Healthchecks UI is exposed.
  classification:
    cpe: cpe:2.3:a:healthchecks:healthchecks:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Health Checks UI"
    vendor: healthchecks
    product: healthchecks
  tags: misconfig,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        name: healthchecks
        cpe: cpe:2.3:a:healthchecks:healthchecks:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Health Checks UI'
          - 'var webhookEndpoint'
        condition: and

      - type: status
        status:
          - 200
