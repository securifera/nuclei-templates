id: aem-querybuilder-feed-servlet

info:
  name: AEM QueryBuilder Feed Servlet
  author: DhiyaneshDk
  severity: info
  reference:
    - https://helpx.adobe.com/experience-manager/6-3/sites/developing/using/querybuilder-predicate-reference.html
  classification:
    cpe: cpe:2.3:a:aem:aem:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.component:"Adobe Experience Manager"
    vendor: aem
    product: aem
  tags: aem,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/bin/querybuilder.feed'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: aem
        cpe: cpe:2.3:a:aem:aem:*:*:*:*:*:*:*:*
        words:
          - 'CQ Feed'
