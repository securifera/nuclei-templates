id: crxde-lite

info:
  name: CRXDE Lite - Exposure
  author: nadino
  severity: low
  description: |
    CRXDE Lite exposure was detected.
  reference:
    - https://github.com/Az0x7/vulnerability-Checklist/blob/main/Aem%20misconfiguration/aem.md
  classification:
    cpe: cpe:2.3:a:crxde:crxde:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    vendor: crxde
    product: crxde
  tags: aem,crxde,exposure,adobe,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/crx/de/index.jsp"

    matchers:
      - type: word
        name: crxde
        cpe: cpe:2.3:a:crxde:crxde:*:*:*:*:*:*:*:*
        words:
          - "<title>CRXDE Lite</title>"
