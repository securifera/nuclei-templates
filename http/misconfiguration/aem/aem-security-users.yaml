id: aem-security-users

info:
  name: Adobe AEM Security Users Exposure
  author: dhiyaneshDk
  severity: medium
  description: Adobe AEM Security Users are exposed.
  reference:
    - https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/aem2.txt
  classification:
    cpe: cpe:2.3:a:aem:aem:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query:
      - http.title:"AEM Sign In"
      - http.component:"Adobe Experience Manager"
    vendor: aem
    product: aem
  tags: misconfig,aem,adobe,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/libs/granite/security/content/useradmin.html"

    matchers-condition: and
    matchers:
      - type: word
        name: aem
        cpe: cpe:2.3:a:aem:aem:*:*:*:*:*:*:*:*
        words:
          - 'AEM Security | Users'
          - 'trackingelement="create user"'
        condition: and

      - type: word
        name: aem-2
        cpe: cpe:2.3:a:aem:aem:*:*:*:*:*:*:*:*
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
