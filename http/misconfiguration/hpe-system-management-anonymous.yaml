id: hpe-system-management-anonymous-access

info:
  name: HPE System Management Anonymous Access
  author: divya_mudgal
  severity: low
  description: HPE system management anonymous access is enabled.
  classification:
    cpe: cpe:2.3:a:hpe-system-management-anonymous:hpe-system-management-anonymous:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: hpe-system-management-anonymous
    product: hpe-system-management-anonymous
  tags: hp,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/chpstrt.php?chppath=Home"

    matchers-condition: and
    matchers:
      - type: word
        name: hpe-system-management-anonymous
        cpe: cpe:2.3:a:hpe-system-management-anonymous:hpe-system-management-anonymous:*:*:*:*:*:*:*:*
        condition: and
        words:
          - "username = \"hpsmh_anonymous\";"
          - "var host_addr = '"
          - "var ip_addr   = '"
