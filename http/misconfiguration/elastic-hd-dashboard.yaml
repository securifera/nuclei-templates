id: elastic-hd-dashboard

info:
  name: Elastic HD Dashboard Exposure
  author: tess
  severity: low
  description: Elastic HD Dashboard is exposed.
  classification:
    cpe: cpe:2.3:a:elastic:elastic:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Elastic HD Dashboard"
    vendor: elastic
    product: elastic
  tags: misconfig,exposure,elastic,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: elastic
        cpe: cpe:2.3:a:elastic:elastic:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Elastic HD Dashboard"
          - "elasticsearch go Edition head plugin"
        condition: and

      - type: word
        name: elastic-2
        cpe: cpe:2.3:a:elastic:elastic:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
