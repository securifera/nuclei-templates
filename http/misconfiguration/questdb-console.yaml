id: questdb-console

info:
  name: QuestDB Console - Detect
  author: tess
  severity: medium
  description: QuestDB console was detected.
  reference:
    - https://questdb.io/docs/develop/web-console/
  classification:
    cpe: cpe:2.3:a:questdb:questdb:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"QuestDB · Console"
    vendor: questdb
    product: questdb
  tags: misconfig,questdb,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: questdb
        cpe: cpe:2.3:a:questdb:questdb:*:*:*:*:*:*:*:*
        part: body
        words:
          - "QuestDB · Console"
          - "Server rejected file due to unsupported file format."
        condition: and

      - type: word
        name: questdb-2
        cpe: cpe:2.3:a:questdb:questdb:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
