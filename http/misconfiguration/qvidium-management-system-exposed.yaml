id: qvidium-management-system-exposed

info:
  name: QVidium Management System Exposed
  author: tess
  severity: medium
  description: QVidium Management System is Exposed.
  classification:
    cpe: cpe:2.3:a:qvidium:qvidium:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"QVidium Management"
    vendor: qvidium
    product: qvidium
  tags: misconfig,qvidium,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: qvidium
        cpe: cpe:2.3:a:qvidium:qvidium:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'QVidium Management'
          - 'src="/cgi-bin/banner.cgi'
        condition: and

      - type: word
        name: qvidium-2
        cpe: cpe:2.3:a:qvidium:qvidium:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
