id: pa11y-dashboard

info:
  name: Pa11y Dashboard Exposure
  author: tess
  severity: low
  description: Pa11y Dashboard is exposed.
  classification:
    cpe: cpe:2.3:a:pa11y:pa11y:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Pa11y Dashboard"
    vendor: pa11y
    product: pa11y
  tags: misconfig,exposure,pa11y,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: pa11y
        cpe: cpe:2.3:a:pa11y:pa11y:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Pa11y Dashboard"
          - "Add new URL"
        condition: and

      - type: word
        name: pa11y-2
        cpe: cpe:2.3:a:pa11y:pa11y:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
