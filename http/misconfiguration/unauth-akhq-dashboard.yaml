id: unauth-akhq-dashboard

info:
  name: AKHQ Dashboard - Unauthenticated Access
  author: DhiyaneshDk
  severity: high
  description: |
    AKHQ Dashboard was detected and appeared to be accessible without authentication.
  classification:
    cpe: cpe:2.3:a:akhq:akhq:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: akhq
    product: akhq
  tags: akhq,misconfig,unauth,dashboard,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/me"

    matchers:
      - type: dsl
        name: akhq
        cpe: cpe:2.3:a:akhq:akhq:*:*:*:*:*:*:*:*
        dsl:
          - 'contains_all(body, "\"resources\":", "\"actions\":", "\"patterns\":", "\"clusters\":")'
          - 'status_code == 200'
        condition: and
