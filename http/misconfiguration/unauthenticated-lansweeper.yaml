id: unauthenticated-lansweeper

info:
  name: Unauthenticated Lansweeper Instance
  author: divya_mudgal
  severity: high
  description: Lansweeper Instance is exposed.
  classification:
    cpe: cpe:2.3:a:lansweeper:lansweeper:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: lansweeper
    product: lansweeper
  tags: lansweeper,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Default.aspx"

    matchers:
      - type: word
        name: lansweeper
        cpe: cpe:2.3:a:lansweeper:lansweeper:*:*:*:*:*:*:*:*
        words:
          - "Main page - Lansweeper"
