id: coolify-register-account

info:
  name: Coolify Register User Account - Enabled
  author: DhiyaneshDk
  severity: medium
  description: |
    Exposed Coolify user register page.
  classification:
    cpe: cpe:2.3:a:register:register:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Coolify" html:"register"
    vendor: register
    product: register
  tags: coolify,register,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/register"

    matchers-condition: and
    matchers:
      - type: word
        name: register
        cpe: cpe:2.3:a:register:register:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Password again'
          - 'Coolify'
        condition: and

      - type: status
        status:
          - 200
