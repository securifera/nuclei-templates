id: cadvisor-exposure

info:
  name: cAdvisor - Detect
  author: DhiyaneshDk
  severity: medium
  description: cAdvisor page was detected.
  classification:
    cpe: cpe:2.3:a:cadvisor:cadvisor:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"cAdvisor"
    vendor: cadvisor
    product: cadvisor
  tags: exposure,misconfig,dashboard,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/containers/'

    matchers-condition: and
    matchers:
      - type: word
        name: cadvisor
        cpe: cpe:2.3:a:cadvisor:cadvisor:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>cAdvisor - /</title>"

      - type: word
        name: cadvisor-2
        cpe: cpe:2.3:a:cadvisor:cadvisor:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
