id: alibaba-mongoshake-unauth

info:
  name: Alibaba Mongoshake Unauth
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:mongoshake:mongoshake:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: mongoshake
    product: mongoshake
  tags: mongoshake,unauth,alibaba,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/'

    matchers-condition: and
    matchers:
      - type: word
        name: mongoshake
        cpe: cpe:2.3:a:mongoshake:mongoshake:*:*:*:*:*:*:*:*
        words:
          - '{"Uri":"/worker","Method":"GET"}'

      - type: word
        name: mongoshake-2
        cpe: cpe:2.3:a:mongoshake:mongoshake:*:*:*:*:*:*:*:*
        words:
          - 'text/plain'
        part: header

      - type: status
        status:
          - 200
