id: readarr-dashboard-unauth

info:
  name: Readarr Dashboard - Unauthenticated
  author: ProjectDiscoveryAI
  severity: medium
  description: |
    Exposure of Readarr dashboard which can lead to sensitive information disclosure.
  classification:
    cpe: cpe:2.3:a:readarr:readarr:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"readarr"
    vendor: readarr
    product: readarr
  tags: readarr,dashboard,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: readarr
        cpe: cpe:2.3:a:readarr:readarr:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Readarr</title>"

      - type: word
        name: readarr-2
        cpe: cpe:2.3:a:readarr:readarr:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Login - Readarr"
        negative: true

      - type: status
        status:
          - 200
