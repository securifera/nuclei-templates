id: druid-monitor

info:
  name: Alibaba Druid Monitor Unauthorized Access
  author: ohlinge
  severity: high
  description: Alibaba Druid Monitor is exposed.
  classification:
    cpe: cpe:2.3:a:druid:druid:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: druid
    product: druid
  tags: druid,alibaba,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/druid/index.html"

    matchers-condition: and
    matchers:
      - type: word
        name: druid
        cpe: cpe:2.3:a:druid:druid:*:*:*:*:*:*:*:*
        words:
          - 'Druid Stat Index</title>'

      - type: status
        status:
          - 200
