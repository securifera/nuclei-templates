id: exposed-kafdrop

info:
  name: Publicly exposed Kafdrop Interface
  author: dhiyaneshDk
  severity: low
  description: Publicly Kafdrop Interface is exposed.
  classification:
    cpe: cpe:2.3:a:kafdrop:kafdrop:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kafdrop
    product: kafdrop
  tags: exposure,misconfig,kafdrop,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        name: kafdrop
        cpe: cpe:2.3:a:kafdrop:kafdrop:*:*:*:*:*:*:*:*
        words:
          - "<title>Kafdrop: Broker List</title>"
          - "Kafka Cluster Overview"
        condition: and
