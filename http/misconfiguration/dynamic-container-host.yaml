id: dynamic-container-host

info:
  name: Dynamics Container Host - Detect
  author: DhiyaneshDk
  severity: low
  description: Dynamics Container Host is detected in this template.
  reference:
    - https://www.facebook.com/photo/?fbid=631801132323743&set=pcb.631801782323678
  classification:
    cpe: cpe:2.3:a:container:container:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Dynamics Container Host"
    vendor: container
    product: container
  tags: exposure,dynamic,container,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: container
        cpe: cpe:2.3:a:container:container:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Dynamics Container Host</title>'

      - type: status
        status:
          - 200
