id: artifactory-anonymous-deploy

info:
  name: Artifactory anonymous deploy
  author: panch0r3d
  severity: high
  description: Artifactory anonymous repo is exposed.
  reference:
    - https://www.errno.fr/artifactory/Attacking_Artifactory.html
  classification:
    cpe: cpe:2.3:a:artifactory:artifactory:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: artifactory
    product: artifactory
  tags: artifactory,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/artifactory/ui/repodata?deploy=true"

    matchers-condition: and
    matchers:
      - type: word
        name: artifactory
        cpe: cpe:2.3:a:artifactory:artifactory:*:*:*:*:*:*:*:*
        words:
          - '"repoKey"'
        part: body

      - type: status
        status:
          - 200

      - type: word
        name: artifactory-2
        cpe: cpe:2.3:a:artifactory:artifactory:*:*:*:*:*:*:*:*
        words:
          - "application/json"
        part: header
