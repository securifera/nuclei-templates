id: apcu-service

info:
  name: APCu service information leakage
  author: koti2
  severity: low
  description: APCu service is vulnerable to information leakage.
  classification:
    cpe: cpe:2.3:a:apc:apc:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: apc
    product: apc
  tags: config,service,apcu,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/apc/apc.php"
      - "{{BaseURL}}/apc.php"

    stop-at-first-match: true
    matchers:
      - type: word
        name: apc
        cpe: cpe:2.3:a:apc:apc:*:*:*:*:*:*:*:*
        words:
          - "APCu Version Information"
          - "General Cache Information"
          - "Detailed Memory Usage and Fragmentation"
        condition: or
