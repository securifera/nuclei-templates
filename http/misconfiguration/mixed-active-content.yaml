id: mixed-active-content

info:
  name: Mixed Active Content
  author: Liwermor
  severity: info
  description: |
    This check detects if there are any active content loaded over HTTP instead of HTTPS.
  reference:
    - https://developer.mozilla.org/en-US/docs/Web/Security/Mixed_content
    - https://portswigger.net/kb/issues/01000400_mixed-content
    - https://resources.infosecinstitute.com/topics/vulnerabilities/https-mixed-content-vulnerability/
    - https://docs.gitlab.com/ee/user/application_security/dast/checks/319.1.html
  classification:
    cpe: cpe:2.3:a:mixed-active-content:mixed-active-content:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: mixed-active-content
    product: mixed-active-content
  tags: misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    max-redirects: 0
    matchers:
      - type: regex
        name: mixed-active-content
        cpe: cpe:2.3:a:mixed-active-content:mixed-active-content:*:*:*:*:*:*:*:*
        part: body
        negative: true
        regex:
          - "(?mi)<!--\\[if (lt|lte) IE [0-9]*\\]>\\s*<script[^>]*\\ssrc=\"http://"

      - type: regex
        name: mixed-active-content-2
        cpe: cpe:2.3:a:mixed-active-content:mixed-active-content:*:*:*:*:*:*:*:*
        part: body
        negative: true
        regex:
          - "<!--\\s*<script"

      - type: regex
        name: mixed-active-content-3
        cpe: cpe:2.3:a:mixed-active-content:mixed-active-content:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "<script[^>]*src=['\"]http://[^'\">]+['\"]"
          - "<iframe[^>]*src=['\"]http://[^'\">]+['\"]"
          - "<object[^>]*data=['\"]http://[^'\">]+['\"]"

      - type: dsl
        name: mixed-active-content-4
        cpe: cpe:2.3:a:mixed-active-content:mixed-active-content:*:*:*:*:*:*:*:*
        dsl:
          - 'startswith(tostring(BaseURL), "https://")'

    extractors:
      - type: regex
        group: 1
        part: body
        regex:
          - "<script[^>]*src=['\"](http[^s'\">][^'\">]*)['\"]"
          - "<iframe[^>]*src=['\"](http[^s'\">][^'\">]*)['\"]"
          - "<object[^>]*data=['\"](http[^s'\">][^'\">]*)['\"]"
