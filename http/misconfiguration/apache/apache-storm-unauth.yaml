id: apache-storm-unauth

info:
  name: Apache Storm Unauth
  author: pikpikcu
  severity: medium
  description: Apache Storm instance is exposed.
  reference:
    - https://storm.apache.org/releases/current/STORM-UI-REST-API.html
  classification:
    cpe: cpe:2.3:a:apache:apache:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: apache
  tags: apache,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/api/v1/cluster/summary'

    matchers-condition: and
    matchers:
      - type: word
        name: apache
        cpe: cpe:2.3:a:apache:apache:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"totalMem":'
          - '"stormVersion":'
        condition: and

      - type: status
        status:
          - 200
