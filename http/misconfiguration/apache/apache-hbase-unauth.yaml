id: apache-hbase-unauth

info:
  name: Apache Hbase Unauth
  author: pikpikcu
  severity: medium
  description: Apache Hbase is exposed.
  classification:
    cpe: cpe:2.3:a:apache:apache:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: apache
  tags: apache,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/conf'

    matchers-condition: and
    matchers:
      - type: word
        name: apache
        cpe: cpe:2.3:a:apache:apache:*:*:*:*:*:*:*:*
        words:
          - '<name>hbase.defaults.for.version</name>'
          - '<source>hbase-default.xml</source>'

      - type: status
        status:
          - 200
