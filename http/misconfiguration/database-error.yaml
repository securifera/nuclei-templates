id: database-error

info:
  name: Database Error
  author: dhiyaneshDK
  severity: info
  classification:
    cpe: cpe:2.3:a:database:database:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Database Error"
    vendor: database
    product: database
  tags: misconfig,database,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: database
        cpe: cpe:2.3:a:database:database:*:*:*:*:*:*:*:*
        words:
          - '<title>Database Error</title>'

      - type: status
        status:
          - 500
