id: ntfy-web-exposure

info:
  name: NTFY Web - Exposure
  author: DhiyaneshDk
  severity: medium
  description: |
    Publicly exposed NTFY web interface allowing unauthorized publish or subscribe access.
  classification:
    cpe: cpe:2.3:a:ntfy:web:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"ntfy.sh"
    vendor: ntfy
    product: web
  tags: exposure,ntfy,web,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/settings"

    matchers-condition: and
    matchers:
      - type: word
        name: web
        cpe: cpe:2.3:a:ntfy:web:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>ntfy web</title>"

      - type: status
        status:
          - 200
