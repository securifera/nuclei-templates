id: express-stack-trace

info:
  name: Express Stack Trace
  author: DhiyaneshDk
  severity: low
  description: Express Stack trace is exposed.
  classification:
    cpe: cpe:2.3:a:express:express:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Welcome to Express"
    vendor: express
    product: express
  tags: misconfig,express,intrusive,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/{{randstr}}'

    matchers-condition: and
    matchers:
      - type: word
        name: express
        cpe: cpe:2.3:a:express:express:*:*:*:*:*:*:*:*
        part: body
        words:
          - "NotFoundError: Not Found"
          - "at Function.handle"
        condition: and

      - type: word
        name: express-2
        cpe: cpe:2.3:a:express:express:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 404
