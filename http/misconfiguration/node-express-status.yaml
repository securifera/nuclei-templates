id: node-express-status

info:
  name: Node Express Status - Detect
  author: DhiyaneshDk
  severity: low
  description: Node Express Status is detected.
  classification:
    cpe: cpe:2.3:a:node:express:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Express Status"
    fofa-query: title="Express Status"
    vendor: node
    product: express
  tags: node,express,misconfig,status,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: express
        cpe: cpe:2.3:a:node:express:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Express Status"
          - "CPU Usage"
        condition: and

      - type: status
        status:
          - 200
