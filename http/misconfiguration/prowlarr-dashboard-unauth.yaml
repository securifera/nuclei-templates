id: prowlarr-dashboard-unauth

info:
  name: Prowlarr Dashboard - Unauthenticated
  author: ProjectDiscoveryAI
  severity: medium
  description: |
    Exposure of Prowlarr dashboard which can lead to sensitive information disclosure.
  classification:
    cpe: cpe:2.3:a:prowlarr:prowlarr:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"<title>prowlarr</title>"
    vendor: prowlarr
    product: prowlarr
  tags: prowlarr,dashboard,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: prowlarr
        cpe: cpe:2.3:a:prowlarr:prowlarr:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Prowlarr</title>"

      - type: word
        name: prowlarr-2
        cpe: cpe:2.3:a:prowlarr:prowlarr:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Login - Prowlarr"
        negative: true

      - type: status
        status:
          - 200
