id: rekognition-image-validation

info:
  name: Rekognition Image Validation Debug UI Panel - Detect
  author: tess
  severity: info
  description: Rekognition Image Validation UI panel was detected.
  classification:
    cpe: cpe:2.3:a:rekognition-image-validation:rekognition-image-validation:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Rekognition Image Validation Debug UI"
    vendor: rekognition-image-validation
    product: rekognition-image-validation
  tags: misconfig,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: rekognition-image-validation
        cpe: cpe:2.3:a:rekognition-image-validation:rekognition-image-validation:*:*:*:*:*:*:*:*
        words:
          - 'Rekognition Image Validation Debug UI</title>'
          - 'Optional Parameters'
        condition: and

      - type: status
        status:
          - 200
