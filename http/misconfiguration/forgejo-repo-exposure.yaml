id: forgejo-repo-exposure

info:
  name: Forgejo Repositories - Exposure
  author: DhiyaneshDK
  severity: medium
  description: |
    The Forgejo repo is being exposed publically.
  classification:
    cpe: cpe:2.3:a:forgejo:forgejo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Forgejo"
    vendor: forgejo
    product: forgejo
  tags: misconfig,exposure,forgejo,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/explore/repos"

    matchers-condition: and
    matchers:
      - type: word
        name: forgejo
        cpe: cpe:2.3:a:forgejo:forgejo:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Powered by Forgejo'
          - 'Explore</a>'
          - 'Repositories'
        condition: and

      - type: status
        status:
          - 200
