id: prometheus-exporter

info:
  name: Prometheus exporter detect
  author: jarijaas
  severity: info
  description: Prometheus exporter detector
  reference:
    - https://github.com/prometheus/prometheus/wiki/Default-port-allocations
  classification:
    cpe: cpe:2.3:a:prometheus:prometheus:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: prometheus
    product: prometheus
  tags: prometheus,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: prometheus
        cpe: cpe:2.3:a:prometheus:prometheus:*:*:*:*:*:*:*:*
        words:
          - 'Exporter'
          - '<a href="/metrics">Metrics</a>'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "<title>(.*?)</title>"
