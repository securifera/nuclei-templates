id: prometheus-log

info:
  name: Exposed Prometheus
  author: dhiyaneshDK,thevillagehacker
  severity: low
  description: Prometheus instance is exposed.
  classification:
    cpe: cpe:2.3:a:prometheus:prometheus:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: prometheus
    product: prometheus
  tags: prometheus,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/prometheus"
      - "{{BaseURL}}/actuator/prometheus"
      - "{{BaseURL}}/actuator/prometheus;%2f..%2f..%2f"

    matchers-condition: and
    matchers:
      - type: word
        name: prometheus
        cpe: cpe:2.3:a:prometheus:prometheus:*:*:*:*:*:*:*:*
        words:
          - 'gateway_request_total'
          - 'logback_events_total'
        condition: or

      - type: status
        status:
          - 200
