id: docker-registry

info:
  name: Docker Registry Listing
  author: puzzlepeaches
  severity: medium
  description: Docker Registry Listing enabled.
  reference:
    - https://notsosecure.com/anatomy-of-a-hack-docker-registry
  classification:
    cpe: cpe:2.3:a:docker:docker:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: docker
    product: docker
  tags: misconfig,docker,devops,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/v2/_catalog"

    host-redirects: true
    max-redirects: 1

    matchers-condition: and
    matchers:
      - type: word
        name: docker
        cpe: cpe:2.3:a:docker:docker:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"repositories":'

      - type: word
        name: docker-2
        cpe: cpe:2.3:a:docker:docker:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"
