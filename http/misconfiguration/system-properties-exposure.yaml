id: system-properties-exposure

info:
  name: System Properties Exposure
  author: DhiyaneshDk
  severity: low
  description: System Properties is exposed.
  classification:
    cpe: cpe:2.3:a:system:system:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"System Properties"
    vendor: system
    product: system
  tags: misconfig,system,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: system
        cpe: cpe:2.3:a:system:system:*:*:*:*:*:*:*:*
        part: body
        words:
          - "System Properties:"
          - "Environment Variables:"
        condition: and

      - type: status
        status:
          - 200
