id: sap-directory-listing

info:
  name: SAP Directory Listing
  author: dhiyaneshDK
  severity: medium
  description: SAP Directory Listing is enabled.
  classification:
    cpe: cpe:2.3:a:listing:listing:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: listing
    product: listing
  tags: sap,listing,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/irj/go/km/navigation/'

    matchers-condition: and
    matchers:
      - type: word
        name: listing
        cpe: cpe:2.3:a:listing:listing:*:*:*:*:*:*:*:*
        words:
          - 'title="~system"'
          - 'NetWeaver'
        condition: and

      - type: status
        status:
          - 200

      - type: word
        name: listing-2
        cpe: cpe:2.3:a:listing:listing:*:*:*:*:*:*:*:*
        words:
          - "text/html"
        part: header
