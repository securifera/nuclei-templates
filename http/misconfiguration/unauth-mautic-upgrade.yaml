id: unauth-mautic-upgrade

info:
  name: Unauthenticated Mautic Upgrade.php Exposure
  author: huowuzhao
  severity: high
  description: Upgrade.php page in Mautic is exposed.
  classification:
    cpe: cpe:2.3:a:mautic:mautic:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Mautic"
    vendor: mautic
    product: mautic
  tags: misconfig,unauth,mautic,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/upgrade.php'

    matchers-condition: and
    matchers:
      - type: word
        name: mautic
        cpe: cpe:2.3:a:mautic:mautic:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Upgrade Mautic'
          - 'Click here to start upgrade'
        condition: and

      - type: word
        name: mautic-2
        cpe: cpe:2.3:a:mautic:mautic:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
