id: mongodb-exporter-metrics

info:
  name: MongoDB Exporter - Detect
  author: pussycat0x
  severity: medium
  description: MongoDB exporter was detected.
  reference:
    - https://github.com/percona/mongodb_exporter
  classification:
    cpe: cpe:2.3:a:mongodb:mongodb:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"MongoDB exporter"
    vendor: mongodb
    product: mongodb
  tags: mongodb,exposure,debug,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/metrics"

    matchers-condition: and
    matchers:
      - type: word
        name: mongodb
        cpe: cpe:2.3:a:mongodb:mongodb:*:*:*:*:*:*:*:*
        part: body
        words:
          - "# HELP"

      - type: word
        name: mongodb-2
        cpe: cpe:2.3:a:mongodb:mongodb:*:*:*:*:*:*:*:*
        part: body
        words:
          - "mongodb"
          - "mongodb_exporter_build_info"
        condition: or

      - type: status
        status:
          - 200
