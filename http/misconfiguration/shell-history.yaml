id: shell-history

info:
  name: Shell History
  author: pentest_swissky,geeknik
  severity: low
  description: Discover history for bash, ksh, sh, and zsh
  classification:
    cpe: cpe:2.3:a:shell-history:shell-history:*:*:*:*:*:*:*:*
  metadata:
    max-request: 4
    vendor: shell-history
    product: shell-history
  tags: misconfig,vuln

http:
  - method: GET
    max-redirects: 1
    path:
      - "{{BaseURL}}/.bash_history"
      - "{{BaseURL}}/.ksh_history"
      - "{{BaseURL}}/.sh_history"
      - "{{BaseURL}}/.zsh_history"

    matchers-condition: and
    matchers:
      - type: word
        name: shell-history
        cpe: cpe:2.3:a:shell-history:shell-history:*:*:*:*:*:*:*:*
        words:
          - "mkdir "
          - "chmod "
          - "mv "
          - "nano "
          - "vim "
          - "pico "
          - "sudo "
          - "cd "
          - "cp "
          - "ps aux"
          - "ls "
          - "logout"
        condition: or

      - type: word
        name: shell-history-2
        cpe: cpe:2.3:a:shell-history:shell-history:*:*:*:*:*:*:*:*
        part: response
        words:
          - "<?xml"
          - "<env"
          - "application/javascript"
          - "application/json"
          - "application/xml"
          - "html>"
          - "text/html"
          - "image/"
        negative: true

      - type: status
        status:
          - 200
