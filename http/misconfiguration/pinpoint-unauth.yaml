id: pinpoint-unauth

info:
  name: PinPoint Unauth
  author: dhiyaneshDk
  severity: high
  description: PinPoint is exposed.
  reference:
    - https://github.com/pinpoint-apm/pinpoint
  classification:
    cpe: cpe:2.3:a:pinpoint-unauth:pinpoint-unauth:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: pinpoint-unauth
    product: pinpoint-unauth
  tags: pippoint,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/applications.pinpoint'

    matchers-condition: and
    matchers:
      - type: word
        name: pinpoint-unauth
        cpe: cpe:2.3:a:pinpoint-unauth:pinpoint-unauth:*:*:*:*:*:*:*:*
        words:
          - "applicationName"
          - "serviceType"
        condition: and
        part: body

      - type: word
        name: pinpoint-unauth-2
        cpe: cpe:2.3:a:pinpoint-unauth:pinpoint-unauth:*:*:*:*:*:*:*:*
        words:
          - "application/json"
        part: header

      - type: status
        status:
          - 200
