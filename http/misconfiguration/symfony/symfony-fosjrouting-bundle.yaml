id: symfony-fosjrouting-bundle

info:
  name: Symfony FOSJsRoutingBundle
  author: DhiyaneshDk
  severity: info
  reference:
    - https://packagist.org/packages/friendsofsymfony/jsrouting-bundle
    - https://github.com/FriendsOfSymfony/FOSJsRoutingBundle
  classification:
    cpe: cpe:2.3:a:symfony:symfony:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"symfony Profiler"
    vendor: symfony
    product: symfony
  tags: misconfig,symfony,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/js/routing?callback=fos.Router.setDatafoobarfoo'

    matchers-condition: and
    matchers:
      - type: word
        name: symfony
        cpe: cpe:2.3:a:symfony:symfony:*:*:*:*:*:*:*:*
        part: body
        words:
          - '/**/fos.Router.setDatafoobarfoo({'
          - 'routes'
        condition: and

      - type: word
        name: symfony-2
        cpe: cpe:2.3:a:symfony:symfony:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/javascript"

      - type: status
        status:
          - 200
