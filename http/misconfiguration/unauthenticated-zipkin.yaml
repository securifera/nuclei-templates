id: unauthenticated-zipkin

info:
  name: Zipkin Discovery
  author: dhiyaneshDk
  severity: high
  description: Unauthenticated access to Zipkin was discovered.
  reference:
    - https://zipkin.io/
  classification:
    cpe: cpe:2.3:a:unauthenticated-zipkin:unauthenticated-zipkin:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: unauthenticated-zipkin
    product: unauthenticated-zipkin
  tags: unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/config.json"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: unauthenticated-zipkin
        cpe: cpe:2.3:a:unauthenticated-zipkin:unauthenticated-zipkin:*:*:*:*:*:*:*:*
        words:
          - 'application/json'
        part: header

      - type: word
        name: unauthenticated-zipkin-2
        cpe: cpe:2.3:a:unauthenticated-zipkin:unauthenticated-zipkin:*:*:*:*:*:*:*:*
        words:
          - environment
          - defaultLookback
        part: body
        condition: and
