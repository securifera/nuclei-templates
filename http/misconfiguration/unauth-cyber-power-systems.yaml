id: unauth-cyber-power-systems

info:
  name: Cyber Power Systems - Unauthenticated
  author: DhiyaneshDK
  severity: high
  description: |
    Detects unauthenticated access to Cyber Power Systems, which could lead to unauthorized control or information disclosure.
  classification:
    cpe: cpe:2.3:a:cyber-power:cyber-power:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"<title>PDNU</title>"
    vendor: cyber-power
    product: cyber-power
  tags: unauth,cyber-power,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/#/devices"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        name: cyber-power
        cpe: cpe:2.3:a:cyber-power:cyber-power:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>PDNU</title>"

      - type: status
        status:
          - 200
