id: cobbler-exposed-directory

info:
  name: Exposed Cobbler Directories
  author: c-sh0
  severity: medium
  description: Searches for exposed Cobbler Directories
  classification:
    cpe: cpe:2.3:a:cobbler:cobbler:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: cobbler
    product: cobbler
  tags: cobbler,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cobbler/"
      - "{{BaseURL}}/cblr/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: cobbler
        cpe: cpe:2.3:a:cobbler:cobbler:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Index of /cobbler"
          - "Index of /cblr"
        condition: or
