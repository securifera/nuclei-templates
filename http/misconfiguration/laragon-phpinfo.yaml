id: laragon-phpinfo

info:
  name: Laragon - phpinfo Disclosure
  author: DhiyaneshDk
  severity: low
  description: |
    Laragon phpinfo file was exposed.
  classification:
    cpe: cpe:2.3:a:laragon:laragon:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Laragon" html:"phpinfo"
    vendor: laragon
    product: laragon
  tags: laragon,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/?q=info"

    matchers-condition: and
    matchers:
      - type: word
        name: laragon
        cpe: cpe:2.3:a:laragon:laragon:*:*:*:*:*:*:*:*
        words:
          - "PHP Extension"
          - "PHP Version"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '>PHP Version <\/td><td class="v">([0-9.]+)'
        part: body
