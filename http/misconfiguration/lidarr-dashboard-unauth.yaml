id: lidarr-dashboard-unauth

info:
  name: Lidarr Dashboard - Unauthenticated
  author: ProjectDiscoveryAI
  severity: medium
  description: |
    Exposed Lidarr was detected which can lead to sensitive information disclosure.
  classification:
    cpe: cpe:2.3:a:lidarr:lidarr:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Lidarr"
    vendor: lidarr
    product: lidarr
  tags: lidarr,dashboard,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: lidarr
        cpe: cpe:2.3:a:lidarr:lidarr:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Lidarr</title>"

      - type: word
        name: lidarr-2
        cpe: cpe:2.3:a:lidarr:lidarr:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Login - Lidarr"
        negative: true

      - type: status
        status:
          - 200
