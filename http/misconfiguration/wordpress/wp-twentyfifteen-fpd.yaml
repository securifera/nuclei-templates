id: wp-twentyfifteen-fpd

info:
  name: WordPress Twenty Fifteen Theme - Full Path Disclosure
  author: 0x_Akoko
  severity: info
  description: |
    WordPress theme twentyfifteen internal file system path of a WordPress installation is exposed or disclosed to unauthorized users.
  reference:
    - https://wordpress.org/themes/twentyfifteen/
  classification:
    cpe: cpe:2.3:a:twentyfifteen:twentyfifteen:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: twentyfifteen
    product: twentyfifteen
  tags: debug,wordpress,fpd,vuln,twentyfifteen,wp-themes

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/themes/twentyfifteen/functions.php"

    matchers:
      - type: dsl
        name: twentyfifteen
        cpe: cpe:2.3:a:twentyfifteen:twentyfifteen:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Call to undefined function","/themes/twentyfifteen/")'
        condition: and
