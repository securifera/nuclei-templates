id: unauthenticated-glowroot

info:
  name: Glowroot Anonymous User
  author: pussycat0x
  severity: high
  description: Anonymous user access allows to understand the host internals
  classification:
    cpe: cpe:2.3:a:glowroot:glowroot:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Glowroot"
    vendor: glowroot
    product: glowroot
  tags: misconfig,unauth,glowroot,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/backend/admin/users?username=anonymous'

    matchers-condition: and
    matchers:
      - type: word
        name: glowroot
        cpe: cpe:2.3:a:glowroot:glowroot:*:*:*:*:*:*:*:*
        words:
          - '"username":"anonymous"'
          - '"Administrator"'
          - '"newPassword":""'
        condition: and

      - type: word
        name: glowroot-2
        cpe: cpe:2.3:a:glowroot:glowroot:*:*:*:*:*:*:*:*
        words:
          - "application/json"
        part: header

      - type: status
        status:
          - 200
