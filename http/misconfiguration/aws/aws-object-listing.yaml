id: aws-object-listing

info:
  name: AWS bucket with Object listing
  author: pdteam
  severity: low
  description: Object listing is enabled in AWS bucket.
  reference:
    - https://mikey96.medium.com/cloud-based-storage-misconfigurations-critical-bounties-361647f78a29
  classification:
    cpe: cpe:2.3:a:aws:aws:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: aws
    product: aws
  tags: aws,misconfig,bucket,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    max-size: 1000

    matchers-condition: and
    matchers:
      - type: word
        name: aws
        cpe: cpe:2.3:a:aws:aws:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<ListBucketResult xmlns='

      - type: word
        name: aws-2
        cpe: cpe:2.3:a:aws:aws:*:*:*:*:*:*:*:*
        part: header
        words:
          - application/xml

      - type: word
        name: aws-3
        cpe: cpe:2.3:a:aws:aws:*:*:*:*:*:*:*:*
        part: header
        words:
          - "x-goog-metageneration"
          - "x-goog-generation"
        case-insensitive: true
        negative: true

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<Name>([a-z0-9-._]+)'
