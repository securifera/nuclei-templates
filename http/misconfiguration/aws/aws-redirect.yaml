id: aws-redirect

info:
  name: Subdomain takeover AWS S3
  author: manikanta a.k.a @secureitmania
  severity: info
  reference:
    - https://link.medium.com/fgXKJHR9P7
  classification:
    cpe: cpe:2.3:a:aws:aws:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: aws
    product: aws
  tags: aws,takeover,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    redirects: false

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 307

      - type: word
        name: aws
        cpe: cpe:2.3:a:aws:aws:*:*:*:*:*:*:*:*
        words:
          - 'Location: https://aws.amazon.com/s3/'
        part: header
