id: awstats-listing

info:
  name: AWStats Listing
  author: tess
  severity: low
  description: Searches for exposed awstats Internal Information.
  classification:
    cpe: cpe:2.3:a:awstats:awstats:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: awstats
    product: awstats
  tags: misconfig,aws,exposure,amazon,awstats,oss,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/awstats/data"

    matchers-condition: and
    matchers:
      - type: word
        name: awstats
        cpe: cpe:2.3:a:awstats:awstats:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Index of /awstats/data/'
          - '">awstats'
        condition: and

      - type: status
        status:
          - 200
