id: lesshst-history

info:
  name: Less History - File Disclosure
  author: kazet
  severity: low
  description: |
    LESSHST file is a Less History File. LESSHST file is a Less History File. Less is a terminal pager program on Unix, Windows, and Unix-like systems used to view (but not change) the contents of a text file one screen at a time.
  classification:
    cpe: cpe:2.3:a:less-history:less-history:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"lesshst"
    vendor: less-history
    product: less-history
  tags: misconfig,disclosure,config,files,vuln

http:
  - method: GET
    max-redirects: 1
    path:
      - "{{BaseURL}}/.lesshst"

    matchers-condition: and
    matchers:
      - type: word
        name: less-history
        cpe: cpe:2.3:a:less-history:less-history:*:*:*:*:*:*:*:*
        words:
          - ".less-history-file:"

      - type: word
        name: less-history-2
        cpe: cpe:2.3:a:less-history:less-history:*:*:*:*:*:*:*:*
        part: response
        words:
          - "<?xml"
          - "<env"
          - "application/javascript"
          - "application/json"
          - "application/xml"
          - "html>"
          - "text/html"
          - "image/"
        negative: true

      - type: status
        status:
          - 200
