id: graphql-voyager

info:
  name: GraphQL Voyager - Exposed
  author: Hamza Sahin
  severity: low
  description: |
    GraphQL Voyager UI exposed (often a dev tool) which visualizes the GraphQL schema in production.
  classification:
    cpe: cpe:2.3:a:graphql:voyager:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    shodan-query: html:"voyager.min.js"
    vendor: graphql
    product: voyager
  tags: misconfig,graphql,voyager,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/voyager"
      - "{{BaseURL}}/voyager/"
      - "{{BaseURL}}/ui/voyager"
      - "{{BaseURL}}/graphql/voyager"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: voyager
        cpe: cpe:2.3:a:graphql:voyager:*:*:*:*:*:*:*:*
        part: body
        words:
          - "GraphQL Voyager"
          - "Voyager helps represent any GraphQL API"

      - type: regex
        name: voyager-2
        cpe: cpe:2.3:a:graphql:voyager:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "(?i)voyager\\.min\\.js"
          - "(?i)/voyager[-_/]static/"
