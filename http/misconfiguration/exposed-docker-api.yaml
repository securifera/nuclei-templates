id: exposed-docker-api

info:
  name: Exposed Docker API
  author: furkansenan,dwisiswant0
  severity: info
  classification:
    cpe: cpe:2.3:a:docker:docker:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: docker
    product: docker
  tags: docker,unauth,devops,misconfig,vuln

http:
  - method: GET
    path:
      - "http://{{Hostname}}/version"
      - "http://{{Hostname}}/v1.24/version"

    matchers-condition: and
    matchers:
      - type: word
        name: docker
        cpe: cpe:2.3:a:docker:docker:*:*:*:*:*:*:*:*
        words:
          - "application/json"
        part: header

      - type: word
        name: docker-2
        cpe: cpe:2.3:a:docker:docker:*:*:*:*:*:*:*:*
        words:
          - "KernelVersion"
          - "BuildTime"
        condition: and
        part: body

      - type: status
        status:
          - 200
