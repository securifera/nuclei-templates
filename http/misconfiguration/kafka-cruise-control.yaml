id: kafka-cruise-control

info:
  name: Kafka Cruise Control UI
  author: dhiyaneshDK
  severity: medium
  description: Kafka Cruise Control UI is exposed.
  classification:
    cpe: cpe:2.3:a:kafka:kafka:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Kafka Cruise Control UI"
    vendor: kafka
    product: kafka
  tags: kafka,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        name: kafka
        cpe: cpe:2.3:a:kafka:kafka:*:*:*:*:*:*:*:*
        words:
          - '<title>Kafka Cruise Control UI</title>'
