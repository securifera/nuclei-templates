id: misconfigured-concrete5

info:
  name: Misconfigured Concrete5
  author: pdteam
  severity: low
  description: Concrete5 CMS is misconfigured.
  classification:
    cpe: cpe:2.3:a:concrete:concrete:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: concrete
    product: concrete
  tags: misconfig,concrete,cms,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        name: concrete
        cpe: cpe:2.3:a:concrete:concrete:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'concrete5 has encountered an issue'
