id: command-api-explorer

info:
  name: Command API Explorer Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: Command API Explorer panel was detected.
  classification:
    cpe: cpe:2.3:a:command-api-explorer:command-api-explorer:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Command API Explorer"
    vendor: command-api-explorer
    product: command-api-explorer
  tags: panel,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/explorer.html"

    matchers-condition: and
    matchers:
      - type: word
        name: command-api-explorer
        cpe: cpe:2.3:a:command-api-explorer:command-api-explorer:*:*:*:*:*:*:*:*
        words:
          - "<title>Command API Explorer</title>"

      - type: word
        name: command-api-explorer-2
        cpe: cpe:2.3:a:command-api-explorer:command-api-explorer:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
