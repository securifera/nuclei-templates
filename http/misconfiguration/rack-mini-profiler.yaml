id: rack-mini-profiler

info:
  name: rack-mini-profiler - Environment Information Disclosure
  author: vzamanillo
  severity: high
  description: rack-mini-profiler is prone to environmental information disclosure which could help an attacker formulate additional attacks.
  classification:
    cpe: cpe:2.3:a:rack-mini-profiler:rack-mini-profiler:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: rack-mini-profiler
    product: rack-mini-profiler
  tags: config,debug,rails,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/?pp=env"

    matchers-condition: and
    matchers:
      - type: word
        name: rack-mini-profiler
        cpe: cpe:2.3:a:rack-mini-profiler:rack-mini-profiler:*:*:*:*:*:*:*:*
        words:
          - "Rack Environment"

      - type: status
        status:
          - 200
