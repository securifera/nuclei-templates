id: unauth-phoenix-dashboard

info:
  name: Unauth Phoenix Dashboard - Detect
  author: DhiyaneshDk
  severity: high
  description: |
    Phoenix Dashboard was detected and appeared to be accessible without authentication.
  classification:
    cpe: cpe:2.3:a:phoenix:phoenix:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-1338105374
    vendor: phoenix
    product: phoenix
  tags: phoenix,misconfig,unauth,dashboard,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/settings/general"

    matchers:
      - type: dsl
        name: phoenix
        cpe: cpe:2.3:a:phoenix:phoenix:*:*:*:*:*:*:*:*
        dsl:
          - 'contains_all(body, "<title>Phoenix</title>","AI Observability")'
          - 'status_code == 200'
        condition: and
