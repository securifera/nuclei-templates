id: clockwork-dashboard-exposure

info:
  name: Clockwork Dashboard Exposure
  author: dhiyaneshDk
  severity: high
  description: Clockwork Dashboard is exposed.
  reference:
    - https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/clockwork-dashboard-exposure.json
  classification:
    cpe: cpe:2.3:a:clockwork:clockwork:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: clockwork
    product: clockwork
  tags: exposure,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/__clockwork/latest"

    matchers-condition: and
    matchers:
      - type: word
        name: clockwork
        cpe: cpe:2.3:a:clockwork:clockwork:*:*:*:*:*:*:*:*
        words:
          - '"id":'
          - '"version":'
          - '"method":'
          - '"url":'
          - '"time":'
        part: body
        condition: and

      - type: word
        name: clockwork-2
        cpe: cpe:2.3:a:clockwork:clockwork:*:*:*:*:*:*:*:*
        words:
          - "application/json"
        part: header
