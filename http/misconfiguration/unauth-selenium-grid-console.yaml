id: unauth-selenium-grid-console

info:
  name: Selenium Grid Console - Detect
  author: pussycat0x
  severity: info
  description: Selenium Grid Console panel was detected.
  classification:
    cpe: cpe:2.3:a:selenium:selenium:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    vendor: selenium
    product: selenium
  tags: misconfig,unauth,selenium,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/grid/console"
      - "{{BaseURL}}/console"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: selenium
        cpe: cpe:2.3:a:selenium:selenium:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Grid Console"
          - "view config"
        condition: and

      - type: status
        status:
          - 200
