id: sitecore-debug-page

info:
  name: SiteCore Debug Page
  author: dhiyaneshDK
  severity: low
  description: SiteCore debug page is exposed.
  classification:
    cpe: cpe:2.3:a:sitecore:sitecore:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Welcome to Sitecore"
    vendor: sitecore
    product: sitecore
  tags: debug,sitecore,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/sitecore/'"

    matchers-condition: and
    matchers:
      - type: word
        name: sitecore
        cpe: cpe:2.3:a:sitecore:sitecore:*:*:*:*:*:*:*:*
        words:
          - 'extranet\Anonymous'

      - type: status
        status:
          - 404
