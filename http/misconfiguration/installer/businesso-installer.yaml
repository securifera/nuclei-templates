id: businesso-installer

info:
  name: Businesso Installer Exposure
  author: ritikchaddha
  severity: high
  description: Businesso is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:businesso:businesso:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Businesso Installer"
    fofa-query: title="Businesso Installer"
    vendor: businesso
    product: businesso
  tags: misconfig,businesso,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/install/'

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        name: businesso
        cpe: cpe:2.3:a:businesso:businesso:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Businesso Installer</title>'

      - type: status
        status:
          - 200
