id: piwik-installer

info:
  name: Piwik Installer Exposure
  author: DhiyaneshDk
  severity: low
  description: Piwik is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:piwik:piwik:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Piwik &rsaquo; Installation"
    vendor: piwik
    product: piwik
  tags: misconfig,piwik,install,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: piwik
        cpe: cpe:2.3:a:piwik:piwik:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Piwik"
          - "Installation status"
        condition: and

      - type: word
        name: piwik-2
        cpe: cpe:2.3:a:piwik:piwik:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
