id: akeeba-installer

info:
  name: Akeeba Backup Installer - Exposure
  author: DhiyaneshDK
  severity: high
  description: Akeeba Backup is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:akeeba:akeeba:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Akeeba Backup"
    vendor: akeeba
    product: akeeba
  tags: misconfig,akeeba,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/installation/index.php'

    matchers-condition: and
    matchers:
      - type: word
        name: akeeba
        cpe: cpe:2.3:a:akeeba:akeeba:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Akeeba Backup Installer'

      - type: status
        status:
          - 200
