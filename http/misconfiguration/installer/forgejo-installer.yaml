id: forgejo-installer

info:
  name: Forgejo Installation Page - Exposure
  author: DhiyaneshDk
  severity: high
  description: |
    Checks for the presence of a Forgejo Installer Page.
  classification:
    cpe: cpe:2.3:a:forgejo:forgejo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="Installation - Forgejo:"
    vendor: forgejo
    product: forgejo
  tags: install,Forgejo,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: forgejo
        cpe: cpe:2.3:a:forgejo:forgejo:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Installation - Forgejo: Beyond coding. We Forge.</title>"

      - type: status
        status:
          - 200
