id: metaview-explorer-installer

info:
  name: MetaView Explorer Installer
  author: theamanrawat
  severity: info
  description: MetaView Explorer is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:metaview:metaview:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"MetaView Explorer"
    vendor: metaview
    product: metaview
  tags: misconfig,metaview,installer,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: metaview
        cpe: cpe:2.3:a:metaview:metaview:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'MetaView Explorer'
          - '(InstallAnywhere Web Installer)'
        condition: and

      - type: status
        status:
          - 200
