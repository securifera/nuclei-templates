id: lmszai-installer

info:
  name: LMSZAI Installer Exposure
  author: DhiyaneshDk
  severity: high
  description: LMSZAI is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:lmszai:lmszai:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"LMSZAI - Learning Management System"
    vendor: lmszai
    product: lmszai
  tags: misconfig,blesta,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/install'

    matchers-condition: and
    matchers:
      - type: word
        name: lmszai
        cpe: cpe:2.3:a:lmszai:lmszai:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'LMSZAI - Learning Management System'
          - 'Configuaration'
        condition: and

      - type: word
        name: lmszai-2
        cpe: cpe:2.3:a:lmszai:lmszai:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
