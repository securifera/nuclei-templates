id: sumowebtools-installer

info:
  name: SumoWebTools Installer Exposure
  author: DhiyaneshDk
  severity: high
  description: SumoWebTools is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:sumowebtools:sumowebtools:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"SumoWebTools Installer"
    vendor: sumowebtools
    product: sumowebtools
  tags: misconfig,sumowebtools,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/install'

    matchers-condition: and
    matchers:
      - type: word
        name: sumowebtools
        cpe: cpe:2.3:a:sumowebtools:sumowebtools:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'SumoWebTools Installer'
          - 'configure'
        condition: and

      - type: word
        name: sumowebtools-2
        cpe: cpe:2.3:a:sumowebtools:sumowebtools:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
