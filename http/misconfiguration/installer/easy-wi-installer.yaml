id: easy-wi-installer

info:
  name: Easy-WI Installation Page - Exposure
  author: DhiyaneshDK
  severity: high
  description: |
    Easy-WI is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:easy-wi:easy-wi:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="Easy-WI Installer"
    vendor: easy-wi
    product: easy-wi
  tags: misconfig,exposure,install,easy-wi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/install.php"

    matchers-condition: and
    matchers:
      - type: word
        name: easy-wi
        cpe: cpe:2.3:a:easy-wi:easy-wi:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Welcome to the Easy-WI installer!"

      - type: status
        status:
          - 200
