id: ids-skills-installer

info:
  name: IDP Skills Installer - Exposure
  author: DhiyaneshDk
  severity: high
  description: |
    Checks for the presence of an IDS Skills Installer page.
  classification:
    cpe: cpe:2.3:a:ids:ids:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"IDP Skills Installer"
    vendor: ids
    product: ids
  tags: install,ids,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/#/install/main"

    matchers-condition: and
    matchers:
      - type: word
        name: ids
        cpe: cpe:2.3:a:ids:ids:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>IDP Skills Installer</title>"

      - type: status
        status:
          - 200
