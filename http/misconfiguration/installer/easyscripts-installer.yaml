id: easyscripts-installer

info:
  name: Easyscripts Installer
  author: theamanrawat
  severity: high
  description: Easyscripts is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:easyscripts:easyscripts:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Installer - Easyscripts"
    vendor: easyscripts
    product: easyscripts
  tags: misconfig,easyscripts,installer,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: easyscripts
        cpe: cpe:2.3:a:easyscripts:easyscripts:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Installer - Easyscripts'

      - type: status
        status:
          - 200
