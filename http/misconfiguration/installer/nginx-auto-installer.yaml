id: nginx-auto-installer

info:
  name: NginX Auto Installer Exposure
  author: pussycat0x
  severity: low
  description: NginX Auto is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:nginx:nginx:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"NginX Auto Installer"
    vendor: nginx
    product: nginx
  tags: misconfig,nginx,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: nginx
        cpe: cpe:2.3:a:nginx:nginx:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'NginX Auto Installer'

      - type: status
        status:
          - 200
