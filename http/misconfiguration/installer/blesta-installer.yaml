id: blesta-installer

info:
  name: Blesta Installer Exposure
  author: DhiyaneshDk
  severity: high
  description: Blesta is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:blesta:blesta:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Blesta installer"
    vendor: blesta
    product: blesta
  tags: misconfig,blesta,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/index.php/install'

    matchers-condition: and
    matchers:
      - type: word
        name: blesta
        cpe: cpe:2.3:a:blesta:blesta:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Blesta Installer'
          - 'Install via Web Browser'
        condition: and

      - type: word
        name: blesta-2
        cpe: cpe:2.3:a:blesta:blesta:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
