id: webasyst-installer

info:
  name: Webasyst Installer Exposure
  author: ritikchaddha
  severity: high
  description: Webasyst is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:webasyst:webasyst:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Webasyst Installer"
    vendor: webasyst
    product: webasyst
  tags: misconfig,webasyst,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: webasyst
        cpe: cpe:2.3:a:webasyst:webasyst:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Webasyst Installer'

      - type: status
        status:
          - 200
