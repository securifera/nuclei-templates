id: vironeer-installer

info:
  name: Vironeer Installer - Exposure
  author: DhiyaneshDk
  severity: high
  description: Vironeer is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:vironeer:vironeer:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="1315386913"
    vendor: vironeer
    product: vironeer
  tags: misconfig,vironeer,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/install/information/database'

    matchers-condition: and
    matchers:
      - type: word
        name: vironeer
        cpe: cpe:2.3:a:vironeer:vironeer:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Vironeer Installer'

      - type: status
        status:
          - 200
