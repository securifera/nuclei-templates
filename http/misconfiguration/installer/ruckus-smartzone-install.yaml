id: ruckus-smartzone-install

info:
  name: Ruckus SmartZone Exposed Installation
  author: ritikchaddha
  severity: high
  description: Ruckus SmartZone is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:smartzone:smartzone:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Welcome to the Ruckus"
    vendor: smartzone
    product: smartzone
  tags: misconfig,ruckus,smartzone,install,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/adminweb/"

    matchers-condition: and
    matchers:
      - type: word
        name: smartzone
        cpe: cpe:2.3:a:smartzone:smartzone:*:*:*:*:*:*:*:*
        words:
          - 'Welcome to the Ruckus'
          - 'Setup Wizard'
        condition: and

      - type: status
        status:
          - 200
