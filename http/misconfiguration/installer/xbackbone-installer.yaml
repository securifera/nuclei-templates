id: xbackbone-installer

info:
  name: XBackBone Installer - Exposure
  author: DhiyaneshDk
  severity: high
  description: |
    Checks for the presence of a XBackBone Installer.
  classification:
    cpe: cpe:2.3:a:xbackbone:xbackbone:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"XBackBone Installer"
    vendor: xbackbone
    product: xbackbone
  tags: install,xbackbone,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/"

    matchers-condition: and
    matchers:
      - type: word
        name: xbackbone
        cpe: cpe:2.3:a:xbackbone:xbackbone:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>XBackBone Installer</title>"

      - type: status
        status:
          - 200
