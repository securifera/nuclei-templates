id: ruckus-unleashed-install

info:
  name: Ruckus Unleashed Exposed Installation
  author: ritikchaddha
  severity: high
  description: Ruckus Unleashed is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:unleashed:unleashed:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Setup Wizard" html:"/ruckus"
    vendor: unleashed
    product: unleashed
  tags: misconfig,ruckus,unleashed,install,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/wizard.jsp"

    matchers-condition: and
    matchers:
      - type: word
        name: unleashed
        cpe: cpe:2.3:a:unleashed:unleashed:*:*:*:*:*:*:*:*
        words:
          - '<title>Setup Wizard'
          - '/ruckus'
        condition: and

      - type: status
        status:
          - 200
