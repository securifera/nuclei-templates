id: jackett-installer

info:
  name: Jackett - Installer
  author: ritikchaddha
  severity: high
  description: |
    Jackett installer exposed.
  classification:
    cpe: cpe:2.3:a:jackett:jackett:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Stremio-Jackett"
    vendor: jackett
    product: jackett
  tags: install,jackett,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/configure"

    matchers-condition: and
    matchers:
      - type: word
        name: jackett
        cpe: cpe:2.3:a:jackett:jackett:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Jackett"
          - "Install</a>"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
