id: espeasy-installer

info:
  name: ESPEasy Installation Exposure
  author: ritikchaddha
  severity: medium
  description: ESPEasy is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:espeasy:espeasy:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: espeasy
    product: espeasy
  tags: misconfig,espeasy,install,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/ESPEasy"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: espeasy
        cpe: cpe:2.3:a:espeasy:espeasy:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Install ESPEasy"

      - type: status
        status:
          - 200
