id: fleetcart-installer

info:
  name: FleetCart Installation Page - Exposure
  author: DhiyaneshDK
  severity: high
  description: |
    Detects exposed FleetCart setup installation pages which could allow unauthorized access or information disclosure.
  reference:
    - https://codecanyon.net/item/fleetcart-laravel-ecommerce-system/23014826
  classification:
    cpe: cpe:2.3:a:fleetcart:fleetcart:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"FleetCart - Installation"
    vendor: fleetcart
    product: fleetcart
  tags: misconfig,install,exposure,fleetcart,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install"

    matchers-condition: and
    matchers:
      - type: word
        name: fleetcart
        cpe: cpe:2.3:a:fleetcart:fleetcart:*:*:*:*:*:*:*:*
        part: body
        words:
          - "FleetCart - Installation"

      - type: status
        status:
          - 200
