id: unifi-wizard-install

info:
  name: UniFi Wizard Installer
  author: DhiyaneshDk
  severity: high
  description: UniFi Wizard is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:install:install:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"UniFi Wizard"
    vendor: install
    product: install
  tags: misconfig,install,unifi,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/manage/wizard/"

    matchers-condition: and
    matchers:
      - type: word
        name: install
        cpe: cpe:2.3:a:install:install:*:*:*:*:*:*:*:*
        part: body
        words:
          - "UniFi Wizard"
          - "app-unifi-wizard"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "window.unifiConfig.version = '(.*)'"
