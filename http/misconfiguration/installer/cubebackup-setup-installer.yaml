id: cubebackup-setup-installer

info:
  name: CubeBackup Setup Page - Exposure
  author: DhiyaneshDK
  severity: high
  description: |
    Detects exposed CubeBackup Setup page.
  reference:
    - https://www.cubebackup.com/
  classification:
    cpe: cpe:2.3:a:cubebackup:cubebackup:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="CubeBackup setup"
    vendor: cubebackup
    product: cubebackup
  tags: misconfig,install,exposure,cubebackup,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: cubebackup
        cpe: cpe:2.3:a:cubebackup:cubebackup:*:*:*:*:*:*:*:*
        part: body
        words:
          - "CubeBackup setup"

      - type: status
        status:
          - 200
