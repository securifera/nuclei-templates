id: emlog-installer

info:
  name: Emlog Pro - Installation
  author: ritikchaddha
  severity: high
  description: |
    Emlog Pro Installation page has been exposed.
  classification:
    cpe: cpe:2.3:a:emlog:emlog:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    fofa-query: title="emlog"
    vendor: emlog
    product: emlog
  tags: emlog,install,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install.php"

    matchers-condition: and
    matchers:
      - type: word
        name: emlog
        cpe: cpe:2.3:a:emlog:emlog:*:*:*:*:*:*:*:*
        part: body
        words:
          - '>MySQL'
          - 'install.php?action=install'
          - 'emlog'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
