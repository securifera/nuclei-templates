id: cms-made-simple-installer

info:
  name: CMS Made Simple Installation Page - Exposure
  author: DhiyaneshDK
  severity: high
  description: |
    Detects exposed CMS Made Simple Installation page.
  reference:
    - https://www.cmsmadesimple.org/
  classification:
    cpe: cpe:2.3:a:cms-made-simple:cms-made-simple:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"CMS Made Simple Install/Upgrade"
    vendor: cms-made-simple
    product: cms-made-simple
  tags: misconfig,install,exposure,cms-made-simple,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/"

    matchers-condition: and
    matchers:
      - type: word
        name: cms-made-simple
        cpe: cpe:2.3:a:cms-made-simple:cms-made-simple:*:*:*:*:*:*:*:*
        part: body
        words:
          - "CMS Made Simple Install/Upgrade"

      - type: status
        status:
          - 200
