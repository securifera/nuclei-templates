id: geniusocean-installer

info:
  name: GeniusOcean Installer Exposure
  author: DhiyaneshDk
  severity: high
  description: GeniusOcean is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:geniusocean:geniusocean:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"GeniusOcean Installer"
    vendor: geniusocean
    product: geniusocean
  tags: misconfig,geniusocean,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/install/?step=1'

    matchers-condition: and
    matchers:
      - type: word
        name: geniusocean
        cpe: cpe:2.3:a:geniusocean:geniusocean:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'GeniusOcean - Script Installer'
          - 'GeniusOcean Installer'
        condition: and

      - type: word
        name: geniusocean-2
        cpe: cpe:2.3:a:geniusocean:geniusocean:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
