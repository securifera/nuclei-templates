id: quickcms-installer

info:
  name: QuickCMS Installation Wizard
  author: DhiyaneshDK
  severity: high
  description: |
    PMM is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:quickcms:quickcms:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"QuickCMS Installation"
    vendor: quickcms
    product: quickcms
  tags: misconfig,exposure,install,quickcms,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/"

    matchers-condition: and
    matchers:
      - type: word
        name: quickcms
        cpe: cpe:2.3:a:quickcms:quickcms:*:*:*:*:*:*:*:*
        part: body
        words:
          - "QuickCMS Installation"

      - type: status
        status:
          - 200
