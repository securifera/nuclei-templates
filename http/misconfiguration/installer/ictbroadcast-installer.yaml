id: ictbroadcast-installer

info:
  name: ICTBroadcast Installation Wizard
  author: DhiyaneshDK
  severity: high
  description: |
    ICTBroadcast is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:a:ictbroadcast:ictbroadcast:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"ICTBroadcast"
    vendor: ictbroadcast
    product: ictbroadcast
  tags: misconfig,exposure,install,ictbroadcast,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install.php"

    matchers-condition: and
    matchers:
      - type: word
        name: ictbroadcast
        cpe: cpe:2.3:a:ictbroadcast:ictbroadcast:*:*:*:*:*:*:*:*
        part: body
        words:
          - "ICTBroadcast[ICTBroadcast :: Installation]"

      - type: word
        name: ictbroadcast-2
        cpe: cpe:2.3:a:ictbroadcast:ictbroadcast:*:*:*:*:*:*:*:*
        part: content_type
        words:
          - "text/html"

      - type: status
        status:
          - 200
