id: jfa-go-installer

info:
  name: jfa-go Setup Page - Exposure
  author: DhiyaneshDK
  severity: high
  description: |
    Detects exposed jfa-go Setup page.
  reference:
    - https://github.com/hrfee/jfa-go
  classification:
    cpe: cpe:2.3:a:jfa-go:jfa-go:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Setup - jfa-go"
    vendor: jfa-go
    product: jfa-go
  tags: misconfig,install,exposure,jfa-go,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: jfa-go
        cpe: cpe:2.3:a:jfa-go:jfa-go:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Setup - jfa-go"

      - type: status
        status:
          - 200
