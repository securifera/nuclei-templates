id: unauth-wavink-panel

info:
  name: Wavlink Panel - Unauthenticated Access
  author: princechaddha
  severity: high
  description: Wavlink Panel was able to be accessed with no authentication requirements in place.
  classification:
    cpe: cpe:2.3:a:unauth-wavink:unauth-wavink:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Wi-Fi APP Login"
    vendor: unauth-wavink
    product: unauth-wavink
  tags: exposure,wavlink,unauth,misconfig,router,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wifi_base.shtml"

    matchers-condition: and
    matchers:
      - type: word
        name: unauth-wavink
        cpe: cpe:2.3:a:unauth-wavink:unauth-wavink:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>APP</title>"

      - type: regex
        name: unauth-wavink-2
        cpe: cpe:2.3:a:unauth-wavink:unauth-wavink:*:*:*:*:*:*:*:*
        part: body
        regex:
          - 'var passphraseKey12="(.*)";'

      - type: word
        name: unauth-wavink-3
        cpe: cpe:2.3:a:unauth-wavink:unauth-wavink:*:*:*:*:*:*:*:*
        part: body
        negative: true
        words:
          - 'var passphraseKey12="";'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'var passphraseKey12="(.*)";'
