id: codis-dashboard

info:
  name: Codis Dashboard Exposure
  author: tess
  severity: low
  description: Codis Dashboard is exposed.
  classification:
    cpe: cpe:2.3:a:codis:codis:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Codis • Dashboard"
    vendor: codis
    product: codis
  tags: misconfig,exposure,codis,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: codis
        cpe: cpe:2.3:a:codis:codis:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Codis • Dashboard"
          - "Sessions"
        condition: and

      - type: word
        name: codis-2
        cpe: cpe:2.3:a:codis:codis:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
