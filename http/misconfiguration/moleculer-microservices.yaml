id: moleculer-microservices

info:
  name: Moleculer Microservices Project
  author: pussycat0x
  severity: low
  description: |
    Moleculer microservice was able to be accessed with no required authentication in place.
  classification:
    cpe: cpe:2.3:a:microservice:microservice:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Moleculer Microservices Project"
    vendor: microservice
    product: microservice
  tags: misconfig,microservice,moleculer,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: microservice
        cpe: cpe:2.3:a:microservice:microservice:*:*:*:*:*:*:*:*
        words:
          - "Moleculer Microservices Project"
          - "Service/Action name"
        condition: and

      - type: word
        name: microservice-2
        cpe: cpe:2.3:a:microservice:microservice:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
