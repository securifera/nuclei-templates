id: blackbox-exporter-metrics

info:
  name: Blackbox Exporter Metrics Exposed
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:blackbox:blackbox:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Blackbox Exporter"
    vendor: blackbox
    product: blackbox
  tags: blackbox,exposure,debug,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/metrics"

    matchers-condition: and
    matchers:
      - type: word
        name: blackbox
        cpe: cpe:2.3:a:blackbox:blackbox:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Blackbox exporter"
          - "blackbox_exporter_build_info"
        condition: or

      - type: status
        status:
          - 200
