id: unauth-jupyter-lab

info:
  name: Jupyter Lab - Unauthenticated Access
  author: j4vaovo
  severity: critical
  description: |
    JupyterLab was able to be accessed without authentication.
  reference:
    - https://paper.seebug.org/2058/
  classification:
    cpe: cpe:2.3:a:jupyter:jupyter:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-288
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:450899026
    vendor: jupyter
    product: jupyter
  tags: unauth,jupyter,jupyterlab,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/lab/api/settings/'

    matchers-condition: and
    matchers:
      - type: word
        name: jupyter
        cpe: cpe:2.3:a:jupyter:jupyter:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"id":'
          - '"settings"'
          - '"schema":'
        condition: and

      - type: word
        name: jupyter-2
        cpe: cpe:2.3:a:jupyter:jupyter:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
