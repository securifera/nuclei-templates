id: cx-cloud-upload-detect

info:
  name: CX Cloud Unauthenticated Upload - Detect
  author: dhiyaneshDk
  severity: info
  description: CX Cloud unauthenticated upload was detected.
  classification:
    cpe: cpe:2.3:a:cx-cloud-upload:cx-cloud-upload:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: cx-cloud-upload
    product: cx-cloud-upload
  tags: fileupload,misconfig,intrusive,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/upload.jsp'

    matchers:
      - type: word
        name: cx-cloud-upload
        cpe: cpe:2.3:a:cx-cloud-upload:cx-cloud-upload:*:*:*:*:*:*:*:*
        words:
          - "<HEAD><TITLE>Display file upload form to the user</TITLE></HEAD>"
        condition: and
