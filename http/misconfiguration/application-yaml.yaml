id: application-yaml

info:
  name: application.yaml detection
  author: Cristi vlad (@cristivlad25)
  severity: info
  description: Finds Application YAML files which often contain sensitive information.
  classification:
    cpe: cpe:2.3:a:application-yaml:application-yaml:*:*:*:*:*:*:*:*
  metadata:
    max-request: 4
    vendor: application-yaml
    product: application-yaml
  tags: misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/app.yaml"
      - "{{BaseURL}}/app.yml"
      - "{{BaseURL}}/application.yaml"
      - "{{BaseURL}}/application.yml"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: application-yaml
        cpe: cpe:2.3:a:application-yaml:application-yaml:*:*:*:*:*:*:*:*
        condition: or
        words:
          - "runtime:"
          - "spring:"
          - "datasource:"
          - "platform:"
          - "server:"
          - "job:"

      - type: status
        status:
          - 200

      - type: dsl
        name: application-yaml-2
        cpe: cpe:2.3:a:application-yaml:application-yaml:*:*:*:*:*:*:*:*
        dsl:
          - "!contains(tolower(body), '<html')"
          - "!contains(tolower(body), '<body')"
          - "!contains(tolower(body), '</h1>')"
          - "!contains(tolower(body), '</h2>')"
          - "!contains(tolower(body), '</h3>')"
          - "!contains(tolower(body), '<?xml')"
        condition: and
