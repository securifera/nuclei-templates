id: unauth-axyom-network-manager

info:
  name: Unauthenticated Axyom Network Manager
  author: pussycat0x
  severity: high
  description: Axyom Network Manager exposed.
  classification:
    cpe: cpe:2.3:a:axyom:axyom:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Axyom Network Manager"
    vendor: axyom
    product: axyom
  tags: misconfig,axyom,exposure,unauth,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/home"

    matchers-condition: and
    matchers:
      - type: word
        name: axyom
        cpe: cpe:2.3:a:axyom:axyom:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Axyom Network Manager'

      - type: status
        status:
          - 200
