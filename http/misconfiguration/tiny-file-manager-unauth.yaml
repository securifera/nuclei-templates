id: tiny-file-manager-unauth

info:
  name: Tiny File Manager - Unauthorized Access
  author: ritikchaddha,HuTa0
  severity: medium
  description: Unauthenticated Tiny File Manager panel was detected.
  classification:
    cpe: cpe:2.3:a:tiny-file-manager-unauth:tiny-file-manager-unauth:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Tiny File Manager"
    zoomeye-query: app="Tiny File Manager"
    vendor: tiny-file-manager-unauth
    product: tiny-file-manager-unauth
  tags: misconfig,filemanager,detect,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/index.php'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: tiny-file-manager-unauth
        cpe: cpe:2.3:a:tiny-file-manager-unauth:tiny-file-manager-unauth:*:*:*:*:*:*:*:*
        words:
          - 'Tiny File Manager'
          - '<th>Actions'
          - 'New Item'
          - 'Upload'
        condition: and

      - type: status
        status:
          - 200
