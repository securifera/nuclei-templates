id: lvm-exporter-metrics

info:
  name: LVM Exporter Metrics
  author: DhiyaneshDk
  severity: low
  description: LVM Exporter Metrics is exposed.
  classification:
    cpe: cpe:2.3:a:lvm:lvm:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"LVM Exporter"
    vendor: lvm
    product: lvm
  tags: lvm,exposure,debug,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/metrics"

    matchers-condition: and
    matchers:
      - type: word
        name: lvm
        cpe: cpe:2.3:a:lvm:lvm:*:*:*:*:*:*:*:*
        part: body
        words:
          - "# HELP"

      - type: word
        name: lvm-2
        cpe: cpe:2.3:a:lvm:lvm:*:*:*:*:*:*:*:*
        part: body
        words:
          - "lvm_"

      - type: status
        status:
          - 200
