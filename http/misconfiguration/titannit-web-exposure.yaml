id: titannit-web-exposure

info:
  name: TitanNit Web Control - Exposure
  author: DhiyaneshDk
  severity: medium
  classification:
    cpe: cpe:2.3:a:titannit:titannit:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"TitanNit Web Control"
    vendor: titannit
    product: titannit
  tags: misconfig,titannit,webcontrol,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: titannit
        cpe: cpe:2.3:a:titannit:titannit:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>TitanNit Web Control"
          - "System</a>"
        condition: and

      - type: status
        status:
          - 200
