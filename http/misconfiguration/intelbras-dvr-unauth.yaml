id: intelbras-dvr-unauth

info:
  name: Intelbras DVR - Unrestricted Access
  author: pussycat0x
  severity: low
  description: |
    The HTTP GET request to /cap.js on the server Intelbras DVR reveals several potentially sensitive pieces of information that are not properly protected or encrypted.
  reference:
    - https://github.com/netsecfish/intelbras_cap_js
  classification:
    cpe: cpe:2.3:a:intelbras:intelbras:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: "body=\"Intelbras\""
    vendor: intelbras
    product: intelbras
  tags: unauth,intelbras,dvr,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cap.js"

    matchers-condition: and
    matchers:
      - type: word
        name: intelbras
        cpe: cpe:2.3:a:intelbras:intelbras:*:*:*:*:*:*:*:*
        words:
          - "var talkTypes="
          - "var userInfo="
        condition: and

      - type: status
        status:
          - 200
