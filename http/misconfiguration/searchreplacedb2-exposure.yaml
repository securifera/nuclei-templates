id: searchreplacedb2-exposure

info:
  name: Safe Search Replace Exposure
  author: kazet
  severity: high
  description: Safe Search Replace is exposed leaking internal info.
  reference:
    - https://interconnectit.com/search-and-replace-for-wordpress-databases/
    - https://github.com/interconnectit/Search-Replace-DB
  classification:
    cpe: cpe:2.3:a:searchreplacedb2:searchreplacedb2:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"searchreplacedb2.php"
    fofa-query: body="searchreplacedb2.php"
    vendor: searchreplacedb2
    product: searchreplacedb2
  tags: misconfig,searchreplacedb2,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/searchreplacedb2.php"

    matchers-condition: and
    matchers:
      - type: word
        name: searchreplacedb2
        cpe: cpe:2.3:a:searchreplacedb2:searchreplacedb2:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Database details"
          - "Safe Search Replace"
        condition: and

      - type: word
        name: searchreplacedb2-2
        cpe: cpe:2.3:a:searchreplacedb2:searchreplacedb2:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
