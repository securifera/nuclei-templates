id: administrate-dashboard

info:
  name: Administrate Dashboard Exposure
  author: DhiyaneshDk
  severity: high
  description: |
    Administrate Dashboard was exposed.
  reference:
    - https://github.com/thoughtbot/administrate
  classification:
    cpe: cpe:2.3:a:administrate:administrate:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="Administrate"
    vendor: administrate
    product: administrate
  tags: exposure,administrate,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin"

    matchers-condition: and
    matchers:
      - type: word
        name: administrate
        cpe: cpe:2.3:a:administrate:administrate:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Search Customers'
          - 'Administrate'
          - 'New customer</a>'
        condition: and

      - type: status
        status:
          - 200
