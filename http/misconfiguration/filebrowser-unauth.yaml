id: filebrowser-unauth

info:
  name: File Browser Dashboard - Unauthenticated Access
  author: ritikchaddha
  severity: medium
  description: File Browser dashboard is exposed.
  reference:
    - https://filebrowser.org/
  classification:
    cpe: cpe:2.3:a:filebrowser:filebrowser:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:1052926265
    product: filebrowser
    vendor: filebrowser
    fofa-query: icon_hash=1052926265
  tags: misconfig,filebrowser,unauth,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: filebrowser
        cpe: cpe:2.3:a:filebrowser:filebrowser:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'File Browser</title>'
          - 'window.FileBrowser'
        condition: or

      - type: word
        name: filebrowser-2
        cpe: cpe:2.3:a:filebrowser:filebrowser:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'LoginPage":false'
          - '"NoAuth":true'
        condition: and
