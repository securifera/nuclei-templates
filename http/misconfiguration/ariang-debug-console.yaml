id: ariang-debug-console

info:
  name: AriaNg Debug Console - Exposure
  author: DhiyaneshDk
  severity: medium
  description: |
    Detects the presence of AriaNg Debug Console exposure
  classification:
    cpe: cpe:2.3:a:ariang:ariang:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Ariang"
    vendor: ariang
    product: ariang
  tags: exposure,ariang,debug,console,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        name: ariang
        cpe: cpe:2.3:a:ariang:ariang:*:*:*:*:*:*:*:*
        part: body
        words:
          - "AriaNg Debug Console"
          - "'Downloading'"
        condition: and
