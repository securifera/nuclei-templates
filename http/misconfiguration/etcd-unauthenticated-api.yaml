id: http-etcd-unauthenticated-api-data-leak

info:
  name: etcd Unauthenticated HTTP API Leak
  author: dhiyaneshDk
  severity: high
  description: etcd HTTP API is exposed.
  reference:
    - https://hackerone.com/reports/1088429
  classification:
    cpe: cpe:2.3:a:etcd:etcd:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: etcd
    product: etcd
  tags: misconfig,hackerone,unauth,etcd,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/v2/auth/roles"

    matchers-condition: and
    matchers:
      - type: word
        name: etcd
        cpe: cpe:2.3:a:etcd:etcd:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"roles"'
          - '"permissions"'
          - '"role"'
          - '"kv"'
        condition: and

      - type: word
        name: etcd-2
        cpe: cpe:2.3:a:etcd:etcd:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/plain"
          - "application/json"
        condition: or

      - type: status
        status:
          - 200
