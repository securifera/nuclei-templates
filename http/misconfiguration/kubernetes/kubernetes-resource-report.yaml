id: kubernetes-resource-report

info:
  name: Detect Overview Kubernetes Resource Report
  author: pussycat0x
  severity: medium
  description: Information Disclosure of Kubernetes Resource Report
  classification:
    cpe: cpe:2.3:a:kubernetes:kubernetes:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kubernetes
    product: kubernetes
  tags: kubernetes,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: kubernetes
        cpe: cpe:2.3:a:kubernetes:kubernetes:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Overview - Kubernetes Resource Report"

      - type: status
        status:
          - 200
