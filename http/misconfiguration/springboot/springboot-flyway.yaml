id: springboot-flyway

info:
  name: Springboot Flyway API
  author: ELSFA7110
  severity: low
  description: This endpoint to retrieve the migrations
  reference:
    - https://docs.spring.io/spring-boot/docs/current/actuator-api/htmlsingle/#flyway
  classification:
    cpe: cpe:2.3:a:springboot:flyway:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: springboot
    product: flyway
  tags: misconfig,springboot,exposure,flyway,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/flyway"
      - "{{BaseURL}}/actuator/flyway"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: flyway
        cpe: cpe:2.3:a:springboot:flyway:*:*:*:*:*:*:*:*
        part: body
        words:
          - "flywayBeans"

      - type: word
        name: flyway-2
        cpe: cpe:2.3:a:springboot:flyway:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"
          - "application/vnd.spring-boot.actuator"
          - "application/vnd.spring-boot.actuator.v1+json"
          - "application/vnd.spring-boot.actuator.v2+json"
        condition: or

      - type: status
        status:
          - 200
