id: springboot-logfile

info:
  name: Detects Springboot Logfile Actuator
  author: DhiyaneshDK
  severity: low
  description: Springboot Logfile Actuator is exposed.
  reference:
    - https://raw.githubusercontent.com/maurosoria/dirsearch/master/db/dicc.txt
  classification:
    cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    shodan-query: title:"Eureka"
    vendor: springboot
    product: springboot
  tags: misconfig,springboot,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/logfile"
      - "{{BaseURL}}/actuator/logfile"
      - "{{BaseURL}}/actuators/logfile"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: springboot
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'springframework.web.HttpRequestMethodNotSupportedException'
          - 'INFO'
        condition: and

      - type: word
        name: springboot-2
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/plain"

      - type: status
        status:
          - 200
