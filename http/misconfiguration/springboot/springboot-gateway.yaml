id: springboot-gateway

info:
  name: Detect Spring Gateway Actuator
  author: wdahlenb
  severity: medium
  description: Sensitive environment variables may not be masked
  reference:
    - https://wya.pl/2021/12/20/bring-your-own-ssrf-the-gateway-actuator/
  classification:
    cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: springboot
    product: springboot
  tags: springboot,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/gateway/routes"
      - "{{BaseURL}}/actuator/gateway/routes"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: springboot
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        part: body
        words:
          - "predicate"
          - "route_id"
        condition: and

      - type: word
        name: springboot-2
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
