id: springboot-loggers

info:
  name: Springboot Loggers - Exposure
  author: that_juan_,dwisiswant0,wdahlenb,TheZakMan
  severity: low
  description: Springboot Loggers is exposed.
  classification:
    cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    verified: true
    vendor: springboot
    product: springboot
  tags: springboot,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/loggers"
      - "{{BaseURL}}/actuator/loggers"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: dsl
        name: springboot
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains(body, "\"loggers\"")'
          - 'contains_any(tolower(content_type), "application/json", "application/vnd.spring-boot")'
        condition: and

      - type: word
        name: springboot-2
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"levels"'
          - '"configuredLevel"'
          - '"effectiveLevel"'
        condition: or
