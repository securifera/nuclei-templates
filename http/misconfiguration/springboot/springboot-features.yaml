id: springboot-features

info:
  name: Detects Springboot Features Actuator
  author: DhiyaneshDK
  severity: low
  description: Springboot Features Actuator is exposed.
  classification:
    cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"Eureka"
    vendor: springboot
    product: springboot
  tags: misconfig,springboot,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/features"
      - "{{BaseURL}}/actuator/features"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: springboot
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"enabled":['
          - '"disabled":['
        condition: and

      - type: word
        name: springboot-2
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"
          - "application/vnd.spring-boot.actuator"
          - "application/vnd.spring-boot.actuator.v1+json"
        condition: or

      - type: status
        status:
          - 200
