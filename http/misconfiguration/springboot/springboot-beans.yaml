id: springboot-beans

info:
  name: Detect Springboot Beans Actuator
  author: ajaysenr
  severity: low
  description: Displays a complete list of all the Spring beans in the application
  classification:
    cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: springboot
    product: springboot
  tags: springboot,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/beans"
      - "{{BaseURL}}/actuator/beans"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: springboot
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"type"'
          - '"beans"'
          - '"dependencies"'
          - '"scope"'
        condition: and

      - type: status
        status:
          - 200

      - type: word
        name: springboot-2
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        words:
          - "application/json"
          - "application/vnd.spring-boot.actuator"
          - "application/vnd.spring-boot.actuator.v1+json"
        condition: or
        part: header
