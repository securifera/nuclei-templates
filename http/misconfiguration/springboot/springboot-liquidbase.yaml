id: springboot-liquidbase

info:
  name: Springboot Liquidbase API
  author: ELSFA7110
  severity: low
  description: This liquibase endpoint provides information about database changes
  reference:
    - https://docs.spring.io/spring-boot/docs/current/actuator-api/htmlsingle/#liquibase
  classification:
    cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: springboot
    product: springboot
  tags: misconfig,springboot,exposure,liquibase,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/liquibase"
      - "{{BaseURL}}/actuator/liquibase"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: springboot
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'liquibase'
          - '"FILENAME":"'
        condition: and

      - type: word
        name: springboot-2
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"
          - "application/vnd.spring-boot.actuator"
          - "application/vnd.spring-boot.actuator.v1+json"
          - "application/vnd.spring-boot.actuator.v2+json"
        condition: or

      - type: status
        status:
          - 200
