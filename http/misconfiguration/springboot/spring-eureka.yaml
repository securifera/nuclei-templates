id: spring-eureka

info:
  name: Spring Eureka Exposure
  author: tess
  severity: low
  description: Spring Eureka is exposed.
  classification:
    cpe: cpe:2.3:a:eureka:eureka:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Eureka"
    vendor: eureka
    product: eureka
  tags: misconfig,springboot,exposure,eureka,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: eureka
        cpe: cpe:2.3:a:eureka:eureka:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Eureka'
          - 'Toggle navigation'
          - 'Last 1000 since startup'
        condition: and

      - type: status
        status:
          - 200
