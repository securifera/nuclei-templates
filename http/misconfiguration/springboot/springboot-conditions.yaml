id: springboot-conditions

info:
  name: Detect Springboot Conditions Actuator
  author: DhiyaneshDK
  severity: low
  description: Springboot Conditions Actuator is exposed.
  reference:
    - https://raw.githubusercontent.com/maurosoria/dirsearch/master/db/dicc.txt
  classification:
    cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"Eureka"
    vendor: springboot
    product: springboot
  tags: misconfig,springboot,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/conditions"
      - "{{BaseURL}}/actuator/conditions"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: springboot
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"positiveMatches":{'
          - '"unconditionalClasses":['
        condition: and

      - type: word
        name: springboot-2
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"
          - "application/vnd.spring-boot.actuator"
          - "application/vnd.spring-boot.actuator.v1+json"
        condition: or

      - type: status
        status:
          - 200
