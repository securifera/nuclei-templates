id: springboot-httptrace

info:
  name: Detect Springboot httptrace
  author: that_juan_,dwisiswant0,wdahlenb
  severity: low
  description: View recent HTTP requests and responses
  classification:
    cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: springboot
    product: springboot
  tags: springboot,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/httptrace"
      - "{{BaseURL}}/actuator/httptrace"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: springboot
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"traces"'
          - '"timestamp"'
          - '"principal"'
          - '"session"'
        condition: and

      - type: word
        name: springboot-2
        cpe: cpe:2.3:a:springboot:springboot:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"
          - "application/vnd.spring-boot.actuator"
          - "application/vnd.spring-boot.actuator.v1+json"
        condition: or

      - type: status
        status:
          - 200
