id: opache-control-panel

info:
  name: Opache control Panel - Unauthenticated Access
  author: pussycat0x
  severity: medium
  description: Opache control Panel is exposed.
  classification:
    cpe: cpe:2.3:a:opache:opache:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"Opcache Control Panel"
    vendor: opache
    product: opache
  tags: misconfig,opache,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/ocp.php"

    stop-at-first-match: true
    matchers:
      - type: dsl
        name: opache
        cpe: cpe:2.3:a:opache:opache:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Opcache Control Panel", "Reset", "Files")'
        condition: and
