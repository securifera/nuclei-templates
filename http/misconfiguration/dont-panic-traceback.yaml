id: dont-panic-traceback

info:
  name: DON'T PANIC Traceback
  author: ritikchaddha
  severity: low
  description: |
    DON'T PANIC Traceback was detected.
  classification:
    cpe: cpe:2.3:a:dont-panic:dont-panic:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Debugger"
    vendor: dont-panic
    product: dont-panic
  tags: traceback,dont-panic,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: dont-panic
        cpe: cpe:2.3:a:dont-panic:dont-panic:*:*:*:*:*:*:*:*
        part: body
        words:
          - "most recent call last"
          - "Traceback"
          - "DON'T PANIC"
        condition: and
        case-insensitive: true
