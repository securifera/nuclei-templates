id: unauthenticated-popup-upload

info:
  name: Unauthenticated Popup File Upload - Detect
  author: DhiyaneshDk
  severity: info
  description: Endpoints where files can be uploaded without authentication were detected.
  reference:
    - https://www.exploit-db.com/ghdb/6671
  classification:
    cpe: cpe:2.3:a:unauthenticated-popup-upload:unauthenticated-popup-upload:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: unauthenticated-popup-upload
    product: unauthenticated-popup-upload
  tags: edb,fileupload,misconfig,intrusive,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/RichWidgets/Popup_Upload.aspx"

    matchers-condition: and
    matchers:
      - type: word
        name: unauthenticated-popup-upload
        cpe: cpe:2.3:a:unauthenticated-popup-upload:unauthenticated-popup-upload:*:*:*:*:*:*:*:*
        words:
          - "Popup Upload"
        part: body

      - type: status
        status:
          - 200
