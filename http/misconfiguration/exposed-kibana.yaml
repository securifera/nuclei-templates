id: exposed-kibana

info:
  name: Exposed Kibana
  author: Shine
  severity: medium
  description: Kibana is exposed.
  classification:
    cpe: cpe:2.3:a:kibana:kibana:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: kibana
    product: kibana
  tags: kibana,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/app/kibana'
      - '{{BaseURL}}/app/kibana/'

    matchers-condition: and
    matchers:
      - type: word
        name: kibana
        cpe: cpe:2.3:a:kibana:kibana:*:*:*:*:*:*:*:*
        words:
          - 'kibanaWelcomeView'
          - 'kibanaWelcomeLogo'
          - 'kibanaWelcomeTitle'

      - type: status
        status:
          - 200
