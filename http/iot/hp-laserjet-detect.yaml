id: hp-laserjet-detect

info:
  name: HP LaserJet Professional Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: HP LaserJet Professional panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6459
  classification:
    cpe: cpe:2.3:a:hp-laserjet:hp-laserjet:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: hp-laserjet
    product: hp-laserjet
  tags: iot,edb,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/SSI/index.htm"

    matchers-condition: and
    matchers:
      - type: word
        name: hp-laserjet
        cpe: cpe:2.3:a:hp-laserjet:hp-laserjet:*:*:*:*:*:*:*:*
        words:
          - 'HP LaserJet Professional'
        part: body

      - type: status
        status:
          - 200
