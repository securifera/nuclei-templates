id: snapdrop-detect

info:
  name: Snapdrop Detect
  author: tess
  severity: info
  description: Snapdrop panel was detected.
  classification:
    cpe: cpe:2.3:a:snapdrop:snapdrop:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Snapdrop"
    vendor: snapdrop
    product: snapdrop
  tags: iot,snapdrop,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: snapdrop
        cpe: cpe:2.3:a:snapdrop:snapdrop:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'content="Snapdrop"'

      - type: status
        status:
          - 200
