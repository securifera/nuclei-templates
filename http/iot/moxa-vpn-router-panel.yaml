id: moxa-vpn-router-panel

info:
  name: Moxa OnCell VPN - Login Panel
  author: biero-el-corridor
  severity: info
  description: |
    Moxa OnCell VPN panel was discovered.
  classification:
    cpe: cpe:2.3:a:vpn:vpn:*:*:*:*:*:*:*:*
  metadata:
    shodan-query: http.favicon.hash:-234487373
    verified: true
    max-request: 1
    vendor: vpn
    product: vpn
  tags: moxo,oncel,vpn,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Login.asp"

    matchers-condition: and
    matchers:
      - type: word
        name: vpn
        cpe: cpe:2.3:a:vpn:vpn:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Moxa OnCell'
          - 'Login'
        condition: and

      - type: status
        status:
          - 200
