id: huawei-home-gateway

info:
  name: HUAWEI Home Gateway HG658d
  author: dhiyaneshDK
  severity: info
  description: HUAWEI Home Gateway panel was detected.
  classification:
    cpe: cpe:2.3:a:huawei:huawei:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"HUAWEI Home Gateway HG658d"
    vendor: huawei
    product: huawei
  tags: iot,huawei,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: huawei
        cpe: cpe:2.3:a:huawei:huawei:*:*:*:*:*:*:*:*
        words:
          - '<title>HUAWEI Home Gateway HG658d</title>'

      - type: status
        status:
          - 200
