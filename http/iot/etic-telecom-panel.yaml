id: etic-telecom-panel

info:
  name: ETIC Telecom Device Login - Panel
  author: biero-el-corridor
  severity: info
  description: |
    ETIC Telecom device login panel was discovered
  classification:
    cpe: cpe:2.3:a:etic:etic:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"ETIC Telecom"
    vendor: etic
    product: etic
  tags: etic,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.htm"
      - "{{BaseURL}}/common.etic_cgi_portal/login.html"

    matchers-condition: and
    matchers:
      - type: word
        name: etic
        cpe: cpe:2.3:a:etic:etic:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Please identify yourself"
          - "ETIC Telecom device login"
        condition: and

      - type: status
        status:
          - 200
