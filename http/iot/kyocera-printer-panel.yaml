id: kyocera-printer-panel

info:
  name: Kyocera Printer Panel - Detect
  author: gy741
  severity: info
  description: |
    Kyocera printer panel was detected.
  classification:
    cpe: cpe:2.3:a:kyocera:d-copia253mf_plus_firmware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-50306417
    product: d-copia253mf_plus_firmware
    vendor: kyocera
    fofa-query: icon_hash=-50306417
  tags: iot,panel,kyocera,printer,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: d-copia253mf_plus_firmware
        cpe: cpe:2.3:a:kyocera:d-copia253mf_plus_firmware:*:*:*:*:*:*:*:*
        part: body
        words:
          - '/startwlm/Start_Wlm.htm'

      - type: status
        status:
          - 200
