id: ulanzi-clock

info:
  name: Ulanzi Clock Detect
  author: fabaff
  severity: info
  description: Ulanzi Clock panel was detected.
  classification:
    cpe: cpe:2.3:a:ulanzi:ulanzi:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ulanzi
    product: ulanzi
  tags: panel,ulanzi,iot,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: ulanzi
        cpe: cpe:2.3:a:ulanzi:ulanzi:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Ulanzi Clock</title>'

      - type: status
        status:
          - 200
