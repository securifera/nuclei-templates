id: open-mjpg-streamer

info:
  name: open-mjpg-streamer
  author: gboddin
  severity: medium
  description: Open mjpg-streamer service sharing webcam/camera feed
  reference:
    - https://github.com/jacksonliam/mjpg-streamer
  classification:
    cpe: cpe:2.3:a:open-mjpg-streamer:open-mjpg-streamer:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: open-mjpg-streamer
    product: open-mjpg-streamer
  tags: iot,webcam,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/?action=stream"

    max-size: 2048

    matchers-condition: and
    matchers:
      - type: word
        name: open-mjpg-streamer
        cpe: cpe:2.3:a:open-mjpg-streamer:open-mjpg-streamer:*:*:*:*:*:*:*:*
        words:
          - 'MJPG-Streamer/0.2'
        part: header

      - type: status
        status:
          - 200
