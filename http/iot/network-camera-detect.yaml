id: network-camera-detect

info:
  name: Various Online Devices Detection (Network Camera)
  author: iamthefrogy
  severity: info
  description: Network camera panel was detected.
  classification:
    cpe: cpe:2.3:a:network-camera:network-camera:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: network-camera
    product: network-camera
  tags: iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/CgiStart?page=Single"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        name: network-camera
        cpe: cpe:2.3:a:network-camera:network-camera:*:*:*:*:*:*:*:*
        words:
          - <TITLE>Network Camera</TITLE>
