id: epson-wf-series

info:
  name: Epson WF Series Detection
  author: aashiq
  severity: info
  description: Searches for Epson WF series printers on the domain
  classification:
    cpe: cpe:2.3:a:epson-wf-series:epson-wf-series:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: epson-wf-series
    product: epson-wf-series
  tags: iot,printer,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/PRESENTATION/HTML/TOP/PRTINFO.HTML"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: epson-wf-series
        cpe: cpe:2.3:a:epson-wf-series:epson-wf-series:*:*:*:*:*:*:*:*
        words:
          - "SEIKO EPSON"
