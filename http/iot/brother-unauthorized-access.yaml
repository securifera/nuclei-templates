id: brother-unauthorized-access

info:
  name: Brother Printer
  author: pussycat0x
  severity: medium
  description: Brother Printer unauthorized access was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6889
  classification:
    cpe: cpe:2.3:a:brother-unauthorized-access:brother-unauthorized-access:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: brother-unauthorized-access
    product: brother-unauthorized-access
  tags: iot,printer,unauth,vuln,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/net/net/net.html"

    matchers-condition: and
    matchers:
      - type: word
        name: brother-unauthorized-access
        cpe: cpe:2.3:a:brother-unauthorized-access:brother-unauthorized-access:*:*:*:*:*:*:*:*
        words:
          - "Brother Industries"
          - "Network Status"
        condition: and

      - type: status
        status:
          - 200
