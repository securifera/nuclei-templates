id: webtools-home

info:
  name: Webtools Home
  author: dhiyaneshDK
  severity: info
  description: Webtools panel was detected.
  classification:
    cpe: cpe:2.3:a:webtools-home:webtools-home:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Webtools"
    vendor: webtools-home
    product: webtools-home
  tags: iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wt2parser.cgi?home_en"

    matchers-condition: and
    matchers:
      - type: word
        name: webtools-home
        cpe: cpe:2.3:a:webtools-home:webtools-home:*:*:*:*:*:*:*:*
        words:
          - '<title>WebTools | Home</title>'

      - type: status
        status:
          - 200
