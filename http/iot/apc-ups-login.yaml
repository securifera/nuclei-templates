id: apc-ups-login

info:
  name: APC UPS Login - Detect
  author: droberson
  severity: info
  description: APC UPS panel was detected.
  classification:
    cpe: cpe:2.3:a:apc-ups:apc-ups:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: title:"APC | Log On"
    vendor: apc-ups
    product: apc-ups
  tags: iot,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/logon.htm"

    matchers-condition: and
    matchers:
      - type: word
        name: apc-ups
        cpe: cpe:2.3:a:apc-ups:apc-ups:*:*:*:*:*:*:*:*
        words:
          - '<title>APC | Log On</title>'
        part: body

      - type: status
        status:
          - 200
