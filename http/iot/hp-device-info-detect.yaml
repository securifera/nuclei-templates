id: hp-device-info-detect

info:
  name: HP Device Info Detection
  author: pussycat0x
  severity: low
  description: Internal info is disclosed to external users in HP Device.
  reference:
    - https://www.exploit-db.com/ghdb/6905
  classification:
    cpe: cpe:2.3:a:hp-device:hp-device:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: hp-device
    product: hp-device
  tags: iot,hp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/hp/device/DeviceInformation/View"

    matchers-condition: and
    matchers:
      - type: word
        name: hp-device
        cpe: cpe:2.3:a:hp-device:hp-device:*:*:*:*:*:*:*:*
        words:
          - "Device Information"
          - "hp"
        condition: and

      - type: status
        status:
          - 200
