id: ampguard-wifi-setup

info:
  name: AmpGuard Wifi Setup
  author: pussycat0x
  severity: info
  description: AmpGuard wifi setup panel detected.
  classification:
    cpe: cpe:2.3:a:ampguard:wifi:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"AmpGuard wifi setup"
    vendor: ampguard
    product: wifi
  tags: ampguard,iot,setup,wifi,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: wifi
        cpe: cpe:2.3:a:ampguard:wifi:*:*:*:*:*:*:*:*
        part: body
        words:
          - "AmpGuard wifi setup"

      - type: status
        status:
          - 200
