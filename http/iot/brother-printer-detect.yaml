id: brother-printer-detect

info:
  name: Brother Printer
  author: pussycat0x
  severity: low
  description: Brother Printer panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6889
  classification:
    cpe: cpe:2.3:a:printer:printer:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: printer
    product: printer
  tags: iot,printer,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/general/status.html"

    matchers-condition: and
    matchers:
      - type: word
        name: printer
        cpe: cpe:2.3:a:printer:printer:*:*:*:*:*:*:*:*
        words:
          - "Brother Industries"

      - type: status
        status:
          - 200
