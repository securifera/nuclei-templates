id: nuuno-network-login

info:
  name: NUUO Network Video Recorder Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: NUUO Network Video Recorder login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6840
  classification:
    cpe: cpe:2.3:a:nuuno-network:nuuno-network:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: nuuno-network
    product: nuuno-network
  tags: iot,panel,nuuo,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: nuuno-network
        cpe: cpe:2.3:a:nuuno-network:nuuno-network:*:*:*:*:*:*:*:*
        words:
          - '<title>NUUO Network Video Recorder Login</title>'
        part: body

      - type: status
        status:
          - 200
