id: homeworks-illumination

info:
  name: HomeWorks Illumination Web Keypad
  author: geeknik
  severity: low
  description: HomeWorks Illumination Web Keypad panel was detected.
  reference:
    - https://www.lutron.com
  classification:
    cpe: cpe:2.3:a:homeworks:homeworks:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"HomeWorks Illumination Web Keypad"
    vendor: homeworks
    product: homeworks
  tags: misconfig,iot,homeworks,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: homeworks
        cpe: cpe:2.3:a:homeworks:homeworks:*:*:*:*:*:*:*:*
        words:
          - "HomeWorks Illumination Web Keypad"
          - "Lutron HomeWorks"
        condition: and

      - type: status
        status:
          - 200
