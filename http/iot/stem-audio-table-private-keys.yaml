id: stem-audio-table-private-keys

info:
  name: Detect Private Key on STEM Audio Table
  author: gy741
  severity: high
  description: Private Key on STEM audio table was detected.
  reference:
    - https://blog.grimm-co.com/2021/06/the-walls-have-ears.html
  classification:
    cpe: cpe:2.3:a:stem:stem:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: stem
    product: stem
  tags: stem,config,exposure,iot,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/privatekey.pem"

    matchers-condition: and
    matchers:
      - type: word
        name: stem
        cpe: cpe:2.3:a:stem:stem:*:*:*:*:*:*:*:*
        words:
          - "BEGIN RSA PRIVATE KEY"

      - type: status
        status:
          - 200

      - type: dsl
        name: stem-2
        cpe: cpe:2.3:a:stem:stem:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(tolower(body), "<html")'
