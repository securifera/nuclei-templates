id: netsurveillance-web

info:
  name: NETSurveillance Web Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: NETSurveillance Web panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/7288
  classification:
    cpe: cpe:2.3:a:netsurveillance-web:netsurveillance-web:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"NETSurveillance WEB"
    google-query: intitle:"NETSurveillance WEB"
    vendor: netsurveillance-web
    product: netsurveillance-web
  tags: tech,iot,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/Login.htm'

    matchers-condition: and
    matchers:
      - type: word
        name: netsurveillance-web
        cpe: cpe:2.3:a:netsurveillance-web:netsurveillance-web:*:*:*:*:*:*:*:*
        words:
          - "<title>NetSurveillance WEB</title>"

      - type: status
        status:
          - 200
