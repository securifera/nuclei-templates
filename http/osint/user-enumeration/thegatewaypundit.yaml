id: thegatewaypundit

info:
  name: Thegatewaypundit User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Thegatewaypundit user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:thegatewaypundit:thegatewaypundit:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: thegatewaypundit
    product: thegatewaypundit
  tags: osint,osint-political,thegatewaypundit,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.thegatewaypundit.com/author/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: thegatewaypundit
        cpe: cpe:2.3:a:thegatewaypundit:thegatewaypundit:*:*:*:*:*:*:*:*
        part: body
        words:
          - "summary"
