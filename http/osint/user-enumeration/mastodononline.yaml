id: mastodononline

info:
  name: Mastodon.online User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Mastodon.online user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:mastodononline:mastodononline:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: mastodononline
    product: mastodononline
  tags: osint,osint-social,mastodononline,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://mastodon.online/@{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: mastodononline
        cpe: cpe:2.3:a:mastodononline:mastodononline:*:*:*:*:*:*:*:*
        part: body
        words:
          - "@mastodon.online) - Mastodon</title>"
