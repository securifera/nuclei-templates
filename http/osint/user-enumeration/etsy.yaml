id: etsy

info:
  name: Etsy User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Etsy user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:etsy:etsy:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: etsy
    product: etsy
  tags: osint,osint-shopping,etsy,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.etsy.com/people/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: etsy
        cpe: cpe:2.3:a:etsy:etsy:*:*:*:*:*:*:*:*
        part: body
        words:
          - " on Etsy</title>"
