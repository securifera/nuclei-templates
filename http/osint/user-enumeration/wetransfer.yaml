id: wetransfer

info:
  name: WeTransfer User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: WeTransfer user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:wetransfer:wetransfer:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: wetransfer
    product: wetransfer
  tags: osint,osint-misc,wetransfer,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://{{user}}.wetransfer.com"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: wetransfer
        cpe: cpe:2.3:a:wetransfer:wetransfer:*:*:*:*:*:*:*:*
        part: body
        words:
          - "default_recipient_email"
