  severity: info
  description: Social.bund.de user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:socialbundde:socialbundde:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
