id: 3dtoday

info:
  name: 3dtoday User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: 3dtoday user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:3dtoday:3dtoday:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: 3dtoday
    product: 3dtoday
  tags: osint,osint-hobby,3dtoday,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://3dtoday.ru/blogs/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: 3dtoday
        cpe: cpe:2.3:a:3dtoday:3dtoday:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Блог владельца 3d-принтера"
