id: social-msdn

info:
  name: Social msdn User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Social msdn user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:social-msdn:social-msdn:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: social-msdn
    product: social-msdn
  tags: osint,osint-social,social-msdn,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://social.msdn.microsoft.com/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: social-msdn
        cpe: cpe:2.3:a:social-msdn:social-msdn:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Member Since"
