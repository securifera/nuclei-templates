id: librarything

info:
  name: LibraryThing User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: LibraryThing user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:librarything:librarything:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: librarything
    product: librarything
  tags: osint,osint-hobby,librarything,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.librarything.com/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: librarything
        cpe: cpe:2.3:a:librarything:librarything:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Collections"
