id: streamlabs

info:
  name: StreamLabs User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: StreamLabs user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:streamlabs:streamlabs:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: streamlabs
    product: streamlabs
  tags: osint,osint-finance,streamlabs,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://streamlabs.com/api/v6/user/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: streamlabs
        cpe: cpe:2.3:a:streamlabs:streamlabs:*:*:*:*:*:*:*:*
        part: body
        words:
          - "display_name"
