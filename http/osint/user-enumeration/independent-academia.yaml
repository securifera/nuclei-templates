id: independent-academia

info:
  name: Independent academia User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Independent academia user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:independent-academia:independent-academia:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: independent-academia
    product: independent-academia
  tags: osint,osint-hobby,independent-academia,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://independent.academia.edu/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: independent-academia
        cpe: cpe:2.3:a:independent-academia:independent-academia:*:*:*:*:*:*:*:*
        part: body
        words:
          - "- Academia.edu"
