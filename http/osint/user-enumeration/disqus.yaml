id: disqus

info:
  name: Disqus User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Disqus user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:disqus:disqus:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: disqus
    product: disqus
  tags: osint,osint-social,disqus,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://disqus.com/by/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: disqus
        cpe: cpe:2.3:a:disqus:disqus:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Disqus Profile"
