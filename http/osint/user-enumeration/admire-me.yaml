id: admire-me

info:
  name: Admire me User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Admire me user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:admire:admire:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: admire
    product: admire
  tags: osint,osint-porn,admire-me,discovery

self-contained: true

