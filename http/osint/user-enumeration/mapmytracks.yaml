id: mapmytracks

info:
  name: MapMyTracks User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: MapMyTracks user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:mapmytracks:mapmytracks:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: mapmytracks
    product: mapmytracks
  tags: osint,osint-health,mapmytracks,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.mapmytracks.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: mapmytracks
        cpe: cpe:2.3:a:mapmytracks:mapmytracks:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Daily distance this week"
