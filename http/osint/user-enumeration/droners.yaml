id: droners

info:
  name: Droners User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Droners user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:droners:droners:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: droners
    product: droners
  tags: osint,osint-hobby,droners,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://droners.io/accounts/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: droners
        cpe: cpe:2.3:a:droners:droners:*:*:*:*:*:*:*:*
        part: body
        words:
          - "- Professional Drone Pilot"
