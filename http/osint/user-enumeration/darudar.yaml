id: darudar

info:
  name: Darudar User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Darudar user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:darudar:darudar:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: darudar
    product: darudar
  tags: osint,osint-misc,darudar,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://darudar.org/users/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: darudar
        cpe: cpe:2.3:a:darudar:darudar:*:*:*:*:*:*:*:*
        part: body
        words:
          - ". Дарудар"
