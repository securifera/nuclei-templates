id: imgbb

info:
  name: ImgBB User Name Information - Detect
  author: cheesymoon
  severity: info
  description: ImgBB user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:imgbb:imgbb:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: imgbb
    product: imgbb
  tags: osint,osint-image,imgbb,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://{{user}}.imgbb.com"

    matchers-condition: and
    matchers:
      - type: word
        name: imgbb
        cpe: cpe:2.3:a:imgbb:imgbb:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Most recent"
          - "Followers"
        condition: and

      - type: status
        status:
          - 200
