id: zillow

info:
  name: Zillow User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Zillow user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:zillow:zillow:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: zillow
    product: zillow
  tags: osint,osint-shopping,zillow,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.zillow.com/profile/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: zillow
        cpe: cpe:2.3:a:zillow:zillow:*:*:*:*:*:*:*:*
        part: body
        words:
          - "- Real Estate Agent"
