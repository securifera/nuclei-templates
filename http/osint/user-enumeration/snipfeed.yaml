id: snipfeed

info:
  name: Snipfeed User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Snipfeed user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:snipfeed:snipfeed:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: snipfeed
    product: snipfeed
  tags: osint,osint-misc,snipfeed,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://snipfeed.co/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: snipfeed
        cpe: cpe:2.3:a:snipfeed:snipfeed:*:*:*:*:*:*:*:*
        part: body
        words:
          - "creatorLink"
