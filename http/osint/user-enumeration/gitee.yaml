id: gitee

info:
  name: Gitee User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Gitee user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:gitee:gitee:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: gitee
    product: gitee
  tags: osint,osint-coding,gitee,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://gitee.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: gitee
        cpe: cpe:2.3:a:gitee:gitee:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Commits, issues, and pull requests will appear"
