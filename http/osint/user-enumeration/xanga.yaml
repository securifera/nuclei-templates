id: xanga

info:
  name: Xanga User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Xanga user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:xanga:xanga:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: xanga
    product: xanga
  tags: osint,osint-blog,xanga,discovery

self-contained: true

http:
  - method: GET
    path:
      - "http://{{user}}.xanga.com/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: xanga
        cpe: cpe:2.3:a:xanga:xanga:*:*:*:*:*:*:*:*
        part: body
        words:
          - "s Xanga Site | Just"
