id: artists-clients

info:
  name: Artists & Clients User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Artists & Clients user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:artists-clients:artists-clients:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: artists-clients
    product: artists-clients
  tags: osint,osint-art,artists-clients,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://artistsnclients.com/people/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: artists-clients
        cpe: cpe:2.3:a:artists-clients:artists-clients:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Member Since"
