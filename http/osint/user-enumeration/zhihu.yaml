id: zhihu

info:
  name: Zhihu User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Zhihu user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:zhihu:zhihu:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: zhihu
    product: zhihu
  tags: osint,osint-social,zhihu,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.zhihu.com/people/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: zhihu
        cpe: cpe:2.3:a:zhihu:zhihu:*:*:*:*:*:*:*:*
        part: body
        words:
          - "zhihu:voteupCount"
