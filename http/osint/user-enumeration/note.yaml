id: note

info:
  name: Note User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Note user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:note:note:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: note
    product: note
  tags: osint,osint-social,note,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://note.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: note
        cpe: cpe:2.3:a:note:note:*:*:*:*:*:*:*:*
        part: body
        words:
          - "フォロワー"
