id: dailymotion

info:
  name: Dailymotion User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Dailymotion user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:dailymotion:dailymotion:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: dailymotion
    product: dailymotion
  tags: osint,osint-video,dailymotion,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.dailymotion.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: dailymotion
        cpe: cpe:2.3:a:dailymotion:dailymotion:*:*:*:*:*:*:*:*
        part: body
        words:
          - "og:url"
