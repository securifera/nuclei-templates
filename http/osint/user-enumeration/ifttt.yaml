id: ifttt

info:
  name: IFTTT User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: IFTTT user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:ifttt:ifttt:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: ifttt
    product: ifttt
  tags: osint,osint-misc,ifttt,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://ifttt.com/p/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: ifttt
        cpe: cpe:2.3:a:ifttt:ifttt:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Joined"
