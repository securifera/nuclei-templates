id: bimpos

info:
  name: Bimpos User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Bimpos user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:bimpos:bimpos:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: bimpos
    product: bimpos
  tags: osint,osint-tech,bimpos,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://ask.bimpos.com/user/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: bimpos
        cpe: cpe:2.3:a:bimpos:bimpos:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>User "
