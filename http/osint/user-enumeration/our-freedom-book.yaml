id: our-freedom-book

info:
  name: Our Freedom Book User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Our Freedom Book user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:our-freedom-book:our-freedom-book:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: our-freedom-book
    product: our-freedom-book
  tags: osint,osint-social,our-freedom-book,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.ourfreedombook.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: our-freedom-book
        cpe: cpe:2.3:a:our-freedom-book:our-freedom-book:*:*:*:*:*:*:*:*
        part: body
        words:
          - "meta property=\"og:"
