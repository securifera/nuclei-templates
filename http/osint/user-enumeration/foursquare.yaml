id: foursquare

info:
  name: Foursquare User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Foursquare user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:foursquare:foursquare:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: foursquare
    product: foursquare
  tags: osint,osint-social,foursquare,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://foursquare.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: foursquare
        cpe: cpe:2.3:a:foursquare:foursquare:*:*:*:*:*:*:*:*
        part: body
        words:
          - "on Foursquare</title>"
