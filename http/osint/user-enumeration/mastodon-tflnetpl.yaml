id: mastodon-tflnetpl

info:
  name: Mastodon-tfl.net.pl User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Mastodon-tfl.net.pl user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:mastodon-tflnetpl:mastodon-tflnetpl:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: mastodon-tflnetpl
    product: mastodon-tflnetpl
  tags: osint,osint-social,mastodon-tflnetpl,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://tfl.net.pl/@{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: mastodon-tflnetpl
        cpe: cpe:2.3:a:mastodon-tflnetpl:mastodon-tflnetpl:*:*:*:*:*:*:*:*
        part: body
        words:
          - "@tfl.net.pl"
