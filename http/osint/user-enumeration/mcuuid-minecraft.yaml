id: mcuuid-minecraft

info:
  name: MCUUID (Minecraft) User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: MCUUID (Minecraft) user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:mcuuid-minecraft:mcuuid-minecraft:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: mcuuid-minecraft
    product: mcuuid-minecraft
  tags: osint,osint-gaming,mcuuid-minecraft,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://playerdb.co/api/player/minecraft/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: mcuuid-minecraft
        cpe: cpe:2.3:a:mcuuid-minecraft:mcuuid-minecraft:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Successfully found player by given ID."
