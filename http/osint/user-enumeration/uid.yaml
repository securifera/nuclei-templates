id: uid

info:
  name: Uid User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Uid user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:uid:uid:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: uid
    product: uid
  tags: osint,osint-social,uid,discovery

self-contained: true

http:
  - method: GET
    path:
      - "http://uid.me/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: uid
        cpe: cpe:2.3:a:uid:uid:*:*:*:*:*:*:*:*
        part: body
        words:
          - "- uID.me"
