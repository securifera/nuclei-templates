id: contactossex

info:
  name: Contactos.sex User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Contactos.sex user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:contactossex:contactossex:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: contactossex
    product: contactossex
  tags: osint,osint-porn,contactossex,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.contactossex.com/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: contactossex
        cpe: cpe:2.3:a:contactossex:contactossex:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Información Personal"
