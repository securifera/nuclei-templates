id: patronite

info:
  name: Patronite User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Patronite user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:patronite:patronite:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: patronite
    product: patronite
  tags: osint,osint-finance,patronite,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://patronite.pl/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: patronite
        cpe: cpe:2.3:a:patronite:patronite:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Zostań Patronem"
