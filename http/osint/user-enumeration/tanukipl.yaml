id: tanukipl

info:
  name: Tanuki.pl User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Tanuki.pl user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:tanukipl:tanukipl:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: tanukipl
    product: tanukipl
  tags: osint,osint-hobby,tanukipl,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://tanuki.pl/profil/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: tanukipl
        cpe: cpe:2.3:a:tanukipl:tanukipl:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Dołၜzył"
