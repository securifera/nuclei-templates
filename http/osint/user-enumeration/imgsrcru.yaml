id: imgsrcru

info:
  name: IMGSRC.RU User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: IMGSRC.RU user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:imgsrcru:imgsrcru:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: imgsrcru
    product: imgsrcru
  tags: osint,osint-images,imgsrcru,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://imgsrc.ru/main/user.php?lang=ru&user={{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: imgsrcru
        cpe: cpe:2.3:a:imgsrcru:imgsrcru:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Присоединился"
