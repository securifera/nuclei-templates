id: yelp

info:
  name: Yelp User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Yelp user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:yelp:yelp:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: yelp
    product: yelp
  tags: osint,osint-shopping,yelp,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.yelp.com/user_details?userid={{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: yelp
        cpe: cpe:2.3:a:yelp:yelp:*:*:*:*:*:*:*:*
        part: body
        words:
          - "'s Reviews |"
