id: behance

info:
  name: Behance User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Behance user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:behance:behance:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: behance
    product: behance
  tags: osint,osint-business,behance,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.behance.net/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: behance
        cpe: cpe:2.3:a:behance:behance:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Behance</title>"
