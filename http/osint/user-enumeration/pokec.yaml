id: pokec

info:
  name: Pokec User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Pokec user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:pokec:pokec:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: pokec
    product: pokec
  tags: osint,osint-social,pokec,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://pokec.azet.sk/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: pokec
        cpe: cpe:2.3:a:pokec:pokec:*:*:*:*:*:*:*:*
        part: body
        words:
          - "idReportedUser"
