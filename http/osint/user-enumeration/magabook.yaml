id: magabook

info:
  name: MAGABOOK User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: MAGABOOK user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:magabook:magabook:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: magabook
    product: magabook
  tags: osint,osint-social,magabook,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://magabook.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: magabook
        cpe: cpe:2.3:a:magabook:magabook:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Recent Updates"
