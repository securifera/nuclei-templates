id: unsplash

info:
  name: Unsplash User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Unsplash user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:unsplash:unsplash:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: unsplash
    product: unsplash
  tags: osint,osint-images,unsplash,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://unsplash.com/@{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: unsplash
        cpe: cpe:2.3:a:unsplash:unsplash:*:*:*:*:*:*:*:*
        part: body
        words:
          - "| Unsplash Photo Community"
