id: kongregate

info:
  name: Kongregate User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Kongregate user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:kongregate:kongregate:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: kongregate
    product: kongregate
  tags: osint,osint-gaming,kongregate,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.kongregate.com/accounts/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: kongregate
        cpe: cpe:2.3:a:kongregate:kongregate:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Member Since"
