id: cloudflare

info:
  name: Cloudflare User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Cloudflare user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:cloudflare:cloudflare:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: cloudflare
    product: cloudflare
  tags: osint,osint-tech,cloudflare,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://community.cloudflare.com/u/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: cloudflare
        cpe: cpe:2.3:a:cloudflare:cloudflare:*:*:*:*:*:*:*:*
        part: body
        words:
          - "- Cloudflare Community"
