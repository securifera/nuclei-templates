id: picsart

info:
  name: Picsart User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Picsart user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:picsart:picsart:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: picsart
    product: picsart
  tags: osint,osint-art,picsart,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://picsart.com/u/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: picsart
        cpe: cpe:2.3:a:picsart:picsart:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Profiles on Picsart"
