id: pronounspage

info:
  name: Pronouns.Page User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Pronouns.Page user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:pronounspage:pronounspage:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: pronounspage
    product: pronounspage
  tags: osint,osint-social,pronounspage,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://pronouns.page/api/profile/get/{{user}}?version=2"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: pronounspage
        cpe: cpe:2.3:a:pronounspage:pronounspage:*:*:*:*:*:*:*:*
        part: body
        words:
          - "username"
