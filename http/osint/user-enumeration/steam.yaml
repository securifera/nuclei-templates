id: steam

info:
  name: Steam User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Steam user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:steam:steam:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: steam
    product: steam
  tags: osint,osint-gaming,steam,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://steamcommunity.com/id/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: steam
        cpe: cpe:2.3:a:steam:steam:*:*:*:*:*:*:*:*
        part: body
        words:
          - "g_rgProfileData ="
