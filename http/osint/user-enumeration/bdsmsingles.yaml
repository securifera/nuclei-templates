  author: dwisiswant0
  severity: info
  description: Bdsmsingles user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:bdsmsingles:bdsmsingles:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: bdsmsingles
    product: bdsmsingles
  tags: osint,osint-porn,bdsmsingles,discovery

self-contained: true

http:
