id: akniga

info:
  name: Akniga User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Akniga user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:akniga:akniga:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: akniga
    product: akniga
  tags: osint,osint-hobby,akniga,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://akniga.org/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: akniga
        cpe: cpe:2.3:a:akniga:akniga:*:*:*:*:*:*:*:*
        part: body
        words:
          - " - Аудиокниги Клуб</title"
