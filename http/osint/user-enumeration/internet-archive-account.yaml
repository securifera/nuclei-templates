id: internet-archive-account

info:
  name: Internet Archive Account User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Internet Archive Account user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:internet-archive-account:internet-archive-account:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: internet-archive-account
    product: internet-archive-account
  tags: osint,osint-misc,internet-archive-account,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://archive.org/details/@{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: internet-archive-account
        cpe: cpe:2.3:a:internet-archive-account:internet-archive-account:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>User Account"
