id: biggerpockets

info:
  name: BiggerPockets User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: BiggerPockets user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:biggerpockets:biggerpockets:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: biggerpockets
    product: biggerpockets
  tags: osint,osint-finance,biggerpockets,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.biggerpockets.com/users/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: biggerpockets
        cpe: cpe:2.3:a:biggerpockets:biggerpockets:*:*:*:*:*:*:*:*
        part: body
        words:
          - "| BiggerPockets</title>"
