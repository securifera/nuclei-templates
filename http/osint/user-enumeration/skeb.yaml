id: skeb

info:
  name: Skeb User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Skeb user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:skeb:skeb:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: skeb
    product: skeb
  tags: osint,osint-art,skeb,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://skeb.jp/@{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: skeb
        cpe: cpe:2.3:a:skeb:skeb:*:*:*:*:*:*:*:*
        part: body
        words:
          - ") | Skeb"
