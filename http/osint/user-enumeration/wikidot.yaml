id: wikidot

info:
  name: Wikidot User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Wikidot user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:wikidot:wikidot:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: wikidot
    product: wikidot
  tags: osint,osint-social,wikidot,discovery

self-contained: true

http:
  - method: GET
    path:
      - "http://www.wikidot.com/user:info/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: wikidot
        cpe: cpe:2.3:a:wikidot:wikidot:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Wikidot.com:"
