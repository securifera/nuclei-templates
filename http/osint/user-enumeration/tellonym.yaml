id: tellonym

info:
  name: Tellonym User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Tellonym user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:tellonym:tellonym:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: tellonym
    product: tellonym
  tags: osint,osint-social,tellonym,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://tellonym.me/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: tellonym
        cpe: cpe:2.3:a:tellonym:tellonym:*:*:*:*:*:*:*:*
        part: body
        words:
          - "on Tellonym"
