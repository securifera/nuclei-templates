id: intigriti

info:
  name: Intigriti User Name Information - Detect
  author: philippedelteil
  severity: info
  description: Intigriti user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:intigriti:intigriti:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: intigriti
    product: intigriti
  tags: osint,osint-tech,intigriti,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://app.intigriti.com/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: word
        name: intigriti
        cpe: cpe:2.3:a:intigriti:intigriti:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Rep. all time</h5>'
          - '<title>{{user}} - Intigriti</title>'
        condition: and

      - type: word
        name: intigriti-2
        cpe: cpe:2.3:a:intigriti:intigriti:*:*:*:*:*:*:*:*
        part: body
        words:
          - "We didn't find what you're looking for"
        negative: true

      - type: status
        status:
          - 200
