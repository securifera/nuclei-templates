id: friendfinder

info:
  name: FriendFinder User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: FriendFinder user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:friendfinder:friendfinder:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: friendfinder
    product: friendfinder
  tags: osint,osint-dating,friendfinder,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://friendfinder.com/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: friendfinder
        cpe: cpe:2.3:a:friendfinder:friendfinder:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Last Visit:"
