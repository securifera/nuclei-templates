id: fabswingers

info:
  name: Fabswingers User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Fabswingers user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:fabswingers:fabswingers:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: fabswingers
    product: fabswingers
  tags: osint,osint-dating,fabswingers,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.fabswingers.com/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: fabswingers
        cpe: cpe:2.3:a:fabswingers:fabswingers:*:*:*:*:*:*:*:*
        part: body
        words:
          - "View Profile"
