id: apteka

info:
  name: Apteka User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Apteka user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:apteka:apteka:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: apteka
    product: apteka
  tags: osint,osint-social,apteka,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://apteka.ee/user/id/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: apteka
        cpe: cpe:2.3:a:apteka:apteka:*:*:*:*:*:*:*:*
        part: body
        words:
          - "/gifts/user_id/"
