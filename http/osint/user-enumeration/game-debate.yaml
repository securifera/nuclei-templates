id: game-debate

info:
  name: Game debate User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Game debate user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:game-debate:game-debate:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: game-debate
    product: game-debate
  tags: osint,osint-gaming,game-debate,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.game-debate.com/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: game-debate
        cpe: cpe:2.3:a:game-debate:game-debate:*:*:*:*:*:*:*:*
        part: body
        words:
          - "| , , GB pc game performance"
