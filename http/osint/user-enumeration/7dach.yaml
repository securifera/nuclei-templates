id: 7dach

info:
  name: 7dach User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: 7dach user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:7dach:7dach:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: 7dach
    product: 7dach
  tags: osint,osint-social,7dach,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://7dach.ru/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: 7dach
        cpe: cpe:2.3:a:7dach:7dach:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Информация / Профиль"
