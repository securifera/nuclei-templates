id: airline-pilot-life

info:
  name: Airline Pilot Life User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Airline Pilot Life user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:airline-pilot-life:airline-pilot-life:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: airline-pilot-life
    product: airline-pilot-life
  tags: osint,osint-social,airline-pilot-life,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://airlinepilot.life/u/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: airline-pilot-life
        cpe: cpe:2.3:a:airline-pilot-life:airline-pilot-life:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title> Profile -"
