id: engadget

info:
  name: Engadget User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Engadget user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:engadget:engadget:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: engadget
    product: engadget
  tags: osint,osint-tech,engadget,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.engadget.com/about/editors/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: engadget
        cpe: cpe:2.3:a:engadget:engadget:*:*:*:*:*:*:*:*
        part: body
        words:
          - "- Engadget</title>"
