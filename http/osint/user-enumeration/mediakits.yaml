id: mediakits

info:
  name: Mediakits User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Mediakits user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:mediakits:mediakits:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: mediakits
    product: mediakits
  tags: osint,osint-social,mediakits,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://restapi.mediakits.com/mediakits/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: mediakits
        cpe: cpe:2.3:a:mediakits:mediakits:*:*:*:*:*:*:*:*
        part: body
        words:
          - "displayName"
