id: uefconnect

info:
  name: Uefconnect User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Uefconnect user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:uefconnect:uefconnect:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: uefconnect
    product: uefconnect
  tags: osint,osint-business,uefconnect,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://uefconnect.uef.fi/en/person/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: uefconnect
        cpe: cpe:2.3:a:uefconnect:uefconnect:*:*:*:*:*:*:*:*
        part: body
        words:
          - "- UEFConnect</title>"
