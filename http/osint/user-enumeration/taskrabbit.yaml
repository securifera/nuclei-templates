id: taskrabbit

info:
  name: Taskrabbit User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Taskrabbit user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:taskrabbit:taskrabbit:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: taskrabbit
    product: taskrabbit
  tags: osint,osint-business,taskrabbit,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.taskrabbit.com/profile/{{user}}/about"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: taskrabbit
        cpe: cpe:2.3:a:taskrabbit:taskrabbit:*:*:*:*:*:*:*:*
        part: body
        words:
          - "’s Profile"
