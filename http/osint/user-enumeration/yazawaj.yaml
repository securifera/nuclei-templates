id: yazawaj

info:
  name: Yazawaj User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Yazawaj user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:yazawaj:yazawaj:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: yazawaj
    product: yazawaj
  tags: osint,osint-dating,yazawaj,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.yazawaj.com/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: yazawaj
        cpe: cpe:2.3:a:yazawaj:yazawaj:*:*:*:*:*:*:*:*
        part: body
        words:
          - "أنا"
