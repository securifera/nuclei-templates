id: armorgames

info:
  name: ArmorGames User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: ArmorGames user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:armorgames:armorgames:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: armorgames
    product: armorgames
  tags: osint,osint-gaming,armorgames,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://armorgames.com/user/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: armorgames
        cpe: cpe:2.3:a:armorgames:armorgames:*:*:*:*:*:*:*:*
        part: body
        words:
          - "about"
