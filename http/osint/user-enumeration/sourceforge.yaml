id: sourceforge

info:
  name: Sourceforge User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Sourceforge user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:sourceforge:sourceforge:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: sourceforge
    product: sourceforge
  tags: osint,osint-coding,sourceforge,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://sourceforge.net/u/{{user}}/profile"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: sourceforge
        cpe: cpe:2.3:a:sourceforge:sourceforge:*:*:*:*:*:*:*:*
        part: body
        words:
          - " / Profile</title>"
