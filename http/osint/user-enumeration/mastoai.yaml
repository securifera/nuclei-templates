id: mastoai

info:
  name: Masto.ai User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Masto.ai user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:mastoai:mastoai:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: mastoai
    product: mastoai
  tags: osint,osint-social,mastoai,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://masto.ai/@{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: mastoai
        cpe: cpe:2.3:a:mastoai:mastoai:*:*:*:*:*:*:*:*
        part: body
        words:
          - "@masto.ai) - Mastodon</title>"
