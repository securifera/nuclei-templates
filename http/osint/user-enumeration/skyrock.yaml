id: skyrock

info:
  name: Skyrock User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Skyrock user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:skyrock:skyrock:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: skyrock
    product: skyrock
  tags: osint,osint-social,skyrock,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://{{user}}.skyrock.com/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: skyrock
        cpe: cpe:2.3:a:skyrock:skyrock:*:*:*:*:*:*:*:*
        part: body
        words:
          - "&#039;s blog"
