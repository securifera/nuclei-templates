id: karabin

info:
  name: Karab.in User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Karab.in user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:karabin:karabin:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: karabin
    product: karabin
  tags: osint,osint-social,karabin,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://karab.in/u/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: karabin
        cpe: cpe:2.3:a:karabin:karabin:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Dołၜzył:"
