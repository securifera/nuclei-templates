id: redbubble

info:
  name: Redbubble User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Redbubble user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:redbubble:redbubble:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: redbubble
    product: redbubble
  tags: osint,osint-shopping,redbubble,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.redbubble.com/people/{{user}}/shop"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: redbubble
        cpe: cpe:2.3:a:redbubble:redbubble:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Shop | Redbubble"
