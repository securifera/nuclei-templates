id: pillowfort

info:
  name: Pillowfort User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Pillowfort user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:pillowfort:pillowfort:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: pillowfort
    product: pillowfort
  tags: osint,osint-social,pillowfort,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.pillowfort.social/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: pillowfort
        cpe: cpe:2.3:a:pillowfort:pillowfort:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<meta property=\"og:site_name\" content=\"Pillowfort\">"
