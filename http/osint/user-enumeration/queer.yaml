id: queer

info:
  name: QUEER User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: QUEER user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:queer:queer:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: queer
    product: queer
  tags: osint,osint-social,queer,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://queer.pl/user/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: queer
        cpe: cpe:2.3:a:queer:queer:*:*:*:*:*:*:*:*
        part: body
        words:
          - Spo𔋬zność
