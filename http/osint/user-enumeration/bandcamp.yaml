id: bandcamp

info:
  name: Bandcamp User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Bandcamp user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:bandcamp:bandcamp:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: bandcamp
    product: bandcamp
  tags: osint,osint-music,bandcamp,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://bandcamp.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: bandcamp
        cpe: cpe:2.3:a:bandcamp:bandcamp:*:*:*:*:*:*:*:*
        part: body
        words:
          - " collection | Bandcamp</title>"
