id: snapchat-stories

info:
  name: Snapchat Stories User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Snapchat Stories user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:snapchat-stories:snapchat-stories:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: snapchat-stories
    product: snapchat-stories
  tags: osint,osint-social,snapchat-stories,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://story.snapchat.com/s/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: snapchat-stories
        cpe: cpe:2.3:a:snapchat-stories:snapchat-stories:*:*:*:*:*:*:*:*
        part: body
        words:
          - "is on Snapchat!"
