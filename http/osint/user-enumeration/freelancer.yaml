id: freelancer

info:
  name: Freelancer User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Freelancer user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:freelancer:freelancer:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: freelancer
    product: freelancer
  tags: osint,osint-business,freelancer,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.freelancer.com/u/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: freelancer
        cpe: cpe:2.3:a:freelancer:freelancer:*:*:*:*:*:*:*:*
        part: body
        words:
          - "> joined"
