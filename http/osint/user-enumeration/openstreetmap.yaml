id: openstreetmap

info:
  name: OpenStreetMap User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: OpenStreetMap user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:openstreetmap:openstreetmap:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: openstreetmap
    product: openstreetmap
  tags: osint,osint-social,openstreetmap,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.openstreetmap.org/user/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: openstreetmap
        cpe: cpe:2.3:a:openstreetmap:openstreetmap:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Mapper since:"
