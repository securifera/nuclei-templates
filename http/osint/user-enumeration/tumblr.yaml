id: tumblr

info:
  name: Tumblr User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Tumblr user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:tumblr:tumblr:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: tumblr
    product: tumblr
  tags: osint,osint-images,tumblr,discovery

self-contained: true

variables:
  valid_username: "{{replace(user, '.', '')}}"

http:
  - method: GET
    path:
      - "https://{{valid_username}}.tumblr.com"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: tumblr
        cpe: cpe:2.3:a:tumblr:tumblr:*:*:*:*:*:*:*:*
        part: body
        words:
          - "avatar"
