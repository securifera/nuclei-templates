id: myfitnesspal-author

info:
  name: MyFitnessPal Author User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: MyFitnessPal Author user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:myfitnesspal-author:myfitnesspal-author:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: myfitnesspal-author
    product: myfitnesspal-author
  tags: osint,osint-health,myfitnesspal-author,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://blog.myfitnesspal.com/author/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: myfitnesspal-author
        cpe: cpe:2.3:a:myfitnesspal-author:myfitnesspal-author:*:*:*:*:*:*:*:*
        part: body
        words:
          - "About the Author"
