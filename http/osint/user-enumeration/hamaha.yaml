id: hamaha

info:
  name: Hamaha User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Hamaha user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:hamaha:hamaha:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: hamaha
    product: hamaha
  tags: osint,osint-finance,hamaha,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://hamaha.net/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: hamaha
        cpe: cpe:2.3:a:hamaha:hamaha:*:*:*:*:*:*:*:*
        part: body
        words:
          - "- трейдинг форекс фьючерсы акции фондовый рынок "
