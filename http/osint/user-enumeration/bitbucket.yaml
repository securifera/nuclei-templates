id: bitbucket

info:
  name: Bitbucket User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Bitbucket user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:bitbucket:bitbucket:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: bitbucket
    product: bitbucket
  tags: osint,osint-coding,bitbucket,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://bitbucket.org/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: bitbucket
        cpe: cpe:2.3:a:bitbucket:bitbucket:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Repositories"
