id: furiffic

info:
  name: Furiffic User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Furiffic user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:furiffic:furiffic:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: furiffic
    product: furiffic
  tags: osint,osint-porn,furiffic,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.furiffic.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: furiffic
        cpe: cpe:2.3:a:furiffic:furiffic:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Registered Since"
