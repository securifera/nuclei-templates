id: jeuxvideo

info:
  name: Jeuxvideo User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Jeuxvideo user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:jeuxvideo:jeuxvideo:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: jeuxvideo
    product: jeuxvideo
  tags: osint,osint-gaming,jeuxvideo,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.jeuxvideo.com/profil/{{user}}?mode=infos"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: jeuxvideo
        cpe: cpe:2.3:a:jeuxvideo:jeuxvideo:*:*:*:*:*:*:*:*
        part: body
        words:
          - "- jeuxvideo.com"
