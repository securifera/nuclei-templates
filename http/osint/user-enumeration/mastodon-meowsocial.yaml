id: mastodon-meowsocial

info:
  name: Mastodon-meow.social User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Mastodon-meow.social user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:mastodon-meowsocial:mastodon-meowsocial:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: mastodon-meowsocial
    product: mastodon-meowsocial
  tags: osint,osint-social,mastodon-meowsocial,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://meow.social/@{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: mastodon-meowsocial
        cpe: cpe:2.3:a:mastodon-meowsocial:mastodon-meowsocial:*:*:*:*:*:*:*:*
        part: body
        words:
          - "- the mastodon instances for creatures</title>"
