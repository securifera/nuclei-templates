id: caringbridge

info:
  name: CaringBridge User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: CaringBridge user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:caringbridge:caringbridge:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: caringbridge
    product: caringbridge
  tags: osint,osint-health,caringbridge,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.caringbridge.org/visit/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: caringbridge
        cpe: cpe:2.3:a:caringbridge:caringbridge:*:*:*:*:*:*:*:*
        part: body
        words:
          - "| CaringBridge"
