id: biolink

info:
  name: Biolink User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Biolink user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:biolink:biolink:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: biolink
    product: biolink
  tags: osint,osint-misc,biolink,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://bio.link/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: biolink
        cpe: cpe:2.3:a:biolink:biolink:*:*:*:*:*:*:*:*
        part: body
        words:
          - "profile:username"
