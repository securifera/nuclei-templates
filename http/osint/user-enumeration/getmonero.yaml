id: getmonero

info:
  name: Getmonero User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Getmonero user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:getmonero:getmonero:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: getmonero
    product: getmonero
  tags: osint,osint-misc,getmonero,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://forum.getmonero.org/user/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: getmonero
        cpe: cpe:2.3:a:getmonero:getmonero:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Monero | User"
