id: mastodon-api

info:
  name: Mastodon-API User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Mastodon-API user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:mastodon-api:mastodon-api:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: mastodon-api
    product: mastodon-api
  tags: osint,osint-social,mastodon-api,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://mastodon.social/api/v2/search?q={{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: mastodon-api
        cpe: cpe:2.3:a:mastodon-api:mastodon-api:*:*:*:*:*:*:*:*
        part: body
        words:
          - "display_name"
