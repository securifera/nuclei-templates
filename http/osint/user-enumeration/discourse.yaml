id: discourse

info:
  name: Discourse User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Discourse user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:discourse:discourse:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: discourse
    product: discourse
  tags: osint,osint-misc,discourse,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://meta.discourse.org/u/{{user}}/summary.json"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: discourse
        cpe: cpe:2.3:a:discourse:discourse:*:*:*:*:*:*:*:*
        part: body
        words:
          - "topics"
