id: ko-fi

info:
  name: Ko-Fi User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Ko-Fi user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:ko-fi:ko-fi:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: ko-fi
    product: ko-fi
  tags: osint,osint-social,ko-fi,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://ko-fi.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: ko-fi
        cpe: cpe:2.3:a:ko-fi:ko-fi:*:*:*:*:*:*:*:*
        part: body
        words:
          - ">  Buy a Coffee for"
