id: skillshare

info:
  name: Skill Share User Name Information - Detect
  author: olearycrew
  severity: info
  description: Skill Share user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:skillshare:skillshare:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: skillshare
    product: skillshare
  tags: osint,osint-social,skillshare,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.skillshare.com/en/user/{{user}}"

    matchers-condition: and
    matchers:
      - type: word
        name: skillshare
        cpe: cpe:2.3:a:skillshare:skillshare:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"username":'
          - '"email":'
          - '"isTopTeacher":'
        condition: and

      - type: status
        status:
          - 200
