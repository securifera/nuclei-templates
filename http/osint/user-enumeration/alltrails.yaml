id: alltrails

info:
  name: AllTrails User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: AllTrails user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:alltrails:alltrails:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: alltrails
    product: alltrails
  tags: osint,osint-health,alltrails,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.alltrails.com/members/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: alltrails
        cpe: cpe:2.3:a:alltrails:alltrails:*:*:*:*:*:*:*:*
        part: body
        words:
          - "'s Profile | "
