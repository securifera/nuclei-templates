id: fandalism

info:
  name: Fandalism User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Fandalism user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:fandalism:fandalism:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: fandalism
    product: fandalism
  tags: osint,osint-hobby,fandalism,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://fandalism.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: fandalism
        cpe: cpe:2.3:a:fandalism:fandalism:*:*:*:*:*:*:*:*
        part: body
        words:
          - "fandalism_:user"
