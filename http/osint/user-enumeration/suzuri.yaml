id: suzuri

info:
  name: Suzuri User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Suzuri user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:suzuri:suzuri:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: suzuri
    product: suzuri
  tags: osint,osint-business,suzuri,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://suzuri.jp/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: suzuri
        cpe: cpe:2.3:a:suzuri:suzuri:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Items"
