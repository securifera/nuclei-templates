id: parler-archived-posts

info:
  name: Parler archived posts User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Parler archived posts user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:parler-archived-posts:parler-archived-posts:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: parler-archived-posts
    product: parler-archived-posts
  tags: osint,osint-archived,parler-archived-posts,discovery

self-contained: true

http:
  - method: GET
    path:
      - "http://archive.org/wayback/available?url=https://parler.com/profile/{{user}}/posts"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: parler-archived-posts
        cpe: cpe:2.3:a:parler-archived-posts:parler-archived-posts:*:*:*:*:*:*:*:*
        part: body
        words:
          - "\"archived_snapshots\": {\"closest\""
