id: bigo-live

info:
  name: BIGO Live User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: BIGO Live user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:bigo-live:bigo-live:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: bigo-live
    product: bigo-live
  tags: osint,osint-gaming,bigo-live,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.bigo.tv/user/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: bigo-live
        cpe: cpe:2.3:a:bigo-live:bigo-live:*:*:*:*:*:*:*:*
        part: body
        words:
          - "userInfo:{nickName"
