id: github

info:
  name: GitHub User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: GitHub user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:github:github:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: github
    product: github
  tags: osint,osint-coding,github,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://github.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: github
        cpe: cpe:2.3:a:github:github:*:*:*:*:*:*:*:*
        part: body
        words:
          - "p-nickname vcard-username d-block"
