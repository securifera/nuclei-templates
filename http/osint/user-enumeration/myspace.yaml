id: myspace

info:
  name: MySpace User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: MySpace user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:myspace:myspace:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: myspace
    product: myspace
  tags: osint,osint-social,myspace,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://myspace.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: myspace
        cpe: cpe:2.3:a:myspace:myspace:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<!-- Profile -->"
