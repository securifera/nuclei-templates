id: mmorpg

info:
  name: Mmorpg User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Mmorpg user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:mmorpg:mmorpg:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: mmorpg
    product: mmorpg
  tags: osint,osint-gaming,mmorpg,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://forums.mmorpg.com/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: mmorpg
        cpe: cpe:2.3:a:mmorpg:mmorpg:*:*:*:*:*:*:*:*
        part: body
        words:
          - "MMORPG.com Forums"
