id: rsi

info:
  name: Rsi User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Rsi user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:rsi:rsi:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: rsi
    product: rsi
  tags: osint,osint-gaming,rsi,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://robertsspaceindustries.com/citizens/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: rsi
        cpe: cpe:2.3:a:rsi:rsi:*:*:*:*:*:*:*:*
        part: body
        words:
          - "CITIZEN DOSSIER"
