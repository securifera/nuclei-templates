id: hashnode

info:
  name: Hashnode User Name Information - Detect
  author: cheesymoon
  severity: info
  description: hashnode.com user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:hashnode:hashnode:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: hashnode
    product: hashnode
  tags: osint,osint-social,hashnode,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://hashnode.com/@{{user}}"

    matchers-condition: and
    matchers:
      - type: word
        name: hashnode
        cpe: cpe:2.3:a:hashnode:hashnode:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Member Since'
          - '"username":"{{user}}"'
        condition: and

      - type: status
        status:
          - 200
