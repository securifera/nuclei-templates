id: mastodon-social-tchncs

info:
  name: Mastodon-social tchncs User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Mastodon-social tchncs user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:mastodon-social-tchncs:mastodon-social-tchncs:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: mastodon-social-tchncs
    product: mastodon-social-tchncs
  tags: osint,osint-social,mastodon-social-tchncs,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://social.tchncs.de/@{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: mastodon-social-tchncs
        cpe: cpe:2.3:a:mastodon-social-tchncs:mastodon-social-tchncs:*:*:*:*:*:*:*:*
        part: body
        words:
          - "profile:username"
