id: npmjs

info:
  name: NPMjs User Name Information - Detect
  author: olearycrew
  severity: info
  description: NPMjs user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:npmjs:npmjs:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: npmjs
    product: npmjs
  tags: osint,osint-social,npmjs,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.npmjs.com/~{{user}}"

    matchers-condition: and
    matchers:
      - type: word
        name: npmjs
        cpe: cpe:2.3:a:npmjs:npmjs:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Your profile picture'

      - type: status
        status:
          - 200
