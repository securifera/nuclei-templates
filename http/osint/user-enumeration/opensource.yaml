id: opensource

info:
  name: Opensource User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Opensource user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:opensource:opensource:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: opensource
    product: opensource
  tags: osint,osint-tech,opensource,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://opensource.com/users/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: opensource
        cpe: cpe:2.3:a:opensource:opensource:*:*:*:*:*:*:*:*
        part: body
        words:
          - "| Opensource.com"
