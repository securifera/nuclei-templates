id: xhamster

info:
  name: XHamster User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: XHamster user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:xhamster:xhamster:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: xhamster
    product: xhamster
  tags: osint,osint-porn,xhamster,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://xhamster.com/users/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: xhamster
        cpe: cpe:2.3:a:xhamster:xhamster:*:*:*:*:*:*:*:*
        part: body
        words:
          - "s profile | xHamster</title>"
