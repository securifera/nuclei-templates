id: atcoder

info:
  name: AtCoder User Name Information - Detect
  author: princechaddha,rxerium
  severity: info
  description: AtCoder user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:atcoder:atcoder:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    vendor: atcoder
    product: atcoder
  tags: osint,osint-coding,atcoder,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://atcoder.jp/users/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: atcoder
        cpe: cpe:2.3:a:atcoder:atcoder:*:*:*:*:*:*:*:*
        part: body
        words:
          - "AtCoder is a programming contest site for anyone from beginners to experts. We hold weekly programming contests online."
