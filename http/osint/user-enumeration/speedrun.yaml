id: speedrun

info:
  name: Speedrun User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Speedrun user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:speedrun:speedrun:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: speedrun
    product: speedrun
  tags: osint,osint-gaming,speedrun,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.speedrun.com/user/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: speedrun
        cpe: cpe:2.3:a:speedrun:speedrun:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Runs - "
