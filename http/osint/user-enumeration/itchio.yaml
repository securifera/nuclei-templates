id: itchio

info:
  name: Itch.io User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Itch.io user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:itchio:itchio:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: itchio
    product: itchio
  tags: osint,osint-gaming,itchio,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://itch.io/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: itchio
        cpe: cpe:2.3:a:itchio:itchio:*:*:*:*:*:*:*:*
        part: body
        words:
          - "A member registered"
