id: medyczkapl

info:
  name: Medyczka.pl User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Medyczka.pl user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:medyczkapl:medyczkapl:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: medyczkapl
    product: medyczkapl
  tags: osint,osint-health,medyczkapl,discovery

self-contained: true

http:
  - method: GET
    path:
      - "http://medyczka.pl/user/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: medyczkapl
        cpe: cpe:2.3:a:medyczkapl:medyczkapl:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Lista uzytkownikow"
