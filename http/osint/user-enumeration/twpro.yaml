id: twpro

info:
  name: Twpro User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Twpro user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:twpro:twpro:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: twpro
    product: twpro
  tags: osint,osint-social,twpro,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://twpro.jp/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: twpro
        cpe: cpe:2.3:a:twpro:twpro:*:*:*:*:*:*:*:*
        part: body
        words:
          - "おとなりさん"
