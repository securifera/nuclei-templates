id: 7cup

info:
  name: 7cup User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: 7cup user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:7cup:7cup:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: 7cup
    product: 7cup
  tags: osint,osint-social,7cup,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.7cups.com/@{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: 7cup
        cpe: cpe:2.3:a:7cup:7cup:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Profile - 7 Cups"
