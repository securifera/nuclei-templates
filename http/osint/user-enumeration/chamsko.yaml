id: chamsko

info:
  name: Chamsko User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Chamsko user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:chamsko:chamsko:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: chamsko
    product: chamsko
  tags: osint,osint-images,chamsko,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.chamsko.pl/profil/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: chamsko
        cpe: cpe:2.3:a:chamsko:chamsko:*:*:*:*:*:*:*:*
        part: body
        words:
          - "W serwisie od"
