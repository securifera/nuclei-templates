id: crevado

info:
  name: Crevado User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Crevado user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:crevado:crevado:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: crevado
    product: crevado
  tags: osint,osint-images,crevado,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://{{user}}.crevado.com/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: crevado
        cpe: cpe:2.3:a:crevado:crevado:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Portfolio"
