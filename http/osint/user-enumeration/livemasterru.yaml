id: livemasterru

info:
  name: Livemaster.ru User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Livemaster.ru user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:livemasterru:livemasterru:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: livemasterru
    product: livemasterru
  tags: osint,osint-shopping,livemasterru,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.livemaster.ru/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: livemasterru
        cpe: cpe:2.3:a:livemasterru:livemasterru:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Магазин мастера"
