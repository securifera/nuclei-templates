id: geocaching

info:
  name: Geocaching User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Geocaching user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:geocaching:geocaching:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: geocaching
    product: geocaching
  tags: osint,osint-social,geocaching,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.geocaching.com/p/?u={{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: geocaching
        cpe: cpe:2.3:a:geocaching:geocaching:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Groundspeak - User Profile"
