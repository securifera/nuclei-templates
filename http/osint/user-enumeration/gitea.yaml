id: gitea

info:
  name: Gitea User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Gitea user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:gitea:gitea:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: gitea
    product: gitea
  tags: osint,osint-coding,gitea,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://gitea.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: gitea
        cpe: cpe:2.3:a:gitea:gitea:*:*:*:*:*:*:*:*
        part: body
        words:
          - "(Git with a cup of tea)"
