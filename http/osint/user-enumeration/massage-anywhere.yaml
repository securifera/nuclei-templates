id: massage-anywhere

info:
  name: Massage Anywhere User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Massage Anywhere user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:massage-anywhere:massage-anywhere:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: massage-anywhere
    product: massage-anywhere
  tags: osint,osint-health,massage-anywhere,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.massageanywhere.com/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: massage-anywhere
        cpe: cpe:2.3:a:massage-anywhere:massage-anywhere:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>MassageAnywhere.com Profile for "
