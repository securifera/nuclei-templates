id: codewars

info:
  name: Codewars User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Codewars user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:codewars:codewars:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: codewars
    product: codewars
  tags: osint,osint-coding,codewars,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.codewars.com/users/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: codewars
        cpe: cpe:2.3:a:codewars:codewars:*:*:*:*:*:*:*:*
        part: body
        words:
          - "| Codewars"
