id: dissenter

info:
  name: Dissenter User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Dissenter user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:dissenter:dissenter:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: dissenter
    product: dissenter
  tags: osint,osint-political,dissenter,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://dissenter.com/user/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: dissenter
        cpe: cpe:2.3:a:dissenter:dissenter:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Dissenter | The Comment Section of the Internet"
