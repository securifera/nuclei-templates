id: fandom

info:
  name: Fandom User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Fandom user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:fandom:fandom:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: fandom
    product: fandom
  tags: osint,osint-gaming,fandom,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.fandom.com/u/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: fandom
        cpe: cpe:2.3:a:fandom:fandom:*:*:*:*:*:*:*:*
        part: body
        words:
          - "| Profile | Fandom"
