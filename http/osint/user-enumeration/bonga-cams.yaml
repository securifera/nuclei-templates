id: bonga-cams

info:
  name: Bonga cams User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Bonga cams user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:bonga-cams:bonga-cams:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: bonga-cams
    product: bonga-cams
  tags: osint,osint-porn,bonga-cams,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://pt.bongacams.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: bonga-cams
        cpe: cpe:2.3:a:bonga-cams:bonga-cams:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Chat público ao vivo de"
