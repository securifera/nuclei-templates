id: line

info:
  name: LINE User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: LINE user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:line:line:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: line
    product: line
  tags: osint,osint-social,line,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://line.me/R/ti/p/@{{user}}?from=page"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: line
        cpe: cpe:2.3:a:line:line:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Add LINE Friends via QR Code"
