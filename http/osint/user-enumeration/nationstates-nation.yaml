id: nationstates-nation

info:
  name: NationStates Nation User Name Information - Detect
  author: princechaddha,rxerium
  severity: info
  description: NationStates Nation user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:nationstates:nationstates:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    vendor: nationstates
    product: nationstates
  tags: osint,osint-gaming,nationstates,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://nationstates.net/nation={{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: nationstates
        cpe: cpe:2.3:a:nationstates:nationstates:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>NationStates | The Republic"
