id: naver

info:
  name: Naver User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Naver user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:naver:naver:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: naver
    product: naver
  tags: osint,osint-social,naver,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://blog.naver.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: naver
        cpe: cpe:2.3:a:naver:naver:*:*:*:*:*:*:*:*
        part: body
        words:
          - " : 네이버 블로그"
