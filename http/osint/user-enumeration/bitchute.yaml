id: bitchute

info:
  name: Bitchute User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Bitchute user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:bitchute:bitchute:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: bitchute
    product: bitchute
  tags: osint,osint-political,bitchute,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.bitchute.com/channel/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: bitchute
        cpe: cpe:2.3:a:bitchute:bitchute:*:*:*:*:*:*:*:*
        part: body
        words:
          - "subscribers"
