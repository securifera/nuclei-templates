id: f3

info:
  name: F3 User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: F3 user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:f3:f3:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: f3
    product: f3
  tags: osint,osint-social,f3,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://f3.cool/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: f3
        cpe: cpe:2.3:a:f3:f3:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>@"
