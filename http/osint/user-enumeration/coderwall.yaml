id: coderwall

info:
  name: Coderwall User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Coderwall user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:coderwall:coderwall:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: coderwall
    product: coderwall
  tags: osint,osint-coding,coderwall,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://coderwall.com/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: coderwall
        cpe: cpe:2.3:a:coderwall:coderwall:*:*:*:*:*:*:*:*
        part: body
        words:
          - "s profile |"
