id: smule

info:
  name: Smule User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Smule user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:smule:smule:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: smule
    product: smule
  tags: osint,osint-music,smule,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.smule.com/api/profile/?handle={{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: smule
        cpe: cpe:2.3:a:smule:smule:*:*:*:*:*:*:*:*
        part: body
        words:
          - "account_id"
