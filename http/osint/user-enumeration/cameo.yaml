id: cameo

info:
  name: Cameo User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Cameo user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:cameo:cameo:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: cameo
    product: cameo
  tags: osint,osint-shopping,cameo,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.cameo.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: cameo
        cpe: cpe:2.3:a:cameo:cameo:*:*:*:*:*:*:*:*
        part: body
        words:
          - "aggregateRating"
