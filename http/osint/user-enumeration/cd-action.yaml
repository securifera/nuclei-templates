id: cd-action

info:
  name: CD-Action User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: CD-Action user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:cd-action:cd-action:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: cd-action
    product: cd-action
  tags: osint,osint-gaming,cd-action,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://cdaction.pl/uzytkownicy/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: cd-action
        cpe: cpe:2.3:a:cd-action:cd-action:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Lista gier:"
