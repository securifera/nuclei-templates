id: my-instants

info:
  name: My instants User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: My instants user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:my-instants:my-instants:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: my-instants
    product: my-instants
  tags: osint,osint-music,my-instants,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.myinstants.com/en/profile/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: my-instants
        cpe: cpe:2.3:a:my-instants:my-instants:*:*:*:*:*:*:*:*
        part: body
        words:
          - " | Myinstants</title>"
