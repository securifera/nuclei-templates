id: carbonmade

info:
  name: Carbonmade User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Carbonmade user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:carbonmade:carbonmade:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: carbonmade
    product: carbonmade
  tags: osint,osint-hobby,carbonmade,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://{{user}}.carbonmade.com/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: carbonmade
        cpe: cpe:2.3:a:carbonmade:carbonmade:*:*:*:*:*:*:*:*
        part: body
        words:
          - "s online portfolio"
