id: storycorps

info:
  name: StoryCorps User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: StoryCorps user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:storycorps:storycorps:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: storycorps
    product: storycorps
  tags: osint,osint-blog,storycorps,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://archive.storycorps.org/user/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: storycorps
        cpe: cpe:2.3:a:storycorps:storycorps:*:*:*:*:*:*:*:*
        part: body
        words:
          - "archive author"
