id: stripchat

info:
  name: Stripchat User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Stripchat user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:stripchat:stripchat:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: stripchat
    product: stripchat
  tags: osint,osint-porn,stripchat,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://stripchat.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: stripchat
        cpe: cpe:2.3:a:stripchat:stripchat:*:*:*:*:*:*:*:*
        part: body
        words:
          - "I Do in My Shows:"
