id: allesovercrypto

info:
  name: Allesovercrypto User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Allesovercrypto user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:allesovercrypto:allesovercrypto:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: allesovercrypto
    product: allesovercrypto
  tags: osint,osint-finance,allesovercrypto,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://allesovercrypto.nl/user/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: allesovercrypto
        cpe: cpe:2.3:a:allesovercrypto:allesovercrypto:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Favoriete coins"
