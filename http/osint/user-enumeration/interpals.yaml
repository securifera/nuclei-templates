id: interpals

info:
  name: Interpals User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Interpals user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:interpals:interpals:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: interpals
    product: interpals
  tags: osint,osint-dating,interpals,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.interpals.net/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: interpals
        cpe: cpe:2.3:a:interpals:interpals:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Looking for"
