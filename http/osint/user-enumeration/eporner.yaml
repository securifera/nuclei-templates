id: eporner

info:
  name: EPORNER User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: EPORNER user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:eporner:eporner:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: eporner
    product: eporner
  tags: osint,osint-porn,eporner,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.eporner.com/profile/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: eporner
        cpe: cpe:2.3:a:eporner:eporner:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Video/Pics views"
