id: wowhead

info:
  name: Wowhead User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Wowhead user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:wowhead:wowhead:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: wowhead
    product: wowhead
  tags: osint,osint-gaming,wowhead,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.wowhead.com/user={{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: wowhead
        cpe: cpe:2.3:a:wowhead:wowhead:*:*:*:*:*:*:*:*
        part: body
        words:
          - " Profile - Wowhead"
