id: shopify

info:
  name: Shopify User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Shopify user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:shopify:shopify:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: shopify
    product: shopify
  tags: osint,osint-shopping,shopify,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://{{user}}.myshopify.com"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: shopify
        cpe: cpe:2.3:a:shopify:shopify:*:*:*:*:*:*:*:*
        part: body
        words:
          - "home"
