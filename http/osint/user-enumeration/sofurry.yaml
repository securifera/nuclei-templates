id: sofurry

info:
  name: Sofurry User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Sofurry user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:sofurry:sofurry:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: sofurry
    product: sofurry
  tags: osint,osint-art,sofurry,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://{{user}}.sofurry.com"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: sofurry
        cpe: cpe:2.3:a:sofurry:sofurry:*:*:*:*:*:*:*:*
        part: body
        words:
          - "'s Profile | SoFurry"
