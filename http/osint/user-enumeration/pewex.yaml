id: pewex

info:
  name: Pewex User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Pewex user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:pewex:pewex:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: pewex
    product: pewex
  tags: osint,osint-misc,pewex,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://retro.pewex.pl/user/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: pewex
        cpe: cpe:2.3:a:pewex:pewex:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Zamieszcza eksponaty od:"
