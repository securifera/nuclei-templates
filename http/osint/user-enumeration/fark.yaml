id: fark

info:
  name: Fark User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Fark user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:fark:fark:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: fark
    product: fark
  tags: osint,osint-social,fark,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.fark.com/users/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: fark
        cpe: cpe:2.3:a:fark:fark:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Fark account number"
