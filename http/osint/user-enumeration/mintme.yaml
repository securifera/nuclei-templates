id: mintme

info:
  name: Mintme User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Mintme user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:mintme:mintme:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: mintme
    product: mintme
  tags: osint,osint-finance,mintme,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.mintme.com/token/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: mintme
        cpe: cpe:2.3:a:mintme:mintme:*:*:*:*:*:*:*:*
        part: body
        words:
          - "token | mintMe"
