id: weheartit

info:
  name: Weheartit User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Weheartit user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:weheartit:weheartit:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: weheartit
    product: weheartit
  tags: osint,osint-social,weheartit,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://weheartit.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: weheartit
        cpe: cpe:2.3:a:weheartit:weheartit:*:*:*:*:*:*:*:*
        part: body
        words:
          - " on We Heart It</title>"
