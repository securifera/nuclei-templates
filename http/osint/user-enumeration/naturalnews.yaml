id: naturalnews

info:
  name: NaturalNews User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: NaturalNews user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:naturalnews:naturalnews:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: naturalnews
    product: naturalnews
  tags: osint,osint-political,naturalnews,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://naturalnews.com/author/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: naturalnews
        cpe: cpe:2.3:a:naturalnews:naturalnews:*:*:*:*:*:*:*:*
        part: body
        words:
          - "All posts by"
