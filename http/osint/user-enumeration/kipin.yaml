id: kipin

info:
  name: Kipin User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Kipin user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:kipin:kipin:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: kipin
    product: kipin
  tags: osint,osint-business,kipin,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://kipin.app/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: kipin
        cpe: cpe:2.3:a:kipin:kipin:*:*:*:*:*:*:*:*
        part: body
        words:
          - "kipin.app/data/photos/resized2/"
