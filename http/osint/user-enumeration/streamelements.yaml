id: streamelements

info:
  name: StreamElements User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: StreamElements user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:streamelements:streamelements:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: streamelements
    product: streamelements
  tags: osint,osint-finance,streamelements,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://api.streamelements.com/kappa/v2/channels/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: streamelements
        cpe: cpe:2.3:a:streamelements:streamelements:*:*:*:*:*:*:*:*
        part: body
        words:
          - "\"providerId\""
