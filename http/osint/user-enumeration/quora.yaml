id: quora

info:
  name: Quora User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Quora user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:quora:quora:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: quora
    product: quora
  tags: osint,osint-social,quora,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.quora.com/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: quora
        cpe: cpe:2.3:a:quora:quora:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Credentials"
