id: trello

info:
  name: Trello User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Trello user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:trello:trello:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: trello
    product: trello
  tags: osint,osint-social,trello,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://trello.com/1/Members/{{user}}?fields=activityBlocked%2CavatarUrl%2Cbio%2CbioData%2Cconfirmed%2CfullName%2CidEnterprise%2CidMemberReferrer%2Cinitials%2CmemberType%2CnonPublic%2Cproducts%2Curl%2Cusername"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: trello
        cpe: cpe:2.3:a:trello:trello:*:*:*:*:*:*:*:*
        part: body
        words:
          - "avatarUrl"
