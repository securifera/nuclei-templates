id: soloby

info:
  name: Soloby User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Soloby user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:soloby:soloby:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: soloby
    product: soloby
  tags: osint,osint-social,soloby,discovery

self-contained: true

http:
  - method: GET
    path:
      - "http://www.soloby.ru/user/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: soloby
        cpe: cpe:2.3:a:soloby:soloby:*:*:*:*:*:*:*:*
        part: body
        words:
          - "- Универ soloBY"
