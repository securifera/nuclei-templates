id: postcrossing

info:
  name: Postcrossing User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Postcrossing user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:postcrossing:postcrossing:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: postcrossing
    product: postcrossing
  tags: osint,osint-social,postcrossing,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.postcrossing.com/user/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: postcrossing
        cpe: cpe:2.3:a:postcrossing:postcrossing:*:*:*:*:*:*:*:*
        part: body
        words:
          - ", from"
