id: sporcle

info:
  name: Sporcle User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Sporcle user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:sporcle:sporcle:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: sporcle
    product: sporcle
  tags: osint,osint-gaming,sporcle,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.sporcle.com/user/{{user}}/people/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: sporcle
        cpe: cpe:2.3:a:sporcle:sporcle:*:*:*:*:*:*:*:*
        part: body
        words:
          - "'s Sporcle Friends"
