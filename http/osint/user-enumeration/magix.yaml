id: magix

info:
  name: Magix User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Magix user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:magix:magix:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: magix
    product: magix
  tags: osint,osint-music,magix,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.magix.info/us/users/profile/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: magix
        cpe: cpe:2.3:a:magix:magix:*:*:*:*:*:*:*:*
        part: body
        words:
          - "About me"
