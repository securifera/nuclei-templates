id: manyvids

info:
  name: MANYVIDS User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: MANYVIDS user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:manyvids:manyvids:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: manyvids
    product: manyvids
  tags: osint,osint-porn,manyvids,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.manyvids.com/results.php?keywords={{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: manyvids
        cpe: cpe:2.3:a:manyvids:manyvids:*:*:*:*:*:*:*:*
        part: body
        words:
          - " Vids</h3>"
