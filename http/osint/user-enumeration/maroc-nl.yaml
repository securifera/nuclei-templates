id: maroc-nl

info:
  name: Maroc nl User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Maroc nl user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:maroc-nl:maroc-nl:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: maroc-nl
    product: maroc-nl
  tags: osint,osint-social,maroc-nl,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.maroc.nl/forums/members/{{user}}.html"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: maroc-nl
        cpe: cpe:2.3:a:maroc-nl:maroc-nl:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Bekijk Profiel:"
