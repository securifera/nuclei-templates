id: anobii

info:
  name: ANobii User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: ANobii user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:anobii:anobii:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: anobii
    product: anobii
  tags: osint,osint-hobby,anobii,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.anobii.com/{{user}}/profile/activity"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: anobii
        cpe: cpe:2.3:a:anobii:anobii:*:*:*:*:*:*:*:*
        part: body
        words:
          - ">Anobian since"
