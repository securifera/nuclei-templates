id: naija-planet

info:
  name: Naija planet User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Naija planet user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:naija-planet:naija-planet:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: naija-planet
    product: naija-planet
  tags: osint,osint-dating,naija-planet,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://naijaplanet.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: naija-planet
        cpe: cpe:2.3:a:naija-planet:naija-planet:*:*:*:*:*:*:*:*
        part: body
        words:
          - "dating Profile, "
