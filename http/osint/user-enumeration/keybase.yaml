id: keybase

info:
  name: Keybase User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Keybase user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:keybase:keybase:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: keybase
    product: keybase
  tags: osint,osint-social,keybase,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://keybase.io/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: keybase
        cpe: cpe:2.3:a:keybase:keybase:*:*:*:*:*:*:*:*
        part: body
        words:
          - "username"
