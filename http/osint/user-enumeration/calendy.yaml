id: calendy

info:
  name: Calendy User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Calendy user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:calendy:calendy:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: calendy
    product: calendy
  tags: osint,osint-misc,calendy,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://calendly.com/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: calendy
        cpe: cpe:2.3:a:calendy:calendy:*:*:*:*:*:*:*:*
        part: body
        words:
          - "og:author"
