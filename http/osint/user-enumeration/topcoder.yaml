id: topcoder

info:
  name: Topcoder User Name Information - Detect
  author: princechaddha,rxerium
  severity: info
  description: Topcoder user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:topcoder:topcoder:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    vendor: topcoder
    product: topcoder
  tags: osint,osint-coding,topcoder,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://profiles.topcoder.com/{{user}}/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: topcoder
        cpe: cpe:2.3:a:topcoder:topcoder:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Topcoder Top Technology Talent On-Demand"
