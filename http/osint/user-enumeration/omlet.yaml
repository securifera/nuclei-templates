id: omlet

info:
  name: Omlet User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: Omlet user name information check was conducted.
  classification:
    cpe: cpe:2.3:a:omlet:omlet:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: omlet
    product: omlet
  tags: osint,osint-gaming,omlet,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://omlet.gg/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: omlet
        cpe: cpe:2.3:a:omlet:omlet:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Omlet Arcade -"
