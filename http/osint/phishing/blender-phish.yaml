id: blender-phish

info:
  name: blender phishing Detection
  author: rxerium
  severity: info
  description: |
    A blender phishing website was detected
  reference:
    - https://blender.org
  classification:
    cpe: cpe:2.3:a:blender:blender:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: blender
    product: blender
  tags: phishing,blender,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: blender
        cpe: cpe:2.3:a:blender:blender:*:*:*:*:*:*:*:*
        words:
          - 'blender.org - Home of the Blender project - Free and Open 3D Creation Software'

      - type: status
        status:
          - 200

      - type: dsl
        name: blender-2
        cpe: cpe:2.3:a:blender:blender:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"blender.org")'
