id: society6-phish

info:
  name: Society6 phishing Detection
  author: rxerium
  severity: info
  description: |
    A Society6 phishing website was detected
  reference:
    - https://society6.com
  classification:
    cpe: cpe:2.3:a:society6:society6:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: society6
    product: society6
  tags: phishing,society6,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: society6
        cpe: cpe:2.3:a:society6:society6:*:*:*:*:*:*:*:*
        words:
          - 'Society6'
          - 'Society6 features art prints, home decor, bed &amp; bath, iPhone cases, apparel and tech accessories you&#39;ll love with designs by artists worldwide.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: society6-2
        cpe: cpe:2.3:a:society6:society6:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"society6.com")'
