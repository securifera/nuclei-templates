id: fedex-phish

info:
  name: FedEx phishing Detection
  author: rxerium
  severity: info
  description: |
    A FedEx phishing website was detected
  reference:
    - https://fedex.com
  classification:
    cpe: cpe:2.3:a:fedex:fedex:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: fedex
    product: fedex
  tags: phishing,fedex,shipping,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: fedex
        cpe: cpe:2.3:a:fedex:fedex:*:*:*:*:*:*:*:*
        words:
          - 'FedEx'
          - '<title>Track &amp; Ship Online or Find Nearby Locations | FedEx'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: fedex-2
        cpe: cpe:2.3:a:fedex:fedex:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"fedex.com")'
