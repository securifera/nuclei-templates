id: uber-phish

info:
  name: uber phishing Detection
  author: rxerium
  severity: info
  description: |
    A uber phishing website was detected
  reference:
    - https://uber.com
  classification:
    cpe: cpe:2.3:a:uber:uber:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: uber
    product: uber
  tags: phishing,uber,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: uber
        cpe: cpe:2.3:a:uber:uber:*:*:*:*:*:*:*:*
        words:
          - 'Explore the Uber Platform | Uber'

      - type: status
        status:
          - 200

      - type: dsl
        name: uber-2
        cpe: cpe:2.3:a:uber:uber:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"uber.com")'
