id: amazon-web-services-phish

info:
  name: amazon web services phishing Detection
  author: rxerium
  severity: info
  description: |
    An amazon-web-services phishing website was detected
  reference:
    - https://signin.aws.amazon.com
  classification:
    cpe: cpe:2.3:a:amazon-web-services:amazon-web-services:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: amazon-web-services
    product: amazon-web-services
  tags: phishing,amazon-web-services,aws,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: amazon-web-services
        cpe: cpe:2.3:a:amazon-web-services:amazon-web-services:*:*:*:*:*:*:*:*
        words:
          - 'Amazon Web Services Sign-In'

      - type: status
        status:
          - 200

      - type: dsl
        name: amazon-web-services-2
        cpe: cpe:2.3:a:amazon-web-services:amazon-web-services:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"amazon.com")'
