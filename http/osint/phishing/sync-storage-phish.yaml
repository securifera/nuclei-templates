id: sync-phish

info:
  name: sync storage phishing Detection
  author: rxerium
  severity: info
  description: |
    A sync storage phishing website was detected
  reference:
    - https://sync.com
  classification:
    cpe: cpe:2.3:a:sync:sync:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sync
    product: sync
  tags: phishing,sync,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: sync
        cpe: cpe:2.3:a:sync:sync:*:*:*:*:*:*:*:*
        words:
          - 'Sync | Secure Cloud Storage, File Sharing and Document Collaboration'

      - type: status
        status:
          - 200

      - type: dsl
        name: sync-2
        cpe: cpe:2.3:a:sync:sync:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"sync.com")'
