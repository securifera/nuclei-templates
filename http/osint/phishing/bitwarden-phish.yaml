id: bitwarden-phish

info:
  name: bitwarden phishing Detection
  author: rxerium
  severity: info
  description: |
    A bitwarden phishing website was detected
  reference:
    - https://bitwarden.com
  classification:
    cpe: cpe:2.3:a:bitwarden:bitwarden:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: bitwarden
    product: bitwarden
  tags: phishing,bitwarden,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: bitwarden
        cpe: cpe:2.3:a:bitwarden:bitwarden:*:*:*:*:*:*:*:*
        words:
          - 'The password manager trusted by millions | Bitwarden'

      - type: status
        status:
          - 200

      - type: dsl
        name: bitwarden-2
        cpe: cpe:2.3:a:bitwarden:bitwarden:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"bitwarden.com")'
