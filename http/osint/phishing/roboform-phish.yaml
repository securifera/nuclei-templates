id: roboform-phish

info:
  name: roboform phishing Detection
  author: rxerium
  severity: info
  description: |
    A roboform phishing website was detected
  reference:
    - https://roboform.com
  classification:
    cpe: cpe:2.3:a:roboform:roboform:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: roboform
    product: roboform
  tags: phishing,roboform,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: roboform
        cpe: cpe:2.3:a:roboform:roboform:*:*:*:*:*:*:*:*
        words:
          - 'Best Password Manager: No more writing down passwords'
          - 'Multi-platform secure solution to simplify your online experience. One click login on Chrome, Firefox, Safari, IE, Opera, Edge, Windows, Mac, iOS, Android.'
          - 'roboform'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: roboform-2
        cpe: cpe:2.3:a:roboform:roboform:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"roboform.com")'
