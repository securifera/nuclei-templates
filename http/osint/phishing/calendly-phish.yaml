id: calendly-phish

info:
  name: Calendly phishing Detection
  author: rxerium
  severity: info
  description: |
    A Calendly phishing website was detected
  reference:
    - https://calendly.com
  classification:
    cpe: cpe:2.3:a:calendly:calendly:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: calendly
    product: calendly
  tags: phishing,calendly,scheduling,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: calendly
        cpe: cpe:2.3:a:calendly:calendly:*:*:*:*:*:*:*:*
        words:
          - 'Calendly is the modern scheduling platform that makes “finding time” a breeze. When connecting is easy, your teams can get more done.'

      - type: status
        status:
          - 200

      - type: dsl
        name: calendly-2
        cpe: cpe:2.3:a:calendly:calendly:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"calendly.com")'
