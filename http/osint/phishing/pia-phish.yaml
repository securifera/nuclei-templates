id: pia-phish

info:
  name: Private Internet Access phishing Detection
  author: rxerium
  severity: info
  description: |
    A Private Internet Access phishing website was detected
  reference:
    - https://privateinternetaccess.com
  classification:
    cpe: cpe:2.3:a:pia:pia:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: pia
    product: pia
  tags: phishing,pia,vpn,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: pia
        cpe: cpe:2.3:a:pia:pia:*:*:*:*:*:*:*:*
        words:
          - '<title>Private Internet Access: The Best VPN Service For 10+ Years'

      - type: status
        status:
          - 200

      - type: dsl
        name: pia-2
        cpe: cpe:2.3:a:pia:pia:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"privateinternetaccess.com")'
