id: python-phish

info:
  name: python phishing Detection
  author: rxerium
  severity: info
  description: |
    A python phishing website was detected
  reference:
    - https://python.org
  classification:
    cpe: cpe:2.3:a:python:python:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: python
    product: python
  tags: phishing,python,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: python
        cpe: cpe:2.3:a:python:python:*:*:*:*:*:*:*:*
        words:
          - 'Welcome to Python.org'
          - 'The official home of the Python Programming Language'
        condition: and


      - type: status
        status:
          - 200

      - type: dsl
        name: python-2
        cpe: cpe:2.3:a:python:python:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"python.org")'
