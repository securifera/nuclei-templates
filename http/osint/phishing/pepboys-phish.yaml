id: pepboys-phish

info:
  name: Pep Boys phishing Detection
  author: rxerium
  severity: info
  description: |
    A Pep Boys phishing website was detected
  reference:
    - https://pepboys.com
  classification:
    cpe: cpe:2.3:a:pepboys:pepboys:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: pepboys
    product: pepboys
  tags: phishing,pepboys,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: pepboys
        cpe: cpe:2.3:a:pepboys:pepboys:*:*:*:*:*:*:*:*
        words:
          - "px-captcha"

      - type: status
        status:
          - 200

      - type: dsl
        name: pepboys-2
        cpe: cpe:2.3:a:pepboys:pepboys:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"pepboys.com")'
