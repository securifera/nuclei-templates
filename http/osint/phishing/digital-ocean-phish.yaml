id: digital-ocean-phish

info:
  name: digital ocean phishing Detection
  author: rxerium
  severity: info
  description: |
    A digital-ocean phishing website was detected
  reference:
    - https://digitalocean.com
  classification:
    cpe: cpe:2.3:a:digital-ocean:digital-ocean:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: digital-ocean
    product: digital-ocean
  tags: phishing,digital-ocean,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: digital-ocean
        cpe: cpe:2.3:a:digital-ocean:digital-ocean:*:*:*:*:*:*:*:*
        words:
          - 'DigitalOcean | Cloud Infrastructure for Developers'
          - 'DigitalOcean'
        condition: and


      - type: status
        status:
          - 200

      - type: dsl
        name: digital-ocean-2
        cpe: cpe:2.3:a:digital-ocean:digital-ocean:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"digitalocean.com")'
