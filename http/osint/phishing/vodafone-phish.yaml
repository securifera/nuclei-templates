id: vodafone-phish

info:
  name: vodafone phishing Detection
  author: rxerium
  severity: info
  description: |
    A vodafone phishing website was detected
  reference:
    - https://vodafone.co.uk
  classification:
    cpe: cpe:2.3:a:vodafone:vodafone:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: vodafone
    product: vodafone
  tags: phishing,vodafone,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: vodafone
        cpe: cpe:2.3:a:vodafone:vodafone:*:*:*:*:*:*:*:*
        words:
          - 'Vodafone &ndash; Our Best Ever Network'

      - type: status
        status:
          - 200

      - type: dsl
        name: vodafone-2
        cpe: cpe:2.3:a:vodafone:vodafone:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"vodafone.co.uk")'
