id: microsoft-phish

info:
  name: Microsoft phishing Detection
  author: rxerium
  severity: info
  description: |
    A microsoft phishing website was detected
  reference:
    - https://office.com
    - https://microsoft.com
  classification:
    cpe: cpe:2.3:a:microsoft:microsoft:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: microsoft
    product: microsoft
  tags: phishing,microsoft,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: microsoft
        cpe: cpe:2.3:a:microsoft:microsoft:*:*:*:*:*:*:*:*
        words:
          - 'Login | Microsoft 365'

      - type: status
        status:
          - 200

      - type: dsl
        name: microsoft-2
        cpe: cpe:2.3:a:microsoft:microsoft:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"office.com")'
          - '!contains(host,"microsoft.com")'
