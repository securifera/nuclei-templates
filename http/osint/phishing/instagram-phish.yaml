id: instagram-phish

info:
  name: instagram phishing Detection
  author: rxerium
  severity: info
  description: |
    A instagram phishing website was detected
  reference:
    - https://instagram.com
  classification:
    cpe: cpe:2.3:a:instagram:instagram:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: instagram
    product: instagram
  tags: phishing,instagram,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: instagram
        cpe: cpe:2.3:a:instagram:instagram:*:*:*:*:*:*:*:*
        words:
          - 'Login • Instagram'

      - type: status
        status:
          - 200

      - type: dsl
        name: instagram-2
        cpe: cpe:2.3:a:instagram:instagram:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"instagram.com")'
