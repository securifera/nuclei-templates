id: avg-phish

info:
  name: avg phishing Detection
  author: rxerium
  severity: info
  description: |
    An avg phishing website was detected
  reference:
    - https://avg.com
  classification:
    cpe: cpe:2.3:a:avg:avg:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: avg
    product: avg
  tags: phishing,avg,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: avg
        cpe: cpe:2.3:a:avg:avg:*:*:*:*:*:*:*:*
        words:
          - 'AVG 2024 | FREE Antivirus, VPN & TuneUp for All Your Devices'

      - type: status
        status:
          - 200

      - type: dsl
        name: avg-2
        cpe: cpe:2.3:a:avg:avg:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"avg.com")'
