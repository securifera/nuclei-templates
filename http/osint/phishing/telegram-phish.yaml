id: telegram-phish

info:
  name: telegram phishing Detection
  author: rxerium
  severity: info
  description: |
    A telegram phishing website was detected
  reference:
    - https://telegram.org
  classification:
    cpe: cpe:2.3:a:telegram:telegram:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: telegram
    product: telegram
  tags: phishing,telegram,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: telegram
        cpe: cpe:2.3:a:telegram:telegram:*:*:*:*:*:*:*:*
        words:
          - 'Telegram is a cloud-based mobile and desktop messaging app with a focus on security and speed.'

      - type: status
        status:
          - 200

      - type: dsl
        name: telegram-2
        cpe: cpe:2.3:a:telegram:telegram:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"telegram.org")'
