id: tutanota-phish

info:
  name: Tutanota phishing Detection
  author: rxerium
  severity: info
  description: |
    A Tutanota phishing website was detected
  reference:
    - https://tutanota.com
  classification:
    cpe: cpe:2.3:a:tutanota:tutanota:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: tutanota
    product: tutanota
  tags: phishing,tutanota,email,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: tutanota
        cpe: cpe:2.3:a:tutanota:tutanota:*:*:*:*:*:*:*:*
        words:
          - '<title>Tuta: Turn ON privacy for free with secure emails, calendars &amp; contacts | Tuta'

      - type: status
        status:
          - 200

      - type: dsl
        name: tutanota-2
        cpe: cpe:2.3:a:tutanota:tutanota:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"tutanota.com")'
