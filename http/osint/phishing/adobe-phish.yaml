id: adobe-phish

info:
  name: adobe phishing Detection
  author: rxerium
  severity: info
  description: |
    An adobe phishing website was detected
  reference:
    - https://adobe.com
  classification:
    cpe: cpe:2.3:a:adobe:adobe:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: adobe
    product: adobe
  tags: phishing,adobe,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: adobe
        cpe: cpe:2.3:a:adobe:adobe:*:*:*:*:*:*:*:*
        words:
          - 'Adobe: Creative, marketing and document management solutions'

      - type: status
        status:
          - 200

      - type: dsl
        name: adobe-2
        cpe: cpe:2.3:a:adobe:adobe:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"adobe.com")'
