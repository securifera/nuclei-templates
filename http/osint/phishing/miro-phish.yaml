id: miro-phish

info:
  name: Miro phishing Detection
  author: rxerium
  severity: info
  description: |
    A Miro phishing website was detected
  reference:
    - https://miro.com
  classification:
    cpe: cpe:2.3:a:miro:miro:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: miro
    product: miro
  tags: phishing,miro,collaboration,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: miro
        cpe: cpe:2.3:a:miro:miro:*:*:*:*:*:*:*:*
        words:
          - '<title>AI Innovation Workspace | Miro'

      - type: status
        status:
          - 200

      - type: dsl
        name: miro-2
        cpe: cpe:2.3:a:miro:miro:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"miro.com")'
