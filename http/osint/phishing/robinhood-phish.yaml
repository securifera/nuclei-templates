id: robinhood-phish

info:
  name: Robinhood phishing Detection
  author: rxerium
  severity: info
  description: |
    A Robinhood phishing website was detected
  reference:
    - https://robinhood.com
  classification:
    cpe: cpe:2.3:a:robinhood:robinhood:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: robinhood
    product: robinhood
  tags: phishing,robinhood,trading,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: robinhood
        cpe: cpe:2.3:a:robinhood:robinhood:*:*:*:*:*:*:*:*
        words:
          - "Robinhood: 24/5 Commission-Free Stock Trading & Investing"

      - type: status
        status:
          - 200

      - type: dsl
        name: robinhood-2
        cpe: cpe:2.3:a:robinhood:robinhood:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"robinhood.com")'
