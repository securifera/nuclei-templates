id: kayak-phish

info:
  name: kayak phishing Detection
  author: rxerium
  severity: info
  description: |
    A kayak phishing website was detected
  reference:
    - https://kayak.co.uk
  classification:
    cpe: cpe:2.3:a:kayak:kayak:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kayak
    product: kayak
  tags: phishing,kayak,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: kayak
        cpe: cpe:2.3:a:kayak:kayak:*:*:*:*:*:*:*:*
        words:
          - 'Search Flights, Hotels &amp; Car Hire | KAYAK'

      - type: status
        status:
          - 200

      - type: dsl
        name: kayak-2
        cpe: cpe:2.3:a:kayak:kayak:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"kayak.co.uk")'
