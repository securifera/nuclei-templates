id: ticket-master-phish

info:
  name: ticket master phishing Detection
  author: rxerium
  severity: info
  description: |
    A ticket-master phishing website was detected
  reference:
    - https://ticketmaster.com
  classification:
    cpe: cpe:2.3:a:ticketmaster:ticketmaster:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ticketmaster
    product: ticketmaster
  tags: phishing,ticket-master,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: ticketmaster
        cpe: cpe:2.3:a:ticketmaster:ticketmaster:*:*:*:*:*:*:*:*
        words:
          - 'Buy and sell tickets online for concerts, sports, theater, family and other events near you from Ticketmaster.'

      - type: status
        status:
          - 200

      - type: dsl
        name: ticketmaster-2
        cpe: cpe:2.3:a:ticketmaster:ticketmaster:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"ticketmaster.com")'
