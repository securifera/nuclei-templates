id: filezilla-phish

info:
  name: filezilla phishing Detection
  author: rxerium
  severity: info
  description: |
    A filezilla phishing website was detected
  reference:
    - https://filezilla-project.org
  classification:
    cpe: cpe:2.3:a:filezilla:filezilla:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: filezilla
    product: filezilla
  tags: phishing,filezilla,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: filezilla
        cpe: cpe:2.3:a:filezilla:filezilla:*:*:*:*:*:*:*:*
        words:
          - 'FileZilla - The free FTP solution'

      - type: status
        status:
          - 200

      - type: dsl
        name: filezilla-2
        cpe: cpe:2.3:a:filezilla:filezilla:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"filezilla-project.org")'
