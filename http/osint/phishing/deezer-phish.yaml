id: deezer-phish

info:
  name: deezer phishing Detection
  author: rxerium
  severity: info
  description: |
    A deezer phishing website was detected
  reference:
    - https://deezer.com
  classification:
    cpe: cpe:2.3:a:deezer:deezer:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: deezer
    product: deezer
  tags: phishing,deezer,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: deezer
        cpe: cpe:2.3:a:deezer:deezer:*:*:*:*:*:*:*:*
        words:
          - 'Deezer | Listen to music | Online music streaming platform'

      - type: status
        status:
          - 200

      - type: dsl
        name: deezer-2
        cpe: cpe:2.3:a:deezer:deezer:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"deezer.com")'
