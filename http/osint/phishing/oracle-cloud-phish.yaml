id: oracle-cloud-phish

info:
  name: Oracle Cloud phishing Detection
  author: rxerium
  severity: info
  description: |
    An Oracle Cloud phishing website was detected
  reference:
    - https://oracle.com/cloud
  classification:
    cpe: cpe:2.3:a:cloud:cloud:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: cloud
    product: cloud
  tags: phishing,oracle-cloud,cloud,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: cloud
        cpe: cpe:2.3:a:cloud:cloud:*:*:*:*:*:*:*:*
        words:
          - "fw_error_www"

      - type: status
        status:
          - 200

      - type: dsl
        name: cloud-2
        cpe: cpe:2.3:a:cloud:cloud:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"oracle.com")'
          - '!contains(host,"oraclecloud.com")'
