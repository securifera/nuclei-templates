id: brave-phish

info:
  name: brave phishing Detection
  author: rxerium
  severity: info
  description: |
    A brave phishing website was detected
  reference:
    - https://brave.com
  classification:
    cpe: cpe:2.3:a:brave:brave:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: brave
    product: brave
  tags: phishing,brave,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: brave
        cpe: cpe:2.3:a:brave:brave:*:*:*:*:*:*:*:*
        words:
          - 'Brave Browser Download | Brave'

      - type: status
        status:
          - 200

      - type: dsl
        name: brave-2
        cpe: cpe:2.3:a:brave:brave:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"brave.com")'
