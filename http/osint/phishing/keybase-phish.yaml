id: keybase-phish

info:
  name: keybase phishing Detection
  author: rxerium
  severity: info
  description: |
    A keybase phishing website was detected
  reference:
    - https://keybase.io
  classification:
    cpe: cpe:2.3:a:keybase:keybase:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: keybase
    product: keybase
  tags: phishing,keybase,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: keybase
        cpe: cpe:2.3:a:keybase:keybase:*:*:*:*:*:*:*:*
        words:
          - "Keybase is for keeping everyone's chats and files safe, from families to communities to companies. MacOS, Windows, Linux, iPhone, and Android."

      - type: status
        status:
          - 200

      - type: dsl
        name: keybase-2
        cpe: cpe:2.3:a:keybase:keybase:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"keybase.io")'
