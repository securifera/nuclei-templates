id: capital-one-phish

info:
  name: Capital One phishing Detection
  author: rxerium
  severity: info
  description: |
    A Capital One phishing website was detected
  reference:
    - https://capitalone.com
  classification:
    cpe: cpe:2.3:a:capital-one:capital-one:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: capital-one
    product: capital-one
  tags: phishing,capital-one,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: capital-one
        cpe: cpe:2.3:a:capital-one:capital-one:*:*:*:*:*:*:*:*
        words:
          - 'Capital One'
          - '<title>Capital One | Credit Cards, Checking, Savings &amp; Auto Loans'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: capital-one-2
        cpe: cpe:2.3:a:capital-one:capital-one:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"capitalone.com")'
