id: proton-phish

info:
  name: proton phishing Detection
  author: rxerium
  severity: info
  description: |
    A proton phishing website was detected
  reference:
    - https://proton.me
  classification:
    cpe: cpe:2.3:a:proton:proton:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: proton
    product: proton
  tags: phishing,proton,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: proton
        cpe: cpe:2.3:a:proton:proton:*:*:*:*:*:*:*:*
        words:
          - 'Proton Account: Sign-in'

      - type: status
        status:
          - 200

      - type: dsl
        name: proton-2
        cpe: cpe:2.3:a:proton:proton:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"proton.me")'
