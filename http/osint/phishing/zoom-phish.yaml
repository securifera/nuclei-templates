id: zoom-phish

info:
  name: zoom phishing Detection
  author: rxerium
  severity: info
  description: |
    A zoom phishing website was detected
  reference:
    - https://zoom.us
  classification:
    cpe: cpe:2.3:a:zoom:zoom:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: zoom
    product: zoom
  tags: phishing,zoom,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: zoom
        cpe: cpe:2.3:a:zoom:zoom:*:*:*:*:*:*:*:*
        words:
          - 'One platform to connect | Zoom'

      - type: status
        status:
          - 200

      - type: dsl
        name: zoom-2
        cpe: cpe:2.3:a:zoom:zoom:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"zoom.us")'
