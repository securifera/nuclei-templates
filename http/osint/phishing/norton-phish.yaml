id: norton-phish

info:
  name: norton phishing Detection
  author: rxerium
  severity: info
  description: |
    A norton phishing website was detected
  reference:
    - https://norton.com
  classification:
    cpe: cpe:2.3:a:norton:norton:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: norton
    product: norton
  tags: phishing,norton,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: norton
        cpe: cpe:2.3:a:norton:norton:*:*:*:*:*:*:*:*
        words:
          - 'Official Site | Norton™ - Antivirus &amp; Anti-Malware Software'

      - type: status
        status:
          - 200

      - type: dsl
        name: norton-2
        cpe: cpe:2.3:a:norton:norton:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"norton.com")'
