id: putty-phish

info:
  name: putty phishing Detection
  author: rxerium
  severity: info
  description: |
    A putty phishing website was detected
  reference:
    - https://putty.org
  classification:
    cpe: cpe:2.3:a:putty:putty:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: putty
    product: putty
  tags: phishing,putty,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: putty
        cpe: cpe:2.3:a:putty:putty:*:*:*:*:*:*:*:*
        words:
          - 'Download PuTTY - a free SSH and telnet client for Windows'

      - type: status
        status:
          - 200

      - type: dsl
        name: putty-2
        cpe: cpe:2.3:a:putty:putty:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"putty.org")'
