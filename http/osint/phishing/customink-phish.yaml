id: customink-phish

info:
  name: CustomInk phishing Detection
  author: rxerium
  severity: info
  description: |
    A CustomInk phishing website was detected
  reference:
    - https://customink.com
  classification:
    cpe: cpe:2.3:a:customink:customink:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: customink
    product: customink
  tags: phishing,customink,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: customink
        cpe: cpe:2.3:a:customink:customink:*:*:*:*:*:*:*:*
        words:
          - 'CustomInk'
          - '<title>Custom T-shirts - Design T-shirts, Apparel & Promo Products Online'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: customink-2
        cpe: cpe:2.3:a:customink:customink:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"customink.com")'
