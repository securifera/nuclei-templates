id: nab-phish

info:
  name: NAB phishing Detection
  author: rxerium
  severity: info
  description: |
    A NAB phishing website was detected
  reference:
    - https://nab.com.au
  classification:
    cpe: cpe:2.3:a:nab:nab:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: nab
    product: nab
  tags: phishing,nab,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: nab
        cpe: cpe:2.3:a:nab:nab:*:*:*:*:*:*:*:*
        words:
          - "NAB personal banking services include online banking, bank accounts, credit cards, home loans and personal loans. We’re here to help you with more than money."

      - type: status
        status:
          - 200

      - type: dsl
        name: nab-2
        cpe: cpe:2.3:a:nab:nab:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"nab.com.au")'
