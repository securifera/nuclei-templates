id: ccleaner-phish

info:
  name: ccleaner phishing Detection
  author: rxerium
  severity: info
  description: |
    A ccleaner phishing website was detected
  reference:
    - https://ccleaner.com
  classification:
    cpe: cpe:2.3:a:ccleaner:ccleaner:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ccleaner
    product: ccleaner
  tags: phishing,ccleaner,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: ccleaner
        cpe: cpe:2.3:a:ccleaner:ccleaner:*:*:*:*:*:*:*:*
        words:
          - 'CCleaner Makes Your Computer Faster & More Secure | Official Website'

      - type: status
        status:
          - 200

      - type: dsl
        name: ccleaner-2
        cpe: cpe:2.3:a:ccleaner:ccleaner:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"ccleaner.com")'
