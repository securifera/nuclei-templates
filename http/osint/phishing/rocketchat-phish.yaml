id: rocketchat-phish

info:
  name: Rocket.Chat phishing Detection
  author: rxerium
  severity: info
  description: |
    A Rocket.Chat phishing website was detected
  reference:
    - https://rocket.chat
  classification:
    cpe: cpe:2.3:a:rocketchat:rocketchat:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: rocketchat
    product: rocketchat
  tags: phishing,rocketchat,communication,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: rocketchat
        cpe: cpe:2.3:a:rocketchat:rocketchat:*:*:*:*:*:*:*:*
        words:
          - '<title>Rocket.Chat | Secure CommsOS™ for Mission-Critical Operations'

      - type: status
        status:
          - 200

      - type: dsl
        name: rocketchat-2
        cpe: cpe:2.3:a:rocketchat:rocketchat:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"rocket.chat")'
