id: gog-phish

info:
  name: GOG phishing Detection
  author: rxerium
  severity: info
  description: |
    A GOG phishing website was detected
  reference:
    - https://gog.com
  classification:
    cpe: cpe:2.3:a:gog:gog:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: gog
    product: gog
  tags: phishing,gog,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: gog
        cpe: cpe:2.3:a:gog:gog:*:*:*:*:*:*:*:*
        words:
          - '<title>Welcome to GOG.com | best PC games DRM-free'
          - 'GOG'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: gog-2
        cpe: cpe:2.3:a:gog:gog:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"gog.com")'
