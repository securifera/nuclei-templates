id: cafepress-phish

info:
  name: CafePress phishing Detection
  author: rxerium
  severity: info
  description: |
    A CafePress phishing website was detected
  reference:
    - https://cafepress.com
  classification:
    cpe: cpe:2.3:a:cafepress:cafepress:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: cafepress
    product: cafepress
  tags: phishing,cafepress,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: cafepress
        cpe: cpe:2.3:a:cafepress:cafepress:*:*:*:*:*:*:*:*
        words:
          - 'CafePress'
          - '<title> CafePress | Best merchandise to express yourself'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: cafepress-2
        cpe: cpe:2.3:a:cafepress:cafepress:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"cafepress.com")'
