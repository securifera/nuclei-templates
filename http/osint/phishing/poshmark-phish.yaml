id: poshmark-phish

info:
  name: Poshmark phishing Detection
  author: rxerium
  severity: info
  description: |
    A Poshmark phishing website was detected
  reference:
    - https://poshmark.com
  classification:
    cpe: cpe:2.3:a:poshmark:poshmark:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: poshmark
    product: poshmark
  tags: phishing,poshmark,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: poshmark
        cpe: cpe:2.3:a:poshmark:poshmark:*:*:*:*:*:*:*:*
        words:
          - 'Poshmark'
          - '<title>Poshmark: Buy and sell fashion, home decor, beauty &amp; more'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: poshmark-2
        cpe: cpe:2.3:a:poshmark:poshmark:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"poshmark.com")'
