id: openai-phish

info:
  name: openai phishing Detection
  author: rxerium
  severity: info
  description: |
    A openai phishing website was detected
  reference:
    - https://openai.com
  classification:
    cpe: cpe:2.3:a:openai:openai:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: openai
    product: openai
  tags: phishing,openai,osint,discovery,ai
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: openai
        cpe: cpe:2.3:a:openai:openai:*:*:*:*:*:*:*:*
        words:
          - 'Log in to OpenAI to continue to OpenAI Platform.'

      - type: status
        status:
          - 200

      - type: dsl
        name: openai-2
        cpe: cpe:2.3:a:openai:openai:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"openai.com")'
