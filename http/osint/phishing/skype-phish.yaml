id: skype-phish

info:
  name: skype phishing Detection
  author: rxerium
  severity: info
  description: |
    A skype phishing website was detected
  reference:
    - https://skype.com
  classification:
    cpe: cpe:2.3:a:skype:skype:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: skype
    product: skype
  tags: phishing,skype,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: skype
        cpe: cpe:2.3:a:skype:skype:*:*:*:*:*:*:*:*
        words:
          - 'Skype | Stay connected with free video calls worldwide'

      - type: status
        status:
          - 200

      - type: dsl
        name: skype-2
        cpe: cpe:2.3:a:skype:skype:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"skype.com")'
