id: roam-research-phish

info:
  name: Roam Research phishing Detection
  author: rxerium
  severity: info
  description: |
    A Roam Research phishing website was detected
  reference:
    - https://roamresearch.com
  classification:
    cpe: cpe:2.3:a:roam-research:roam-research:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: roam-research
    product: roam-research
  tags: phishing,roam-research,notes,productivity,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: roam-research
        cpe: cpe:2.3:a:roam-research:roam-research:*:*:*:*:*:*:*:*
        words:
          - '<title>Roam Research – A note taking tool for networked thought.'

      - type: status
        status:
          - 200

      - type: dsl
        name: roam-research-2
        cpe: cpe:2.3:a:roam-research:roam-research:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"roamresearch.com")'
