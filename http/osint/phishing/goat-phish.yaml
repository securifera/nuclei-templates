id: goat-phish

info:
  name: GOAT phishing Detection
  author: rxerium
  severity: info
  description: |
    A GOAT phishing website was detected
  reference:
    - https://goat.com
  classification:
    cpe: cpe:2.3:a:goat:goat:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: goat
    product: goat
  tags: phishing,goat,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: goat
        cpe: cpe:2.3:a:goat:goat:*:*:*:*:*:*:*:*
        words:
          - 'GOAT'
          - '<title>GOAT: Sneakers, Apparel, Accessories'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: goat-2
        cpe: cpe:2.3:a:goat:goat:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"goat.com")'
