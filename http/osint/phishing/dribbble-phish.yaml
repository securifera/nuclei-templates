id: dribbble-phish

info:
  name: Dribbble phishing Detection
  author: rxerium
  severity: info
  description: |
    A Dribbble phishing website was detected
  reference:
    - https://dribbble.com
  classification:
    cpe: cpe:2.3:a:dribbble:dribbble:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: dribbble
    product: dribbble
  tags: phishing,dribbble,design,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: dribbble
        cpe: cpe:2.3:a:dribbble:dribbble:*:*:*:*:*:*:*:*
        words:
          - "<title>Dribbble - Discover the World's Top Designers &amp; Creative Professionals"

      - type: status
        status:
          - 200

      - type: dsl
        name: dribbble-2
        cpe: cpe:2.3:a:dribbble:dribbble:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"dribbble.com")'
