id: printful-phish

info:
  name: Printful phishing Detection
  author: rxerium
  severity: info
  description: |
    A Printful phishing website was detected
  reference:
    - https://printful.com
  classification:
    cpe: cpe:2.3:a:printful:printful:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: printful
    product: printful
  tags: phishing,printful,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: printful
        cpe: cpe:2.3:a:printful:printful:*:*:*:*:*:*:*:*
        words:
          - 'Printful'
          - '<title>Printful: Custom Print On Demand &amp; Dropshipping'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: printful-2
        cpe: cpe:2.3:a:printful:printful:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"printful.com")'
