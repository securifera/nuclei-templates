id: disneyplus-phish

info:
  name: disneyplus phishing Detection
  author: rxerium
  severity: info
  description: |
    A disneyplus phishing website was detected
  reference:
    - https://disneyplus.com
  classification:
    cpe: cpe:2.3:a:disneyplus:disneyplus:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: disneyplus
    product: disneyplus
  tags: phishing,disneyplus,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: disneyplus
        cpe: cpe:2.3:a:disneyplus:disneyplus:*:*:*:*:*:*:*:*
        words:
          - 'Disney+ | Stream new Originals, blockbusters and series'

      - type: status
        status:
          - 200

      - type: dsl
        name: disneyplus-2
        cpe: cpe:2.3:a:disneyplus:disneyplus:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"disneyplus.com")'
