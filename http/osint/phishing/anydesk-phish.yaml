id: anydesk-phish

info:
  name: anydesk phishing Detection
  author: rxerium
  severity: info
  description: |
    An anydesk phishing website was detected
  reference:
    - https://anydesk.com
  classification:
    cpe: cpe:2.3:a:anydesk:anydesk:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: anydesk
    product: anydesk
  tags: phishing,anydesk,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: anydesk
        cpe: cpe:2.3:a:anydesk:anydesk:*:*:*:*:*:*:*:*
        words:
          - 'The Fast Remote Desktop Application – AnyDesk'

      - type: status
        status:
          - 200

      - type: dsl
        name: anydesk-2
        cpe: cpe:2.3:a:anydesk:anydesk:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"anydesk.com")'
