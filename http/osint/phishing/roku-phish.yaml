id: roku-phish

info:
  name: Roku phishing Detection
  author: rxerium
  severity: info
  description: |
    A Roku phishing website was detected
  reference:
    - https://roku.com
  classification:
    cpe: cpe:2.3:a:roku:roku:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: roku
    product: roku
  tags: phishing,roku,streaming,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: roku
        cpe: cpe:2.3:a:roku:roku:*:*:*:*:*:*:*:*
        words:
          - '<title>Roku: Streaming TV Players, Streaming Media Players &amp; Smart TVs'

      - type: status
        status:
          - 200

      - type: dsl
        name: roku-2
        cpe: cpe:2.3:a:roku:roku:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"roku.com")'
