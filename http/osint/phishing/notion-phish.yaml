id: notion-phish

info:
  name: notion phishing Detection
  author: rxerium
  severity: info
  description: |
    A notion phishing website was detected
  reference:
    - https://notion.so
  classification:
    cpe: cpe:2.3:a:notion:notion:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: notion
    product: notion
  tags: phishing,notion,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: notion
        cpe: cpe:2.3:a:notion:notion:*:*:*:*:*:*:*:*
        words:
          - 'Your connected workspace for wiki, docs &amp; projects | Notion'

      - type: status
        status:
          - 200

      - type: dsl
        name: notion-2
        cpe: cpe:2.3:a:notion:notion:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"notion.so")'
