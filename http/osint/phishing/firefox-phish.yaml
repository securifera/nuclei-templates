id: firefox-phish

info:
  name: firefox phishing Detection
  author: rxerium
  severity: info
  description: |
    A firefox phishing website was detected
  reference:
    - https://www.mozilla.org/en-GB/firefox/new/
  classification:
    cpe: cpe:2.3:a:firefox:firefox:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: firefox
    product: firefox
  tags: phishing,firefox,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: firefox
        cpe: cpe:2.3:a:firefox:firefox:*:*:*:*:*:*:*:*
        words:
          - 'Download Firefox for Desktop — Mozilla'

      - type: status
        status:
          - 200

      - type: dsl
        name: firefox-2
        cpe: cpe:2.3:a:firefox:firefox:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"mozilla.org")'
