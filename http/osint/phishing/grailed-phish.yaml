id: grailed-phish

info:
  name: Grailed phishing Detection
  author: rxerium
  severity: info
  description: |
    A Grailed phishing website was detected
  reference:
    - https://grailed.com
  classification:
    cpe: cpe:2.3:a:grailed:grailed:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: grailed
    product: grailed
  tags: phishing,grailed,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: grailed
        cpe: cpe:2.3:a:grailed:grailed:*:*:*:*:*:*:*:*
        words:
          - 'Grailed'
          - '<title>Grailed: Online Marketplace to Buy Fashion'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: grailed-2
        cpe: cpe:2.3:a:grailed:grailed:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"grailed.com")'
