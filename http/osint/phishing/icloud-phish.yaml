id: iCloud-phish

info:
  name: iCloud phishing Detection
  author: rxerium
  severity: info
  description: |
    A iCloud phishing website was detected
  reference:
    - https://icloud.com
  classification:
    cpe: cpe:2.3:a:icloud:icloud:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: icloud
    product: icloud
  tags: phishing,icloud,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: icloud
        cpe: cpe:2.3:a:icloud:icloud:*:*:*:*:*:*:*:*
        words:
          - 'Log in to iCloud to access your photos, mail, notes, documents and more. Sign in with your Apple&nbsp;ID or create a new account to start using Apple services.'

      - type: status
        status:
          - 200

      - type: dsl
        name: icloud-2
        cpe: cpe:2.3:a:icloud:icloud:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"icloud.com")'
          - '!contains(host,"apple.com")'
        condition: and
