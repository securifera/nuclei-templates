id: gemini-phish

info:
  name: Gemini phishing Detection
  author: rxerium
  severity: info
  description: |
    A Gemini phishing website was detected
  reference:
    - https://gemini.com
  classification:
    cpe: cpe:2.3:a:gemini:gemini:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: gemini
    product: gemini
  tags: phishing,gemini,crypto,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: gemini
        cpe: cpe:2.3:a:gemini:gemini:*:*:*:*:*:*:*:*
        words:
          - 'Gemini'
          - '<title>Buy, Sell &amp; Trade Bitcoin, Solana, &amp; Other Cryptos with Gemini&#x27;s Best-in-class Platform | Gemini'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: gemini-2
        cpe: cpe:2.3:a:gemini:gemini:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"gemini.com")'
