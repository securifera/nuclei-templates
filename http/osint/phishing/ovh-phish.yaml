id: ovh-phish

info:
  name: OVHcloud phishing Detection
  author: rxerium
  severity: info
  description: |
    A OVHcloud phishing website was detected
  reference:
    - https://ovhcloud.com
  classification:
    cpe: cpe:2.3:a:ovh:ovh:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ovh
    product: ovh
  tags: phishing,ovh,cloud,hosting,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: ovh
        cpe: cpe:2.3:a:ovh:ovh:*:*:*:*:*:*:*:*
        words:
          - '<title>Global Cloud Service Provider'

      - type: status
        status:
          - 200

      - type: dsl
        name: ovh-2
        cpe: cpe:2.3:a:ovh:ovh:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"ovhcloud.com")'
          - '!contains(host,"ovh.com")'
