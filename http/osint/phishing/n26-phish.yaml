id: n26-phish

info:
  name: N26 phishing Detection
  author: rxerium
  severity: info
  description: |
    An N26 phishing website was detected
  reference:
    - https://n26.com
  classification:
    cpe: cpe:2.3:a:n26:n26:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: n26
    product: n26
  tags: phishing,n26,fintech,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: n26
        cpe: cpe:2.3:a:n26:n26:*:*:*:*:*:*:*:*
        words:
          - "It is with sincere gratitude and appreciation of everything we built together, that we made the tough decision to sharpen our focus on our European business."

      - type: status
        status:
          - 200

      - type: dsl
        name: n26-2
        cpe: cpe:2.3:a:n26:n26:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"n26.com")'
