id: deliveroo-phish

info:
  name: deliveroo phishing Detection
  author: rxerium
  severity: info
  description: |
    A deliveroo phishing website was detected
  reference:
    - https://deliveroo.co.uk
  classification:
    cpe: cpe:2.3:a:deliveroo:deliveroo:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: deliveroo
    product: deliveroo
  tags: phishing,deliveroo,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: deliveroo
        cpe: cpe:2.3:a:deliveroo:deliveroo:*:*:*:*:*:*:*:*
        words:
          - 'Deliveroo - Takeaway Food Delivery from Local Restaurants &amp; Shops'

      - type: status
        status:
          - 200

      - type: dsl
        name: deliveroo-2
        cpe: cpe:2.3:a:deliveroo:deliveroo:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"deliveroo.com")'
          - '!contains(host,"deliveroo.co.uk")'
