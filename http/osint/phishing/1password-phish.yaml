id: 1password-phish

info:
  name: 1password phishing Detection
  author: rxerium
  severity: info
  description: |
    A 1password phishing website was detected
  reference:
    - https://1password.com
  classification:
    cpe: cpe:2.3:a:1password:1password:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: 1password
    product: 1password
  tags: phishing,1password,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: 1password
        cpe: cpe:2.3:a:1password:1password:*:*:*:*:*:*:*:*
        words:
          - 'Password Manager for Families, Enterprise &amp; Business | 1Password'

      - type: status
        status:
          - 200

      - type: dsl
        name: 1password-2
        cpe: cpe:2.3:a:1password:1password:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"1password.com")'
