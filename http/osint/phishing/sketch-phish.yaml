id: sketch-phish

info:
  name: Sketch phishing Detection
  author: rxerium
  severity: info
  description: |
    A Sketch phishing website was detected
  reference:
    - https://sketch.com
  classification:
    cpe: cpe:2.3:a:sketch:sketch:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sketch
    product: sketch
  tags: phishing,sketch,design,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: sketch
        cpe: cpe:2.3:a:sketch:sketch:*:*:*:*:*:*:*:*
        words:
          - '<title>Sketch · Design, prototype, collaborate and handoff'

      - type: status
        status:
          - 200

      - type: dsl
        name: sketch-2
        cpe: cpe:2.3:a:sketch:sketch:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"sketch.com")'
