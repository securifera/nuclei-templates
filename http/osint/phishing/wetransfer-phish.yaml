id: wetransfer-phish

info:
  name: wetransfer phishing Detection
  author: rxerium
  severity: info
  description: |
    A wetransfer phishing website was detected
  reference:
    - https://wetransfer.com
  classification:
    cpe: cpe:2.3:a:wetransfer:wetransfer:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wetransfer
    product: wetransfer
  tags: phishing,wetransfer,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: wetransfer
        cpe: cpe:2.3:a:wetransfer:wetransfer:*:*:*:*:*:*:*:*
        words:
          - 'WeTransfer - Send Large Files &amp; Share Photos Online'

      - type: status
        status:
          - 200

      - type: dsl
        name: wetransfer-2
        cpe: cpe:2.3:a:wetransfer:wetransfer:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"wetransfer.com")'
