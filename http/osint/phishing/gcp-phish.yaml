id: gcp-phish

info:
  name: Google Cloud Platform phishing Detection
  author: rxerium
  severity: info
  description: |
    A Google Cloud Platform phishing website was detected
  reference:
    - https://cloud.google.com
  classification:
    cpe: cpe:2.3:a:gcp:gcp:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: gcp
    product: gcp
  tags: phishing,gcp,google-cloud,cloud,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: gcp
        cpe: cpe:2.3:a:gcp:gcp:*:*:*:*:*:*:*:*
        words:
          - "Meet your business challenges head on with cloud computing services from Google, including data management, hybrid & multi-cloud, and AI & ML."

      - type: status
        status:
          - 200

      - type: dsl
        name: gcp-2
        cpe: cpe:2.3:a:gcp:gcp:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"cloud.google.com")'
          - '!contains(host,"google.com")'
