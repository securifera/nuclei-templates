id: trend-micro-phish

info:
  name: trend micro phishing Detection
  author: rxerium
  severity: info
  description: |
    A trend micro phishing website was detected
  reference:
    - https://trendmicro.com
  classification:
    cpe: cpe:2.3:a:trend-micro:trend-micro:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: trend-micro
    product: trend-micro
  tags: phishing,trend-micro,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: trend-micro
        cpe: cpe:2.3:a:trend-micro:trend-micro:*:*:*:*:*:*:*:*
        words:
          - 'Trend Micro (UK) | Internet Security Antivirus - PC &amp; Mac'

      - type: status
        status:
          - 200

      - type: dsl
        name: trend-micro-2
        cpe: cpe:2.3:a:trend-micro:trend-micro:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"trendmicro.com")'
