id: bank-central-asia-phish

info:
  name: Bank Central Asia Phishing - Detect
  author: bocgoInfosec
  severity: info
  description: |
    A Bank Central Asia (BCA) phishing website was detected
  reference:
    - https://bca.co.id
  classification:
    cpe: cpe:2.3:a:bank-central-asia:bank-central-asia:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: bank-central-asia
    product: bank-central-asia
  tags: phishing,bca,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: bank-central-asia
        cpe: cpe:2.3:a:bank-central-asia:bank-central-asia:*:*:*:*:*:*:*:*
        words:
          - "BCA - Senantiasa di sisi Anda"
          - "BCA - Always by your side"
          - "myBCA"
        condition: or

      - type: status
        status:
          - 200

      - type: dsl
        name: bank-central-asia-2
        cpe: cpe:2.3:a:bank-central-asia:bank-central-asia:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"bca.co.id")'
