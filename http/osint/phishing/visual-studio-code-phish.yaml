id: visual-studio-code-phish

info:
  name: visual studio code phishing Detection
  author: rxerium
  severity: info
  description: |
    A visual studio code phishing website was detected
  reference:
    - https://visualstudio.com
  classification:
    cpe: cpe:2.3:a:visual-studio-code:visual-studio-code:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: visual-studio-code
    product: visual-studio-code
  tags: phishing,visual-studio-code,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: visual-studio-code
        cpe: cpe:2.3:a:visual-studio-code:visual-studio-code:*:*:*:*:*:*:*:*
        words:
          - 'Visual Studio Code is a code editor redefined and optimized for building and debugging modern web and cloud applications.  Visual Studio Code is free and available on your favorite platform - Linux, macOS, and Windows.'
          - 'Visual Studio Code - Code Editing. Redefined'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: visual-studio-code-2
        cpe: cpe:2.3:a:visual-studio-code:visual-studio-code:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"visualstudio.com")'
