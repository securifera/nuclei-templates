id: lowes-phish

info:
  name: Lowe's phishing Detection
  author: rxerium
  severity: info
  description: |
    A Lowe's phishing website was detected
  reference:
    - https://lowes.com
  classification:
    cpe: cpe:2.3:a:lowes:lowes:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: lowes
    product: lowes
  tags: phishing,lowes,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: lowes
        cpe: cpe:2.3:a:lowes:lowes:*:*:*:*:*:*:*:*
        words:
          - "Lowe's"
          - "Lowe’s Home Improvement"
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: lowes-2
        cpe: cpe:2.3:a:lowes:lowes:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"lowes.com")'
