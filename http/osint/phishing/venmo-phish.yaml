id: venmo-phish

info:
  name: Venmo phishing Detection
  author: rxerium
  severity: info
  description: |
    A Venmo phishing website was detected
  reference:
    - https://venmo.com
  classification:
    cpe: cpe:2.3:a:venmo:venmo:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: venmo
    product: venmo
  tags: phishing,venmo,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: venmo
        cpe: cpe:2.3:a:venmo:venmo:*:*:*:*:*:*:*:*
        words:
          - "Pay Friends | Payments App | Venmo"
          - 'Pay. Get paid. Shop. Share.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: venmo-2
        cpe: cpe:2.3:a:venmo:venmo:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"venmo.com")'
