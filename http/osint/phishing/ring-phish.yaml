id: ring-phish

info:
  name: Ring phishing Detection
  author: rxerium
  severity: info
  description: |
    A Ring phishing website was detected
  reference:
    - https://ring.com
  classification:
    cpe: cpe:2.3:a:ring:ring:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ring
    product: ring
  tags: phishing,ring,security,iot,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: ring
        cpe: cpe:2.3:a:ring:ring:*:*:*:*:*:*:*:*
        words:
          - '<title>Home Security Systems - Cameras, Alarms, Doorbells | Ring'

      - type: status
        status:
          - 200

      - type: dsl
        name: ring-2
        cpe: cpe:2.3:a:ring:ring:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"ring.com")'
