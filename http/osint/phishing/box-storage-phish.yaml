id: box-phish

info:
  name: box phishing Detection
  author: rxerium
  severity: info
  description: |
    A box phishing website was detected
  reference:
    - https://box.com
  classification:
    cpe: cpe:2.3:a:box-storage:box-storage:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: box-storage
    product: box-storage
  tags: phishing,box-storage,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: box-storage
        cpe: cpe:2.3:a:box-storage:box-storage:*:*:*:*:*:*:*:*
        words:
          - 'Secure File Sharing, Storage, and Collaboration | Box'

      - type: status
        status:
          - 200

      - type: dsl
        name: box-storage-2
        cpe: cpe:2.3:a:box-storage:box-storage:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"box.com")'
