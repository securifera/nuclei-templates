id: rockstar-social-club-phish

info:
  name: Rockstar Social Club phishing Detection
  author: rxerium
  severity: info
  description: |
    A Rockstar Social Club phishing website was detected
  reference:
    - https://socialclub.rockstargames.com
  classification:
    cpe: cpe:2.3:a:rockstar-social-club:rockstar-social-club:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: rockstar-social-club
    product: rockstar-social-club
  tags: phishing,rockstar-social-club,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: rockstar-social-club
        cpe: cpe:2.3:a:rockstar-social-club:rockstar-social-club:*:*:*:*:*:*:*:*
        words:
          - "The official home of Rockstar Games"

      - type: status
        status:
          - 200

      - type: dsl
        name: rockstar-social-club-2
        cpe: cpe:2.3:a:rockstar-social-club:rockstar-social-club:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"socialclub.rockstargames.com")'
          - '!contains(host,"rockstargames.com")'
