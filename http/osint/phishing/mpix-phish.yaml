id: mpix-phish

info:
  name: MPIX phishing Detection
  author: rxerium
  severity: info
  description: |
    An MPIX phishing website was detected
  reference:
    - https://mpix.com
  classification:
    cpe: cpe:2.3:a:mpix:mpix:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: mpix
    product: mpix
  tags: phishing,mpix,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: mpix
        cpe: cpe:2.3:a:mpix:mpix:*:*:*:*:*:*:*:*
        words:
          - 'Mpix'
          - '<title>Mpix Photo Lab | Create Custom Photo Products'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: mpix-2
        cpe: cpe:2.3:a:mpix:mpix:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"mpix.com")'
