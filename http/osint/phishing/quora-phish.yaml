id: quora-phish

info:
  name: quora phishing Detection
  author: rxerium
  severity: info
  description: |
    A quora phishing website was detected
  reference:
    - https://quora.com
  classification:
    cpe: cpe:2.3:a:quora:quora:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: quora
    product: quora
  tags: phishing,quora,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: quora
        cpe: cpe:2.3:a:quora:quora:*:*:*:*:*:*:*:*
        words:
          - 'Quora - A place to share knowledge and better understand the world'

      - type: status
        status:
          - 200

      - type: dsl
        name: quora-2
        cpe: cpe:2.3:a:quora:quora:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"quora.com")'
