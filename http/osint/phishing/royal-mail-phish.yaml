id: royal-mail-phish

info:
  name: royal-mail phishing Detection
  author: rxerium
  severity: info
  description: |
    A royal-mail phishing website was detected
  reference:
    - https://royalmail.com
  classification:
    cpe: cpe:2.3:a:royal-mail:royal-mail:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: royal-mail
    product: royal-mail
  tags: phishing,royal-mail,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: royal-mail
        cpe: cpe:2.3:a:royal-mail:royal-mail:*:*:*:*:*:*:*:*
        words:
          - 'Log in | Royal Mail Group Ltd'

      - type: status
        status:
          - 200

      - type: dsl
        name: royal-mail-2
        cpe: cpe:2.3:a:royal-mail:royal-mail:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"royalmail.com")'
