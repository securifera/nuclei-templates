id: rabobank-phish

info:
  name: Rabobank phishing Detection
  author: rxerium
  severity: info
  description: |
    A Rabobank phishing website was detected
  reference:
    - https://rabobank.com
  classification:
    cpe: cpe:2.3:a:rabobank:rabobank:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: rabobank
    product: rabobank
  tags: phishing,rabobank,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: rabobank
        cpe: cpe:2.3:a:rabobank:rabobank:*:*:*:*:*:*:*:*
        words:
          - "Looks like something went wrong…"

      - type: status
        status:
          - 200

      - type: dsl
        name: rabobank-2
        cpe: cpe:2.3:a:rabobank:rabobank:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"rabobank.com")'
