id: o2-mobile-phish

info:
  name: o2 phishing Detection
  author: rxerium
  severity: info
  description: |
    A o2 phishing website was detected
  reference:
    - https://o2.co.uk
  classification:
    cpe: cpe:2.3:a:o2-mobile:o2-mobile:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: o2-mobile
    product: o2-mobile
  tags: phishing,o2,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: o2-mobile
        cpe: cpe:2.3:a:o2-mobile:o2-mobile:*:*:*:*:*:*:*:*
        words:
          - 'O2 | Phone, SIM &amp; Tech Deals - See What You Can Do'

      - type: status
        status:
          - 200

      - type: dsl
        name: o2-mobile-2
        cpe: cpe:2.3:a:o2-mobile:o2-mobile:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"o2.co.uk")'
