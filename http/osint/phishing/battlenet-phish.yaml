id: battlenet-phish

info:
  name: battlenet phishing Detection
  author: rxerium
  severity: info
  description: |
    A battlenet phishing website was detected
  reference:
    - https://eu.account.battle.net/login
  classification:
    cpe: cpe:2.3:a:battlenet:battlenet:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: battlenet
    product: battlenet
  tags: phishing,battlenet,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: battlenet
        cpe: cpe:2.3:a:battlenet:battlenet:*:*:*:*:*:*:*:*
        words:
          - 'Battle.net Login'

      - type: status
        status:
          - 200

      - type: dsl
        name: battlenet-2
        cpe: cpe:2.3:a:battlenet:battlenet:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"battle.net")'
          - '!contains(host,"blizzard.com")'
