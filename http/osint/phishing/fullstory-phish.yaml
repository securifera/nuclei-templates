id: fullstory-phish

info:
  name: FullStory phishing Detection
  author: rxerium
  severity: info
  description: |
    A FullStory phishing website was detected
  reference:
    - https://fullstory.com
  classification:
    cpe: cpe:2.3:a:fullstory:fullstory:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: fullstory
    product: fullstory
  tags: phishing,fullstory,analytics,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: fullstory
        cpe: cpe:2.3:a:fullstory:fullstory:*:*:*:*:*:*:*:*
        words:
          - '<title>FullStory | Digital Experience Intelligence Platform'

      - type: status
        status:
          - 200

      - type: dsl
        name: fullstory-2
        cpe: cpe:2.3:a:fullstory:fullstory:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"fullstory.com")'
