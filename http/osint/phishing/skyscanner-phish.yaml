id: skyscanner-phish

info:
  name: skyscanner phishing Detection
  author: rxerium
  severity: info
  description: |
    A skyscanner phishing website was detected
  reference:
    - https://skyscanner.net
  classification:
    cpe: cpe:2.3:a:skyscanner:skyscanner:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: skyscanner
    product: skyscanner
  tags: phishing,skyscanner,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: skyscanner
        cpe: cpe:2.3:a:skyscanner:skyscanner:*:*:*:*:*:*:*:*
        words:
          - 'Compare Cheap Flights &amp; Book Airline Tickets to Everywhere | Skyscanner'

      - type: status
        status:
          - 200

      - type: dsl
        name: skyscanner-2
        cpe: cpe:2.3:a:skyscanner:skyscanner:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"skyscanner.net")'
