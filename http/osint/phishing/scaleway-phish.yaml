id: scaleway-phish

info:
  name: Scaleway phishing Detection
  author: rxerium
  severity: info
  description: |
    A Scaleway phishing website was detected
  reference:
    - https://scaleway.com
  classification:
    cpe: cpe:2.3:a:scaleway:scaleway:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: scaleway
    product: scaleway
  tags: phishing,scaleway,cloud,hosting,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: scaleway
        cpe: cpe:2.3:a:scaleway:scaleway:*:*:*:*:*:*:*:*
        words:
          - '<title>European. Cloud. AI. | Scaleway'

      - type: status
        status:
          - 200

      - type: dsl
        name: scaleway-2
        cpe: cpe:2.3:a:scaleway:scaleway:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"scaleway.com")'
