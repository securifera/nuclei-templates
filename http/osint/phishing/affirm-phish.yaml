id: affirm-phish

info:
  name: Affirm phishing Detection
  author: rxerium
  severity: info
  description: |
    A Affirm phishing website was detected
  reference:
    - https://affirm.com
  classification:
    cpe: cpe:2.3:a:affirm:affirm:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: affirm
    product: affirm
  tags: phishing,affirm,payment,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: affirm
        cpe: cpe:2.3:a:affirm:affirm:*:*:*:*:*:*:*:*
        words:
          - '<title>Affirm | Pay over time with flexible payment plans and no fees'

      - type: status
        status:
          - 200

      - type: dsl
        name: affirm-2
        cpe: cpe:2.3:a:affirm:affirm:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"affirm.com")'
