id: gimp-phish

info:
  name: gimp phishing Detection
  author: rxerium
  severity: info
  description: |
    A gimp phishing website was detected
  reference:
    - https://gimp.org
  classification:
    cpe: cpe:2.3:a:gimp:gimp:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: gimp
    product: gimp
  tags: phishing,gimp,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: gimp
        cpe: cpe:2.3:a:gimp:gimp:*:*:*:*:*:*:*:*
        words:
          - 'GIMP - GNU Image Manipulation Program'

      - type: status
        status:
          - 200

      - type: dsl
        name: gimp-2
        cpe: cpe:2.3:a:gimp:gimp:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"gimp.org")'
