id: anz-phish

info:
  name: ANZ phishing Detection
  author: rxerium
  severity: info
  description: |
    An ANZ phishing website was detected
  reference:
    - https://anz.com
  classification:
    cpe: cpe:2.3:a:anz:anz:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: anz
    product: anz
  tags: phishing,anz,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: anz
        cpe: cpe:2.3:a:anz:anz:*:*:*:*:*:*:*:*
        words:
          - '<title>ANZ Personal – Bank accounts, home loans, credit cards &amp; more | ANZ'

      - type: status
        status:
          - 200

      - type: dsl
        name: anz-2
        cpe: cpe:2.3:a:anz:anz:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"anz.com")'
