id: asana-phish

info:
  name: Asana phishing Detection
  author: rxerium
  severity: info
  description: |
    An Asana phishing website was detected
  reference:
    - https://asana.com
  classification:
    cpe: cpe:2.3:a:asana:asana:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: asana
    product: asana
  tags: phishing,asana,productivity,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: asana
        cpe: cpe:2.3:a:asana:asana:*:*:*:*:*:*:*:*
        words:
          - 'window.AsanaStorage.optanonWrapperInitialized'
          - 'Asana'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: asana-2
        cpe: cpe:2.3:a:asana:asana:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"asana.com")'
