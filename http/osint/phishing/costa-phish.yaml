id: costa-phish

info:
  name: costa phishing Detection
  author: rxerium
  severity: info
  description: |
    A costa phishing website was detected
  reference:
    - https://costa.co.uk
  classification:
    cpe: cpe:2.3:a:costa:costa:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: costa
    product: costa
  tags: phishing,costa,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: costa
        cpe: cpe:2.3:a:costa:costa:*:*:*:*:*:*:*:*
        words:
          - 'The Nation&#x27;s Favourite Coffee Shop | Costa Coffee'

      - type: status
        status:
          - 200

      - type: dsl
        name: costa-2
        cpe: cpe:2.3:a:costa:costa:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"costa.co.uk")'
