id: hubspot-phish

info:
  name: HubSpot phishing Detection
  author: rxerium
  severity: info
  description: |
    A HubSpot phishing website was detected
  reference:
    - https://hubspot.com
  classification:
    cpe: cpe:2.3:a:hubspot:hubspot:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: hubspot
    product: hubspot
  tags: phishing,hubspot,crm,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: hubspot
        cpe: cpe:2.3:a:hubspot:hubspot:*:*:*:*:*:*:*:*
        words:
          - '<title>HubSpot | Software &amp; Tools for your Business - Homepage'

      - type: status
        status:
          - 200

      - type: dsl
        name: hubspot-2
        cpe: cpe:2.3:a:hubspot:hubspot:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"hubspot.com")'
