id: messenger-phish

info:
  name: messenger phishing Detection
  author: rxerium
  severity: info
  description: |
    A messenger phishing website was detected
  reference:
    - https://messenger.com
  classification:
    cpe: cpe:2.3:a:messenger:messenger:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: messenger
    product: messenger
  tags: phishing,messenger,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: messenger
        cpe: cpe:2.3:a:messenger:messenger:*:*:*:*:*:*:*:*
        words:
          - 'Hang out anytime, anywhere&#x2014;Messenger makes it easy and fun to stay close to your favorite people'

      - type: status
        status:
          - 200

      - type: dsl
        name: messenger-2
        cpe: cpe:2.3:a:messenger:messenger:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"messenger.com")'
