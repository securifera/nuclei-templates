id: twitch-phish

info:
  name: Twitch phishing Detection
  author: rxerium
  severity: info
  description: |
    A twitch phishing website was detected
  reference:
    - https://twitch.tv
  classification:
    cpe: cpe:2.3:a:twitch:twitch:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: twitch
    product: twitch
  tags: phishing,twitch,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: twitch
        cpe: cpe:2.3:a:twitch:twitch:*:*:*:*:*:*:*:*
        words:
          - 'Twitch is an interactive livestreaming service for content spanning gaming, entertainment, sports, music, and more. There’s something for everyone on Twitch.'

      - type: status
        status:
          - 200

      - type: dsl
        name: twitch-2
        cpe: cpe:2.3:a:twitch:twitch:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"twitch.tv")'
