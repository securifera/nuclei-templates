id: bank-of-america-phish

info:
  name: Bank Of America phishing Detection
  author: rxerium
  severity: info
  description: |
    A Bank Of America phishing website was detected
  reference:
    - https://bankofamerica.com
  classification:
    cpe: cpe:2.3:a:bank-of-america:bank-of-america:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: bank-of-america
    product: bank-of-america
  tags: phishing,BankOfAmerica,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: bank-of-america
        cpe: cpe:2.3:a:bank-of-america:bank-of-america:*:*:*:*:*:*:*:*
        words:
          - 'Bank of America - Banking, Credit Cards, Loans and Merrill Investing'

      - type: status
        status:
          - 200

      - type: dsl
        name: bank-of-america-2
        cpe: cpe:2.3:a:bank-of-america:bank-of-america:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"bankofamerica.com")'
