id: afterpay-phish

info:
  name: Afterpay phishing Detection
  author: rxerium
  severity: info
  description: |
    A Afterpay phishing website was detected
  reference:
    - https://afterpay.com
  classification:
    cpe: cpe:2.3:a:afterpay:afterpay:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: afterpay
    product: afterpay
  tags: phishing,afterpay,payment,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: afterpay
        cpe: cpe:2.3:a:afterpay:afterpay:*:*:*:*:*:*:*:*
        words:
          - '<title>Buy Now Pay Later with Afterpay'

      - type: status
        status:
          - 200

      - type: dsl
        name: afterpay-2
        cpe: cpe:2.3:a:afterpay:afterpay:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"afterpay.com")'
