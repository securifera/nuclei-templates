id: webflow-phish

info:
  name: Webflow phishing Detection
  author: rxerium
  severity: info
  description: |
    A Webflow phishing website was detected
  reference:
    - https://webflow.com
  classification:
    cpe: cpe:2.3:a:webflow:webflow:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: webflow
    product: webflow
  tags: phishing,webflow,website-builder,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: webflow
        cpe: cpe:2.3:a:webflow:webflow:*:*:*:*:*:*:*:*
        words:
          - '<title>Webflow: Create a custom website | Visual website builder'

      - type: status
        status:
          - 200

      - type: dsl
        name: webflow-2
        cpe: cpe:2.3:a:webflow:webflow:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"webflow.com")'
