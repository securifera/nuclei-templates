id: okta-phish

info:
  name: Okta phishing Detection
  author: rxerium
  severity: info
  description: |
    An Okta phishing website was detected
  reference:
    - https://okta.com
  classification:
    cpe: cpe:2.3:a:okta:okta:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: okta
    product: okta
  tags: phishing,okta,sso,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: okta
        cpe: cpe:2.3:a:okta:okta:*:*:*:*:*:*:*:*
        words:
          - "The Okta and Auth0 Platforms enable secure access, authentication, and automation — putting Identity at the heart of business security and growth."

      - type: status
        status:
          - 200

      - type: dsl
        name: okta-2
        cpe: cpe:2.3:a:okta:okta:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"okta.com")'
