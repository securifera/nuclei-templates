id: epic-games-phish

info:
  name: Epic Games phishing Detection
  author: rxerium
  severity: info
  description: |
    An Epic Games phishing website was detected
  reference:
    - https://epicgames.com
  classification:
    cpe: cpe:2.3:a:epic-games:epic-games:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: epic-games
    product: epic-games
  tags: phishing,epic-games,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: epic-games
        cpe: cpe:2.3:a:epic-games:epic-games:*:*:*:*:*:*:*:*
        words:
          - 'The Epic Games Store is now open.'
          - 'Epic Games'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: epic-games-2
        cpe: cpe:2.3:a:epic-games:epic-games:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"epicgames.com")'
