id: avast-phish

info:
  name: avast phishing Detection
  author: rxerium
  severity: info
  description: |
    An avast phishing website was detected
  reference:
    - https://avast.com
  classification:
    cpe: cpe:2.3:a:avast:avast:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: avast
    product: avast
  tags: phishing,avast,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: avast
        cpe: cpe:2.3:a:avast:avast:*:*:*:*:*:*:*:*
        words:
          - 'Avast | Download Free Antivirus &amp; VPN | 100% Free &amp; Easy'

      - type: status
        status:
          - 200

      - type: dsl
        name: avast-2
        cpe: cpe:2.3:a:avast:avast:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"avast.com")'
