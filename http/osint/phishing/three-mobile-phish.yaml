id: three-mobile-phish

info:
  name: three phishing Detection
  author: rxerium
  severity: info
  description: |
    A three phishing website was detected
  reference:
    - https://three.co.uk
  classification:
    cpe: cpe:2.3:a:three:three:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: three
    product: three
  tags: phishing,three,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: three
        cpe: cpe:2.3:a:three:three:*:*:*:*:*:*:*:*
        words:
          - 'Three | Phones, Broadband &amp; SIM Only deals'

      - type: status
        status:
          - 200

      - type: dsl
        name: three-2
        cpe: cpe:2.3:a:three:three:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"three.co.uk")'
