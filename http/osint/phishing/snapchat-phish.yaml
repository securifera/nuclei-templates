id: snapchat-phish

info:
  name: Snapchat phishing Detection
  author: rxerium
  severity: info
  description: |
    A Snapchat phishing website was detected
  reference:
    - https://snapchat.com
  classification:
    cpe: cpe:2.3:a:snapchat:snapchat:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: snapchat
    product: snapchat
  tags: phishing,snapchat,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: snapchat
        cpe: cpe:2.3:a:snapchat:snapchat:*:*:*:*:*:*:*:*
        words:
          - "Snapchat - Say It In A Snap"
          - 'Snapchat'
        condition: or

      - type: status
        status:
          - 200

      - type: dsl
        name: snapchat-2
        cpe: cpe:2.3:a:snapchat:snapchat:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"snapchat.com")'
