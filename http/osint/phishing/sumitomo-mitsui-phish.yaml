id: sumitomo-mitsui-phish

info:
  name: Sumitomo Mitsui Bank phishing Detection
  author: rxerium
  severity: info
  description: |
    A Sumitomo Mitsui Bank phishing website was detected
  reference:
    - https://smbc.co.jp
  classification:
    cpe: cpe:2.3:a:sumitomo-mitsui:sumitomo-mitsui:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sumitomo-mitsui
    product: sumitomo-mitsui
  tags: phishing,sumitomo-mitsui,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: sumitomo-mitsui
        cpe: cpe:2.3:a:sumitomo-mitsui:sumitomo-mitsui:*:*:*:*:*:*:*:*
        words:
          - 'Sumitomo Mitsui'
          - 'Sign On'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: sumitomo-mitsui-2
        cpe: cpe:2.3:a:sumitomo-mitsui:sumitomo-mitsui:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"smbc.co.jp")'
