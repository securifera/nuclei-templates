id: mullvad-phish

info:
  name: Mullvad VPN phishing Detection
  author: rxerium
  severity: info
  description: |
    A Mullvad VPN phishing website was detected
  reference:
    - https://mullvad.net
  classification:
    cpe: cpe:2.3:a:mullvad:mullvad:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: mullvad
    product: mullvad
  tags: phishing,mullvad,vpn,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: mullvad
        cpe: cpe:2.3:a:mullvad:mullvad:*:*:*:*:*:*:*:*
        words:
          - '<title>Mullvad VPN - Privacy is for the people'

      - type: status
        status:
          - 200

      - type: dsl
        name: mullvad-2
        cpe: cpe:2.3:a:mullvad:mullvad:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"mullvad.net")'
