id: viber-phish

info:
  name: Viber phishing Detection
  author: rxerium
  severity: info
  description: |
    A Viber phishing website was detected
  reference:
    - https://viber.com
  classification:
    cpe: cpe:2.3:a:viber:viber:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: viber
    product: viber
  tags: phishing,viber,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: viber
        cpe: cpe:2.3:a:viber:viber:*:*:*:*:*:*:*:*
        words:
          - "Home | Viber"

      - type: status
        status:
          - 200

      - type: dsl
        name: viber-2
        cpe: cpe:2.3:a:viber:viber:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"viber.com")'
