id: vlc-media-phish

info:
  name: vlc media phishing Detection
  author: rxerium
  severity: info
  description: |
    A vlc media phishing website was detected
  reference:
    - https://www.videolan.org
  classification:
    cpe: cpe:2.3:a:vlc-player:vlc-player:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: vlc-player
    product: vlc-player
  tags: phishing,vlc-media,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: vlc-player
        cpe: cpe:2.3:a:vlc-player:vlc-player:*:*:*:*:*:*:*:*
        words:
          - 'VLC: Official site - Free multimedia solutions for all OS! - VideoLAN'

      - type: status
        status:
          - 200

      - type: dsl
        name: vlc-player-2
        cpe: cpe:2.3:a:vlc-player:vlc-player:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"videolan.org")'
