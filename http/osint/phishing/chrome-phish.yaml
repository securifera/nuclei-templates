id: chrome-phish

info:
  name: chrome phishing Detection
  author: rxerium
  severity: info
  description: |
    A chrome phishing website was detected
  reference:
    - https://www.google.com/intl/en_uk/chrome/
  classification:
    cpe: cpe:2.3:a:chrome:chrome:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: chrome
    product: chrome
  tags: phishing,chrome,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: chrome
        cpe: cpe:2.3:a:chrome:chrome:*:*:*:*:*:*:*:*
        words:
          - 'Google Chrome – Download the fast, secure browser from Google'

      - type: status
        status:
          - 200

      - type: dsl
        name: chrome-2
        cpe: cpe:2.3:a:chrome:chrome:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"google.com")'
