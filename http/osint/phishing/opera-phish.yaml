id: opera-phish

info:
  name: opera phishing Detection
  author: rxerium
  severity: info
  description: |
    A opera phishing website was detected
  reference:
    - https://opera.com
  classification:
    cpe: cpe:2.3:a:opera:opera:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: opera
    product: opera
  tags: phishing,opera,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: opera
        cpe: cpe:2.3:a:opera:opera:*:*:*:*:*:*:*:*
        words:
          - 'Opera Web Browser | Faster, Safer, Smarter | Oper'

      - type: status
        status:
          - 200

      - type: dsl
        name: opera-2
        cpe: cpe:2.3:a:opera:opera:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"opera.com")'
