id: signal-phish

info:
  name: signal phishing Detection
  author: rxerium
  severity: info
  description: |
    A signal phishing website was detected
  reference:
    - https://signal.org
  classification:
    cpe: cpe:2.3:a:signal:signal:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: signal
    product: signal
  tags: phishing,signal,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: signal
        cpe: cpe:2.3:a:signal:signal:*:*:*:*:*:*:*:*
        words:
          - 'Say &quot;hello&quot; to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'

      - type: status
        status:
          - 200

      - type: dsl
        name: signal-2
        cpe: cpe:2.3:a:signal:signal:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"signal.org")'
