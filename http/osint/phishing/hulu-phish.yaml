id: hulu-phish

info:
  name: Hulu phishing Detection
  author: rxerium
  severity: info
  description: |
    A Hulu phishing website was detected
  reference:
    - https://hulu.com
  classification:
    cpe: cpe:2.3:a:hulu:hulu:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: hulu
    product: hulu
  tags: phishing,hulu,streaming,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: hulu
        cpe: cpe:2.3:a:hulu:hulu:*:*:*:*:*:*:*:*
        words:
          - 'Hulu'
          - 'Stream TV and Movies Live and Online | Hulu"'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: hulu-2
        cpe: cpe:2.3:a:hulu:hulu:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"hulu.com")'
