id: plusnet-phish

info:
  name: plusnet phishing Detection
  author: rxerium
  severity: info
  description: |
    A plusnet phishing website was detected
  reference:
    - https://plus.net
  classification:
    cpe: cpe:2.3:a:plusnet:plusnet:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: plusnet
    product: plusnet
  tags: phishing,plusnet,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: plusnet
        cpe: cpe:2.3:a:plusnet:plusnet:*:*:*:*:*:*:*:*
        words:
          - 'Multi-Award Winner with Even Faster UK Broadband | Plusnet'

      - type: status
        status:
          - 200

      - type: dsl
        name: plusnet-2
        cpe: cpe:2.3:a:plusnet:plusnet:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"plus.net")'
