id: kinguin-phish

info:
  name: Kinguin phishing Detection
  author: rxerium
  severity: info
  description: |
    A Kinguin phishing website was detected
  reference:
    - https://kinguin.net
  classification:
    cpe: cpe:2.3:a:kinguin:kinguin:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kinguin
    product: kinguin
  tags: phishing,kinguin,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: kinguin
        cpe: cpe:2.3:a:kinguin:kinguin:*:*:*:*:*:*:*:*
        words:
          - 'Kinguin'
          - 'Steam CD Keys and PC Game Keys - Compare &amp; Buy | Kinguin.net'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: kinguin-2
        cpe: cpe:2.3:a:kinguin:kinguin:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"kinguin.net")'
