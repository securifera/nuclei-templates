id: sophos-phish

info:
  name: sophos phishing Detection
  author: rxerium
  severity: info
  description: |
    A sophos phishing website was detected
  reference:
    - https://sophos.com
  classification:
    cpe: cpe:2.3:a:sophos:sophos:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sophos
    product: sophos
  tags: phishing,sophos,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: sophos
        cpe: cpe:2.3:a:sophos:sophos:*:*:*:*:*:*:*:*
        words:
          - 'Cybersecurity as a Service Delivered | Sophos'

      - type: status
        status:
          - 200

      - type: dsl
        name: sophos-2
        cpe: cpe:2.3:a:sophos:sophos:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"sophos.com")'
