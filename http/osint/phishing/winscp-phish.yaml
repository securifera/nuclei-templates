id: winscp-phish

info:
  name: winscp phishing Detection
  author: rxerium
  severity: info
  description: |
    A winscp phishing website was detected
  reference:
    - https://winscp.net
  classification:
    cpe: cpe:2.3:a:winscp:winscp:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: winscp
    product: winscp
  tags: phishing,winscp,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: winscp
        cpe: cpe:2.3:a:winscp:winscp:*:*:*:*:*:*:*:*
        words:
          - 'WinSCP :: Official Site :: Free SFTP and FTP client for Windows'

      - type: status
        status:
          - 200

      - type: dsl
        name: winscp-2
        cpe: cpe:2.3:a:winscp:winscp:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"winscp.net")'
