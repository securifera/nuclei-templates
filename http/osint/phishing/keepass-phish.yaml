id: keepass-phish

info:
  name: keepass phishing Detection
  author: rxerium
  severity: info
  description: |
    A keepass phishing website was detected
  reference:
    - https://keepass.info
  classification:
    cpe: cpe:2.3:a:keepass:keepass:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: keepass
    product: keepass
  tags: phishing,keepass,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: keepass
        cpe: cpe:2.3:a:keepass:keepass:*:*:*:*:*:*:*:*
        words:
          - 'KeePass is a free open source password manager. Passwords can be stored in an encrypted database, which can be unlocked with one master key.'

      - type: status
        status:
          - 200

      - type: dsl
        name: keepass-2
        cpe: cpe:2.3:a:keepass:keepass:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"keepass.info")'
