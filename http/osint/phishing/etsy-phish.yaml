id: etsy-phish

info:
  name: Etsy phishing Detection
  author: rxerium
  severity: info
  description: |
    An Etsy phishing website was detected
  reference:
    - https://etsy.com
  classification:
    cpe: cpe:2.3:a:etsy:etsy:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: etsy
    product: etsy
  tags: phishing,etsy,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: etsy
        cpe: cpe:2.3:a:etsy:etsy:*:*:*:*:*:*:*:*
        words:
          - "etsy.com"
          - 'Shop for handmade, vintage, custom, and unique gifts'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: etsy-2
        cpe: cpe:2.3:a:etsy:etsy:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"etsy.com")'
