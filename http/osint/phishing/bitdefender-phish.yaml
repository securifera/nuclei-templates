id: bitdefender-phish

info:
  name: bitdefender phishing Detection
  author: rxerium
  severity: info
  description: |
    A bitdefender phishing website was detected
  reference:
    - https://bitdefender.com
  classification:
    cpe: cpe:2.3:a:bitdefender:bitdefender:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: bitdefender
    product: bitdefender
  tags: phishing,bitdefender,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: bitdefender
        cpe: cpe:2.3:a:bitdefender:bitdefender:*:*:*:*:*:*:*:*
        words:
          - 'Bitdefender - Global Leader in Cybersecurity Software'

      - type: status
        status:
          - 200

      - type: dsl
        name: bitdefender-2
        cpe: cpe:2.3:a:bitdefender:bitdefender:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"bitdefender.com")'
          - '!contains(host,"bitdefender.co.uk")'
