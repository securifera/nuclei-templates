id: evernote-phish

info:
  name: evernote phishing Detection
  author: rxerium
  severity: info
  description: |
    A evernote phishing website was detected
  reference:
    - https://evernote.com
  classification:
    cpe: cpe:2.3:a:evernote:evernote:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: evernote
    product: evernote
  tags: phishing,evernote,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: evernote
        cpe: cpe:2.3:a:evernote:evernote:*:*:*:*:*:*:*:*
        words:
          - 'Best Note Taking App - Organize Your Notes with Evernote'

      - type: status
        status:
          - 200

      - type: dsl
        name: evernote-2
        cpe: cpe:2.3:a:evernote:evernote:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"evernote.com")'
