id: gitpod-phish

info:
  name: Gitpod phishing Detection
  author: rxerium
  severity: info
  description: |
    A Gitpod phishing website was detected
  reference:
    - https://gitpod.io
  classification:
    cpe: cpe:2.3:a:gitpod:gitpod:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: gitpod
    product: gitpod
  tags: phishing,gitpod,developer,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: gitpod
        cpe: cpe:2.3:a:gitpod:gitpod:*:*:*:*:*:*:*:*
        words:
          - '<title>Gitpod - Always Ready to Code'

      - type: status
        status:
          - 200

      - type: dsl
        name: gitpod-2
        cpe: cpe:2.3:a:gitpod:gitpod:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"gitpod.io")'
