id: hbo-max-phish

info:
  name: HBO Max phishing Detection
  author: rxerium
  severity: info
  description: |
    An HBO Max phishing website was detected
  reference:
    - https://hbomax.com
  classification:
    cpe: cpe:2.3:a:hbo-max:hbo-max:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: hbo-max
    product: hbo-max
  tags: phishing,hbo-max,streaming,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: hbo-max
        cpe: cpe:2.3:a:hbo-max:hbo-max:*:*:*:*:*:*:*:*
        words:
          - "Stream must-see series, hit movies, exclusive originals, family favorites, and live sports."

      - type: status
        status:
          - 200

      - type: dsl
        name: hbo-max-2
        cpe: cpe:2.3:a:hbo-max:hbo-max:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"hbomax.com")'
