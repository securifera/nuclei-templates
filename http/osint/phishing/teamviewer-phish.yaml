id: teamviewer-phish

info:
  name: teamviewer phishing Detection
  author: rxerium
  severity: info
  description: |
    A teamviewer phishing website was detected
  reference:
    - https://teamviewer.com
  classification:
    cpe: cpe:2.3:a:teamviewer:teamviewer:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: teamviewer
    product: teamviewer
  tags: phishing,teamviewer,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: teamviewer
        cpe: cpe:2.3:a:teamviewer:teamviewer:*:*:*:*:*:*:*:*
        words:
          - 'TeamViewer – The Remote Connectivity Software'

      - type: status
        status:
          - 200

      - type: dsl
        name: teamviewer-2
        cpe: cpe:2.3:a:teamviewer:teamviewer:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"teamviewer.com")'
