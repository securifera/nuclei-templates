id: americanmuscle-phish

info:
  name: AmericanMuscle phishing Detection
  author: rxerium
  severity: info
  description: |
    An AmericanMuscle phishing website was detected
  reference:
    - https://americanmuscle.com
  classification:
    cpe: cpe:2.3:a:americanmuscle:americanmuscle:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: americanmuscle
    product: americanmuscle
  tags: phishing,americanmuscle,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: americanmuscle
        cpe: cpe:2.3:a:americanmuscle:americanmuscle:*:*:*:*:*:*:*:*
        words:
          - '<title>Performance Muscle Car Parts & Accessories | AmericanMuscle'

      - type: status
        status:
          - 200

      - type: dsl
        name: americanmuscle-2
        cpe: cpe:2.3:a:americanmuscle:americanmuscle:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"americanmuscle.com")'
