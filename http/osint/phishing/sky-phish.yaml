id: sky-phish

info:
  name: sky phishing Detection
  author: rxerium
  severity: info
  description: |
    A sky phishing website was detected
  reference:
    - https://sky.com
  classification:
    cpe: cpe:2.3:a:sky:sky:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sky
    product: sky
  tags: phishing,sky,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: sky
        cpe: cpe:2.3:a:sky:sky:*:*:*:*:*:*:*:*
        words:
          - 'Discover TV, Broadband & Mobile Phone Packages with Sky'

      - type: status
        status:
          - 200

      - type: dsl
        name: sky-2
        cpe: cpe:2.3:a:sky:sky:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"sky.com")'
