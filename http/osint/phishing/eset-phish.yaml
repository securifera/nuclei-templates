id: eset-phish

info:
  name: eset phishing Detection
  author: rxerium
  severity: info
  description: |
    A eset phishing website was detected
  reference:
    - https://eset.com
  classification:
    cpe: cpe:2.3:a:eset:eset:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: eset
    product: eset
  tags: phishing,eset,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: eset
        cpe: cpe:2.3:a:eset:eset:*:*:*:*:*:*:*:*
        words:
          - 'Malware Protection & Internet Security &#124; ESET'

      - type: status
        status:
          - 200

      - type: dsl
        name: eset-2
        cpe: cpe:2.3:a:eset:eset:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"eset.com")'
