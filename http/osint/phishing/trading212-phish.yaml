id: trading212-phish

info:
  name: trading212 phishing Detection
  author: rxerium
  severity: info
  description: |
    A trading212 phishing website was detected
  reference:
    - https://trading212.com
  classification:
    cpe: cpe:2.3:a:trading212:trading212:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: trading212
    product: trading212
  tags: phishing,trading212,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: trading212
        cpe: cpe:2.3:a:trading212:trading212:*:*:*:*:*:*:*:*
        words:
          - 'Commission-free investing for everyone | Trading 212'

      - type: status
        status:
          - 200

      - type: dsl
        name: trading212-2
        cpe: cpe:2.3:a:trading212:trading212:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"trading212.com")'
