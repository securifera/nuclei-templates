id: mega-phish

info:
  name: mega phishing Detection
  author: rxerium
  severity: info
  description: |
    A mega phishing website was detected
  reference:
    - https://mega.io
  classification:
    cpe: cpe:2.3:a:mega:mega:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: mega
    product: mega
  tags: phishing,mega,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: mega
        cpe: cpe:2.3:a:mega:mega:*:*:*:*:*:*:*:*
        words:
          - 'Home - MEGA'
          - 'Secure and private cloud storage for everyone. Store and share files, chat, meet, back up, sync, and more.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: mega-2
        cpe: cpe:2.3:a:mega:mega:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"mega.io")'
