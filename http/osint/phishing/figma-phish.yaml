id: figma-phish

info:
  name: figma phishing Detection
  author: rxerium
  severity: info
  description: |
    A figma phishing website was detected
  reference:
    - https://figma.com
  classification:
    cpe: cpe:2.3:a:figma:figma:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: figma
    product: figma
  tags: phishing,figma,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: figma
        cpe: cpe:2.3:a:figma:figma:*:*:*:*:*:*:*:*
        words:
          - 'Figma: The Collaborative Interface Design Tool'

      - type: status
        status:
          - 200

      - type: dsl
        name: figma-2
        cpe: cpe:2.3:a:figma:figma:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"figma.com")'
