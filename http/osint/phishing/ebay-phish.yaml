id: ebay-phish

info:
  name: ebay phishing Detection
  author: rxerium
  severity: info
  description: |
    A ebay phishing website was detected
  reference:
    - https://ebay.com
  classification:
    cpe: cpe:2.3:a:ebay:ebay:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ebay
    product: ebay
  tags: phishing,ebay,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: ebay
        cpe: cpe:2.3:a:ebay:ebay:*:*:*:*:*:*:*:*
        words:
          - 'Electronics, Cars, Fashion, Collectibles &amp; More | eBay'

      - type: status
        status:
          - 200

      - type: dsl
        name: ebay-2
        cpe: cpe:2.3:a:ebay:ebay:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"ebay.com")'
