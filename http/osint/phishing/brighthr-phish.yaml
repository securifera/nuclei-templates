id: brighthr-phish

info:
  name: brighthr phishing Detection
  author: rxerium
  severity: info
  description: |
    A brighthr phishing website was detected
  reference:
    - https://brighthr.com
  classification:
    cpe: cpe:2.3:a:brighthr:brighthr:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: brighthr
    product: brighthr
  tags: phishing,brighthr,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: brighthr
        cpe: cpe:2.3:a:brighthr:brighthr:*:*:*:*:*:*:*:*
        words:
          - 'HR Software For SMEs | Human Resources Software | BrightHR'

      - type: status
        status:
          - 200

      - type: dsl
        name: brighthr-2
        cpe: cpe:2.3:a:brighthr:brighthr:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"brighthr.com")'
