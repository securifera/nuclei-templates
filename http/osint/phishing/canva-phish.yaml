id: canva-phish

info:
  name: Canva phishing Detection
  author: rxerium
  severity: info
  description: |
    A Canva phishing website was detected
  reference:
    - https://canva.com
  classification:
    cpe: cpe:2.3:a:canva:canva:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: canva
    product: canva
  tags: phishing,canva,design,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: canva
        cpe: cpe:2.3:a:canva:canva:*:*:*:*:*:*:*:*
        words:
          - '<title>Canva: Visual Suite for Everyone'

      - type: status
        status:
          - 200

      - type: dsl
        name: canva-2
        cpe: cpe:2.3:a:canva:canva:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"canva.com")'
