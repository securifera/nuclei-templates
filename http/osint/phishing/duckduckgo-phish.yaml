id: duckduckgo-phish

info:
  name: duckduckgo phishing Detection
  author: rxerium
  severity: info
  description: |
    A duckduckgo phishing website was detected
  reference:
    - https://duckduckgo.com
  classification:
    cpe: cpe:2.3:a:duckduckgo:duckduckgo:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: duckduckgo
    product: duckduckgo
  tags: phishing,duckduckgo,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: duckduckgo
        cpe: cpe:2.3:a:duckduckgo:duckduckgo:*:*:*:*:*:*:*:*
        words:
          - 'DuckDuckGo — Privacy, simplified.'

      - type: status
        status:
          - 200

      - type: dsl
        name: duckduckgo-2
        cpe: cpe:2.3:a:duckduckgo:duckduckgo:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"duckduckgo.com")'
