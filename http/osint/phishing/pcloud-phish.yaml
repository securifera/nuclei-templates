id: pcloud-phish

info:
  name: pcloud phishing Detection
  author: rxerium
  severity: info
  description: |
    A pcloud phishing website was detected
  reference:
    - https://pcloud.com
  classification:
    cpe: cpe:2.3:a:pcloud:pcloud:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: pcloud
    product: pcloud
  tags: phishing,pcloud,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: pcloud
        cpe: cpe:2.3:a:pcloud:pcloud:*:*:*:*:*:*:*:*
        words:
          - "pCloud - Europe's Most Secure Cloud Storage"

      - type: status
        status:
          - 200

      - type: dsl
        name: pcloud-2
        cpe: cpe:2.3:a:pcloud:pcloud:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"pcloud.com")'
