id: instacart-phish

info:
  name: Instacart phishing Detection
  author: rxerium
  severity: info
  description: |
    An Instacart phishing website was detected
  reference:
    - https://instacart.com
  classification:
    cpe: cpe:2.3:a:instacart:instacart:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: instacart
    product: instacart
  tags: phishing,instacart,food-delivery,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: instacart
        cpe: cpe:2.3:a:instacart:instacart:*:*:*:*:*:*:*:*
        words:
          - "Instacart | Grocery Delivery or Pickup from Local Stores Near You"

      - type: status
        status:
          - 200

      - type: dsl
        name: instacart-2
        cpe: cpe:2.3:a:instacart:instacart:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"instacart.com")'
