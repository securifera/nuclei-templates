id: ee-mobile-phish

info:
  name: ee phishing Detection
  author: rxerium
  severity: info
  description: |
    A ee phishing website was detected
  reference:
    - https://ee.co.uk
  classification:
    cpe: cpe:2.3:a:ee-mobile:ee-mobile:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ee-mobile
    product: ee-mobile
  tags: phishing,ee,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: ee-mobile
        cpe: cpe:2.3:a:ee-mobile:ee-mobile:*:*:*:*:*:*:*:*
        words:
          - 'Superfast 5G &amp; 4G Phones, Tablets and Fibre Broadband | EE'

      - type: status
        status:
          - 200

      - type: dsl
        name: ee-mobile-2
        cpe: cpe:2.3:a:ee-mobile:ee-mobile:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"ee.co.uk")'
