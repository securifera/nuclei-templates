id: trip-phish

info:
  name: trip phishing Detection
  author: rxerium
  severity: info
  description: |
    A trip phishing website was detected
  reference:
    - https://trip.com
  classification:
    cpe: cpe:2.3:a:trip:trip:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: trip
    product: trip
  tags: phishing,trip,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: trip
        cpe: cpe:2.3:a:trip:trip:*:*:*:*:*:*:*:*
        words:
          - 'Trip.com: Book cheap flights, hotels, car rentals, trains and more'

      - type: status
        status:
          - 200

      - type: dsl
        name: trip-2
        cpe: cpe:2.3:a:trip:trip:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"trip.com")'
