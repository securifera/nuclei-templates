id: 1a-auto-phish

info:
  name: 1A Auto phishing Detection
  author: rxerium
  severity: info
  description: |
    A 1A Auto phishing website was detected
  reference:
    - https://1aauto.com
  classification:
    cpe: cpe:2.3:a:1a-auto:1a-auto:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: 1a-auto
    product: 1a-auto
  tags: phishing,1a-auto,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: 1a-auto
        cpe: cpe:2.3:a:1a-auto:1a-auto:*:*:*:*:*:*:*:*
        words:
          - '<title>1A Auto | Aftermarket Car Parts -  Buy Quality Auto Parts Online'

      - type: status
        status:
          - 200

      - type: dsl
        name: 1a-auto-2
        cpe: cpe:2.3:a:1a-auto:1a-auto:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"1aauto.com")'
