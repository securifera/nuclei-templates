id: bnp-paribas-phish

info:
  name: BNP Paribas phishing Detection
  author: rxerium
  severity: info
  description: |
    A BNP Paribas phishing website was detected
  reference:
    - https://bnpparibas.com
  classification:
    cpe: cpe:2.3:a:bnp-paribas:bnp-paribas:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: bnp-paribas
    product: bnp-paribas
  tags: phishing,bnp-paribas,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: bnp-paribas
        cpe: cpe:2.3:a:bnp-paribas:bnp-paribas:*:*:*:*:*:*:*:*
        words:
          - 'BNP Paribas'
          - '<title>Banque BNP Paribas | La banque d&#039;un monde qui change'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: bnp-paribas-2
        cpe: cpe:2.3:a:bnp-paribas:bnp-paribas:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"bnpparibas.com")'
          - '!contains(host,"group.bnpparibas")'
        condition: and
