id: steam-phish

info:
  name: steam phishing Detection
  author: rxerium
  severity: info
  description: |
    A steam phishing website was detected
  reference:
    - https://steampowered.com
  classification:
    cpe: cpe:2.3:a:steam:steam:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: steam
    product: steam
  tags: phishing,steam,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: steam
        cpe: cpe:2.3:a:steam:steam:*:*:*:*:*:*:*:*
        words:
          - 'Welcome to Steam'
          - 'Steam is the ultimate destination for playing, discussing, and creating games.'


      - type: status
        status:
          - 200

      - type: dsl
        name: steam-2
        cpe: cpe:2.3:a:steam:steam:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"steampowered.com")'
