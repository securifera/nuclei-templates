id: natwest-phish

info:
  name: NatWest phishing Detection
  author: rxerium
  severity: info
  description: |
    A NatWest phishing website was detected
  reference:
    - https://natwest.com
  classification:
    cpe: cpe:2.3:a:natwest:natwest:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: natwest
    product: natwest
  tags: phishing,natwest,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: natwest
        cpe: cpe:2.3:a:natwest:natwest:*:*:*:*:*:*:*:*
        words:
          - "Welcome to NatWest. Our extensive personal banking products include bank accounts, mortgages, credit cards, loans and more. Visit today to see how we can serve you."

      - type: status
        status:
          - 200

      - type: dsl
        name: natwest-2
        cpe: cpe:2.3:a:natwest:natwest:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"natwest.com")'
