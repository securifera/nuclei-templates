id: linear-phish

info:
  name: Linear phishing Detection
  author: rxerium
  severity: info
  description: |
    A Linear phishing website was detected
  reference:
    - https://linear.app
  classification:
    cpe: cpe:2.3:a:linear:linear:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: linear
    product: linear
  tags: phishing,linear,productivity,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: linear
        cpe: cpe:2.3:a:linear:linear:*:*:*:*:*:*:*:*
        words:
          - '<title>Linear – Plan and build products'

      - type: status
        status:
          - 200

      - type: dsl
        name: linear-2
        cpe: cpe:2.3:a:linear:linear:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"linear.app")'
