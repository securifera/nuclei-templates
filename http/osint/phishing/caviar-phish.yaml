id: caviar-phish

info:
  name: Caviar phishing Detection
  author: rxerium
  severity: info
  description: |
    A Caviar phishing website was detected
  reference:
    - https://trycaviar.com
  classification:
    cpe: cpe:2.3:a:caviar:caviar:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: caviar
    product: caviar
  tags: phishing,caviar,food-delivery,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: caviar
        cpe: cpe:2.3:a:caviar:caviar:*:*:*:*:*:*:*:*
        words:
          - 'Caviar'
          - 'et food, grocery, and retail essentials delivered fast. Shop same-day delivery from local stores and restaurants near you.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: caviar-2
        cpe: cpe:2.3:a:caviar:caviar:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"trycaviar.com")'
