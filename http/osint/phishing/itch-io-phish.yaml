id: itch-io-phish

info:
  name: itch.io phishing Detection
  author: rxerium
  severity: info
  description: |
    An itch.io phishing website was detected
  reference:
    - https://itch.io
  classification:
    cpe: cpe:2.3:a:itch-io:itch-io:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: itch-io
    product: itch-io
  tags: phishing,itch-io,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: itch-io
        cpe: cpe:2.3:a:itch-io:itch-io:*:*:*:*:*:*:*:*
        words:
          - "itch.io is a simple way to find, download and distribute indie games online. Whether you're a developer looking to upload your game or just someone looking for something new to play itch.io has you covered."

      - type: status
        status:
          - 200

      - type: dsl
        name: itch-io-2
        cpe: cpe:2.3:a:itch-io:itch-io:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"itch.io")'
