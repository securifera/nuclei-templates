id: keepersecurity-phish

info:
  name: keepersecurity phishing Detection
  author: rxerium
  severity: info
  description: |
    A keepersecurity phishing website was detected
  reference:
    - https://keepersecurity.com
  classification:
    cpe: cpe:2.3:a:keepersecurity:keepersecurity:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: keepersecurity
    product: keepersecurity
  tags: phishing,keepersecurity,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: keepersecurity
        cpe: cpe:2.3:a:keepersecurity:keepersecurity:*:*:*:*:*:*:*:*
        words:
          - 'Password and Secrets Management - Keeper Security'

      - type: status
        status:
          - 200

      - type: dsl
        name: keepersecurity-2
        cpe: cpe:2.3:a:keepersecurity:keepersecurity:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"keepersecurity.com")'
