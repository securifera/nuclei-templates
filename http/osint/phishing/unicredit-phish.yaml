id: unicredit-phish

info:
  name: UniCredit phishing Detection
  author: rxerium
  severity: info
  description: |
    A UniCredit phishing website was detected
  reference:
    - https://unicredit.com
  classification:
    cpe: cpe:2.3:a:unicredit:unicredit:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: unicredit
    product: unicredit
  tags: phishing,unicredit,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: unicredit
        cpe: cpe:2.3:a:unicredit:unicredit:*:*:*:*:*:*:*:*
        words:
          - 'UniCredit'
          - 'Sign On'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: unicredit-2
        cpe: cpe:2.3:a:unicredit:unicredit:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"unicredit.com")'
