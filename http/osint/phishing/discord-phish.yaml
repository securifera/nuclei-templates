id: Discord-phish

info:
  name: Discord phishing Detection
  author: rxerium
  severity: info
  description: |
    A Discord phishing website was detected
  reference:
    - https://discord.com
  classification:
    cpe: cpe:2.3:a:discord:discord:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: discord
    product: discord
  tags: phishing,discord,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: discord
        cpe: cpe:2.3:a:discord:discord:*:*:*:*:*:*:*:*
        words:
          - 'Discord | Your Place to Talk and Hang Out'

      - type: status
        status:
          - 200

      - type: dsl
        name: discord-2
        cpe: cpe:2.3:a:discord:discord:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"discord.com")'
