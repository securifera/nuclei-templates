id: zazzle-phish

info:
  name: Zazzle phishing Detection
  author: rxerium
  severity: info
  description: |
    A Zazzle phishing website was detected
  reference:
    - https://zazzle.com
  classification:
    cpe: cpe:2.3:a:zazzle:zazzle:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: zazzle
    product: zazzle
  tags: phishing,zazzle,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: zazzle
        cpe: cpe:2.3:a:zazzle:zazzle:*:*:*:*:*:*:*:*
        words:
          - "Celebrate life’s moments with custom invitations, announcements, photo cards, and more. Discover unique gifts crafted by our community of Independent Creators."

      - type: status
        status:
          - 200

      - type: dsl
        name: zazzle-2
        cpe: cpe:2.3:a:zazzle:zazzle:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"zazzle.com")'
