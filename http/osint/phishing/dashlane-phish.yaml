id: dashlane-phish

info:
  name: dashlane phishing Detection
  author: rxerium
  severity: info
  description: |
    A dashlane phishing website was detected
  reference:
    - https://dashlane.com
  classification:
    cpe: cpe:2.3:a:dashlane:dashlane:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: dashlane
    product: dashlane
  tags: phishing,dashlane,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: dashlane
        cpe: cpe:2.3:a:dashlane:dashlane:*:*:*:*:*:*:*:*
        words:
          - 'Dashlane Password Manager'
          - 'Dashlane Password Manager safeguards businesses &amp; people with easy-to-use, powerful features. Protect &amp; manage passwords and passkeys in one secure solution.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: dashlane-2
        cpe: cpe:2.3:a:dashlane:dashlane:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"dashlane.com")'
