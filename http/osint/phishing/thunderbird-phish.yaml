id: thunderbird-phish

info:
  name: thunderbird phishing Detection
  author: rxerium
  severity: info
  description: |
    A thunderbird phishing website was detected
  reference:
    - https://thunderbird.net
  classification:
    cpe: cpe:2.3:a:thunderbird:thunderbird:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: thunderbird
    product: thunderbird
  tags: phishing,thunderbird,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: thunderbird
        cpe: cpe:2.3:a:thunderbird:thunderbird:*:*:*:*:*:*:*:*
        words:
          - 'Thunderbird — Free Your Inbox. — Thunderbird'

      - type: status
        status:
          - 200

      - type: dsl
        name: thunderbird-2
        cpe: cpe:2.3:a:thunderbird:thunderbird:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"thunderbird.net")'
