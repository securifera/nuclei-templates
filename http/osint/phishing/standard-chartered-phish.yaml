id: standard-chartered-phish

info:
  name: Standard Chartered phishing Detection
  author: rxerium
  severity: info
  description: |
    A Standard Chartered phishing website was detected
  reference:
    - https://sc.com
  classification:
    cpe: cpe:2.3:a:standard-chartered:standard-chartered:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: standard-chartered
    product: standard-chartered
  tags: phishing,standard-chartered,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: standard-chartered
        cpe: cpe:2.3:a:standard-chartered:standard-chartered:*:*:*:*:*:*:*:*
        words:
          - "Standard Chartered Bank"

      - type: status
        status:
          - 200

      - type: dsl
        name: standard-chartered-2
        cpe: cpe:2.3:a:standard-chartered:standard-chartered:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"sc.com")'
