id: advance-auto-phish

info:
  name: Advance Auto Parts phishing Detection
  author: rxerium
  severity: info
  description: |
    An Advance Auto Parts phishing website was detected
  reference:
    - https://advanceautoparts.com
  classification:
    cpe: cpe:2.3:a:advance-auto:advance-auto:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: advance-auto
    product: advance-auto
  tags: phishing,advance-auto,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: advance-auto
        cpe: cpe:2.3:a:advance-auto:advance-auto:*:*:*:*:*:*:*:*
        words:
          - 'Advance Auto Parts: Car, Engine, Batteries, Brakes, Replacement, Performance &amp; Accessories'
          - 'Advance Auto '
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: advance-auto-2
        cpe: cpe:2.3:a:advance-auto:advance-auto:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"advanceautoparts.com")'
