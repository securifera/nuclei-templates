id: linkedin-phish

info:
  name: linkedin phishing Detection
  author: rxerium
  severity: info
  description: |
    A linkedin phishing website was detected
  reference:
    - https://linkedin.com
  classification:
    cpe: cpe:2.3:a:linkedin:linkedin:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: linkedin
    product: linkedin
  tags: phishing,linkedin,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: linkedin
        cpe: cpe:2.3:a:linkedin:linkedin:*:*:*:*:*:*:*:*
        words:
          - 'LinkedIn: Log In or Sign Up'

      - type: status
        status:
          - 200

      - type: dsl
        name: linkedin-2
        cpe: cpe:2.3:a:linkedin:linkedin:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"linkedin.com")'
