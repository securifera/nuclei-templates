id: vultr-phish

info:
  name: vultr phishing Detection
  author: rxerium
  severity: info
  description: |
    A vultr phishing website was detected
  reference:
    - https://my.vultr.com/
  classification:
    cpe: cpe:2.3:a:vultr:vultr:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: vultr
    product: vultr
  tags: phishing,vultr,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: vultr
        cpe: cpe:2.3:a:vultr:vultr:*:*:*:*:*:*:*:*
        words:
          - 'Log In to your Vultr Account - Vultr.com'

      - type: status
        status:
          - 200

      - type: dsl
        name: vultr-2
        cpe: cpe:2.3:a:vultr:vultr:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"vultr.com")'
