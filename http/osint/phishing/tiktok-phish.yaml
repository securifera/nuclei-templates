id: tiktok-phish

info:
  name: tiktok phishing Detection
  author: rxerium
  severity: info
  description: |
    A tiktok phishing website was detected
  reference:
    - https://tiktok.com
  classification:
    cpe: cpe:2.3:a:tiktok:tiktok:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: tiktok
    product: tiktok
  tags: phishing,tiktok,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: tiktok
        cpe: cpe:2.3:a:tiktok:tiktok:*:*:*:*:*:*:*:*
        words:
          - 'TikTok - Make Your Day'

      - type: status
        status:
          - 200

      - type: dsl
        name: tiktok-2
        cpe: cpe:2.3:a:tiktok:tiktok:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"tiktok.com")'
