id: dropbox-phish

info:
  name: dropbox phishing Detection
  author: rxerium
  severity: info
  description: |
    A dropbox phishing website was detected
  reference:
    - https://dropbox.com
  classification:
    cpe: cpe:2.3:a:dropbox:dropbox:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: dropbox
    product: dropbox
  tags: phishing,dropbox,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: dropbox
        cpe: cpe:2.3:a:dropbox:dropbox:*:*:*:*:*:*:*:*
        words:
          - 'Dropbox is a home for all of your work. You can store and share files, collaborate on projects and bring your best ideas to life, whether you’re working alone or as part of a team.'

      - type: status
        status:
          - 200

      - type: dsl
        name: dropbox-2
        cpe: cpe:2.3:a:dropbox:dropbox:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"dropbox.com")'
