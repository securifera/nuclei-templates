id: godaddy-phish

info:
  name: GoDaddy phishing Detection
  author: rxerium
  severity: info
  description: |
    A GoDaddy phishing website was detected
  reference:
    - https://godaddy.com
  classification:
    cpe: cpe:2.3:a:godaddy:godaddy:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: godaddy
    product: godaddy
  tags: phishing,godaddy,domain,hosting,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: godaddy
        cpe: cpe:2.3:a:godaddy:godaddy:*:*:*:*:*:*:*:*
        words:
          - '<title>Domain Names, Websites, Hosting &amp; Online Marketing Tools - GoDaddy'

      - type: status
        status:
          - 200

      - type: dsl
        name: godaddy-2
        cpe: cpe:2.3:a:godaddy:godaddy:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"godaddy.com")'
