id: wells-fargo-phish

info:
  name: Wells Fargo phishing Detection
  author: rxerium
  severity: info
  description: |
    A Wells Fargo phishing website was detected
  reference:
    - https://wellsfargo.com
  classification:
    cpe: cpe:2.3:a:wells-fargo:wells-fargo:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wells-fargo
    product: wells-fargo
  tags: phishing,wells-fargo,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: wells-fargo
        cpe: cpe:2.3:a:wells-fargo:wells-fargo:*:*:*:*:*:*:*:*
        words:
          - "Committed to the financial health of our customers and communities. Explore bank accounts, loans, mortgages, investing, credit cards & banking services»"

      - type: status
        status:
          - 200

      - type: dsl
        name: wells-fargo-2
        cpe: cpe:2.3:a:wells-fargo:wells-fargo:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"wellsfargo.com")'
