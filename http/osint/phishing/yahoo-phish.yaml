id: yahoo-phish

info:
  name: Yahoo phishing Detection
  author: rxerium
  severity: info
  description: |
    A yahoo phishing website was detected
  reference:
    - https://yahoo.com
  classification:
    cpe: cpe:2.3:a:yahoo:yahoo:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: yahoo
    product: yahoo
  tags: phishing,yahoo,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: yahoo
        cpe: cpe:2.3:a:yahoo:yahoo:*:*:*:*:*:*:*:*
        words:
          - 'Best-in-class Yahoo Mail, breaking local, national and global news, finance, sport, music, films and more. You get more out of the web, you get more out of life.'

      - type: status
        status:
          - 200

      - type: dsl
        name: yahoo-2
        cpe: cpe:2.3:a:yahoo:yahoo:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"yahoo.com")'
