id: target-phish

info:
  name: target phishing Detection
  author: rxerium
  severity: info
  description: |
    A target phishing website was detected
  reference:
    - https://target.com
  classification:
    cpe: cpe:2.3:a:target:target:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: target
    product: target
  tags: phishing,target,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: target
        cpe: cpe:2.3:a:target:target:*:*:*:*:*:*:*:*
        words:
          - 'Target : Expect More. Pay Less.'

      - type: status
        status:
          - 200

      - type: dsl
        name: target-2
        cpe: cpe:2.3:a:target:target:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"target.com")'
