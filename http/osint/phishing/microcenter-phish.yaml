id: microcenter-phish

info:
  name: microcenter phishing Detection
  author: rxerium
  severity: info
  description: |
    A microcenter phishing website was detected
  reference:
    - https://microcenter.com
  classification:
    cpe: cpe:2.3:a:microcenter:microcenter:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: microcenter
    product: microcenter
  tags: phishing,microcenter,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: microcenter
        cpe: cpe:2.3:a:microcenter:microcenter:*:*:*:*:*:*:*:*
        words:
          - 'Micro Center - Computer & Electronics Retailer - Shop Now'

      - type: status
        status:
          - 200

      - type: dsl
        name: microcenter-2
        cpe: cpe:2.3:a:microcenter:microcenter:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"microcenter.com")'
