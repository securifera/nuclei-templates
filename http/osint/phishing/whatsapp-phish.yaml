id: Whatsapp-phish

info:
  name: Whatsapp phishing Detection
  author: rxerium
  severity: info
  description: |
    A Whatsapp phishing website was detected
  reference:
    - https://whatsapp.com
  classification:
    cpe: cpe:2.3:a:whatsapp:whatsapp:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: whatsapp
    product: whatsapp
  tags: phishing,whatsapp,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: whatsapp
        cpe: cpe:2.3:a:whatsapp:whatsapp:*:*:*:*:*:*:*:*
        words:
          - 'WhatsApp | Secure and Reliable Free Private Messaging and Callings'

      - type: status
        status:
          - 200

      - type: dsl
        name: whatsapp-2
        cpe: cpe:2.3:a:whatsapp:whatsapp:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"whatsapp.com")'
