id: spotify-phish

info:
  name: spotify phishing Detection
  author: rxerium
  severity: info
  description: |
    A spotify phishing website was detected
  reference:
    - https://spotify.com
  classification:
    cpe: cpe:2.3:a:spotify:spotify:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: spotify
    product: spotify
  tags: phishing,spotify,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: spotify
        cpe: cpe:2.3:a:spotify:spotify:*:*:*:*:*:*:*:*
        words:
          - 'Spotify - Web Player: Music for everyone'

      - type: status
        status:
          - 200

      - type: dsl
        name: spotify-2
        cpe: cpe:2.3:a:spotify:spotify:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"spotify.com")'
