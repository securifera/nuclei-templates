id: dbs-phish

info:
  name: DBS Bank phishing Detection
  author: rxerium
  severity: info
  description: |
    A DBS Bank phishing website was detected
  reference:
    - https://dbs.com
  classification:
    cpe: cpe:2.3:a:dbs:dbs:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: dbs
    product: dbs
  tags: phishing,dbs,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: dbs
        cpe: cpe:2.3:a:dbs:dbs:*:*:*:*:*:*:*:*
        words:
          - 'DBS Bank'
          - "<title>DBS: Trusted as the World’s Best Bank | DBS Bank"
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: dbs-2
        cpe: cpe:2.3:a:dbs:dbs:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"dbs.com")'
