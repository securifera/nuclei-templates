id: snapfish-phish

info:
  name: Snapfish phishing Detection
  author: rxerium
  severity: info
  description: |
    A Snapfish phishing website was detected
  reference:
    - https://snapfish.com
  classification:
    cpe: cpe:2.3:a:snapfish:snapfish:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: snapfish
    product: snapfish
  tags: phishing,snapfish,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: snapfish
        cpe: cpe:2.3:a:snapfish:snapfish:*:*:*:*:*:*:*:*
        words:
          - "Design and send the best personalized gifts, cards, home decor, photo books, and prints with Snapfish."

      - type: status
        status:
          - 200

      - type: dsl
        name: snapfish-2
        cpe: cpe:2.3:a:snapfish:snapfish:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"snapfish.com")'
