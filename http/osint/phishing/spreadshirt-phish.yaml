id: spreadshirt-phish

info:
  name: Spreadshirt phishing Detection
  author: rxerium
  severity: info
  description: |
    A Spreadshirt phishing website was detected
  reference:
    - https://spreadshirt.com
  classification:
    cpe: cpe:2.3:a:spreadshirt:spreadshirt:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: spreadshirt
    product: spreadshirt
  tags: phishing,spreadshirt,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: spreadshirt
        cpe: cpe:2.3:a:spreadshirt:spreadshirt:*:*:*:*:*:*:*:*
        words:
          - "Spreadshirt Print on Demand Platform | Spreadshirt"

      - type: status
        status:
          - 200

      - type: dsl
        name: spreadshirt-2
        cpe: cpe:2.3:a:spreadshirt:spreadshirt:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"spreadshirt.com")'
