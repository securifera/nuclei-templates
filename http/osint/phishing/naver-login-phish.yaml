id: naver-login-phish

info:
  name: naver login phishing Detection
  author: hahwul
  severity: info
  description: |
    A naver login phishing website was detected
  reference:
    - https://nid.naver.com
    - https://www.navercorp.com
  classification:
    cpe: cpe:2.3:a:naver:naver:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: naver
    product: naver
  tags: phishing,naver,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: naver
        cpe: cpe:2.3:a:naver:naver:*:*:*:*:*:*:*:*
        words:
          - '네이버 : 로그인'
          - '로그인'

      - type: status
        status:
          - 200

      - type: dsl
        name: naver-2
        cpe: cpe:2.3:a:naver:naver:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"nid.naver.com")'
