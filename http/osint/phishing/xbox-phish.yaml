id: xbox-phish

info:
  name: Xbox phishing Detection
  author: rxerium
  severity: info
  description: |
    An Xbox phishing website was detected
  reference:
    - https://xbox.com
  classification:
    cpe: cpe:2.3:a:xbox:xbox:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: xbox
    product: xbox
  tags: phishing,xbox,microsoft,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: xbox
        cpe: cpe:2.3:a:xbox:xbox:*:*:*:*:*:*:*:*
        words:
          - "Xbox Official Site: Play Games Anywhere | Xbox"

      - type: status
        status:
          - 200

      - type: dsl
        name: xbox-2
        cpe: cpe:2.3:a:xbox:xbox:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"xbox.com")'
          - '!contains(host,"microsoft.com")'
