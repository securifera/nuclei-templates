id: expressvpn-phish

info:
  name: ExpressVPN phishing Detection
  author: rxerium
  severity: info
  description: |
    A ExpressVPN phishing website was detected
  reference:
    - https://expressvpn.com
  classification:
    cpe: cpe:2.3:a:expressvpn:expressvpn:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: expressvpn
    product: expressvpn
  tags: phishing,expressvpn,vpn,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: expressvpn
        cpe: cpe:2.3:a:expressvpn:expressvpn:*:*:*:*:*:*:*:*
        words:
          - '<title>ExpressVPN: Best VPN Service for Speed & Privacy in 2025'

      - type: status
        status:
          - 200

      - type: dsl
        name: expressvpn-2
        cpe: cpe:2.3:a:expressvpn:expressvpn:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"expressvpn.com")'
