id: kaspersky-phish

info:
  name: kaspersky phishing Detection
  author: rxerium
  severity: info
  description: |
    A kaspersky phishing website was detected
  reference:
    - https://kaspersky.co.uk
  classification:
    cpe: cpe:2.3:a:kaspersky:kaspersky:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kaspersky
    product: kaspersky
  tags: phishing,kaspersky,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: kaspersky
        cpe: cpe:2.3:a:kaspersky:kaspersky:*:*:*:*:*:*:*:*
        words:
          - 'Kaspersky Cyber Security Solutions for Home and Business  | Kaspersky'

      - type: status
        status:
          - 200

      - type: dsl
        name: kaspersky-2
        cpe: cpe:2.3:a:kaspersky:kaspersky:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"kaspersky.co.uk")'
          - '!contains(host,"kaspersky.com")'
