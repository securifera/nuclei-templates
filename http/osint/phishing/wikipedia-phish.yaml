id: Wikipedia-phish

info:
  name: Wikipedia phishing Detection
  author: rxerium
  severity: info
  description: |
    A Wikipedia phishing website was detected
  reference:
    - https://wikipedia.com
  classification:
    cpe: cpe:2.3:a:wikipedia:wikipedia:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wikipedia
    product: wikipedia
  tags: phishing,wikipedia,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: wikipedia
        cpe: cpe:2.3:a:wikipedia:wikipedia:*:*:*:*:*:*:*:*
        words:
          - 'Log in - Wikipedia'

      - type: status
        status:
          - 200

      - type: dsl
        name: wikipedia-2
        cpe: cpe:2.3:a:wikipedia:wikipedia:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"wikipedia.org")'
