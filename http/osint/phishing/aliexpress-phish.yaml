id: aliexpress-phish

info:
  name: aliexpress phishing Detection
  author: rxerium
  severity: info
  description: |
    An aliexpress phishing website was detected
  reference:
    - https://aliexpress.com
  classification:
    cpe: cpe:2.3:a:aliexpress:aliexpress:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: aliexpress
    product: aliexpress
  tags: phishing,aliexpress,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: aliexpress
        cpe: cpe:2.3:a:aliexpress:aliexpress:*:*:*:*:*:*:*:*
        words:
          - 'AliExpress - Affordable Prices on Top Brands with Free Shipping'

      - type: status
        status:
          - 200

      - type: dsl
        name: aliexpress-2
        cpe: cpe:2.3:a:aliexpress:aliexpress:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"aliexpress.com")'
