id: nordpass-phish

info:
  name: nordpass phishing Detection
  author: rxerium
  severity: info
  description: |
    A nordpass phishing website was detected
  reference:
    - https://nordpass.com
  classification:
    cpe: cpe:2.3:a:nordpass:nordpass:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: nordpass
    product: nordpass
  tags: phishing,nordpass,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: nordpass
        cpe: cpe:2.3:a:nordpass:nordpass:*:*:*:*:*:*:*:*
        words:
          - 'Securely Store, Manage &amp; Autofill Passwords | NordPass'

      - type: status
        status:
          - 200

      - type: dsl
        name: nordpass-2
        cpe: cpe:2.3:a:nordpass:nordpass:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"nordpass.com")'
