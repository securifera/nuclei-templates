id: libre-office-phish

info:
  name: libre office phishing Detection
  author: rxerium
  severity: info
  description: |
    A libre office phishing website was detected
  reference:
    - https://libreoffice.org
  classification:
    cpe: cpe:2.3:a:libre-office:libre-office:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: libre-office
    product: libre-office
  tags: phishing,libre-office,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: libre-office
        cpe: cpe:2.3:a:libre-office:libre-office:*:*:*:*:*:*:*:*
        words:
          - 'Home | LibreOffice - Free Office Suite - Based on OpenOffice - Compatible with Microsoft'

      - type: status
        status:
          - 200

      - type: dsl
        name: libre-office-2
        cpe: cpe:2.3:a:libre-office:libre-office:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"libreoffice.org")'
