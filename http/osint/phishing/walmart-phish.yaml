id: walmart-phish

info:
  name: walmart phishing Detection
  author: rxerium
  severity: info
  description: |
    A walmart phishing website was detected
  reference:
    - https://walmart.com
  classification:
    cpe: cpe:2.3:a:walmart:walmart:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: walmart
    product: walmart
  tags: phishing,walmart,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: walmart
        cpe: cpe:2.3:a:walmart:walmart:*:*:*:*:*:*:*:*
        words:
          - 'Walmart | Save Money. Live better.'

      - type: status
        status:
          - 200

      - type: dsl
        name: walmart-2
        cpe: cpe:2.3:a:walmart:walmart:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"walmart.com")'
