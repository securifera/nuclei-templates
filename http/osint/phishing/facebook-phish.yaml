id: facebook-phish

info:
  name: Facebook phishing Detection
  author: rxerium
  severity: info
  description: |
    A Facebook phishing website was detected
  reference:
    - https://facebook.com
  classification:
    cpe: cpe:2.3:a:facebook:facebook:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: facebook
    product: facebook
  tags: phishing,facebook,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: facebook
        cpe: cpe:2.3:a:facebook:facebook:*:*:*:*:*:*:*:*
        words:
          - 'Facebook – log in or sign up'

      - type: status
        status:
          - 200

      - type: dsl
        name: facebook-2
        cpe: cpe:2.3:a:facebook:facebook:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"facebook.com")'
