id: paramountplus-phish

info:
  name: paramountplus phishing Detection
  author: rxerium
  severity: info
  description: |
    A paramountplus phishing website was detected
  reference:
    - https://paramountplus.com
  classification:
    cpe: cpe:2.3:a:paramountplus:paramountplus:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: paramountplus
    product: paramountplus
  tags: phishing,paramountplus,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: paramountplus
        cpe: cpe:2.3:a:paramountplus:paramountplus:*:*:*:*:*:*:*:*
        words:
          - 'Paramount+ United Kingdom - Stream Blockbusters, New Originals and Hit Shows'

      - type: status
        status:
          - 200

      - type: dsl
        name: paramountplus-2
        cpe: cpe:2.3:a:paramountplus:paramountplus:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"paramountplus.com")'
