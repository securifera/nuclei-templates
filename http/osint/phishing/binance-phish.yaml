id: binance-phish

info:
  name: Binance phishing Detection
  author: rxerium
  severity: info
  description: |
    A Binance phishing website was detected
  reference:
    - https://binance.com
  classification:
    cpe: cpe:2.3:a:binance:binance:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: binance
    product: binance
  tags: phishing,binance,crypto,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: binance
        cpe: cpe:2.3:a:binance:binance:*:*:*:*:*:*:*:*
        words:
          - 'Binance'
          - 'Binance: The World’s Most Trusted Cryptocurrency Exchange to Buy, Trade &amp; Invest in Crypto'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        name: binance-2
        cpe: cpe:2.3:a:binance:binance:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"binance.com")'
