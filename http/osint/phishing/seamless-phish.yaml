id: seamless-phish

info:
  name: Seamless phishing Detection
  author: rxerium
  severity: info
  description: |
    A Seamless phishing website was detected
  reference:
    - https://seamless.com
  classification:
    cpe: cpe:2.3:a:seamless:seamless:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: seamless
    product: seamless
  tags: phishing,seamless,food-delivery,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: seamless
        cpe: cpe:2.3:a:seamless:seamless:*:*:*:*:*:*:*:*
        words:
          - "Prepare your taste buds..."

      - type: status
        status:
          - 200

      - type: dsl
        name: seamless-2
        cpe: cpe:2.3:a:seamless:seamless:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"seamless.com")'
