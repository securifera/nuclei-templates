id: best-buy-phish

info:
  name: best buy phishing Detection
  author: rxerium
  severity: info
  description: |
    A best buy phishing website was detected
  reference:
    - https://bestbuy.com
  classification:
    cpe: cpe:2.3:a:bestbuy:bestbuy:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: bestbuy
    product: bestbuy
  tags: phishing,bestbuy,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: bestbuy
        cpe: cpe:2.3:a:bestbuy:bestbuy:*:*:*:*:*:*:*:*
        words:
          - 'Best Buy | Official Online Store | Shop Now &amp; Save'

      - type: status
        status:
          - 200

      - type: dsl
        name: bestbuy-2
        cpe: cpe:2.3:a:bestbuy:bestbuy:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"bestbuy.com")'
