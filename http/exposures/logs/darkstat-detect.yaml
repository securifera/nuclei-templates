id: darkstat-detect

info:
  name: Detect Darkstat Reports
  author: geeknik
  severity: high
  description: Darkstat captures network traffic, calculates statistics about usage, and serves reports over HTTP
  reference:
    - https://unix4lyfe.org/darkstat/
  classification:
    cpe: cpe:2.3:a:darkstat:darkstat:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: darkstat
    product: darkstat
  tags: darkstat,logs,exposure,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/darkstat/"

    # FYI, the default port for darkstat is 666
    matchers-condition: and
    matchers:
      - type: regex
        name: darkstat
        cpe: cpe:2.3:a:darkstat:darkstat:*:*:*:*:*:*:*:*
        part: header
        regex:
          - "[Ss]erver: darkstat.*"

      - type: word
        name: darkstat-2
        cpe: cpe:2.3:a:darkstat:darkstat:*:*:*:*:*:*:*:*
        part: body
        words:
          - "darkstat"
          - "<title>Graphs"
          - "Measuring for"
          - "hosts</a>"
        condition: and

    extractors:
      - type: kval
        part: header
        kval:
          - server
