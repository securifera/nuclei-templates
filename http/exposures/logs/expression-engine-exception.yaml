id: expression-engine-exception

info:
  name: ExpressionEngine Exception - Page
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:expression-engine-exception:expression-engine-exception:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: body="Exception - ExpressionEngine"
    vendor: expression-engine-exception
    product: expression-engine-exception
  tags: error,expressionengine,log,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        name: expression-engine-exception
        cpe: cpe:2.3:a:expression-engine-exception:expression-engine-exception:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Exception - ExpressionEngine'
          - 'Exception Caught'
        condition: and
