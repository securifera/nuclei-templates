id: delphi-mvc-exception

info:
  name: Delphi MVC Exception - Page
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:delphi:delphi:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: html:"DMVCFramework Exception"
    vendor: delphi
    product: delphi
  tags: error,dmvc,log,delphi,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    headers:
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    matchers:
      - type: word
        name: delphi
        cpe: cpe:2.3:a:delphi:delphi:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'DMVCFramework Exception'
          - 'DelphiMVCFramework'
        condition: and
