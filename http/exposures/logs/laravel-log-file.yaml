id: laravel-log-file

info:
  name: Laravel log file publicly accessible
  author: sheikhrishad,geeknik
  severity: high
  description: The log file of this Laravel web app might reveal details on the inner workings of the app, possibly even tokens, credentials or personal information.
  reference:
    - https://laravel.com/docs/master/logging
  classification:
    cpe: cpe:2.3:a:laravel:laravel:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: laravel
    product: laravel
  tags: laravel,logs,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/storage/logs/laravel.log"

    matchers-condition: and
    matchers:
      - type: word
        name: laravel
        cpe: cpe:2.3:a:laravel:laravel:*:*:*:*:*:*:*:*
        part: body
        words:
          - "InvalidArgumentException"
          - "local.ERROR"
          - "ErrorException"
          - "syntax error"
        condition: or

      - type: word
        name: laravel-2
        cpe: cpe:2.3:a:laravel:laravel:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/plain"
          - "text/x-log"
        condition: or

      - type: status
        status:
          - 200
