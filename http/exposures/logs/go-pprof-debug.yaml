id: go-pprof-debug

info:
  name: Go pprof Debug Page
  author: w8ay
  severity: low
  description: go pprof debug page was exposed.
  classification:
    cpe: cpe:2.3:a:go:pprof:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: go
    product: pprof
  tags: logs,exposure,go,pprof,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/debug/pprof/heap?debug=1"
      - "{{BaseURL}}/pprof/heap?debug=1"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        name: pprof
        cpe: cpe:2.3:a:go:pprof:*:*:*:*:*:*:*:*
        words:
          - 'heap profile:'
          - 'Alloc'
        condition: and

      - type: word
        name: pprof-2
        cpe: cpe:2.3:a:go:pprof:*:*:*:*:*:*:*:*
        words:
          - "text/plain"
        part: header

      - type: status
        status:
          - 200
