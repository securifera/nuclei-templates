id: twig-runtime-error

info:
  name: Twig Runtime Error - Page
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:error:error:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: error
    shodan-query: html:"Twig Runtime Error"
    product: error
  tags: error,twig,log,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: error
        cpe: cpe:2.3:a:error:error:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Twig Runtime Error – Twig\Error\RuntimeError'

      - type: status
        status:
          - 500
