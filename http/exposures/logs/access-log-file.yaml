id: access-log-file

info:
  name: Publicly accessible access-log file
  author: sheikhrishad
  severity: low
  description: Log file was exposed.
  classification:
    cpe: cpe:2.3:a:access-log-file:access-log-file:*:*:*:*:*:*:*:*
    cwe-id: CWE-219,CWE-552
  metadata:
    max-request: 4
    vendor: access-log-file
    product: access-log-file
  tags: logs,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/access.log"
      - "{{BaseURL}}/log/access.log"
      - "{{BaseURL}}/logs/access.log"
      - "{{BaseURL}}/application/logs/access.log"

    matchers-condition: and
    matchers:
      - type: word
        name: access-log-file
        cpe: cpe:2.3:a:access-log-file:access-log-file:*:*:*:*:*:*:*:*
        words:
          - '"GET /'

      - type: word
        name: access-log-file-2
        cpe: cpe:2.3:a:access-log-file:access-log-file:*:*:*:*:*:*:*:*
        words:
          - "text/plain"
        part: header

      - type: status
        status:
          - 200
