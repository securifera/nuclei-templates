id: microsoft-runtime-error

info:
  name: Microsoft Runtime Error Page
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:microsoft:microsoft:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: microsoft
    shodan-query: title:"Runtime Error"
    product: microsoft
  tags: iis,error,microsoft,log,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: microsoft
        cpe: cpe:2.3:a:microsoft:microsoft:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Runtime Error</title>"

      - type: status
        status:
          - 500
          - 404
