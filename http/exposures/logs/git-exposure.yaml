id: git-exposure

info:
  name: Git Metadata Directory Exposure
  author: tess
  severity: medium
  description: Git Metadata Directory exposed.
  classification:
    cpe: cpe:2.3:a:git:git:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: git
    product: git
  tags: logs,git,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: git
        cpe: cpe:2.3:a:git:git:*:*:*:*:*:*:*:*
        part: body
        words:
          - "403 Forbidden"
          - "You do not have permission to access /.git/"
        condition: and

      - type: status
        status:
          - 403
