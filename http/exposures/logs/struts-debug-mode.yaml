id: struts-debug-mode

info:
  name: Apache Struts setup in Debug-Mode
  author: pdteam
  severity: low
  description: Apache Struts debug mode is enabled.
  classification:
    cpe: cpe:2.3:a:struts:struts:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: struts
    product: struts
  tags: logs,struts,apache,exposure,setup,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        name: struts
        cpe: cpe:2.3:a:struts:struts:*:*:*:*:*:*:*:*
        words:
          - "<debug>"
          - "<struts.actionMapping>"
        condition: and
