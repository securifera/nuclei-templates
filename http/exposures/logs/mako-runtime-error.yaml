id: mako-runtime-error

info:
  name: Mako Runtime Error - Page
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:error:error:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: error
    fofa-query: title="Mako Runtime Error"
    product: error
  tags: error,mako,log,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: error
        cpe: cpe:2.3:a:error:error:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Mako Runtime Error'
          - 'TopLevelLookupException'
        condition: and
