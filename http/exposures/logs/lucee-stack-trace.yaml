id: lucee-stack-trace

info:
  name: Lucee Stack Trace Error
  author: dhiyaneshDK
  severity: low
  description: Lucee Stack Trace error exposed.
  classification:
    cpe: cpe:2.3:a:lucee:lucee:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Lucee"
    vendor: lucee
    product: lucee
  tags: lucee,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: lucee
        cpe: cpe:2.3:a:lucee:lucee:*:*:*:*:*:*:*:*
        words:
          - 'lucee.runtime'

      - type: status
        status:
          - 500
          - 200
        condition: or
