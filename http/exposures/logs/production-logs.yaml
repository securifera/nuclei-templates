id: production-logs

info:
  name: Discover production log files
  author: geeknik
  severity: info
  description: Production log file was exposed.
  classification:
    cpe: cpe:2.3:a:logs:logs:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: logs
    product: logs
  tags: exposure,logs,rails,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/log/production.log"
      - "{{BaseURL}}/logs/production.log"
      - "{{BaseURL}}/production.log"

    matchers-condition: and
    matchers:
      - type: word
        name: logs
        cpe: cpe:2.3:a:logs:logs:*:*:*:*:*:*:*:*
        words:
          - "Connecting to database specified by database.yml"
          - "Started GET"
        condition: and

      - type: status
        status:
          - 200

      - type: word
        name: logs-2
        cpe: cpe:2.3:a:logs:logs:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"
        negative: true

    extractors:
      - type: regex
        name: last_modified
        part: header
        regex:
          - 'Last-Modified:.*'
