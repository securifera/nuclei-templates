id: rails-debug-mode

info:
  name: Rails Debug Mode
  author: pdteam
  severity: medium
  description: Rails debug mode is enabled.
  classification:
    cpe: cpe:2.3:a:rails:rails:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: rails
    product: rails
  tags: debug,rails,exposure,intrusive,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{randstr}}"

    matchers:
      - type: word
        name: rails
        cpe: cpe:2.3:a:rails:rails:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Rails.root:"
          - "Action Controller: Exception caught"
        condition: and
