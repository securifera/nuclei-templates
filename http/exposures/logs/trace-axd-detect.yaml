id: trace-axd-detect

info:
  name: ASP.NET Trace.AXD Information Leak
  author: dhiyaneshDK
  severity: low
  description: ASP.NET Trace.AXD Information was exposed.
  reference:
    - https://www.rapid7.com/db/vulnerabilities/spider-asp-dot-net-trace-axd/
  classification:
    cpe: cpe:2.3:a:trace-axd:trace-axd:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: trace-axd
    product: trace-axd
  tags: logs,asp,exposure,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Trace.axd"

    matchers-condition: and
    matchers:
      - type: word
        name: trace-axd
        cpe: cpe:2.3:a:trace-axd:trace-axd:*:*:*:*:*:*:*:*
        words:
          - '<td><h1>Application Trace</h1></td>'

      - type: status
        status:
          - 200
