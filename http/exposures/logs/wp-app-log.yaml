id: wp-app-log

info:
  name: Discover wp-app.log Files
  author: geeknik
  severity: info
  description: wp-app.log file is exposed.
  classification:
    cpe: cpe:2.3:a:wp-app-log:wp-app-log:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wp-app-log
    product: wp-app-log
  tags: exposure,logs,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-app.log"

    matchers-condition: and
    matchers:
      - type: word
        name: wp-app-log
        cpe: cpe:2.3:a:wp-app-log:wp-app-log:*:*:*:*:*:*:*:*
        words:
          - "LANG"
          - "Array"
        condition: and

      - type: word
        name: wp-app-log-2
        cpe: cpe:2.3:a:wp-app-log:wp-app-log:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"
          - "application/javascript"
        negative: true

      - type: status
        status:
          - 200
