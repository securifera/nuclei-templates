id: jboss-seam-debug-page

info:
  name: Jboss Seam Debug Page Enabled
  author: dhiyaneshDK
  severity: medium
  description: Jboss Seam Debug Page was exposed.
  reference:
    - https://github.com/jaeles-project/jaeles-signatures/blob/master/common/jboss-seam-debug-page.yaml
  classification:
    cpe: cpe:2.3:a:jboss:jboss:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: jboss
    product: jboss
  tags: jboss,logs,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/debug.seam"

    matchers-condition: and
    matchers:
      - type: word
        name: jboss
        cpe: cpe:2.3:a:jboss:jboss:*:*:*:*:*:*:*:*
        words:
          - "SeamDebugPage"
          - "org.jboss.seam"
        condition: and

      - type: status
        status:
          - 200
