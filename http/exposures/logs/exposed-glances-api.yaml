id: exposed-glances-api

info:
  name: Exposed Glances API
  author: princechaddha
  severity: low
  description: Glances is a cross-platform system monitoring tool written in Python.
  reference:
    - https://nicolargo.github.io/glances/
  classification:
    cpe: cpe:2.3:a:glances:glances:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: glances
    product: glances
  tags: glances,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: glances
        cpe: cpe:2.3:a:glances:glances:*:*:*:*:*:*:*:*
        words:
          - 'title">Glances</title>'
          - 'glances.config'
          - '<glances></glances>'
        part: body
        condition: and
