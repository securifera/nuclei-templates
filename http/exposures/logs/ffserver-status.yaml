id: ffserver-status

info:
  name: FFserver Status Detect
  author: notnotnotveg,tess
  severity: low
  description: FFserver status panel exposed.
  classification:
    cpe: cpe:2.3:a:ffserver:ffserver:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"ffserver Status"
    vendor: ffserver
    product: ffserver
  tags: exposure,exposures,logs,ffserver,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: ffserver
        cpe: cpe:2.3:a:ffserver:ffserver:*:*:*:*:*:*:*:*
        part: body
        words:
          - "ffserver Status"
          - "Available Streams"
          - "Connection Status"
        condition: and

      - type: status
        status:
          - 200
