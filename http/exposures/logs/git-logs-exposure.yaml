id: git-logs-exposure

info:
  name: Git Logs Disclosure
  author: NullFuzz
  severity: info
  description: Searches Git Logs files and passed URLs.
  classification:
    cpe: cpe:2.3:a:git:logs:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: git
    product: logs
  tags: logs,git,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/logs/HEAD"

    matchers-condition: and
    matchers:
      - type: dsl
        name: logs
        cpe: cpe:2.3:a:git:logs:*:*:*:*:*:*:*:*
        dsl:
          - "!contains(tolower(body), '<html')"
          - "!contains(tolower(body), '<body')"

      - type: word
        name: logs-2
        cpe: cpe:2.3:a:git:logs:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/octet-stream"

      - type: regex
        name: logs-3
        cpe: cpe:2.3:a:git:logs:*:*:*:*:*:*:*:*
        regex:
          - '^([a-z0-9]+) '

      - type: status
        status:
          - 200
