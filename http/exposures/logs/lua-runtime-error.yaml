id: lua-runtime-error

info:
  name: LUA Runtime Error - Page
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:error:error:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: 'title="Error 500: LUA Runtime Error"'
    vendor: error
    product: error
  tags: error,lua,log,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: error
        cpe: cpe:2.3:a:error:error:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Error 500 : LUA Runtime Error'
