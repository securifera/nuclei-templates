id: action-controller-exception

info:
  name: Action Controller Exception - Page
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:action-controller-exception:action-controller-exception:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: 'title="Action Controller: Exception caught"'
    vendor: action-controller-exception
    product: action-controller-exception
  tags: error,debug,log,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        name: action-controller-exception
        cpe: cpe:2.3:a:action-controller-exception:action-controller-exception:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Action Controller: Exception caught'
          - 'config.hosts'
        condition: and
