id: production-log

info:
  name: Production Log File Disclosure
  author: geeknik
  severity: low
  description: Production log file was exposed.
  classification:
    cpe: cpe:2.3:a:production-log:production-log:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    github-query: filename:production.log Connecting to database specified by database.yml
    vendor: production-log
    product: production-log
  tags: exposure,files,logs,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/log/production.log'
      - '{{BaseURL}}/logs/production.log'
      - '{{BaseURL}}/production.log'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: production-log
        cpe: cpe:2.3:a:production-log:production-log:*:*:*:*:*:*:*:*
        words:
          - 'Connecting to database specified by database.yml'

      - type: word
        name: production-log-2
        cpe: cpe:2.3:a:production-log:production-log:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'text/html'
        negative: true

      - type: status
        status:
          - 200
