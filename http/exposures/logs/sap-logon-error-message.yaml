id: sap-logon-error-message

info:
  name: SAP Logon Error Message
  author: DhiyaneshDK
  severity: info
  description: |
    Identifies "Logon Error Message" in the SAP Internet Communication Framework which returns a 404 status code.
  classification:
    cpe: cpe:2.3:a:logon:logon:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Logon Error Message"
    vendor: logon
    product: logon
  tags: sap,logon,error,log,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        name: logon
        cpe: cpe:2.3:a:logon:logon:*:*:*:*:*:*:*:*
        words:
          - "Logon Error Message"
          - "SAP Internet Communication Framework Team"
        condition: and

      - type: status
        status:
          - 404
