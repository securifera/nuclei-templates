id: django-debug-exposure

info:
  name: Django Debug Exposure
  author: geeknik
  severity: high
  description: Django debug mode enabled exposes internal information.
  reference:
    - https://twitter.com/Alra3ees/status/1397660633928286208
  classification:
    cpe: cpe:2.3:a:django:django:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: django
    product: django
  tags: django,exposure,vuln

http:
  - method: POST
    path:
      - "{{BaseURL}}/admin/login/?next=/admin/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 500

      - type: word
        name: django
        cpe: cpe:2.3:a:django:django:*:*:*:*:*:*:*:*
        part: body
        words:
          - "DB_HOST"
          - "DB_NAME"
          - "DJANGO"
          - "ADMIN_PASSWORD"
        condition: and
