id: mongodb-exception-page

info:
  name: MongoDB Exception - Page
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:mongodb:mongodb:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: html:"MongoDB Exception"
    vendor: mongodb
    product: mongodb
  tags: error,mongodb,log,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: mongodb
        cpe: cpe:2.3:a:mongodb:mongodb:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'MongoDB Exception'
