id: joomla-config-dist-file

info:
  name: Joomla! Configuration File - Detect
  author: oppsec
  severity: low
  description: Joomla! configuration.php-dist file was detected.
  classification:
    cpe: cpe:2.3:a:joomla:joomla:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: joomla
    product: joomla
  tags: config,exposure,joomla,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/configuration.php-dist"

    matchers-condition: and
    matchers:
      - type: word
        name: joomla
        cpe: cpe:2.3:a:joomla:joomla:*:*:*:*:*:*:*:*
        words:
          - "Joomla"
          - "JConfig"
          - "@package"
        condition: and

      - type: word
        name: joomla-2
        cpe: cpe:2.3:a:joomla:joomla:*:*:*:*:*:*:*:*
        words:
          - "text/plain"
        part: header

      - type: status
        status:
          - 200
