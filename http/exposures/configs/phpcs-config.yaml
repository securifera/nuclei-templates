id: phpcs-config

info:
  name: PHP_CodeSniffer Configuration Exposure - Detect
  author: DhiyaneshDK
  severity: info
  description: |
    PHP_CodeSniffer configuration file was detected.
  reference:
    - https://github.com/squizlabs/PHP_CodeSniffer
  classification:
    cpe: cpe:2.3:a:phpcs:phpcs:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"phpcs.xml"
    vendor: phpcs
    product: phpcs
  tags: devops,exposure,php,phpcs,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/phpcs.xml"

    matchers-condition: and
    matchers:
      - type: word
        name: phpcs
        cpe: cpe:2.3:a:phpcs:phpcs:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'ruleset name'
          - 'rule ref='
          - '<file>'
        condition: and

      - type: word
        name: phpcs-2
        cpe: cpe:2.3:a:phpcs:phpcs:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/xml"

      - type: status
        status:
          - 200
