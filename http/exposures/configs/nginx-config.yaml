id: nginx-config

info:
  name: Nginx Config - Detect
  author: sheikhrishad,geeknik
  severity: info
  description: Nginx configuration information was detected.
  reference:
    - https://nginx.org/en/
  classification:
    cpe: cpe:2.3:a:nginx:nginx:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: nginx
    product: nginx
  tags: config,exposure,nginx,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/nginx.conf"

    matchers-condition: and
    matchers:
      - type: word
        name: nginx
        cpe: cpe:2.3:a:nginx:nginx:*:*:*:*:*:*:*:*
        words:
          - "html>"
        negative: true

      - type: word
        name: nginx-2
        cpe: cpe:2.3:a:nginx:nginx:*:*:*:*:*:*:*:*
        words:
          - "server"
          - "listen"
          - "server_name"
        condition: and

      - type: status
        status:
          - 200
