id: esmtprc-config

info:
  name: eSMTP - Config Discovery
  author: geeknik
  severity: high
  description: eSMTP configuration was discovered.
  reference:
    - https://linux.die.net/man/5/esmtprc
  classification:
    cpe: cpe:2.3:a:esmtp:esmtp:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: esmtp
    product: esmtp
  tags: esmtp,config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.esmtprc"

    matchers-condition: and
    matchers:
      - type: word
        name: esmtp
        cpe: cpe:2.3:a:esmtp:esmtp:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/plain"

      - type: word
        name: esmtp-2
        cpe: cpe:2.3:a:esmtp:esmtp:*:*:*:*:*:*:*:*
        part: body
        words:
          - "hostname"
          - "username"
          - "password"
        condition: and

      - type: status
        status:
          - 200
