id: blazor-boot

info:
  name: Blazor Boot File Disclosure
  author: freakyclown
  severity: info
  description: Exposed Blazor Boot (a web framework developed by Microsoft) config file.
  reference:
    - https://github.com/freakyclown/Nuclei_templates/blob/main/blazor_server.yaml
  classification:
    cpe: cpe:2.3:a:blazor:boot:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    github-query: 'blazor.boot.json language:JSON'
    vendor: blazor
    product: boot
  tags: blazor,boot,exposure,config,disclosure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/_framework/blazor.boot.json"

    matchers:
      - type: word
        name: boot
        cpe: cpe:2.3:a:blazor:boot:*:*:*:*:*:*:*:*
        words:
          - 'Blazor'
          - '"config":'
        condition: and

    extractors:
      - type: regex
        part: body
        regex:
          - \"([^"\r\n]+\.dll)\"
