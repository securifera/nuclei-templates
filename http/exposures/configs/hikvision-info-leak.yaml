id: hikvision-info-leak

info:
  name: Hikvision Configuration File - Detect
  author: pikpikcu
  severity: medium
  description: Hikvision configuration file was detected.
  classification:
    cpe: cpe:2.3:a:hikvision:hikvision:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: hikvision
    product: hikvision
  tags: exposure,config,hikvision,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/config/user.xml'

    matchers-condition: and
    matchers:
      - type: word
        name: hikvision
        cpe: cpe:2.3:a:hikvision:hikvision:*:*:*:*:*:*:*:*
        words:
          - '<user name='
          - 'password='
        condition: and

      - type: word
        name: hikvision-2
        cpe: cpe:2.3:a:hikvision:hikvision:*:*:*:*:*:*:*:*
        words:
          - "text/xml"
        part: header
