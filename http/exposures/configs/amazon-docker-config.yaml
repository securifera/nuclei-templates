id: amazon-docker-config

info:
  name: Dockerrun AWS Configuration Page - Detect
  author: pdteam
  severity: medium
  description: Dockerrun AWS configuration page was detected.
  classification:
    cpe: cpe:2.3:a:amazon-docker-config:amazon-docker-config:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: amazon-docker-config
    product: amazon-docker-config
  tags: config,exposure,aws,devops,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/Dockerrun.aws.json'

    matchers:
      - type: word
        name: amazon-docker-config
        cpe: cpe:2.3:a:amazon-docker-config:amazon-docker-config:*:*:*:*:*:*:*:*
        words:
          - 'AWSEBDockerrunVersion'
          - 'containerDefinitions'
        condition: and
