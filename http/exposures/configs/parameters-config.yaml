id: parameters-config

info:
  name: Parameters.yml - File Discovery
  author: DhiyaneshDK
  severity: high
  description: Parameters.yml was discovered.
  reference:
    - https://www.exploit-db.com/ghdb/5986
  classification:
    cpe: cpe:2.3:a:parameters-config:parameters-config:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    shodan-query: html:"parameters.yml"
    vendor: parameters-config
    product: parameters-config
  tags: exposure,cloud,devops,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/parameters.yml"
      - "{{BaseURL}}/app/config/parameters.yml"
      - "{{BaseURL}}/parameters.yml.dist"
      - "{{BaseURL}}/app/config/parameters.yml.dist"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: parameters-config
        cpe: cpe:2.3:a:parameters-config:parameters-config:*:*:*:*:*:*:*:*
        words:
          - 'parameters:'
          - 'database_user'
          - 'database_password'
        condition: and

      - type: status
        status:
          - 200
