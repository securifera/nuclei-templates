id: config-properties

info:
  name: Config Properties Exposure
  author: j4vaovo,DhiyaneshDK
  severity: high
  description: Config Properties were exposed.
  reference:
    - https://twitter.com/win3zz/status/1657624974851702784/photo/1
  classification:
    cpe: cpe:2.3:a:properties:properties:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    vendor: properties
    product: properties
  tags: exposure,config,properties,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/config.properties"
      - "{{BaseURL}}/config.properties.bak"
      - "{{BaseURL}}/ui_config.properties"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: regex
        name: properties
        cpe: cpe:2.3:a:properties:properties:*:*:*:*:*:*:*:*
        part: body
        regex:
          - 'jdbc:[a-z:]+://[A-Za-z0-9\.\-_:;=/@?,&]+'
          - '((?i)password|pwd|pass|secretkey)='
        condition: or

      - type: word
        name: properties-2
        cpe: cpe:2.3:a:properties:properties:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/plain"
          - "bytes"
        condition: or

      - type: word
        name: properties-3
        cpe: cpe:2.3:a:properties:properties:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"
        negative: true

      - type: status
        status:
          - 200
