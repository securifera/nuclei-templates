id: exposed-authentication-asmx

info:
  name: Authentication.asmx - Detect
  author: DhiyaneshDk
  severity: info
  description: Authentication Web Service authentication.asmx file was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6604
  classification:
    cpe: cpe:2.3:a:exposed-authentication-asmx:exposed-authentication-asmx:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: exposed-authentication-asmx
    product: exposed-authentication-asmx
  tags: config,exposure,edb,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/_vti_bin/Authentication.asmx?op=Mode"

    matchers-condition: and
    matchers:
      - type: word
        name: exposed-authentication-asmx
        cpe: cpe:2.3:a:exposed-authentication-asmx:exposed-authentication-asmx:*:*:*:*:*:*:*:*
        words:
          - "Authentication Web Service"
        part: body

      - type: status
        status:
          - 200
