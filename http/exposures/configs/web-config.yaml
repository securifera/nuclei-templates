id: web-config

info:
  name: Web Configuration File - Detect
  author: Yash Anand @yashanand155,DhiyaneshDK
  severity: info
  description: Web configuration file was detected.
  reference:
    - https://github.com/imhunterand/ApachSAL/blob/main/assets/exploits.json
  classification:
    cpe: cpe:2.3:a:web-config:web-config:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 2
    vendor: web-config
    product: web-config
  tags: config,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/web.config'
      - '{{BaseURL}}/../../web.config'

    matchers-condition: and
    matchers:
      - type: word
        name: web-config
        cpe: cpe:2.3:a:web-config:web-config:*:*:*:*:*:*:*:*
        words:
          - <configuration>
          - <system.webServer>
        condition: and

      - type: status
        status:
          - 200
