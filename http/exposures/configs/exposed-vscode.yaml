id: exposed-vscode

info:
  name: Visual Studio Code Directories - Detect
  author: aashiq
  severity: medium
  description: Visual Studio Code directories were detected.
  classification:
    cpe: cpe:2.3:a:vscode:vscode:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: vscode
    product: vscode
  tags: vscode,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.vscode/"

    matchers:
      - type: word
        name: vscode
        cpe: cpe:2.3:a:vscode:vscode:*:*:*:*:*:*:*:*
        words:
          - "Index of /.vscode"
        part: body
