id: lvmeng-uts-disclosure

info:
  name: Lvmeng - UTS Disclosure
  author: pikpikcu
  severity: high
  description: Lvmeng UTS was discovered.
  classification:
    cpe: cpe:2.3:a:lvmeng-uts:lvmeng-uts:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: lvmeng-uts
    product: lvmeng-uts
  tags: config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/webapi/v1/system/accountmanage/account"

    headers:
      Content-Type: application/json

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: lvmeng-uts
        cpe: cpe:2.3:a:lvmeng-uts:lvmeng-uts:*:*:*:*:*:*:*:*
        words:
          - "application/json"
        condition: and
        part: header

      - type: word
        name: lvmeng-uts-2
        cpe: cpe:2.3:a:lvmeng-uts:lvmeng-uts:*:*:*:*:*:*:*:*
        words:
          - "password"
          - "nsfocus_uts"
          - "MANAGER_IP"
        condition: and
        part: body
