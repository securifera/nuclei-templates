id: phpstan-config

info:
  name: PHPStan Configuration Page - Detect
  author: DhiyaneshDK
  severity: info
  description: PHPStan configuration page was detected.
  reference:
    - https://phpstan.org/
  classification:
    cpe: cpe:2.3:a:phpstan-config:phpstan-config:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"phpstan.neon"
    vendor: phpstan-config
    product: phpstan-config
  tags: devops,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/phpstan.neon"

    matchers-condition: and
    matchers:
      - type: word
        name: phpstan-config
        cpe: cpe:2.3:a:phpstan-config:phpstan-config:*:*:*:*:*:*:*:*
        words:
          - 'parameters:'

      - type: word
        name: phpstan-config-2
        cpe: cpe:2.3:a:phpstan-config:phpstan-config:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"
          - "application/javascript"
        negative: true

      - type: status
        status:
          - 200
