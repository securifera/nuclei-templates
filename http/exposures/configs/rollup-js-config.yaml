id: rollup-js-config

info:
  name: Rollup.js Configuration - Detect
  author: DhiyaneshDK
  severity: info
  description: Rollup configuration was detected.
  reference:
    - https://rollup.docschina.org/guide/en/#configuration-files
  classification:
    cpe: cpe:2.3:a:rollup-js-config:rollup-js-config:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"rollup.config.js"
    vendor: rollup-js-config
    product: rollup-js-config
  tags: exposure,devops,cicd,rollupjs,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/rollup.config.js'

    matchers-condition: and
    matchers:
      - type: word
        name: rollup-js-config
        cpe: cpe:2.3:a:rollup-js-config:rollup-js-config:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'export default ['
          - 'input:'
        condition: and

      - type: status
        status:
          - 200
