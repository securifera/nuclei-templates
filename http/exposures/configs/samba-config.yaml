id: samba-config

info:
  name: Samba Config - Detect
  author: sheikhrishad
  severity: info
  description: Samba configuration information was detected.
  reference:
    - https://www.samba.org/samba/docs/using_samba/ch06.html
  classification:
    cpe: cpe:2.3:a:samba:samba:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: samba
    product: samba
  tags: config,exposure,smb,samba,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/smb.conf"

    matchers-condition: and
    matchers:
      - type: word
        name: samba
        cpe: cpe:2.3:a:samba:samba:*:*:*:*:*:*:*:*
        words:
          - "configuration file"
          - "samba"
        condition: and

      - type: status
        status:
          - 200
