id: netbeans-config

info:
  name: Netbeans Config - Detect
  author: sbani
  severity: info
  description: Netbeans configuration information was detected.
  reference:
    - https://netbeans.apache.org/
  classification:
    cpe: cpe:2.3:a:netbeans:netbeans:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: netbeans
    product: netbeans
  tags: netbeans,config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/nbproject/project.properties"

    matchers-condition: and
    matchers:
      - type: regex
        name: netbeans
        cpe: cpe:2.3:a:netbeans:netbeans:*:*:*:*:*:*:*:*
        regex:
          - "(?mi)^src.dir="
          - "(?mi)^build.[a-zA-Z]+="
          - "(?mi)^jar.[a-zA-Z]+="
        condition: or

      - type: status
        status:
          - 200
