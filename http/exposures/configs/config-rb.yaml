id: config-rb

info:
  name: Ruby Configuration File - Detect
  author: DhiyaneshDK
  severity: unknown
  description: Multiple Ruby configuration files were detected.
  classification:
    cpe: cpe:2.3:a:config-rb:config-rb:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    shodan-query: html:"config.rb"
    vendor: config-rb
    product: config-rb
  tags: ruby,devops,exposure,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/config.rb"
      - "{{BaseURL}}/.chef/config.rb"
      - "{{BaseURL}}/assets/config.rb"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: config-rb
        cpe: cpe:2.3:a:config-rb:config-rb:*:*:*:*:*:*:*:*
        words:
          - 'images_dir'
          - 'css_dir'
        condition: and

      - type: status
        status:
          - 200
