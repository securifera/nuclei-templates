id: perl-status

info:
  name: Apache Mod_perl Status Page - Detect
  author: pdteam
  severity: medium
  description: Apache mod_perl status page was detected.
  reference:
    - https://perl.apache.org/
  classification:
    cpe: cpe:2.3:a:perl:perl:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: perl
    product: perl
  tags: config,exposure,apache,status,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/perl-status'

    matchers:
      - type: word
        name: perl
        cpe: cpe:2.3:a:perl:perl:*:*:*:*:*:*:*:*
        words:
          - "<title>Apache2::Status"
          - "Perl version"
        condition: and
