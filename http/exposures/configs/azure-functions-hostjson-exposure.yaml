id: azure-functions-hostjson-exposure

info:
  name: Azure Functions host.json Configuration Exposure
  author: pussycat0x
  severity: medium
  description: |
    Detected exposed Azure Functions host.json configuration files. The exposed metadata revealed sensitive runtime, logging, extension, and infrastructure settings that could aid attackers in understanding the application architecture.
  classification:
    cpe: cpe:2.3:a:azure:azure:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: false
    vendor: azure
    product: azure
  tags: azure,config,exposure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/host.json"

    matchers-condition: and
    matchers:
      - type: word
        name: azure
        cpe: cpe:2.3:a:azure:azure:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"version"'

      - type: word
        name: azure-2
        cpe: cpe:2.3:a:azure:azure:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"extensionBundle"'
          - '"functionTimeout"'
          - '"logging"'
          - '"extensions"'
          - '"healthMonitor"'
          - '"singleton"'
          - '"concurrency"'
          - '"Microsoft.Azure.Functions.ExtensionBundle"'
        condition: or

      - type: status
        status:
          - 200
