id: hp-ilo-serial-key-disclosure

info:
  name: HP iLO Serial Key - Detect
  author: dhiyaneshDk
  severity: medium
  description: HP iLO serial key was detected.
  reference:
    - https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/hp-ilo-serial-key-disclosure.json
  classification:
    cpe: cpe:2.3:a:hp-ilo-serial-key:hp-ilo-serial-key:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: hp-ilo-serial-key
    product: hp-ilo-serial-key
  tags: exposure,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/xmldata?item=CpqKey"

    matchers-condition: and
    matchers:
      - type: word
        name: hp-ilo-serial-key
        cpe: cpe:2.3:a:hp-ilo-serial-key:hp-ilo-serial-key:*:*:*:*:*:*:*:*
        words:
          - "LTYPE"
          - "LNAME"
          - "KEY"
        part: body
        condition: and

      - type: status
        status:
          - 200
