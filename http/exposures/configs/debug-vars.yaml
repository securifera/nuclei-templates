id: debug-vars

info:
  name: Golang Expvar - Detect
  author: luqman
  severity: low
  description: Golang expvar function exposes multiple public variables via HTTP such as stack trace information and server operation counters.
  classification:
    cpe: cpe:2.3:a:debug-vars:debug-vars:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: debug-vars
    product: debug-vars
  tags: go,debug,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/debug/vars"

    matchers-condition: and
    matchers:
      - type: word
        name: debug-vars
        cpe: cpe:2.3:a:debug-vars:debug-vars:*:*:*:*:*:*:*:*
        words:
          - '"memstats":'
          - '"cmdline":'
        condition: and

      - type: status
        status:
          - 200
