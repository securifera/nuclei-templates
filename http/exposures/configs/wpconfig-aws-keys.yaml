id: wpconfig-aws-keys

info:
  name: AWS S3 keys Leak
  author: r12w4n
  severity: high
  description: AWS S3 keys are exposed.
  classification:
    cpe: cpe:2.3:a:aws:aws:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: aws
    product: aws
  tags: aws,s3,wordpress,disclosure,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/wp-config.php-backup'
      - "{{BaseURL}}/%c0"

    matchers:
      - type: word
        name: aws
        cpe: cpe:2.3:a:aws:aws:*:*:*:*:*:*:*:*
        words:
          - 'access-key-id'
          - 'secret-access-key'
          - 'DB_NAME'
          - 'DB_PASSWORD'
        condition: and
        part: body
