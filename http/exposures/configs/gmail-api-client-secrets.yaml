id: gmail-api-client-secrets

info:
  name: GMail API - Detect
  author: geeknik
  severity: info
  description: GMail API was detected.
  reference:
    - https://developers.google.com/gmail/api/auth/web-server
  classification:
    cpe: cpe:2.3:a:gmail-api-client-secrets:gmail-api-client-secrets:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: gmail-api-client-secrets
    product: gmail-api-client-secrets
  tags: config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/client_secrets.json"

    matchers-condition: and
    matchers:
      - type: word
        name: gmail-api-client-secrets
        cpe: cpe:2.3:a:gmail-api-client-secrets:gmail-api-client-secrets:*:*:*:*:*:*:*:*
        words:
          - "client_id"
          - "auth_uri"
          - "token_uri"
        condition: and

      - type: status
        status:
          - 200

      - type: word
        name: gmail-api-client-secrets-2
        cpe: cpe:2.3:a:gmail-api-client-secrets:gmail-api-client-secrets:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"
