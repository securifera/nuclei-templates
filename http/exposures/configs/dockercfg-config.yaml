id: dockercfg-config

info:
  name: Detect .dockercfg
  author: geeknik
  severity: high
  description: Docker registry authentication data
  classification:
    cpe: cpe:2.3:a:docker:docker:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: docker
    product: docker
  tags: docker,exposure,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.dockercfg"
      - "{{BaseURL}}/.docker/config.json"

    matchers-condition: and
    matchers:
      - type: word
        name: docker
        cpe: cpe:2.3:a:docker:docker:*:*:*:*:*:*:*:*
        words:
          - '"email":'
          - '"auth":'
        condition: and

      - type: word
        name: docker-2
        cpe: cpe:2.3:a:docker:docker:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/plain"

      - type: status
        status:
          - 200
