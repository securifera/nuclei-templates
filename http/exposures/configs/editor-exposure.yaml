id: editor-exposure

info:
  name: Editor Configuration File - Detect
  author: DhiyaneshDk,daffainfo
  severity: low
  description: Editor configuration file was detected.
  classification:
    cpe: cpe:2.3:a:editor:editor:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"editorconfig"
    vendor: editor
    product: editor
  tags: config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.editorconfig"

    matchers-condition: and
    matchers:
      - type: word
        name: editor
        cpe: cpe:2.3:a:editor:editor:*:*:*:*:*:*:*:*
        part: body
        words:
          - "= true"
          - "indent_style"
        condition: and

      - type: word
        name: editor-2
        cpe: cpe:2.3:a:editor:editor:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"
          - "text/html"
        negative: true
        condition: or

      - type: status
        status:
          - 200
