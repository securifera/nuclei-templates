id: scrutinizer-config

info:
  name: Scrutinizer Config - Detect
  author: DhiyaneshDK
  severity: info
  description: Scrutinizer configuration information was detected.
  reference:
    - https://scrutinizer-ci.com/docs/configuration
    - https://scrutinizer-ci.com/
  classification:
    cpe: cpe:2.3:a:scrutinizer:scrutinizer:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"scrutinizer.yml"
    vendor: scrutinizer
    product: scrutinizer
  tags: exposure,scrutinizer,config,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/.scrutinizer.yml'

    matchers-condition: and
    matchers:
      - type: word
        name: scrutinizer
        cpe: cpe:2.3:a:scrutinizer:scrutinizer:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'build:'
          - 'filter:'
          - 'tools:'
        condition: and

      - type: status
        status:
          - 200
