id: aws-config

info:
  name: AWS Configuration - Detect
  author: m4lwhere
  severity: medium
  description: AWS config found via /.aws/config.
  classification:
    cpe: cpe:2.3:a:aws:aws:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: aws
    product: aws
  tags: config,exposure,aws,credential,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.aws/config"

    matchers-condition: and
    matchers:
      - type: regex
        name: aws
        cpe: cpe:2.3:a:aws:aws:*:*:*:*:*:*:*:*
        regex:
          - 'aws_access_key_id\s*=\s*'
          - 'region\s*=\s*'

      - type: word
        name: aws-2
        cpe: cpe:2.3:a:aws:aws:*:*:*:*:*:*:*:*
        part: body
        words:
          - '[default]'

      - type: status
        status:
          - 200
