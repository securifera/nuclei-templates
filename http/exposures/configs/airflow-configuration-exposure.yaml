id: airflow-configuration-exposure

info:
  name: Apache Airflow Configuration Page - Detect
  author: pdteam
  severity: medium
  description: Apache Airflow configuration page was detected.
  classification:
    cpe: cpe:2.3:a:airflow:airflow:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: airflow
    product: airflow
  tags: exposure,config,airflow,apache,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/airflow.cfg'

    matchers:
      - type: word
        name: airflow
        cpe: cpe:2.3:a:airflow:airflow:*:*:*:*:*:*:*:*
        words:
          - '[core]'
          - '[api]'
        condition: and
