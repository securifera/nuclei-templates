id: exposed-bzr

info:
  name: Bazaar Configuration - Detect
  author: daffainfo
  severity: info
  description: Bazaar configuration was detected.
  reference:
    - http://doc.bazaar.canonical.com/beta/en/user-reference/configuration-help.html
  classification:
    cpe: cpe:2.3:a:exposed-bzr:exposed-bzr:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: exposed-bzr
    product: exposed-bzr
  tags: config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.bzr/branch/branch.conf"

    matchers-condition: and
    matchers:
      - type: word
        name: exposed-bzr
        cpe: cpe:2.3:a:exposed-bzr:exposed-bzr:*:*:*:*:*:*:*:*
        words:
          - "parent_location"
          - "push_location"
        condition: or

      - type: status
        status:
          - 200

      - type: word
        name: exposed-bzr-2
        cpe: cpe:2.3:a:exposed-bzr:exposed-bzr:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/plain"
