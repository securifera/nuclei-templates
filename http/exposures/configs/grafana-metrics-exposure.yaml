id: grafana-metrics-exposure

info:
  name: Grafana Metrics Endpoint - Information Disclosure
  author: 0x_Akoko
  severity: low
  description: |
    Detected Grafana metrics endpoint exposed without authentication revealed sensitive infrastructure information, including version, edition, user counts, dashboard statistics, datasources, and database connection details.
  reference:
    - https://grafana.com/docs/grafana/latest/setup-grafana/set-up-grafana-monitoring/
    - https://hackerone.com/reports/1448218
  classification:
    cpe: cpe:2.3:a:grafana:metrics:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: grafana
    product: metrics
  tags: grafana,exposure,metrics,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/metrics"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: metrics
        cpe: cpe:2.3:a:grafana:metrics:*:*:*:*:*:*:*:*
        part: body
        words:
          - "grafana_build_info"
          - "# TYPE grafana_"
        condition: and

      - type: word
        name: metrics-2
        cpe: cpe:2.3:a:grafana:metrics:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/plain"

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - 'grafana_build_info\{[^}]*version="([0-9.]+)"'
