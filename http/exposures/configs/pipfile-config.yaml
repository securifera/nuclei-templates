id: pipfile-config

info:
  name: Pipfile Config - Detect
  author: DhiyaneshDK
  severity: info
  description: Pipfile configuration information was detected.
  reference:
    - https://pypi.org/project
  classification:
    cpe: cpe:2.3:a:pip:pip:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Pipfile"
    vendor: pip
    product: pip
  tags: exposure,pip,devops,cicd,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Pipfile"

    matchers-condition: and
    matchers:
      - type: word
        name: pip
        cpe: cpe:2.3:a:pip:pip:*:*:*:*:*:*:*:*
        part: body
        words:
          - '[[source]]'
          - '[packages]'
        condition: and

      - type: status
        status:
          - 200
