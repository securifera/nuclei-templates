id: exposed-darcs

info:
  name: Darcs Configuration - Detect
  author: daffainfo
  severity: info
  description: Darcs configuration was detected.
  reference:
    - http://darcs.net/Using/Configuration#sources
  classification:
    cpe: cpe:2.3:a:exposed-darcs:exposed-darcs:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: exposed-darcs
    product: exposed-darcs
  tags: config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/_darcs/prefs/binaries"

    matchers-condition: and
    matchers:
      - type: word
        name: exposed-darcs
        cpe: cpe:2.3:a:exposed-darcs:exposed-darcs:*:*:*:*:*:*:*:*
        words:
          - "Binary file regexps"

      - type: status
        status:
          - 200
