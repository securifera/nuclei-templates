id: platformio-ini

info:
  name: Platformio Config File Disclosure
  author: DhiyaneshDK
  severity: low
  description: “platformio.ini” (Project Configuration File) was detected.
  reference:
    - https://docs.platformio.org/en/stable/projectconf/index.html
  classification:
    cpe: cpe:2.3:a:platformio:platformio:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    google-query: inurl:"/platformio.ini"
    github-query: '[platformio] language:INI'
    vendor: platformio
    product: platformio
  tags: config,exposure,platformio,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/platformio.ini"

    matchers-condition: and
    matchers:
      - type: word
        name: platformio
        cpe: cpe:2.3:a:platformio:platformio:*:*:*:*:*:*:*:*
        words:
          - "[platformio]"
          - "platform ="
          - "board ="
        condition: and

      - type: status
        status:
          - 200
