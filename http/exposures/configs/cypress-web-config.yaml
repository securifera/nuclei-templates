id: cypress-web-config

info:
  name: Cypress Oxygen Configuration Page - Detect
  author: tess
  severity: info
  description: Cypress Oxygen configuration page was detected.
  classification:
    cpe: cpe:2.3:a:cypress:cypress:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"PendingInstallVZW - Web Page Configuration"
    vendor: cypress
    product: cypress
  tags: exposure,cypress,pendinginstallvzw,config,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: cypress
        cpe: cpe:2.3:a:cypress:cypress:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'PendingInstallVZW - Web Page Configuration'
          - 'alt="Cypress Oxygen-3'
        condition: and

      - type: status
        status:
          - 200
