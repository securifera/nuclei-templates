id: config-json

info:
  name: Configuration File - Detect
  author: geeknik
  severity: medium
  description: Multiple configuration files were detected.
  classification:
    cpe: cpe:2.3:a:config-json:config-json:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 4
    github-query: filename:config.json
    vendor: config-json
    product: config-json
  tags: config,exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/config/default.json"
      - "{{BaseURL}}/config.json"
      - "{{BaseURL}}/config/config.json"
      - "{{BaseURL}}/credentials/config.json"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: config-json
        cpe: cpe:2.3:a:config-json:config-json:*:*:*:*:*:*:*:*
        words:
          - '"api_keys":'
          - '"aws":'
          - '"server":'
          - '"users":'
          - '"password":'
          - '"user"'
          - '"path":'
        condition: or

      - type: word
        name: config-json-2
        cpe: cpe:2.3:a:config-json:config-json:*:*:*:*:*:*:*:*
        part: content_type
        words:
          - "text/html"
          - "text/javascript"
        negative: true

      - type: status
        status:
          - 200
