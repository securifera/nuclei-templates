id: netrc

info:
  name: Netrc - Config File Discovery
  author: geeknik
  severity: high
  description: Netrc configuration file was discovered.
  reference:
    - https://www.gnu.org/software/inetutils/manual/html_node/The-_002enetrc-file.html
  classification:
    cpe: cpe:2.3:a:netrc:netrc:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: netrc
    product: netrc
  tags: netrc,config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.netrc"
      - "{{BaseURL}}/_netrc"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        name: netrc
        cpe: cpe:2.3:a:netrc:netrc:*:*:*:*:*:*:*:*
        regex:
          - "machine [0-9A-Za-z](?:(?:[0-9A-Za-z]|-){0,61}[0-9A-Za-z])?(?:\\.[0-9A-Za-z](?:(?:[0-9A-Za-z]|-){0,61}[0-9A-Za-z])?)*\\.?"

      - type: word
        name: netrc-2
        cpe: cpe:2.3:a:netrc:netrc:*:*:*:*:*:*:*:*
        words:
          - "login "
          - "password "
        condition: and

      - type: word
        name: netrc-3
        cpe: cpe:2.3:a:netrc:netrc:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"
        negative: true

    extractors:
      - type: regex
        part: body
        regex:
          - "machine [0-9A-Za-z](?:(?:[0-9A-Za-z]|-){0,61}[0-9A-Za-z])?(?:\\.[0-9A-Za-z](?:(?:[0-9A-Za-z]|-){0,61}[0-9A-Za-z])?)*\\.?"
