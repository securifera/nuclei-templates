id: vite-config

info:
  name: Vite Configuration - File Exposure
  author: DhiyaneshDk
  severity: low
  description: |
    The vite.config.js file is used to customize the behavior of Vite and specify various settings for your project.
  reference:
    - https://vitejs.dev/config/
  classification:
    cpe: cpe:2.3:a:vite:vite:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"vite.config.js"
    vendor: vite
    product: vite
  tags: devops,exposure,files,vite,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/vite.config.js"

    matchers-condition: and
    matchers:
      - type: word
        name: vite
        cpe: cpe:2.3:a:vite:vite:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'export default defineConfig'
          - 'plugins:'
          - 'laravel'
        condition: and

      - type: status
        status:
          - 200
