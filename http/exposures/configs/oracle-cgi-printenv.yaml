id: oracle-cgi-printenv

info:
  name: Oracle CGI printenv - Information Disclosure
  author: DhiyaneshDk
  severity: medium
  description: Oracle CGI printenv component is susceptible to an information disclosure vulnerability.
  reference:
    - https://github.com/ilmila/J2EEScan/blob/master/src/main/java/burp/j2ee/issues/impl/OracleCGIPrintEnv.java
  classification:
    cpe: cpe:2.3:a:oracle:oracle:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: oracle
    product: oracle
  tags: exposure,oracle,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/printenv"

    matchers-condition: and
    matchers:
      - type: word
        name: oracle
        cpe: cpe:2.3:a:oracle:oracle:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'DOCUMENT_ROOT="'

      - type: word
        name: oracle-2
        cpe: cpe:2.3:a:oracle:oracle:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/plain"

      - type: status
        status:
          - 200
