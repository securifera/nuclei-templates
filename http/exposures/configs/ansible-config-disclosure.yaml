id: ansible-config-disclosure

info:
  name: Ansible Configuration Page - Detect
  author: pdteam
  severity: medium
  description: Ansible configuration page was detected.
  classification:
    cpe: cpe:2.3:a:ansible:ansible:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: ansible
    product: ansible
  tags: config,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/ansible.cfg'

    matchers:
      - type: word
        name: ansible
        cpe: cpe:2.3:a:ansible:ansible:*:*:*:*:*:*:*:*
        words:
          - '[defaults]'
          - '[inventory]'
        condition: and
