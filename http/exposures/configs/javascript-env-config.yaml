id: javascript-env-config

info:
  name: JavaScript Environment Configuration - Detect
  author: pdp,geeknik
  severity: low
  description: Multiple common JavaScript environment configuration files were detected.
  classification:
    cpe: cpe:2.3:a:javascript:javascript:*:*:*:*:*:*:*:*
  metadata:
    max-request: 6
    vendor: javascript
    product: javascript
  tags: javascript,config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/env.js"
      - "{{BaseURL}}/env.development.js"
      - "{{BaseURL}}/env.production.js"
      - "{{BaseURL}}/env.test.js"
      - "{{BaseURL}}/env.dev.js"
      - "{{BaseURL}}/env.prod.js"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: dsl
        name: javascript
        cpe: cpe:2.3:a:javascript:javascript:*:*:*:*:*:*:*:*
        dsl:
          - "contains(tolower(header), 'content-type: application/javascript')"

      - type: word
        name: javascript-2
        cpe: cpe:2.3:a:javascript:javascript:*:*:*:*:*:*:*:*
        part: body
        words:
          - "module.exports"
          - "const audience"
          - "const domain"
          - "NODE_ENV"
          - "LOG_LEVEL"
          - "TOKEN"
          - "KEY"
          - "PASSWORD"
          - "VERSION"
        condition: or

      - type: word
        name: javascript-3
        cpe: cpe:2.3:a:javascript:javascript:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Bootstrap"
          - "jQuery"
          - "CSS TRANSITION SUPPORT"
          - "is_ad_blocked"
        condition: or
        negative: true
