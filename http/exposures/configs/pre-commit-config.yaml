id: pre-commit-config

info:
  name: Pre-commit Configuration File - Detect
  author: DhiyaneshDk
  severity: info
  description: Pre-commit configuration file was detected.
  reference:
    - https://pre-commit.com/
  classification:
    cpe: cpe:2.3:a:pre-commit-config:pre-commit-config:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    vendor: pre-commit-config
    product: pre-commit-config
  tags: exposure,devops,config,cicd,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.pre-commit-config.yaml"
      - "{{BaseURL}}/pre-commit-config.yaml"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: pre-commit-config
        cpe: cpe:2.3:a:pre-commit-config:pre-commit-config:*:*:*:*:*:*:*:*
        part: body
        words:
          - "repos:"
          - "hooks:"
          - "rev:"
        condition: and

      - type: status
        status:
          - 200
