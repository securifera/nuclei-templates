id: collibra-properties

info:
  name: Collibra Properties Exposure
  author: 0xPugal
  severity: high
  description: Detected exposed Collibra Properties.
  reference:
    - https://twitter.com/shaybt12/status/1662431219223605254
  classification:
    cpe: cpe:2.3:a:collibra:collibra:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    vendor: collibra
    product: collibra
  tags: exposure,config,collibra-properties,collibra,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/collibra.properties"
      - "{{BaseURL}}/app/collibra.properties"
      - "{{BaseURL}}/src/collibra.properties"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: collibra
        cpe: cpe:2.3:a:collibra:collibra:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'collibra.url'
          - 'collibra.port'
          - 'collibra.user'
          - 'collibra.password'
        condition: or

      - type: word
        name: collibra-2
        cpe: cpe:2.3:a:collibra:collibra:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/plain"
          - "bytes"
        condition: or

      - type: word
        name: collibra-3
        cpe: cpe:2.3:a:collibra:collibra:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"
        negative: true

      - type: status
        status:
          - 200
