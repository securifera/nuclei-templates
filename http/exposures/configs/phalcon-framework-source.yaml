id: phalcon-framework-source

info:
  name: Phalcon Framework - Source Code Leakage
  author: philippedelteil
  severity: high
  description: Phalcon Framework source code was discovered.
  classification:
    cpe: cpe:2.3:a:phalcon:phalcon:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: phalcon
    product: phalcon
  tags: exposure,debug,phalcon,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/anything_here"

    matchers-condition: and
    matchers:
      - type: word
        name: phalcon
        cpe: cpe:2.3:a:phalcon:phalcon:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Phalcon Framework"
          - "AnythingHereController"
        condition: and

      - type: status
        status:
          - 200
