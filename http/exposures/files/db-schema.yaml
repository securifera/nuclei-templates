id: db-schema

info:
  name: Discover db schema files
  author: geeknik
  severity: info
  description: This file is auto-generated from the current state of the database.
  classification:
    cpe: cpe:2.3:a:db-schema:db-schema:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: db-schema
    product: db-schema
  tags: exposure,backup,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/db/schema.rb"
      - "{{BaseURL}}/database/schema.rb"
      - "{{BaseURL}}/schema.rb"

    matchers-condition: and
    matchers:
      - type: word
        name: db-schema
        cpe: cpe:2.3:a:db-schema:db-schema:*:*:*:*:*:*:*:*
        words:
          - "This file is auto-generated from the current state of the database."
          - "ActiveRecord::Schema.define"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        part: body
        regex:
          - 'eRecord::Schema\.define\(version: ([0-9_]+)\) do'
