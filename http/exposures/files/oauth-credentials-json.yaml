id: oauth-credentials-json

info:
  name: Oauth Credentials Json
  author: DhiyaneshDK
  severity: low
  description: Oauth Credentials file is exposed.
  classification:
    cpe: cpe:2.3:a:oauth:oauth:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    google-query: intitle:"index of" "oauth-credentials.json"
    vendor: oauth
    product: oauth
  tags: exposure,oauth,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/oauth-credentials.json"

    matchers-condition: and
    matchers:
      - type: word
        name: oauth
        cpe: cpe:2.3:a:oauth:oauth:*:*:*:*:*:*:*:*
        words:
          - '"client_id":'
          - '"client_secret":'
        condition: and

      - type: status
        status:
          - 200
