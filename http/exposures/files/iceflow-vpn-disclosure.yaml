id: iceflow-vpn-disclosure

info:
  name: ICEFlow VPN Disclosure
  author: pikpikcu
  severity: low
  description: ICEFlow VPN internal log file is exposed.
  classification:
    cpe: cpe:2.3:a:iceflow:iceflow:*:*:*:*:*:*:*:*
  metadata:
    max-request: 8
    vendor: iceflow
    product: iceflow
  tags: exposure,files,iceflow,logs,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/log/system.log"
      - "{{BaseURL}}/log/vpn.log"
      - "{{BaseURL}}/log/access.log"
      - "{{BaseURL}}/log/warn.log"
      - "{{BaseURL}}/log/error.log"
      - "{{BaseURL}}/log/debug.log"
      - "{{BaseURL}}/log/mobile.log"
      - "{{BaseURL}}/log/firewall.log"

    max-size: 2048

    matchers-condition: and
    matchers:
      - type: word
        name: iceflow
        cpe: cpe:2.3:a:iceflow:iceflow:*:*:*:*:*:*:*:*
        words:
          - 'ICEFLOW VPN:'
          - 'ICEFLOW SYSTEM'
          - 'ICEFLOW'
        part: body
        condition: or

      - type: status
        status:
          - 200

      - type: word
        name: iceflow-2
        cpe: cpe:2.3:a:iceflow:iceflow:*:*:*:*:*:*:*:*
        words:
          - "text/plain"
          - 'ICEFLOW'
        part: header
        condition: and
