id: pantheon-upstream

info:
  name: Pantheon upstream.yml Disclosure
  author: DhiyaneshDK
  severity: low
  description: Public Pantheon YAML Configuration Files might include sensitive info
  reference:
    - https://pantheon.io/docs/pantheon-yml
  classification:
    cpe: cpe:2.3:a:pantheon-upstream:pantheon-upstream:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    google-query: intitle:"index of" "pantheon.upstream.yml"
    vendor: pantheon-upstream
    product: pantheon-upstream
  tags: exposure,devops,patheon,config,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/pantheon.upstream.yml"

    matchers-condition: and
    matchers:
      - type: word
        name: pantheon-upstream
        cpe: cpe:2.3:a:pantheon-upstream:pantheon-upstream:*:*:*:*:*:*:*:*
        words:
          - 'database:'
          - 'protected_web_paths:'
        condition: and

      - type: status
        status:
          - 200
