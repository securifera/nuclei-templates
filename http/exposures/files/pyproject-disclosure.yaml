id: pyproject-disclosure

info:
  name: Pyproject Disclosure
  author: dhiyaneshDk
  severity: info
  reference:
    - https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/pyproject-disclosure.json
  classification:
    cpe: cpe:2.3:a:pyproject:pyproject:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: pyproject
    product: pyproject
  tags: exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/pyproject.toml"

    matchers-condition: and
    matchers:
      - type: word
        name: pyproject
        cpe: cpe:2.3:a:pyproject:pyproject:*:*:*:*:*:*:*:*
        words:
          - "[build-system]"
          - "[tool.poetry]"
        part: body
        condition: and

      - type: status
        status:
          - 200
