id: vagrantfile-exposure

info:
  name: Vagrantfile Exposure
  author: DhiyaneshDk
  severity: low
  description: Vagrantfile is exposed to external users.
  classification:
    cpe: cpe:2.3:a:vagrantfile:vagrantfile:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Vagrantfile"
    vendor: vagrantfile
    product: vagrantfile
  tags: config,exposure,vagrant,oss,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Vagrantfile"

    matchers-condition: and
    matchers:
      - type: word
        name: vagrantfile
        cpe: cpe:2.3:a:vagrantfile:vagrantfile:*:*:*:*:*:*:*:*
        words:
          - "./vagrant/config/vagrant-local.yml"
          - "./vagrant/config/vagrant-local.example.yml"

      - type: word
        name: vagrantfile-2
        cpe: cpe:2.3:a:vagrantfile:vagrantfile:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"
          - "text/html"
        negative: true
        condition: or

      - type: status
        status:
          - 200
