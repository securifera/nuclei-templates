id: google-api-private-key

info:
  name: Google Api Private Key
  author: DhiyaneshDK
  severity: medium
  description: Google API private keys are exposed in files.
  reference:
    - https://www.exploit-db.com/ghdb/6037
  classification:
    cpe: cpe:2.3:a:google:google:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    google-query: intitle:"index of" "google-api-private-key.json"
    vendor: google
    product: google
  tags: exposure,cloud,google,devops,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/google-api-private-key.json"
      - "{{BaseURL}}/app/config/pimcore/google-api-private-key.json"
      - "{{BaseURL}}/pimcore/app/config/pimcore/google-api-private-key.json"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: google
        cpe: cpe:2.3:a:google:google:*:*:*:*:*:*:*:*
        words:
          - 'private_key_id'
          - 'private_key'
        condition: and

      - type: status
        status:
          - 200
