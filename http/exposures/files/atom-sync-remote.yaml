id: atom-sync-remote

info:
  name: Atom Synchronization Exposure
  author: geeknik
  severity: high
  description: |
    It discloses username and password created by remote-sync for Atom, contains FTP and/or SCP/SFTP/SSH server details and credentials
  classification:
    cpe: cpe:2.3:a:atom:atom:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: atom
    product: atom
  tags: atom,exposure,config,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.remote-sync.json"

    matchers-condition: and
    matchers:
      - type: word
        name: atom
        cpe: cpe:2.3:a:atom:atom:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"hostname":'
          - '"username":'
        condition: and

      - type: word
        name: atom-2
        cpe: cpe:2.3:a:atom:atom:*:*:*:*:*:*:*:*
        part: body
        words:
          - "passphrase"
          - "password"
        condition: or

      - type: word
        name: atom-3
        cpe: cpe:2.3:a:atom:atom:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
