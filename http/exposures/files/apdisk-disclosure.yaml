id: apdisk-disclosure

info:
  name: Apdisk - File Disclosure
  author: DhiyaneshDk
  severity: low
  description: Apdisk internal file is exposed.
  reference:
    - https://discussions.apple.com/thread/250354761
  classification:
    cpe: cpe:2.3:a:apdisk:apdisk:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Apdisk"
    vendor: apdisk
    product: apdisk
  tags: exposure,files,apdisk,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.apdisk"

    matchers-condition: and
    matchers:
      - type: word
        name: apdisk
        cpe: cpe:2.3:a:apdisk:apdisk:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<plist version="
          - "<key>"
          - "<string>"
        condition: and

      - type: word
        name: apdisk-2
        cpe: cpe:2.3:a:apdisk:apdisk:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/xml"
