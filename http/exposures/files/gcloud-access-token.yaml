id: gcloud-access-token

info:
  name: Google Cloud Access Token
  author: DhiyaneshDK
  severity: medium
  description: Internal Google Cloud access tokens are exposed.
  classification:
    cpe: cpe:2.3:a:cloud:cloud:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"access_tokens.db"
    vendor: cloud
    product: cloud
  tags: google,cloud,devops,exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/access_tokens.db"
      - "{{BaseURL}}/.config/gcloud/access_tokens.db"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: cloud
        cpe: cpe:2.3:a:cloud:cloud:*:*:*:*:*:*:*:*
        words:
          - 'SQLite'
          - 'access_token'
        condition: and

      - type: word
        name: cloud-2
        cpe: cpe:2.3:a:cloud:cloud:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'application/octet-stream'

      - type: status
        status:
          - 200
