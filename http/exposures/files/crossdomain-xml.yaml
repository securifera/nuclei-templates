id: insecure-crossdomain

info:
  name: Insecure cross-domain.xml file
  author: Borna Nematzadeh,nadino
  severity: info
  reference:
    - https://www.acunetix.com/vulnerabilities/web/insecure-crossdomain-xml-file
  classification:
    cpe: cpe:2.3:a:crossdomain-xml:crossdomain-xml:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: crossdomain-xml
    product: crossdomain-xml
  tags: exposure,generic,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/crossdomain.xml"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: crossdomain-xml
        cpe: cpe:2.3:a:crossdomain-xml:crossdomain-xml:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<allow-access-from domain="*"/>'
