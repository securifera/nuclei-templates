id: lazy-file-manager

info:
  name: Lazy File Manager
  author: amsda
  severity: medium
  description: lfm.php file in exposed in Lazy File Manager.
  classification:
    cpe: cpe:2.3:a:lazy-file:lazy-file:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: lazy-file
    product: lazy-file
  tags: exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/lfm.php"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: lazy-file
        cpe: cpe:2.3:a:lazy-file:lazy-file:*:*:*:*:*:*:*:*
        words:
          - Lazy File Manager
