id: styleci-yml-disclosure

info:
  name: StyleCi Yaml File Disclosure
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:styleci-yml:styleci-yml:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: ".styleci.yml"
    vendor: styleci-yml
    product: styleci-yml
  tags: config,exposure,devops,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.styleci.yml"

    matchers-condition: and
    matchers:
      - type: word
        name: styleci-yml
        cpe: cpe:2.3:a:styleci-yml:styleci-yml:*:*:*:*:*:*:*:*
        words:
          - "php"
          - "preset"
          - "disabled"
        condition: and

      - type: status
        status:
          - 200
