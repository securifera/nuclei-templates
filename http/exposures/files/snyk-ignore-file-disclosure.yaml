id: snyk-ignore-file-disclosure

info:
  name: Snyk Ignore File Disclosure
  author: dhiyaneshDk
  severity: info
  reference:
    - https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/snyk-ignore-file-disclosure.json
  classification:
    cpe: cpe:2.3:a:snyk-ignore:snyk-ignore:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: snyk-ignore
    product: snyk-ignore
  tags: exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.snyk"

    matchers-condition: and
    matchers:
      - type: word
        name: snyk-ignore
        cpe: cpe:2.3:a:snyk-ignore:snyk-ignore:*:*:*:*:*:*:*:*
        words:
          - "# Snyk (https://snyk.io) policy file, patches or ignores known vulnerabilities."
        part: body

      - type: status
        status:
          - 200
