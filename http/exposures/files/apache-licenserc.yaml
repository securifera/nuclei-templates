id: apache-licenserc

info:
  name: Apache License File
  author: DhiyaneshDk
  severity: low
  description: Apache License file is exposed.
  classification:
    cpe: cpe:2.3:a:apache:apache:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: apache
  tags: exposure,file,apache,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/.licenserc.yaml'

    matchers-condition: and
    matchers:
      - type: word
        name: apache
        cpe: cpe:2.3:a:apache:apache:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'header:'
          - 'license:'
          - 'copyright-owner:'
        condition: and

      - type: status
        status:
          - 200
