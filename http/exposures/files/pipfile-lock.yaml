id: pipfile-lock

info:
  name: Pipfile.lock Disclosure
  author: DhiyaneshDK
  severity: info
  classification:
    cpe: cpe:2.3:a:pip:pip:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Pipfile"
    vendor: pip
    product: pip
  tags: exposure,pip,devops,cicd,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Pipfile.lock"

    matchers-condition: and
    matchers:
      - type: word
        name: pip
        cpe: cpe:2.3:a:pip:pip:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"pipfile-spec":'
          - '"requires"'
        condition: and

      - type: status
        status:
          - 200
