id: yarn-lock

info:
  name: Yarn Lock File Disclosure
  author: oppsec,noraj
  severity: info
  description: |
    The yarn.lock file stores the versions of each Yarn dependency installed. It's a lock file for package.json.
  reference:
    - https://classic.yarnpkg.com/lang/en/docs/yarn-lock/
  classification:
    cpe: cpe:2.3:a:yarn:yarn:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: yarn
    product: yarn
  tags: exposure,files,yarn,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/yarn.lock"

    matchers-condition: and
    matchers:
      - type: word
        name: yarn
        cpe: cpe:2.3:a:yarn:yarn:*:*:*:*:*:*:*:*
        part: body
        words:
          - "# THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY."
          - "# yarn lockfile v1"
        condition: and

      - type: word
        name: yarn-2
        cpe: cpe:2.3:a:yarn:yarn:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
