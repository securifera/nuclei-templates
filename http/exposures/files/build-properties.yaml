id: build-properties

info:
  name: Build Properties File Exposure
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:build-properties:build-properties:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    google-query: intitle:"index of" "build.properties"
    vendor: build-properties
    product: build-properties
  tags: exposure,config,files,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/build.properties'
      - '{{BaseURL}}/build/build.properties'
      - '{{BaseURL}}/manual/style/build.properties'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: build-properties
        cpe: cpe:2.3:a:build-properties:build-properties:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'manpages.8 = \'
          - 'manpages.1 = \'

      - type: status
        status:
          - 200
