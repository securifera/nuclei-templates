id: salesforce-credentials

info:
  name: Salesforce Credentials - Detect
  author: geeknik
  severity: high
  description: Salesforce credentials information was detected.
  reference:
    - https://github.com/daveagp/websheets
  classification:
    cpe: cpe:2.3:a:salesforce:salesforce:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200
  metadata:
    max-request: 2
    vendor: salesforce
    product: salesforce
  tags: exposure,files,salesforce,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/js/salesforce.js'
      - '{{BaseURL}}/salesforce.js'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: salesforce
        cpe: cpe:2.3:a:salesforce:salesforce:*:*:*:*:*:*:*:*
        words:
          - 'jsforce.Connection'
          - 'conn.login'
          - 'conn.query'
        condition: and

      - type: word
        name: salesforce-2
        cpe: cpe:2.3:a:salesforce:salesforce:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/plain"

      - type: status
        status:
          - 200
