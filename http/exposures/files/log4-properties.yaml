id: log4-properties

info:
  name: Log4j Properties - File Disclosure
  author: DhiyaneshDk
  severity: low
  description: |
    Log4j Properties file is exposed.
  reference:
    - https://docs.oracle.com/cd/E29578_01/webhelp/cas_webcrawler/src/cwcg_config_log4j_file.html
  classification:
    cpe: cpe:2.3:a:log4-properties:log4-properties:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"log4j.properties"
    vendor: log4-properties
    product: log4-properties
  tags: exposure,files,log4j,oracle,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/log4j.properties'

    matchers-condition: and
    matchers:
      - type: word
        name: log4-properties
        cpe: cpe:2.3:a:log4-properties:log4-properties:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'log4j.rootLogger='
          - 'log4j.logger'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
