id: core-dump

info:
  name: Exposed Core Dump - File Disclosure
  author: kazet
  severity: medium
  description: Exposed Core Dump internal file is disclosed.
  reference:
    - https://github.com/hannob/snallygaster/blob/4c5a9b54501f64da96787c2a2e3a12ce2e09c1ab/snallygaster#L295
  classification:
    cpe: cpe:2.3:a:core-dump:core-dump:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: core-dump
    product: core-dump
  tags: exposure,files,core-dump,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/core"

    matchers:
      - type: regex
        name: core-dump
        cpe: cpe:2.3:a:core-dump:core-dump:*:*:*:*:*:*:*:*
        regex:
          - '^\x7fELF'
