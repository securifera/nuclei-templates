id: vscode-mcp-json

info:
  name: Visual Studio Code MCP Configuration ("mcp.json") Exposure
  author: DhiyaneshDk
  severity: low
  description: |
    Detected exposed VS Code MCP (Model Context Protocol) configuration files (mcp.json) which may contain sensitive information including API keys, server endpoints, authentication tokens, and tool configurations for AI assistants and language models.
  reference:
    - https://code.visualstudio.com/docs/copilot/chat/mcp-servers
    - https://modelcontextprotocol.io/
  classification:
    cpe: cpe:2.3:a:vscode:vscode:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"mcp.json"
    vendor: vscode
    product: vscode
  tags: exposure,vscode,config,mcp,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}/mcp.json"
      - "{{BaseURL}}/.mcp.json"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: vscode
        cpe: cpe:2.3:a:vscode:vscode:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"mcpServers": {'
          - '"args":'
        condition: and

      - type: status
        status:
          - 200
