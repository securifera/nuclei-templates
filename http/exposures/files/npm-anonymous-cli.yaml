id: npm-anonymous-cli

info:
  name: NPM Anonymous CLI Metrics Exposure
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/maurosoria/dirsearch/blob/master/db/dicc.txt
  classification:
    cpe: cpe:2.3:a:npm:npm:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"anonymous-cli-metrics.json"
    vendor: npm
    product: npm
  tags: exposure,npm,config,files,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/.npm/anonymous-cli-metrics.json'
      - '{{BaseURL}}/anonymous-cli-metrics.json'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: npm
        cpe: cpe:2.3:a:npm:npm:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"metricId":'
          - '"metrics":'
          - '"successfulInstalls":'
        condition: and

      - type: word
        name: npm-2
        cpe: cpe:2.3:a:npm:npm:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"
