id: docker-cloud

info:
  name: Docker Cloud Yaml - File Disclosure
  author: DhiyaneshDK
  severity: medium
  description: Docker cloud internal yaml file is exposed.
  reference:
    - https://www.exploit-db.com/ghdb/7959
  classification:
    cpe: cpe:2.3:a:docker:cloud:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    google-query: intitle:"index of" "docker-cloud.yml"
    vendor: docker
    product: cloud
  tags: exposure,cloud,devops,docker,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/docker-cloud.yml"

    matchers-condition: and
    matchers:
      - type: regex
        name: cloud
        cpe: cpe:2.3:a:docker:cloud:*:*:*:*:*:*:*:*
        regex:
          - '(?m)^  image:'
          - '(?m)^  ports:'
        condition: and

      - type: word
        name: cloud-2
        cpe: cpe:2.3:a:docker:cloud:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"
          - "text/html"
        negative: true
        condition: or

      - type: status
        status:
          - 200
