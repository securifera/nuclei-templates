id: readme-md

info:
  name: README.md file disclosure
  author: ambassify
  severity: info
  description: Internal documentation file often used in projects which can contain sensitive information.
  classification:
    cpe: cpe:2.3:a:readme-md:readme-md:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: html:"README.MD"
    vendor: readme-md
    product: readme-md
  tags: exposure,markdown,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/README.md"

    matchers-condition: and
    matchers:
      - type: word
        name: readme-md
        cpe: cpe:2.3:a:readme-md:readme-md:*:*:*:*:*:*:*:*
        words:
          - "#"
          - "##"
        condition: or

      - type: word
        name: readme-md-2
        cpe: cpe:2.3:a:readme-md:readme-md:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/markdown"
          - "text/plain"
        condition: or

      - type: status
        status:
          - 200
