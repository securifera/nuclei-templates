id: db-xml-file

info:
  name: db.xml File - Detect
  author: tess
  severity: medium
  description: db.xml file was detected.
  classification:
    cpe: cpe:2.3:a:db-xml-file:db-xml-file:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: db-xml-file
    product: db-xml-file
  tags: misconfig,db,files,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/db.xml"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: db-xml-file
        cpe: cpe:2.3:a:db-xml-file:db-xml-file:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<ServerName>"
          - "<DBPASS>"
          - "<DBtype>"
        condition: and

      - type: status
        status:
          - 200
