id: thumbs-db-disclosure

info:
  name: Thumbs DB Disclosure
  author: dhiyaneshDk
  severity: info
  reference:
    - https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/thumbs-db-disclosure.json
  classification:
    cpe: cpe:2.3:a:thumbs-db:thumbs-db:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: thumbs-db
    product: thumbs-db
  tags: exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Thumbs.db"

    matchers-condition: and
    matchers:
      - type: binary
        name: thumbs-db
        cpe: cpe:2.3:a:thumbs-db:thumbs-db:*:*:*:*:*:*:*:*
        binary:
          - 'D0CF11E0A1B11AE1'
        part: body

      - type: status
        status:
          - 200
