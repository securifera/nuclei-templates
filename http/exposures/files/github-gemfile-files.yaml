id: github-gemfile-files

info:
  name: Github Gemfiles
  author: hahwul
  severity: info
  description: Find github page files(Gemfile / Gemfile.lock)
  classification:
    cpe: cpe:2.3:a:github-gemfile-files:github-gemfile-files:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: github-gemfile-files
    product: github-gemfile-files
  tags: github,exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Gemfile"
      - "{{BaseURL}}/Gemfile.lock"

    matchers-condition: or
    matchers:
      - type: dsl
        name: github-gemfile-files
        cpe: cpe:2.3:a:github-gemfile-files:github-gemfile-files:*:*:*:*:*:*:*:*
        dsl:
          - 'contains(body, "https://rubygems.org")'
          - 'contains(body, "source")'
          - 'contains(body, "gem")'
          - 'status_code == 200'
        condition: and

      - type: dsl
        name: github-gemfile-files-2
        cpe: cpe:2.3:a:github-gemfile-files:github-gemfile-files:*:*:*:*:*:*:*:*
        dsl:
          - 'contains(body, "https://rubygems.org")'
          - 'contains(body, "remote")'
          - 'contains(body, "specs")'
          - 'status_code == 200'
        condition: and
