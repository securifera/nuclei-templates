id: github-page-config

info:
  name: Github pages config file
  author: hahwul
  severity: info
  description: Find github pages config file.
  classification:
    cpe: cpe:2.3:a:github-page-config:github-page-config:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: github-page-config
    product: github-page-config
  tags: github,exposure,config,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/_config.yml"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: github-page-config
        cpe: cpe:2.3:a:github-page-config:github-page-config:*:*:*:*:*:*:*:*
        words:
          - "jekyll"
          - "title"
          - "baseurl"
        condition: and
