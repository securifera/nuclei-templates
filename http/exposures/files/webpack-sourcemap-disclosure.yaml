id: webpack-sourcemap-disclosure

info:
  name: Webpack Sourcemap Disclosure
  author: dhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:webpack-sourcemap:webpack-sourcemap:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: webpack-sourcemap
    product: webpack-sourcemap
  tags: exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{RootURL}}/{{Path}}/{{map}}.js.map"

    matchers-condition: and
    matchers:
      - type: word
        name: webpack-sourcemap
        cpe: cpe:2.3:a:webpack-sourcemap:webpack-sourcemap:*:*:*:*:*:*:*:*
        words:
          - '"version":'
          - '"file":'
          - '"sources":'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        internal: true
        name: map
        group: 1
        regex:
          - "sourceMappingURL=([a-z-~0-9.]+).js.map"
