id: kubernetes-etcd-keys

info:
  name: Kubernetes etcd Keys - Exposure
  author: Hardik-Solanki
  severity: medium
  description: Kubernetes private etcd keys are exposed.
  reference:
    - https://github.com/maurosoria/dirsearch/blob/master/db/dicc.txt
  classification:
    cpe: cpe:2.3:a:kubernetes:kubernetes:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    github-query: filename:apiserver-etcd-client.key
    vendor: kubernetes
    product: kubernetes
  tags: files,exposure,kubernetes,k8s,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/apiserver-etcd-client.key"

    matchers-condition: and
    matchers:
      - type: regex
        name: kubernetes
        cpe: cpe:2.3:a:kubernetes:kubernetes:*:*:*:*:*:*:*:*
        part: body
        regex:
          - '(?m)^-----BEGIN PRIVATE KEY-----'

      - type: word
        name: kubernetes-2
        cpe: cpe:2.3:a:kubernetes:kubernetes:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"
          - "application/html"
        condition: and
        negative: true

      - type: status
        status:
          - 200
