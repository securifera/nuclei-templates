id: nuxtjs-config-file

info:
  name: Nuxtjs Config File - File Disclosure
  author: DhiyaneshDk
  severity: low
  description: |
    Nuxtjs Config file is exposed.
  classification:
    cpe: cpe:2.3:a:nuxtjs:nuxtjs:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"nuxt.config.ts"
    vendor: nuxtjs
    product: nuxtjs
  tags: exposure,files,nuxtjs,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/nuxt.config.js'

    matchers-condition: and
    matchers:
      - type: word
        name: nuxtjs
        cpe: cpe:2.3:a:nuxtjs:nuxtjs:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'export default {'
          - 'buildModules: ['
        condition: and
        case-insensitive: true

      - type: word
        name: nuxtjs-2
        cpe: cpe:2.3:a:nuxtjs:nuxtjs:*:*:*:*:*:*:*:*
        part: content_type
        words:
          - 'application/javascript'
