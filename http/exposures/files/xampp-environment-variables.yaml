id: xampp-environment-variables

info:
  name: XAMPP Environment Variables Exposure
  author: melbadry9,DhiyaneshDK
  severity: low
  description: printenv.pl file is exposed in XAMPP leaking environment variables.
  classification:
    cpe: cpe:2.3:a:xampp:xampp:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: xampp
    product: xampp
  tags: exposure,xampp,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/printenv.pl"

    matchers-condition: and
    matchers:
      - type: word
        name: xampp
        cpe: cpe:2.3:a:xampp:xampp:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<TITLE>Environment Variables</TITLE>"
          - "Environment Variables:"
        condition: and

      - type: word
        name: xampp-2
        cpe: cpe:2.3:a:xampp:xampp:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
