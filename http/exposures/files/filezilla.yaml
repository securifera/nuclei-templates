id: filezilla-exposed

info:
  name: Filezilla
  author: amsda
  severity: medium
  description: Filezilla internal file is exposed.
  classification:
    cpe: cpe:2.3:a:filezilla:filezilla:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: filezilla
    product: filezilla
  tags: exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/filezilla.xml"
      - "{{BaseURL}}/sitemanager.xml"
      - "{{BaseURL}}/FileZilla.xml"

    matchers-condition: and
    matchers:
      - type: word
        name: filezilla
        cpe: cpe:2.3:a:filezilla:filezilla:*:*:*:*:*:*:*:*
        words:
          - "<FileZilla"
          - "<Servers>"
        condition: and

      - type: word
        name: filezilla-2
        cpe: cpe:2.3:a:filezilla:filezilla:*:*:*:*:*:*:*:*
        words:
          - xml
        part: header

      - type: status
        status:
          - 200
