id: npmrc-authtoken

info:
  name: Hardcoded .npmrc AuthToken
  author: geeknik
  severity: info
  reference:
    - https://docs.npmjs.com/cli/v8/configuring-npm/npmrc
    - https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-npm-registry
  classification:
    cpe: cpe:2.3:a:npm:npm:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    google-query: intitle:"index of" ".npmrc"
    vendor: npm
    product: npm
  tags: npm,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.npmrc"

    matchers-condition: and
    matchers:
      - type: word
        name: npm
        cpe: cpe:2.3:a:npm:npm:*:*:*:*:*:*:*:*
        words:
          - "_authToken="
          - "_auth="
        condition: or

      - type: word
        name: npm-2
        cpe: cpe:2.3:a:npm:npm:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"
          - "application/javascript"
          - "application/json"
        negative: true

      - type: status
        status:
          - 200
