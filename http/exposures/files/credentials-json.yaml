id: credentials-json

info:
  name: Credentials File Disclosure
  author: ritikchaddha
  severity: medium
  description: Internal secret file is exposed.
  classification:
    cpe: cpe:2.3:a:credentials-json:credentials-json:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    google-query: intitle:"index of" "credentials.json"
    vendor: credentials-json
    product: credentials-json
  tags: google,secret,exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/credentials.json"
      - "{{BaseURL}}/assets/credentials.json"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: credentials-json
        cpe: cpe:2.3:a:credentials-json:credentials-json:*:*:*:*:*:*:*:*
        words:
          - '"client_secret":'
          - '"client_id":'
        condition: and

      - type: status
        status:
          - 200
