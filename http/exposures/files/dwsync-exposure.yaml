id: dwsync-exposure

info:
  name: Dreamweaver Dwsync.xml Exposure
  author: KaizenSecurity
  severity: info
  description: The Dreamweaver file dwsync.xml was discovered. The dwsync.xml file is a file generated by Dreamweaver which contains information related to what files are in the website directory.
  classification:
    cpe: cpe:2.3:a:dwsync:dwsync:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: dwsync
    product: dwsync
  tags: dwsync,exposure,dreamweaver,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/_notes/dwsync.xml"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: dwsync
        cpe: cpe:2.3:a:dwsync:dwsync:*:*:*:*:*:*:*:*
        part: header
        words:
          - application/xml

      - type: word
        name: dwsync-2
        cpe: cpe:2.3:a:dwsync:dwsync:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<dwsync>'
          - '</dwsync>'
        condition: and
