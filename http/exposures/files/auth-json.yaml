id: auth-json

info:
  name: Auth.json File - Disclosure
  author: DhiyaneshDk
  severity: high
  description: auth.json file is exposed.
  classification:
    cpe: cpe:2.3:a:auth-json:auth-json:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"auth.json"
    vendor: auth-json
    product: auth-json
  tags: devops,exposure,files,auth,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth.json"

    matchers-condition: or
    matchers:
      - type: word
        name: auth-json
        cpe: cpe:2.3:a:auth-json:auth-json:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"http-basic": {'
          - '"username":'
          - '"password":'
        condition: and

      - type: word
        name: auth-json-2
        cpe: cpe:2.3:a:auth-json:auth-json:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"github-oauth": {'
          - '"github.com":'
        condition: and

      - type: word
        name: auth-json-3
        cpe: cpe:2.3:a:auth-json:auth-json:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"bitbucket-oauth":'
          - '"consumer-key":'
          - '"consumer-secret":'
        condition: and
