id: database-credentials

info:
  name: Database Credentials File Exposure
  author: Hardik-Solanki,geeknik
  severity: low
  description: Internal file exposed containing database credentials.
  reference:
    - https://github.com/maurosoria/dirsearch/blob/master/db/dicc.txt
  classification:
    cpe: cpe:2.3:a:database:database:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    github-query: filename:database_credentials.inc
    vendor: database
    product: database
  tags: exposure,database,config,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/database_credentials.inc"

    matchers-condition: and
    matchers:
      - type: word
        name: database
        cpe: cpe:2.3:a:database:database:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'DATABASE_USER'
          - 'DB_USER'
          - 'USERNAME'
          - 'USER'
        condition: or

      - type: word
        name: database-2
        cpe: cpe:2.3:a:database:database:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'DATABASE_PASS'
          - 'DB_PASS'
          - 'PASSWORD'
          - 'PASS'
        condition: or

      - type: status
        status:
          - 200
          - 401
          - 403
        condition: or

      - type: word
        name: database-3
        cpe: cpe:2.3:a:database:database:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Access denied'
          - 'Unauthorized'
        condition: or
        negative: true

      - type: word
        name: database-4
        cpe: cpe:2.3:a:database:database:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'Content-Type: text/plain'
          - 'Content-Type: application/json'
        condition: or
