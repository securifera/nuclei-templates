id: reactapp-env-js

info:
  name: React App Environment Js
  author: random-robbie,rinolock
  severity: unknown
  classification:
    cpe: cpe:2.3:a:react:react:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    github-query: "REACT_APP_"
    vendor: react
    product: react
  tags: react,exposure,config,js,javascript,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/env.js"
      - "{{BaseURL}}/config.js"
      - "{{BaseURL}}/config/env.js"
      - "{{BaseURL}}/config/runtime-env.js"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        name: react
        cpe: cpe:2.3:a:react:react:*:*:*:*:*:*:*:*
        part: body
        words:
          - "REACT_APP_"

      - type: word
        name: react-2
        cpe: cpe:2.3:a:react:react:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/octet-stream"
          - "application/javascript"
          - "text/plain"
        condition: or

      - type: status
        status:
          - 200
