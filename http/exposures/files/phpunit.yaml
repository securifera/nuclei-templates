id: phpunit

info:
  name: phpunit.xml File Disclosure
  author: pikpikcu
  severity: info
  description: Phpunit.xml was created by Romain Bourdon for the development of WampServer 3.1. Phpunit.xml is packaged with WampServer 3.1.9 and XAMPP 5.6.40.
  remediation: Ensure the approved and updated version is installed.
  reference:
    - https://www.wampserver.com/en/
  classification:
    cpe: cpe:2.3:a:phpunit:phpunit:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: phpunit
    product: phpunit
  tags: exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/phpunit.xml"

    matchers-condition: and
    matchers:
      - type: word
        name: phpunit
        cpe: cpe:2.3:a:phpunit:phpunit:*:*:*:*:*:*:*:*
        words:
          - "<phpunit"
          - "</phpunit>"
        condition: and

      - type: status
        status:
          - 200
