id: testignore-disclosure

info:
  name: Testignore - File Disclosure
  author: 0x_Akoko
  severity: info
  description: |
    Detected that the .testignore file was publicly accessible, potentially revealing the project structure, sensitive file paths, and internal directory organization.
  classification:
    cpe: cpe:2.3:a:testignore:testignore:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: testignore
    product: testignore
  tags: files,exposure,disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}/.testignore"

    matchers-condition: and
    matchers:
      - type: dsl
        name: testignore
        cpe: cpe:2.3:a:testignore:testignore:*:*:*:*:*:*:*:*
        dsl:
          - "status_code == 200"
          - "len(body) > 5"
        condition: and

      - type: regex
        name: testignore-2
        cpe: cpe:2.3:a:testignore:testignore:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "(?m)^[/#\\*\\.]"

      - type: word
        name: testignore-3
        cpe: cpe:2.3:a:testignore:testignore:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<html"
          - "<!doctype"
          - "<script"
          - "<meta"
          - "<head"
          - "<body"
          - "application/json"
          - "application/xml"
          - "text/xml"
          - "image/"
        negative: true
