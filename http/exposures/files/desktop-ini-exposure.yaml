id: desktop-ini-exposure

info:
  name: desktop.ini exposure
  author: dhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:desktop-ini:desktop-ini:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: 'html:"desktop.ini"'
    vendor: desktop-ini
    product: desktop-ini
  tags: exposure,config,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/desktop.ini"

    matchers-condition: and
    matchers:
      - type: word
        name: desktop-ini
        cpe: cpe:2.3:a:desktop-ini:desktop-ini:*:*:*:*:*:*:*:*
        part: header
        negative: true
        words:
          - "application/json"
          - "application/html"
        condition: and

      - type: word
        name: desktop-ini-2
        cpe: cpe:2.3:a:desktop-ini:desktop-ini:*:*:*:*:*:*:*:*
        part: body
        words:
          - "[.ShellClassInfo]"
          - "[LocalizedFileNames]"
          - "[ViewState]"
        condition: or

      - type: status
        status:
          - 200
