id: gcloud-credentials

info:
  name: Google Cloud Credentials
  author: DhiyaneshDK
  severity: medium
  description: Google Cloud Crdentials file is exposed.
  classification:
    cpe: cpe:2.3:a:gcloud:gcloud:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"credentials.db"
    vendor: gcloud
    product: gcloud
  tags: google,cloud,devops,exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/credentials.db"
      - "{{BaseURL}}/.config/gcloud/credentials.db"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: gcloud
        cpe: cpe:2.3:a:gcloud:gcloud:*:*:*:*:*:*:*:*
        words:
          - 'SQLite'
          - 'client_id'
        condition: and

      - type: word
        name: gcloud-2
        cpe: cpe:2.3:a:gcloud:gcloud:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'application/octet-stream'

      - type: status
        status:
          - 200
