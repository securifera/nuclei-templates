id: ftpconfig

info:
  name: Atom remote-ssh ftpconfig Exposure
  author: geeknik,DhiyaneshDK
  severity: high
  description: Created by remote-ssh for Atom, contains SFTP/SSH server details and credentials
  classification:
    cpe: cpe:2.3:a:ftpconfig:ftpconfig:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:ftpconfig
    vendor: ftpconfig
    product: ftpconfig
  tags: atom,ftp,config,exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.ftpconfig"

    matchers-condition: and
    matchers:
      - type: word
        name: ftpconfig
        cpe: cpe:2.3:a:ftpconfig:ftpconfig:*:*:*:*:*:*:*:*
        words:
          - '"protocol":'
          - '"host":'
          - '"user":'
          - '"passphrase":'
        condition: and

      - type: status
        status:
          - 200
