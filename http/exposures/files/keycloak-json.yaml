id: keycloak-json

info:
  name: Keycloak JSON File
  author: oppsec
  severity: info
  classification:
    cpe: cpe:2.3:a:keycloak:keycloak:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: keycloak
    product: keycloak
  tags: exposure,keycloak,config,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/keycloak.json"

    matchers-condition: and
    matchers:
      - type: word
        name: keycloak
        cpe: cpe:2.3:a:keycloak:keycloak:*:*:*:*:*:*:*:*
        words:
          - realm
          - resource
          - auth-server-url
        condition: and

      - type: status
        status:
          - 200
