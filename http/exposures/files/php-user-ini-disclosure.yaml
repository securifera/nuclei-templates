id: php-user-ini-disclosure

info:
  name: Php User.ini Disclosure
  author: dhiyaneshDk
  severity: medium
  description: PHP user.ini file is exposed.
  reference:
    - https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/php-user-ini-disclosure.json
  classification:
    cpe: cpe:2.3:a:php-user-ini:php-user-ini:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: php-user-ini
    product: php-user-ini
  tags: exposure,config,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/user.ini"
      - "{{BaseURL}}/.user.ini"

    matchers-condition: and
    matchers:
      - type: word
        name: php-user-ini
        cpe: cpe:2.3:a:php-user-ini:php-user-ini:*:*:*:*:*:*:*:*
        words:
          - "assert"
          - "highlight"
          - "opcache"
          - "mssql"
          - "oci8"
          - "agent"
        part: body
        condition: and

      - type: status
        status:
          - 200
