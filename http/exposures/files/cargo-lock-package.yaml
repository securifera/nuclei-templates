id: cargo-lock-package

info:
  name: Cargo Lock Packages Disclosure
  author: DhiyaneshDk
  severity: info
  reference:
    - https://raw.githubusercontent.com/maurosoria/dirsearch/master/db/dicc.txt
  classification:
    cpe: cpe:2.3:a:cargo:cargo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Cargo.lock"
    vendor: cargo
    product: cargo
  tags: exposure,files,cargo,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/Cargo.lock'

    matchers-condition: and
    matchers:
      - type: word
        name: cargo
        cpe: cpe:2.3:a:cargo:cargo:*:*:*:*:*:*:*:*
        part: body
        words:
          - "[[package]]"
          - "dependencies = ["
        condition: and

      - type: status
        status:
          - 200
