id: zapier-webhook-token

info:
  name: Zapier Webhook Disclosure
  author: Ice3man
  severity: info
  classification:
    cpe: cpe:2.3:a:zapier-webhook:zapier-webhook:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: zapier-webhook
    product: zapier-webhook
  tags: exposure,token,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - 'https://(?:www.)?hooks\.zapier\.com/hooks/catch/[A-Za-z0-9]+/[A-Za-z0-9]+/'
