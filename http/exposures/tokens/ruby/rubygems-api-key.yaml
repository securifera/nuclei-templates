id: rubygems-api-key

info:
  name: RubyGems API Key
  author: DhiyaneshDK
  severity: high
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/rubygems.yml
    - https://guides.rubygems.org/rubygems-org-api/
    - https://guides.rubygems.org/api-key-scopes/
  classification:
    cpe: cpe:2.3:a:rubygems:rubygems:*:*:*:*:*:*:*:*
    cwe-id: CWE-522,CWE-540
  metadata:
    verified: true
    max-request: 1
    vendor: rubygems
    product: rubygems
  tags: rubygems,token,exposure,ruby,vuln

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: body
        name: token
        cpe: cpe:2.3:a:rubygems:rubygems:*:*:*:*:*:*:*:*
        regex:
          - "(rubygems_[a-f0-9]{48})"
        internal: true

  - raw:
      - |
        @Host: https://rubygems.org:443
        GET /api/v1/web_hooks.json HTTP/1.1
        Host: rubygems.org
        Authorization: {{token}}

    disable-path-automerge: true
    matchers:
      - type: dsl
        name: rubygems
        cpe: cpe:2.3:a:rubygems:rubygems:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - '!contains(body, "Access Denied")'
          - 'contains(content_type, "application/json")'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - token
