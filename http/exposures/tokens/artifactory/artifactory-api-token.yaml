id: artifactory-api-token

info:
  name: Artifactory API Token Disclosure
  author: Ice3man
  severity: info
  reference:
    - https://jfrog.com/help/r/jfrog-rest-apis/introduction-to-the-artifactory-rest-apis
  classification:
    cpe: cpe:2.3:a:artifactory:artifactory:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: artifactory
    product: artifactory
  tags: exposure,token,artifactory,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - '(?:\s|=|:|"|^)AKC[a-zA-Z0-9]{10,}'
