id: postman-key

info:
  name: Postman API Key
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/rules/postman.yml
    - https://learning.postman.com/docs/developer/intro-api/
    - https://learning.postman.com/docs/developer/postman-api/authentication/
  classification:
    cpe: cpe:2.3:a:postman:postman:*:*:*:*:*:*:*:*
    cwe-id: CWE-540
  metadata:
    verified: true
    max-request: 1
    vendor: postman
    product: postman
  tags: postman,keys,token,api,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - '\b(PMAK-[a-zA-Z0-9]{24}-[a-zA-Z0-9]{34})\b'
