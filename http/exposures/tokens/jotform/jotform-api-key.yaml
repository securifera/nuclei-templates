id: jotform-api-key

info:
  name: Jotform API Key
  author: Shankar Acharya
  severity: info
  reference:
    - https://www.jotform.com/help/253-how-to-create-a-jotform-api-key/
  classification:
    cpe: cpe:2.3:a:jotform:jotform:*:*:*:*:*:*:*:*
  metadata:
    verified: "true"
    max-request: 1
    vendor: jotform
    product: jotform
  tags: token,exposure,jotform,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: jotform
        cpe: cpe:2.3:a:jotform:jotform:*:*:*:*:*:*:*:*
        part: body
        words:
          - "jotform"
          - "api"
        condition: and

      - type: regex
        name: jotform-2
        cpe: cpe:2.3:a:jotform:jotform:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "[0-9a-fA-F]{32}"

    extractors:
      - type: regex
        part: body
        regex:
          - "[0-9a-fA-F]{32}"
