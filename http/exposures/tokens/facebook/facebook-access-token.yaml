id: facebook-access-token

info:
  name: Facebook Access Token
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/facebook.yml
    - https://developers.facebook.com/docs/facebook-login/access-tokens/
  classification:
    cpe: cpe:2.3:a:facebook:facebook:*:*:*:*:*:*:*:*
    cwe-id: CWE-522,CWE-540
  metadata:
    verified: true
    max-request: 1
    vendor: facebook
    product: facebook
  tags: facebook,token,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - '\b(EAACEdEose0cBA[a-zA-Z0-9]+)\b'
