id: databricks-token

info:
  name: Databricks API Token
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/returntocorp/semgrep-rules/blob/develop/generic/secrets/gitleaks/databricks-api-token.yaml
    - https://github.com/returntocorp/semgrep-rules/blob/develop/generic/secrets/gitleaks/databricks-api-token.go
    - https://docs.databricks.com/en/dev-tools/auth/pat.html
  classification:
    cpe: cpe:2.3:a:databricks:databricks:*:*:*:*:*:*:*:*
    cwe-id: CWE-522,CWE-540
  metadata:
    verified: true
    max-request: 1
    vendor: databricks
    product: databricks
  tags: databricks,exposure,tokens,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - (?i)\b(dapi[a-h0-9]{32})(?:['|\"|\n|\r|\s|\x60|;]|$)
