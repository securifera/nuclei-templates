id: remita-credentials

info:
  name: Remita Merchant ID & API Key - Exposure
  author: Lloydcoder
  severity: low
  classification:
    cpe: cpe:2.3:a:remita:remita:*:*:*:*:*:*:*:*
  description: |
    Detected exposed Remita merchant IDs, API keys, and secret hashes in application source code, configuration files, or publicly accessible assets.
  reference:
    - https://api.remita.net/
  metadata:
    vendor: remita
    product: remita
  tags: exposure,remita,fintech,tinlance,lloydcoder,token

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers-condition: and
    matchers:
      - type: regex
        name: remita
        cpe: cpe:2.3:a:remita:remita:*:*:*:*:*:*:*:*
        regex:
          - "merchantId[\"']?\\s*[:=]\\s*[\"']?\\d{10,}[\"']?"

      - type: word
        name: remita-2
        cpe: cpe:2.3:a:remita:remita:*:*:*:*:*:*:*:*
        words:
          - "remita"
          - "merchantId"
          - "publicKey"
        condition: or
        case-insensitive: true
