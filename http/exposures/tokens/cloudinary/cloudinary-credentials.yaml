id: cloudinary-credentials

info:
  name: Cloudinary Credentials Disclosure
  author: Ice3man
  severity: info
  classification:
    cpe: cpe:2.3:a:cloudinary:cloudinary:*:*:*:*:*:*:*:*
    cwe-id: CWE-522,CWE-540
  metadata:
    max-request: 1
    vendor: cloudinary
    product: cloudinary
  tags: exposure,token,cloudinary,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - 'cloudinary://[0-9]+:[A-Za-z0-9\-_\.]+@[A-Za-z0-9\-_\.]+'
