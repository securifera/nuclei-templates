id: picatic-api-key

info:
  name: Picatic API Key Disclosure
  author: Ice3man
  severity: info
  classification:
    cpe: cpe:2.3:a:picatic:picatic:*:*:*:*:*:*:*:*
    cwe-id: CWE-540
  metadata:
    max-request: 1
    vendor: picatic
    product: picatic
  tags: exposure,token,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - 'sk_live_[0-9a-z]{32}'
