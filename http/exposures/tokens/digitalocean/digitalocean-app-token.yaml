id: digitalocean-app-token

info:
  name: DigitalOcean Application Access Token
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/rules/digitalocean.yml
    - https://docs.digitalocean.com/reference/api/
  classification:
    cpe: cpe:2.3:a:digitalocean:digitalocean:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: digitalocean
    product: digitalocean
  tags: digitalocean,exposure,token,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - (?i)\b(doo_v1_[a-f0-9]{64})\b
