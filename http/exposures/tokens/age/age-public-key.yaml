id: age-public-key

info:
  name: Age Recipient (X25519 public key)
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/age.yml
    - https://github.com/FiloSottile/age/blob/main/doc/age.1.html
    - https://github.com/C2SP/C2SP/blob/8b6a842e0360d35111c46be2a8019b2276295914/age.md#the-x25519-recipient-type
    - https://age-encryption.org
  classification:
    cpe: cpe:2.3:a:age-public-key:age-public-key:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: age-public-key
    product: age-public-key
  tags: age-encryption,exposure,tokens,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - '\bage1[0-9a-z]{58}\b'
