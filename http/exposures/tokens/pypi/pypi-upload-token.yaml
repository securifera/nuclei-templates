id: pypi-upload-token

info:
  name: PyPI Upload Token
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/pypi.yml
    - https://github.com/pypa/warehouse/issues/6051
    - https://pypi.org/project/pypitoken/
  classification:
    cpe: cpe:2.3:a:pypi:pypi:*:*:*:*:*:*:*:*
    cwe-id: CWE-540
  metadata:
    verified: true
    max-request: 1
    vendor: pypi
    product: pypi
  tags: pypi,token,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "(pypi-AgEIcHlwaS5vcmc[a-zA-Z0-9_-]{50,})"
