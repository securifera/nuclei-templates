id: amazon-mws-auth-token

info:
  name: Amazon MWS Auth Token
  author: puzzlepeaches
  severity: info
  classification:
    cpe: cpe:2.3:a:amazon:amazon:*:*:*:*:*:*:*:*
    cwe-id: CWE-522,CWE-540
  metadata:
    max-request: 1
    vendor: amazon
    product: amazon
  tags: exposure,token,aws,amazon,auth,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "amzn\\.mws\\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
