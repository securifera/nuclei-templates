id: gitlab-pipeline-token

info:
  name: GitLab Pipeline Trigger Token
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/gitlab.yml
    - https://docs.gitlab.com/ee/ci/triggers/
    - https://gitlab.com/gitlab-org/gitlab/-/issues/371396
    - https://gitlab.com/gitlab-org/gitlab/-/issues/388379
  classification:
    cpe: cpe:2.3:a:gitlab:gitlab:*:*:*:*:*:*:*:*
    cwe-id: CWE-540
  metadata:
    verified: true
    max-request: 1
    vendor: gitlab
    product: gitlab
  tags: gitlab,token,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - '\b(glptt-[0-9a-f]{40})\b'
