id: crates-api-key

info:
  name: Crates.io API Key
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/crates.io.yml
    - https://crates.io/data-access
    - https://github.com/rust-lang/crates.io/blob/master/src/util/token.rs
  classification:
    cpe: cpe:2.3:a:crates:crates:*:*:*:*:*:*:*:*
    cwe-id: CWE-522,CWE-540
  metadata:
    verified: true
    max-request: 1
    vendor: crates
    product: crates
  tags: crates,token,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - '\bcio[a-zA-Z0-9]{32}\b'
