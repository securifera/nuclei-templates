id: newrelic-synthetics-location-key

info:
  name: Synthetics Location Key Disclosure
  author: Ice3man
  severity: info
  classification:
    cpe: cpe:2.3:a:newrelic-synthetics-location-key:newrelic-synthetics-location-key:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: newrelic-synthetics-location-key
    product: newrelic-synthetics-location-key
  tags: exposure,token,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)NRSP-[a-z]{2}[0-9]{2}[a-f0-9]{31}'
