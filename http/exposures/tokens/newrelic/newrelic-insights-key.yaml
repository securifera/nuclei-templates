id: newrelic-insights-key

info:
  name: Insights Keys Disclosure
  author: Ice3man
  severity: info
  reference:
    - https://docs.newrelic.com/docs/apis/intro-apis/new-relic-api-keys/#insights-insert-key
  classification:
    cpe: cpe:2.3:a:newrelic-insights-key:newrelic-insights-key:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: newrelic-insights-key
    product: newrelic-insights-key
  tags: exposure,token,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)NRI(?:I|Q)-[A-Za-z0-9\-_]{32}'
