id: newrelic-license-key

info:
  name: New Relic License Key
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/newrelic.yml
    - https://docs.newrelic.com/docs/apis/intro-apis/new-relic-api-keys
    - https://docs.newrelic.com/docs/apis/intro-apis/new-relic-api-keys/#license-key
  classification:
    cpe: cpe:2.3:a:newrelic:newrelic:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: newrelic
    product: newrelic
  tags: newrelic,exposure,tokens,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - (?i)\b([a-z0-9]{6}[a-f0-9]{30}nral)\b
