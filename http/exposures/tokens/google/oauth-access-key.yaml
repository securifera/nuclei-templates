id: google-oauth-access-key

info:
  name: Google OAuth Access Key Disclosure
  author: Ice3man
  severity: info
  classification:
    cpe: cpe:2.3:a:oauth-access-key:oauth-access-key:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: oauth-access-key
    product: oauth-access-key
  tags: exposure,token,google,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - 'ya29\.[0-9A-Za-z\-_]+'
