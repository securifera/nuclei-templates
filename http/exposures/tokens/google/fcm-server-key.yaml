id: fcm-server-key

info:
  name: FCM Server Key
  author: absshax
  severity: high
  description: FCM Server Key is leaked.
  reference:
    - https://abss.me/posts/fcm-takeover
  classification:
    cpe: cpe:2.3:a:fcm-server-key:fcm-server-key:*:*:*:*:*:*:*:*
    cwe-id: CWE-540
  metadata:
    max-request: 1
    vendor: fcm-server-key
    product: fcm-server-key
  tags: exposure,token,google,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "AAAA[a-zA-Z0-9_-]{7}:[a-zA-Z0-9_-]{140}"
