id: google-api-key

info:
  name: Google API Key
  author: Swissky
  severity: info
  reference:
    - https://cloud.google.com/docs/authentication/api-keys#securing
    - https://support.google.com/googleapi/answer/6310037
  classification:
    cpe: cpe:2.3:a:google:google:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: google
    product: google
  tags: exposure,token,google,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/hopfully404"

    extractors:
      - type: regex
        part: body
        regex:
          - "AIza[0-9A-Za-z\\-_]{35}"
