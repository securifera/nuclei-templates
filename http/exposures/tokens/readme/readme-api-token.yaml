id: readme-api-token

info:
  name: Readme API Token
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/semgrep/semgrep-rules/blob/develop/generic/secrets/gitleaks/readme-api-token.go
    - https://github.com/semgrep/semgrep-rules/blob/develop/generic/secrets/gitleaks/readme-api-token.yaml
  classification:
    cpe: cpe:2.3:a:readme:readme:*:*:*:*:*:*:*:*
    cwe-id: CWE-522,CWE-540
  metadata:
    max-request: 1
    verified: true
    vendor: readme
    product: readme
  tags: exposure,token,readme,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - (?i)\b(rdme_[a-z0-9]{70})(?:['|\"|\n|\r|\s|\x60|;]|$)
