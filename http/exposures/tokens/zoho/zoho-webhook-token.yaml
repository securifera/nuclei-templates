id: zoho-webhook-token

info:
  name: Zoho Webhook Disclosure
  author: Ice3man
  severity: info
  classification:
    cpe: cpe:2.3:a:zoho:zoho:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: zoho
    product: zoho
  tags: exposure,token,zoho,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - 'https://creator\.zoho\.com/api/[A-Za-z0-9/\-_\.]+\?authtoken=[A-Za-z0-9]+'
