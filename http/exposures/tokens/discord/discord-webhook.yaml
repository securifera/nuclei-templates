id: discord-webhook

info:
  name: Discord Webhook Disclosure
  author: Ice3man, apapedulimu
  severity: info
  classification:
    cpe: cpe:2.3:a:discord:discord:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: discord
    product: discord
  tags: exposure,token,discord,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - 'https://discordapp\.com/api/webhooks/[0-9]+/[A-Za-z0-9\-]+'
          - 'https://discord\.com/api/webhooks/[0-9]+/[A-Za-z0-9\-]+'
