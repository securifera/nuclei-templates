id: duffel-token

info:
  name: Duffel API Token
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/returntocorp/semgrep-rules/blob/develop/generic/secrets/gitleaks/duffel-api-token.yaml
    - https://github.com/returntocorp/semgrep-rules/blob/develop/generic/secrets/gitleaks/duffel-api-token.go
  classification:
    cpe: cpe:2.3:a:duffel:duffel:*:*:*:*:*:*:*:*
    cwe-id: CWE-540
  metadata:
    verified: true
    max-request: 1
    vendor: duffel
    product: duffel
  tags: duffel,exposure,tokens,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - duffel_(test|live)_(?i)[a-z0-9_\-=]{43}
