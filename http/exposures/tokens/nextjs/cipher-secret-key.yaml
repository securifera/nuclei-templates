id: cipher-secret-key

info:
  name: Cipher Secret Key Exposure
  author: israel comazzetto dos reis
  severity: info
  classification:
    cpe: cpe:2.3:a:cipher:cipher:*:*:*:*:*:*:*:*
    cwe-id: CWE-522,CWE-540
  metadata:
    max-request: 1
    vendor: cipher
    product: cipher
  tags: exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: cipher
        cpe: cpe:2.3:a:cipher:cipher:*:*:*:*:*:*:*:*
        part: body
        words:
          - "cipherSecretKey:"

      - type: status
        status:
          - 200
