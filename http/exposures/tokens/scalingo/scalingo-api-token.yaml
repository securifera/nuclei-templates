id: scalingo-api-token

info:
  name: Scalingo API Token
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/semgrep/semgrep-rules/blob/develop/generic/secrets/gitleaks/scalingo-api-token.go
    - https://github.com/semgrep/semgrep-rules/blob/develop/generic/secrets/gitleaks/scalingo-api-token.yaml
  classification:
    cpe: cpe:2.3:a:scalingo:scalingo:*:*:*:*:*:*:*:*
    cwe-id: CWE-522,CWE-540
  metadata:
    max-request: 1
    verified: true
    vendor: scalingo
    product: scalingo
  tags: exposure,token,scalingo,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - \b(tk-us-[a-zA-Z0-9-_]{48})(?:['|\"|\n|\r|\s|\x60|;]|$)
