id: mailchimp-access-key-value

info:
  name: Mailchimp API Value
  author: puzzlepeaches
  severity: info
  reference:
    - https://mailchimp.com/help/about-api-keys/
  classification:
    cpe: cpe:2.3:a:mailchimp:mailchimp:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: mailchimp
    product: mailchimp
  tags: exposure,token,mailchimp,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "[0-9a-f]{32}-us[0-9]{1,2}"
