id: jdbc-connection-string

info:
  name: JDBC Connection String Disclosure
  author: Ice3man
  severity: unknown
  classification:
    cpe: cpe:2.3:a:jdbc-connection-string:jdbc-connection-string:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: jdbc-connection-string
    product: jdbc-connection-string
  tags: exposure,token,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - 'jdbc:[a-z:]+://[A-Za-z0-9\.\-_:;=/@?,&]+'
