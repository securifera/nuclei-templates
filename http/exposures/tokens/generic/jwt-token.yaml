id: jwt-token

info:
  name: JWT Token Disclosure
  author: Ice3man
  severity: unknown
  classification:
    cpe: cpe:2.3:a:jwt:jwt:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: jwt
    product: jwt
  tags: exposure,token,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - 'eyJ[a-zA-Z0-9]{10,}\.eyJ[a-zA-Z0-9]{10,}\.[a-zA-Z0-9_\-]{10,}'
