id: shoppable-token

info:
  name: Shoppable Service Auth Token
  author: philippedelteil
  severity: unknown
  reference:
    - https://ask.shoppable.com/knowledge/quick-start-api-guide
  classification:
    cpe: cpe:2.3:a:shoppable:shoppable:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: shoppable
    product: shoppable
  tags: exposure,shoppable,token,auth,service,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: shoppable
        cpe: cpe:2.3:a:shoppable:shoppable:*:*:*:*:*:*:*:*
        part: body
        words:
          - data-shoppable-auth-token
