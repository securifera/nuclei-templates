id: sonarqube-token

info:
  name: SonarQube Token Disclosure
  author: Ice3man
  severity: info
  reference:
    - https://docs.sonarqube.org/latest/user-guide/user-token/
  classification:
    cpe: cpe:2.3:a:sonarqube:sonarqube:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sonarqube
    product: sonarqube
  tags: exposure,token,sonarqube,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "sonar.{0,50}(?:\"|'|`)?[0-9a-f]{40}(?:\"|'|`)?"
