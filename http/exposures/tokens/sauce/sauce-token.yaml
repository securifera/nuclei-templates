id: sauce-token

info:
  name: Sauce Token
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/sauce.yml
    - https://docs.saucelabs.com/dev/api/
  classification:
    cpe: cpe:2.3:a:sauce:sauce:*:*:*:*:*:*:*:*
    cwe-id: CWE-522,CWE-540
  metadata:
    verified: true
    max-request: 1
    vendor: sauce
    product: sauce
  tags: sauce,token,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - '(?i)sauce.{0,50}\b([a-f0-9-]{36})\b'
