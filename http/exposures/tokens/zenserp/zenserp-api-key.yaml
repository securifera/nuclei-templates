id: zenserp-api-key

info:
  name: Zenserp Api Key
  author: ritikchaddha
  severity: high
  reference:
    - https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/zenserp/zenserp.go
  classification:
    cpe: cpe:2.3:a:zenserp:zenserp:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: zenserp
    product: zenserp
  tags: exposure,token,zenserp,apikey,vuln

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: body
        name: token
        cpe: cpe:2.3:a:zenserp:zenserp:*:*:*:*:*:*:*:*
        regex:
          - '([0-9a-z-]{36})'
        internal: true

  - raw:
      - |
        @Host: https://app.zenserp.com:443
        GET /api/v2/status HTTP/1.1
        Host: app.zenserp.com
        Apikey: {{token}}

    disable-path-automerge: true
    matchers:
      - type: dsl
        name: zenserp
        cpe: cpe:2.3:a:zenserp:zenserp:*:*:*:*:*:*:*:*
        dsl:
          - status_code == 200
          - contains(content_type, 'application/json')
          - contains(body, 'remaining_requests')
        condition: and

    extractors:
      - type: dsl
        dsl:
          - token
