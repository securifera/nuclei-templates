id: openapi

info:
  name: OpenAPI - Detect
  author: pdteam,ynnirc
  severity: info
  description: OpenAPI was detected.
  reference:
    - https://www.openapis.org/
  classification:
    cpe: cpe:2.3:a:openapi:openapi:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: openapi
    product: openapi
  tags: exposure,api,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/openapi.json"

    matchers-condition: and
    matchers:
      - type: word
        name: openapi
        cpe: cpe:2.3:a:openapi:openapi:*:*:*:*:*:*:*:*
        words:
          - openapi
          - paths
        condition: and

      - type: word
        name: openapi-2
        cpe: cpe:2.3:a:openapi:openapi:*:*:*:*:*:*:*:*
        part: header
        words:
          - application/openapi+json
          - application/json
        condition: or

      - type: status
        status:
          - 200
