id: backup-directory-listing

info:
  name: Backup Directory Listing - Detect
  author: DhiyaneshDK
  severity: low
  description: |
    Backup Directory Listing folder was detected.
  reference:
    - https://www.invicti.com/learn/directory-listing/
    - https://hackerone.com/reports/684838
  classification:
    cpe: cpe:2.3:a:backup-directory-listing:backup-directory-listing:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: backup-directory-listing
    product: backup-directory-listing
  tags: hackerone,backups,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/backup/"
      - "{{BaseURL}}/php/backup/"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        name: backup-directory-listing
        cpe: cpe:2.3:a:backup-directory-listing:backup-directory-listing:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "Index of .*/backup"

      - type: status
        status:
          - 200
