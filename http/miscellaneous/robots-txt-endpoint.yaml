id: robots-txt-endpoint

info:
  name: robots.txt endpoint prober
  author: CasperGN,pdteam,TheZakMan
  severity: info
  classification:
    cpe: cpe:2.3:a:robots-txt-endpoint:robots-txt-endpoint:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    vendor: robots-txt-endpoint
    product: robots-txt-endpoint
  tags: miscellaneous,misc,generic,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/robots.txt"

    extractors:
      - type: regex
        name: endpoints
        group: 1
        regex:
          - '(?i:(?:Allow|Disallow):\s*(/[\.a-zA-Z0-9/_-]+/?))'

    matchers-condition: and
    matchers:
      - type: word
        name: robots-txt-endpoint
        cpe: cpe:2.3:a:robots-txt-endpoint:robots-txt-endpoint:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'User-agent:'

      - type: word
        name: robots-txt-endpoint-2
        cpe: cpe:2.3:a:robots-txt-endpoint:robots-txt-endpoint:*:*:*:*:*:*:*:*
        part: content_type
        words:
          - text/plain

      - type: status
        status:
          - 200
