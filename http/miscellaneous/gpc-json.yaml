id: gpc-json

info:
  name: Global Privacy Control (GPC) File Disclosure
  author: MihhailSokolov
  severity: info
  description: |
    The website defines a Global Privacy Control policy.
  classification:
    cpe: cpe:2.3:a:gpc:gpc:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: gpc
    product: gpc
  tags: miscellaneous,misc,generic,gpc,vuln

http:
  - method: GET
    path:
      - "{{RootURL}}/.well-known/gpc.json"
      - "{{RootURL}}/gpc.json"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: gpc
        cpe: cpe:2.3:a:gpc:gpc:*:*:*:*:*:*:*:*
        words:
          - '"gpc"'

      - type: status
        status:
          - 200

      - type: dsl
        name: gpc-2
        cpe: cpe:2.3:a:gpc:gpc:*:*:*:*:*:*:*:*
        dsl:
          - "len(body) <= 1024 && len(body) > 0"

    extractors:
      - type: json
        part: body
        name: gpc-version
        json:
          - ".version?"
