id: seized-site

info:
  name: Seized Site
  author: rxerium
  severity: info
  description: |
    This website has been seized by law enforcement
  classification:
    cpe: cpe:2.3:a:seized:seized:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    shodan-query: title:"THIS WEBSITE HAS BEEN SEIZED"
    vendor: seized
    product: seized
  tags: seized,miscellaneous,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: seized
        cpe: cpe:2.3:a:seized:seized:*:*:*:*:*:*:*:*
        part: body
        words:
          - "THIS WEBSITE HAS BEEN SEIZED"
          - "This domain has been seized by the Federal Bureau of Investigation"
        case-insensitive: true
        condition: or

      - type: status
        status:
          - 200
