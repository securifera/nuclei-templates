id: form-detection

info:
  name: Form Detection
  author: pdteam
  severity: info
  description: |
    A template to detect HTML Forms in page response.
  reference:
    - https://github.com/dirtycoder0124/formcrawler
  classification:
    cpe: cpe:2.3:a:form:form:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: form
    product: form
  tags: form,misc,miscellaneous,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2

    matchers:
      - type: word
        name: form
        cpe: cpe:2.3:a:form:form:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<form"
          - "</form>"
          - "<button"
        condition: and
