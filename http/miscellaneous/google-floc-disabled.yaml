id: google-floc-disabled

info:
  name: Google FLoC Disabled
  author: geeknik
  severity: info
  description: The detected website has decided to explicitly exclude itself from Google FLoC tracking.
  reference:
    - https://www.bleepingcomputer.com/news/security/github-disables-google-floc-user-tracking-on-its-website/
  classification:
    cpe: cpe:2.3:a:google:google:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: google
  tags: miscellaneous,google,floc,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: google
        cpe: cpe:2.3:a:google:google:*:*:*:*:*:*:*:*
        part: header
        words:
          - "interest-cohort=()"
