id: dnt-policy-detect

info:
  name: DNT Policy Declaration
  author: rxerium
  severity: info
  classification:
    cpe: cpe:2.3:a:dnt:policy:*:*:*:*:*:*:*:*
  description: |
    Detects a Do not Track policy.
  reference:
    - https://www.freeprivacypolicy.com/blog/privacy-policy-do-not-track-dnt/
  metadata:
    vendor: dnt
    product: policy
  tags: privacy,dnt,detect,compliance,policy,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/dnt-policy.txt"

    matchers-condition: and
    matchers:
      - type: word
        name: policy
        cpe: cpe:2.3:a:dnt:policy:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Do not track"
          - "Policy"
          - "Compliance"
        condition: and

      - type: status
        status:
          - 200
