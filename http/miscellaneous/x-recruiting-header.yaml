id: x-recruiting-header

info:
  name: X-Recruiting Header
  author: geeknik
  severity: info
  description: Websites that advertise jobs via HTTP headers
  reference:
    - https://webtechsurvey.com/response-header/x-recruiting
  classification:
    cpe: cpe:2.3:a:x-recruiting-header:x-recruiting-header:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "X-Recruiting:"
    vendor: x-recruiting-header
    product: x-recruiting-header
  tags: miscellaneous,misc,hiring,jobs,employment,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    matchers:
      - type: word
        name: x-recruiting-header
        cpe: cpe:2.3:a:x-recruiting-header:x-recruiting-header:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'X-Recruiting:'

    extractors:
      - type: dsl
        dsl:
          - 'x_recruiting'
