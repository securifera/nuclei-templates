id: http-trace

info:
  name: HTTP TRACE method enabled
  author: nodauf
  severity: info
  reference:
    - https://www.blackhillsinfosec.com/three-minutes-with-the-http-trace-method/
  classification:
    cpe: cpe:2.3:a:http-trace:http-trace:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: http-trace
    product: http-trace
  tags: miscellaneous,misc,generic,vuln

http:
  - method: TRACE
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: trace-request
        cpe: cpe:2.3:a:http-trace:http-trace:*:*:*:*:*:*:*:*
        part: body
        words:
          - "TRACE / HTTP"

  - method: OPTIONS
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        name: options-request
        cpe: cpe:2.3:a:http-trace:http-trace:*:*:*:*:*:*:*:*
        part: header
        regex:
          - "(?i)Allow: [A-Z,]*TRACE"
