id: clientaccesspolicy

info:
  name: Silverlight cross-domain policy
  author: emadshanab
  severity: info
  classification:
    cpe: cpe:2.3:a:clientaccesspolicy:clientaccesspolicy:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: clientaccesspolicy
    product: clientaccesspolicy
  tags: miscellaneous,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/clientaccesspolicy.xml"

    matchers-condition: and
    matchers:
      - type: word
        name: clientaccesspolicy
        cpe: cpe:2.3:a:clientaccesspolicy:clientaccesspolicy:*:*:*:*:*:*:*:*
        words:
          - "<access-policy>"
          - "<cross-domain-access>"
          - "domain uri="
        condition: and

      - type: status
        status:
          - 200
