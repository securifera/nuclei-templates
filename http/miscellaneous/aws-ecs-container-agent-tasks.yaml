id: aws-ecs-container-agent-tasks

info:
  name: aws-ecs-container-agent-tasks
  author: dogasantos
  severity: info
  description: Aws container metadata content
  reference:
    - https://docs.aws.amazon.com/en_us/elasticbeanstalk/latest/dg/create_deploy_docker_ecstutorial.html#create_deploy_docker_ecstutorial_connect_inspect
  classification:
    cpe: cpe:2.3:a:aws:aws:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: aws
    product: aws
  tags: miscellaneous,aws,docker,ec2,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/metadata"
      - "{{BaseURL}}/v1/tasks"

    matchers-condition: and
    matchers:
      - type: word
        name: aws
        cpe: cpe:2.3:a:aws:aws:*:*:*:*:*:*:*:*
        words:
          - "arn:aws:ecs"

      - type: status
        status:
          - 200
