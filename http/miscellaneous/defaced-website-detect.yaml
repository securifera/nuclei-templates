id: defaced-website-detect

info:
  name: Defaced Website - Detection
  author: ggranjus
  severity: info
  description: The detected website is defaced.
  classification:
    cpe: cpe:2.3:a:defaced-website:defaced-website:*:*:*:*:*:*:*:*
  metadata:
    verified: 'true'
    max-request: 1
    shodan-query: http.title:"Hacked By"
    vendor: defaced-website
    product: defaced-website
  tags: miscellaneous,defacement,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        name: defaced-website
        cpe: cpe:2.3:a:defaced-website:defaced-website:*:*:*:*:*:*:*:*
        part: body
        regex:
          - '(?i)<title>.*Hacked( By .+)?<\/title>'

    extractors:
      - type: xpath
        xpath:
          - '/html/head/title'
