id: robots-txt

info:
  name: robots.txt file
  author: CasperGN,TheZakMan
  severity: info
  classification:
    cpe: cpe:2.3:a:robots-txt:robots-txt:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: robots-txt
    product: robots-txt
  tags: miscellaneous,misc,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/robots.txt"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: robots-txt
        cpe: cpe:2.3:a:robots-txt:robots-txt:*:*:*:*:*:*:*:*
        words:
          - 'Allow:'
          - 'Disallow:'
          - 'Sitemap:'
          - 'User-agent:'

      - type: word
        name: robots-txt-2
        cpe: cpe:2.3:a:robots-txt:robots-txt:*:*:*:*:*:*:*:*
        part: content_type
        words:
          - text/plain

      - type: status
        status:
          - 200
