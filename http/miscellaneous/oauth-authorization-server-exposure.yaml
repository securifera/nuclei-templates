id: oauth-authorization-server-exposure

info:
  name: Well-Known OAuth Authorization Server Metadata
  author: rxerium
  severity: info
  description: |
    Detects OAuth 2.0 Authorization Server metadata (RFC 8414).
  impact: |
    Presence of this well-known resource can expose implementation details or policies.
  reference:
    - https://www.rfc-editor.org/rfc/rfc8414
  classification:
    cpe: cpe:2.3:a:oauth:oauth:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    google-query: inurl:"/.well-known/oauth-authorization-server"
    vendor: oauth
    product: oauth
  tags: well-known,oauth,oidc,security,rfc8414,miscellaneous,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/oauth-authorization-server"

    matchers-condition: and
    matchers:
      - type: word
        name: oauth
        cpe: cpe:2.3:a:oauth:oauth:*:*:*:*:*:*:*:*
        part: body
        words:
          - "issuer"
          - "authorization_endpoint"
        condition: and

      - type: status
        status:
          - 200
