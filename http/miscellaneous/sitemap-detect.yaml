id: sitemap-detect

info:
  name: Sitemap Detection
  author: houdinis
  severity: info
  description: |
    A sitemap is a file where you provide information about the pages, videos, and other files on your site, and the relationships between them.
  classification:
    cpe: cpe:2.3:a:sitemap:sitemap:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    google-query: intext:"sitemap" filetype:txt,filetype:xml inurl:sitemap,inurl:"/sitemap.xsd" ext:xsd
    vendor: sitemap
    product: sitemap
  tags: miscellaneous,misc,generic,sitemap,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/sitemap.xsl"
      - "{{BaseURL}}/sitemap.xsd"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: sitemap
        cpe: cpe:2.3:a:sitemap:sitemap:*:*:*:*:*:*:*:*
        words:
          - "sitemap>"
        case-insensitive: true

      - type: word
        name: sitemap-2
        cpe: cpe:2.3:a:sitemap:sitemap:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'application/xml'

      - type: status
        status:
          - 200
