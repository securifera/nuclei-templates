id: old-copyright

info:
  name: Find Pages with Old Copyright Dates
  author: geeknik
  severity: info
  classification:
    cpe: cpe:2.3:a:old-copyright:old-copyright:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: old-copyright
    product: old-copyright
  tags: miscellaneous,misc,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        name: old-copyright
        cpe: cpe:2.3:a:old-copyright:old-copyright:*:*:*:*:*:*:*:*
        part: body
        words:
          - '2026'
        negative: true

      - type: regex
        name: old-copyright-2
        cpe: cpe:2.3:a:old-copyright:old-copyright:*:*:*:*:*:*:*:*
        part: body
        regex:
          - 'Copyright [1-9]\d* ?\-? ?[1-9]?\d*'
          - '© [1-9]\d* ?\-? ?[1-9]?\d*'
          - '&copy; [1-9]\d* ?\-? ?[1-9]?\d*'
          - '&#169; [1-9]\d* ?\-? ?[1-9]?\d*'

    extractors:
      - type: regex
        part: body
        regex:
          - 'Copyright [1-9]\d* ?\-? ?[1-9]?\d*'
          - '© [1-9]\d* ?\-? ?[1-9]?\d*'
          - '&copy; [1-9]\d* ?\-? ?[1-9]?\d*'
          - '&#169; [1-9]\d* ?\-? ?[1-9]?\d*'
