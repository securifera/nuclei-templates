id: joomla-htaccess-file

info:
  name: Joomla! htaccess file disclosure
  author: oppsec
  severity: info
  description: Joomla!  has an htaccess file to store configurations about HTTP config, directory listing, etc.
  classification:
    cpe: cpe:2.3:a:joomla:joomla:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: joomla
    product: joomla
  tags: miscellaneous,misc,joomla,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/htaccess.txt"

    matchers-condition: and
    matchers:
      - type: word
        name: joomla
        cpe: cpe:2.3:a:joomla:joomla:*:*:*:*:*:*:*:*
        words:
          - "Joomla"
          - "Open Source Matters. All rights reserved"
        condition: and

      - type: word
        name: joomla-2
        cpe: cpe:2.3:a:joomla:joomla:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/plain"

      - type: status
        status:
          - 200
