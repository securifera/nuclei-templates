id: htaccess-config

info:
  name: HTaccess config file
  author: Yash Anand @yashanand155
  severity: info
  classification:
    cpe: cpe:2.3:a:htaccess-config:htaccess-config:*:*:*:*:*:*:*:*
  metadata:
    max-request: 6
    vendor: htaccess-config
    product: htaccess-config
  tags: miscellaneous,misc,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.htaccess"
      - "{{BaseURL}}/example.htaccess"
      - "{{BaseURL}}/_.htaccess"
      - "{{BaseURL}}/sample.htaccess"
      - "{{BaseURL}}/a.htaccess"
      - "{{BaseURL}}/htaccess_for_page_not_found_redirects.htaccess"

    stop-at-first-match: true
    matchers:
      - type: word
        name: htaccess-config
        cpe: cpe:2.3:a:htaccess-config:htaccess-config:*:*:*:*:*:*:*:*
        words:
          - RewriteRule
          - </IfModule>
          - <IfModule
        condition: and
