id: xml-schema-detect

info:
  name: XML Schema Detection
  author: alph4byt3
  severity: info
  classification:
    cpe: cpe:2.3:a:xml-schema:xml-schema:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: xml-schema
    product: xml-schema
  tags: miscellaneous,misc,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/schema"

    matchers-condition: and
    host-redirects: true
    matchers:
      - type: word
        name: xml-schema
        cpe: cpe:2.3:a:xml-schema:xml-schema:*:*:*:*:*:*:*:*
        words:
          - ".xsd"
          - "Schemas"
        condition: and

      - type: status
        status:
          - 200
