id: tilda-takeover

info:
  name: tilda takeover detection
  author: pdteam
  severity: high
  description: Tilda takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/155
  classification:
    cpe: cpe:2.3:a:tilda:tilda:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: tilda
    product: tilda
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: tilda
        cpe: cpe:2.3:a:tilda:tilda:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: tilda-2
        cpe: cpe:2.3:a:tilda:tilda:*:*:*:*:*:*:*:*
        words:
          - Please go to the site settings and put the domain name in the Domain tab.

      - type: word
        name: tilda-3
        cpe: cpe:2.3:a:tilda:tilda:*:*:*:*:*:*:*:*
        words:
          - "<title>Please renew your subscription</title>"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - cname
