id: agilecrm-takeover

info:
  name: AgileCRM Takeover Detection
  author: pdteam
  severity: high
  description: agilecrm subdomain takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/145
  classification:
    cpe: cpe:2.3:a:agilecrm:agilecrm:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: agilecrm
    product: agilecrm
  tags: takeover,agilecrm,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: agilecrm
        cpe: cpe:2.3:a:agilecrm:agilecrm:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: agilecrm-2
        cpe: cpe:2.3:a:agilecrm:agilecrm:*:*:*:*:*:*:*:*
        words:
          - Sorry, this page is no longer available.

    extractors:
      - type: dsl
        dsl:
          - cname
