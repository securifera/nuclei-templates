id: pagewiz-takeover

info:
  name: Pagewiz subdomain takeover
  author: brabbit10
  severity: high
  description: Pagewiz takeover was detected.
  reference:
    - https://help.pagewiz.com/hc/en-us/articles/115005391465-Page-URL
  classification:
    cpe: cpe:2.3:a:pagewiz:pagewiz:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: pagewiz
    product: pagewiz
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: pagewiz
        cpe: cpe:2.3:a:pagewiz:pagewiz:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: pagewiz-2
        cpe: cpe:2.3:a:pagewiz:pagewiz:*:*:*:*:*:*:*:*
        words:
          - '404 - Page Not Found'
          - 'Start Your New Landing Page Now!'
          - 'pagewiz'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname
