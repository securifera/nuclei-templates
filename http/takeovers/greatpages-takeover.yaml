id: greatpages-takeover

info:
  name: GreatPages - Takeover Detection
  author: juliosmelo
  severity: high
  description: |
    Detects potential subdomain takeover on GreatPages.com.br by identifying the default error message shown on unclaimed pages.
  reference:
    - https://greatpages.com.br
  classification:
    cpe: cpe:2.3:a:greatpages:greatpages:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    fofa-query: cname="cname.greatpages.com.br"
    max-request: 1
    vendor: greatpages
    product: greatpages
  tags: takeover,greatpages,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: greatpages
        cpe: cpe:2.3:a:greatpages:greatpages:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: greatpages-2
        cpe: cpe:2.3:a:greatpages:greatpages:*:*:*:*:*:*:*:*
        words:
          - "Página não encontrada (Erro 404)"

    extractors:
      - type: dsl
        dsl:
          - cname
