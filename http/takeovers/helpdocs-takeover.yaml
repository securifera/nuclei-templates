id: helpdocs-takeover

info:
  name: HelpDocs Takeover Detection
  author: philippedelteil
  severity: high
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/402
  classification:
    cpe: cpe:2.3:a:helpdocs:helpdocs:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: helpdocs
    product: helpdocs
  tags: takeover,helpdocs,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: dsl
        name: helpdocs
        cpe: cpe:2.3:a:helpdocs:helpdocs:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: helpdocs-2
        cpe: cpe:2.3:a:helpdocs:helpdocs:*:*:*:*:*:*:*:*
        part: body
        words:
          - "You've tried to access an account/page that does not exist"

    extractors:
      - type: dsl
        dsl:
          - cname
