id: zendesk-takeover

info:
  name: Zendesk Takeover Detection
  author: pdteam
  severity: high
  description: Zendesk takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/23
    - https://hackerone.com/reports/869605
    - https://hackerone.com/reports/759454
  classification:
    cpe: cpe:2.3:a:zendesk:zendesk:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: zendesk
    product: zendesk
  tags: takeover,zendesk,hackerone,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: zendesk
        cpe: cpe:2.3:a:zendesk:zendesk:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: zendesk-2
        cpe: cpe:2.3:a:zendesk:zendesk:*:*:*:*:*:*:*:*
        words:
          - "this help centre no longer exists"
          - "Help Centre Closed"
        case-insensitive: true
        condition: or

    extractors:
      - type: dsl
        dsl:
          - cname
