id: anima-takeover

info:
  name: Anima Takeover Detection
  author: pdteam
  severity: high
  description: Anima takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/126
  classification:
    cpe: cpe:2.3:a:anima:anima:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: anima
    product: anima
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: anima
        cpe: cpe:2.3:a:anima:anima:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: anima-2
        cpe: cpe:2.3:a:anima:anima:*:*:*:*:*:*:*:*
        words:
          - "If this is your website and you've just created it, try refreshing in a minute"

    extractors:
      - type: dsl
        dsl:
          - cname
