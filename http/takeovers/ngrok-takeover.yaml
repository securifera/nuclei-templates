id: ngrok-takeover

info:
  name: Ngrok Takeover Detection
  author: pdteam
  severity: high
  description: Ngrok takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/92
  classification:
    cpe: cpe:2.3:a:ngrok:ngrok:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ngrok
    product: ngrok
  tags: takeover,ngrok,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: ngrok
        cpe: cpe:2.3:a:ngrok:ngrok:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: ngrok-2
        cpe: cpe:2.3:a:ngrok:ngrok:*:*:*:*:*:*:*:*
        words:
          - ngrok.io not found
          - Tunnel *.ngrok.io not found

    extractors:
      - type: dsl
        dsl:
          - cname
