id: bigcartel-takeover

info:
  name: Bigcartel Takeover Detection
  author: pdteam
  severity: high
  description: Bigcartel takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/158
  classification:
    cpe: cpe:2.3:a:bigcartel:bigcartel:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: bigcartel
    product: bigcartel
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: bigcartel
        cpe: cpe:2.3:a:bigcartel:bigcartel:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: bigcartel-2
        cpe: cpe:2.3:a:bigcartel:bigcartel:*:*:*:*:*:*:*:*
        words:
          - "<h1>Oops! We couldn&#8217;t find that page.</h1>"

      - type: dsl
        name: bigcartel-3
        cpe: cpe:2.3:a:bigcartel:bigcartel:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"bigcartel.com")'

    extractors:
      - type: dsl
        dsl:
          - cname
