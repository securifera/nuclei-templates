id: aha-takeover

info:
  name: Aha - Subdomain Takeover Detection
  author: pdteam
  severity: high
  description: An Aha subdomain takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:aha:aha:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: aha
    product: aha
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: aha
        cpe: cpe:2.3:a:aha:aha:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: aha-2
        cpe: cpe:2.3:a:aha:aha:*:*:*:*:*:*:*:*
        words:
          - There is no portal here ... sending you back to Aha!

    extractors:
      - type: dsl
        dsl:
          - cname
