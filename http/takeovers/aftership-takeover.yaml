id: aftership-takeover

info:
  name: Aftership - Subdomain Takeover Detection
  author: pdteam
  severity: high
  description: Aftership subdomain takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:aftership:aftership:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: aftership
    product: aftership
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: aftership
        cpe: cpe:2.3:a:aftership:aftership:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: aftership-2
        cpe: cpe:2.3:a:aftership:aftership:*:*:*:*:*:*:*:*
        words:
          - Oops.</h2><p class="text-muted text-tight">The page you're looking for doesn't exist.

    extractors:
      - type: dsl
        dsl:
          - cname
