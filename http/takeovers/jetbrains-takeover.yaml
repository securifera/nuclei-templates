id: jetbrains-takeover

info:
  name: Jetbrains Takeover Detection
  author: pdteam
  severity: high
  description: Jetbrains takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/pull/107
  classification:
    cpe: cpe:2.3:a:jetbrains:jetbrains:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: jetbrains
    product: jetbrains
  tags: takeover,jetbrains,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: jetbrains
        cpe: cpe:2.3:a:jetbrains:jetbrains:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: jetbrains-2
        cpe: cpe:2.3:a:jetbrains:jetbrains:*:*:*:*:*:*:*:*
        words:
          - is not a registered InCloud YouTrack.

    extractors:
      - type: dsl
        dsl:
          - cname
