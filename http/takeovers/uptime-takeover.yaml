id: uptime-takeover

info:
  name: Uptime Takeover Detection
  author: philippedelteil
  severity: high
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/368
  classification:
    cpe: cpe:2.3:a:uptime:uptime:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: uptime
    product: uptime
  tags: takeover,uptime,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: uptime
        cpe: cpe:2.3:a:uptime:uptime:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: uptime-2
        cpe: cpe:2.3:a:uptime:uptime:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<html><body>You are being <a href="https://uptime.betterstack.com">redirected</a>.</body></html>'

      - type: status
        status:
          - 302

    extractors:
      - type: dsl
        dsl:
          - cname
