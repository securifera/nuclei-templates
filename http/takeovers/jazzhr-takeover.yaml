id: jazzhr-takeover

info:
  name: jazzhr takeover detection
  author: pdteam
  severity: high
  description: jazzhr takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:jazzhr:jazzhr:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: jazzhr
    product: jazzhr
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: jazzhr
        cpe: cpe:2.3:a:jazzhr:jazzhr:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: jazzhr-2
        cpe: cpe:2.3:a:jazzhr:jazzhr:*:*:*:*:*:*:*:*
        words:
          - This account no longer active

    extractors:
      - type: dsl
        dsl:
          - cname
