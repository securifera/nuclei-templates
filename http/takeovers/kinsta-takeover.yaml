id: kinsta-takeover

info:
  name: kinsta takeover detection
  author: pdteam
  severity: high
  description: kinsta takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:kinsta:kinsta:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kinsta
    product: kinsta
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: kinsta
        cpe: cpe:2.3:a:kinsta:kinsta:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: kinsta-2
        cpe: cpe:2.3:a:kinsta:kinsta:*:*:*:*:*:*:*:*
        words:
          - No Site For Domain

    extractors:
      - type: dsl
        dsl:
          - cname
