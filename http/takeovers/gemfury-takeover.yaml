id: gemfury-takeover

info:
  name: Gemfury Takeover Detection
  author: pdteam,daffainfo
  severity: high
  description: Gemfury takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/154
  classification:
    cpe: cpe:2.3:a:gemfury:gemfury:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: gemfury
    product: gemfury
  tags: takeover,gemfury,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 1

    matchers-condition: and
    matchers:
      - type: dsl
        name: gemfury
        cpe: cpe:2.3:a:gemfury:gemfury:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: gemfury-2
        cpe: cpe:2.3:a:gemfury:gemfury:*:*:*:*:*:*:*:*
        part: header
        words:
          - "Location: https://gemfury.com/404"

    extractors:
      - type: dsl
        dsl:
          - cname
