id: airee-takeover

info:
  name: Airee Takeover Detection
  author: pdteam
  severity: high
  description: Airee takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/104
  classification:
    cpe: cpe:2.3:a:airee:airee:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: airee
    product: airee
  tags: takeover,airee,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: airee
        cpe: cpe:2.3:a:airee:airee:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: airee
        cpe: cpe:2.3:a:airee:airee:*:*:*:*:*:*:*:*
        words:
          - 'Ошибка 402. Сервис Айри.рф не оплачен'

    extractors:
      - type: dsl
        dsl:
          - cname
