id: surveysparrow-takeover

info:
  name: SurveySparrow takeover detection
  author: philippedelteil
  severity: high
  description: SurveySparrow takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/281
  classification:
    cpe: cpe:2.3:a:surveysparrow:surveysparrow:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: surveysparrow
    product: surveysparrow
  tags: takeover,surveysparrow,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: surveysparrow
        cpe: cpe:2.3:a:surveysparrow:surveysparrow:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: surveysparrow-2
        cpe: cpe:2.3:a:surveysparrow:surveysparrow:*:*:*:*:*:*:*:*
        words:
          - "Account not found."
          - "ouch!"
          - "SurveySparrow"
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname
