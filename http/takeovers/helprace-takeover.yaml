id: helprace-takeover

info:
  name: Helprace Takeover Detection
  author: pdteam
  severity: high
  description: Helprace takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/115
  classification:
    cpe: cpe:2.3:a:helprace:helprace:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: helprace
    product: helprace
  tags: takeover,helprace,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: helprace
        cpe: cpe:2.3:a:helprace:helprace:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: helprace-2
        cpe: cpe:2.3:a:helprace:helprace:*:*:*:*:*:*:*:*
        words:
          - "Alias not configured!"
          - "Admin of this Helprace account needs to set up domain alias"

    extractors:
      - type: dsl
        dsl:
          - cname
