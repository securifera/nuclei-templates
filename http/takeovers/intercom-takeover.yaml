id: intercom-takeover

info:
  name: Intercom Takeover Detection
  author: pdteam
  severity: high
  description: Intercom takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/69
  classification:
    cpe: cpe:2.3:a:intercom:intercom:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: intercom
    product: intercom
  tags: takeover,intercom,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: intercom
        cpe: cpe:2.3:a:intercom:intercom:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: intercom-2
        cpe: cpe:2.3:a:intercom:intercom:*:*:*:*:*:*:*:*
        words:
          - '<h1 class="headline">Uh oh. That page doesn\’t exist.</h1>'
          - 'This page is reserved for artistic dogs.'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname
