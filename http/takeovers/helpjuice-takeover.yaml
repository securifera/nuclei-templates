id: helpjuice-takeover

info:
  name: helpjuice takeover detection
  author: pdteam
  severity: high
  description: helpjuice takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:helpjuice:helpjuice:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: helpjuice
    product: helpjuice
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: helpjuice
        cpe: cpe:2.3:a:helpjuice:helpjuice:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: helpjuice-2
        cpe: cpe:2.3:a:helpjuice:helpjuice:*:*:*:*:*:*:*:*
        words:
          - We could not find what you're looking for.

    extractors:
      - type: dsl
        dsl:
          - cname
