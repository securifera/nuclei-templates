id: surge-takeover

info:
  name: surge takeover detection
  author: pdteam
  severity: high
  description: surge takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/198
  classification:
    cpe: cpe:2.3:a:surge:surge:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: surge
    product: surge
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: surge
        cpe: cpe:2.3:a:surge:surge:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: surge-2
        cpe: cpe:2.3:a:surge:surge:*:*:*:*:*:*:*:*
        words:
          - project not found

      - type: status
        status:
          - 404

    extractors:
      - type: dsl
        dsl:
          - cname
