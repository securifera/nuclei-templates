id: surveygizmo-takeover

info:
  name: surveygizmo takeover detection
  author: pdteam
  severity: high
  description: surveygizmo takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:surveygizmo:surveygizmo:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: surveygizmo
    product: surveygizmo
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: surveygizmo
        cpe: cpe:2.3:a:surveygizmo:surveygizmo:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: surveygizmo-2
        cpe: cpe:2.3:a:surveygizmo:surveygizmo:*:*:*:*:*:*:*:*
        words:
          - data-html-name

    extractors:
      - type: dsl
        dsl:
          - cname
