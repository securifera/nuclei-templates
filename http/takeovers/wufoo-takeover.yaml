id: wufoo-takeover

info:
  name: wufoo takeover detection
  author: pdteam
  severity: high
  description: wufoo takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:wufoo:wufoo:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wufoo
    product: wufoo
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: wufoo
        cpe: cpe:2.3:a:wufoo:wufoo:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: wufoo-2
        cpe: cpe:2.3:a:wufoo:wufoo:*:*:*:*:*:*:*:*
        words:
          - Profile not found
          - Hmmm....something is not right.
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname
