id: uservoice-takeover

info:
  name: Uservoice Takeover Detection
  author: MiryangJung
  severity: high
  description: Uservoice takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/163
    - https://hackerone.com/reports/269109
  classification:
    cpe: cpe:2.3:a:uservoice:uservoice:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: uservoice
    product: uservoice
  tags: takeover,uservoice,hackerone,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: uservoice
        cpe: cpe:2.3:a:uservoice:uservoice:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: uservoice-2
        cpe: cpe:2.3:a:uservoice:uservoice:*:*:*:*:*:*:*:*
        words:
          - "This UserVoice subdomain is currently available!"

    extractors:
      - type: dsl
        dsl:
          - cname
