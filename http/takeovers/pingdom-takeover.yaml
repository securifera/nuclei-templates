id: pingdom-takeover

info:
  name: Pingdom Takeover Detection
  author: pdteam
  severity: high
  description: Pingdom takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/144
  classification:
    cpe: cpe:2.3:a:pingdom:pingdom:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: pingdom
    product: pingdom
  tags: takeover,pingdom,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: pingdom
        cpe: cpe:2.3:a:pingdom:pingdom:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: pingdom-2
        cpe: cpe:2.3:a:pingdom:pingdom:*:*:*:*:*:*:*:*
        words:
          - Public Report Not Activated
          - This public report page has not been activated by the user

    extractors:
      - type: dsl
        dsl:
          - cname
