id: gitbook-takeover

info:
  name: gitbook takeover detection
  author: philippedelteil
  severity: high
  description: gitbook takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/259
    - https://hackerone.com/reports/223625
  classification:
    cpe: cpe:2.3:a:gitbook:gitbook:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: gitbook
    product: gitbook
  tags: takeover,gitbook,hackerone,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: gitbook
        cpe: cpe:2.3:a:gitbook:gitbook:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: gitbook-2
        cpe: cpe:2.3:a:gitbook:gitbook:*:*:*:*:*:*:*:*
        words:
          - "If you need specifics, here's the error"
          - "Domain not found"
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname
