id: cargo-takeover

info:
  name: cargo takeover detection
  author: pdteam
  severity: high
  description: cargo takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:cargo:cargo:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: cargo
    product: cargo
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: cargo
        cpe: cpe:2.3:a:cargo:cargo:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: cargo-2
        cpe: cpe:2.3:a:cargo:cargo:*:*:*:*:*:*:*:*
        words:
          - "If you're moving your domain away from Cargo you must make this configuration through your registrar's DNS control panel."

    extractors:
      - type: dsl
        dsl:
          - cname
