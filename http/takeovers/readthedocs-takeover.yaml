id: readthedocs-takeover

info:
  name: Read the Docs Takeover Detection
  author: pdteam
  severity: high
  description: Read the Docs takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/160
  classification:
    cpe: cpe:2.3:a:readthedocs:readthedocs:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: readthedocs
    product: readthedocs
  tags: takeover,readthedocs,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: readthedocs
        cpe: cpe:2.3:a:readthedocs:readthedocs:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: readthedocs-2
        cpe: cpe:2.3:a:readthedocs:readthedocs:*:*:*:*:*:*:*:*
        words:
          - unknown to Read the Docs

    extractors:
      - type: dsl
        dsl:
          - cname
