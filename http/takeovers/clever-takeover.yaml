id: clever-takeover

info:
  name: Clever Cloud - Subdomain Takeover Detection
  author: supr4s
  severity: high
  description: Clever Cloud subdomain takeover was detected.
  reference:
    - https://supras.io/new-subdomain-takeover-case-clever-cloud/
  classification:
    cpe: cpe:2.3:a:clever:clever:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: clever
    product: clever
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: clever
        cpe: cpe:2.3:a:clever:clever:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: clever-2
        cpe: cpe:2.3:a:clever:clever:*:*:*:*:*:*:*:*
        part: body
        words:
          - "The application you're trying to access doesn't seem to exist"
          - "support@clever-cloud.com"
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname
