id: proposify-takeover

info:
  name: proposify takeover detection
  author: pdteam
  severity: high
  description: proposify takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:proposify:proposify:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: proposify
    product: proposify
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: proposify
        cpe: cpe:2.3:a:proposify:proposify:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: proposify-2
        cpe: cpe:2.3:a:proposify:proposify:*:*:*:*:*:*:*:*
        words:
          - If you need immediate assistance, please contact <a href="mailto:support@proposify.biz

    extractors:
      - type: dsl
        dsl:
          - cname
