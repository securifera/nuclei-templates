id: vend-takeover

info:
  name: vend takeover detection
  author: pdteam
  severity: high
  description: vend takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:vend:vend:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: vend
    product: vend
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: vend
        cpe: cpe:2.3:a:vend:vend:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: vend-2
        cpe: cpe:2.3:a:vend:vend:*:*:*:*:*:*:*:*
        words:
          - Looks like you've traveled too far into cyberspace.

    extractors:
      - type: dsl
        dsl:
          - cname
