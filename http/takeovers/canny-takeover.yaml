id: canny-takeover

info:
  name: Canny Takeover Detection
  author: pdteam
  severity: high
  description: Canny takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/114
  classification:
    cpe: cpe:2.3:a:canny:canny:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: canny
    product: canny
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: canny
        cpe: cpe:2.3:a:canny:canny:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: canny-2
        cpe: cpe:2.3:a:canny:canny:*:*:*:*:*:*:*:*
        words:
          - 'Company Not Found'
          - 'There is no such company. Did you enter the right URL?'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname
