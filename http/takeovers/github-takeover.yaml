id: github-takeover

info:
  name: Github Takeover Detection
  author: pdteam,th3r4id
  severity: high
  description: Github takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:github:github:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: github
    product: github
  tags: takeover,github,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: github
        cpe: cpe:2.3:a:github:github:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: github-2
        cpe: cpe:2.3:a:github:github:*:*:*:*:*:*:*:*
        words:
          - "There isn't a GitHub Pages site here."
          - "For root URLs (like http://example.com/) you must provide an index.html file"
          - "The site configured at this address does not contain the requested file."
          - "For root URLs (like <code>http://example.com/</code>)"
        condition: or

      - type: dsl
        name: github-3
        cpe: cpe:2.3:a:github:github:*:*:*:*:*:*:*:*
        dsl:
          - '!contains(host,"githubapp.com")'
          - '!contains(host,"github.com")'
          - '!contains(host,"github.io")'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname
