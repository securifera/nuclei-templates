id: uptimerobot-takeover

info:
  name: uptimerobot takeover detection
  author: pdteam
  severity: low
  description: uptimerobot takeover was detected.
  reference:
    - https://exploit.linuxsec.org/uptimerobot-com-custom-domain-subdomain-takeover/
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/45
  classification:
    cpe: cpe:2.3:a:uptimerobot:uptimerobot:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: uptimerobot
    product: uptimerobot
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: uptimerobot
        cpe: cpe:2.3:a:uptimerobot:uptimerobot:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: regex
        name: uptimerobot-2
        cpe: cpe:2.3:a:uptimerobot:uptimerobot:*:*:*:*:*:*:*:*
        regex:
          - "^page not found$"

      - type: word
        name: uptimerobot-3
        cpe: cpe:2.3:a:uptimerobot:uptimerobot:*:*:*:*:*:*:*:*
        part: header
        words:
          - "Server: Caddy"
        case-insensitive: true

      - type: status
        status:
          - 404

    extractors:
      - type: dsl
        dsl:
          - cname
