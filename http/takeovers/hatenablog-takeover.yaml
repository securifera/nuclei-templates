id: hatenablog-takeover

info:
  name: Hatenablog Takeover Detection
  author: pdteam
  severity: high
  description: Hatenablog takeover was detected.
  reference:
    - https://beaglesecurity.com/blog/vulnerability/hatenablog-takeover-detection.html
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:hatenablog:hatenablog:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: hatenablog
    product: hatenablog
  tags: takeover,hatenablog,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: hatenablog
        cpe: cpe:2.3:a:hatenablog:hatenablog:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: hatenablog-2
        cpe: cpe:2.3:a:hatenablog:hatenablog:*:*:*:*:*:*:*:*
        words:
          - "404 Blog is not found"

    extractors:
      - type: dsl
        dsl:
          - cname
