id: smugmug-takeover

info:
  name: Smugmug Takeover Detection
  author: pdteam
  severity: high
  description: Smugmug takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/60
  classification:
    cpe: cpe:2.3:a:smugmug:smugmug:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: smugmug
    product: smugmug
  tags: takeover,smugmug,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: smugmug
        cpe: cpe:2.3:a:smugmug:smugmug:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: smugmug-2
        cpe: cpe:2.3:a:smugmug:smugmug:*:*:*:*:*:*:*:*
        words:
          - '{"text":"Page Not Found"'

    extractors:
      - type: dsl
        dsl:
          - cname
