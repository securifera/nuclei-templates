id: cargocollective-takeover

info:
  name: CargoCollective Takeover Detection
  author: pdteam
  severity: high
  description: CargoCollective takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/152
  classification:
    cpe: cpe:2.3:a:cargocollective:cargocollective:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: cargocollective
    product: cargocollective
  tags: takeover,cargocollective,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: cargocollective
        cpe: cpe:2.3:a:cargocollective:cargocollective:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: cargocollective-2
        cpe: cpe:2.3:a:cargocollective:cargocollective:*:*:*:*:*:*:*:*
        words:
          - '<div class="notfound">'
          - '404 Not Found<br>'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname
