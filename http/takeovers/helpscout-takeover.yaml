id: helpscout-takeover

info:
  name: helpscout takeover detection
  author: pdteam
  severity: high
  description: helpscout takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:helpscout:helpscout:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: helpscout
    product: helpscout
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: helpscout
        cpe: cpe:2.3:a:helpscout:helpscout:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: helpscout-2
        cpe: cpe:2.3:a:helpscout:helpscout:*:*:*:*:*:*:*:*
        words:
          - "No settings were found for this company:"

    extractors:
      - type: dsl
        dsl:
          - cname
