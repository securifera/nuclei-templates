id: simplebooklet-takeover

info:
  name: simplebooklet takeover detection
  author: pdteam
  severity: high
  description: simplebooklet takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:simplebooklet:simplebooklet:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: simplebooklet
    product: simplebooklet
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: simplebooklet
        cpe: cpe:2.3:a:simplebooklet:simplebooklet:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: simplebooklet-2
        cpe: cpe:2.3:a:simplebooklet:simplebooklet:*:*:*:*:*:*:*:*
        words:
          - We can't find this <a href="https://simplebooklet.com

    extractors:
      - type: dsl
        dsl:
          - cname
