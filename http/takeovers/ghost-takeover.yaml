id: ghost-takeover

info:
  name: ghost takeover detection
  author: pdteam
  severity: high
  description: ghost takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/89
  classification:
    cpe: cpe:2.3:a:ghost:ghost:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ghost
    product: ghost
  tags: takeover,ghost,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: ghost
        cpe: cpe:2.3:a:ghost:ghost:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: ghost-2
        cpe: cpe:2.3:a:ghost:ghost:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'error.ghost.org'
          - 'offline.ghost.org'
        condition: or

      - type: status
        status:
          - 302

    extractors:
      - type: dsl
        dsl:
          - cname
