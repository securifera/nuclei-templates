id: short-io-takeover

info:
  name: Short.io takeover detection
  author: philippedelteil
  severity: high
  description: Short.io takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/260
  classification:
    cpe: cpe:2.3:a:short-io:short-io:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: short-io
    product: short-io
  tags: takeover,short.io,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: short-io
        cpe: cpe:2.3:a:short-io:short-io:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: short-io-2
        cpe: cpe:2.3:a:short-io:short-io:*:*:*:*:*:*:*:*
        words:
          - "Link does not exist"
          - "This domain is not configured on Short.io"
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname
