id: frontify-takeover

info:
  name: frontify takeover detection
  author: pdteam
  severity: high
  description: frontify takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/170
  classification:
    cpe: cpe:2.3:a:frontify:frontify:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: frontify
    product: frontify
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: frontify
        cpe: cpe:2.3:a:frontify:frontify:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: frontify-2
        cpe: cpe:2.3:a:frontify:frontify:*:*:*:*:*:*:*:*
        words:
          - 404 - Page Not Found
          - Oops… looks like you got lost
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname
