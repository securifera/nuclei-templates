id: getresponse-takeover

info:
  name: Getresponse Takeover Detection
  author: pdteam
  severity: high
  description: Getresponse takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/235
  classification:
    cpe: cpe:2.3:a:getresponse:getresponse:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: getresponse
    product: getresponse
  tags: takeover,getresponse,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: getresponse
        cpe: cpe:2.3:a:getresponse:getresponse:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: getresponse-2
        cpe: cpe:2.3:a:getresponse:getresponse:*:*:*:*:*:*:*:*
        words:
          - 'With GetResponse Landing Pages, lead generation has never been easier'

    extractors:
      - type: dsl
        dsl:
          - cname
