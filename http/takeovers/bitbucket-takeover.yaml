id: bitbucket-takeover

info:
  name: Bitbucket Takeover Detection
  author: pdteam
  severity: high
  description: Bitbucket takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:bitbucket:bitbucket:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: bitbucket
    product: bitbucket
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: bitbucket
        cpe: cpe:2.3:a:bitbucket:bitbucket:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: bitbucket-2
        cpe: cpe:2.3:a:bitbucket:bitbucket:*:*:*:*:*:*:*:*
        words:
          - "Repository not found"
        part: body

      - type: word
        name: bitbucket-3
        cpe: cpe:2.3:a:bitbucket:bitbucket:*:*:*:*:*:*:*:*
        words:
          - "text/plain"
        part: header

    extractors:
      - type: dsl
        dsl:
          - cname
