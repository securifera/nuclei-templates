id: wishpond-takeover

info:
  name: Wishpond Takeover Detection
  author: pdteam
  severity: high
  description: Wishpond takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:wishpond:wishpond:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wishpond
    product: wishpond
  tags: takeover,wishpond,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: wishpond
        cpe: cpe:2.3:a:wishpond:wishpond:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: wishpond-2
        cpe: cpe:2.3:a:wishpond:wishpond:*:*:*:*:*:*:*:*
        words:
          - https://www.wishpond.com/404?campaign=true
          - 'Oops! There isn’t a Wishpond Campaign published to this page.'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - cname
