id: launchrock-takeover

info:
  name: Launchrock Takeover Detection
  author: pdteam
  severity: high
  description: Launchrock takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/74
  classification:
    cpe: cpe:2.3:a:launchrock:launchrock:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: launchrock
    product: launchrock
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: launchrock
        cpe: cpe:2.3:a:launchrock:launchrock:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: launchrock-2
        cpe: cpe:2.3:a:launchrock:launchrock:*:*:*:*:*:*:*:*
        words:
          - It looks like you may have taken a wrong turn somewhere. Don't worry...it happens to all of us.

    extractors:
      - type: dsl
        dsl:
          - cname
