id: mashery-takeover

info:
  name: mashery takeover detection
  author: pdteam
  severity: high
  description: mashery takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/14
  classification:
    cpe: cpe:2.3:a:mashery:mashery:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: mashery
    product: mashery
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: mashery
        cpe: cpe:2.3:a:mashery:mashery:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: mashery-2
        cpe: cpe:2.3:a:mashery:mashery:*:*:*:*:*:*:*:*
        words:
          - Unrecognized domain <strong>

    extractors:
      - type: dsl
        dsl:
          - cname
