id: framer-takeover

info:
  name: Framer Takeover Detection
  author: Amjad Ali
  severity: high
  description: |
    Framer takeover was detected.
  reference:
    - https://www.framer.com/developers/
  classification:
    cpe: cpe:2.3:a:framer:framer:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: html:"Site Not Found | Framer"
    fofa-query: body="Site Not Found | Framer"
    vendor: framer
    product: framer
  tags: takeover,framer,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: framer
        cpe: cpe:2.3:a:framer:framer:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: framer-2
        cpe: cpe:2.3:a:framer:framer:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Site Not Found | Framer"

      - type: word
        name: framer-3
        cpe: cpe:2.3:a:framer:framer:*:*:*:*:*:*:*:*
        part: content_type
        words:
          - "text/html"

    extractors:
      - type: dsl
        dsl:
          - cname
