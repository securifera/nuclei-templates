id: readme-takeover

info:
  name: Readme.io Takeover Detection
  author: pdteam
  severity: high
  description: Readme.io takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/41
  classification:
    cpe: cpe:2.3:a:readme:readme:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: readme
    product: readme
  tags: takeover,readme,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: readme
        cpe: cpe:2.3:a:readme:readme:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: readme-2
        cpe: cpe:2.3:a:readme:readme:*:*:*:*:*:*:*:*
        words:
          - 'Project doesnt exist... yet!'

    extractors:
      - type: dsl
        dsl:
          - cname
