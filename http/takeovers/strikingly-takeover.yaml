id: strikingly-takeover

info:
  name: Strikingly Takeover Detection
  author: pdteam
  severity: high
  description: Strikingly takeover was detected.
  reference:
    - https://medium.com/@sherif0x00/takeover-subdomains-pointing-to-strikingly-5e67df80cdfd
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/58
  classification:
    cpe: cpe:2.3:a:strikingly:strikingly:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: strikingly
    product: strikingly
  tags: takeover,strikingly,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: strikingly
        cpe: cpe:2.3:a:strikingly:strikingly:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: strikingly-2
        cpe: cpe:2.3:a:strikingly:strikingly:*:*:*:*:*:*:*:*
        words:
          - "But if you're looking to build your own website"
          - "you've come to the right place."
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname
