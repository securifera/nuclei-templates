id: gohire-takeover

info:
  name: GoHire Takeover Detection
  author: philippedelteil
  severity: high
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/403
  classification:
    cpe: cpe:2.3:a:gohire:gohire:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: gohire
    product: gohire
  tags: takeover,gohire,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: gohire
        cpe: cpe:2.3:a:gohire:gohire:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: gohire-2
        cpe: cpe:2.3:a:gohire:gohire:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'You may have followed an invalid link or the job you are looking for has been archived'

      - type: status
        status:
          - 404

    extractors:
      - type: dsl
        dsl:
          - cname
