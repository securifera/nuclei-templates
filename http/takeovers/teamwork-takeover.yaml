id: teamwork-takeover

info:
  name: Teamwork Takeover Detection
  author: pdteam
  severity: high
  description: Teamwork takeover was detected.
  classification:
    cpe: cpe:2.3:a:teamwork:teamwork:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: teamwork
    product: teamwork
  tags: takeover,teamwork,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: teamwork
        cpe: cpe:2.3:a:teamwork:teamwork:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: teamwork-2
        cpe: cpe:2.3:a:teamwork:teamwork:*:*:*:*:*:*:*:*
        words:
          - "Oops - We didn't find your site."

    extractors:
      - type: dsl
        dsl:
          - cname
