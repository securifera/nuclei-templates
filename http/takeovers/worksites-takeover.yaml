id: worksites-takeover

info:
  name: Worksites Takeover Detection
  author: melbadry9,dogasantos
  severity: high
  description: Worksites takeover was detected.
  reference:
    - https://melbadry9.gitbook.io/blog/dangling-dns/xyz-services/ddns-worksites
  classification:
    cpe: cpe:2.3:a:worksites:worksites:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: worksites
    product: worksites
  tags: takeover,dns,vuln

dns:
  - name: "{{FQDN}}"
    type: A
    class: inet
    recursion: true
    retries: 3
    matchers:
      - type: word
        name: worksites
        cpe: cpe:2.3:a:worksites:worksites:*:*:*:*:*:*:*:*
        words:
          - "69.164.223.206"

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: worksites-2
        cpe: cpe:2.3:a:worksites:worksites:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: worksites-3
        cpe: cpe:2.3:a:worksites:worksites:*:*:*:*:*:*:*:*
        words:
          - "Company Not Found"
          - "worksites.net"
        condition: and

      - type: status
        status:
          - 404

    extractors:
      - type: dsl
        dsl:
          - cname
