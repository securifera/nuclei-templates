id: sprintful-takeover

info:
  name: Sprintful Takeover
  author: Mhdsamx
  severity: high
  description: Sprintful takeover was detected.
  classification:
    cpe: cpe:2.3:a:sprintful:sprintful:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sprintful
    product: sprintful
  tags: takeover,sprintful,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: dsl
        name: sprintful
        cpe: cpe:2.3:a:sprintful:sprintful:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: sprintful-2
        cpe: cpe:2.3:a:sprintful:sprintful:*:*:*:*:*:*:*:*
        words:
          - 'The user account associated with this calendar has been deactivated.'
          - 'Please contact the owner of this calendar directly in order to book a meeting.'
          - 'This domain name does not have a default page configured.'
        condition: or

      - type: word
        name: sprintful-3
        cpe: cpe:2.3:a:sprintful:sprintful:*:*:*:*:*:*:*:*
        words:
          - "Sprintful"

      - type: status
        status:
          - 200

    extractors:
      - type: dsl
        dsl:
          - cname
