id: tave-takeover

info:
  name: tave takeover detection
  author: pdteam
  severity: high
  description: tave takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  classification:
    cpe: cpe:2.3:a:tave:tave:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: tave
    product: tave
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: tave
        cpe: cpe:2.3:a:tave:tave:*:*:*:*:*:*:*:*
        dsl:
          - Host != ip

      - type: word
        name: tave-2
        cpe: cpe:2.3:a:tave:tave:*:*:*:*:*:*:*:*
        words:
          - "<h1>Error 404: Page Not Found</h1>"

    extractors:
      - type: dsl
        dsl:
          - cname
