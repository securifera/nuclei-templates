id: api-particle

info:
  name: Particle Cloud API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://docs.particle.io/reference
  classification:
    cpe: cpe:2.3:a:particle:particle:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: particle
    product: particle
  tags: token-spray,particle

self-contained: true

http:
  - method: GET
    path:
      - "https://api.particle.io/v1/user?access_token={{token}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: particle
        cpe: cpe:2.3:a:particle:particle:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"account_info":'
          - '"username":'
        condition: and
