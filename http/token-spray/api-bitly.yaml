id: api-bitly

info:
  name: Bitly API Test
  author: zzeitlin,geeknik
  severity: info
  reference:
    - https://dev.bitly.com/api-reference
  classification:
    cpe: cpe:2.3:a:bitly:bitly:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: bitly
    product: bitly
  tags: token-spray,bitly

self-contained: true

http:
  - method: GET
    path:
      - "https://api-ssl.bitly.com/v3/shorten?access_token={{token}}&longUrl=https://www.google.com"

    matchers:
      - type: word
        name: bitly
        cpe: cpe:2.3:a:bitly:bitly:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"status_code":200,"status_txt":"OK"'
        condition: and
