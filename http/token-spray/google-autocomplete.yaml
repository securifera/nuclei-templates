id: api-googleautocomplete

info:
  name: Google Autocomplete API Test
  author: zzeitlin
  severity: info
  classification:
    cpe: cpe:2.3:a:google:autocomplete:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: autocomplete
  tags: token-spray,google,autocomplete

self-contained: true

http:
  - method: GET
    path:
      - "https://maps.googleapis.com/maps/api/place/autocomplete/json?input=Bingh&types=%28cities%29&key={{token}}"

    matchers:
      - type: word
        name: autocomplete
        cpe: cpe:2.3:a:google:autocomplete:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'error_message'
        negative: true
