id: api-flickr

info:
  name: Flickr API Test
  author: geeknik
  severity: info
  reference:
    - https://www.flickr.com/services/developer/api/
  classification:
    cpe: cpe:2.3:a:flickr:flickr:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: flickr
    product: flickr
  tags: token-spray,flickr

self-contained: true

http:
  - method: GET
    path:
      - "https://www.flickr.com/services/rest/?method=flickr.tags.getHotList&api_key={{token}}"

    matchers:
      - type: word
        name: flickr
        cpe: cpe:2.3:a:flickr:flickr:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'secret'
          - 'owner'
          - 'username'
        condition: and
