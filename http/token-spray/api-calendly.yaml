id: api-calendly

info:
  name: Calendly API Test
  author: zzeitlin
  severity: info
  reference:
    - https://calendly.stoplight.io/docs/api-docs-v1/b3A6MTg3MDczNg-about-me
  classification:
    cpe: cpe:2.3:a:calendly:calendly:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: calendly
    product: calendly
  tags: token-spray,calendly

self-contained: true

http:
  - method: GET
    path:
      - "https://calendly.com/api/v1/users/me"

    headers:
      X-Token: "{{token}}"
    matchers:
      - type: word
        name: calendly
        cpe: cpe:2.3:a:calendly:calendly:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"data":'
          - '"id":'
          - '"email":'
        condition: and
