id: api-heroku

info:
  name: Heroku API Test
  author: zzeitlin
  severity: info
  reference:
    - https://devcenter.heroku.com/articles/platform-api-quickstart#calling-the-api
  classification:
    cpe: cpe:2.3:a:heroku:heroku:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: heroku
    product: heroku
  tags: token-spray,heroku

self-contained: true

http:
  - method: POST
    path:
      - "https://api.heroku.com/apps"

    headers:
      Accept: application/vnd.heroku+json; version=3
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        name: heroku
        cpe: cpe:2.3:a:heroku:heroku:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"created_at":'
          - '"git_url":'
        condition: and
