id: api-segment

info:
  name: Segment API Test
  author: geeknik
  severity: info
  reference:
    - https://reference.segmentapis.com/
  classification:
    cpe: cpe:2.3:a:segment:segment:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: segment
    product: segment
  tags: token-spray,segment

self-contained: true

http:
  - raw:
      - |
        GET https://platform.segmentapis.com/v1beta/workspaces/myworkspace HTTP/1.1
        Host: platform.segmentapis.com
        Authorization: Bearer {{token}}
        Content-Type: application/json

    matchers:
      - type: word
        name: segment
        cpe: cpe:2.3:a:segment:segment:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"name":'
          - '"id"'
        condition: and
