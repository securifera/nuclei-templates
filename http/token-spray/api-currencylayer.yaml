id: api-currencylayer

info:
  name: Currencylayer API Test
  author: daffainfo
  severity: info
  description: Exchange rates and currency conversion
  reference:
    - https://currencylayer.com/documentation
    - https://github.com/daffainfo/all-about-apikey/tree/main/currencylayer
  classification:
    cpe: cpe:2.3:a:currencylayer:currencylayer:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: currencylayer
    product: currencylayer
  tags: token-spray,currencylayer

self-contained: true

http:
  - method: GET
    path:
      - "http://api.currencylayer.com/live?access_key={{token}}"

    matchers:
      - type: word
        name: currencylayer
        cpe: cpe:2.3:a:currencylayer:currencylayer:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"terms"'
          - '"source"'
          - '"quotes"'
        condition: and
