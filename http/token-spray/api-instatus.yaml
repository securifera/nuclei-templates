id: api-instatus

info:
  name: Instatus API Test
  author: daffainfo
  severity: info
  description: Post to and update maintenance and incidents on your status page through an HTTP REST API
  reference:
    - https://instatus.com/help/api
    - https://github.com/daffainfo/all-about-apikey/tree/main/instatus
  classification:
    cpe: cpe:2.3:a:instatus:instatus:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: instatus
    product: instatus
  tags: token-spray,instatus

self-contained: true

http:
  - method: GET
    path:
      - "https://api.instatus.com/v1/pages"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        name: instatus
        cpe: cpe:2.3:a:instatus:instatus:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"id":'
          - '"subdomain":'
          - '"name":'
          - '"logoUrl":'
        condition: and
