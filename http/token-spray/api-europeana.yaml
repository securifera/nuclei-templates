id: api-europeana

info:
  name: Europeana API Test
  author: daffainfo
  severity: info
  description: European Museum and Galleries content
  reference:
    - https://pro.europeana.eu/page/search
    - https://github.com/daffainfo/all-about-apikey/tree/main/europeana
  classification:
    cpe: cpe:2.3:a:europeana:europeana:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: europeana
    product: europeana
  tags: token-spray,europeana

self-contained: true

http:
  - method: GET
    path:
      - "https://api.europeana.eu/record/v2/search.json?wskey={{token}}&query=*&rows=0&profile=facets"

    matchers:
      - type: word
        name: europeana
        cpe: cpe:2.3:a:europeana:europeana:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'success'
          - 'apikey'
          - 'action'
        condition: and
