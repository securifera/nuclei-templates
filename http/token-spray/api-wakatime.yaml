id: api-wakatime

info:
  name: WakaTime CI API Test
  author: zzeitlin
  severity: info
  reference:
    - https://wakatime.com/developers
  classification:
    cpe: cpe:2.3:a:wakatime:wakatime:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wakatime
    product: wakatime
  tags: token-spray,wakatime

self-contained: true

http:
  - method: GET
    path:
      - "https://wakatime.com/api/v1/users/current/projects/?api_key={{token}}"

    matchers:
      - type: word
        name: wakatime
        cpe: cpe:2.3:a:wakatime:wakatime:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"data":'
          - '"seconds":'
          - '"is_up_to_date":'
        condition: and
