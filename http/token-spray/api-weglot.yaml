id: api-weglot

info:
  name: WeGlot API Test
  author: zzeitlin
  severity: info
  reference:
    - https://developers.weglot.com/api/reference
  classification:
    cpe: cpe:2.3:a:weglot:weglot:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: weglot
    product: weglot
  tags: token-spray,weglot

self-contained: true

http:
  - method: POST
    path:
      - "https://api.weglot.com/translate?api_key={{token}}"

    headers:
      Content-Type: application/json

    body: "{\"l_from\":\"en\",\"l_to\":\"fr\",\"request_url\":\"https://www.website.com/\",\"words\":[{\"w\":\"This is a blue car\",\"t\":1},{\"w\":\"This is a black car\",\"t\":1}]}"
    matchers:
      - type: word
        name: weglot
        cpe: cpe:2.3:a:weglot:weglot:*:*:*:*:*:*:*:*
        part: body
        negative: true
        case-insensitive: true
        words:
          - 'does not exist'
          - 'Invalid authorization'
