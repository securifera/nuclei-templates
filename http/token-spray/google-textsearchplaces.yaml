id: api-googletextsearchplaces

info:
  name: Google Places Text Search API Test
  author: zzeitlin
  severity: info
  classification:
    cpe: cpe:2.3:a:google:google:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: google
  tags: token-spray,google,search,places,text

self-contained: true

http:
  - method: GET
    path:
      - "https://maps.googleapis.com/maps/api/place/textsearch/json?query=restaurants+in+Sydney&key={{token}}"

    matchers:
      - type: word
        name: google
        cpe: cpe:2.3:a:google:google:*:*:*:*:*:*:*:*
        part: body
        negative: true
        words:
          - 'error_message'
