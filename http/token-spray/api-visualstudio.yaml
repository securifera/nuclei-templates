id: api-visualstudio

info:
  name: Visual Studio API Test
  author: zzeitlin
  severity: info
  reference:
    - https://openapi.appcenter.ms/
  classification:
    cpe: cpe:2.3:a:visualstudio:visualstudio:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: visualstudio
    product: visualstudio
  tags: token-spray,visualstudio,microsoft

self-contained: true

http:
  - method: GET
    path:
      - "https://api.appcenter.ms/v0.1/apps"

    headers:
      Content-Type: application/json
      X-Api-Token: "{{token}}"
    matchers:
      - type: word
        name: visualstudio
        cpe: cpe:2.3:a:visualstudio:visualstudio:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"id":'
          - '"description":'
          - '"owner":'
        condition: and
