id: api-moonpay

info:
  name: MoonPay API Test
  author: 0ri2N
  severity: info
  reference:
    - https://dashboard.moonpay.com/getting_started
  classification:
    cpe: cpe:2.3:a:moonpay:moonpay:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: moonpay
    product: moonpay
  tags: token-spray,moonpay,cryptocurrencies

self-contained: true

http:
  - method: GET
    path:
      - "https://api.moonpay.com/v3/currencies/btc/buy_quote?apiKey={{token}}&baseCurrencyAmount=1"

    matchers:
      - type: word
        name: moonpay
        cpe: cpe:2.3:a:moonpay:moonpay:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"accountId":'
        condition: and
