id: api-giphy

info:
  name: Giphy API Test
  author: geeknik
  severity: info
  reference:
    - https://developers.giphy.com/branch/master/docs/api/
  classification:
    cpe: cpe:2.3:a:giphy:giphy:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: giphy
    product: giphy
  tags: token-spray,giphy

self-contained: true

http:
  - method: GET
    path:
      - "https://api.giphy.com/v1/gifs/trending?api_key={{token}}"

    matchers:
      - type: word
        name: giphy
        cpe: cpe:2.3:a:giphy:giphy:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"data":'
          - '"type":"gif"'
        condition: and
