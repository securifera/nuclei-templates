id: api-ipinfo

info:
  name: IPinfo API Test
  author: 0xpugal
  severity: info
  reference:
    - https://ipinfo.io/developers
  classification:
    cpe: cpe:2.3:a:ipinfo:ipinfo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ipinfo
    product: ipinfo
  tags: token-spray,ipinfo

self-contained: true

http:
  - method: GET
    path:
      - "https://ipinfo.io/?token={{token}}"

    matchers:
      - type: word
        name: ipinfo
        cpe: cpe:2.3:a:ipinfo:ipinfo:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"ip"'
          - '"city"'
          - '"org"'
          - '"postal"'
          - '"timezone"'
        condition: and
