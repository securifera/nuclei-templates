id: api-box

info:
  name: Box API Test
  author: daffainfo
  severity: info
  description: File Sharing and Storage Service
  reference:
    - https://developer.box.com/
    - https://github.com/daffainfo/all-about-apikey/tree/main/box
  classification:
    cpe: cpe:2.3:a:box:box:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: box
    product: box
  tags: token-spray,box

self-contained: true

http:
  - raw:
      - |
        GET https://api.box.com/2.0/collections HTTP/1.1
        Host: api.box.com
        Authorization: Bearer {{token}}

    matchers:
      - type: word
        name: box
        cpe: cpe:2.3:a:box:box:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'total_count":'
          - 'limit":'
        condition: and
