id: api-iterable

info:
  name: Iterable API Test
  author: zzeitlin
  severity: info
  reference:
    - https://api.iterable.com/api/docs
  classification:
    cpe: cpe:2.3:a:iterable:iterable:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: iterable
    product: iterable
  tags: token-spray,iterable

self-contained: true

http:
  - method: GET
    path:
      - "https://api.iterable.com/api/catalogs"

    headers:
      Api_Key: "{{token}}"
    matchers:
      - type: word
        name: iterable
        cpe: cpe:2.3:a:iterable:iterable:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"name":'
          - '"catalogNames":'
        condition: and
