id: api-googlebooks

info:
  name: Google Books API Test
  author: daffainfo
  severity: info
  description: Google Books
  reference:
    - https://developers.google.com/books/docs/overview
    - https://github.com/daffainfo/all-about-apikey/tree/main/google-books
  classification:
    cpe: cpe:2.3:a:google:books:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: books
  tags: token-spray,google,books

self-contained: true

http:
  - method: GET
    path:
      - "https://www.googleapis.com/books/v1/volumes/zyTCAlFPjgYC?key={{token}}"

    matchers:
      - type: word
        name: books
        cpe: cpe:2.3:a:google:books:*:*:*:*:*:*:*:*
        part: body
        words:
          - "kind"
          - "id"
          - "etag"
        condition: and
