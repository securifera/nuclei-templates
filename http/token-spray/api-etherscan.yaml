id: api-etherscan

info:
  name: Etherscan API Test
  author: daffainfo
  severity: info
  description: Ethereum explorer API
  reference:
    - https://docs.etherscan.io/
    - https://github.com/daffainfo/all-about-apikey/tree/main/etherscan
  classification:
    cpe: cpe:2.3:a:etherscan:etherscan:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: etherscan
    product: etherscan
  tags: token-spray,etherscan

self-contained: true

http:
  - method: GET
    path:
      - "https://api.etherscan.io/api?module=account&action=balance&address=0xde0b295669a9fd93d5f28d9ec85e40f4cb697bae&tag=latest&apikey={{token}}"

    matchers-condition: and
    matchers:
      - type: word
        name: etherscan
        cpe: cpe:2.3:a:etherscan:etherscan:*:*:*:*:*:*:*:*
        part: body
        negative: true
        words:
          - 'Invalid API Key'

      - type: word
        name: etherscan-2
        cpe: cpe:2.3:a:etherscan:etherscan:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"status":'
          - '"message":"OK"'
        condition: and
