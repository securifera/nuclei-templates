id: api-proxykingdom

info:
  name: ProxyKingdom API Test
  author: daffainfo
  severity: info
  description: Rotating Proxy API that produces a working proxy on every request
  reference:
    - https://proxykingdom.com/documentation
    - https://github.com/daffainfo/all-about-apikey/tree/main/proxykingdom
  classification:
    cpe: cpe:2.3:a:proxykingdom:proxykingdom:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: proxykingdom
    product: proxykingdom
  tags: token-spray,proxykingdom

self-contained: true

http:
  - method: GET
    path:
      - "https://api.proxykingdom.com/proxy?token={{token}}"

    matchers:
      - type: word
        name: proxykingdom
        cpe: cpe:2.3:a:proxykingdom:proxykingdom:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"address"'
          - '"port"'
          - '"protocol"'
        condition: and
