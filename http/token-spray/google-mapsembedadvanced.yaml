id: api-googlemapsembedadvanced

info:
  name: Google Maps Embed (Advanced) API Test
  author: zzeitlin
  severity: info
  classification:
    cpe: cpe:2.3:a:google:google:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: google
  tags: token-spray,google,maps,embed

self-contained: true

http:
  - method: GET
    path:
      - "https://www.google.com/maps/embed/v1/search?q=record+stores+in+Seattle&key={{token}}"

    matchers:
      - type: status
        status:
          - 200
