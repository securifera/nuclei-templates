id: api-thecatapi

info:
  name: TheCatApi API Test
  author: daffainfo
  severity: info
  description: Pictures of cats from Tumblr
  reference:
    - https://docs.thecatapi.com/
    - https://github.com/daffainfo/all-about-apikey/tree/main/thecatapi
  classification:
    cpe: cpe:2.3:a:thecatapi:thecatapi:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: thecatapi
    product: thecatapi
  tags: token-spray,thecatapi

self-contained: true

http:
  - method: GET
    path:
      - "https://api.thecatapi.com/v1/votes"

    headers:
      x-api-key: "{{token}}"
    matchers:
      - type: word
        name: thecatapi
        cpe: cpe:2.3:a:thecatapi:thecatapi:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"country_code":'
          - '"created_at":'
        condition: and
