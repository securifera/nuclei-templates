id: api-debounce

info:
  name: DeBounce API Test
  author: 0ri2N
  severity: info
  reference:
    - https://developers.debounce.io/reference/api-key-authentication
    - https://debounce.io
  classification:
    cpe: cpe:2.3:a:debounce:debounce:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: debounce
    product: debounce
  tags: debounce,token-spray

self-contained: true

http:
  - method: GET
    path:
      - "https://api.debounce.io/v1/?api={{token}}&email=test@interact.sh"

    matchers:
      - type: word
        name: debounce
        cpe: cpe:2.3:a:debounce:debounce:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"balance":'
          - '"success":'
          - '"debounce":'
        condition: and
