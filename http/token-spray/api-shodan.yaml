id: api-shodan

info:
  name: Shodan API Test
  author: 0ri2N
  severity: info
  description: |
    Shodan is a search engine that lets users search for various types of servers connected to the internet using a variety of filters.
  reference:
    - https://shodan.io
    - https://developer.shodan.io
    - https://developer.shodan.io/api
  classification:
    cpe: cpe:2.3:a:shodan:shodan:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: shodan
    product: shodan
  tags: recon,shodan,token-spray

self-contained: true

http:
  - method: GET
    path:
      - https://api.shodan.io/api-info?key={{token}}

    matchers:
      - type: word
        name: shodan
        cpe: cpe:2.3:a:shodan:shodan:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"plan"'
          - '"unlocked"'
          - '"scan_credits"'
        condition: and
