id: api-linkedin

info:
  name: LinkedIn API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://docs.microsoft.com/en-us/linkedin/compliance/
  classification:
    cpe: cpe:2.3:a:linkedin:linkedin:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: linkedin
    product: linkedin
  tags: token-spray,linkedin

self-contained: true

http:
  - method: GET
    path:
      - "https://api.linkedin.com/v2/me?oauth2_access_token={{token}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: linkedin
        cpe: cpe:2.3:a:linkedin:linkedin:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"id":'
          - '"firstName":'
          - '"localized":'
        condition: and
