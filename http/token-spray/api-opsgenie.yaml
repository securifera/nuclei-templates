id: api-opsgenie

info:
  name: OpsGenie API Test
  author: 0xpugal
  severity: info
  description: Forex currency market data
  reference:
    - https://docs.opsgenie.com/docs/api-overview
  classification:
    cpe: cpe:2.3:a:opsgenie:opsgenie:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: opsgenie
    product: opsgenie
  tags: token-spray,opsgenie

self-contained: true

http:
  - method: GET
    path:
      - "https://api.opsgenie.com/v2/alerts"

    headers:
      Authorization: GenieKey {{token}}
    matchers:
      - type: word
        name: opsgenie
        cpe: cpe:2.3:a:opsgenie:opsgenie:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"data":'
          - '"paging":'
          - '"took":'
        condition: and
