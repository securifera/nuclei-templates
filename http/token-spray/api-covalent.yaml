id: api-covalent

info:
  name: Covalent API Test
  author: daffainfo
  severity: info
  description: https://github.com/daffainfo/all-about-apikey/tree/main/covalent
  reference:
    - https://www.covalenthq.com/docs/api/
    - https://github.com/daffainfo/all-about-apikey/tree/main/covalent
  classification:
    cpe: cpe:2.3:a:covalent:covalent:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: covalent
    product: covalent
  tags: token-spray,covalent

self-contained: true

http:
  - method: GET
    path:
      - "https://api.covalenthq.com/v1/3/address/balances_v2/?&key={{token}}"

    matchers:
      - type: word
        name: covalent
        cpe: cpe:2.3:a:covalent:covalent:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"address":'
          - '"updated_at":'
          - '"next_update_at":'
        condition: and
