id: api-deviantart

info:
  name: DeviantArt API Test
  author: zzeitlin
  severity: info
  reference:
    - https://www.deviantart.com/developers/authentication
  classification:
    cpe: cpe:2.3:a:deviantart:deviantart:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: deviantart
    product: deviantart
  tags: token-spray,deviantart

self-contained: true

http:
  - method: POST
    path:
      - "https://www.deviantart.com/api/v1/oauth2/placebo"

    body: "access_token={{token}}"
    matchers:
      - type: word
        name: deviantart
        cpe: cpe:2.3:a:deviantart:deviantart:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"status" : "success"'
