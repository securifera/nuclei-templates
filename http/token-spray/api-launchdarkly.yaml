id: api-launchdarkly

info:
  name: LaunchDarkly REST API
  author: Luqmaan Hadia
  severity: info
  reference:
    - https://apidocs.launchdarkly.com/
  classification:
    cpe: cpe:2.3:a:launchdarkly:launchdarkly:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: launchdarkly
    product: launchdarkly
  tags: token-spray,launchdarkly

self-contained: true

http:
  - raw:
      - |
        GET https://app.launchdarkly.com/api/v2/members HTTP/1.1
        Host: app.launchdarkly.com
        Authorization: {{token}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: launchdarkly
        cpe: cpe:2.3:a:launchdarkly:launchdarkly:*:*:*:*:*:*:*:*
        words:
          - '"totalCount":'
          - '"items":'
        condition: and
