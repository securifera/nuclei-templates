id: api-digitalocean

info:
  name: DigitalOcean API Test
  author: geeknik
  severity: info
  reference:
    - https://docs.digitalocean.com/reference/api/
  classification:
    cpe: cpe:2.3:a:digitalocean:digitalocean:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: digitalocean
    product: digitalocean
  tags: token-spray,digitalocean

self-contained: true

http:
  - raw:
      - |
        GET https://api.digitalocean.com/v2/droplets HTTP/1.1
        Host: api.digitalocean.com
        Authorization: Bearer {{token}}

    matchers:
      - type: word
        name: digitalocean
        cpe: cpe:2.3:a:digitalocean:digitalocean:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"droplets":'
          - '"meta":'
        condition: and
