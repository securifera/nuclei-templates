id: api-jsonbin

info:
  name: JSONBin API Test
  author: daffainfo
  severity: info
  description: Free JSON storage service. Ideal for small scale Web apps, Websites and Mobile apps
  reference:
    - https://jsonbin.io/api-reference
    - https://github.com/daffainfo/all-about-apikey/tree/main/jsonbin
  classification:
    cpe: cpe:2.3:a:jsonbin:jsonbin:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: jsonbin
    product: jsonbin
  tags: token-spray,jsonbin

self-contained: true

http:
  - raw:
      - |
        GET https://api.jsonbin.io/v3/c HTTP/1.1
        Host: api.jsonbin.io
        X-Master-key: {{token}}

    matchers:
      - type: word
        name: jsonbin
        cpe: cpe:2.3:a:jsonbin:jsonbin:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"record"'
          - '"collectionMeta"'
          - '"schemaDocId"'
        condition: and
