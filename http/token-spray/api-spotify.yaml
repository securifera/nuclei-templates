id: api-spotify

info:
  name: Spotify API Test
  author: zzeitlin
  severity: info
  reference:
    - https://developer.spotify.com/documentation/general/guides/authorization-guide/
  classification:
    cpe: cpe:2.3:a:spotify:spotify:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: spotify
    product: spotify
  tags: token-spray,spotify

self-contained: true

http:
  - method: GET
    path:
      - "https://api.spotify.com/v1/me/player/devices"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        name: spotify
        cpe: cpe:2.3:a:spotify:spotify:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"devices":'
          - '"id":'
          - '"is_active":'
        condition: and
