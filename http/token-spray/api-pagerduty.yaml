id: api-pagerduty

info:
  name: Pagerduty API Test
  author: zzeitlin
  severity: info
  reference:
    - https://developer.pagerduty.com/api-reference
  classification:
    cpe: cpe:2.3:a:pagerduty:pagerduty:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: pagerduty
    product: pagerduty
  tags: token-spray,pagerduty

self-contained: true

http:
  - method: GET
    path:
      - "https://api.pagerduty.com/schedules"

    headers:
      Accept: application/vnd.pagerduty+json;version=2
      Authorization: Token token={{token}}
    matchers:
      - type: word
        name: pagerduty
        cpe: cpe:2.3:a:pagerduty:pagerduty:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"schedules":'
          - '"id":'
        condition: and
