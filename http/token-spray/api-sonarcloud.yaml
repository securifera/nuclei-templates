id: api-sonarcloud

info:
  name: SonarCloud API Test
  author: zzeitlin
  severity: info
  reference:
    - https://sonarcloud.io/web_api/api/authentication
  classification:
    cpe: cpe:2.3:a:sonarcloud:sonarcloud:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sonarcloud
    product: sonarcloud
  tags: token-spray,sonarcloud

self-contained: true

http:
  - method: GET
    path:
      - "https://sonarcloud.io/api/authentication/validate"

    headers:
      Authorization: Basic {{base64(token + ':')}}
    matchers:
      - type: word
        name: sonarcloud
        cpe: cpe:2.3:a:sonarcloud:sonarcloud:*:*:*:*:*:*:*:*
        part: body
        words:
          - '{"valid": true}'
