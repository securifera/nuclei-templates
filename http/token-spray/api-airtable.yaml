id: api-airtable

info:
  name: Airtable API Test
  author: daffainfo
  severity: info
  description: Integrate with Airtable
  reference:
    - https://airtable.com/api
    - https://github.com/daffainfo/all-about-apikey/tree/main/airtable
  classification:
    cpe: cpe:2.3:a:airtable:airtable:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: airtable
    product: airtable
  tags: token-spray,airtable

self-contained: true

http:
  - raw:
      - |
        GET https://api.airtable.com/v0/meta/bases HTTP/1.1
        Host: api.airtable.com
        Authorization: Bearer {{token}}

    matchers:
      - type: word
        name: airtable
        cpe: cpe:2.3:a:airtable:airtable:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"bases"'
          - '"id"'
          - '"name"'
        condition: and
