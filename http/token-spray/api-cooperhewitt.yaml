id: api-cooperhewitt

info:
  name: Cooper Hewitt API
  author: daffainfo
  severity: info
  description: Smithsonian Design Museum
  reference:
    - https://collection.cooperhewitt.org/api/methods/
    - https://github.com/daffainfo/all-about-apikey/tree/main/cooper-hewitt
  classification:
    cpe: cpe:2.3:a:cooperhewitt:cooperhewitt:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: cooperhewitt
    product: cooperhewitt
  tags: token-spray,cooperhewitt

self-contained: true

http:
  - method: GET
    path:
      - "https://api.collection.cooperhewitt.org/rest/?method=api.spec.formats&access_token={{token}}"

    matchers:
      - type: word
        name: cooperhewitt
        cpe: cpe:2.3:a:cooperhewitt:cooperhewitt:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"stat":'
          - '"formats":'
          - '"default_format":'
        condition: and
