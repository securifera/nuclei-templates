id: api-bhagavadgita

info:
  name: Bhagavad Gita API Test
  author: daffainfo
  severity: info
  description: Open Source Shrimad Bhagavad Gita API including 21+ authors translation in Sanskrit/English/Hindi
  reference:
    - https://docs.bhagavadgitaapi.in/
    - https://github.com/daffainfo/all-about-apikey/tree/main/bhagavad-gita
  classification:
    cpe: cpe:2.3:a:bhagavadgita:bhagavadgita:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: bhagavadgita
    product: bhagavadgita
  tags: token-spray,bhagavadgita

self-contained: true

http:
  - method: GET
    path:
      - "https://bhagavadgitaapi.in/slok?api_key={{token}}"

    matchers:
      - type: word
        name: bhagavadgita
        cpe: cpe:2.3:a:bhagavadgita:bhagavadgita:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"chapter"'
          - '"verse"'
          - '"slok"'
        condition: and
