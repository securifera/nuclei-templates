id: api-asana

info:
  name: Asana API Test
  author: zzeitlin
  severity: info
  description: Programmatic access to all data in your asana system
  reference:
    - https://developers.asana.com/docs/using-terminal
    - https://github.com/daffainfo/all-about-apikey/tree/main/asana
  classification:
    cpe: cpe:2.3:a:asana:asana:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: asana
    product: asana
  tags: token-spray,asana

self-contained: true

http:
  - method: GET
    path:
      - "https://app.asana.com/api/1.0/users/me"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        name: asana
        cpe: cpe:2.3:a:asana:asana:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'data:'
          - 'email'
          - 'name'
        condition: and
