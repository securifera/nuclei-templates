id: api-googlegeocode

info:
  name: Google Geocode API Test
  author: zzeitlin
  severity: info
  classification:
    cpe: cpe:2.3:a:google:geocode:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: geocode
  tags: token-spray,google,geocode

self-contained: true

http:
  - method: GET
    path:
      - "https://maps.googleapis.com/maps/api/geocode/json?latlng=40,30&key={{token}}"

    matchers:
      - type: word
        name: geocode
        cpe: cpe:2.3:a:google:geocode:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'error_message'
        negative: true
