id: api-host-io

info:
  name: host.io API Test
  author: daffainfo
  severity: info
  description: Domains Data API for Developers
  reference:
    - https://host.io/docs
    - https://github.com/daffainfo/all-about-apikey/tree/main/host-io
  classification:
    cpe: cpe:2.3:a:host-io:host-io:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: host-io
    product: host-io
  tags: token-spray,hostio

self-contained: true

http:
  - method: GET
    path:
      - "https://host.io/api/full/facebook.com?token=${{token}}"

    matchers:
      - type: word
        name: host-io
        cpe: cpe:2.3:a:host-io:host-io:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"domain"'
          - '"rank"'
          - '"url"'
        condition: and
