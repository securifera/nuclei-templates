id: api-stripe

info:
  name: Stripe API Test
  author: zzeitlin
  severity: info
  reference:
    - https://stripe.com/docs/api/authentication
  classification:
    cpe: cpe:2.3:a:stripe:stripe:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: stripe
    product: stripe
  tags: token-spray,stripe

self-contained: true

http:
  - method: GET
    path:
      - "https://api.stripe.com/v1/charges"

    headers:
      Authorization: Basic {{base64(token + ':')}}
    matchers:
      - type: word
        name: stripe
        cpe: cpe:2.3:a:stripe:stripe:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"object":'
          - '"url":'
          - '"data":'
        condition: and
