id: api-googlenearestroads

info:
  name: Google Nearest Roads API Test
  author: zzeitlin
  severity: info
  classification:
    cpe: cpe:2.3:a:google:google:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: google
  tags: token-spray,google,roads

self-contained: true

http:
  - method: GET
    path:
      - "https://roads.googleapis.com/v1/nearestRoads?points=60.170880,24.942795|60.170879,24.942796|60.170877,24.942796&key={{token}}"

    matchers:
      - type: word
        name: google
        cpe: cpe:2.3:a:google:google:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'error'
        negative: true
