id: api-securitytrails

info:
  name: SecurityTrails API Test
  author: 0ri2N
  severity: info
  reference:
    - https://securitytrails.com
    - https://docs.securitytrails.com
    - https://securitytrails.com/corp/api
  classification:
    cpe: cpe:2.3:a:securitytrails:securitytrails:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: securitytrails
    product: securitytrails
  tags: recon,securitytrails,token-spray

self-contained: true

http:
  - method: GET
    path:
      - https://api.securitytrails.com/v1/ping

    headers:
      APIKey: "{{token}}"
    matchers:
      - type: word
        name: securitytrails
        cpe: cpe:2.3:a:securitytrails:securitytrails:*:*:*:*:*:*:*:*
        part: body
        words:
          - success
