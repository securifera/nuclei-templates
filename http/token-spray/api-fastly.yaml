id: api-fastly

info:
  name: Fastly API Test
  author: Adam Crosser
  severity: info
  reference:
    - https://developer.fastly.com/reference/api/
  classification:
    cpe: cpe:2.3:a:fastly:fastly:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: fastly
    product: fastly
  tags: token-spray,fastly

self-contained: true

http:
  - method: GET
    path:
      - "https://api.fastly.com/current_user"

    headers:
      Fastly-Key: "{{token}}"
    matchers:
      - type: word
        name: fastly
        cpe: cpe:2.3:a:fastly:fastly:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"created_at":'
          - '"customer_id":'
        condition: and
