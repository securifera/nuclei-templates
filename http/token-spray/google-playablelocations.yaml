id: api-googleplayablelocations

info:
  name: Google Playable Locations API Test
  author: zzeitlin
  severity: info
  classification:
    cpe: cpe:2.3:a:locations:locations:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: locations
    product: locations
  tags: token-spray,google,playable,locations

self-contained: true

http:
  - method: GET
    path:
      - "https://playablelocations.googleapis.com/v3:samplePlayableLocations?key={{token}}"

    matchers:
      - type: word
        name: locations
        cpe: cpe:2.3:a:locations:locations:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'error'
        negative: true
