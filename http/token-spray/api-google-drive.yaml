id: api-google-drive

info:
  name: Google Drive API Test
  author: geeknik
  severity: info
  reference:
    - https://developers.google.com/drive/api/guides/about-sdk
  classification:
    cpe: cpe:2.3:a:google:drive:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: drive
  tags: token-spray,google,drive,intrusive

self-contained: true

http:
  - raw:
      - |
        GET https://www.googleapis.com/drive/v3/files/{{randstr}}.txt/%3fkey={{token}}&supportsAllDrives=true HTTP/1.1
        Referer: {{referer}}
        Content-Type:application/json

    matchers:
      - type: word
        name: drive
        cpe: cpe:2.3:a:google:drive:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'File not found: {{randstr}}.txt.'
