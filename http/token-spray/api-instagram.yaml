id: api-instagramgraph

info:
  name: Instagram Graph API Test
  author: zzeitlin
  severity: info
  reference:
    - https://developers.facebook.com/docs/instagram-api/getting-started
  classification:
    cpe: cpe:2.3:a:instagram:instagram:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: instagram
    product: instagram
  tags: token-spray,instagram,graph,facebook

self-contained: true

http:
  - method: GET
    path:
      - "https://graph.facebook.com/v12.0/me/accounts?access_token={{token}}"

    matchers:
      - type: word
        name: instagram
        cpe: cpe:2.3:a:instagram:instagram:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"data":'
          - '"access_token":'
          - '"name":'
        condition: and
