id: api-zoomeye

info:
  name: ZoomEye API Test
  author: 0ri2N
  severity: info
  description: |
    ZoomEyeis a Cyberspace Search Engine recording information of devices, websites, services and components etc.
  reference:
    - https://zoomeye.org
    - https://zoomeye.org/doc
  classification:
    cpe: cpe:2.3:a:zoomeye:zoomeye:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: zoomeye
    product: zoomeye
  tags: recon,zoomeye,token-spray

self-contained: true

http:
  - method: GET
    path:
      - https://api.zoomeye.org/resources-info

    headers:
      API-KEY: "{{token}}"
    matchers:
      - type: word
        name: zoomeye
        cpe: cpe:2.3:a:zoomeye:zoomeye:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"plan"'
          - '"stats"'
          - '"user_info"'
        condition: and
