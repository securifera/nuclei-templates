id: api-onelogin

info:
  name: OneLogin API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://developers.onelogin.com/api-docs/2/getting-started/dev-overview
  classification:
    cpe: cpe:2.3:a:onelogin:onelogin:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: onelogin
    product: onelogin
  tags: token-spray,onelogin

self-contained: true

http:
  - method: GET
    path:
      - "https://api.us.onelogin.com/api/2/apps"
      - "https://api.eu.onelogin.com/api/2/apps"

    headers:
      Authorization: Bearer {{token}}
    stop-at-first-match: true
    matchers:
      - type: word
        name: onelogin
        cpe: cpe:2.3:a:onelogin:onelogin:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"id":'
          - '"connector_id":'
          - '"auth_method":'
        condition: and
