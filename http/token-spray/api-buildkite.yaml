id: api-buildkite

info:
  name: Buildkite API Test
  author: zzeitlin
  severity: info
  reference:
    - https://buildkite.com/docs/apis/rest-api/user
  classification:
    cpe: cpe:2.3:a:buildkite:buildkite:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: buildkite
    product: buildkite
  tags: token-spray,buildkite

self-contained: true

http:
  - method: GET
    path:
      - "https://api.buildkite.com/v2/user"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        name: buildkite
        cpe: cpe:2.3:a:buildkite:buildkite:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"id":'
          - '"graphql_id":'
          - '"email":'
        condition: and
