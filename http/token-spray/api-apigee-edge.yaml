id: api-apigee-edge

info:
  name: Apigee Edge API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://apidocs.apigee.com/apis
  classification:
    cpe: cpe:2.3:a:apigee:apigee:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apigee
    product: apigee
  tags: token-spray,apigee

self-contained: true

http:
  - method: GET
    path:
      - "https://apimonitoring.enterprise.apigee.com/alerts"

    headers:
      Authorization: Bearer {{token}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: apigee
        cpe: cpe:2.3:a:apigee:apigee:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"uuid":'
          - '"name":'
        condition: and
