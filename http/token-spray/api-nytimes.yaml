id: api-nytimes

info:
  name: NYTimes API Test
  author: daffainfo
  severity: info
  description: NYTimes API Test
  reference:
    - https://developer.nytimes.com/apis
  classification:
    cpe: cpe:2.3:a:nytimes:nytimes:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: nytimes
    product: nytimes
  tags: token-spray,nytimes

self-contained: true

http:
  - raw:
      - |
        GET https://api.nytimes.com/svc/mostpopular/v2/shared/1.json?api-key={{token}} HTTP/1.1
        Host: api.nytimes.com

    matchers:
      - type: word
        name: nytimes
        cpe: cpe:2.3:a:nytimes:nytimes:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"status":'
          - '"copyright":'
          - '"num_results":'
        condition: and
