id: api-tink

info:
  name: Tink API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://docs.tink.com/api
  classification:
    cpe: cpe:2.3:a:tink:tink:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: tink
    product: tink
  tags: token-spray,tink

self-contained: true

http:
  - method: GET
    path:
      - "https://api.tink.com/api/v1/user"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        name: tink
        cpe: cpe:2.3:a:tink:tink:*:*:*:*:*:*:*:*
        part: body
        words:
          - "appId"
          - "externalUserId"
          - "username"
        condition: and
