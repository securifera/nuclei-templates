id: api-harvardart

info:
  name: Harvard Art Museums API Test
  author: daffainfo
  severity: info
  description: Harvard Art
  reference:
    - https://github.com/harvardartmuseums/api-docs
    - https://github.com/daffainfo/all-about-apikey/tree/main/harvard-art-museums
  classification:
    cpe: cpe:2.3:a:harvardart:harvardart:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: harvardart
    product: harvardart
  tags: token-spray,harvardart

self-contained: true

http:
  - method: GET
    path:
      - "https://api.harvardartmuseums.org/color/34838442?apikey={{token}}"

    matchers:
      - type: word
        name: harvardart
        cpe: cpe:2.3:a:harvardart:harvardart:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"colorid"'
          - '"name"'
          - '"hex"'
        condition: and
