id: api-buttercms

info:
  name: ButterCMS API Test
  author: zzeitlin
  severity: info
  reference:
    - https://buttercms.com/docs/api/#introduction
  classification:
    cpe: cpe:2.3:a:buttercms:buttercms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: buttercms
    product: buttercms
  tags: token-spray,buttercms

self-contained: true

http:
  - method: GET
    path:
      - "https://api.buttercms.com/v2/posts/?auth_token={{token}}"

    matchers:
      - type: word
        name: buttercms
        cpe: cpe:2.3:a:buttercms:buttercms:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"meta":'
          - '"data":'
          - '"url":'
        condition: and
