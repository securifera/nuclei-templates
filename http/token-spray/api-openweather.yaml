id: api-openweather

info:
  name: OpenWeather API Test
  author: zzeitlin
  severity: info
  reference:
    - https://openweathermap.org/current
  classification:
    cpe: cpe:2.3:a:openweather:openweather:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: openweather
    product: openweather
  tags: token-spray,weather,openweather

self-contained: true

http:
  - method: GET
    path:
      - "https://api.openweathermap.org/data/2.5/weather?q=Chicago&appid={{token}}"

    matchers:
      - type: word
        name: openweather
        cpe: cpe:2.3:a:openweather:openweather:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"coord":'
          - '"weather":'
          - '"base":'
        condition: and
