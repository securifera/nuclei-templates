id: api-taiga

info:
  name: Taiga API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://docs.taiga.io/api.html
  classification:
    cpe: cpe:2.3:a:taiga:taiga:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: taiga
    product: taiga
  tags: token-spray,taiga

self-contained: true

http:
  - method: GET
    path:
      - "https://api.taiga.io/api/v1/application-tokens"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        name: taiga
        cpe: cpe:2.3:a:taiga:taiga:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"auth_code":'
          - '"state":'
        condition: and
