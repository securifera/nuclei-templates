id: api-ip2whois

info:
  name: IP2WHOIS API Test
  author: daffainfo
  severity: info
  description: WHOIS domain name lookup
  reference:
    - https://www.ip2whois.com/developers-api
    - https://github.com/daffainfo/all-about-apikey/tree/main/ip2whois
  classification:
    cpe: cpe:2.3:a:ip2whois:ip2whois:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ip2whois
    product: ip2whois
  tags: token-spray,ip2whois

self-contained: true

http:
  - method: GET
    path:
      - "https://api.ip2whois.com/v2?key={{token}}&domain=daffa.tech&format=json"

    matchers:
      - type: word
        name: ip2whois
        cpe: cpe:2.3:a:ip2whois:ip2whois:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"domain"'
          - '"domain_id"'
          - '"whois_server"'
        condition: and
