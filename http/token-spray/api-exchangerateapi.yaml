id: api-exchangerateapi

info:
  name: ExchangeRate-API API Test
  author: daffainfo
  severity: info
  description: Free currency conversion
  reference:
    - https://www.exchangerate-api.com/docs/overview
    - https://github.com/daffainfo/all-about-apikey/tree/main/exchangerate-api
  classification:
    cpe: cpe:2.3:a:exchangerateapi:exchangerateapi:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: exchangerateapi
    product: exchangerateapi
  tags: token-spray,exchangerateapi

self-contained: true

http:
  - method: GET
    path:
      - "https://v6.exchangerate-api.com/v6/{{token}}/latest/USD"

    matchers:
      - type: word
        name: exchangerateapi
        cpe: cpe:2.3:a:exchangerateapi:exchangerateapi:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"time_next_update_utc"'
          - '"base_code"'
          - '"conversion_rates"'
        condition: and
