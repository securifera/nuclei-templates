id: api-serpstack

info:
  name: serpstack API Test
  author: daffainfo
  severity: info
  description: Real-Time & Accurate Google Search Results API
  reference:
    - https://serpstack.com/documentation
    - https://github.com/daffainfo/all-about-apikey/tree/main/serpstack
  classification:
    cpe: cpe:2.3:a:serpstack:serpstack:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: serpstack
    product: serpstack
  tags: token-spray,serpstack

self-contained: true

http:
  - method: GET
    path:
      - "http://api.serpstack.com/search?access_key={{token}}&query=mcdonalds"

    matchers:
      - type: word
        name: serpstack
        cpe: cpe:2.3:a:serpstack:serpstack:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"total_time_taken"'
          - '"processed_timestamp"'
          - '"search_url"'
        condition: and
