id: api-bitrise

info:
  name: Bitrise API Test
  author: daffainfo
  severity: info
  description: Build tool and processes integrations to create efficient development pipelines
  reference:
    - https://api-docs.bitrise.io/
    - https://github.com/daffainfo/all-about-apikey/tree/main/bitrise
  classification:
    cpe: cpe:2.3:a:bitrise:bitrise:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: bitrise
    product: bitrise
  tags: token-spray,bitrise

self-contained: true

http:
  - raw:
      - |
        GET https://api.bitrise.io/v0.1/me HTTP/1.1
        Host: api.bitrise.io
        Authorization: {{token}}

    matchers:
      - type: word
        name: bitrise
        cpe: cpe:2.3:a:bitrise:bitrise:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"username":'
          - '"slug":'
          - '"email":'
        condition: and
