id: api-youtube

info:
  name: YouTube API Test
  author: zzeitlin
  severity: info
  reference:
    - https://developers.google.com/youtube/v3/docs
  classification:
    cpe: cpe:2.3:a:youtube:youtube:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: youtube
    product: youtube
  tags: token-spray,youtube

self-contained: true

http:
  - method: GET
    path:
      - "https://www.googleapis.com/youtube/v3/activities?part=contentDetails&maxResults=25&channelId=UC-lHJZR3Gqxm24_Vd_AJ5Yw&key={{token}}"

    matchers:
      - type: word
        name: youtube
        cpe: cpe:2.3:a:youtube:youtube:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"kind":'
          - '"pageInfo":'
        condition: and
