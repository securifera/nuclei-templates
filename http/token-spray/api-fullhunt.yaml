id: api-fullhunt

info:
  name: FullHunt API Test
  author: 0ri2N
  severity: info
  description: |
    FullHunt holds one of the largest Databases for external attack surfaces of the entire Internet.
  reference:
    - https://fullhunt.io
    - https://api-docs.fullhunt.io
  classification:
    cpe: cpe:2.3:a:fullhunt:fullhunt:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: fullhunt
    product: fullhunt
  tags: scan,recon,fullhunt,token-spray

self-contained: true

http:
  - method: GET
    path:
      - https://fullhunt.io/api/v1/domain/interact.sh/details

    headers:
      X-API-Key: "{{token}}"
    matchers:
      - type: word
        name: fullhunt
        cpe: cpe:2.3:a:fullhunt:fullhunt:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"dns"'
          - '"hosts"'
          - '"domain"'
        condition: and
