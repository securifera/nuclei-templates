id: api-notolytix

info:
  name: Notolytix API Test
  author: 0xPugal
  severity: info
  reference:
    - https://notolytix.com/
  classification:
    cpe: cpe:2.3:a:notolytix:notolytix:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: notolytix
    product: notolytix
  tags: notolytix,token-spray

self-contained: true

http:
  - method: GET
    path:
      - "https://api.notolytix.com/1.0/deviceid"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        name: notolytix
        cpe: cpe:2.3:a:notolytix:notolytix:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'realIp":'
          - 'route":'
          - 'deviceId":'
          - 'personaId":'
        condition: and
