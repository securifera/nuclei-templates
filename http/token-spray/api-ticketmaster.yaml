id: api-ticketmaster

info:
  name: Ticket Master API Test
  author: 0xpugal
  severity: info
  reference:
    - https://developer.ticketmaster.com/products-and-docs/apis/getting-started/
  classification:
    cpe: cpe:2.3:a:ticketmaster:ticketmaster:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ticketmaster
    product: ticketmaster
  tags: token-spray,ticketmaster

self-contained: true

http:
  - method: GET
    path:
      - "https://app.ticketmaster.com/discovery/v2/events.json?apikey={{token}}"

    matchers:
      - type: word
        name: ticketmaster
        cpe: cpe:2.3:a:ticketmaster:ticketmaster:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"id"'
          - '"name"'
          - '"type"'
          - '"images"'
        condition: and
