id: api-intercom

info:
  name: Intercom API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://developers.intercom.com/building-apps/docs/rest-api-reference
  classification:
    cpe: cpe:2.3:a:intercom:intercom:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: intercom
    product: intercom
  tags: token-spray,intercom

self-contained: true

http:
  - method: GET
    path:
      - "https://api.intercom.io/users"

    headers:
      Authorization: Bearer {{token}}
      Accept: application/json
    matchers:
      - type: word
        name: intercom
        cpe: cpe:2.3:a:intercom:intercom:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Access Token Invalid"
        negative: true
