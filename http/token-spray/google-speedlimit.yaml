id: api-googlespeedlimit

info:
  name: Google Speed Limit API Test
  author: zzeitlin
  severity: info
  classification:
    cpe: cpe:2.3:a:google:google:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: google
  tags: token-spray,google,speed,limit

self-contained: true

http:
  - method: GET
    path:
      - "https://roads.googleapis.com/v1/speedLimits?path=38.75807927603043,-9.03741754643809&key={{token}}"

    matchers:
      - type: word
        name: google
        cpe: cpe:2.3:a:google:google:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'error'
        negative: true
