id: api-paypal

info:
  name: PayPal API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://developer.paypal.com/docs/api/overview/
  classification:
    cpe: cpe:2.3:a:paypal:paypal:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: paypal
    product: paypal
  tags: token-spray,paypal

self-contained: true

http:
  - method: GET
    path:
      - "https://api-m.sandbox.paypal.com/v1/identity/oauth2/userinfo?schema=paypalv1.1"

    headers:
      Content-Type: application/json
      Authorization: Bearer {{token}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        name: paypal
        cpe: cpe:2.3:a:paypal:paypal:*:*:*:*:*:*:*:*
        negative: true
        regex:
          - "error(_description)?"
