id: api-newrelic

info:
  name: New Relic Rest API
  author: 0xpugal
  severity: info
  reference:
    - https://docs.newrelic.com/docs/apis/rest-api-v2/application-examples-v2/list-your-app-id-metric-timeslice-data-v2
  classification:
    cpe: cpe:2.3:a:newrelic:newrelic:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: newrelic
    product: newrelic
  tags: token-spray,newrelic

self-contained: true

http:
  - raw:
      - |
        GET https://api.newrelic.com/v2/applications.json HTTP/1.1
        Host: api.newrelic.com
        Api-Key: {{token}}

    matchers:
      - type: word
        name: newrelic
        cpe: cpe:2.3:a:newrelic:newrelic:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"applications":'
          - '"application.servers":'
          - '"application.application_hosts":'
        condition: and
