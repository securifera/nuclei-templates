id: api-strava

info:
  name: Strava API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://developers.strava.com/docs/getting-started/
  classification:
    cpe: cpe:2.3:a:strava:strava:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: strava
    product: strava
  tags: token-spray,strava

self-contained: true

http:
  - method: GET
    path:
      - "https://www.strava.com/api/v3/athlete"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        name: strava
        cpe: cpe:2.3:a:strava:strava:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"id"'
          - '"username"'
        condition: and
