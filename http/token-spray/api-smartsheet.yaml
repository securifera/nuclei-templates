id: api-smartsheet

info:
  name: Smartsheet API Test
  author: daffainfo
  severity: info
  description: Allows you to programmatically access and Smartsheet data and account information
  reference:
    - https://smartsheet.redoc.ly/
    - https://github.com/daffainfo/all-about-apikey/tree/main/smartsheet
  classification:
    cpe: cpe:2.3:a:smartsheet:smartsheet:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: smartsheet
    product: smartsheet
  tags: token-spray,smartsheet

self-contained: true

http:
  - method: GET
    path:
      - "https://api.smartsheet.com/2.0/home?include=source"

    headers:
      Authorization: Bearer {{token}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: smartsheet
        cpe: cpe:2.3:a:smartsheet:smartsheet:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"sheets":'
          - '"folders":'
        condition: and
