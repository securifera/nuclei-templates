id: api-safebrowsing

info:
  name: Google Safe Browsing API Test
  author: daffainfo
  severity: info
  description: Google Link/Domain Flagging
  reference:
    - https://developers.google.com/books/docs/overview
    - https://github.com/daffainfo/all-about-apikey/tree/main/google-safe-browsing
  classification:
    cpe: cpe:2.3:a:google:safebrowsing:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: safebrowsing
  tags: token-spray,google,safebrowsing

self-contained: true

http:
  - raw:
      - |
        POST https://safebrowsing.googleapis.com/v4/threatListUpdates:fetch?key={{token}} HTTP/1.1
        Host: safebrowsing.googleapis.com
        Content-Type: application/json

    matchers:
      - type: word
        name: safebrowsing
        cpe: cpe:2.3:a:google:safebrowsing:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"clientId"'
          - '"clientVersion"'
        condition: and
