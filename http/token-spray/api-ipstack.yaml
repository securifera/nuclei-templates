id: api-ipstack

info:
  name: IPStack API Test
  author: zzeitlin
  severity: info
  reference:
    - https://ipstack.com/documentation
  classification:
    cpe: cpe:2.3:a:ipstack:ipstack:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ipstack
    product: ipstack
  tags: token-spray,ipstack

self-contained: true

http:
  - method: GET
    path:
      - "https://api.ipstack.com/8.8.8.8?access_key={{token}}"

    matchers:
      - type: word
        name: ipstack
        cpe: cpe:2.3:a:ipstack:ipstack:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"ip":'
          - '"hostname":'
          - '"type":'
        condition: and
