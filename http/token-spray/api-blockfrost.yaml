id: api-blockfrost

info:
  name: Blockfrost API Test
  author: daffainfo
  severity: info
  description: Interaction with the Cardano mainnet and several testnets
  reference:
    - https://docs.blockfrost.io/
    - https://github.com/daffainfo/all-about-apikey/tree/main/blockfrost
  classification:
    cpe: cpe:2.3:a:blockfrost:blockfrost:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: blockfrost
    product: blockfrost
  tags: token-spray,blockfrost

self-contained: true

http:
  - raw:
      - |
        GET https://cardano-mainnet.blockfrost.io/api/v0/ HTTP/1.1
        Host: cardano-mainnet.blockfrost.io
        project_id: {{token}}

    matchers:
      - type: word
        name: blockfrost
        cpe: cpe:2.3:a:blockfrost:blockfrost:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"url":'
          - '"version":'
        condition: and
