id: api-googleelevation

info:
  name: Google Elevation API Test
  author: zzeitlin
  severity: info
  classification:
    cpe: cpe:2.3:a:google:elevation:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: elevation
  tags: token-spray,google,elevation

self-contained: true

http:
  - method: GET
    path:
      - "https://maps.googleapis.com/maps/api/elevation/json?locations=39.7391536,-104.9847034&key={{token}}"

    matchers:
      - type: word
        name: elevation
        cpe: cpe:2.3:a:google:elevation:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'error_message'
        negative: true
