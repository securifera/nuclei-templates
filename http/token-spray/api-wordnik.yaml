id: api-wordnik

info:
  name: Wordnik API Test
  author: daffainfo
  severity: info
  description: Dictionary Data
  reference:
    - https://developer.wordnik.com/docs
    - https://github.com/daffainfo/all-about-apikey/tree/main/wordnik
  classification:
    cpe: cpe:2.3:a:wordnik:wordnik:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wordnik
    product: wordnik
  tags: token-spray,wordnik

self-contained: true

http:
  - method: GET
    path:
      - "https://api.wordnik.com/v4/word.json/hedgehog/topExample?useCanonical=false&api_key={{token}}"

    matchers:
      - type: word
        name: wordnik
        cpe: cpe:2.3:a:wordnik:wordnik:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"provider"'
          - '"year"'
          - '"rating"'
        condition: and
