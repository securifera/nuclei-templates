id: api-codestats

info:
  name: CodeStats API Test
  author: daffainfo
  severity: info
  description: Automatic time tracking for programmers
  reference:
    - https://codestats.net/api-docs
    - https://github.com/daffainfo/all-about-apikey/tree/main/codestats
  classification:
    cpe: cpe:2.3:a:codestats:codestats:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: codestats
    product: codestats
  tags: token-spray,codestats

self-contained: true

http:
  - raw:
      - |
        POST https://codestats.net/api/my/pulses HTTP/1.1
        Host: codestats.net
        X-API-Token: {{token}}

        {
          "coded_at": "2016-04-24T01:43:56+12:00",
          "xps": [
            {"language": "C++",    "xp": 15},
            {"language": "Elixir", "xp": 30},
            {"language": "EEx",    "xp": 3}
          ]
        }

    matchers:
      - type: word
        name: codestats
        cpe: cpe:2.3:a:codestats:codestats:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"Great success!"'
