id: api-adafruit-io

info:
  name: Adafruit IO API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://io.adafruit.com/api/docs/
  classification:
    cpe: cpe:2.3:a:adafruit:adafruit:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: adafruit
    product: adafruit
  tags: token-spray,adafruit

self-contained: true

http:
  - method: GET
    path:
      - "https://io.adafruit.com/api/v2/user"

    headers:
      X-AIO-Key: "{{token}}"
    matchers:
      - type: word
        name: adafruit
        cpe: cpe:2.3:a:adafruit:adafruit:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"username":'
          - '"id":'
        condition: and
