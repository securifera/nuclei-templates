id: api-holidayapi

info:
  name: Holiday API Test
  author: daffainfo
  severity: info
  description: Historical data regarding holidays
  reference:
    - https://holidayapi.com/docs
    - https://github.com/daffainfo/all-about-apikey/tree/main/holiday-api
  classification:
    cpe: cpe:2.3:a:holidayapi:holidayapi:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: holidayapi
    product: holidayapi
  tags: token-spray,holidayapi

self-contained: true

http:
  - method: GET
    path:
      - "https://holidayapi.com/v1/holidays?pretty&key={{token}}&country=US&year=2020&language=EN"

    matchers:
      - type: word
        name: holidayapi
        cpe: cpe:2.3:a:holidayapi:holidayapi:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"holidays":'
          - '"name":'
          - '"date":'
        condition: and
