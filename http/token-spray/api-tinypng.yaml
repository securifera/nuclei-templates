id: api-tinypng

info:
  name: TinyPNG API Test
  author: zzeitlin
  severity: info
  reference:
    - https://tinypng.com/developers
  classification:
    cpe: cpe:2.3:a:tinypng:tinypng:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: tinypng
    product: tinypng
  tags: token-spray,tinypng

self-contained: true

http:
  - method: POST
    path:
      - "https://api.tinify.com/shrink"

    headers:
      Authorization: Basic {{base64('api:' + token)}}
    matchers:
      - type: word
        name: tinypng
        cpe: cpe:2.3:a:tinypng:tinypng:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'Compression-Count'
          - 'compression-count'
        condition: or
