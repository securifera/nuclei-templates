id: api-malshare

info:
  name: MalShare API Test
  author: daffainfo
  severity: info
  description: Malware Archive / file sourcing
  reference:
    - https://malshare.com/doc.php
    - https://github.com/daffainfo/all-about-apikey/tree/main/malshare
  classification:
    cpe: cpe:2.3:a:malshare:malshare:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: malshare
    product: malshare
  tags: token-spray,malshare

self-contained: true

http:
  - method: GET
    path:
      - "https://api.malshare.com/api.php?api_key={{token}}&action=getlist"

    matchers:
      - type: word
        name: malshare
        cpe: cpe:2.3:a:malshare:malshare:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"md5":'
          - '"sha1":'
        condition: and
