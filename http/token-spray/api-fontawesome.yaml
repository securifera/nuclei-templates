id: api-fontawesome

info:
  name: FontAwesome API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://fontawesome.com/v6.0/docs/apis/graphql/get-started
  classification:
    cpe: cpe:2.3:a:fontawesome:fontawesome:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: fontawesome
    product: fontawesome
  tags: token-spray,fontawesome

self-contained: true

http:
  - method: GET
    path:
      - "https://api.fontawesome.com/token"

    headers:
      Authorization: Bearer {{token}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: fontawesome
        cpe: cpe:2.3:a:fontawesome:fontawesome:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"access_token":'
          - '"scopes":'
        condition: and
