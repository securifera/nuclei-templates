id: api-googleroutetotraveled

info:
  name: Google Route to Traveled API Test
  author: zzeitlin
  severity: info
  classification:
    cpe: cpe:2.3:a:google:google:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: google
  tags: token-spray,google,route

self-contained: true

http:
  - method: GET
    path:
      - "https://roads.googleapis.com/v1/snapToRoads?path=-35.27801,149.12958|-35.28032,149.12907&interpolate=true&key={{token}}"

    matchers:
      - type: word
        name: google
        cpe: cpe:2.3:a:google:google:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'error'
        negative: true
