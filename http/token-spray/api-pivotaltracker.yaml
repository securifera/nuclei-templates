id: api-pivotaltracker

info:
  name: PivotalTracker API Test
  author: zzeitlin
  severity: info
  reference:
    - https://www.pivotaltracker.com/help/api
  classification:
    cpe: cpe:2.3:a:pivotaltracker:pivotaltracker:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: pivotaltracker
    product: pivotaltracker
  tags: token-spray,pivotaltracker

self-contained: true

http:
  - method: GET
    path:
      - "https://www.pivotaltracker.com/services/v5/me"

    headers:
      X-TrackerToken: "{{token}}"
    matchers:
      - type: word
        name: pivotaltracker
        cpe: cpe:2.3:a:pivotaltracker:pivotaltracker:*:*:*:*:*:*:*:*
        part: body
        negative: true
        words:
          - 'invalid_authentication'
          - 'unauthenticated'
