id: api-dropbox

info:
  name: Dropbox API Test
  author: zzeitlin
  severity: info
  reference:
    - https://www.dropbox.com/developers/documentation/http/documentation
  classification:
    cpe: cpe:2.3:a:dropbox:dropbox:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: dropbox
    product: dropbox
  tags: token-spray,dropbox

self-contained: true

http:
  - method: POST
    path:
      - "https://api.dropboxapi.com/2/users/get_current_account"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        name: dropbox
        cpe: cpe:2.3:a:dropbox:dropbox:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"account_id":'
          - '"email":'
        condition: and
