id: api-thedogapi

info:
  name: TheDogApi API Test
  author: daffainfo
  severity: info
  description: Pictures of dogs from Tumblr
  reference:
    - https://docs.thedogapi.com/
    - https://github.com/daffainfo/all-about-apikey/tree/main/thedogapi
  classification:
    cpe: cpe:2.3:a:thedogapi:thedogapi:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: thedogapi
    product: thedogapi
  tags: token-spray,thedogapi

self-contained: true

http:
  - method: GET
    path:
      - "https://api.thedogapi.com/v1/votes"

    headers:
      x-api-key: "{{token}}"
    matchers:
      - type: word
        name: thedogapi
        cpe: cpe:2.3:a:thedogapi:thedogapi:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'id":'
          - 'image_id":'
          - 'sub_id":'
        condition: and
