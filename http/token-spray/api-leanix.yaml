id: api-leanix

info:
  name: LeanIX API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://docs.leanix.net/docs/rest-api
  classification:
    cpe: cpe:2.3:a:leanix:leanix:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: leanix
    product: leanix
  tags: token-spray,leanix

self-contained: true

http:
  - method: GET
    path:
      - "https://us.leanix.net/services/integration-api/v1/examples/starterExample"
      - "https://eu.leanix.net/services/integration-api/v1/examples/starterExample"

    headers:
      Authorization: Bearer {{token}}
    stop-at-first-match: true
    matchers:
      - type: word
        name: leanix
        cpe: cpe:2.3:a:leanix:leanix:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"input":'
          - '"connectorType":'
        condition: and
