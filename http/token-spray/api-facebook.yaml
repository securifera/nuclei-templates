id: api-facebook

info:
  name: Facebook API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://developers.facebook.com/tools/explorer/
  classification:
    cpe: cpe:2.3:a:facebook:facebook:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: facebook
    product: facebook
  tags: token-spray,facebook

self-contained: true

http:
  - method: GET
    path:
      - "https://graph.facebook.com/me?access_token={{token}}"

    matchers-condition: and
    matchers:
      - type: word
        name: facebook
        cpe: cpe:2.3:a:facebook:facebook:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
