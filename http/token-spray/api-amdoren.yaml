id: api-amdoren

info:
  name: Amdoren API Test
  author: daffainfo
  severity: info
  description: Free currency API with over 150 currencies
  reference:
    - https://www.amdoren.com/currency-api/
    - https://github.com/daffainfo/all-about-apikey/tree/main/amdoren
  classification:
    cpe: cpe:2.3:a:amdoren:amdoren:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: amdoren
    product: amdoren
  tags: token-spray,amdoren

self-contained: true

http:
  - method: GET
    path:
      - "https://www.amdoren.com/api/currency.php?api_key={{token}}&from=USD&to=EUR"

    matchers:
      - type: word
        name: amdoren
        cpe: cpe:2.3:a:amdoren:amdoren:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"error" : 0'
          - '"error_message" : "-"'
        condition: and
