id: api-pendo

info:
  name: Pendo API Test
  author: zzeitlin
  severity: info
  reference:
    - https://help.pendo.io/resources/support-library/api/index.html
  classification:
    cpe: cpe:2.3:a:pendo:pendo:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: pendo
    product: pendo
  tags: token-spray,pendo

self-contained: true

http:
  - method: GET
    path:
      - "https://app.pendo.io/api/v1/feature"

    headers:
      Content-Type: application/json
      X-Pendo-Integration-Key: "{{token}}"
    matchers:
      - type: word
        name: pendo
        cpe: cpe:2.3:a:pendo:pendo:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"createdByUser":'
          - '"id":'
        condition: and
