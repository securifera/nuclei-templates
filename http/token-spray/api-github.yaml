id: api-github

info:
  name: GitHub API Test
  author: zzeitlin
  severity: info
  reference:
    - https://docs.github.com/en/rest/reference/users
  classification:
    cpe: cpe:2.3:a:github:github:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: github
    product: github
  tags: token-spray,github

self-contained: true

http:
  - method: GET
    path:
      - "https://api.github.com/user"

    headers:
      Authorization: Basic {{base64('user:' + token)}}
    matchers:
      - type: word
        name: github
        cpe: cpe:2.3:a:github:github:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"login":'
          - '"avatar_url":'
        condition: and
