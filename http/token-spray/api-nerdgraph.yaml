id: api-nerdgraph

info:
  name: New Relic NerdGraph API Test
  author: zzeitlin
  severity: info
  reference:
    - https://docs.newrelic.com/docs/apis/nerdgraph/get-started/introduction-new-relic-nerdgraph/
  classification:
    cpe: cpe:2.3:a:nerdgraph:nerdgraph:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: nerdgraph
    product: nerdgraph
  tags: token-spray,newrelic,nerdgraph

self-contained: true

http:
  - method: POST
    path:
      - "https://api.newrelic.com/graphql"

    headers:
      Content-Type: application/json
      API-Key: "{{token}}"

    body: "{ \"query\":  \"{ requestContext { userId apiKey }}\" }"
    matchers:
      - type: word
        name: nerdgraph
        cpe: cpe:2.3:a:nerdgraph:nerdgraph:*:*:*:*:*:*:*:*
        part: body
        negative: true
        words:
          - 'errors'
