id: api-alienvault

info:
  name: AlienVault Open Threat Exchange (OTX) API Test
  author: daffainfo
  severity: info
  description: IP/domain/URL reputation
  reference:
    - https://otx.alienvault.com/api
    - https://github.com/daffainfo/all-about-apikey/tree/main/alienvault-open-threat-exchange
  classification:
    cpe: cpe:2.3:a:alienvault:alienvault:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: alienvault
    product: alienvault
  tags: token-spray,alienvault,exchange

self-contained: true

http:
  - raw:
      - |
        GET https://otx.alienvault.com/api/v1/pulses/subscribed?page=1 HTTP/1.1
        Host: otx.alienvault.com
        X-OTX-API-KEY: {{token}}

    matchers:
      - type: word
        name: alienvault
        cpe: cpe:2.3:a:alienvault:alienvault:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"$schema":'
          - '"properties":'
        condition: and
