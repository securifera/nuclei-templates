id: api-trello

info:
  name: Trello API Test
  author: daffainfo
  severity: info
  description: Boards, lists and cards to help you organize and prioritize your projects
  reference:
    - https://developers.trello.com/
    - https://github.com/daffainfo/all-about-apikey/tree/main/trello
  classification:
    cpe: cpe:2.3:a:trello:trello:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: trello
    product: trello
  tags: token-spray,trello

self-contained: true

http:
  - method: GET
    path:
      - "https://api.trello.com/1/members/me?key={{key}}&token={{token}}"

    matchers:
      - type: word
        name: trello
        cpe: cpe:2.3:a:trello:trello:*:*:*:*:*:*:*:*
        part: body
        negative: true
        words:
          - 'invalid key'
