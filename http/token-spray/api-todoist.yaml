id: api-todoist

info:
  name: Todoist API Test
  author: daffainfo
  severity: info
  description: Todo Lists
  reference:
    - https://developer.todoist.com/rest/v1/#overview
    - https://github.com/daffainfo/all-about-apikey/tree/main/todoist
  classification:
    cpe: cpe:2.3:a:todoist:todoist:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: todoist
    product: todoist
  tags: token-spray,todoist

self-contained: true

http:
  - raw:
      - |
        GET https://api.todoist.com/rest/v1/projects HTTP/1.1
        Host: api.todoist.com
        Authorization: Bearer {{token}}

    matchers:
      - type: word
        name: todoist
        cpe: cpe:2.3:a:todoist:todoist:*:*:*:*:*:*:*:*
        part: body
        words:
          - "id"
          - "color"
          - "name"
        condition: and
