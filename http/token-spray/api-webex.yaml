id: api-webex

info:
  name: Cisco Webex API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://developer.webex.com/docs/getting-started
  classification:
    cpe: cpe:2.3:a:webex:webex:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: webex
    product: webex
  tags: token-spray,cisco,webex

self-contained: true

http:
  - method: GET
    path:
      - "https://webexapis.com/v1/rooms"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        name: webex
        cpe: cpe:2.3:a:webex:webex:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'id'
          - 'title'
          - 'type'
        condition: and
