id: api-iucn

info:
  name: IUCN API Test
  author: daffainfo
  severity: info
  description: IUCN Red List of Threatened Species
  reference:
    - http://apiv3.iucnredlist.org/api/v3/docs
    - https://github.com/daffainfo/all-about-apikey/tree/main/iucn
  classification:
    cpe: cpe:2.3:a:iucn:iucn:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: iucn
    product: iucn
  tags: token-spray,iucn

self-contained: true

http:
  - method: GET
    path:
      - "http://apiv3.iucnredlist.org/api/v3/country/list?token={{token}}"

    matchers:
      - type: word
        name: iucn
        cpe: cpe:2.3:a:iucn:iucn:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'taxonid'
          - 'scientific_name'
          - 'subspecies'
        condition: and
