id: api-coinranking

info:
  name: Coinranking API Test
  author: daffainfo
  severity: info
  description: Live Cryptocurrency data
  reference:
    - https://developers.coinranking.com/api/documentation
    - https://github.com/daffainfo/all-about-apikey/tree/main/coinranking
  classification:
    cpe: cpe:2.3:a:coinranking:coinranking:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: coinranking
    product: coinranking
  tags: token-spray,coinranking

self-contained: true

http:
  - raw:
      - |
        GET https://api.coinranking.com/v2/exchanges HTTP/1.1
        Host: api.coinranking.com
        x-access-token: {{token}}

    matchers:
      - type: word
        name: coinranking
        cpe: cpe:2.3:a:coinranking:coinranking:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"exchanges"'
          - '"coinrankingUrl"'
          - '"uuid"'
        condition: and
