id: api-mapbox

info:
  name: Mapbox API Test
  author: zzeitlin
  severity: info
  reference:
    - https://docs.mapbox.com/api/search/geocoding/
  classification:
    cpe: cpe:2.3:a:mapbox:mapbox:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: mapbox
    product: mapbox
  tags: token-spray,mapbox

self-contained: true

http:
  - method: GET
    path:
      - "https://api.mapbox.com/geocoding/v5/mapbox.places/Los%20Angeles.json?access_token={{token}}"

    matchers:
      - type: word
        name: mapbox
        cpe: cpe:2.3:a:mapbox:mapbox:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'type'
          - 'query'
          - 'features'
        condition: and
