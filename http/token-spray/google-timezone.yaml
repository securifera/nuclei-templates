id: api-googletimezone

info:
  name: Google Timezone API Test
  author: zzeitlin
  severity: info
  classification:
    cpe: cpe:2.3:a:google:timezone:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: timezone
  tags: token-spray,google,timezone

self-contained: true

http:
  - method: GET
    path:
      - "https://maps.googleapis.com/maps/api/timezone/json?location=39.6034810,-119.6822510&timestamp=1331161200&key={{token}}"

    matchers:
      - type: word
        name: timezone
        cpe: cpe:2.3:a:google:timezone:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'errorMessage'
        negative: true
