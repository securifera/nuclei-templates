id: api-googlefcm

info:
  name: Google FCM API Test
  author: zzeitlin
  severity: info
  classification:
    cpe: cpe:2.3:a:google:fcm:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: fcm
  tags: token-spray,google,fcm,firebase,cloud,messaging

self-contained: true

http:
  - method: POST
    path:
      - "https://fcm.googleapis.com/fcm/send"

    body: "{'registration_ids':['ABC']}"

    headers:
      Authorization: key={{token}}
      Content-Type: application/json
    matchers:
      - type: status
        status:
          - 200
