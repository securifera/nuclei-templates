id: api-googlegeolocation

info:
  name: Google Geolocation API Test
  author: zzeitlin
  severity: info
  classification:
    cpe: cpe:2.3:a:google:geolocation:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: geolocation
  tags: token-spray,google,geolocation

self-contained: true

http:
  - method: GET
    path:
      - "https://www.googleapis.com/geolocation/v1/geolocate?key={{token}}"

    matchers-condition: and
    matchers:
      - type: word
        name: geolocation
        cpe: cpe:2.3:a:google:geolocation:*:*:*:*:*:*:*:*
        part: body
        negative: true
        words:
          - 'error'

      - type: status
        negative: true
        status:
          - 404
