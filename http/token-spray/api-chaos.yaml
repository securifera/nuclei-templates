id: api-chaos

info:
  name: Chaos API Test
  author: 0ri2N
  severity: info
  reference:
    - https://chaos.projectdiscovery.io/#/docs
  classification:
    cpe: cpe:2.3:a:chaos:chaos:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: chaos
    product: chaos
  tags: recon,chaos,token-spray,projectdiscovery

self-contained: true

http:
  - method: GET
    path:
      - "https://dns.projectdiscovery.io/dns/projectdiscovery.io"

    headers:
      Authorization: "{{token}}"
    matchers:
      - type: word
        name: chaos
        cpe: cpe:2.3:a:chaos:chaos:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"domain":'
          - '"subdomains":'
        condition: and
