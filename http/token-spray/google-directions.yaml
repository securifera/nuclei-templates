id: api-googledirections

info:
  name: Google Directions API Test
  author: zzeitlin
  severity: info
  classification:
    cpe: cpe:2.3:a:google:directions:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: directions
  tags: token-spray,google,directions

self-contained: true

http:
  - method: GET
    path:
      - "https://maps.googleapis.com/maps/api/directions/json?origin=Disneyland&destination=Universal+Studios+Hollywood4&key={{token}}"

    matchers:
      - type: word
        name: directions
        cpe: cpe:2.3:a:google:directions:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'error_message'
        negative: true
