id: api-block

info:
  name: block.io API Test
  author: daffainfo
  severity: info
  description: Bitcoin Payment, Wallet & Transaction Data
  reference:
    - https://block.io/docs/basic
    - https://github.com/daffainfo/all-about-apikey/tree/main/block
  classification:
    cpe: cpe:2.3:a:block:block:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: block
    product: block
  tags: token-spray,block

self-contained: true

http:
  - method: GET
    path:
      - "https://block.io/api/v2/get_balance/?api_key={{token}}"

    matchers:
      - type: word
        name: block
        cpe: cpe:2.3:a:block:block:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"network"'
          - '"available_balance"'
          - '"pending_received_balance"'
        condition: and
