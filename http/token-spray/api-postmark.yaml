id: api-postmark

info:
  name: PostMark API Test
  author: zzeitlin
  severity: info
  reference:
    - https://postmarkapp.com/developer/api/overview
  classification:
    cpe: cpe:2.3:a:postmark:postmark:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: postmark
    product: postmark
  tags: token-spray,postmark

self-contained: true

http:
  - method: GET
    path:
      - "https://api.postmarkapp.com/server"

    headers:
      Accept: application/json
      X-Postmark-Server-Token: "{{token}}"
    matchers:
      - type: word
        name: postmark
        cpe: cpe:2.3:a:postmark:postmark:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"ID":'
          - '"Name":'
          - '"ApiTokens":'
        condition: and
