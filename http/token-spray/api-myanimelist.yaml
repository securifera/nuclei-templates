id: api-myanimelist

info:
  name: MyAnimeList API Test
  author: daffainfo
  severity: info
  description: Anime and Manga Database and Community
  reference:
    - https://myanimelist.net/apiconfig/references/api/v2
    - https://github.com/daffainfo/all-about-apikey/tree/main/myanimelist
  classification:
    cpe: cpe:2.3:a:myanimelist:myanimelist:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: myanimelist
    product: myanimelist
  tags: token-spray,myanimelist

self-contained: true

http:
  - method: GET
    path:
      - "https://api.myanimelist.net/v2/anime?q=one&limit=4"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        name: myanimelist
        cpe: cpe:2.3:a:myanimelist:myanimelist:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"data":'
          - '"paging":'
          - '"next":'
        condition: and
