id: wordpress-themes-detect

info:
  name: WordPress Theme Detection
  author: 0xcrypto
  severity: info
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    max-request: 24434
    vendor: wordpress
    product: wordpress
  tags: fuzz,wordpress,fuzzing,vuln

http:
  - raw:
      - |
        GET /wp-content/themes/{{themeSlug}}/readme.txt HTTP/1.1
        Host: {{Hostname}}

    payloads:
      themeSlug: helpers/wordlists/wordpress-themes.txt

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: wordpress
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        words:
          - "== Description =="
