id: homer-panel

info:
  name: Homer Panel - Detect
  author: rxerium
  severity: info
  description: |
    A simple static homepage was discovered
  reference:
    - https://github.com/bastienwirtz/homer
    - https://homer-demo.netlify.app/
  classification:
    cpe: cpe:2.3:a:homer:homer:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-417785140
    vendor: homer
    product: homer
  tags: panel,homer,detect,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.html"

    matchers-condition: and
    matchers:
      - type: word
        name: homer
        cpe: cpe:2.3:a:homer:homer:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Homer</title>'

      - type: status
        status:
          - 200
