id: saia-pcd-panel

info:
  name: Saia PCD Web Server Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: |
    Saia PCD Web Server panel was detected.
  classification:
    cpe: cpe:2.3:a:saia:pcd:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: html:"Saia PCD Web Server"
    vendor: saia
    product: pcd
  tags: saia,login,panel,pcd,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/pwdform.htm"

    matchers-condition: and
    matchers:
      - type: word
        name: pcd
        cpe: cpe:2.3:a:saia:pcd:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Saia PCD Web Server</title>"

      - type: status
        status:
          - 200
