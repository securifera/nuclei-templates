id: librespeed-panel

info:
  name: LibreSpeed Panel - Detect
  author: ritikchaddha
  severity: info
  description: |
    LibreSpeed is a very lightweight speed test implemented in Javascript, using XMLHttpRequest and Web Workers.
  reference:
    - https://github.com/librespeed/speedtest
  classification:
    cpe: cpe:2.3:a:librespeed:librespeed:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"LibreSpeed"
    vendor: librespeed
    product: librespeed
  tags: panel,librespeed,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: librespeed
        cpe: cpe:2.3:a:librespeed:librespeed:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'LibreSpeed'
          - 'Ping'
          - 'Jitter'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
