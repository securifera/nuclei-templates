id: gxd5-pacs-connexion-utilisateur

info:
  name: GXD5 Pacs Connexion Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: GXD5 Pacs Connexion panel was detected.
  classification:
    cpe: cpe:2.3:a:pacs-connexion-utilisateur:pacs-connexion-utilisateur:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"GXD5 Pacs Connexion utilisateur"
    vendor: pacs-connexion-utilisateur
    product: pacs-connexion-utilisateur
  tags: panel,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: pacs-connexion-utilisateur
        cpe: cpe:2.3:a:pacs-connexion-utilisateur:pacs-connexion-utilisateur:*:*:*:*:*:*:*:*
        words:
          - '<title>GXD5 Pacs Connexion utilisateur</title>'

      - type: status
        status:
          - 200
