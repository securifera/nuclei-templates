id: fortirecorder-panel

info:
  name: FortiRecorder Panel - Detect
  author: rxerium
  severity: info
  description: |
    FortiRecorder Panel was discovered.
  reference:
    - https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/FortiRecorder.pdf
  classification:
    cpe: cpe:2.3:a:fortirecorder:fortirecorder:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    shodan-query: title:FortiRecorder
    fofa-query: title="FortiRecorder"
    vendor: fortirecorder
    product: fortirecorder
  tags: fortinet,fortirecorder,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/"

    matchers-condition: and
    matchers:
      - type: word
        name: fortirecorder
        cpe: cpe:2.3:a:fortirecorder:fortirecorder:*:*:*:*:*:*:*:*
        words:
          - "FortiRecorder Admin"
          - "Log In"
        condition: and

      - type: status
        status:
          - 200
