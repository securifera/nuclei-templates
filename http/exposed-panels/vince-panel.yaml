id: vince-panel

info:
  name: Vince Login Panel - Detect
  author: righettod
  severity: info
  description: |
    Vince products was detected.
  reference:
    - https://github.com/vinceanalytics/vince
    - https://www.vinceanalytics.com/
  classification:
    cpe: cpe:2.3:a:vince:vince:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    vendor: vince
    product: vince
  tags: panel,vince,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers:
      - type: dsl
        name: vince
        cpe: cpe:2.3:a:vince:vince:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "vince - high performance", "vince · open source web", "Welcome to Vince")'
        condition: and
