id: mitric-checker-panel

info:
  name: Mitric Checker Login Panel - Detect
  author: righettod
  severity: info
  description: |
    Mitric Checker login panel was detected.
  reference:
    - https://www.mitric.com/en/audit-with-checker/
  classification:
    cpe: cpe:2.3:a:mitric:mitric:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: mitric
    product: mitric
  tags: panel,mitric,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/QSA/Login.aspx"
      - "{{BaseURL}}/API/External/GetPrivacy"

    stop-at-first-match: true

    matchers:
      - type: dsl
        name: mitric
        cpe: cpe:2.3:a:mitric:mitric:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "/checker/", "bg-blue-checker", "checker platform")'
        condition: and
