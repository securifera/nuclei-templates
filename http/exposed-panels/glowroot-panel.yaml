id: glowroot-panel

info:
  name: Glowroot - Panel
  author: DhiyaneshDk
  severity: info
  reference:
    - https://www.facebook.com/photo?fbid=618105097026680&set=a.467014098802448
  classification:
    cpe: cpe:2.3:a:glowroot:glowroot:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Glowroot"
    vendor: glowroot
    product: glowroot
  tags: panel,login,glowroot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        name: glowroot
        cpe: cpe:2.3:a:glowroot:glowroot:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Glowroot'
          - 'Change my password'
        condition: and

      - type: status
        status:
          - 200
