id: achecker-panel

info:
  name: AChecker Login - Panel Detect
  author: princechaddha
  severity: info
  description: AChecker login panel was detected.
  reference:
    - https://achecker.achecks.ca/checker/index.php
  classification:
    cpe: cpe:2.3:a:achecker:achecker:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: achecker
    product: achecker
  tags: panel,achecker,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/checker/login.php"

    matchers-condition: and
    matchers:
      - type: word
        name: achecker
        cpe: cpe:2.3:a:achecker:achecker:*:*:*:*:*:*:*:*
        part: body
        words:
          - ": Web Accessibility Checker</title>"
          - "AChecker - Copyright"
        condition: and

      - type: status
        status:
          - 200
