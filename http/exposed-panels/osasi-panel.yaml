id: osasi-panel

info:
  name: OSASI Login - Panel
  author: biero-el-corridor
  severity: info
  description: |
    OSASI Login panel was discovered.
  classification:
    cpe: cpe:2.3:a:osasi:osasi:*:*:*:*:*:*:*:*
  metadata:
    shodan-query: html:"/css/osasiasp.css"
    verified: true
    max-request: 1
    vendor: osasi
    product: osasi
  tags: osasi,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/users/login"

    matchers-condition: and
    matchers:
      - type: word
        name: osasi
        cpe: cpe:2.3:a:osasi:osasi:*:*:*:*:*:*:*:*
        part: body
        words:
          - "/img/osasil_logo_f.png"
          - "UserLoginid"
        condition: and

      - type: status
        status:
          - 200
