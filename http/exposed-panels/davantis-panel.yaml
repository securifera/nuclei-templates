id: davantis-panel

info:
  name: Davantis Video Analytics Panel - Detect
  author: robotshell
  severity: info
  description: Davantis Video Analytics panel was detected.
  classification:
    cpe: cpe:2.3:a:davantis:davantis:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Davantis"
    vendor: davantis
    product: davantis
  tags: panel,davantis,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/index.html'

    matchers-condition: and
    matchers:
      - type: word
        name: davantis
        cpe: cpe:2.3:a:davantis:davantis:*:*:*:*:*:*:*:*
        words:
          - '<title>Davantis</title>'

      - type: status
        status:
          - 200
