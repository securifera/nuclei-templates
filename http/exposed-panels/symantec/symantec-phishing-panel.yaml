id: symantec-phishing-panel

info:
  name: Symantec Phishing Readiness Platform Console
  author: andreluna
  severity: info
  description: Management Console for Symantec Phishing Readiness Platform
  reference:
    - https://www.broadcom.com/products/cybersecurity/email/phishing-readiness
  classification:
    cpe: cpe:2.3:a:symantec:symantec:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: symantec
    product: symantec
  tags: symantec,panel,login,discovery

self-contained: true
variables:
  company: "{{company}}"

http:
  - raw:
      - |
        GET /users/sign_in HTTP/1.1
        Host: {{company}}.securitytraining.io

    redirects: true

    matchers-condition: and
    matchers:
      - type: word
        name: symantec
        cpe: cpe:2.3:a:symantec:symantec:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Symantec Phishing Readiness Platform</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: dsl
        dsl:
          - company
