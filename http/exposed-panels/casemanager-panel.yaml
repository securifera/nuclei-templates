id: casemanager-panel

info:
  name: CaseManager Login Panel - Detect
  author: ffffffff0x
  severity: info
  description: CaseManager login panel was detected.
  classification:
    cpe: cpe:2.3:a:casemanager:casemanager:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    fofa-query: title="CaseManager"
    vendor: casemanager
    product: casemanager
  tags: casemanager,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        name: casemanager
        cpe: cpe:2.3:a:casemanager:casemanager:*:*:*:*:*:*:*:*
        words:
          - "<title>CaseManager</title>"

      - type: status
        status:
          - 200
