id: rstudio-panel

info:
  name: RStudio Sign In Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: |
    RStudio Sign In panel was detected.
  classification:
    cpe: cpe:2.3:a:rstudio:rstudio:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: title:"RStudio Sign In"
    vendor: rstudio
    product: rstudio
  tags: rstudio,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth-sign-in?appUri=%2F"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: rstudio
        cpe: cpe:2.3:a:rstudio:rstudio:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>RStudio Sign In</title>"

      - type: status
        status:
          - 200
