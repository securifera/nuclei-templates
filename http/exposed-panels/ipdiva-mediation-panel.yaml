id: ipdiva-mediation-panel

info:
  name: IPdiva Mediation Login Panel - Detect
  author: ritikchaddha
  severity: info
  description: IPdiva Mediation login panel was detected.
  classification:
    cpe: cpe:2.3:a:ipdiva:mediation:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 3
    shodan-query: http.html:"IPdiva"
    vendor: ipdiva
    product: mediation
  tags: panel,ipdiva,mediation,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/mediation/domains"
      - "{{BaseURL}}/mediation/authenticate"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: word
        name: mediation
        cpe: cpe:2.3:a:ipdiva:mediation:*:*:*:*:*:*:*:*
        part: header
        words:
          - "IPdiva mediation"

      - type: word
        name: mediation-2
        cpe: cpe:2.3:a:ipdiva:mediation:*:*:*:*:*:*:*:*
        part: body
        words:
          - "IPdiva Secure"
