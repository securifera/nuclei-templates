id: vigor-login

info:
  name: Vigor Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Vigor login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6610
  classification:
    cpe: cpe:2.3:a:vigor:vigor:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: vigor
    product: vigor
  tags: panel,login,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/weblogin.htm'

    matchers-condition: and
    matchers:
      - type: word
        name: vigor
        cpe: cpe:2.3:a:vigor:vigor:*:*:*:*:*:*:*:*
        words:
          - '<title>Vigor Login Page</title>'

      - type: status
        status:
          - 200
