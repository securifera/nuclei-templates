id: bonita-portal-panel

info:
  name: Bonita Portal Login - Detect
  author: DhiyaneshDK
  severity: info
  description: |
    Detects the presence of Bonita Portal login page.
  classification:
    cpe: cpe:2.3:a:bonita:bonita:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-1197926023
    vendor: bonita
    product: bonita
  tags: bonita,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/bonita/login.jsp"

    matchers-condition: and
    matchers:
      - type: word
        name: bonita
        cpe: cpe:2.3:a:bonita:bonita:*:*:*:*:*:*:*:*
        words:
          - "Bonita Portal"

      - type: status
        status:
          - 200
