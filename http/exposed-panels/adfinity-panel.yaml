id: adfinity-panel

info:
  name: Adfinity Login Panel - Detect
  author: righettod
  severity: info
  description: |
    Adfinity products was detected.
  reference:
    - https://easi.net/en/solutions/adfinity
  classification:
    cpe: cpe:2.3:a:adfinity:adfinity:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.html:"Adfinity"
    vendor: adfinity
    product: adfinity
  tags: panel,adfinity,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/adfinity/login"

    matchers:
      - type: dsl
        name: adfinity
        cpe: cpe:2.3:a:adfinity:adfinity:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "adfinity web application", "adfinity web access", "csrf_adfinity_token")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)Version\s+Adfinity([0-9.]+)'
