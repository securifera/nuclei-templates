id: splunk-login

info:
  name: Splunk SOAR Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Splunk SOAR login panel was detected.
  classification:
    cpe: cpe:2.3:a:splunk:splunk:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Splunk SOAR"
    vendor: splunk
    product: splunk
  tags: panel,splunk,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login?next=/'

    matchers-condition: and
    matchers:
      - type: word
        name: splunk
        cpe: cpe:2.3:a:splunk:splunk:*:*:*:*:*:*:*:*
        words:
          - '<title>Splunk SOAR</title>'

      - type: status
        status:
          - 200
