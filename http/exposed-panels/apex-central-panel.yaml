id: apex-central-panel

info:
  name: TrendMicro Apex Central Login - Panel
  author: darses
  severity: info
  description: |
    TrendMicro Apex Central Login Panel was discovered..
  classification:
    cpe: cpe:2.3:a:apex-central:apex-central:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apex-central
    product: apex-central
  tags: panel,trendmicro,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/webapp/login.html"

    matchers-condition: and
    matchers:
      - type: word
        name: apex-central
        cpe: cpe:2.3:a:apex-central:apex-central:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Login</title>"
          - "images/logo_trend_20.png"
          - "Action=GetLogonInfo"
        condition: and

      - type: status
        status:
          - 200
