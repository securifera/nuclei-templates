id: m-bus-panel

info:
  name: M-Bus Converter Web Interface - Detect
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:m-bus:m-bus:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"JC-e converter webinterface"
    vendor: m-bus
    product: m-bus
  tags: panel,login,m-bus,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: m-bus
        cpe: cpe:2.3:a:m-bus:m-bus:*:*:*:*:*:*:*:*
        words:
          - '<title>JC-e converter webinterface</title>'

      - type: status
        status:
          - 200
