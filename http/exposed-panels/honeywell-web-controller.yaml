id: honeywell-web-controller

info:
  name: Honeywell Excel Web Control Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Honeywell Excel Web Control login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/7130
  classification:
    cpe: cpe:2.3:a:honeywell-web:honeywell-web:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: honeywell-web
    product: honeywell-web
  tags: edb,panel,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/standard/default.php'

    matchers-condition: and
    matchers:
      - type: word
        name: honeywell-web
        cpe: cpe:2.3:a:honeywell-web:honeywell-web:*:*:*:*:*:*:*:*
        words:
          - '<title>Honeywell XL Web Controller</title>'

      - type: status
        status:
          - 200
