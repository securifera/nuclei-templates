id: hookbot-rat

info:
  name: Hookbot Rat Panel - Detect
  author: pussycat0x
  severity: info
  description: |
    Hookbot panel were detected.
  classification:
    cpe: cpe:2.3:a:hookbot:rat:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"hookbot"
    vendor: hookbot
    product: rat
  tags: tech,rat,hookbot,c2,panel,detect,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        name: rat
        cpe: cpe:2.3:a:hookbot:rat:*:*:*:*:*:*:*:*
        dsl:
          - "status_code == 200 && contains(body, 'HOOKBOT PANEL')"
