id: nh-c2

info:
  name: NH C2 Server - Detect
  author: pussycat0
  severity: info
  reference:
    - https://twitter.com/MichalKoczwara/status/1616179246216396806
  classification:
    cpe: cpe:2.3:a:nh:nh:*:*:*:*:*:*:*:*
  metadata:
    verified: "true"
    max-request: 1
    censys-query: 10baf5fcdde4563d3e145a1f553ae433fb1c3572
    vendor: nh
    product: nh
  tags: tech,nh,c2,panel,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: nh
        cpe: cpe:2.3:a:nh:nh:*:*:*:*:*:*:*:*
        dsl:
          - "status_code == 301 && status_code == 302"
          - "(\"03609e8e4a0a0ef888327d64ae2dc8950664219e\" == sha1(body))"
        condition: and
