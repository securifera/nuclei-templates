id: sap-hana-xsengine-panel

info:
  name: SAP HANA XS Engine Admin Login Panel - Detect
  author: PR3R00T
  severity: info
  description: SAP HANA XS Engine admin login panel was detected.
  classification:
    cpe: cpe:2.3:a:sap:sap:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: sap
    product: sap
  tags: panel,sap,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/sap/hana/xs/formLogin/login.html"

    host-redirects: true
    matchers:
      - type: word
        name: sap
        cpe: cpe:2.3:a:sap:sap:*:*:*:*:*:*:*:*
        words:
          - "/sap/hana/xs/formLogin/images/sap.png"
        part: body
