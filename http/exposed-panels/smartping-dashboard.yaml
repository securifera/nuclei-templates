id: smartping-dashboard

info:
  name: SmartPing Dashboard Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: SmartPing Dashboard panel was detected.
  classification:
    cpe: cpe:2.3:a:smartping:smartping:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"SmartPing Dashboard"
    vendor: smartping
    product: smartping
  tags: panel,misconfig,unauth,smartping,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/config.html"

    matchers-condition: and
    matchers:
      - type: word
        name: smartping
        cpe: cpe:2.3:a:smartping:smartping:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'SmartPing Dashboard'

      - type: status
        status:
          - 200
