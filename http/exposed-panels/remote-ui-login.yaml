id: remote-ui-login

info:
  name: Canon Remote UI Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Canon Remote UI login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6815
  classification:
    cpe: cpe:2.3:a:remote:remote:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: remote
    product: remote
  tags: panel,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login.html'

    matchers-condition: and
    matchers:
      - type: word
        name: remote
        cpe: cpe:2.3:a:remote:remote:*:*:*:*:*:*:*:*
        words:
          - '<th>System Manager ID:</th>'

      - type: status
        status:
          - 200
