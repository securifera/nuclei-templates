id: user-control-panel

info:
  name: User Control Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: User Control Panel was detected.
  classification:
    cpe: cpe:2.3:a:user-control:user-control:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: title:"User Control Panel"
    vendor: user-control
    product: user-control
  tags: panel,ucp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: user-control
        cpe: cpe:2.3:a:user-control:user-control:*:*:*:*:*:*:*:*
        words:
          - "<title>User Control Panel</title>"
