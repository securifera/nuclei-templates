id: i-librarian-panel

info:
  name: I-Librarian Panel - Detect
  author: s4e-io
  severity: info
  description: |
    I Librarian panel was discovered.
  reference:
    - https://github.com/mkucej/i-librarian-free
    - https://github.com/mkucej/i-librarian
  classification:
    cpe: cpe:2.3:a:i-librarian:i-librarian:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: "I, Librarian"
    vendor: i-librarian
    product: i-librarian
  tags: panel,login,i-librarian,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        name: i-librarian
        cpe: cpe:2.3:a:i-librarian:i-librarian:*:*:*:*:*:*:*:*
        dsl:
          - 'contains_any(body, "<title>I, Librarian", "I, Librarian Free")'
          - 'status_code == 200'
        condition: and
