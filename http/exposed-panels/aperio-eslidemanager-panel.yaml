id: aperio-eslidemanager-panel

info:
  name: Aperio eSlideManager - Panel
  author: Th3l0newolf
  severity: info
  description: |
    Aperio eSlideManager Login Panel was discovered.
  reference:
    - https://www.leicabiosystems.com/digital-pathology/eslidemanager/
  classification:
    cpe: cpe:2.3:a:aperio:eslidemanager:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"eSlideManager - Login"
    vendor: aperio
    product: eslidemanager
  tags: aperio,eslidemanager,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php"

    matchers-condition: and
    matchers:
      - type: word
        name: eslidemanager
        cpe: cpe:2.3:a:aperio:eslidemanager:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<TITLE>eSlideManager - Login</TITLE>"

      - type: status
        status:
          - 200
