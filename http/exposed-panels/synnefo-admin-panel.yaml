id: synnefo-admin-panel

info:
  name: Synnefo Admin Login Panel - Detect
  author: impramodsargar
  severity: info
  description: Synnefo Admin login panel was detected.
  classification:
    cpe: cpe:2.3:a:synnefo:synnefo:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: synnefo
    product: synnefo
  tags: panel,synnefo,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/synnefoclient/"

    matchers-condition: and
    matchers:
      - type: word
        name: synnefo
        cpe: cpe:2.3:a:synnefo:synnefo:*:*:*:*:*:*:*:*
        words:
          - '<title>Synnefo Admin</title>'

      - type: status
        status:
          - 200
