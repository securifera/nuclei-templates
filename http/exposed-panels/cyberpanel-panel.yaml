id: cyberpanel-panel

info:
  name: Cyberpanel Login Panel - Detect
  author: mailler
  severity: info
  description: |
    Cyberpanel login panel was detected.
  reference:
    - https://cyberpanel.net/KnowledgeBase/
  classification:
    cpe: cpe:2.3:a:cyberpanel:cyberpanel:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: html:"cyberpanel"
    fofa-query: app="Cyberpanel"
    product: cyberpanel
    vendor: cyberpanel
  tags: cyberpanel,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        name: cyberpanel
        cpe: cpe:2.3:a:cyberpanel:cyberpanel:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "<title>(.*)CyberPanel(.*)</title>"

      - type: status
        status:
          - 200
