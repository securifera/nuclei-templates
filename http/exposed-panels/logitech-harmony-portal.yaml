id: logitech-harmony-portal

info:
  name: Logitech Harmony Pro Installer Portal Login Panel - Detect
  author: ritikchaddha
  severity: info
  description: Logitech Harmony Pro Installer Portal login panel was detected.
  classification:
    cpe: cpe:2.3:a:logitech:harmony:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Logitech Harmony Pro Installer"
    vendor: logitech
    product: harmony
  tags: panel,logitech,harmony,exposure,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/portal/login'

    matchers-condition: and
    matchers:
      - type: word
        name: harmony
        cpe: cpe:2.3:a:logitech:harmony:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Logitech Harmony Pro Installer Portal'

      - type: status
        status:
          - 200
