id: barracuda-panel

info:
  name: Barracuda SSL VPN Log In
  author: dhiyaneshDK
  severity: info
  description: The Barracuda SSL VPN is an integrated hardware and software solution enabling secure, clientless remote access to internal network resources from any web browser.
  classification:
    cpe: cpe:2.3:a:barracuda:barracuda:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: barracuda
    product: barracuda
  tags: barracuda,panel,vpn,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/default/showLogon.do"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: barracuda
        cpe: cpe:2.3:a:barracuda:barracuda:*:*:*:*:*:*:*:*
        words:
          - 'Barracuda SSL VPN'
