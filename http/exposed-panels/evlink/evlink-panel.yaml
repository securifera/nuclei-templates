id: evlink-panel

info:
  name: EVlink Local Controller - Detection
  author: ritikchaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:evlink:evlink:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"EVlink Local Controller"
    fofa-query: title="EVlink Local Controller"
    vendor: evlink
    product: evlink
  tags: panel,evlink,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: evlink
        cpe: cpe:2.3:a:evlink:evlink:*:*:*:*:*:*:*:*
        part: body
        words:
          - "EVlink Local Controller</title>"

      - type: status
        status:
          - 200
