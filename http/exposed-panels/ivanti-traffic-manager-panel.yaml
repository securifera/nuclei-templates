id: ivanti-traffic-manager-panel

info:
  name: Ivanti Traffic Manager Panel - Detect
  author: rxerium
  severity: info
  description: |
    An Ivanti Traffic Manager Login Panel was detected.
  reference:
    - https://www.ivanti.com/resources/v/doc/ivi/2528/2ef03e8ed03d
  classification:
    cpe: cpe:2.3:a:ivanti-traffic:ivanti-traffic:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Login (Virtual Traffic Manager"
    vendor: ivanti-traffic
    product: ivanti-traffic
  tags: detect,traffic-manager,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/apps/zxtm/login.cgi"

    matchers-condition: and
    matchers:
      - type: word
        name: ivanti-traffic
        cpe: cpe:2.3:a:ivanti-traffic:ivanti-traffic:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Login (Virtual Traffic Manager"

      - type: status
        status:
          - 200
