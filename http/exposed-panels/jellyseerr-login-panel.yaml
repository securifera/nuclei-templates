id: jellyseerr-login-panel

info:
  name: Jellyseerr Login Panel - Detect
  author: ritikchaddha
  severity: info
  reference:
    - https://github.com/Fallenbagel/jellyseerr
  classification:
    cpe: cpe:2.3:a:jellyseerr:jellyseerr:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:-2017604252
    vendor: jellyseerr
    product: jellyseerr
  tags: panel,jellyseerr,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: jellyseerr
        cpe: cpe:2.3:a:jellyseerr:jellyseerr:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Jellyseerr</title>'
          - 'content="Jellyseerr'
          - 'applicationTitle":"Jellyseerr'
        condition: or

      - type: status
        status:
          - 200
