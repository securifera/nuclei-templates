id: adminset-panel

info:
  name: Adminset Login Panel
  author: ffffffff0x
  severity: info
  description: An Adminset login panel was detected.
  classification:
    cpe: cpe:2.3:a:adminset:adminset:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    max-request: 1
    fofa-query: app="AdminSet"
    reference:
      - https://github.com/guhongze/adminset/
    vendor: adminset
    product: adminset
  tags: adminset,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: adminset
        cpe: cpe:2.3:a:adminset:adminset:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>AdminSet Login</title>"

      - type: status
        status:
          - 200
