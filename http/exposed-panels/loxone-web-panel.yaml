id: loxone-web-panel

info:
  name: Loxone WebInterface Panel - Detect
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:loxone:loxone:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"<title>Webinterface</title>"
    vendor: loxone
    product: loxone
  tags: panel,login,loxone,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: loxone
        cpe: cpe:2.3:a:loxone:loxone:*:*:*:*:*:*:*:*
        words:
          - '<title>Webinterface</title>'
          - 'loxone'
        condition: and

      - type: status
        status:
          - 200
