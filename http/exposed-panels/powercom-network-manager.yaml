id: powercom-network-manager

info:
  name: PowerCom Network Manager
  author: pussycat0x
  severity: info
  classification:
    cpe: cpe:2.3:a:powercom-network:powercom-network:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"PowerCom Network Manager"
    vendor: powercom-network
    product: powercom-network
  tags: powercommanager,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: powercom-network
        cpe: cpe:2.3:a:powercom-network:powercom-network:*:*:*:*:*:*:*:*
        part: body
        words:
          - "PowerCom Network Manager"

      - type: status
        status:
          - 200
