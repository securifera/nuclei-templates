id: femtocell-panel

info:
  name: Femtocell Access Point Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: |
    Femtocell Access Point panel was discovered.
  reference:
    - https://en.wikipedia.org/wiki/Femtocell
    - https://www.facebook.com/photo/?fbid=844447314392456&set=a.467014098802448
  classification:
    cpe: cpe:2.3:a:femtocell:femtocell:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Femtocell Access Point"
    vendor: femtocell
    product: femtocell
  tags: femtocell,network,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.html"

    matchers-condition: and
    matchers:
      - type: word
        name: femtocell
        cpe: cpe:2.3:a:femtocell:femtocell:*:*:*:*:*:*:*:*
        words:
          - "Femtocell Access Point"

      - type: status
        status:
          - 200
