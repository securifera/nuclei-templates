id: adobe-media-server

info:
  name: Adobe Media Server Login Panel
  author: dhiyaneshDK
  severity: info
  description: An Adobe Media Server login panel was detected.
  reference:
    - https://helpx.adobe.com/support/adobe-media-server.html
  classification:
    cpe: cpe:2.3:a:adobe:adobe:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Adobe Media Server"
    vendor: adobe
    product: adobe
  tags: panel,adobe,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: adobe
        cpe: cpe:2.3:a:adobe:adobe:*:*:*:*:*:*:*:*
        words:
          - '<title>Adobe Media Server</title>'

      - type: status
        status:
          - 200
