id: fortinet-fortigate-panel

info:
  name: Fortinet FortiGate SSL VPN Login Panel - Detect
  author: bsysop,darses
  severity: info
  description: |
    Detect FortiGate SSL VPN login and extract release date.
  classification:
    cpe: cpe:2.3:a:fortigate:fortigate:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query:
      - cpe:"cpe:2.3:o:fortinet:fortios"
      - http.html_hash:-1454941180
    vendor: fortigate
    product: fortigate
  tags: panel,fortigate,vpn,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        name: fortigate
        cpe: cpe:2.3:a:fortigate:fortigate:*:*:*:*:*:*:*:*
        dsl:
          - status_code==200 && contains(body, "top.location=\"/remote/login\";")

    extractors:
      - type: regex
        name: etag
        part: header
        group: 1
        internal: true
        regex:
          - '[Ee][Tt]ag: \"[\w\d]*\-([\w\d]{8})\"'

      - type: dsl
        dsl:
          - '"Release date: " + date_time("Jan 2, 2006", hex_to_dec(etag))'
