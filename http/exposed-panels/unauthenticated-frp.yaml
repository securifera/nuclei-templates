id: unauthenticated-frp

info:
  name: FRPS Dashboard - Detect
  author: pikpikcu
  severity: info
  description: FRPS Dashboard panel was detected.
  reference:
    - https://github.com/fatedier/frp/
  classification:
    cpe: cpe:2.3:a:frp:frp:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: frp
    product: frp
  tags: frp,unauth,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/static/"

    matchers-condition: and
    matchers:
      - type: word
        name: frp
        cpe: cpe:2.3:a:frp:frp:*:*:*:*:*:*:*:*
        words:
          - "<title>frps dashboard</title>"
        part: body

      - type: status
        status:
          - 200
