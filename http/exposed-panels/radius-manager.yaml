id: radius-manager-login

info:
  name: Radius Manager Admininstration Control Panel Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Radius Manager Administration Control Panel login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6790
  classification:
    cpe: cpe:2.3:a:radius:radius:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 4
    vendor: radius
    product: radius
  tags: panel,radius,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/admin.php'
      - '{{BaseURL}}/radiusmanager/user.php'
      - '{{BaseURL}}/user.php'

    matchers-condition: and
    matchers:
      - type: word
        name: radius
        cpe: cpe:2.3:a:radius:radius:*:*:*:*:*:*:*:*
        words:
          - '<title>Radius Manager - User Control Panel</title>'

      - type: status
        status:
          - 200
