id: olt-web-interface

info:
  name: OLT Web Management Interface Login Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: OLT Web Management Interface login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/8020
  classification:
    cpe: cpe:2.3:a:olt:olt:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"OLT Web Management Interface"
    vendor: olt
    product: olt
  tags: edb,panel,olt,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/action/login.html"

    matchers-condition: and
    matchers:
      - type: word
        name: olt
        cpe: cpe:2.3:a:olt:olt:*:*:*:*:*:*:*:*
        words:
          - "OLT Web Management Interface"

      - type: word
        name: olt-2
        cpe: cpe:2.3:a:olt:olt:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
