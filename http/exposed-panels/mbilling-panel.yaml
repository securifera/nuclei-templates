id: mbilling-panel

info:
  name: MagnusBilling - Login Panel
  author: DhiyaneshDK
  severity: info
  description: |
    Identified an exposed MagnusBilling login panel.
  classification:
    cpe: cpe:2.3:a:mbilling:mbilling:*:*:*:*:*:*:*:*
  metadata:
    shodan-query: html:"MagnusBilling"
    verified: true
    max-request: 1
    vendor: mbilling
    product: mbilling
  tags: mbilling,login,panel,magnusbilling,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/mbilling/"

    matchers-condition: and
    matchers:
      - type: word
        name: mbilling
        cpe: cpe:2.3:a:mbilling:mbilling:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'MagnusBilling'
          - 'Voip System'
        condition: and

      - type: status
        status:
          - 200
