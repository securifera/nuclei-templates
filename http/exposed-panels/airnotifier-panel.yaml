id: airnotifier-panel

info:
  name: AirNotifier Login Panel - Detect
  author: tess
  severity: info
  description: AirNotifier login panel was detected.
  classification:
    cpe: cpe:2.3:a:airnotifier:airnotifier:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"AirNotifier"
    vendor: airnotifier
    product: airnotifier
  tags: panel,airnotifier,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/auth/login'

    matchers-condition: and
    matchers:
      - type: word
        name: airnotifier
        cpe: cpe:2.3:a:airnotifier:airnotifier:*:*:*:*:*:*:*:*
        part: body
        words:
          - "AirNotifier"
          - "Stats"
          - "Server Info"
        condition: and

      - type: word
        name: airnotifier-2
        cpe: cpe:2.3:a:airnotifier:airnotifier:*:*:*:*:*:*:*:*
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
