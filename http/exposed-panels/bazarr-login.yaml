id: bazarr-login-detect

info:
  name: Bazarr Login - Detect
  author: r3dg33k
  severity: info
  description: Bazarr login page was detected.
  reference:
    - https://www.bazarr.media/
  classification:
    cpe: cpe:2.3:a:bazarr:bazarr:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: bazarr
    product: bazarr
  tags: panel,bazarr,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers:
      - type: word
        name: bazarr
        cpe: cpe:2.3:a:bazarr:bazarr:*:*:*:*:*:*:*:*
        words:
          - '<title>Bazarr</title>'
