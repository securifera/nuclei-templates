id: luci-login-detection

info:
  name: LuCi Login Panel - Detect
  author: aashiq
  severity: info
  description: LuCi login panel was detected.
  classification:
    cpe: cpe:2.3:a:luci:luci:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: luci
    product: luci
  tags: panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/luci"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: luci
        cpe: cpe:2.3:a:luci:luci:*:*:*:*:*:*:*:*
        words:
          - "Authorization Required"
