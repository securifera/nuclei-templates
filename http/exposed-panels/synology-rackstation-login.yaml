id: synology-rackstation-login

info:
  name: Synology RackStation Login Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:synology:rackstation:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: synology
    product: rackstation
  tags: login,tech,synology,rackstation,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 1

    matchers-condition: and
    matchers:
      - type: word
        name: rackstation
        cpe: cpe:2.3:a:synology:rackstation:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Synology&nbsp;RackStation</title>'

      - type: status
        status:
          - 200
