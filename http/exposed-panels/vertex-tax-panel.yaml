id: vertex-tax-panel

info:
  name: Vertex Tax Installer Panel - Detect
  author: ritikchaddha
  severity: info
  description: Vertex Tax Installer panel was detected.
  classification:
    cpe: cpe:2.3:a:vertex:vertex:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Vertex Tax Installer"
    vendor: vertex
    product: vertex
  tags: panel,vertex,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: vertex
        cpe: cpe:2.3:a:vertex:vertex:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Vertex Tax Installer'

      - type: status
        status:
          - 200
