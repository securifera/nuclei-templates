id: rtm-web-panel

info:
  name: RTM WEB - Panel
  author: DhiyaneshDK
  severity: info
  classification:
    cpe: cpe:2.3:a:rtm-web:rtm-web:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "RTM WEB"
    vendor: rtm-web
    product: rtm-web
  tags: panel,login,rtm-web,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Login"

    matchers-condition: and
    matchers:
      - type: word
        name: rtm-web
        cpe: cpe:2.3:a:rtm-web:rtm-web:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>RTM WEB</title>"

      - type: status
        status:
          - 200
