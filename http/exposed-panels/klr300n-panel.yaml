id: klr300n-panel

info:
  name: KLR 300N Router Panel - Detect
  author: andreluna
  severity: info
  description: |
    Home router wireless KLR 300N login panel were Detected.
  reference:
    - http://www.keo.com.br/produtos/roteador-klr-300n
    - http://www.keo.com.br/wp-content/uploads/2017/09/Manual_KLR_300N_03-17_site.pdf
  classification:
    cpe: cpe:2.3:a:klr300n:klr300n:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: Roteador Wireless KLR 300N
    vendor: klr300n
    product: klr300n
  tags: keo,klr300n,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.asp"

    matchers-condition: and
    matchers:
      - type: word
        name: klr300n
        cpe: cpe:2.3:a:klr300n:klr300n:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Roteador Wireless KLR 300N</title>"
          - "login"
        condition: and

      - type: status
        status:
          - 200
