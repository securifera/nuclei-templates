id: digital-watchdog-panel

info:
  name: Digital Watchdog - Detect
  author: ritikchaddha
  severity: info
  description: |
    Digital Watchdog panel was detected.
  classification:
    cpe: cpe:2.3:a:digital-watchdog:digital-watchdog:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: "http.favicon.hash:868509217"
    fofa-query: "icon_hash=\"868509217\""
    vendor: digital-watchdog
    product: digital-watchdog
  tags: digital-watchdog,panel,detect,login,dw,spectrum,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/static/images/favicon.ico"
      - "{{BaseURL}}/static/customization/favicon.ico"

    stop-at-first-match: true

    matchers:
      - type: dsl
        name: digital-watchdog
        cpe: cpe:2.3:a:digital-watchdog:digital-watchdog:*:*:*:*:*:*:*:*
        dsl:
          - "status_code==200 && ('868509217' == mmh3(base64_py(body)))"
