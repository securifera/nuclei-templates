id: cudatel-panel

info:
  name: CudaTel Login Panel - Detect
  author: arafatansari
  severity: info
  description: CudaTel login panel was detected.
  classification:
    cpe: cpe:2.3:a:cudatel:cudatel:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"CudaTel"
    vendor: cudatel
    product: cudatel
  tags: panel,cudatel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: cudatel
        cpe: cpe:2.3:a:cudatel:cudatel:*:*:*:*:*:*:*:*
        words:
          - 'CudaTel Communications Server'
          - 'alt="CudaTel'
        condition: or

      - type: status
        status:
          - 200
