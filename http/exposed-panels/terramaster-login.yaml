id: terramaster-login

info:
  name: Terramaster Login Panel - Detect
  author: gy741
  severity: info
  description: Terramaster login panel was detected.
  classification:
    cpe: cpe:2.3:a:terramaster:terramaster:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: terramaster
    product: terramaster
  tags: panel,terramaster,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        name: terramaster
        cpe: cpe:2.3:a:terramaster:terramaster:*:*:*:*:*:*:*:*
        words:
          - "<title>TOS Loading</title>"
        part: body

      - type: word
        name: terramaster-2
        cpe: cpe:2.3:a:terramaster:terramaster:*:*:*:*:*:*:*:*
        words:
          - "Server: TOS"
          - "X-Powered-By: TerraMaster"
        condition: or
        part: header
