id: turnkey-openvpn

info:
  name: TurnKey OpenVPN Panel - Detect
  author: ritikchaddha
  severity: info
  description: TurnKey OpenVPN panel was detected.
  classification:
    cpe: cpe:2.3:a:turnkey:openvpn:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"TurnKey OpenVPN"
    vendor: turnkey
    product: openvpn
  tags: panel,openvpn,turnkey,webshell,vpn,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: openvpn
        cpe: cpe:2.3:a:turnkey:openvpn:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'TurnKey OpenVPN'
          - 'Web Shell'
        condition: and

      - type: status
        status:
          - 200
