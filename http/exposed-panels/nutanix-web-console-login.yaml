id: nutanix-web-console-login

info:
  name: Nutanix Web Console Login Panel - Detect
  author: gy741
  severity: info
  description: Nutanix Web Console login panel was detected.
  classification:
    cpe: cpe:2.3:a:nutanix:nutanix:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: nutanix
    product: nutanix
  tags: panel,nutanix,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/console/'

    matchers-condition: and
    matchers:
      - type: word
        name: nutanix
        cpe: cpe:2.3:a:nutanix:nutanix:*:*:*:*:*:*:*:*
        words:
          - "<title>Nutanix Web Console</title>"

      - type: status
        status:
          - 200
