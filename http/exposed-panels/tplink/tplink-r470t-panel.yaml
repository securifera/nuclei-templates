id: tplink-r470t-panel

info:
  name: TP-LINK Router R470T - Detect
  author: ritikchaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:tplink:r470t:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: "r470t"
    vendor: tplink
    product: r470t
  tags: tplink,r470t,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        name: r470t
        cpe: cpe:2.3:a:tplink:r470t:*:*:*:*:*:*:*:*
        part: response
        words:
          - 'userRpm'
          - 'R470T'
        condition: and
