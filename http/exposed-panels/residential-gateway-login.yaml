id: residential-gateway-login

info:
  name: Residential Gateway Login Panel - Detect
  author: idealphase
  severity: info
  description: Residential Gateway login panel was detected.
  classification:
    cpe: cpe:2.3:a:residential-gateway:residential-gateway:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 2
    shodan-query: http.title:"Login - Residential Gateway"
    google-query: intitle:"Login - Residential Gateway"
    vendor: residential-gateway
    product: residential-gateway
  tags: panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/cgi-bin/wwwctrl.cgi?action=home"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: residential-gateway
        cpe: cpe:2.3:a:residential-gateway:residential-gateway:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Login - Residential Gateway</title>"

      - type: status
        status:
          - 200
