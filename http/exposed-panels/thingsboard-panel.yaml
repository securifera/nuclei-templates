id: thingsboard-panel

info:
  name: ThingsBoard Panel - Detect
  author: righettod
  severity: info
  description: |
     ThingsBoard was detected — a Open-source IoT Platform for device management, data collection, processing and visualization.
  reference:
    - https://github.com/thingsboard/thingsboard
    - https://thingsboard.io/
  classification:
    cpe: cpe:2.3:a:thingsboard:thingsboard:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"ThingsBoard"
    vendor: thingsboard
    product: thingsboard
  tags: panel,thingsboard,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers:
      - type: dsl
        name: thingsboard
        cpe: cpe:2.3:a:thingsboard:thingsboard:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>thingsboard</title>")'
        condition: and
