id: haivision-gateway-panel

info:
  name: Haivision Gateway Login Panel - Detect
  author: righettod
  severity: info
  description: Haivision Gateway login panel was detected.
  reference:
    - https://www.haivision.com/
  classification:
    cpe: cpe:2.3:a:haivision:haivision:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Haivision Gateway"
    vendor: haivision
    product: haivision
  tags: panel,haivision,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        name: haivision
        cpe: cpe:2.3:a:haivision:haivision:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>Haivision Gateway", "content=\"Haivision Gateway")'
        condition: and
