id: dockwatch-panel

info:
  name: Dockwatch Panel - Detect
  author: s4e-io
  severity: info
  description: |
    Dockwatch panel was discovered
  classification:
    cpe: cpe:2.3:a:dockwatch:dockwatch:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="1991646591"
    vendor: dockwatch
    product: dockwatch
  tags: panel,login,dockwatch,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php"

    matchers:
      - type: dsl
        name: dockwatch
        cpe: cpe:2.3:a:dockwatch:dockwatch:*:*:*:*:*:*:*:*
        dsl:
          - 'contains_any(body, "dockwatch-maintenance", "Restart Dockwatch")'
          - 'status_code == 200'
        condition: and
