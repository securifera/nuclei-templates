id: lockself-panel

info:
  name: LockSelf Login Panel - Detect
  author: righettod
  severity: info
  description: |
    LockSelf login panel was detected.
  reference:
    - https://www.lockself.com/en/
  classification:
    cpe: cpe:2.3:a:lockself:lockself:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"LockSelf"
    vendor: lockself
    product: lockself
  tags: panel,lockself,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/application/index.html"

    matchers:
      - type: dsl
        name: lockself
        cpe: cpe:2.3:a:lockself:lockself:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>LockSelf","content=\"LockSelf", "name=\"LockSelf")'
        condition: and
