id: bmc-discovery-panel

info:
  name: BMC Discovery Login Panel - Detect
  author: daffainfo
  severity: info
  description: BMC Discovery login panel was detected.
  reference:
    - https://docs.bmc.com/docs/discovery/documentation-home-1098837931.html
  classification:
    cpe: cpe:2.3:a:bmc:bmc:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"BMC Software"
    vendor: bmc
    product: bmc
  tags: panel,bmc,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/"

    matchers-condition: and
    matchers:
      - type: word
        name: bmc
        cpe: cpe:2.3:a:bmc:bmc:*:*:*:*:*:*:*:*
        part: body
        words:
          - "BMC Discovery:"
          - '<span class="logo-product">Discovery</span>'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<span class="logo-version">Version ([0-9.]+)'
