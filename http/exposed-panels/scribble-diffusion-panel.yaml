id: scribble-diffusion-panel

info:
  name: Scribble Diffusion Panel - Detect
  author: rxerium
  severity: info
  description: |
    A tool to turn your rough sketch into a refined image using AI.
  reference:
    - https://scribblediffusion.com/
    - https://github.com/replicate/scribble-diffusion
  classification:
    cpe: cpe:2.3:a:scribble:scribble:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Scribble Diffusion"
    vendor: scribble
    product: scribble
  tags: panel,scribble,detect,discovery,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: scribble
        cpe: cpe:2.3:a:scribble:scribble:*:*:*:*:*:*:*:*
        words:
          - '<title>Scribble Diffusion'
          - 'content="Scribble Diffusion'
        condition: or

      - type: status
        status:
          - 200
