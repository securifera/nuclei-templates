id: mpsec-isg1000-panel

info:
  name: MPSec ISG1000 Security Gateway Panel - Detect
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:mpsec:isg1000:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: 迈普通信技术股份有限公司
    vendor: mpsec
    product: isg1000
  tags: panel,login,mpsec,isg1000,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.html"

    matchers-condition: and
    matchers:
      - type: word
        name: isg1000
        cpe: cpe:2.3:a:mpsec:isg1000:*:*:*:*:*:*:*:*
        words:
          - '/webui/images/maipu/login/'

      - type: status
        status:
          - 200
