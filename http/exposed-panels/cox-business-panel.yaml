id: cox-business-panel

info:
  name: Cox Business Dominion Gateway Login Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: |
    Cox Business Dominion Gateway Login page was discovered.
  reference:
    - https://samcurry.net/hacking-millions-of-modems
  classification:
    cpe: cpe:2.3:a:cox:cox:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Cox Business"
    vendor: cox
    product: cox
  tags: cox,gateway,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: cox
        cpe: cpe:2.3:a:cox:cox:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Cox Business Dominion Gateway - Login"

      - type: status
        status:
          - 200
