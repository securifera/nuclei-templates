id: kfm-login-panel

info:
  name: Kae's File Manager Admin Login Panel - Detect
  author: princechaddha
  severity: info
  description: Kae's File Manager admin login panel was detected.
  classification:
    cpe: cpe:2.3:a:kfm:kfm:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: kfm
    product: kfm
  tags: panel,kfm,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/kfm/admin/"

    matchers-condition: and
    matchers:
      - type: word
        name: kfm
        cpe: cpe:2.3:a:kfm:kfm:*:*:*:*:*:*:*:*
        part: body
        words:
          - "KFM Login"
          - "password"
        condition: and

      - type: status
        status:
          - 200
