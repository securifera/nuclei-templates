id: onedev-panel

info:
  name: OneDev Panel - Detect
  author: vultza
  severity: info
  description: |
    OneDev is a Git Server with CI/CD, Kanban, and Packages.
  reference:
    - https://github.com/theonedev/onedev
  classification:
    cpe: cpe:2.3:a:onedev:onedev:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"OneDev"
    vendor: onedev
    product: onedev
  tags: tech,detect,onedev,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/~login"

    matchers-condition: and
    matchers:
      - type: word
        name: onedev
        cpe: cpe:2.3:a:onedev:onedev:*:*:*:*:*:*:*:*
        part: body
        words:
          - "OneDev"
          - "Git Server"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
