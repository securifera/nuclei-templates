id: dynatrace-login

info:
  name: Dynatrace Login Panel - Detect
  author: ja1sh
  severity: info
  description: |
    Dynatrace login panel was detected.
  classification:
    cpe: cpe:2.3:a:dynatrace:dynatrace:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:1828614783
    vendor: dynatrace
    product: dynatrace
  tags: dynatrace,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: dynatrace
        cpe: cpe:2.3:a:dynatrace:dynatrace:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Login - Dynatrace"

      - type: status
        status:
          - 200
