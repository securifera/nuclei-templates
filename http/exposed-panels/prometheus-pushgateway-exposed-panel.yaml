id: prometheus-pushgateway-exposed-panel

info:
  name: Prometheus Pushgateway Panel - Detect
  author: codexlynx
  severity: info
  description: Prometheus Pushgateway panel was detected.
  classification:
    cpe: cpe:2.3:a:pushgateway:pushgateway:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: pushgateway
    product: pushgateway
  tags: panel,prometheus,pushgateway,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        name: pushgateway
        cpe: cpe:2.3:a:pushgateway:pushgateway:*:*:*:*:*:*:*:*
        words:
          - '<title>Prometheus Pushgateway</title>'
