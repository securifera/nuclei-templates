id: call-break-cms

info:
  name: Call Break CMS Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: Call Break CMS panel was detected.
  classification:
    cpe: cpe:2.3:a:call-break-cms:call-break-cms:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: call-break-cms
    product: call-break-cms
  tags: panel,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        name: call-break-cms
        cpe: cpe:2.3:a:call-break-cms:call-break-cms:*:*:*:*:*:*:*:*
        words:
          - '<title>Call Break CMS</title>'
        condition: and
