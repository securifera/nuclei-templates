id: netgear-version-detect

info:
  name: NETGEAR Router Panel - Detect
  author: dwisiswant0
  severity: info
  description: NETGEAR router panel was detected.
  classification:
    cpe: cpe:2.3:a:netgear:netgear:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: netgear
    product: netgear
  tags: panel,router,netgear,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/currentsetting.htm"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        name: netgear
        cpe: cpe:2.3:a:netgear:netgear:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "^((((Re(adyShareSupportedLevel|gionTag)|InternetConnectionStatus|SOAPVersion|Firmware|Model)|Region)|LoginMethod)|ParentalControlSupported)="

    extractors:
      - type: regex
        part: body
        regex:
          - "Model=([^\\s]+)"
          - "Firmware=([^\\s]+)"
