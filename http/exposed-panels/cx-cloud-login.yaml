id: cx-cloud-login

info:
  name: CX Cloud Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: CX Cloud panel was detected,
  classification:
    cpe: cpe:2.3:a:cx-cloud:cx-cloud:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 2
    vendor: cx-cloud
    product: cx-cloud
  tags: panel,cx,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/cxcum/'

    matchers:
      - type: word
        name: cx-cloud
        cpe: cpe:2.3:a:cx-cloud:cx-cloud:*:*:*:*:*:*:*:*
        words:
          - "<title>CX Cloud</title>"
