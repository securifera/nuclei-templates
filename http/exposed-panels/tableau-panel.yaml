id: tableau-panel

info:
  name: Tableau Python Server Panel - Detect
  author: pussycat0x
  severity: info
  description: Tableau Python Server panel was detected.
  classification:
    cpe: cpe:2.3:a:tableau:tableau:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    fofa-query: app="Tableau-Python-Server"
    vendor: tableau
    product: tableau
  tags: tableau,panel,python,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: tableau
        cpe: cpe:2.3:a:tableau:tableau:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Tableau Python Server</title>'

      - type: status
        status:
          - 200
