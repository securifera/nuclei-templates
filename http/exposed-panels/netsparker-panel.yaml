id: netsparker-panel

info:
  name: Netsparker Login Panel - Detect
  author: pussycat0x
  severity: info
  description: |
    Netsparker login panel was detected.
  reference:
    - https://www.invicti.com/
  classification:
    cpe: cpe:2.3:a:netsparker:netsparker:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Sign in to Netsparker Enterprise"
    vendor: netsparker
    product: netsparker
  tags: panel,netsparker,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/account/signin?ReturnUrl=%2f"

    matchers-condition: and
    matchers:
      - type: word
        name: netsparker
        cpe: cpe:2.3:a:netsparker:netsparker:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Netsparker Ltd"
          - "Netsparker Enterprise"
        condition: and

      - type: status
        status:
          - 200
