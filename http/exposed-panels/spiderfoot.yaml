id: spiderfoot

info:
  name: SpiderFoot Login Panel - Detect
  author: geeknik
  severity: info
  description: SpiderFoot login panel was detected.
  classification:
    cpe: cpe:2.3:a:spiderfoot:spiderfoot:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: spiderfoot
    product: spiderfoot
  tags: panel,login,tech,spiderfoot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: spiderfoot
        cpe: cpe:2.3:a:spiderfoot:spiderfoot:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>SpiderFoot'
          - 'support@spiderfoot.net'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - 'SpiderFoot v([0-9.]+)'
