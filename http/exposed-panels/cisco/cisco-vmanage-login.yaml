id: cisco-vmanage-login

info:
  name: Cisco vManage Login Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: Cisco vManage login panel was detected.
  classification:
    cpe: cpe:2.3:a:cisco:cisco:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Cisco vManage"
    vendor: cisco
    product: cisco
  tags: panel,cisco,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: cisco
        cpe: cpe:2.3:a:cisco:cisco:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Cisco vManage</title>"

      - type: status
        status:
          - 200
