id: cisco-systems-login

info:
  name: Cisco Systems Login Panel - Detect
  author: dhiyaneshDk,idealphase
  severity: info
  description: Cisco Systems login panel was detected.
  classification:
    cpe: cpe:2.3:a:cisco:cisco:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Cisco Systems Login"
    google-query: intitle:"Cisco Systems Login"
    vendor: cisco
    product: cisco
  tags: panel,cisco,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: cisco
        cpe: cpe:2.3:a:cisco:cisco:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Cisco Systems Login"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '<script src="javascript\/translate\.js\?ver=(.+)"><\/script>'
