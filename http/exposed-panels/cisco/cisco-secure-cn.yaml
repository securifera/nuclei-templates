id: cisco-secure-cn

info:
  name: Cisco Secure CN Login Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: Cisco Secure CN login panel was detected.
  classification:
    cpe: cpe:2.3:a:cisco:cisco:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Cisco Secure CN"
    vendor: cisco
    product: cisco
  tags: panel,cisco,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        name: cisco
        cpe: cpe:2.3:a:cisco:cisco:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Cisco Secure CN</title>"

      - type: status
        status:
          - 200
