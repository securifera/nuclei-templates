id: spacelogic-cbus-panel

info:
  name: SpaceLogic C-Bus Home Panel - Detect
  author: ritikchaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:schneider-electric:spacelogic_c-bus_home_controller_firmware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: schneider-electric
    product: spacelogic_c-bus_home_controller_firmware
    shodan-query:
      - html:"SpaceLogic C-Bus"
      - http.html:"spacelogic c-bus"
    fofa-query: body="spacelogic c-bus"
  tags: panel,spacelogic,login,schneider-electric,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: spacelogic_c-bus_home_controller_firmware
        cpe: cpe:2.3:a:schneider-electric:spacelogic_c-bus_home_controller_firmware:*:*:*:*:*:*:*:*
        words:
          - '<title>SpaceLogic C-Bus Home</title>'
          - 'content="SpaceLogic C-Bus Home'
        condition: or

      - type: status
        status:
          - 200
