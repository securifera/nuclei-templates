id: supervpn-detect

info:
  name: SuperVPN Login Panel - Detect
  author: organiccrap
  severity: info
  description: SuperVPN login panel was detected.
  classification:
    cpe: cpe:2.3:a:supervpn:supervpn:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: supervpn
    product: supervpn
  tags: panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/login.html"

    matchers:
      - type: word
        name: supervpn
        cpe: cpe:2.3:a:supervpn:supervpn:*:*:*:*:*:*:*:*
        words:
          - "<title>Sign In-SuperVPN</title>"
        part: body
