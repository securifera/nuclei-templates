id: sentinelone-console

info:
  name: SentinelOne Management Console Login Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: SentinelOne Management Console login panel was detected.
  classification:
    cpe: cpe:2.3:a:sentinelone:sentinelone:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"SentinelOne - Management Console"
    vendor: sentinelone
    product: sentinelone
  tags: panel,sentinelone,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        name: sentinelone
        cpe: cpe:2.3:a:sentinelone:sentinelone:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'SentinelOne - Management Console'

      - type: status
        status:
          - 200
