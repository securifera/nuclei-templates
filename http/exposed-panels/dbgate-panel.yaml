id: dbgate-panel

info:
  name: DbGate Web Client Management - Panel Detect
  author: h0j3n
  severity: info
  description: |
    The DbGate Web Client Management Panel is detected on the target system.
  reference:
    - https://github.com/dbgate/dbgate
  classification:
    cpe: cpe:2.3:a:dbgate:dbgate:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:1198579728
    vendor: dbgate
    product: dbgate
  tags: panel,dbgate,oss,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: dbgate
        cpe: cpe:2.3:a:dbgate:dbgate:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>DbGate</title>"
          - "starting_dbgate_zero"
          - "Loading DbGate App"
          - "DbGate - web based opensource database administration tool for MS SQL, MySQL, Postgre SQL"
        condition: or
