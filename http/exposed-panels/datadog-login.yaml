id: datadog-login

info:
  name: Datadog Login Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: Datadog login panel was detected.
  classification:
    cpe: cpe:2.3:a:datadog:datadog:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Datadog"
    vendor: datadog
    product: datadog
  tags: panel,datadog,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/account/login"

    matchers-condition: and
    matchers:
      - type: word
        name: datadog
        cpe: cpe:2.3:a:datadog:datadog:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Datadog: Log In</title>'

      - type: status
        status:
          - 200
