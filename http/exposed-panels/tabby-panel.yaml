id: tabby-panel

info:
  name: Tabby Panel - Detect
  author: s4e-io
  severity: info
  description: |
    Tabby panel was discovered.
  reference:
    - https://github.com/TabbyML/tabby
  classification:
    cpe: cpe:2.3:a:tabby:tabby:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Tabby"
    vendor: tabby
    product: tabby
  tags: panel,login,tabby,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/signin"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        name: tabby
        cpe: cpe:2.3:a:tabby:tabby:*:*:*:*:*:*:*:*
        dsl:
          - 'contains(body, "<title>Tabby - Sign In")'
          - 'status_code == 200'
        condition: and
