id: gladinet-centrestack-panel

info:
  name: CentreStack Login Panel - Detect
  author: rxerium
  severity: info
  description: |
    Gladinet CentreStack login panel was detected.
  classification:
    cpe: cpe:2.3:a:gladinet:centrestack:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"CentreStack"
    vendor: gladinet
    product: centrestack
  tags: panel,centrestack,login,gladinet,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/portal/loginpage.aspx"

    matchers-condition: and
    matchers:
      - type: word
        name: centrestack
        cpe: cpe:2.3:a:gladinet:centrestack:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'CentreStack - Login'

      - type: status
        status:
          - 200
