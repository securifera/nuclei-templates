id: woodwing-panel

info:
  name: Woodwing Studio Server Panel - Detect
  author: pdteam,righettod
  severity: info
  reference:
    - https://twitter.com/ynsmroztas/status/1680961398011047936
  classification:
    cpe: cpe:2.3:a:woodwing:woodwing:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"WoodWing Studio Server"
    fofa-query: title=="WoodWing Studio Server"
    vendor: woodwing
    product: woodwing
  tags: woodwing,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/StudioServer/server/apps/login.php"
      - "{{BaseURL}}/server/apps/login.php"

    stop-at-first-match: true
    redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        name: woodwing
        cpe: cpe:2.3:a:woodwing:woodwing:*:*:*:*:*:*:*:*
        dsl:
          - "contains(tolower(body), 'woodwing studio server')"

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<!---->v([0-9.]+\s+Build\s+[0-9]+)'
