id: weave-scope-dashboard

info:
  name: Weave Scope Panel - Detect
  author: e_schultze_
  severity: info
  description: Weave Scope panel was detected.
  classification:
    cpe: cpe:2.3:a:weave-scope:weave-scope:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: weave-scope
    product: weave-scope
  tags: panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: weave-scope
        cpe: cpe:2.3:a:weave-scope:weave-scope:*:*:*:*:*:*:*:*
        words:
          - "<title>Weave Scope</title>"
          - "__WEAVEWORKS_CSRF_TOKEN"
          - "__CSRF_TOKEN_PLACEHOLDER__"
        condition: and
        part: body
