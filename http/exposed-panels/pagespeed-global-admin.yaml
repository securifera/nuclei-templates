id: pagespeed-global-admin

info:
  name: Pagespeed Global Admin - Detect
  author: geeknik
  severity: info
  description: Pagespeed Global Admin panel was detected.
  reference:
    - https://www.modpagespeed.com/
  classification:
    cpe: cpe:2.3:a:pagespeed:pagespeed:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: pagespeed
    product: pagespeed
  tags: pagespeed,panel,discovery

http:
  - method: GET

    headers:
      X-Client-IP: "127.0.0.1"
      X-Remote-IP: "127.0.0.1"
      X-Remote-Addr: "127.0.0.1"
      X-Forwarded-For: "127.0.0.1"
      X-Originating-IP: "127.0.0.1"
      X-Host: "127.0.0.1"
      X-Forwarded-Host: "127.0.0.1"
    path:
      - "{{BaseURL}}/pagespeed-global-admin/"

    matchers-condition: and
    matchers:
      - type: word
        name: pagespeed
        cpe: cpe:2.3:a:pagespeed:pagespeed:*:*:*:*:*:*:*:*
        words:
          - "X-Mod-Pagespeed"
        part: header

      - type: status
        status:
          - 200
