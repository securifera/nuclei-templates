id: squidex-panel

info:
  name: Squidex Headless CMS Panel - Detect
  author: johnk3r
  severity: info
  description: |
    Squidex is an open source headless CMS and content management hub.
  reference:
    - https://github.com/Squidex/squidex
  classification:
    cpe: cpe:2.3:a:squidex:squidex:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:1099097618
    vendor: squidex
    product: squidex
  tags: panel,squidex,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/favicon.ico"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        name: squidex
        cpe: cpe:2.3:a:squidex:squidex:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Squidex Headless CMS</title>'
          - '<div>Loading Squidex</div>'
        case-insensitive: true
        condition: or

      - type: dsl
        name: squidex-2
        cpe: cpe:2.3:a:squidex:squidex:*:*:*:*:*:*:*:*
        dsl:
          - "status_code==200 && (\"1099097618\" == mmh3(base64_py(body)))"
