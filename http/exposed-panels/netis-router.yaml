id: netis-router

info:
  name: Netis Router Login Panel - Detect
  author: gy741
  severity: info
  description: Netis router login panel was detected.
  reference:
    - https://www.tacnetsol.com/blog/cve-2019-8985-rce
  classification:
    cpe: cpe:2.3:a:netis:netis:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: netis
    product: netis
  tags: panel,login,netis,router,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login.htm'

    matchers-condition: and
    matchers:
      - type: word
        name: netis
        cpe: cpe:2.3:a:netis:netis:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>AP setup</title>'

      - type: word
        name: netis-2
        cpe: cpe:2.3:a:netis:netis:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'Server: netis'

      - type: status
        status:
          - 200
