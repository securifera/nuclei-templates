id: ourmgmt3-panel

info:
  name: OurMGMT3 Admin Login Panel - Detect
  author: ritikchaddha
  severity: info
  description: OurMGMT3 admin login panel was detected.
  classification:
    cpe: cpe:2.3:a:ourmgmt3:ourmgmt3:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"OurMGMT3"
    vendor: ourmgmt3
    product: ourmgmt3
  tags: panel,ourmgmt3,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/admin/login'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: ourmgmt3
        cpe: cpe:2.3:a:ourmgmt3:ourmgmt3:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'OurMGMT3 Debug client'

      - type: status
        status:
          - 200
