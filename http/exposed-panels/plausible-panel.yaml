id: plausible-panel

info:
  name: Plausible Panel - Detect
  author: rxerium
  severity: info
  description: |
    Plausible is intuitive, lightweight and open source web analytics.
  reference:
    - https://plausible.io/
    - https://github.com/plausible/analytics
  classification:
    cpe: cpe:2.3:a:plausible:plausible:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Plausible"
    vendor: plausible
    product: plausible
  tags: panel,plausible,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        name: plausible
        cpe: cpe:2.3:a:plausible:plausible:*:*:*:*:*:*:*:*
        words:
          - 'Login'
          - 'Plausible · Web analytics'
        condition: and

      - type: status
        status:
          - 200
