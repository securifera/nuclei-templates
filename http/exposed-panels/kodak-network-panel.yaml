id: kedacom-network-panel

info:
  name: Kedacom Network Keyboard Console Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: |
    A Kedacom network keyboard console panel was detected.
  classification:
    cpe: cpe:2.3:a:network:network:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: 网络键盘控制台
    vendor: network
    product: network
  tags: panel,login,kedacom,network,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.html"

    matchers-condition: and
    matchers:
      - type: word
        name: network
        cpe: cpe:2.3:a:network:network:*:*:*:*:*:*:*:*
        words:
          - '网络键盘控制台'

      - type: status
        status:
          - 200
