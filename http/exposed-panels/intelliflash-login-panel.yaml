id: intelliflash-login-panel

info:
  name: IntelliFlash Login Panel - Detect
  author: princechaddha
  severity: info
  description: IntelliFlash login panel was detected.
  classification:
    cpe: cpe:2.3:a:intelliflash:intelliflash:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: intelliflash
    product: intelliflash
  tags: panel,intelliflash,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: intelliflash
        cpe: cpe:2.3:a:intelliflash:intelliflash:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>IntelliFlash</title>"

      - type: status
        status:
          - 200
