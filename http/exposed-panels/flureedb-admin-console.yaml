id: flureedb-admin-console

info:
  name: FlureeDB Admin Console Login Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: FlureeDB Admin Console login panel was detected.
  reference:
    - https://github.com/fluree/fluree-admin-ui
  classification:
    cpe: cpe:2.3:a:flureedb:flureedb:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"FlureeDB Admin Console"
    vendor: flureedb
    product: flureedb
  tags: panel,flureedb,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: flureedb
        cpe: cpe:2.3:a:flureedb:flureedb:*:*:*:*:*:*:*:*
        words:
          - "<title>FlureeDB Admin Console | Flur.ee</title>"

      - type: status
        status:
          - 200
