id: eos-http-browser

info:
  name: EOS HTTP Browser
  author: DhiyaneshDk
  severity: medium
  reference:
    - https://www.facebook.com/photo/?fbid=634930085344181&set=pcb.634929508677572
  classification:
    cpe: cpe:2.3:a:eos:eos:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"EOS HTTP Browser"
    vendor: eos
    product: eos
  tags: exposure,eos,httpbrowser,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/eos/"

    matchers-condition: and
    matchers:
      - type: word
        name: eos
        cpe: cpe:2.3:a:eos:eos:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'STAT TEST'

      - type: status
        status:
          - 200
