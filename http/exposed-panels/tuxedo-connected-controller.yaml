id: tuxedo-connected-controller

info:
  name: Tuxedo Connected Controller Login Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: Tuxedo Connected Controller login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6486
  classification:
    cpe: cpe:2.3:a:tuxedo:tuxedo:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: tuxedo
    product: tuxedo
  tags: panel,tuxedo,edb,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.html"

    matchers-condition: and
    matchers:
      - type: word
        name: tuxedo
        cpe: cpe:2.3:a:tuxedo:tuxedo:*:*:*:*:*:*:*:*
        words:
          - '<title>Tuxedo Connected Controller</title>'
        part: body

      - type: status
        status:
          - 200
