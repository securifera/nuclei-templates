id: exolis-engage-panel

info:
  name: Exolis Engage Panel - Detect
  author: righettod
  severity: info
  description: Exolis Engage panel was detected.
  reference:
    - https://www.exolis.fr/en/solution-2/
  classification:
    cpe: cpe:2.3:a:exolis:engage:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"engage - Portail soignant"
    google-query: intitle:"engage - Portail soignant"
    vendor: exolis
    product: engage
  tags: panel,exolis,engage,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/app.js"

    matchers-condition: and
    matchers:
      - type: word
        name: engage
        cpe: cpe:2.3:a:exolis:engage:*:*:*:*:*:*:*:*
        part: body
        words:
          - "engage-specific-config"
          - "engage-lastAppUserType"
          - "engage-lastHelperPatientContext"
          - "engage-preferred-language"
          - "engageManager.admin"
          - "engageManager.user"
        condition: or

      - type: status
        status:
          - 200
