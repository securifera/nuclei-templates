id: iomega-emc-shared-nas

info:
  name: Iomega LenovoEMC NAS Login Panel - Detect
  author: e_schultze_
  severity: info
  description: Iomega LenovoEMC NAS login panel was detected.
  classification:
    cpe: cpe:2.3:a:iomega-emc-shared-nas:iomega-emc-shared-nas:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: iomega-emc-shared-nas
    product: iomega-emc-shared-nas
  tags: panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cp/Shares?user=&protocol=webaccess&v=2.3"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: iomega-emc-shared-nas
        cpe: cpe:2.3:a:iomega-emc-shared-nas:iomega-emc-shared-nas:*:*:*:*:*:*:*:*
        words:
          - '"access":"read"'
          - '"access":"readwrite"'
        condition: or
        part: body

      - type: word
        name: iomega-emc-shared-nas-2
        cpe: cpe:2.3:a:iomega-emc-shared-nas:iomega-emc-shared-nas:*:*:*:*:*:*:*:*
        words:
          - "iomega"
        part: header
