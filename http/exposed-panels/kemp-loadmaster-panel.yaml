id: kemp-loadmaster-panel

info:
  name: Progress Kemp LoadMaster Panel - Detect
  author: rxerium
  severity: info
  description: |
    A Progress Kemp LoadMaster panel was detected.
  reference:
    - https://kemptechnologies.com/
  classification:
    cpe: cpe:2.3:a:kemp:loadmaster:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Kemp Login Screen"
    vendor: kemp
    product: loadmaster
  tags: login,progress,kemp,loadmaster,panel,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: loadmaster
        cpe: cpe:2.3:a:kemp:loadmaster:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Kemp Login Screen</title>"

      - type: status
        status:
          - 200
