id: usermin-panel

info:
  name: Usermin Panel - Detect
  author: s4e-io
  severity: info
  description: |
    Usermin panel was discovered.
  classification:
    cpe: cpe:2.3:a:usermin:usermin:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: "Login to Usermin"
    vendor: usermin
    product: usermin
  tags: panel,login,usermin,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        name: usermin
        cpe: cpe:2.3:a:usermin:usermin:*:*:*:*:*:*:*:*
        dsl:
          - 'contains_all(body, "<title>Login to Usermin</title>", "/manifest-usermin.json")'
          - 'status_code == 200'
        condition: and
