id: trellix-panel

info:
  name: Trellix Login Panel
  author: johnk3r
  severity: info
  description: |
    Trellix login panel was detected.
  classification:
    cpe: cpe:2.3:a:trellix:trellix:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: "Server: Trellix"
    verified: true
    vendor: trellix
    product: trellix
  tags: trellix,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login/login"

    matchers-condition: and
    matchers:
      - type: regex
        name: trellix
        cpe: cpe:2.3:a:trellix:trellix:*:*:*:*:*:*:*:*
        part: header
        regex:
          - "Trellix"

      - type: status
        status:
          - 200

    extractors:
      - type: kval
        part: header
        kval:
          - Server
