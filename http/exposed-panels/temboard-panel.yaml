id: temboard-panel

info:
  name: temBoard Panel - Detect
  author: righettod
  severity: info
  description: |
     temBoard was detected — a powerful management tool for PostgreSQL.
  reference:
    - https://labs.dalibo.com/temboard
    - https://github.com/dalibo/temboard/
  classification:
    cpe: cpe:2.3:a:temboard:temboard:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"temBoard"
    vendor: temboard
    product: temboard
  tags: panel,temboard,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers:
      - type: dsl
        name: temboard
        cpe: cpe:2.3:a:temboard:temboard:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>temboard", "temboard-")'
          - 'contains(to_lower(body), "login")'
        condition: and
