id: monsta-ftp-detect

info:
  name: Monsta FTP - Detect
  author: rxerium
  severity: info
  description: |
    Detects Monsta FTP web-based file manager interface.
  reference:
    - https://www.monstaftp.com/
  classification:
    cpe: cpe:2.3:a:monsta:ftp:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Monsta FTP"
    vendor: monsta
    product: ftp
  tags: tech,monsta,ftp,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: ftp
        cpe: cpe:2.3:a:monsta:ftp:*:*:*:*:*:*:*:*
        words:
          - 'ng-app="MonstaFTP"'
          - '<title>Monsta FTP'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - 'monsta-min-([0-9.]+)\.js'
