id: bynder-panel

info:
  name: Bynder Login Panel - Detect
  author: righettod
  severity: info
  description: |
    Bynder login panel was detected.
  reference:
    - https://www.bynder.com/en/
  classification:
    cpe: cpe:2.3:a:bynder:bynder:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:1017650009
    vendor: bynder
    product: bynder
  tags: panel,bynder,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login/"

    matchers:
      - type: dsl
        name: bynder
        cpe: cpe:2.3:a:bynder:bynder:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "bynder.", "bynder brand portal", "bynder login")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'http-equiv="version"\s+content="([0-9\.]+)"'
