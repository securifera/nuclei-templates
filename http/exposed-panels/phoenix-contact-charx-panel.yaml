id: phoenix-contact-charx-panel

info:
  name: Phoenix Contact CHARX SEC-3XXX AC Charging Controller Panel - Detect
  author: inokii
  severity: info
  description: |
    Phoenix Contact CHARX SEC-3XXX AC Charging Controller panel was detected.
  reference:
    - https://www.phoenixcontact.com/en-us/products/ac-charging-controllers
  classification:
    cpe: cpe:2.3:a:phoenix-contact:phoenix-contact:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Phoenix Contact - CHARX"
    vendor: phoenix-contact
    product: phoenix-contact
  tags: panel,phoenix-contact,charx,ics,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: phoenix-contact
        cpe: cpe:2.3:a:phoenix-contact:phoenix-contact:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Phoenix Contact - CHARX</title>"

      - type: status
        status:
          - 200
