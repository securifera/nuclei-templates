id: openobserve-panel

info:
  name: OpenObserve Login Panel - Detect
  author: righettod
  severity: info
  description: |
    OpenObserve products was detected.
  reference:
    - https://github.com/openobserve/openobserve
  classification:
    cpe: cpe:2.3:a:openobserve:openobserve:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"OpenObserve"
    vendor: openobserve
    product: openobserve
  tags: panel,openobserve,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/web/login"

    matchers:
      - type: dsl
        name: openobserve
        cpe: cpe:2.3:a:openobserve:openobserve:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "openobserve</title>")'
        condition: and
