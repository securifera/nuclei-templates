id: netris-dashboard-panel

info:
  name: Netris Dashboard Panel - Detect
  author: theamanrawat
  severity: info
  description: Netris Dashboard panel was detected.
  classification:
    cpe: cpe:2.3:a:netris:netris:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Netris Dashboard"
    verified: true
    vendor: netris
    product: netris
  tags: panel,netris,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: netris
        cpe: cpe:2.3:a:netris:netris:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Netris Dashboard'

      - type: status
        status:
          - 200
