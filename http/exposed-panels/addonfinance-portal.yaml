id: addonfinance-portal

info:
  name: AddOnFinance Portal - Detect
  author: ritikchaddha
  severity: info
  description: AddOnFinance Portal Panel was detected.
  classification:
    cpe: cpe:2.3:a:addonfinance:addonfinance:*:*:*:*:*:*:*:*
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: title:"AddOnFinancePortal"
    vendor: addonfinance
    product: addonfinance
  tags: panel,addon,finance,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: addonfinance
        cpe: cpe:2.3:a:addonfinance:addonfinance:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'AddOnFinancePortal</title>'

      - type: status
        status:
          - 200
