id: beszel-panel

info:
  name: Beszel Login Panel - Detect
  author: righettod
  severity: info
  description: |
    Beszel products was detected.
  reference:
    - https://github.com/henrygd/beszel
    - https://beszel.dev/
  classification:
    cpe: cpe:2.3:a:beszel:beszel:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"beszel"
    vendor: beszel
    product: beszel
  tags: panel,beszel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers:
      - type: dsl
        name: beszel
        cpe: cpe:2.3:a:beszel:beszel:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>beszel</title>")'
        condition: and
