id: opensign-panel

info:
  name: OpenSign Login Panel - Detect
  author: righettod
  severity: info
  description: |
    OpenSign Login panel was discovered.
  reference:
    - https://www.opensignlabs.com/
    - https://github.com/OpenSignLabs/OpenSign
  classification:
    cpe: cpe:2.3:a:opensign:opensign:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    verified: true
    shodan-query: http.title:"opensign"
    vendor: opensign
    product: opensign
  tags: panel,opensign,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/locales/en/translation.json"
      - "{{BaseURL}}/"

    stop-at-first-match: true
    matchers:
      - type: dsl
        name: opensign
        cpe: cpe:2.3:a:opensign:opensign:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains(body, "OpenSign")'
        condition: and
