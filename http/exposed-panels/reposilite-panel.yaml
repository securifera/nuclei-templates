id: reposilite-panel

info:
  name: Reposilite Login Panel - Detect
  author: righettod
  severity: info
  description: |
    Reposilite products was detected.
  reference:
    - https://reposilite.com/
    - https://github.com/dzikoysk/reposilite
  classification:
    cpe: cpe:2.3:a:reposilite:reposilite:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"reposilite"
    vendor: reposilite
    product: reposilite
  tags: panel,reposilite,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        name: reposilite
        cpe: cpe:2.3:a:reposilite:reposilite:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "reposilite repository", "reposilite description", "hosted through the reposilite")'
        condition: and
