id: content-central-login

info:
  name: Content Central Login Panel - Detect
  author: theabhinavgaur
  severity: info
  description: Content Central login panel was detected.
  classification:
    cpe: cpe:2.3:a:content-central:content-central:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"Content Central Login"
    vendor: content-central
    product: content-central
  tags: panel,content-central,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.aspx"
      - "{{BaseURL}}/ContentCentral/login.aspx/"

    matchers-condition: and
    matchers:
      - type: word
        name: content-central
        cpe: cpe:2.3:a:content-central:content-central:*:*:*:*:*:*:*:*
        part: body
        words:
          - Content Central Login

      - type: status
        status:
          - 200
