id: openshift-oauth-proxy-panel

info:
  name: OpenShift OAuth Proxy - Panel Detect
  author: r3dg33k
  severity: info
  description: |
    Detects OpenShift OAuth Proxy login endpoints via `_oauth_proxy_csrf` or `_oauth_proxy` cookie and login page content. Checks both the default port and port 9001.
  classification:
    cpe: cpe:2.3:a:openshift:openshift:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    fofa-query: body="Openshift" && port="9001"
    vendor: openshift
    product: openshift
  tags: openshift,redhat,detect,oauth,proxy,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{RootURL}}:9001"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: openshift
        cpe: cpe:2.3:a:openshift:openshift:*:*:*:*:*:*:*:*
        part: body
        words:
          - "OpenShift"
          - "Log in with"
        condition: and

      - type: regex
        part: header
        name: csrf-cookie-header
        cpe: cpe:2.3:a:openshift:openshift:*:*:*:*:*:*:*:*
        regex:
          - "(?i)_oauth_proxy_csrf=[^;]+"
          - "(?i)_oauth_proxy=[^;]*"

      - type: status
        status:
          - 403
