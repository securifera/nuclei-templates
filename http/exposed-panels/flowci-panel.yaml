id: flowci-panel

info:
  name: FlowCI Panel - Detect
  author: Adam Crosser
  severity: info
  description: FlowCI panel was detected.
  reference:
    - https://github.com/FlowCI/flow-web-x
    - https://flowci.github.io/#/
  classification:
    cpe: cpe:2.3:a:flowci:flowci:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: flowci
    product: flowci
  tags: panel,flowci,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: flowci
        cpe: cpe:2.3:a:flowci:flowci:*:*:*:*:*:*:*:*
        words:
          - '<title>flow-web-x</title>'

      - type: status
        status:
          - 200
