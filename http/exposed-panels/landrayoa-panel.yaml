id: landrayoa-panel

info:
  name: Landray Login Panel - Detect
  author: YanYun
  severity: info
  description: Landray login panel was detected.
  classification:
    cpe: cpe:2.3:a:landrayoa:landrayoa:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: landrayoa
    product: landrayoa
  tags: panel,landrayoa,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login.jsp'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: landrayoa
        cpe: cpe:2.3:a:landrayoa:landrayoa:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'lui_login_input_username'
          - 'lui_login_input_password'
        condition: and

      - type: word
        name: landrayoa-2
        cpe: cpe:2.3:a:landrayoa:landrayoa:*:*:*:*:*:*:*:*
        words:
          - 'isopen='
        part: header
