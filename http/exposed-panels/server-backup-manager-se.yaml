id: server-backup-manager-se

info:
  name: Server Backup Manager SE Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Server Backup Manager SE login panel was detected.
  classification:
    cpe: cpe:2.3:a:server:server:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Server Backup Manager SE"
    vendor: server
    product: server
  tags: panel,server,backup,manager,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login.zul'

    matchers-condition: and
    matchers:
      - type: regex
        name: server
        cpe: cpe:2.3:a:server:server:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "<title>.*(Server Backup Manager SE).*</title>"

      - type: status
        status:
          - 200
