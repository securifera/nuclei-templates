id: star-network-utility

info:
  name: Star Micronics Network Utility Panel - Detect
  author: ritikchaddha
  severity: info
  description: Star Micronics Network Utility panel was detected.
  classification:
    cpe: cpe:2.3:a:utility:utility:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Network Utility"
    vendor: utility
    product: utility
  tags: panel,utility,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: utility
        cpe: cpe:2.3:a:utility:utility:*:*:*:*:*:*:*:*
        words:
          - 'Star Micronics'
          - 'Network Utility'
        condition: and

      - type: status
        status:
          - 200
