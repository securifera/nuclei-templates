id: teradek-panel

info:
  name: Teradek Cube Administrative Console - Panel
  author: DhiyaneshDk
  severity: info
  reference:
    - https://www.facebook.com/photo/?fbid=612496907587499&set=a.467014098802448
  classification:
    cpe: cpe:2.3:a:teradek:teradek:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Teradek Cube Administrative Console"
    vendor: teradek
    product: teradek
  tags: panel,login,teradek,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.cs"

    matchers-condition: and
    matchers:
      - type: word
        name: teradek
        cpe: cpe:2.3:a:teradek:teradek:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Teradek Cube Administrative Console'
          - 'Password:'
        condition: and

      - type: status
        status:
          - 200
