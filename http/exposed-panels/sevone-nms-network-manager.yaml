id: sevone-nms-network-manager

info:
  name: SevOne NMS Network Manager
  author: pussycat0x
  severity: info
  classification:
    cpe: cpe:2.3:a:sevone:sevone:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"SevOne NMS - Network Manager"
    vendor: sevone
    product: sevone
  tags: sevone,manager,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/#login"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: sevone
        cpe: cpe:2.3:a:sevone:sevone:*:*:*:*:*:*:*:*
        part: body
        words:
          - "SevOne NMS - Network Manager"

      - type: status
        status:
          - 200
