id: scs-landfill-control

info:
  name: SCS Remote Monitoring and Control Login Panel - Detect
  author: geeknik
  severity: info
  description: SCS Remote Monitoring and Control login panel was detected.
  reference:
    - https://www.scsengineers.com/services/remote-monitoring-control/
  classification:
    cpe: cpe:2.3:a:scs:scs:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: scs
    product: scs
  tags: panel,scs,rmc,iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: scs
        cpe: cpe:2.3:a:scs:scs:*:*:*:*:*:*:*:*
        words:
          - "<title>Log in to SCS RMC®</title>"
          - "SCS RMC®</div>"
        condition: and
