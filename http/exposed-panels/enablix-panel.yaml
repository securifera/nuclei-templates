id: enablix-panel

info:
  name: Enablix Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: |
    Enablix panel was detected.
  classification:
    cpe: cpe:2.3:a:enablix:enablix:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: title:"Enablix"
    vendor: enablix
    product: enablix
  tags: enablix,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.html#/login"

    matchers-condition: and
    matchers:
      - type: word
        name: enablix
        cpe: cpe:2.3:a:enablix:enablix:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Enablix</title>"
        case-insensitive: true

      - type: status
        status:
          - 200
