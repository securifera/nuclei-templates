id: chemotargets-clarityvista-panel

info:
  name: Chemotargets Clarity Vista Login Panel - Detect
  author: righettod
  severity: info
  description: |
    Chemotargets Clarity Vista login panel was detected.
  reference:
    - https://chemotargets.com/clarityvista/
  classification:
    cpe: cpe:2.3:a:chemotargets:chemotargets:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"ClarityVista"
    vendor: chemotargets
    product: chemotargets
  tags: panel,chemotargets,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers:
      - type: dsl
        name: chemotargets
        cpe: cpe:2.3:a:chemotargets:chemotargets:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>clarityvista", "content=\"clarity pharmacovigilance")'
        condition: and
