id: dbt-docs-panel

info:
  name: dbt Docs Panel - Detect
  author: johnk3r
  severity: info
  description: dbt Docs panel was detected.
  classification:
    cpe: cpe:2.3:a:dbt:dbt:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"dbt Docs"
    vendor: dbt
    product: dbt
  tags: panel,dbt,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: dbt
        cpe: cpe:2.3:a:dbt:dbt:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>dbt Docs</title>"

      - type: status
        status:
          - 200
