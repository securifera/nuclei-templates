id: txadmin-panel

info:
  name: txAdmin Panel - Detect
  author: s4e-io
  severity: info
  description: |
    txAdmin panel was discovered.
  classification:
    cpe: cpe:2.3:a:txadmin:txadmin:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="txAdmin Login"
    vendor: txadmin
    product: txadmin
  tags: panel,login,txadmin,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth"

    matchers:
      - type: dsl
        name: txadmin
        cpe: cpe:2.3:a:txadmin:txadmin:*:*:*:*:*:*:*:*
        dsl:
          - 'contains_any(body, "<title>txAdmin Login</title>", "txAdmin Logo")'
          - 'status_code == 200'
        condition: and
