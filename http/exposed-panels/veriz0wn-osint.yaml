id: veriz0wn-osint

info:
  name: Veriz0wn OSINT - Detect
  author: pussycat0x
  severity: info
  classification:
    cpe: cpe:2.3:a:veriz0wn:veriz0wn:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Veriz0wn"
    vendor: veriz0wn
    product: veriz0wn
  tags: veriz0wn,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: veriz0wn
        cpe: cpe:2.3:a:veriz0wn:veriz0wn:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Veriz0wn : OSINT"

      - type: status
        status:
          - 200
