id: privategpt-detect

info:
  name: PrivateGPT - Detect
  author: ritikchaddha
  severity: info
  description: |
    PrivateGPT panel has been detected.
  reference:
    - https://github.com/zylon-ai/private-gpt
  classification:
    cpe: cpe:2.3:a:privategpt:privategpt:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"private gpt"
    product: private-gpt
    vendor: privategpt
  tags: panel,privategpt,detect,discovery,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: private-gpt
        cpe: cpe:2.3:a:privategpt:privategpt:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'alt=PrivateGPT'
          - 'title":"My Private GPT'
          - 'content="My Private GPT'
        condition: or

      - type: status
        status:
          - 200
