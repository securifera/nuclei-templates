id: lacie-panel

info:
  name: LaCie Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: LaCie login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/7118
  classification:
    cpe: cpe:2.3:a:lacie:lacie:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 2
    vendor: lacie
    product: lacie
  tags: panel,lacie,login,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/dashboard/'

    matchers-condition: and
    matchers:
      - type: word
        name: lacie
        cpe: cpe:2.3:a:lacie:lacie:*:*:*:*:*:*:*:*
        words:
          - 'id_LaCie'
        part: body

      - type: regex
        name: lacie-2
        cpe: cpe:2.3:a:lacie:lacie:*:*:*:*:*:*:*:*
        regex:
          - '(?m)<title>([a-zA-Z0-9&#; ]|)+Dashboard<\/title>$'
        part: body

      - type: status
        status:
          - 200
