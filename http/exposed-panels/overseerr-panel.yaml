id: overseerr-panel

info:
  name: Overseerr Panel - Detect
  author: rxerium
  severity: info
  description: |
    Overseerr is a request management and media discovery tool built to work with your existing Plex ecosystem.
  reference:
    - https://overseerr.dev/
    - https://github.com/sct/overseerr
  classification:
    cpe: cpe:2.3:a:overseerr:overseerr:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: Overseerr account
    vendor: overseerr
    product: overseerr
  tags: panel,overseerr,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        name: overseerr
        cpe: cpe:2.3:a:overseerr:overseerr:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Sign In - Overseerr"

      - type: status
        status:
          - 200
