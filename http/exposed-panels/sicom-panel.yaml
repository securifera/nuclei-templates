id: sicom-mgrng-login

info:
  name: Sicom MGRNG - Administrative Login Found
  author: sullo
  severity: info
  description: |
    Sicom MGRNG administrative login page found.
  classification:
    cpe: cpe:2.3:a:sicom:sicom:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-668
  metadata:
    max-request: 1
    vendor: sicom
    product: sicom
  tags: sicom,mgrng,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/~sicom/mgrng/LoginForm.php"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: sicom
        cpe: cpe:2.3:a:sicom:sicom:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>MGRNG Login</title>'
