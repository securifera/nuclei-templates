id: cluster-trino-panel

info:
  name: Cluster Overview Trino - Panel
  author: DhiyaneshDk
  severity: info
  description: |
    Cluster Overview Trino Login Panel was discovered.
  classification:
    cpe: cpe:2.3:a:cluster:cluster:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: cluster
    product: cluster
  tags: cluster,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/login.html"

    matchers:
      - type: dsl
        name: cluster
        cpe: cpe:2.3:a:cluster:cluster:*:*:*:*:*:*:*:*
        dsl:
          - 'contains_all(body, "Cluster Overview - Trino", "Log in")'
          - 'status_code == 200'
        condition: and
