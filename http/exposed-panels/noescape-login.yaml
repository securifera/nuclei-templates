id: noescape-login

info:
  name: NoEscape Login Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: NoEscape login panel was detected.
  classification:
    cpe: cpe:2.3:a:noescape:noescape:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"NoEscape - Login"
    vendor: noescape
    product: noescape
  tags: panel,noescape,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: noescape
        cpe: cpe:2.3:a:noescape:noescape:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'NoEscape - Login'
