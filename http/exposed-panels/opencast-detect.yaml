id: opencast-panel

info:
  name: Opencast Admin Panel Discovery
  author: cyllective,daffainfo
  severity: info
  description: An Opencast Admin panel was discovered. Opencast is a free and open source solution for automated video capture and distribution at scale.
  reference:
    - https://github.com/opencast/opencast
  classification:
    cpe: cpe:2.3:a:opencast:opencast:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: opencast
    product: opencast
  tags: panel,opencast,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin-ng/login.html"

    matchers-condition: and
    matchers:
      - type: word
        name: opencast
        cpe: cpe:2.3:a:opencast:opencast:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Opencast</title>'

      - type: status
        status:
          - 200
