id: powerchute-network-panel

info:
  name: PowerChute Network Shutdown Panel - Detect
  author: DhiyaneshDK
  severity: info
  classification:
    cpe: cpe:2.3:a:powerchute:powerchute:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"PowerChute Network Shutdown"
    vendor: powerchute
    product: powerchute
  tags: panel,login,powerchute,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        name: powerchute
        cpe: cpe:2.3:a:powerchute:powerchute:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>PowerChute Network Shutdown</title>"

      - type: status
        status:
          - 200
