id: automatisch-panel

info:
  name: Automatisch Panel - Detect
  author: rxerium
  severity: info
  description: |
    The open source Zapier alternative.
  reference:
    - https://automatisch.io/
    - https://github.com/automatisch/automatisch
  classification:
    cpe: cpe:2.3:a:automatisch:automatisch:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"Automatisch"
    vendor: automatisch
    product: automatisch
  tags: panel,automatisch,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: automatisch
        cpe: cpe:2.3:a:automatisch:automatisch:*:*:*:*:*:*:*:*
        words:
          - '<title>Automatisch'

      - type: status
        status:
          - 200
