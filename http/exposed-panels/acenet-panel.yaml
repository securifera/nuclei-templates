id: acenet-panel

info:
  name: AceNet AceReporter Report Panel - Detect
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:acenet:acenet:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:-1595726841
    fofa-query: body="Login @ Reporter"
    vendor: acenet
    product: acenet
  tags: panel,login,acenet,acereporter,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php"

    matchers-condition: and
    matchers:
      - type: word
        name: acenet
        cpe: cpe:2.3:a:acenet:acenet:*:*:*:*:*:*:*:*
        words:
          - 'Welcome to Reporter'
          - 'Login @ Reporter'
        condition: and

      - type: status
        status:
          - 200
