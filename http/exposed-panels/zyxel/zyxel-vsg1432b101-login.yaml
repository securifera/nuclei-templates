id: zyxel-vsg1432b101-login

info:
  name: Zyxel VSG1432-B101 - Login Detection
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:zyxel:zyxel:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"VSG1432-B101"
    vendor: zyxel
    product: zyxel
  tags: tech,zyxel,modem,router,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: zyxel
        cpe: cpe:2.3:a:zyxel:zyxel:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Welcome to ZyXEL VSG1432-B101::"

      - type: status
        status:
          - 200
