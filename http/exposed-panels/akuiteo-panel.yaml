id: akuiteo-panel

info:
  name: Akuiteo Login Panel - Detect
  author: righettod
  severity: info
  description: |
    Akuiteo products was detected.
  reference:
    - https://www.akuiteo.com/en/
  classification:
    cpe: cpe:2.3:a:akuiteo:akuiteo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Akuiteo"
    vendor: akuiteo
    product: akuiteo
  tags: panel,akuiteo,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/akuiteo.collabs/login/login.html"
      - "{{BaseURL}}/akuiteo/login.html/"

    redirects: true
    max-redirects: 2

    stop-at-first-match: true
    matchers:
      - type: dsl
        name: akuiteo
        cpe: cpe:2.3:a:akuiteo:akuiteo:*:*:*:*:*:*:*:*
        dsl:
          - 'contains_any(to_lower(body), "akuiteo collabs</title>", "akuiteo mobile</title>", "akuiteo</title>", "<title>[akuiteo]")'
        condition: and

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)x-akuiteo-masterhash:\s+([0-9a-f]+)'
