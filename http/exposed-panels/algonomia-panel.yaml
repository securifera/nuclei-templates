id: algonomia-panel

info:
  name: Algonomia Leaf Platform Panel - Detect
  author: righettod
  severity: info
  description: |
    Algonomia Leaf Platform login panel was detected.
  reference:
    - https://algonomia.com/
  classification:
    cpe: cpe:2.3:a:algonomia:algonomia:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: algonomia
    product: algonomia
  tags: tech,algonomia,detect,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/assets/i18n/en.json"

    matchers:
      - type: dsl
        name: algonomia
        cpe: cpe:2.3:a:algonomia:algonomia:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "logincomponent\":")'
          - 'contains_any(to_lower(body), "leafplatform", "leaf platform")'
          - 'contains(header, "application/json")'
        condition: and
