id: parallels-html-client

info:
  name: Parallels HTML5 Client Login Panel - Detect
  author: pdteam
  severity: info
  description: Parallels HTML5 Client login panel was detected.
  classification:
    cpe: cpe:2.3:a:parallels-html-client:parallels-html-client:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: parallels-html-client
    product: parallels-html-client
  tags: panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/RASHTML5Gateway/"

    matchers:
      - type: word
        name: parallels-html-client
        cpe: cpe:2.3:a:parallels-html-client:parallels-html-client:*:*:*:*:*:*:*:*
        words:
          - "<title>Parallels HTML5 Client</title>"
        part: body
