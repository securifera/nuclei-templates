id: request-tracker-panel

info:
  name: Request Tracker - Panel
  author: burso
  severity: info
  description: |
    Request Tracker panel was discovered.
  classification:
    cpe: cpe:2.3:a:request:tracker:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:203612613
    vendor: request
    product: tracker
  tags: panel,login,request,tracker,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: tracker
        cpe: cpe:2.3:a:request:tracker:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'RT.Config'
          - 'RT.CurrentUser'
        condition: and

    extractors:
      - type: regex
        regex:
          - 'RT(?:\sVersion)?\s+(\d+\.\d+\.\d+)'
        group: 1
