id: acunetix-panel-detect

info:
  name: Acunetix Login Panel
  author: joanbono
  severity: info
  description: An Acunetix login panel was detected.
  reference:
    - https://www.acunetix.com/
  classification:
    cpe: cpe:2.3:a:acunetix:acunetix:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: acunetix
    product: acunetix
  tags: panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/#/login"

    matchers-condition: and
    matchers:
      - type: word
        name: acunetix
        cpe: cpe:2.3:a:acunetix:acunetix:*:*:*:*:*:*:*:*
        words:
          - '<title>Acunetix</title>'
          - '<acx-root></acx-root>'
        part: body

      - type: status
        status:
          - 200
