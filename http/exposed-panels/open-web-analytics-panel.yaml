id: open-web-analytics-panel

info:
  name: Open Web Analytics Login - Detect
  author: DhiyaneshDK
  severity: info
  description: |
    Detects the presence of Open Web Analytics login page.
  classification:
    cpe: cpe:2.3:a:open-web-analytics:open-web-analytics:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"OWA CONFIG SETTINGS"
    vendor: open-web-analytics
    product: open-web-analytics
  tags: open-web-analytics,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php?owa_do=base.loginForm"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: open-web-analytics
        cpe: cpe:2.3:a:open-web-analytics:open-web-analytics:*:*:*:*:*:*:*:*
        words:
          - "OWA.config.main_url"

      - type: status
        status:
          - 200
