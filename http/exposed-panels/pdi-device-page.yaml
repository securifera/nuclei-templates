id: pdi-device-page

info:
  name: PDI Intellifuel - Device Page
  author: DhiyaneshDk
  severity: low
  reference:
    - https://www.facebook.com/photo?fbid=629130339257489&set=a.467014098802448
  classification:
    cpe: cpe:2.3:a:pdi:pdi:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"PDI Intellifuel"
    vendor: pdi
    product: pdi
  tags: exposure,pdi,intellifuel,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php"

    matchers-condition: and
    matchers:
      - type: word
        name: pdi
        cpe: cpe:2.3:a:pdi:pdi:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Intellifuel Device page'

      - type: status
        status:
          - 200
