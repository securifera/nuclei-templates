id: vmware-aria-panel

info:
  name: VMware Aria Operations Login - Detect
  author: rxerium
  severity: info
  description: |
    Detects VMware Aria Operations Panel.
  classification:
    cpe: cpe:2.3:a:aria:aria:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"VMware Aria Operations"
    vendor: aria
    product: aria
  tags: panel,aria,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/login.action"

    matchers-condition: and
    matchers:
      - type: word
        name: aria
        cpe: cpe:2.3:a:aria:aria:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>VMware Aria Operations</title>"

      - type: status
        status:
          - 200
