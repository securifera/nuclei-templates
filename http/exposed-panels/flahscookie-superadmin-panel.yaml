id: flahscookie-superadmin-panel

info:
  name: Flahscookie Superadmin Login Panel - Detect
  author: Hardik-Solanki
  severity: info
  description: Flahscookie Superadmin login panel was detected.
  classification:
    cpe: cpe:2.3:a:flahscookie:superadmin:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Flahscookie Superadmin"
    vendor: flahscookie
    product: superadmin
  tags: panel,flahscookie,superadmin,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/pages/login'

    matchers-condition: and
    matchers:
      - type: word
        name: superadmin
        cpe: cpe:2.3:a:flahscookie:superadmin:*:*:*:*:*:*:*:*
        words:
          - "Flahscookie Superadmin"

      - type: status
        status:
          - 200
