id: dell-remote-web-access-panel

info:
  name: Dell Remote Web Access Panel - Detect
  author: pussycat0x
  severity: info
  description: |
    Dell Remote Web Access is a secure web portal that enables remote access to files, applications, and desktops hosted on Dell servers.
  classification:
    cpe: cpe:2.3:a:remote-web:remote-web:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Dell Remote web"
    vendor: remote-web
    product: remote-web
  tags: dell,remote-web,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: dsl
        name: remote-web
        cpe: cpe:2.3:a:remote-web:remote-web:*:*:*:*:*:*:*:*
        dsl:
          - "status_code == 200"
          - "contains(body, 'Dell Remote Web Access - Remote Web Access')"
        condition: and
