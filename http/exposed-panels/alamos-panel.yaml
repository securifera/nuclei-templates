id: alamos-panel

info:
  name: Alamos GmbH Panel - Detect
  author: Splint3r7
  severity: info
  description: |
    Alamos GmbH panel was detected.
  classification:
    cpe: cpe:2.3:a:alamos:alamos:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Alamos GmbH | FE2"
    vendor: alamos
    product: alamos
  tags: panel,alamos,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        name: alamos
        cpe: cpe:2.3:a:alamos:alamos:*:*:*:*:*:*:*:*
        dsl:
          - 'contains(body, "<title>Alamos GmbH | FE2")'
          - 'status_code == 200'
        condition: and
