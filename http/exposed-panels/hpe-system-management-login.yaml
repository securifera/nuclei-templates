id: hpe-system-management-login

info:
  name: Hewlett Packard Enterprise System Management Login Panel - Detect
  author: divya_mudgal
  severity: info
  description: Hewlett Packard Enterprise System Management login page was detected.
  classification:
    cpe: cpe:2.3:a:hpe:hpe:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: hpe
    product: hpe
  tags: hpe,tech,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cpqlogin.htm"

    matchers-condition: and
    matchers:
      - type: word
        name: hpe
        cpe: cpe:2.3:a:hpe:hpe:*:*:*:*:*:*:*:*
        condition: and
        part: body
        words:
          - "HPE System Management Homepage"
          - "/proxy/ssllogin"

    extractors:
      - type: regex
        part: body
        regex:
          - "HPE System Management Homepage v([0-9-.]*)"
