id: horde-login-panel

info:
  name: Horde Login Panel - Detect
  author: ritikchaddha
  severity: info
  description: Horde login panel was detected.
  classification:
    cpe: cpe:2.3:a:horde:horde:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:-741491222
    vendor: horde
    product: horde
  tags: horde,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/horde/login.php"
      - "{{BaseURL}}/login.php"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: horde
        cpe: cpe:2.3:a:horde:horde:*:*:*:*:*:*:*:*
        words:
          - "HordeLogin.user"

      - type: status
        status:
          - 200
