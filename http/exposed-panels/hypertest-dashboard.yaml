id: hypertest-dashboard

info:
  name: HyperTest Common Dashboard - Detect
  author: DhiyaneshDk
  severity: info
  description: HyperTest Common Dashboard was detected.
  reference:
    - https://www.facebook.com/photo?fbid=487809593389565&set=a.467014098802448
    - https://www.hypertest.co
  classification:
    cpe: cpe:2.3:a:hypertest:hypertest:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"HyperTest"
    vendor: hypertest
    product: hypertest
  tags: panel,exposure,hypertest,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/dashboard/"

    matchers-condition: and
    matchers:
      - type: word
        name: hypertest
        cpe: cpe:2.3:a:hypertest:hypertest:*:*:*:*:*:*:*:*
        words:
          - "<title>HyperTest | Common Dashboard</title>"
          - "HyperTest | Dashboard"
          - "HyperTest doesn't work"
        condition: or

      - type: word
        name: hypertest-2
        cpe: cpe:2.3:a:hypertest:hypertest:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'text/html'
