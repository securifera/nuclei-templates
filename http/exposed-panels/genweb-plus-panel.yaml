id: gemweb-plus-panel

info:
  name: GEMweb Plus 500 Login Panel - Detect
  author: princechaddha
  severity: info
  description: GEMweb Plus 500 login panel was detected.
  classification:
    cpe: cpe:2.3:a:genweb-plus:genweb-plus:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: genweb-plus
    product: genweb-plus
  tags: panel,gemweb,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: genweb-plus
        cpe: cpe:2.3:a:genweb-plus:genweb-plus:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>GEMweb Plus 500</title>"

      - type: status
        status:
          - 200
