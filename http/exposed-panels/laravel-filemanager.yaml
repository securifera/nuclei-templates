id: laravel-filemanager

info:
  name: Laravel File Manager - Panel Detect
  author: princechaddha
  severity: info
  description: Laravel File Manager panel was detected.
  reference:
    - https://github.com/UniSharp/laravel-filemanager
  classification:
    cpe: cpe:2.3:a:laravel:filemanager:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: laravel
    product: filemanager
  tags: panel,laravel,filemanager,fileupload,intrusive,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/laravel-filemanager?type=Files"

    matchers-condition: and
    matchers:
      - type: word
        name: filemanager
        cpe: cpe:2.3:a:laravel:filemanager:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Laravel FileManager"

      - type: status
        status:
          - 200
