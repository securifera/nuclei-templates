id: tekton-dashboard

info:
  name: Tekton Dashboard Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: Tekton Dashboard panel was detected.
  classification:
    cpe: cpe:2.3:a:tekton:tekton:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Tekton"
    vendor: tekton
    product: tekton
  tags: panel,tekton,exposure,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/#/pipelines"

    matchers-condition: and
    matchers:
      - type: word
        name: tekton
        cpe: cpe:2.3:a:tekton:tekton:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Tekton Dashboard"

      - type: word
        name: tekton-2
        cpe: cpe:2.3:a:tekton:tekton:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"
