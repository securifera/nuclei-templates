id: caton-network-manager-system

info:
  name: Caton Network Manager System Login Panel - Detect
  author: pussycat0x
  severity: info
  description: Caton Network Manager System login panel was detected.
  classification:
    cpe: cpe:2.3:a:caton:caton:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Caton Network Manager System"
    vendor: caton
    product: caton
  tags: caton,manager,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: caton
        cpe: cpe:2.3:a:caton:caton:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Caton Network Manager System"

      - type: status
        status:
          - 200
