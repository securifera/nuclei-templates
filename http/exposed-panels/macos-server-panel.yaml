id: macos-server-panel

info:
  name: macOS Server Panel - Detect
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:macos:macos:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"macOS Server"
    vendor: macos
    product: macos
  tags: panel,login,macos-server,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: macos
        cpe: cpe:2.3:a:macos:macos:*:*:*:*:*:*:*:*
        words:
          - 'macOS Server'
          - 'apple-system'
        condition: and

      - type: status
        status:
          - 200
