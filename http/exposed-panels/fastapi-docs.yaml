id: fastapi-docs

info:
  name: FastAPI Docs Panel - Detect
  author: github.com/its0x08
  severity: info
  description: FastAPI Docs panel was detected.
  classification:
    cpe: cpe:2.3:a:fastapi:fastapi:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 3
    vendor: fastapi
    product: fastapi
  tags: fastapi,tech,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/docs"
      - "{{BaseURL}}/redoc"
      - "{{BaseURL}}/openapi.json"

    matchers:
      - type: word
        name: fastapi
        cpe: cpe:2.3:a:fastapi:fastapi:*:*:*:*:*:*:*:*
        words:
          - "<title>FastAPI - Swagger UI</title>"
          - "<title>FastAPI - ReDoc</title>"
          - '{"title":"FastAPI"'
        condition: or
