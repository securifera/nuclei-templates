id: ecosys-command-center

info:
  name: ECOSYS Command Center RX Panel - Detect
  author: princechaddha
  severity: info
  description: ECOSYS Command Center RX panel was detected.
  classification:
    cpe: cpe:2.3:a:ecosys:ecosys:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: ecosys
    product: ecosys
  tags: panel,printer,ecosys,iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: ecosys
        cpe: cpe:2.3:a:ecosys:ecosys:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Command Center RX</title>"

      - type: status
        status:
          - 200
