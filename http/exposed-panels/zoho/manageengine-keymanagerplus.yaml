id: manageengine-keymanagerplus

info:
  name: ZOHO ManageEngine KeyManagerPlus Panel - Detect
  author: righettod
  severity: info
  description: ZOHO ManageEngine KeyManagerPlus panel was detected.
  reference:
    - https://www.manageengine.com/key-manager/
  classification:
    cpe: cpe:2.3:a:manageengine:manageengine:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 2
    vendor: manageengine
    product: manageengine
  tags: panel,zoho,manageengine,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/apiclient/index.jsp'
      - '{{BaseURL}}/pki/images/keyManager_title.ico'

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: dsl
        name: manageengine
        cpe: cpe:2.3:a:manageengine:manageengine:*:*:*:*:*:*:*:*
        dsl:
          - "status_code==200"
          - "contains(tolower(body), '<title>key manager plus</title>')"
        condition: and

      - type: dsl
        name: manageengine-2
        cpe: cpe:2.3:a:manageengine:manageengine:*:*:*:*:*:*:*:*
        dsl:
          - "status_code==200"
          - "('192917117' == mmh3(base64_py(body)))"
        condition: and
