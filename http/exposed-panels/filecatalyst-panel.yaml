id: filecatalyst-panel

info:
  name: FileCatalyst File Transfer Solution - Detect
  author: DhiyaneshDK
  severity: info
  description: |
    Detects the presence of FileCatalyst file transfer solution login panel
  classification:
    cpe: cpe:2.3:a:filecatalyst:filecatalyst:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"FileCatalyst file transfer solution"
    vendor: filecatalyst
    product: filecatalyst
  tags: panel,login,filecatalyst,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/workflow/jsp/logon.jsp"

    matchers-condition: and
    matchers:
      - type: word
        name: filecatalyst
        cpe: cpe:2.3:a:filecatalyst:filecatalyst:*:*:*:*:*:*:*:*
        part: body
        words:
          - "FileCatalyst file transfer solution"

      - type: status
        status:
          - 200
