id: tailon-panel

info:
  name: Tailon Panel - Detect
  author: ritikchaddha
  severity: unknown
  reference:
    - https://github.com/gvalkov/tailon
  classification:
    cpe: cpe:2.3:a:tailon:tailon:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"tailon"
    vendor: tailon
    product: tailon
  tags: panel,tailon,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: tailon
        cpe: cpe:2.3:a:tailon:tailon:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Tailon'
          - 'class="tailon-dark'
        condition: or

      - type: status
        status:
          - 200
