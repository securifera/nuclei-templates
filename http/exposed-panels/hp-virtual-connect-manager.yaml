id: hp-virtual-connect-manager

info:
  name: HP Virtual Connect Manager Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: HP Virtual Connect Manager login panel was detected.
  classification:
    cpe: cpe:2.3:a:hp-virtual-connect:hp-virtual-connect:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"HP Virtual Connect Manager"
    vendor: hp-virtual-connect
    product: hp-virtual-connect
  tags: panel,hp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/html/index.html"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: hp-virtual-connect
        cpe: cpe:2.3:a:hp-virtual-connect:hp-virtual-connect:*:*:*:*:*:*:*:*
        words:
          - "<title>HP Virtual Connect Manager</title>"
