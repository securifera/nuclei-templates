id: autoset-detect

info:
  name: AutoSet Page - Detect
  author: MaStErCho
  severity: info
  reference:
    - http://autoset.net/xe/
  classification:
    cpe: cpe:2.3:a:autoset:autoset:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"AutoSet"
    vendor: autoset
    product: autoset
  tags: tech,php,autoset,apache,panel,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: autoset
        cpe: cpe:2.3:a:autoset:autoset:*:*:*:*:*:*:*:*
        words:
          - "<title>AutoSet"
          - "alt\">AutoSet"
          - "logo-map logo-autoset"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<title>AutoSet (\d+(\.\d+)+)\b'
