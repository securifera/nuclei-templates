id: cloudphysician-radar

info:
  name: Cloudphysician RADAR Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Cloudphysician RADAR login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/7466
  classification:
    cpe: cpe:2.3:a:cloudphysician-radar:cloudphysician-radar:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Cloudphysician RADAR"
    vendor: cloudphysician-radar
    product: cloudphysician-radar
  tags: panel,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login'

    matchers-condition: and
    matchers:
      - type: word
        name: cloudphysician-radar
        cpe: cpe:2.3:a:cloudphysician-radar:cloudphysician-radar:*:*:*:*:*:*:*:*
        words:
          - '<title>Cloudphysician RADAR</title>'

      - type: status
        status:
          - 200
