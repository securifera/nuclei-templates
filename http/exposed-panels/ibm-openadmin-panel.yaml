id: ibm-openadmin-panel

info:
  name: IBM OpenAdmin Tool - Panel
  author: DhiyaneshDK
  severity: info
  classification:
    cpe: cpe:2.3:a:openadmin:openadmin:*:*:*:*:*:*:*:*
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: http.favicon.hash:965982073
    vendor: openadmin
    product: openadmin
  tags: openadmin,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/openadmin/index.php"

    matchers-condition: and
    matchers:
      - type: word
        name: openadmin
        cpe: cpe:2.3:a:openadmin:openadmin:*:*:*:*:*:*:*:*
        words:
          - 'class="oat oneui"'

      - type: status
        status:
          - 200
