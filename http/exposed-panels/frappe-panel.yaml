id: frappe-panel

info:
  name: Frappe Panel - Detect
  author: Th3l0newolf
  severity: info
  description: |
    Frappe ERPNext Login Panel was discovered.
  reference:
    - https://frappeframework.com/
  classification:
    cpe: cpe:2.3:a:frappe:frappe:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Login to Frappe"
    vendor: frappe
    product: frappe
  tags: frappe,login,web,erp,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login#login"

    matchers-condition: and
    matchers:
      - type: word
        name: frappe
        cpe: cpe:2.3:a:frappe:frappe:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<h4>Login to Frappe</h4>"
          - "frappe.csrf_token"
          - "frappe.boot"

      - type: status
        status:
          - 200
