id: yopass-panel

info:
  name: Yopass Panel - Detect
  author: Adam Crosser
  severity: info
  description: Yopass panel was detected.
  classification:
    cpe: cpe:2.3:a:yopass:yopass:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: title:"Yopass"
    vendor: yopass
    product: yopass
  tags: panel,yopass,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        name: yopass
        cpe: cpe:2.3:a:yopass:yopass:*:*:*:*:*:*:*:*
        words:
          - "<title>Yopass"
