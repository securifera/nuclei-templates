id: red-lion-panel

info:
  name: Red Lion Control Panel - Detect
  author: ritikchaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:red-lion:red-lion:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: red-lion
    product: red-lion
  tags: panel,redlion,detect,iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: red-lion
        cpe: cpe:2.3:a:red-lion:red-lion:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Red Lion</a>"
          - "Red Lion Controls</a>"
        case-insensitive: true
        condition: or
