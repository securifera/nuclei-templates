id: sunbird-dcim-panel

info:
  name: Sunbird DCIM - Detect
  author: bhutch
  severity: info
  description: Sunbird DCIM login panel was detected.
  classification:
    cpe: cpe:2.3:a:sunbird:sunbird:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:781922099
    vendor: sunbird
    product: sunbird
  tags: sunbird,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/dcim/"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: sunbird
        cpe: cpe:2.3:a:sunbird:sunbird:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>dcTrack - Operations</title>'

      - type: status
        status:
          - 200
