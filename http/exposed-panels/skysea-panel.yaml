id: skysea-panel

info:
  name: SKYSEA Client View Panel - Detect
  author: rxerium
  severity: info
  description: |
    SKYSEA Client View panel was detected.
  reference:
    - https://www.skyseaclientview.net/
  classification:
    cpe: cpe:2.3:a:skysea:skysea:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:385597939
    vendor: skysea
    product: skysea
  tags: panel,skysea,detect,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: skysea
        cpe: cpe:2.3:a:skysea:skysea:*:*:*:*:*:*:*:*
        words:
          - "SKYSEA Client View"

      - type: status
        status:
          - 200
