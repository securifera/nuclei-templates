id: homebridge-panel

info:
  name: Homebridge Panel - Detect
  author: rxerium
  severity: info
  description: |
    Homebridge allows you to integrate with smart home devices that do not natively support HomeKit.
  reference:
    - https://homebridge.io/
    - https://github.com/homebridge
  classification:
    cpe: cpe:2.3:a:homebridge:homebridge:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Homebridge"
    vendor: homebridge
    product: homebridge
  tags: panel,homebridge,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        name: homebridge
        cpe: cpe:2.3:a:homebridge:homebridge:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Homebridge</title>'

      - type: status
        status:
          - 200
