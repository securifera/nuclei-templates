id: rustici-content-controller

info:
  name: Rustici Content Controller Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: Rustici Content Controller panel was detected.
  classification:
    cpe: cpe:2.3:a:rustici:rustici:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Rustici Content Controller"
    vendor: rustici
    product: rustici
  tags: panel,rustici,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: rustici
        cpe: cpe:2.3:a:rustici:rustici:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Rustici Content Controller</title>'

      - type: status
        status:
          - 200
