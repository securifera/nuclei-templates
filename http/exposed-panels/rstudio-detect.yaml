id: rstudio-detect

info:
  name: RStudio Panel - Detect
  author: philippedelteil
  severity: info
  description: RStudio panel was detected.
  classification:
    cpe: cpe:2.3:a:rstudio:rstudio:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: rstudio
    product: rstudio
  tags: panel,rstudio,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: rstudio
        cpe: cpe:2.3:a:rstudio:rstudio:*:*:*:*:*:*:*:*
        words:
          - 'RStudio'
        part: header

      - type: status
        status:
          - 302
