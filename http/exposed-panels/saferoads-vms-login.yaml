id: saferoads-vms-login

info:
  name: Saferoads VMS Login Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: Saferoads VMS login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6941
  classification:
    cpe: cpe:2.3:a:saferoads-vms:saferoads-vms:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: saferoads-vms
    product: saferoads-vms
  tags: panel,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login.html'

    matchers:
      - type: word
        name: saferoads-vms
        cpe: cpe:2.3:a:saferoads-vms:saferoads-vms:*:*:*:*:*:*:*:*
        words:
          - 'Saferoads VMS'
