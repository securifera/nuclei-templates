id: sqlpad-panel

info:
  name: SQLPad Panel - Detect
  author: s4e-io
  severity: info
  description: |
    SQLPad panel was discovered.
  reference:
    - https://github.com/sqlpad/sqlpad
  classification:
    cpe: cpe:2.3:a:sqlpad:sqlpad:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: "SQLPad"
    vendor: sqlpad
    product: sqlpad
  tags: panel,login,sqlpad,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/signin"

    matchers:
      - type: dsl
        name: sqlpad
        cpe: cpe:2.3:a:sqlpad:sqlpad:*:*:*:*:*:*:*:*
        dsl:
          - 'contains_any(body, "<title>SQLPad</title>", "webpackJsonpsqlpad")'
          - 'status_code == 200'
        condition: and
