id: weatherlink-configuration

info:
  name: WeatherLinkIP Configuration Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: WeatherLinkIP configuration panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6007
  classification:
    cpe: cpe:2.3:a:weatherlink:weatherlink:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: weatherlink
    product: weatherlink
  tags: panel,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: weatherlink
        cpe: cpe:2.3:a:weatherlink:weatherlink:*:*:*:*:*:*:*:*
        words:
          - '<title>WeatherLinkIP Configuration</title>'

      - type: status
        status:
          - 200
