id: lenovo-thinkserver-panel

info:
  name: Lenovo ThinkServer System Manager Login Panel - Detect
  author: princechaddha
  severity: info
  description: Lenovo ThinkServer System Manager login panel was detected.
  classification:
    cpe: cpe:2.3:a:lenovo:thinkserver:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: lenovo
    product: thinkserver
  tags: panel,thinkserver,lenovo,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: thinkserver
        cpe: cpe:2.3:a:lenovo:thinkserver:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Lenovo ThinkServer System Manager - Login</title>"

      - type: status
        status:
          - 200
