id: opencpu-panel

info:
  name: OpenCPU Panel - Detect
  author: wa1tf0rme
  severity: info
  description: OpenCPU panel was detected.
  reference:
    - https://github.com/opencpu/opencpu/
  classification:
    cpe: cpe:2.3:a:opencpu:opencpu:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: opencpu
    product: opencpu
  tags: panel,opencpu,oss,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ocpu/"

    max-redirects: 2
    redirects: true
    matchers:
      - type: word
        name: opencpu
        cpe: cpe:2.3:a:opencpu:opencpu:*:*:*:*:*:*:*:*
        words:
          - OpenCPU Test Page
          - OpenCPU API Explorer
        condition: or
