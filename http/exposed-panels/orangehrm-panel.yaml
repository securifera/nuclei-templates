id: orangehrm-panel

info:
  name: OrangeHRM Login Panel - Detect
  author: Th3l0newolf
  severity: info
  description: |
    The OrangeHRM login panel was discovered.
  reference:
    - https://www.orangehrm.com/
  classification:
    cpe: cpe:2.3:a:orangehrm:orangehrm:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    shodan-query: OrangeHRM
    vendor: orangehrm
    product: orangehrm
  tags: orangehrm,hrm,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/symfony/web/index.php/auth/login"
      - "{{BaseURL}}/web/index.php/auth/login"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        name: orangehrm
        cpe: cpe:2.3:a:orangehrm:orangehrm:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>OrangeHRM</title>"
          - "OrangeHRM, Inc. All rights reserved"
        condition: or

      - type: status
        status:
          - 200
