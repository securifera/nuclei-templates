id: completeview-web-panel

info:
  name: CompleteView Panel - Detect
  author: tess
  severity: info
  description: CompleteView panel was detected.
  classification:
    cpe: cpe:2.3:a:completeview:completeview:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"CompleteView Web Client"
    vendor: completeview
    product: completeview
  tags: panel,completeview,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/en-US/login?return=/live-view'

    matchers-condition: and
    matchers:
      - type: word
        name: completeview
        cpe: cpe:2.3:a:completeview:completeview:*:*:*:*:*:*:*:*
        part: body
        words:
          - "CompleteView Web Client"

      - type: status
        status:
          - 200
