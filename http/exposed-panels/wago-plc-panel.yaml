id: wago-plc-panel

info:
  name: WAGO PLC Panel - Detect
  author: github.com/its0x08
  severity: info
  description: WAGO PLC panel was detected.
  classification:
    cpe: cpe:2.3:a:wago:wago:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: wago
    product: wago
  tags: panel,wago,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/plc/webvisu.htm"

    matchers-condition: and
    matchers:
      - type: word
        name: wago
        cpe: cpe:2.3:a:wago:wago:*:*:*:*:*:*:*:*
        words:
          - "<TITLE>CoDeSys WebVisualization</TITLE>"
          - "webvisu.jar,minml.jar"
        part: body
        condition: or

      - type: word
        name: wago-2
        cpe: cpe:2.3:a:wago:wago:*:*:*:*:*:*:*:*
        words:
          - "WAGO_Webs"
        part: header
