id: unleash-panel

info:
  name: Unleash Panel - Detect
  author: userdehghani
  severity: info
  description: |
    Open-source feature management solution built for developers.
  reference:
    - https://www.getunleash.io/
  classification:
    cpe: cpe:2.3:a:unleash:unleash:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    shodan-query: http.favicon.hash:-608690655
    vendor: unleash
    product: unleash
  tags: panel,unleash,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/sign-in"
      - "{{BaseURL}}/favicon.ico"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        name: unleash
        cpe: cpe:2.3:a:unleash:unleash:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Unleash'
          - 'content="unleash'
          - 'alt="getunleash'
          - 'Sign-in - Unleash hosted'
        case-insensitive: true
        condition: or

      - type: dsl
        name: unleash-2
        cpe: cpe:2.3:a:unleash:unleash:*:*:*:*:*:*:*:*
        dsl:
          - "status_code==200 && (\"-608690655\" == mmh3(base64_py(body)))"
