id: bomgar-login-panel

info:
  name: Bomgar Login Panel - Detect
  author: pdteam
  severity: info
  description: Bomgar Login panel was detected.
  classification:
    cpe: cpe:2.3:a:bomgar:bomgar:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 2
    vendor: bomgar
    product: bomgar
  tags: panel,bomgar,beyondtrust,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/appliance/login.ns"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: dsl
        name: bomgar
        cpe: cpe:2.3:a:bomgar:bomgar:*:*:*:*:*:*:*:*
        dsl:
          - "status_code==200"
          - "('829321644' == mmh3(base64_py(body)))"
        condition: and

      - type: dsl
        name: bomgar-2
        cpe: cpe:2.3:a:bomgar:bomgar:*:*:*:*:*:*:*:*
        dsl:
          - "status_code==200"
          - "contains(tolower(body), 'bomgar')"
        condition: and
