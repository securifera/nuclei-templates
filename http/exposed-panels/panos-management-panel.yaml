id: panos-management-panel

info:
  name: PAN-OS Management Panel - Detect
  author: bhutch
  severity: info
  description: |
    PAN-OS management panel was detected.
  reference:
    - https://security.paloaltonetworks.com/PAN-SA-2024-0015
  classification:
    cpe: cpe:2.3:a:panos:panos:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:873381299
    vendor: panos
    product: panos
  tags: panel,panos,login,detect,paloaltonetworks,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/php/login.php"

    matchers-condition: and
    matchers:
      - type: word
        name: panos
        cpe: cpe:2.3:a:panos:panos:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<TITLE>Login</TITLE>"
          - 'PAN_FORM_CONTENT'
        condition: and

      - type: status
        status:
          - 200
