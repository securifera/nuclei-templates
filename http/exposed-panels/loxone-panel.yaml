id: loxone-panel

info:
  name: Loxone Intercom Video Panel - Detect
  author: theabhinavgaur
  severity: info
  description: Loxone Intercom Video panel was detected.
  classification:
    cpe: cpe:2.3:a:loxone:loxone:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Loxone Intercom Video"
    vendor: loxone
    product: loxone
  tags: panel,loxone,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: loxone
        cpe: cpe:2.3:a:loxone:loxone:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Loxone Intercom Video</title>"

      - type: status
        status:
          - 200
