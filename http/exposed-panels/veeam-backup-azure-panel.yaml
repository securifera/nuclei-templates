id: veeam-backup-azure-panel

info:
  name: Veeam Backup for Microsoft Azure Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Veeam Backup for Microsoft Azure panel was detected.
  classification:
    cpe: cpe:2.3:a:backup:backup:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: title:"Veeam Backup for Microsoft Azure"
    vendor: backup
    product: backup
  tags: azure,panel,backup,veeam,microsoft,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: backup
        cpe: cpe:2.3:a:backup:backup:*:*:*:*:*:*:*:*
        words:
          - "<title>Veeam Backup for Microsoft Azure</title>"
