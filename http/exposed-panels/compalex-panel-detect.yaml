id: compalex-panel-detect

info:
  name: Compalex Panel - Detect
  author: MaStErCho
  severity: medium
  reference:
    - http://compalex.net/
  classification:
    cpe: cpe:2.3:a:compalex:compalex:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 15
    shodan-query: title:"COMPALEX"
    vendor: compalex
    product: compalex
  tags: tech,php,compalex,sql,panel,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/{{paths}}/'

    payloads:
      paths:
        - 'db'
        - 'sql'
        - 'compalex'
        - '_db'
        - 'dbdiff'

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        name: compalex
        cpe: cpe:2.3:a:compalex:compalex:*:*:*:*:*:*:*:*
        words:
          - "<title>COMPALEX"
          - "<h1>Compalex"
        condition: or

      - type: status
        status:
          - 200
