id: sauter-login

info:
  name: Sauter moduWeb Login Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: Sauter moduWeb login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6883
  classification:
    cpe: cpe:2.3:a:sauter:sauter:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: sauter
    product: sauter
  tags: panel,sauter,edb,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/?locale=en"

    matchers-condition: and
    matchers:
      - type: word
        name: sauter
        cpe: cpe:2.3:a:sauter:sauter:*:*:*:*:*:*:*:*
        words:
          - <title>Sauter moduWeb - Login</title>
        part: body

      - type: status
        status:
          - 200
