id: reolink-panel

info:
  name: Reolink Panel - Detect
  author: s4e-io
  severity: info
  description: |
    Reolink panel was discovered.
  classification:
    cpe: cpe:2.3:a:reolink:reolink:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: "Reolink"
    shodan-query: title:"Reolink"
    vendor: reolink
    product: reolink
  tags: panel,login,reolink,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        name: reolink
        cpe: cpe:2.3:a:reolink:reolink:*:*:*:*:*:*:*:*
        dsl:
          - 'contains(body, "Reolink</title>")'
          - 'status_code == 200'
        condition: and
