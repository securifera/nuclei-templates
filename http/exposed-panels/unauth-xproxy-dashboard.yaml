id: unauth-xproxy-dashboard

info:
  name: X-Proxy Dashboard Panel - Detect
  author: pussycat0x
  severity: info
  description: X-Proxy Dashboard panel was detected.
  classification:
    cpe: cpe:2.3:a:xproxy:xproxy:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    fofa-query: X-Proxy Dashboard
    vendor: xproxy
    product: xproxy
  tags: xproxy,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: xproxy
        cpe: cpe:2.3:a:xproxy:xproxy:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>X-Proxy</title>'
          - 'Dashboard</a>'
        condition: and

      - type: status
        status:
          - 200
