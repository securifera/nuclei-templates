id: akhq-panel

info:
  name: AKHQ Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: |
    AKHQ Panel was discovered.
  classification:
    cpe: cpe:2.3:a:akhq:akhq:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:855432563
    fofa-query: body="AKHQ_PREFIX_UI"
    vendor: akhq
    product: akhq
  tags: akhq,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/login"

    matchers-condition: and
    matchers:
      - type: word
        name: akhq
        cpe: cpe:2.3:a:akhq:akhq:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>AKHQ</title>"
          - "AKHQ_PREFIX_UI"
        condition: or

      - type: status
        status:
          - 200
