id: identityguard-selfservice-entrust

info:
  name: Entrust IdentityGuard Self-Service Login Panel - Detect
  author: nodauf
  severity: info
  description: Entrust IdentityGuard Self-Service login panel was detected.
  classification:
    cpe: cpe:2.3:a:identityguard:identityguard:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: identityguard
    product: identityguard
  tags: panel,identityguard,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        name: identityguard
        cpe: cpe:2.3:a:identityguard:identityguard:*:*:*:*:*:*:*:*
        dsl:
          - "contains(tolower(body),'identityguardselfservice')"
