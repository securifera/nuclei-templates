id: sequoiadb-login

info:
  name: SequoiaDB Login Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: SequoiaDB login panel was detected.
  classification:
    cpe: cpe:2.3:a:sequoiadb:sequoiadb:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"SequoiaDB"
    vendor: sequoiadb
    product: sequoiadb
  tags: sequoiadb,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.html#/"

    matchers-condition: and
    matchers:
      - type: word
        name: sequoiadb
        cpe: cpe:2.3:a:sequoiadb:sequoiadb:*:*:*:*:*:*:*:*
        part: body
        words:
          - <title>SequoiaDB</title>

      - type: word
        name: sequoiadb-2
        cpe: cpe:2.3:a:sequoiadb:sequoiadb:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"
