id: vaultwarden-panel

info:
  name: Vaultwarden Login Panel - Detect
  author: righettod
  severity: info
  description: |
    Vaultwarden products was detected.
  reference:
    - https://github.com/dani-garcia/vaultwarden
  classification:
    cpe: cpe:2.3:a:vaultwarden:vaultwarden:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.html:"vaultwarden"
    vendor: vaultwarden
    product: vaultwarden
  tags: panel,vaultwarden,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/#/login"

    matchers:
      - type: dsl
        name: vaultwarden
        cpe: cpe:2.3:a:vaultwarden:vaultwarden:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "vaultwarden web</title>")'
        condition: and
