id: zap-rest-api-detect

info:
  name: ZAP Rest API Server Running
  author: hahwul
  severity: info
  reference:
    - https://www.zaproxy.org/docs/api/
  classification:
    cpe: cpe:2.3:a:owasp:zed_attack_proxy:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: owasp
    product: zed_attack_proxy
  tags: zap,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: zed_attack_proxy
        cpe: cpe:2.3:a:owasp:zed_attack_proxy:*:*:*:*:*:*:*:*
        part: response
        words:
          - '<title>ZAP API UI</title>'
          - 'Welcome to the OWASP Zed Attack Proxy (ZAP)'
          - 'Access-Control-Allow-Headers: ZAP-Header'
        condition: or
