id: json-server

info:
  name: Json Server
  author: DhiyaneshDK
  severity: low
  reference:
    - https://www.exploit-db.com/ghdb/4550
  classification:
    cpe: cpe:2.3:a:json-server:json-server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"JSON Server"
    vendor: json-server
    product: json-server
  tags: exposure,devops,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: json-server
        cpe: cpe:2.3:a:json-server:json-server:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>JSON Server</title>"

      - type: status
        status:
          - 200
