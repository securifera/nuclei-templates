id: neos-detect

info:
  name: Neos CMS detection
  author: k11h-de
  severity: info
  description: Neos CMS was detected.
  reference:
    - https://github.com/neos/
  classification:
    cpe: cpe:2.3:a:neos:neos:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: neos
    product: neos
  tags: tech,neos,cms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        name: neos
        cpe: cpe:2.3:a:neos:neos:*:*:*:*:*:*:*:*
        words:
          - "This website is powered by Neos"

    extractors:
      - type: kval
        kval:
          - 'x_flow_powered'
