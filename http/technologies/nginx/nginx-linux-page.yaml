id: nginx-linux-page

info:
  name: Nginx HTTP Server Amazon Linux
  author: dhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:nginx:nginx:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Test Page for the Nginx HTTP Server on Amazon Linux"
    vendor: nginx
    product: nginx
  tags: tech,nginx,amazon,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        name: nginx
        cpe: cpe:2.3:a:nginx:nginx:*:*:*:*:*:*:*:*
        words:
          - '<title>Test Page for the Nginx HTTP Server on Amazon Linux</title>'
        condition: and
