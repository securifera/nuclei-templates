id: default-nginx-page

info:
  name: Nginx Default Test Page
  author: dhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:nginx:nginx:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Welcome to nginx!"
    vendor: nginx
    product: nginx
  tags: tech,nginx,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        name: nginx
        cpe: cpe:2.3:a:nginx:nginx:*:*:*:*:*:*:*:*
        words:
          - "<title>Welcome to nginx!</title>"
        part: body
