id: nginx-version

info:
  name: Nginx version detect
  author: philippedelteil,daffainfo
  severity: info
  description: Some nginx servers have the version on the response header. Useful when you need to find specific CVEs on your targets.
  classification:
    cpe: cpe:2.3:a:nginx:nginx:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: nginx
    product: nginx
  tags: tech,nginx,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        name: nginx
        cpe: cpe:2.3:a:nginx:nginx:*:*:*:*:*:*:*:*
        part: header
        regex:
          - 'nginx/[0-9.]+'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: header
        regex:
          - 'nginx/[0-9.]+'
