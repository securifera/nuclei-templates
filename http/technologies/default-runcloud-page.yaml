id: default-runcloud-page

info:
  name: RunCloud Default Page
  author: pussycat0x
  severity: info
  classification:
    cpe: cpe:2.3:a:runcloud:runcloud:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Welcome To RunCloud"
    vendor: runcloud
    product: runcloud
  tags: tech,runcloud,default-page,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: runcloud
        cpe: cpe:2.3:a:runcloud:runcloud:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Welcome To RunCloud'

      - type: status
        status:
          - 200
