id: pega-detect

info:
  name: Pega Infinity Detection
  author: sshell
  severity: info
  classification:
    cpe: cpe:2.3:a:pega:pega_platform:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: pega
    product: pega_platform
  tags: tech,pega,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/prweb/PRRestService/unauthenticatedAPI/v1/docs"

    matchers-condition: and
    matchers:
      - type: word
        name: pega_platform
        cpe: cpe:2.3:a:pega:pega_platform:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"description" :"The Pega API'

      - type: status
        status:
          - 200

      - type: word
        name: pega_platform-2
        cpe: cpe:2.3:a:pega:pega_platform:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'application/json'
