id: microfocus-iprint-detect

info:
  name: Micro Focus iPrint Appliance - Detect
  author: righettod
  severity: info
  description: |
    Micro Focus iPrint Appliance was detected.
  reference:
    - https://www.opentext.com/products/enterprise-server
  classification:
    cpe: cpe:2.3:a:microfocus:iprint_appliance:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Micro Focus iPrint Appliance"
    vendor: microfocus
    product: iprint_appliance
  tags: tech,microfocus,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/welcome/"

    matchers:
      - type: dsl
        name: iprint_appliance
        cpe: cpe:2.3:a:microfocus:iprint_appliance:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "micro focus iprint appliance", "/ippdocs/clients/", "micro focus iprint", "iprint appliance")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)/welcome/css/core([0-9]+).css'
