id: aem-cms

info:
  name: AEM Finder
  author: Swissky
  severity: info
  classification:
    cpe: cpe:2.3:a:adobe:experience_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: adobe
    product: experience_manager
  tags: aem,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    matchers:
      - type: word
        name: experience_manager
        cpe: cpe:2.3:a:adobe:experience_manager:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Welcome to Adobe Experience Manager"
