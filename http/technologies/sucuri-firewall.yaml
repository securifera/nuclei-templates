id: sucuri-firewall

info:
  name: Sucuri Website Firewall - Not Configured
  author: pussycat0x
  severity: info
  classification:
    cpe: cpe:2.3:a:sucuri:cloudproxy:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.html:"sucuri firewall"
    fofa-query: "sucuri firewall"
    vendor: sucuri
    product: cloudproxy
  tags: tech,sucuri,firewall,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: cloudproxy
        cpe: cpe:2.3:a:sucuri:cloudproxy:*:*:*:*:*:*:*:*
        words:
          - '<title>Sucuri WebSite Firewall - Not Configured</title>'

      - type: status
        status:
          - 404
