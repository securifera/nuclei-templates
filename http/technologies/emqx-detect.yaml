id: emqx-detect

info:
  name: Emqx Detection
  author: For3stCo1d
  severity: info
  classification:
    cpe: cpe:2.3:a:emqx:emqx:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: emqx
    product: emqx
  tags: tech,emqx,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/static/emq.ico"

    matchers-condition: and
    matchers:
      - type: dsl
        name: favicon
        cpe: cpe:2.3:a:emqx:emqx:*:*:*:*:*:*:*:*
        dsl:
          - "status_code==200 && ('-670975485' == mmh3(base64_py(body)))"
