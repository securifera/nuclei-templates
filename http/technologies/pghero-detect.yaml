id: pghero-detect

info:
  name: PgHero - Detect
  author: righettod
  severity: info
  description: |
    PgHero products was detected.
  reference:
    - https://github.com/ankane/pghero
  classification:
    cpe: cpe:2.3:a:pghero:pghero:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"PgHero"
    vendor: pghero
    product: pghero
  tags: tech,pghero,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    matchers:
      - type: dsl
        name: pghero
        cpe: cpe:2.3:a:pghero:pghero:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>pghero", "/assets/pghero/", ">pghero</a>")'
        condition: and
