id: sap-igs-detect

info:
  name: SAP Internet Graphics Server (IGS) Detection
  author: _generic_human_
  severity: info
  description: Detection of SAP Internet Graphics Server (IGS)
  classification:
    cpe: cpe:2.3:a:sap:internet_graphics_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sap
    product: internet_graphics_server
  tags: sap,tech,igs,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: internet_graphics_server
        cpe: cpe:2.3:a:sap:internet_graphics_server:*:*:*:*:*:*:*:*
        part: body
        words:
          - "SAP IGS"
          - "is running"
        condition: and

      - type: status
        status:
          - 200

      - type: word
        name: internet_graphics_server-2
        cpe: cpe:2.3:a:sap:internet_graphics_server:*:*:*:*:*:*:*:*
        part: header
        words:
          - "SAP Internet Graphics Server"

    extractors:
      - type: kval
        part: header
        kval:
          - "Server"
