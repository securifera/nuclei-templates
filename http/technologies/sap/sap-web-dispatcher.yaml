id: sap-web-dispatcher-detection

info:
  name: SAP Web Dispatcher detection
  author: randomstr1ng
  severity: info
  description: Detection of SAP Web Dispatcher service
  classification:
    cpe: cpe:2.3:a:sap:web_dispatcher:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sap
    product: web_dispatcher
  tags: sap,webserver,proxy,tech,discovery

http:
  - method: GET
    host-redirects: true
    max-redirects: 2
    path:
      - "{{BaseURL}}/inormalydonotexist"

    matchers:
      - type: word
        name: web_dispatcher
        cpe: cpe:2.3:a:sap:web_dispatcher:*:*:*:*:*:*:*:*
        part: body
        words:
          - "This error page was generated by SAP Web Dispatcher"
