id: sap-message-server-detect

info:
  name: SAP Message Server HTTP - Detect
  author: LRVT,l4rm4nd
  severity: info
  description: |
    Detected SAP Message Server by sending an HTTP request to the root path and checking for SAP Message Server header.
  classification:
    cpe: cpe:2.3:a:sap:netweaver_message_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.html:SAP Message Server
    vendor: sap
    product: netweaver_message_server
  tags: sap,discovery,recon

http:
  - method: GET
    path:
      - "{{RootURL}}"

    matchers:
      - type: word
        name: netweaver_message_server
        cpe: cpe:2.3:a:sap:netweaver_message_server:*:*:*:*:*:*:*:*
        part: header
        words:
          - "SAP Message Server"

    extractors:
      - type: regex
        part: header
        name: version
        group: 1
        regex:
          - "(?i)server:\\s*(SAP Message Server[^\\r\\n]*)"
