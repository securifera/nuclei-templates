id: sap-netweaver-webgui

info:
  name: SAP NetWeaver WebGUI Detection
  author: randomstr1ng
  severity: info
  description: Detection of SAP NetWeaver ABAP Webserver WebGUI
  classification:
    cpe: cpe:2.3:a:sap:netweaver:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sap
    product: netweaver
  tags: sap,webserver,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/sap/bc/gui/sap/its/webgui"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        name: netweaver
        cpe: cpe:2.3:a:sap:netweaver:*:*:*:*:*:*:*:*
        part: body
        words:
          - "sap-system-login"
          - "<title>Logon</title>"
        condition: or
