id: jsf-detect

info:
  name: JavaServer Faces Detection
  author: brenocss,Moritz Nentwig
  severity: info
  description: Searches for JavaServer Faces content on a URL.
  classification:
    cpe: cpe:2.3:a:oracle:javaserver_faces:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: oracle
    product: javaserver_faces
  tags: jsf,tech,primefaces,richfaces,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: or
    matchers:
      - type: dsl
        name: javafaces
        cpe: cpe:2.3:a:oracle:javaserver_faces:*:*:*:*:*:*:*:*
        dsl:
          - "(contains(body, 'javax.faces.resource') || contains(body, 'javax.faces.ViewState'))"

      - type: dsl
        name: primefaces
        cpe: cpe:2.3:a:oracle:javaserver_faces:*:*:*:*:*:*:*:*
        dsl:
          - "contains(body, 'primefaces')"
          - "contains(body, 'javax.faces.resource') || contains(body, 'javax.faces.ViewState')"
        condition: and

      - type: dsl
        name: richfaces
        cpe: cpe:2.3:a:oracle:javaserver_faces:*:*:*:*:*:*:*:*
        dsl:
          - "contains(body, 'richfaces')"
          - "contains(body, 'javax.faces.resource') || contains(body, 'javax.faces.ViewState')"
        condition: and
