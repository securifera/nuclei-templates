id: openresty-detect

info:
  name: OpenResty detection
  author: jcockhren
  severity: info
  description: Some deployments of OpenResty spill their version numbers.
  classification:
    cpe: cpe:2.3:a:openresty:openresty:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: product:"OpenResty"
    vendor: openresty
    product: openresty
  tags: tech,openresty,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: openresty
        cpe: cpe:2.3:a:openresty:openresty:*:*:*:*:*:*:*:*
        part: server
        words:
          - "openresty"

    extractors:
      - type: regex
        part: header
        regex:
          - 'openresty/[0-9.]+'
