id: mrtg-detect

info:
  name: Detect MRTG
  author: geeknik
  severity: info
  description: The Multi Router Traffic Grapher
  reference:
    - https://oss.oetiker.ch/mrtg/
  classification:
    cpe: cpe:2.3:a:mrtg:mrtg:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: mrtg
    product: mrtg
  tags: tech,mrtg,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/mrtg/"
      - "{{BaseURL}}/MRTG/"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: mrtg
        cpe: cpe:2.3:a:mrtg:mrtg:*:*:*:*:*:*:*:*
        part: body
        words:
          - "MRTG Index Page"
          - "Multi Router Traffic Grapher"
        condition: and
