id: sailsjs-detect

info:
  name: Sails.js Framework - Detect
  author: Shivam Kamboj
  severity: info
  description: |
    Detects the presence of the Sails.js, a realtime MVC framework for Node.js.
  reference:
    - https://sailsjs.com/
  classification:
    cpe: cpe:2.3:a:sailsjs:sails:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "sails.sid"
    vendor: sailsjs
    product: sails
  tags: tech,discovery,sailsjs

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: sails
        cpe: cpe:2.3:a:sailsjs:sails:*:*:*:*:*:*:*:*
        part: header
        words:
          - "X-Powered-By: Sails"
        case-insensitive: true

      - type: regex
        name: sails-2
        cpe: cpe:2.3:a:sailsjs:sails:*:*:*:*:*:*:*:*
        part: header
        regex:
          - '(?i)set-cookie:\s*sails\.sid='
