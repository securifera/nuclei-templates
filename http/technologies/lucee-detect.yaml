id: lucee-detect

info:
  name: Detect Lucee
  author: geeknik,DhiyaneshDK
  severity: info
  description: Lucee Server is a dynamic, Java based (JSR-223), tag and scripting language used for rapid web application development -- https://github.com/lucee/Lucee/
  classification:
    cpe: cpe:2.3:a:lucee:lucee:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    shodan-query: "html:\"Lucee\""
    fofa-query: "app=\"Lucee-Engine\""
    vendor: lucee
    product: lucee
  tags: tech,lucee,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/lucee/doc/functions.cfm"
      - "{{BaseURL}}"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: regex
        name: lucee
        cpe: cpe:2.3:a:lucee:lucee:*:*:*:*:*:*:*:*
        part: header
        regex:
          - "(?i)X-Lucee-Version"
          - "(?i)X-CB-Server: LUCEE"
          - "(?i)X-IDG-Appserver: Lucee"
        condition: or

      - type: word
        name: lucee-2
        cpe: cpe:2.3:a:lucee:lucee:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Lucee Function Reference"
