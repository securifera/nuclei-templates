id: graphql-dianajl-detect
info:
  name: Graphql Dianajl Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:dianajl:dianajl:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: dianajl
    product: dianajl
  tags: tech,graphql,dianajl

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"queryy { __typename }"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 400

      - type: word
        name: dianajl
        cpe: cpe:2.3:a:dianajl:dianajl:*:*:*:*:*:*:*:*
        words:
          - 'Syntax Error GraphQL request (1:1) Unexpected Name "queryy"'
        part: body
