id: graphql-java-detect
info:
  name: Graphql Java Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:graphql-java:graphql-java:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: graphql-java
    product: graphql-java
  tags: tech,graphql,java

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"queryy { __typename }"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 400

      - type: word
        name: graphql-java
        cpe: cpe:2.3:a:graphql-java:graphql-java:*:*:*:*:*:*:*:*
        words:
          - "Invalid Syntax : offending token 'queryy'"
        part: body
