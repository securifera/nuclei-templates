id: graphql-hasura-detect
info:
  name: Graphql Hasura Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:hasura:graphql_engine:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: hasura
    product: graphql_engine
  tags: tech,graphql,hasura

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"query {aa}"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: graphql_engine
        cpe: cpe:2.3:a:hasura:graphql_engine:*:*:*:*:*:*:*:*
        words:
          - "field \"aa\" not found in type: 'query_root'"
        part: body

      - type: word
        name: graphql_engine-2
        cpe: cpe:2.3:a:hasura:graphql_engine:*:*:*:*:*:*:*:*
        words:
          - 'Content-Type: text/html'
        part: header
        negative: true

      - type: word
        name: graphql_engine-3
        cpe: cpe:2.3:a:hasura:graphql_engine:*:*:*:*:*:*:*:*
        words:
          - '<html'
          - '<body'
        part: body
        condition: or
        negative: true
