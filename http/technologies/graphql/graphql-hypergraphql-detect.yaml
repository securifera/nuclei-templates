id: graphql-hypergraphql-detect
info:
  name: Graphql Hypergraphql Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:hypergraphql:hypergraphql:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: hypergraphql
    product: hypergraphql
  tags: tech,graphql,hypergraphql

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"zzz { __typename }"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 400

      - type: word
        name: hypergraphql
        cpe: cpe:2.3:a:hypergraphql:hypergraphql:*:*:*:*:*:*:*:*
        words:
          - "Validation error of type InvalidSyntax: Invalid query syntax."
        part: body
