id: graphql-graphene-detect
info:
  name: Graphql Graphene Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:graphql-python:graphene:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: graphql-python
    product: graphene
  tags: tech,graphql,graphene

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"aaa"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: graphene
        cpe: cpe:2.3:a:graphql-python:graphene:*:*:*:*:*:*:*:*
        words:
          - 'Syntax Error GraphQL (1:1)'
        part: body

      - type: word
        name: graphene-2
        cpe: cpe:2.3:a:graphql-python:graphene:*:*:*:*:*:*:*:*
        words:
          - 'Content-Type: text/html'
        part: header
        negative: true

      - type: word
        name: graphene-3
        cpe: cpe:2.3:a:graphql-python:graphene:*:*:*:*:*:*:*:*
        words:
          - '<html'
          - '<body'
        part: body
        condition: or
        negative: true
