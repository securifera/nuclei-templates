id: graphql-apiforwp-detect
info:
  name: Graphql apiforwp Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:graphql-api:graphql-api:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: graphql-api
    product: graphql-api
  tags: tech,graphql,wordpress

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"query aa#aa { __typename }"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 400

      - type: word
        name: graphql-api
        cpe: cpe:2.3:a:graphql-api:graphql-api:*:*:*:*:*:*:*:*
        words:
          - "Unexpected token \"END\""
        part: body
