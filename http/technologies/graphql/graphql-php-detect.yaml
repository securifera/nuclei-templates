id: graphql-php-detect
info:
  name: Graphql PHP Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:webonyx:graphql-php:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: webonyx
    product: graphql-php
  tags: tech,graphql,php

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"query ! {__typename}"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 400

      - type: word
        name: graphql-php
        cpe: cpe:2.3:a:webonyx:graphql-php:*:*:*:*:*:*:*:*
        words:
          - 'Syntax Error: Cannot parse the unexpected character "!".'
        part: body
