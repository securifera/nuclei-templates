id: graphql-gqlgen-detect
info:
  name: Graphql Gqlgen Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:99designs:gqlgen:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: 99designs
    product: gqlgen
  tags: tech,graphql,gqlgen

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"query { __typename { }"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 400

      - type: word
        name: gqlgen
        cpe: cpe:2.3:a:99designs:gqlgen:*:*:*:*:*:*:*:*
        words:
          - 'expected at least one definition'
        part: body
