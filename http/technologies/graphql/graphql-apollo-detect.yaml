id: graphql-apollo-detect
info:
  name: Graphql Apollo Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:apollographql:apollo_server:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: apollographql
    product: apollo_server
  tags: tech,graphql,apollo

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"query @skip {__typename}"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: apollo_server
        cpe: cpe:2.3:a:apollographql:apollo_server:*:*:*:*:*:*:*:*
        words:
          - 'Directive "@skip" argument "if" of type "Boolean!" is required, but it was not provided.'
        part: body

      - type: word
        name: apollo_server-2
        cpe: cpe:2.3:a:apollographql:apollo_server:*:*:*:*:*:*:*:*
        words:
          - 'Content-Type: text/html'
        part: header
        negative: true

      - type: word
        name: apollo_server-3
        cpe: cpe:2.3:a:apollographql:apollo_server:*:*:*:*:*:*:*:*
        words:
          - '<html'
          - '<body'
        part: body
        condition: or
        negative: true
