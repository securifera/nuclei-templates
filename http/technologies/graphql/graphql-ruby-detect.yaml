id: graphql-ruby-detect
info:
  name: Graphql Ruby Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:graphql-ruby:graphql-ruby:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: graphql-ruby
    product: graphql-ruby
  tags: tech,graphql,ruby

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"query @skip {__typename}"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 400

      - type: word
        name: graphql-ruby
        cpe: cpe:2.3:a:graphql-ruby:graphql-ruby:*:*:*:*:*:*:*:*
        words:
          - "'@skip' can't be applied to queries (allowed: fields, fragment spreads, inline fragments)"
        part: body
