id: graphql-go-detect
info:
  name: Graphql Go Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:graphql-go:graphql-go:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: graphql-go
    product: graphql-go
  tags: tech,graphql,go

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":""}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 400

      - type: word
        name: graphql-go
        cpe: cpe:2.3:a:graphql-go:graphql-go:*:*:*:*:*:*:*:*
        words:
          - 'Must provide an operation.'
        part: body
