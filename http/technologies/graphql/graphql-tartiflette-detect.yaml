id: graphql-tartiflette-detect
info:
  name: Graphql Tartiflette Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:tartiflette:tartiflette:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: tartiflette
    product: tartiflette
  tags: tech,graphql,tartiflette

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"query @a { __typename }"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 400

      - type: word
        name: tartiflette
        cpe: cpe:2.3:a:tartiflette:tartiflette:*:*:*:*:*:*:*:*
        words:
          - "Unknow Directive < @a >."
        part: body
