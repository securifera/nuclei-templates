id: graphql-sangria-detect
info:
  name: Graphql Sangria Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:sangria-graphql:sangria:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: sangria-graphql
    product: sangria
  tags: tech,graphql,sangria

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"queryy { __typename }"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: sangria
        cpe: cpe:2.3:a:sangria-graphql:sangria:*:*:*:*:*:*:*:*
        words:
          - 'Syntax error while parsing GraphQL query. Invalid input "queryy", expected ExecutableDefinition or TypeSystemDefinition'
        part: body

      - type: word
        name: sangria-2
        cpe: cpe:2.3:a:sangria-graphql:sangria:*:*:*:*:*:*:*:*
        words:
          - 'Content-Type: text/html'
        part: header
        negative: true

      - type: word
        name: sangria-3
        cpe: cpe:2.3:a:sangria-graphql:sangria:*:*:*:*:*:*:*:*
        words:
          - '<html'
          - '<body'
        part: body
        condition: or
        negative: true
