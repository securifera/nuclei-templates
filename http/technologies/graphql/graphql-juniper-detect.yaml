id: graphql-juniper-detect
info:
  name: Graphql Juniper Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:graphql-rust:juniper:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: graphql-rust
    product: juniper
  tags: tech,graphql,juniper

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"queryy { __typename }"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 400

      - type: word
        name: juniper
        cpe: cpe:2.3:a:graphql-rust:juniper:*:*:*:*:*:*:*:*
        words:
          - 'Unexpected "queryy"'
        part: body
