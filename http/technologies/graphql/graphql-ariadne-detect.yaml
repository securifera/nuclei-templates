id: graphql-ariadne-detect
info:
  name: Graphql Ariadne Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:ariadnegraphql:ariadne:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: ariadnegraphql
    product: ariadne
  tags: tech,graphql,ariadne

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"query { __typename @abc }"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: ariadne
        cpe: cpe:2.3:a:ariadnegraphql:ariadne:*:*:*:*:*:*:*:*
        words:
          - "Unknown directive '@abc'."
        part: body

      - type: word
        name: ariadne-2
        cpe: cpe:2.3:a:ariadnegraphql:ariadne:*:*:*:*:*:*:*:*
        words:
          - 'Content-Type: text/html'
        part: header
        negative: true

      - type: word
        name: ariadne-3
        cpe: cpe:2.3:a:ariadnegraphql:ariadne:*:*:*:*:*:*:*:*
        words:
          - '<html'
          - '<body'
        part: body
        condition: or
        negative: true
