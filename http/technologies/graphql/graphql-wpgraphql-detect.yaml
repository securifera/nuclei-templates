id: graphql-wpgraphql-detect
info:
  name: Graphql wpgraphql Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:wp-graphql:wp-graphql:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: wp-graphql
    product: wp-graphql
  tags: tech,graphql,wordpress

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"query { alias1$1:__typename }"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 400

      - type: word
        name: wp-graphql
        cpe: cpe:2.3:a:wp-graphql:wp-graphql:*:*:*:*:*:*:*:*
        words:
          - 'Syntax Error: Expected Name, found $'
        part: body
