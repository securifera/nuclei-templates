id: graphql-strawberry-detect
info:
  name: Graphql Strawberry Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:strawberry-graphql:strawberry:*:*:*:*:*:*:*:*
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  metadata:
    vendor: strawberry-graphql
    product: strawberry
  tags: tech,graphql,strawberry

http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"query @deprecated { __typename }"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 400

      - type: word
        name: strawberry
        cpe: cpe:2.3:a:strawberry-graphql:strawberry:*:*:*:*:*:*:*:*
        words:
          - "Directive '@deprecated' may not be used on query."
        part: body
