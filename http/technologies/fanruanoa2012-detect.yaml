id: fanruanoa2012-detect

info:
  name: FanRuanOA2012-detect
  author: YanYun
  severity: info
  classification:
    cpe: cpe:2.3:a:fanruan:fanruan_oa_2012:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: fanruan
    product: fanruan_oa_2012
  tags: oa,java,fanruan,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: fanruan_oa_2012
        cpe: cpe:2.3:a:fanruan:fanruan_oa_2012:*:*:*:*:*:*:*:*
        words:
          - 'down.download?FM_SYS_ID'
