id: puppet-node-manager-detect

info:
  name: Puppet Node Manager
  author: pussycat0x
  severity: info
  classification:
    cpe: cpe:2.3:a:puppet:node_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: 'app="puppet-Node-Manager"'
    vendor: puppet
    product: node_manager
  tags: node,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: node_manager
        cpe: cpe:2.3:a:puppet:node_manager:*:*:*:*:*:*:*:*
        words:
          - '<title>Puppet Node Manager</title>'

      - type: status
        status:
          - 200
