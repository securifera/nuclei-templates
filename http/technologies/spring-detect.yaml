id: spring-detect

info:
  name: Java Spring Detection
  author: Adam Crosser
  severity: info
  reference:
    - https://mkyong.com/spring-boot/spring-rest-error-handling-example/
  classification:
    cpe: cpe:2.3:a:vmware:spring_framework:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: vmware
    product: spring_framework
  tags: tech,java,spring,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/error"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: spring_framework
        cpe: cpe:2.3:a:vmware:spring_framework:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"status":999'
        case-insensitive: true

      - type: status
        status:
          - 500
