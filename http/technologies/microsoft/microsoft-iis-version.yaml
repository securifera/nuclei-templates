id: microsoft-iis-version

info:
  name: Microsoft IIS version detect
  author: Wlayzz
  severity: info
  description: Some Microsoft IIS servers have the version on the response header. Useful when you need to find specific CVEs on your targets.
  classification:
    cpe: cpe:2.3:a:microsoft:internet_information_services:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: microsoft
    product: internet_information_services
  tags: tech,microsoft,iis,discovery


http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 4
    matchers-condition: and
    matchers:
      - type: word
        name: internet_information_services
        cpe: cpe:2.3:a:microsoft:internet_information_services:*:*:*:*:*:*:*:*
        part: header
        words:
          - "IIS"

    extractors:
      - type: kval
        part: header
        kval:
          - Server
