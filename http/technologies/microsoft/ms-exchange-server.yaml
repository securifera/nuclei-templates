id: ms-exchange-server

info:
  name: Microsoft Exchange Server Detect
  author: pikpikcu,dhiyaneshDK
  severity: info
  description: Check for presence of Exchange Server using Outlook Web App path data.
  reference:
    - https://github.com/GossiTheDog/scanning/blob/main/http-vuln-exchange.nse
  classification:
    cpe: cpe:2.3:a:microsoft:exchange_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: microsoft
    product: exchange_server
  tags: microsoft,exchange,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/owa/auth/logon.aspx"

    matchers-condition: or
    matchers:
      - type: regex
        name: exchange_server
        cpe: cpe:2.3:a:microsoft:exchange_server:*:*:*:*:*:*:*:*
        part: header
        regex:
          - "(?i)(X-Owa-Version:)"

      - type: regex
        name: exchange_server-2
        cpe: cpe:2.3:a:microsoft:exchange_server:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "/owa/auth/[0-9.]+/"

      - type: word
        name: exchange_server-3
        cpe: cpe:2.3:a:microsoft:exchange_server:*:*:*:*:*:*:*:*
        words:
          - '<title>Exchange Log In</title>'
          - '<title>Microsoft Exchange - Outlook Web Access</title>'

    extractors:
      - type: kval
        kval:
          - x_owa_version

      - type: regex
        part: body
        group: 1
        regex:
          - "/owa/auth/([0-9.]+)/"
