id: sql-server-reporting

info:
  name: Detect Microsoft SQL Server Reporting
  author: puzzlepeaches
  severity: info
  classification:
    cpe: cpe:2.3:a:microsoft:sql_server_reporting_services:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: microsoft
    product: sql_server_reporting_services
  tags: tech,microsoft,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Reports/Pages/Folder.aspx"

    matchers:
      - type: word
        name: sql_server_reporting_services
        cpe: cpe:2.3:a:microsoft:sql_server_reporting_services:*:*:*:*:*:*:*:*
        words:
          - "Report Manager"
