id: sharepoint-web-services-discovery

info:
  name: Microsoft SharePoint - Web Services Discovery
  author: 0x_Akoko
  severity: info
  description: |
    Detected exposed SharePoint web services via /_vti_bin/spdisco.aspx endpoint
  classification:
    cpe: cpe:2.3:a:microsoft:sharepoint_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: microsoft
    product: sharepoint_server
  tags: sharepoint,iis,microsoft,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/_vti_bin/spdisco.aspx"

    matchers-condition: and
    matchers:
      - type: word
        name: sharepoint_server
        cpe: cpe:2.3:a:microsoft:sharepoint_server:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<discovery"
          - "<contractRef"
        condition: and
        case-insensitive: true

      - type: word
        name: sharepoint_server-2
        cpe: cpe:2.3:a:microsoft:sharepoint_server:*:*:*:*:*:*:*:*
        part: content_type
        words:
          - text/xml

      - type: status
        status:
          - 200
