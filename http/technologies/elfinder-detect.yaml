id: elfinder-detect

info:
  name: elFinder - Install Detection
  author: pikpikcu
  severity: info
  description: An elFinder implementation was discovered.
  classification:
    cpe: cpe:2.3:a:std42:elfinder:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 2
    vendor: std42
    product: elfinder
  tags: tech,elfinder,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/elfinder.html"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: elfinder
        cpe: cpe:2.3:a:std42:elfinder:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<!-- Element where elFinder will be created (REQUIRED) -->"

      - type: status
        status:
          - 200
