id: meteobridge-detect

info:
  name: MeteoBridge - Detect
  author: rxerium
  severity: info
  description: |
    Exposed MeteoBridge devices by identifying their unique HTTP response patterns.
  reference:
    - https://www.meteobridge.com
  classification:
    cpe: cpe:2.3:a:smartbedded:meteobridge:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "meteobridge"
    vendor: smartbedded
    product: meteobridge
  tags: meteobridge,tech,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/meteobridge.cgi"

    matchers-condition: and
    matchers:
      - type: word
        name: meteobridge
        cpe: cpe:2.3:a:smartbedded:meteobridge:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'Basic realm="MeteoBridge"'

      - type: status
        status:
          - 401
