id: hetzner-cloud-detect

info:
  name: Hetzner Cloud Detect
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:hetzner:cloud:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Hetzner Cloud"
    vendor: hetzner
    product: cloud
  tags: tech,hetzner,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: cloud
        cpe: cpe:2.3:a:hetzner:cloud:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Hetzner Cloud'
          - 'Hetzner Logo'
        condition: and

      - type: status
        status:
          - 200
