id: pomerium-detect

info:
  name: Pomerium Detect
  author: rxerium
  severity: info
  description: |
    A Pomerium SSO Panel was detected.
  reference:
    - https://www.pomerium.com/
  classification:
    cpe: cpe:2.3:a:pomerium:pomerium:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"pomerium"
    vendor: pomerium
    product: pomerium
  tags: pomerium,sso,detect,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/.pomerium/index.js"

    matchers-condition: and
    matchers:
      - type: word
        name: pomerium
        cpe: cpe:2.3:a:pomerium:pomerium:*:*:*:*:*:*:*:*
        part: body
        words:
          - "https://pomerium.com/docs"
          - "https://discuss.pomerium.com"
        condition: and

      - type: word
        name: pomerium-2
        cpe: cpe:2.3:a:pomerium:pomerium:*:*:*:*:*:*:*:*
        part: content_type
        words:
          - "text/javascript"

      - type: status
        status:
          - 200
