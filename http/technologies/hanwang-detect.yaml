id: hanwang-detect

info:
  name: hanwang-detect
  author: ffffffff0x
  severity: info
  classification:
    cpe: cpe:2.3:a:hanwang:hanwang:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: 汉王人脸考勤管理系统
    vendor: hanwang
    product: hanwang
  tags: hanwang,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: hanwang
        cpe: cpe:2.3:a:hanwang:hanwang:*:*:*:*:*:*:*:*
        words:
          - "汉王人脸考勤管理系统"
        part: body

      - type: status
        status:
          - 200
