id: puppetdb-detect

info:
  name: PuppetDB Detection
  author: c-sh0
  severity: info
  reference:
    - https://puppet.com/docs/puppetdb/7/api/meta/v1/version.html#pdbmetav1version
  classification:
    cpe: cpe:2.3:a:puppet:puppetdb:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: puppet
    product: puppetdb
  tags: puppet,tech,exposure,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/pdb/meta/v1/version"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: puppetdb
        cpe: cpe:2.3:a:puppet:puppetdb:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'application/json'

      - type: regex
        name: puppetdb-2
        cpe: cpe:2.3:a:puppet:puppetdb:*:*:*:*:*:*:*:*
        part: body
        regex:
          - '"version"\s:\s"([0-9.]+)"'

    extractors:
      - type: regex
        group: 1
        regex:
          - '"version"\s:\s"([0-9.]+)"'
