id: puppetserver-detect

info:
  name: Puppetserver Detection
  author: c-sh0
  severity: info
  reference:
    - https://insinuator.net/2020/09/puppet-assessment-techniques/
  classification:
    cpe: cpe:2.3:a:puppet:puppet_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: puppet
    product: puppet_server
  tags: tech,puppet,exposure,intrusive,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/puppet-ca/v1/certificate_request/{{randstr}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 404

      - type: word
        name: puppet_server
        cpe: cpe:2.3:a:puppet:puppet_server:*:*:*:*:*:*:*:*
        part: header
        words:
          - "x-puppet-version"
        case-insensitive: true

      - type: word
        name: puppet_server-2
        cpe: cpe:2.3:a:puppet:puppet_server:*:*:*:*:*:*:*:*
        part: body
        words:
          - "{{randstr}}"

    extractors:
      - type: kval
        kval:
          - x_puppet_version
