id: terraform-detect

info:
  name: Detect Terraform Provider
  author: geeknik
  severity: info
  description: Write Infrastructure as Code - https://www.terraform.io/
  classification:
    cpe: cpe:2.3:a:hashicorp:terraform:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: hashicorp
    product: terraform
  tags: tech,terraform,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/provider.tf"

    matchers-condition: and
    matchers:
      - type: word
        name: terraform
        cpe: cpe:2.3:a:hashicorp:terraform:*:*:*:*:*:*:*:*
        part: body
        words:
          - "access_key"
          - "terraform"
        condition: and

      - type: status
        status:
          - 200
