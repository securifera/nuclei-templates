id: gilacms-detect

info:
  name: GilaCMS Detect
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:gilacms:gilacms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: gilacms
    product: gilacms
  tags: tech,gilacms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/user"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: gilacms
        cpe: cpe:2.3:a:gilacms:gilacms:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Homepage | Gila CMS'
          - '<meta name="generator" content="Gila CMS">'
        condition: or

      - type: status
        status:
          - 200
