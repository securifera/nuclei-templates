id: thinkcmf-detection

info:
  name: ThinkCMF Panel - Detect
  author: pikpikcu,daffainfo
  severity: info
  description: ThinkCMF panel was detected.
  classification:
    cpe: cpe:2.3:a:thinkcmf:thinkcmf:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: thinkcmf
    product: thinkcmf
  tags: panel,thinkcmf,login,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: thinkcmf
        cpe: cpe:2.3:a:thinkcmf:thinkcmf:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<meta name="author" content="ThinkCMF">'

      - type: status
        status:
          - 200
