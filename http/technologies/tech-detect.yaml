id: tech-detect

info:
  name: Wappalyzer Technology Detection
  author: hakluke,righettod,matejsmycka
  severity: info
  classification:
    cpe: cpe:2.3:a:wappalyzer:wappalyzer:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wappalyzer
    product: wappalyzer
  tags: tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: regex
        name: mollom
        cpe: cpe:2.3:a:mollom:mollom:*:*:*:*:*:*:*:*
        regex:
          - <img[^>]+\.mollom\.com
        condition: or
        part: body

      - type: word
        name: atlassian-jira
        cpe: cpe:2.3:a:atlassian-jira:atlassian-jira:*:*:*:*:*:*:*:*
        words:
          - "Project Management Software"
          - "atlassian.com/software/jira"
        condition: and
        part: body

      - type: regex
        name: genexus
        cpe: cpe:2.3:a:genexus:genexus:*:*:*:*:*:*:*:*
        regex:
          - <link[^>]+?id="gxtheme_css_reference"
        condition: or
        part: body

      - type: regex
        name: flat-ui
        cpe: cpe:2.3:a:flat-ui:flat-ui:*:*:*:*:*:*:*:*
        regex:
          - <link[^>]* href=[^>]+flat-ui(?:\.min)?\.css
        condition: or
        part: body

      - type: regex
        name: dovetailwrp
        cpe: cpe:2.3:a:dovetailwrp:dovetailwrp:*:*:*:*:*:*:*:*
        regex:
          - <link[^>]* href="\/DovetailWRP\/
        condition: or
        part: body

      - type: regex
        name: highcharts
        cpe: cpe:2.3:a:highcharts:highcharts:*:*:*:*:*:*:*:*
        regex:
          - <svg[^>]*><desc>Created with Highcharts ([\d.]*)
        condition: or
        part: body

      - type: regex
        name: videojs
        cpe: cpe:2.3:a:videojs:videojs:*:*:*:*:*:*:*:*
        regex:
          - <div[^>]+class="video-js+">
        condition: or
        part: body

      - type: regex
        name: tictail
        cpe: cpe:2.3:a:tictail:tictail:*:*:*:*:*:*:*:*
        regex:
          - <link[^>]*tictail\.com
        condition: or
        part: body

      - type: regex
        name: wikinggruppen
        cpe: cpe:2.3:a:wikinggruppen:wikinggruppen:*:*:*:*:*:*:*:*
        regex:
          - <!-- WIKINGGRUPPEN
        condition: or
        part: body

      - type: regex
        name: slimbox
        cpe: cpe:2.3:a:slimbox:slimbox:*:*:*:*:*:*:*:*
        regex:
          - <link [^>]*href="[^/]*slimbox(?:-rtl)?\.css
        condition: or
        part: body

      - type: regex
        name: cs-cart
        cpe: cpe:2.3:a:cs-cart:cs-cart:*:*:*:*:*:*:*:*
        regex:
          - '&nbsp;Powered by (?:<a href=[^>]+cs-cart\.com|CS-Cart)'
          - \.cm-noscript[^>]+</style>
        condition: or
        part: body

      - type: regex
        name: directadmin
        cpe: cpe:2.3:a:directadmin:directadmin:*:*:*:*:*:*:*:*
        regex:
          - <a[^>]+>DirectAdmin</a> Web Control Panel
        condition: or
        part: body

      - type: regex
        name: xenforo
        cpe: cpe:2.3:a:xenforo:xenforo:*:*:*:*:*:*:*:*
        regex:
          - (?:jQuery\.extend\(true, XenForo|Forum software by XenForo™|<!--XF:branding|<html[^>]+id="XenForo")
          - '<html id="XF" '
        condition: or
        part: body

      - type: regex
        name: imperia-cms
        cpe: cpe:2.3:a:imperia-cms:imperia-cms:*:*:*:*:*:*:*:*
        regex:
          - '<imp:live-info sysid="[0-9a-f-]+"(?: node_id="[0-9/]*")? *\/>'
        condition: or
        part: body

      - type: regex
        name: vanilla
        cpe: cpe:2.3:a:vanilla:vanilla:*:*:*:*:*:*:*:*
        regex:
          - <body id="(?:DiscussionsPage|vanilla)
        condition: or
        part: body

      - type: regex
        name: kibana
        cpe: cpe:2.3:a:kibana:kibana:*:*:*:*:*:*:*:*
        regex:
          - <title>Kibana</title>
        condition: or
        part: body

      - type: regex
        name: bonfire
        cpe: cpe:2.3:a:bonfire:bonfire:*:*:*:*:*:*:*:*
        regex:
          - Powered by <a[^>]+href="https?://(?:www\.)?cibonfire\.com[^>]*>Bonfire v([^<]+)
        condition: or
        part: body

      - type: regex
        name: ipb
        cpe: cpe:2.3:a:ipb:ipb:*:*:*:*:*:*:*:*
        regex:
          - <link[^>]+ipb_[^>]+\.css
        condition: or
        part: body

      - type: regex
        name: smf
        cpe: cpe:2.3:a:smf:smf:*:*:*:*:*:*:*:*
        regex:
          - credits/?" title="Simple Machines Forum" target="_blank" class="new_win">SMF ([0-9.]+)</a>
        condition: or
        part: body

      - type: regex
        name: xcharts
        cpe: cpe:2.3:a:xcharts:xcharts:*:*:*:*:*:*:*:*
        regex:
          - <link[^>]* href="[^"]*xcharts(?:\.min)?\.css
        condition: or
        part: body

      - type: regex
        name: proximis-unified-commerce
        cpe: cpe:2.3:a:proximis-unified-commerce:proximis-unified-commerce:*:*:*:*:*:*:*:*
        regex:
          - <html[^>]+data-ng-app="RbsChangeApp"
        condition: or
        part: body

      - type: regex
        name: arc-publishing
        cpe: cpe:2.3:a:arc-publishing:arc-publishing:*:*:*:*:*:*:*:*
        regex:
          - <div [^>]*id="pb-root"
        condition: or
        part: body

      - type: regex
        name: nvd3
        cpe: cpe:2.3:a:nvd3:nvd3:*:*:*:*:*:*:*:*
        regex:
          - <link[^>]* href=[^>]+nv\.d3(?:\.min)?\.css
        condition: or
        part: body

      - type: regex
        name: arastta
        cpe: cpe:2.3:a:arastta:arastta:*:*:*:*:*:*:*:*
        regex:
          - Powered by <a [^>]*href="https?://(?:www\.)?arastta\.org[^>]+>Arastta
        condition: or
        part: body

      - type: regex
        name: cgit
        cpe: cpe:2.3:a:cgit:cgit:*:*:*:*:*:*:*:*
        regex:
          - <[^>]+id='cgit'
          - generated by <a href='http://git\.zx2c4\.com/cgit/about/'>cgit v([\d.a-z-]+)</a>
        condition: or
        part: body

      - type: regex
        name: strikingly
        cpe: cpe:2.3:a:strikingly:strikingly:*:*:*:*:*:*:*:*
        regex:
          - <!-- Powered by Strikingly\.com
        condition: or
        part: body

      - type: regex
        name: contentful
        cpe: cpe:2.3:a:contentful:contentful:*:*:*:*:*:*:*:*
        regex:
          - <[^>]+(?:https?:)?//(?:assets|downloads|images|videos)\.(?:ct?fassets\.net|contentful\.com)
        condition: or
        part: body

      - type: regex
        name: microsoft-asp.net
        cpe: cpe:2.3:a:microsoft-asp.net:microsoft-asp.net:*:*:*:*:*:*:*:*
        regex:
          - <input[^>]+name="__VIEWSTATE
        condition: or
        part: body

      - type: regex
        name: inspectlet
        cpe: cpe:2.3:a:inspectlet:inspectlet:*:*:*:*:*:*:*:*
        regex:
          - <!-- (?:Begin|End) Inspectlet Embed Code -->
        condition: or
        part: body

      - type: regex
        name: moodle
        cpe: cpe:2.3:a:moodle:moodle:*:*:*:*:*:*:*:*
        regex:
          - <img[^>]+moodlelogo
        condition: or
        part: body

      - type: regex
        name: minibb
        cpe: cpe:2.3:a:minibb:minibb:*:*:*:*:*:*:*:*
        regex:
          - <a href="[^"]+minibb[^<]+</a>[^<]+\n<!--End of copyright link
        condition: or
        part: body

      - type: regex
        name: handlebars
        cpe: cpe:2.3:a:handlebars:handlebars:*:*:*:*:*:*:*:*
        regex:
          - <[^>]*type=[^>]text\/x-handlebars-template
        condition: or
        part: body

      - type: regex
        name: materialize-css
        cpe: cpe:2.3:a:materialize-css:materialize-css:*:*:*:*:*:*:*:*
        regex:
          - <link[^>]* href="[^"]*materialize(?:\.min)?\.css
        condition: or
        part: body

      - type: regex
        name: orocommerce
        cpe: cpe:2.3:a:orocommerce:orocommerce:*:*:*:*:*:*:*:*
        regex:
          - <script [^>]+data-requiremodule="oro/
          - <script [^>]+data-requiremodule="oroui/
        condition: or
        part: body

      - type: regex
        name: lightspeed-ecom
        cpe: cpe:2.3:a:lightspeed-ecom:lightspeed-ecom:*:*:*:*:*:*:*:*
        regex:
          - <!-- \[START\] 'blocks/head\.rain' -->
        condition: or
        part: body

      - type: regex
        name: woocommerce
        cpe: cpe:2.3:a:woocommerce:woocommerce:*:*:*:*:*:*:*:*
        regex:
          - <!-- WooCommerce
          - <link rel='[^']+' id='woocommerce-(?:layout|smallscreen|general)-css'  href='https?://[^/]+/wp-content/plugins/woocommerce/assets/css/woocommerce(?:-layout|-smallscreen)?\.css?ver=([\d.]+)'
        condition: or
        part: body

      - type: regex
        name: cpanel
        cpe: cpe:2.3:a:cpanel:cpanel:*:*:*:*:*:*:*:*
        regex:
          - <!-- cPanel
        condition: or
        part: body

      - type: regex
        name: phpmyadmin
        cpe: cpe:2.3:a:phpmyadmin:phpmyadmin:*:*:*:*:*:*:*:*
        regex:
          - '!\[CDATA\[[^<]*PMA_VERSION:\"([\d.]+)'
          - '(?: \| phpMyAdmin ([\d.]+)<\/title>|PMA_sendHeaderLocation\(|<link [^>]*href="[^"]*phpmyadmin\.css\.php)'
        condition: or
        part: body

      - type: regex
        name: hcaptcha
        cpe: cpe:2.3:a:hcaptcha:hcaptcha:*:*:*:*:*:*:*:*
        regex:
          - <style[^>]+[^<]+#cf-hcaptcha-container[^<]+</style>
        condition: or
        part: body

      - type: regex
        name: styled-components
        cpe: cpe:2.3:a:styled-components:styled-components:*:*:*:*:*:*:*:*
        regex:
          - <style[^>]*data-styled(?:-components)?[\s"]
          - <style[^>]+data-styled-version="([0-9]+)"
          - "<[^>]+sc-component-id: sc-"
        condition: or
        part: body

      - type: regex
        name: youtrack
        cpe: cpe:2.3:a:youtrack:youtrack:*:*:*:*:*:*:*:*
        regex:
          - no-title="YouTrack">
          - data-reactid="[^"]+">youTrack ([0-9.]+)<
          - type="application/opensearchdescription\+xml" title="YouTrack"/>
        condition: or
        part: body

      - type: regex
        name: grandnode
        cpe: cpe:2.3:a:grandnode:grandnode:*:*:*:*:*:*:*:*
        regex:
          - "(?:<!--GrandNode |<a[^>]+grandnode - Powered by |Powered by: <a[^>]+nopcommerce)"
        condition: or
        part: body

      - type: regex
        name: oxid-eshop
        cpe: cpe:2.3:a:oxid-eshop:oxid-eshop:*:*:*:*:*:*:*:*
        regex:
          - <!--[^-]*OXID eShop
        condition: or
        part: body

      - type: regex
        name: doxygen
        cpe: cpe:2.3:a:doxygen:doxygen:*:*:*:*:*:*:*:*
        regex:
          - (?:<!-- Generated by Doxygen ([\d.]+)|<link[^>]+doxygen\.css)
        condition: or
        part: body

      - type: regex
        name: afterbuy
        cpe: cpe:2.3:a:afterbuy:afterbuy:*:*:*:*:*:*:*:*
        regex:
          - <dd>This OnlineStore is brought to you by ViA-Online GmbH Afterbuy\. Information and contribution at https://www\.afterbuy\.de</dd>
        condition: or
        part: body

      - type: regex
        name: chevereto
        cpe: cpe:2.3:a:chevereto:chevereto:*:*:*:*:*:*:*:*
        regex:
          - Powered by <a href="https?://chevereto\.com">
        condition: or
        part: body

      - type: regex
        name: gallery
        cpe: cpe:2.3:a:gallery:gallery:*:*:*:*:*:*:*:*
        regex:
          - <div id="gsNavBar" class="gcBorder1">
          - <a href="http://gallery\.sourceforge\.net"><img[^>]+Powered by Gallery\s*(?:(?:v|Version)\s*([0-9.]+))?
        condition: or
        part: body

      - type: regex
        name: redoc
        cpe: cpe:2.3:a:redoc:redoc:*:*:*:*:*:*:*:*
        regex:
          - "<redoc "
        condition: or
        part: body

      - type: regex
        name: open-web-analytics
        cpe: cpe:2.3:a:open-web-analytics:open-web-analytics:*:*:*:*:*:*:*:*
        regex:
          - <!-- (?:Start|End) Open Web Analytics Tracker -->
        condition: or
        part: body

      - type: regex
        name: jsdelivr
        cpe: cpe:2.3:a:jsdelivr:jsdelivr:*:*:*:*:*:*:*:*
        regex:
          - <[^>]+?//cdn\.jsdelivr\.net/
        condition: or
        part: body

      - type: regex
        name: user.com
        cpe: cpe:2.3:a:user.com:user.com:*:*:*:*:*:*:*:*
        regex:
          - <div[^>]+/id="ue_widget"
        condition: or
        part: body

      - type: regex
        name: smart-ad-server
        cpe: cpe:2.3:a:smart-ad-server:smart-ad-server:*:*:*:*:*:*:*:*
        regex:
          - <img[^>]+smartadserver\.com\/call
        condition: or
        part: body

      - type: regex
        name: comandia
        cpe: cpe:2.3:a:comandia:comandia:*:*:*:*:*:*:*:*
        regex:
          - <link[^>]+=['"]//cdn\.mycomandia\.com
        condition: or
