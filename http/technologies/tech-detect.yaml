          - <title>Shell In A Box</title>
          - must be enabled for ShellInABox</noscript>
        condition: or
        part: body

      - type: regex
        name: websocket
        cpe: cpe:2.3:a:websocket:websocket:*:*:*:*:*:*:*:*
        regex:
          - <link[^>]+rel=["']web-socket["']
