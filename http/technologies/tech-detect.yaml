      - type: regex
        name: php-nuke
        cpe: cpe:2.3:a:php-nuke:php-nuke:*:*:*:*:*:*:*:*
        regex:
          - <[^>]+Powered by PHP-Nuke
        condition: or
        part: body

      - type: regex
        name: essential-js-2
        cpe: cpe:2.3:a:essential-js-2:essential-js-2:*:*:*:*:*:*:*:*
        regex:
          - '<[^>]+ class ?= ?"(?:e-control|[^"]+ e-control)(?: )[^"]* e-lib\b'
        condition: or
        part: body

      - type: regex
        name: wolf-cms
        cpe: cpe:2.3:a:wolf-cms:wolf-cms:*:*:*:*:*:*:*:*
        regex:
          - (?:<a href="[^>]+wolfcms\.org[^>]+>Wolf CMS(?:</a>)? inside|Thank you for using <a[^>]+>Wolf CMS)
        condition: or
        part: body

      - type: regex
        name: shapecss
        cpe: cpe:2.3:a:shapecss:shapecss:*:*:*:*:*:*:*:*
        regex:
          - <link[^>]* href="[^"]*shapecss(?:\.min)?\.css
        condition: or
