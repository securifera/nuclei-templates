id: weblogic-detect

info:
  name: Detect Weblogic
  author: pdteam
  severity: info
  classification:
    cpe: cpe:2.3:a:oracle:weblogic_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: product:"Oracle Weblogic"
    vendor: oracle
    product: weblogic_server
  tags: tech,weblogic,intrusive,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{randstr}}"

    matchers-condition: and
    matchers:
      - type: word
        name: weblogic_server
        cpe: cpe:2.3:a:oracle:weblogic_server:*:*:*:*:*:*:*:*
        words:
          - "From RFC 2068"
          - "Error 404--Not Found"
        condition: and

      - type: status
        status:
          - 404
