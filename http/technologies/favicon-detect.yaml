        name: "skysea-clientview"
        cpe: cpe:2.3:a:skysea-clientview:skysea-clientview:*:*:*:*:*:*:*:*
        dsl:
          - "status_code==200 && (\"385597939\" == mmh3(base64_py(body)))"

