id: default-detect-generic

info:
  name: Default Web Application Detection
  author: andydoering
  severity: info
  description: Catch-all for detecting default installations of web applications using common phrases found in default install pages
  classification:
    cpe: cpe:2.3:a:generic:default_page:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: generic
    product: default_page
  tags: tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: default_page
        cpe: cpe:2.3:a:generic:default_page:*:*:*:*:*:*:*:*
        part: body
        condition: or
        words:
          - "<title>Default</title>"
          - "<title>Welcome to</title>"
