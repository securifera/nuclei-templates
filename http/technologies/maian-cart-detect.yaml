id: maian-cart-detect

info:
  name: Maian Cart Detection
  author: pdteam
  severity: info
  classification:
    cpe: cpe:2.3:a:maianscriptworld:maian_cart:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: maianscriptworld
    product: maian_cart
  tags: tech,maian,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/favicon.ico"

    matchers:
      - type: dsl
        name: maian_cart
        cpe: cpe:2.3:a:maianscriptworld:maian_cart:*:*:*:*:*:*:*:*
        dsl:
          - "status_code==200 && (\"-498581627\" == mmh3(base64_py(body)))"
