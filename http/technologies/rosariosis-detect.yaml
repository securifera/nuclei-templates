id: rosariosis-detect

info:
  name: Rosariosis Detect
  author: princechaddha
  severity: info
  reference:
    - https://github.com/francoisjacquet/rosariosis
    - https://www.rosariosis.org/
  classification:
    cpe: cpe:2.3:a:rosariosis:rosariosis:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: rosariosis
    product: rosariosis
  tags: tech,rosariosis,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: rosariosis
        cpe: cpe:2.3:a:rosariosis:rosariosis:*:*:*:*:*:*:*:*
        part: header
        words:
          - "RosarioSIS="

      - type: status
        status:
          - 200
