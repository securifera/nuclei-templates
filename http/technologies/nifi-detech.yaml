id: apache-nifi-detect

info:
  name: Apache NiFi detect
  author: dwisiswant0
  severity: info
  classification:
    cpe: cpe:2.3:a:apache:nifi:*:*:*:*:*:*:*:*
  metadata:
    max-request: 7
    vendor: apache
    product: nifi
  tags: tech,apache,nifi,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/access/config"
      - "{{BaseURL}}/controller/config"
      - "{{BaseURL}}/controller/registry-clients"
      - "{{BaseURL}}/counters"
      - "{{BaseURL}}/flow/registries"
      - "{{BaseURL}}/system-diagnostics"
      - "{{BaseURL}}/nifi-api/access/config"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: regex
        name: nifi
        cpe: cpe:2.3:a:apache:nifi:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "supportsLogin"
          - "disconnectedNodeAcknowledged"
          - "(aggregate|node)Snapshots?"
        condition: or

      - type: status
        status:
          - 200
