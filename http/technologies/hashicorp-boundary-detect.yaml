id: hashicorp-boundary-detect

info:
  name: HashiCorp Boundary Detect
  author: codexlynx
  severity: info
  description: Detects HashiCorp Boundary
  classification:
    cpe: cpe:2.3:a:hashicorp:boundary:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: hashicorp
    product: boundary
  tags: tech,hashicorp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: boundary
        cpe: cpe:2.3:a:hashicorp:boundary:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'HashiCorp Boundary'
