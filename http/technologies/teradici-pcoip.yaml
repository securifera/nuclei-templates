id: teradici-pcoip

info:
  name: Teradici PCoIP Detection
  author: pdteam
  severity: info
  description: Teradici PColP was detected.
  reference:
    - https://www.teradici.com/
  classification:
    cpe: cpe:2.3:a:teradici:pcoip_connection_manager:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: teradici
    product: pcoip_connection_manager
  tags: tech,pcoip,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/info/"

    matchers:
      - type: word
        name: pcoip_connection_manager
        cpe: cpe:2.3:a:teradici:pcoip_connection_manager:*:*:*:*:*:*:*:*
        words:
          - "PCoIP Connection Manager"

    extractors:
      - type: regex
        group: 1
        regex:
          - 'PCoIP Connection Manager\/([0-9.]+)\.'
