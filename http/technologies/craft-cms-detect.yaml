id: craft-cms-detect

info:
  name: Craft CMS Detect
  author: skeltavik
  severity: info
  description: Detects Craft CMS
  reference:
    - https://craftcms.com
  classification:
    cpe: cpe:2.3:a:craftcms:craft_cms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: craftcms
    product: craft_cms
  tags: tech,craftcms,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        name: craft_cms
        cpe: cpe:2.3:a:craftcms:craft_cms:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'X-Powered-By: Craft CMS'

      - type: regex
        name: craft_cms-2
        cpe: cpe:2.3:a:craftcms:craft_cms:*:*:*:*:*:*:*:*
        part: header
        regex:
          - 'Set-Cookie: (Craft|CRAFT)'

      - type: regex
        name: craft_cms-3
        cpe: cpe:2.3:a:craftcms:craft_cms:*:*:*:*:*:*:*:*
        part: body
        regex:
          - '(?i)CRAFT_CSRF_TOKEN'
