id: shiro-detect

info:
  name: Detect Shiro Framework
  author: AresX
  severity: info
  classification:
    cpe: cpe:2.3:a:apache:shiro:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: shiro
  tags: tech,shiro,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    headers:
      Cookie: JSESSIONID={{randstr}};rememberMe=123;
    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        name: shiro
        cpe: cpe:2.3:a:apache:shiro:*:*:*:*:*:*:*:*
        part: header
        words:
          - "rememberMe=deleteMe"
