id: acontent-detect

info:
  name: AContent Detect
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:acontent:acontent:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: acontent
    product: acontent
  tags: tech,acontent,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        name: acontent
        cpe: cpe:2.3:a:acontent:acontent:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>AContent : Home</title>"
          - "AContent - Copyright 2010 by IDRC/IDI http://inclusivedesign.ca/"
        condition: or

      - type: status
        status:
          - 200
