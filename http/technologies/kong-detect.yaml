id: kong-detect

info:
  name: Detect Kong
  author: geeknik,joshlarsen
  severity: info
  description: The Cloud-Native API Gateway
  reference:
    - https://github.com/Kong/kong
  classification:
    cpe: cpe:2.3:a:konghq:kong:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: konghq
    product: kong
  tags: tech,kong,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: kong
        cpe: cpe:2.3:a:konghq:kong:*:*:*:*:*:*:*:*
        part: header
        words:
          - "server: kong"
          - "x-kong-response-latency"
          - "x-kong-upstream-latency"
          - "x-kong-proxy-latency"
          - "x-kong-admin-request-id"
        condition: or
        case-insensitive: true

    extractors:
      - type: kval
        kval:
          - server
