id: attu-detect

info:
  name: Attu - Detect
  author: s4e-io
  severity: info
  description: Attu was detected.
  reference:
    - https://github.com/zilliztech/attu
  classification:
    cpe: cpe:2.3:a:zilliz:attu:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Attu"
    vendor: zilliz
    product: attu
  tags: tech,vector-database,attu,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: attu
        cpe: cpe:2.3:a:zilliz:attu:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Attu</title>'
          - 'content="Attu'
        condition: or
