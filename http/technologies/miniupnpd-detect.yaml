id: miniupnpd-detect

info:
  name: MiniUPnPd - Detect
  author: Shivam Kamboj
  severity: info
  description: |
    Detected servers using the MiniUPnPd service through the Server header.
  classification:
    cpe: cpe:2.3:a:miniupnp_project:miniupnpd:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: "MiniUPnPd"
    vendor: miniupnp_project
    product: miniupnpd
  tags: tech,miniupnpd

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        name: miniupnpd
        cpe: cpe:2.3:a:miniupnp_project:miniupnpd:*:*:*:*:*:*:*:*
        part: header
        regex:
          - 'MiniUPnPd'

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - 'MiniUPnPd/([0-9.]+)'
