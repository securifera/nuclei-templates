id: ecology-detect

info:
  name: Ecology Detection
  author: ritikchaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:weaver:ecology:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: ecology_JSessionid
    fofa-query: app="泛微-协同办公OA"
    vendor: weaver
    product: ecology
  tags: ecology,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: ecology
        cpe: cpe:2.3:a:weaver:ecology:*:*:*:*:*:*:*:*
        part: header
        words:
          - "ecology_JSessionid"

      - type: status
        status:
          - 200
