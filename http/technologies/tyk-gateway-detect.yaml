id: tyk-gateway-detect

info:
  name: Tyk API Gateway - Detection
  author: davidfegyver
  severity: info
  description: |
    Detects if the application uses Tyk API Gateway
  reference:
    - https://github.com/TykTechnologies/tyk
  classification:
    cpe: cpe:2.3:a:tyk:tyk_gateway:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: tyk
    product: tyk_gateway
  tags: tyk,gateway,tech,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/hello"

    matchers-condition: and
    matchers:
      - type: word
        name: tyk_gateway
        cpe: cpe:2.3:a:tyk:tyk_gateway:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Tyk GW"
          - "description"
        condition: and

      - type: word
        name: tyk_gateway-2
        cpe: cpe:2.3:a:tyk:tyk_gateway:*:*:*:*:*:*:*:*
        part: content_type
        words:
          - application/json

    extractors:
      - type: regex
        name: version
        part: body
        regex:
          - "\"version\":\"([^\"]*)\""
