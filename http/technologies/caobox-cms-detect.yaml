id: caobox-cms-detect

info:
  name: Caobox CMS - Detect
  author: Chirag Mistry
  severity: info
  description: |
    Detects instances of Caobox CMS based on unique fingerprints and identifiers.
  classification:
    cpe: cpe:2.3:a:caobox:caobox:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    shodan-query:
      - http.component:"Caobox"
      - http.component:"caobox"
      - cpe:"cpe:2.3:a:caobox:caobox"
    vendor: caobox
    product: caobox
  tags: detect,caobox,cms,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    payloads:
      paths:
        - "/"
        - "/admin/"
        - "/index.php"
        - "/admin/login.php"

    matchers-condition: or
    matchers:
      - type: word
        name: caobox
        cpe: cpe:2.3:a:caobox:caobox:*:*:*:*:*:*:*:*
        words:
          - "Caobox CMS"
          - "powered by Caobox"
          - "Welcome to Caobox"
          - "Caobox version"
        condition: or

      - type: regex
        name: caobox-2
        cpe: cpe:2.3:a:caobox:caobox:*:*:*:*:*:*:*:*
        regex:
          - "(?i)caobox"
          - "(?i)caobox\\s+(v[0-9.]+)"
          - "(?i)<title>Caobox CMS"
