id: cockpit-detect

info:
  name: Detect Agentejo Cockpit
  author: dwisiswant0
  severity: info
  classification:
    cpe: cpe:2.3:a:agentejo:cockpit:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: agentejo
    product: cockpit
  tags: tech,cockpit,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/login"

    matchers:
      - type: word
        name: cockpit
        cpe: cpe:2.3:a:agentejo:cockpit:*:*:*:*:*:*:*:*
        words:
          - "<title>Authenticate Please!</title>"
