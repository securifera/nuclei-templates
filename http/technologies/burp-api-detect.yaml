id: burp-rest-api-detect

info:
  name: Burp Rest API Server Running
  author: joanbono
  severity: info
  reference:
    - https://portswigger.net/burp/documentation/enterprise/api-reference
  classification:
    cpe: cpe:2.3:a:portswigger:burp_suite:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: portswigger
    product: burp_suite
  tags: burp,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/v0.1/"

    matchers-condition: and
    matchers:
      - type: word
        name: burp_suite
        cpe: cpe:2.3:a:portswigger:burp_suite:*:*:*:*:*:*:*:*
        words:
          - '<title>Burp API</title>'
        part: body

      - type: word
        name: burp_suite-2
        cpe: cpe:2.3:a:portswigger:burp_suite:*:*:*:*:*:*:*:*
        words:
          - 'X-Burp-Version'
        part: header

      - type: status
        status:
          - 200
