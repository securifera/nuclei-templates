id: sap-spartacus-detect

info:
  name: SAP Spartacus detect
  author: TechbrunchFR
  severity: info
  description: Spartacus is a lean, Angular-based JavaScript storefront for SAP Commerce Cloud that communicates exclusively through the Commerce REST API.
  reference:
    - https://github.com/SAP/spartacus
  classification:
    cpe: cpe:2.3:a:sap:spartacus:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: sap
    product: spartacus
  tags: tech,sap,hybris,angular,spartacus,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - part: body
        name: spartacus
        cpe: cpe:2.3:a:sap:spartacus:*:*:*:*:*:*:*:*
        type: word
        words:
          - "<cx-storefront"
