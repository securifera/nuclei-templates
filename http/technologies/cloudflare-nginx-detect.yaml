id: cloudflare-nginx-detect

info:
  name: Cloudflare Nginx Detect
  author: idealphase
  severity: info
  reference:
    - https://blog.cloudflare.com/end-of-the-road-for-cloudflare-nginx/
  classification:
    cpe: cpe:2.3:a:cloudflare:cloudflare-nginx:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"cloudflare-nginx"
    vendor: cloudflare
    product: cloudflare-nginx
  tags: cloudflare,nginx,tech,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: cloudflare-nginx
        cpe: cpe:2.3:a:cloudflare:cloudflare-nginx:*:*:*:*:*:*:*:*
        part: header
        words:
          - "Server: cloudflare-nginx"

      - type: status
        status:
          - 200
