id: openspeedtest-speedtest

info:
  name: OpenSpeedTest - Detect
  author: DhiyaneshDk
  severity: info
  description: |
    Detected the exposed default page of the OpenSpeedTest service.
  classification:
    cpe: cpe:2.3:a:openspeedtest:openspeedtest:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"Openspeedtest"
    vendor: openspeedtest
    product: openspeedtest
  tags: tech,openspeedtest,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        name: openspeedtest
        cpe: cpe:2.3:a:openspeedtest:openspeedtest:*:*:*:*:*:*:*:*
        words:
          - "SpeedTest by OpenSpeedTest"
        part: body
