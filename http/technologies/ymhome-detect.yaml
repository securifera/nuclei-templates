id: ymhome-detect

info:
  name: Ymhome-detect
  author: ffffffff0x
  severity: info
  classification:
    cpe: cpe:2.3:a:ymhome:yimi_oa:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: app="一米OA"
    vendor: ymhome
    product: yimi_oa
  tags: ymhome,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: yimi_oa
        cpe: cpe:2.3:a:ymhome:yimi_oa:*:*:*:*:*:*:*:*
        part: body
        words:
          - "yimioa.apk"
          - "isSavePwd:"
        condition: and

      - type: status
        status:
          - 200
