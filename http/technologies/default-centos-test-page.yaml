id: default-centos-test-page

info:
  name: CentOs-WebPanel Test Page
  author: dhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:centos-webpanel:centos-webpanel:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"HTTP Server Test Page powered by CentOS-WebPanel.com"
    vendor: centos-webpanel
    product: centos-webpanel
  tags: tech,centos,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        name: centos-webpanel
        cpe: cpe:2.3:a:centos-webpanel:centos-webpanel:*:*:*:*:*:*:*:*
        words:
          - "<title>HTTP Server Test Page powered by CentOS-WebPanel.com</title>"
        part: body
