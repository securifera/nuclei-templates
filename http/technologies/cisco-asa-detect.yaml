id: cisco-asa-detect

info:
  name: Cisco ASA - Detect
  author: sdcampbell
  severity: info
  classification:
    cpe: cpe:2.3:a:cisco:adaptive_security_appliance:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: cisco
    product: adaptive_security_appliance
  tags: tech,cisco,detect,discovery

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
        X-Aggregate-Auth: 1

        TESTME

    matchers-condition: and
    matchers:
      - type: word
        name: adaptive_security_appliance
        cpe: cpe:2.3:a:cisco:adaptive_security_appliance:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'config-auth client="vpn"'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "<version who=\"sg\">(.*?)</version>"
