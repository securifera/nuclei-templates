id: amazon-ecs-defualt-page

info:
  name: Amazon ECS Sample App Default Page - Detect
  author: Splint3r7
  severity: info
  description: |
    Amazon ECS Sample App Default Page was detected.
  classification:
    cpe: cpe:2.3:a:amazon:elastic_container_service:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Amazon ECS Sample App"
    vendor: amazon
    product: elastic_container_service
  tags: amazon,tech,default,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        name: elastic_container_service
        cpe: cpe:2.3:a:amazon:elastic_container_service:*:*:*:*:*:*:*:*
        dsl:
          - 'contains(body, "<title>Amazon ECS Sample App")'
          - 'status_code == 200'
        condition: and
