id: mcp-inspector-detect

info:
  name: MCP Inspector Detect
  author: pussycat0x
  severity: info
  description: |
    MCP Inspector was a debugging tool used to inspect and test MCP servers, including their resources, prompts, and tools.
  reference:
    - https://github.com/modelcontextprotocol/inspector
  classification:
    cpe: cpe:2.3:a:modelcontextprotocol:inspector:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    fofa-query: title="MCP Inspector"
    vendor: modelcontextprotocol
    product: inspector
  tags: tech,mcp,anthropic,discovery,ai

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        name: inspector
        cpe: cpe:2.3:a:modelcontextprotocol:inspector:*:*:*:*:*:*:*:*
        dsl:
          - status_code == 200
          - contains(body,"<title>MCP Inspector")
        condition: and
        internal: true

    extractors:
      - type: regex
        internal: true
        name: js
        group: 1
        part: body
        regex:
          - 'src="([^"]+\.js)"'

  - method: GET
    path:
      - "{{BaseURL}}{{js}}"

    matchers:
      - type: dsl
        name: inspector-2
        cpe: cpe:2.3:a:modelcontextprotocol:inspector:*:*:*:*:*:*:*:*
        dsl:
          - status_code == 200

    extractors:
      - type: regex
        name: version
        group: 1
        part: body
        regex:
          - 'const\s+version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)'
