id: wordpress-siteorigin-panels

info:
  name: Page Builder by SiteOrigin Detection
  author: ricardomaia
  severity: info
  reference:
    - https://wordpress.org/plugins/siteorigin-panels/
  classification:
    cpe: cpe:2.3:a:siteorigin-panels:siteorigin-panels:*:*:*:*:*:wordpress:*:*
  metadata:
    plugin_namespace: siteorigin-panels
    wpscan: https://wpscan.com/plugin/siteorigin-panels
  tags: tech,wordpress,wp-plugin,top-200,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/siteorigin-panels/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/siteorigin-panels.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        cpe: cpe:2.3:a:siteorigin-panels:siteorigin-panels:*:*:*:*:*:wordpress:*:*
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        name: siteorigin-panels
        cpe: cpe:2.3:a:siteorigin-panels:siteorigin-panels:*:*:*:*:*:wordpress:*:*
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
