id: wordpress-mailpoet

info:
  name: MailPoet – Newsletters, Email Marketing, and Automation Detection
  author: ricardomaia
  severity: info
  reference:
    - https://wordpress.org/plugins/mailpoet/
  classification:
    cpe: cpe:2.3:a:mailpoet:mailpoet:*:*:*:*:*:wordpress:*:*
  metadata:
    plugin_namespace: mailpoet
    wpscan: https://wpscan.com/plugin/mailpoet
  tags: tech,wordpress,wp-plugin,top-200,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/mailpoet/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/mailpoet.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        cpe: cpe:2.3:a:mailpoet:mailpoet:*:*:*:*:*:wordpress:*:*
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        name: mailpoet
        cpe: cpe:2.3:a:mailpoet:mailpoet:*:*:*:*:*:wordpress:*:*
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
