id: wordpress-easy-table-of-contents

info:
  name: Easy Table of Contents Detection
  author: ricardomaia
  severity: info
  reference:
    - https://wordpress.org/plugins/easy-table-of-contents/
  classification:
    cpe: cpe:2.3:a:easy-table-of-contents:easy-table-of-contents:*:*:*:*:*:wordpress:*:*
  metadata:
    plugin_namespace: easy-table-of-contents
    wpscan: https://wpscan.com/plugin/easy-table-of-contents
  tags: tech,wordpress,wp-plugin,top-200,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/easy-table-of-contents/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/easy-table-of-contents.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        cpe: cpe:2.3:a:easy-table-of-contents:easy-table-of-contents:*:*:*:*:*:wordpress:*:*
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        name: easy-table-of-contents
        cpe: cpe:2.3:a:easy-table-of-contents:easy-table-of-contents:*:*:*:*:*:wordpress:*:*
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
