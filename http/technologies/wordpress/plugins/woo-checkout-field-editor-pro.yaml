id: wordpress-woo-checkout-field-editor-pro

info:
  name: Checkout Field Editor (Checkout Manager) for WooCommerce Detection
  author: ricardomaia
  severity: info
  reference:
    - https://wordpress.org/plugins/woo-checkout-field-editor-pro/
  classification:
    cpe: cpe:2.3:a:woo-checkout-field-editor-pro:woo-checkout-field-editor-pro:*:*:*:*:*:wordpress:*:*
  metadata:
    plugin_namespace: woo-checkout-field-editor-pro
    wpscan: https://wpscan.com/plugin/woo-checkout-field-editor-pro
  tags: tech,wordpress,wp-plugin,top-200,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/woo-checkout-field-editor-pro/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/woo-checkout-field-editor-pro.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        cpe: cpe:2.3:a:woo-checkout-field-editor-pro:woo-checkout-field-editor-pro:*:*:*:*:*:wordpress:*:*
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        name: woo-checkout-field-editor-pro
        cpe: cpe:2.3:a:woo-checkout-field-editor-pro:woo-checkout-field-editor-pro:*:*:*:*:*:wordpress:*:*
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
