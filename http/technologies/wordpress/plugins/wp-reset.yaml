id: wordpress-wp-reset

info:
  name: WP Reset – Most Advanced WordPress Reset Tool Detection
  author: ricardomaia
  severity: info
  reference:
    - https://wordpress.org/plugins/wp-reset/
  classification:
    cpe: cpe:2.3:a:wp-reset:wp-reset:*:*:*:*:*:wordpress:*:*
  metadata:
    plugin_namespace: wp-reset
    wpscan: https://wpscan.com/plugin/wp-reset
  tags: tech,wordpress,wp-plugin,top-200,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/wp-reset/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/wp-reset.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        cpe: cpe:2.3:a:wp-reset:wp-reset:*:*:*:*:*:wordpress:*:*
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        name: wp-reset
        cpe: cpe:2.3:a:wp-reset:wp-reset:*:*:*:*:*:wordpress:*:*
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
