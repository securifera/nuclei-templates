id: wordpress-add-to-any

info:
  name: AddToAny Share Buttons Detection
  author: ricardomaia
  severity: info
  reference:
    - https://wordpress.org/plugins/add-to-any/
  classification:
    cpe: cpe:2.3:a:add-to-any:add-to-any:*:*:*:*:*:wordpress:*:*
  metadata:
    plugin_namespace: add-to-any
    wpscan: https://wpscan.com/plugin/add-to-any
  tags: tech,wordpress,wp-plugin,top-200,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/add-to-any/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/add-to-any.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        cpe: cpe:2.3:a:add-to-any:add-to-any:*:*:*:*:*:wordpress:*:*
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        name: add-to-any
        cpe: cpe:2.3:a:add-to-any:add-to-any:*:*:*:*:*:wordpress:*:*
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
