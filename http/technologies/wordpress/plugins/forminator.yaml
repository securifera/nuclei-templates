id: wordpress-forminator

info:
  name: Forminator Forms – Contact Form, Payment Form & Custom Form Builder Detection
  author: ricardomaia
  severity: info
  reference:
    - https://wordpress.org/plugins/forminator/
  classification:
    cpe: cpe:2.3:a:forminator:forminator:*:*:*:*:*:wordpress:*:*
  metadata:
    plugin_namespace: forminator
    wpscan: https://wpscan.com/plugin/forminator
  tags: tech,wordpress,wp-plugin,top-200,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/forminator/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/forminator.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        cpe: cpe:2.3:a:forminator:forminator:*:*:*:*:*:wordpress:*:*
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        name: forminator
        cpe: cpe:2.3:a:forminator:forminator:*:*:*:*:*:wordpress:*:*
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
