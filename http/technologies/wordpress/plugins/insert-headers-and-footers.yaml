id: wordpress-insert-headers-and-footers

info:
  name: WPCode – Insert Headers and Footers + Custom Code Snippets – WordPress Code Manager Detection
  author: ricardomaia
  severity: info
  reference:
    - https://wordpress.org/plugins/insert-headers-and-footers/
  classification:
    cpe: cpe:2.3:a:insert-headers-and-footers:insert-headers-and-footers:*:*:*:*:*:wordpress:*:*
  metadata:
    plugin_namespace: insert-headers-and-footers
    wpscan: https://wpscan.com/plugin/insert-headers-and-footers
  tags: tech,wordpress,wp-plugin,top-100,top-200,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/insert-headers-and-footers/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/insert-headers-and-footers.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        cpe: cpe:2.3:a:insert-headers-and-footers:insert-headers-and-footers:*:*:*:*:*:wordpress:*:*
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        name: insert-headers-and-footers
        cpe: cpe:2.3:a:insert-headers-and-footers:insert-headers-and-footers:*:*:*:*:*:wordpress:*:*
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
