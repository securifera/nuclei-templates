id: wordpress-facebook-for-woocommerce

info:
  name: Facebook for WooCommerce Detection
  author: ricardomaia
  severity: info
  reference:
    - https://wordpress.org/plugins/facebook-for-woocommerce/
  classification:
    cpe: cpe:2.3:a:facebook-for-woocommerce:facebook-for-woocommerce:*:*:*:*:*:wordpress:*:*
  metadata:
    plugin_namespace: facebook-for-woocommerce
    wpscan: https://wpscan.com/plugin/facebook-for-woocommerce
  tags: tech,wordpress,wp-plugin,top-200,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/facebook-for-woocommerce/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/facebook-for-woocommerce.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        cpe: cpe:2.3:a:facebook-for-woocommerce:facebook-for-woocommerce:*:*:*:*:*:wordpress:*:*
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        name: facebook-for-woocommerce
        cpe: cpe:2.3:a:facebook-for-woocommerce:facebook-for-woocommerce:*:*:*:*:*:wordpress:*:*
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
