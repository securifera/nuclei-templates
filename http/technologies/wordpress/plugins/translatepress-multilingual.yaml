id: wordpress-translatepress-multilingual

info:
  name: Translate Multilingual sites – TranslatePress Detection
  author: ricardomaia
  severity: info
  reference:
    - https://wordpress.org/plugins/translatepress-multilingual/
  classification:
    cpe: cpe:2.3:a:translatepress-multilingual:translatepress-multilingual:*:*:*:*:*:wordpress:*:*
  metadata:
    plugin_namespace: translatepress-multilingual
    wpscan: https://wpscan.com/plugin/translatepress-multilingual
  tags: tech,wordpress,wp-plugin,top-200,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/translatepress-multilingual/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/translatepress-multilingual.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        cpe: cpe:2.3:a:translatepress-multilingual:translatepress-multilingual:*:*:*:*:*:wordpress:*:*
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        name: translatepress-multilingual
        cpe: cpe:2.3:a:translatepress-multilingual:translatepress-multilingual:*:*:*:*:*:wordpress:*:*
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
