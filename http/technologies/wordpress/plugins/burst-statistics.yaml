id: wordpress-burst-statistics

info:
  name: Burst Statistics – Privacy-Friendly Analytics for WordPress Detection
  author: ricardomaia
  severity: info
  reference:
    - https://wordpress.org/plugins/burst-statistics/
  classification:
    cpe: cpe:2.3:a:burst-statistics:burst-statistics:*:*:*:*:*:wordpress:*:*
  metadata:
    plugin_namespace: burst-statistics
    wpscan: https://wpscan.com/plugin/burst-statistics
  tags: tech,wordpress,wp-plugin,top-200,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/burst-statistics/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/burst-statistics.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        cpe: cpe:2.3:a:burst-statistics:burst-statistics:*:*:*:*:*:wordpress:*:*
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        name: burst-statistics
        cpe: cpe:2.3:a:burst-statistics:burst-statistics:*:*:*:*:*:wordpress:*:*
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
