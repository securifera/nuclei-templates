id: google-frontend-httpserver

info:
  name: Google frontend HttpServer
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:google:google_frontend:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: "Server: Google Frontend"
    vendor: google
    product: google_frontend
  tags: tech,google,httpserver,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: google_frontend
        cpe: cpe:2.3:a:google:google_frontend:*:*:*:*:*:*:*:*
        part: header
        words:
          - "Google Frontend"
