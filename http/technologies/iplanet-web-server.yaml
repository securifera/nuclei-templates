id: iplanet-web-server

info:
  name: Detect iPlanet Webserver Detection
  author: pussycat0x
  severity: info
  classification:
    cpe: cpe:2.3:a:oracle:iplanet_web_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: app="iPlanet-Web-Server,-Enterprise-Edition-4.1"
    vendor: oracle
    product: iplanet_web_server
  tags: tech,webserver,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: iplanet_web_server
        cpe: cpe:2.3:a:oracle:iplanet_web_server:*:*:*:*:*:*:*:*
        part: body
        words:
          - "iPlanet"

      - type: status
        status:
          - 200
