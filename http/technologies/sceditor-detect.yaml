id: sceditor-detect

info:
  name: SCEditor Detect
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:sceditor:sceditor:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sceditor
    product: sceditor
  tags: tech,sceditor,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: sceditor
        cpe: cpe:2.3:a:sceditor:sceditor:*:*:*:*:*:*:*:*
        words:
          - "<title>Ticket BBCode editor - SCEditor</title>"
          - 'title="SCEditor"'
        condition: and

      - type: status
        status:
          - 200
