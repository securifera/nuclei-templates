id: getsimple-cms-detect

info:
  name: GetSimple CMS Detection
  author: pikpikcu,philippedelteil
  severity: info
  description: Template to detect a running GetSimple CMS instance
  classification:
    cpe: cpe:2.3:a:get-simple:getsimple_cms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: get-simple
    product: getsimple_cms
  tags: tech,getsimple,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/readme.txt"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: getsimple_cms
        cpe: cpe:2.3:a:get-simple:getsimple_cms:*:*:*:*:*:*:*:*
        words:
          - "Powered by  GetSimple"
          - 'GetSimple CMS is a flatfile CMS'
        part: body
        condition: or
