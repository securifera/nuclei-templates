id: docker-registry-browser-detect

info:
  name: Docker Registry Browser - Detect
  author: pussycat0x
  severity: info
  description: |
    Detected the presence of Docker Registry Browser technology based on known paths and characteristic content in the HTTP response.
  reference:
    - https://github.com/klausmeyer/docker-registry-browser
  classification:
    cpe: cpe:2.3:a:klausmeyer:docker_registry_browser:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Docker Registry Browser"
    vendor: klausmeyer
    product: docker_registry_browser
  tags: docker,registry,browser,ui,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: docker_registry_browser
        cpe: cpe:2.3:a:klausmeyer:docker_registry_browser:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Docker Registry Browser</title>"

      - type: status
        status:
          - 200
