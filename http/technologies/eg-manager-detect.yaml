id: eg-manager-detect

info:
  name: eG Manager Detect
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:eginnovations:eg_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: eginnovations
    product: eg_manager
  tags: tech,eg,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/final/"

    matchers-condition: and
    matchers:
      - type: word
        name: eg_manager
        cpe: cpe:2.3:a:eginnovations:eg_manager:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title> eG Innovations, Inc.</title>"
          - "eG Innovations, Inc. All Rights Reserved"

      - type: status
        status:
          - 200
