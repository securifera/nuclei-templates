id: domibus-detect

info:
  name: Domibus - Detect
  author: righettod
  severity: info
  description: |
    Domibus was detected.
  reference:
    - https://ec.europa.eu/digital-building-blocks/sites/display/DIGITAL/Domibus
  classification:
    cpe: cpe:2.3:a:europa:domibus:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Domibus"
    vendor: europa
    product: domibus
  tags: tech,domibus,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/domibus/rest/application/info"
      - "{{BaseURL}}/domibus/"

    stop-at-first-match: true
    matchers:
      - type: dsl
        name: domibus
        cpe: cpe:2.3:a:europa:domibus:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>domibus", "domibus-msh")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"versionNumber":\s*"([0-9.]+)"'
