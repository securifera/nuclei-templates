id: dell-idrac7-detect

info:
  name: Detect Dell iDRAC7
  author: kophjager007,0x_Akoko
  severity: info
  description: |
    Detected The Integrated Dell Remote Access Controller, (iDRAC) is designed for secure local and remote server management and helps IT administrators deploy, update and monitor Dell EMC PowerEdge servers.
  reference:
    - https://www.dell.com/support/manuals/en-us/idrac7-8-with-lc-v2.40.40.40
  classification:
    cpe: cpe:2.3:a:dell:idrac7:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: dell
    product: idrac7
  tags: tech,dell,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/data?get=prodServerGen"

    matchers:
      - type: dsl
        name: idrac7
        cpe: cpe:2.3:a:dell:idrac7:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "text/xml")'
          - 'contains_all(body, "<prodServerGen>", "<Manufacturer>Dell", "<isDellBranded>1</isDellBranded>", "12G")'
        condition: and

    extractors:
      - type: regex
        name: server_generation
        part: body
        group: 1
        regex:
          - '<prodServerGen>([0-9]{2}G)</prodServerGen>'
