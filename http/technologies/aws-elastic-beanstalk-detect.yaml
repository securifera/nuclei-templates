id: elastic-beanstalk-detect

info:
  name: AWS Elastic Beanstalk Detect
  author: pussycat0x
  severity: info
  classification:
    cpe: cpe:2.3:a:amazon:elastic_beanstalk:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: amazon
    product: elastic_beanstalk
  tags: aws,tech,beanstalk,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: elastic_beanstalk
        cpe: cpe:2.3:a:amazon:elastic_beanstalk:*:*:*:*:*:*:*:*
        words:
          - '<li><a href="http://docs.aws.amazon.com/elasticbeanstalk/latest/dg/Welcome.html">AWS Elastic Beanstalk overview</a></li>'
          - '<li><a href="http://docs.amazonwebservices.com/elasticbeanstalk/latest/dg/">AWS Elastic Beanstalk overview</a></li>'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<title>([A-Za-z -]+)<\/title>'
