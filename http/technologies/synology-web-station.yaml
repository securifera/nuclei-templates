id: synology-web-station

info:
  name: Synology Web Station Page - Detect
  author: dhiyaneshDK
  severity: info
  description: Synology Web Station page was detected.
  reference:
    - https://www.exploit-db.com/ghdb/7125
  classification:
    cpe: cpe:2.3:a:synology:web_station:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: synology
    product: web_station
  tags: tech,synology,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: web_station
        cpe: cpe:2.3:a:synology:web_station:*:*:*:*:*:*:*:*
        words:
          - '<title>Hello! Welcome to Synology Web Station!</title>'

      - type: status
        status:
          - 200
