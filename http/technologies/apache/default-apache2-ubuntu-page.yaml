id: default-apache2-ubuntu-page

info:
  name: Apache2 Ubuntu Default Page
  author: dhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:apache:http_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Apache2 Ubuntu Default Page"
    vendor: apache
    product: http_server
  tags: tech,apache,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        name: http_server
        cpe: cpe:2.3:a:apache:http_server:*:*:*:*:*:*:*:*
        words:
          - "<title>Apache2 Ubuntu Default Page: It works</title>"
        part: body
