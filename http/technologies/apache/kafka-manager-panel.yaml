id: kafka-manager-panel

info:
  name: Kafka Manager Panel
  author: ritikchaddha
  severity: info
  reference:
    - https://github.com/yahoo/CMAK
  classification:
    cpe: cpe:2.3:a:yahoo:cmak:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Kafka-Manager"
    fofa-query: app="Kafka-Manager"
    vendor: yahoo
    product: cmak
  tags: tech,kafka,apache,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        name: cmak
        cpe: cpe:2.3:a:yahoo:cmak:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Kafka Manager"

      - type: word
        name: cmak-2
        cpe: cpe:2.3:a:yahoo:cmak:*:*:*:*:*:*:*:*
        part: header
        words:
          - "Kafka-Manager"
