id: zimbra-detect

info:
  name: Zimbra Detect
  author: UdinChan
  severity: info
  description: Send a GET request to js file on Zimbra server to obtain version information
  classification:
    cpe: cpe:2.3:a:zimbra:collaboration:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: zimbra
    product: collaboration
  tags: tech,zimbra,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/js/zimbraMail/share/model/ZmSettings.js"

    matchers-condition: and
    matchers:
      - type: word
        name: collaboration
        cpe: cpe:2.3:a:zimbra:collaboration:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Zimbra Collaboration Suite Web Client"

      - type: word
        name: collaboration-2
        cpe: cpe:2.3:a:zimbra:collaboration:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/x-javascript"

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'CLIENT_VERSION\",					{type:ZmSetting.T_CONFIG, defaultValue:\"(.*?)"'
