id: cups-detect

info:
  name: CUPS - Detect
  author: rxerium
  severity: info
  description: |
    An instance running CUPS was detected.
  classification:
    cpe: cpe:2.3:a:apple:cups:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"CUPS (IPP)"
    vendor: apple
    product: cups
  tags: cups,tech,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: cups
        cpe: cpe:2.3:a:apple:cups:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Web Interface is Disabled - CUPS"
          - "Forbidden - CUPS"
          - "Server: CUPS"
        condition: or

      - type: status
        status:
          - 200
          - 404
          - 403
        condition: or

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - 'CUPS v([0-9.]+)>'
