id: cowboy-detect

info:
  name: Cowboy - Detect
  author: sechunt3r
  severity: info
  description: Cowboy was detected.
  reference:
    - https://github.com/ninenines/cowboy
  classification:
    cpe: cpe:2.3:a:ninenines:cowboy:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "cowboy"
    vendor: ninenines
    product: cowboy
  tags: tech,cowboy,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: cowboy
        cpe: cpe:2.3:a:ninenines:cowboy:*:*:*:*:*:*:*:*
        part: header
        words:
          - "Server: Cowboy"
        case-insensitive: true
