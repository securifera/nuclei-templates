id: cloudflare-speedtest

info:
  name: Cloudflare Speedtest - Detect
  author: DhiyaneshDk
  severity: info
  description: |
    Detected the exposed default page of the Cloudflare Speedtest service.
  classification:
    cpe: cpe:2.3:a:cloudflare:speedtest:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"cloudflare/speedtest"
    vendor: cloudflare
    product: speedtest
  tags: tech,cloudflare,speedtest,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        name: speedtest
        cpe: cpe:2.3:a:cloudflare:speedtest:*:*:*:*:*:*:*:*
        words:
          - "@cloudflare/speedtest"
        part: body
