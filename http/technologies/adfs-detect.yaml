id: adfs-detect

info:
  name: ADFS Detect
  author: Adam Crosser,Mys7ic
  severity: info
  description: Detects ADFS with forms-based authentication enabled.
  classification:
    cpe: cpe:2.3:a:microsoft:active_directory_federation_services:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: microsoft
    product: active_directory_federation_services
  tags: tech,adfs,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/adfs/ls/idpinitiatedsignon.aspx"

    matchers-condition: and
    matchers:
      - type: word
        name: active_directory_federation_services
        cpe: cpe:2.3:a:microsoft:active_directory_federation_services:*:*:*:*:*:*:*:*
        part: body
        words:
          - '/adfs/portal/css/style.css'

    extractors:
      - type: regex
        part: body
        name: domain
        group: 1
        regex:
          - 'var\s+userNameValue\s*=\s*''([^\\]*)\\'
