id: rhymix-cms-detect

info:
  name: Rhymix CMS Detect
  author: gy741
  severity: info
  description: Detects Rhymix CMS
  reference:
    - https://github.com/rhymix/rhymix
  classification:
    cpe: cpe:2.3:a:rhymix:rhymix:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: rhymix
    product: rhymix
  tags: tech,rhymix,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        name: rhymix
        cpe: cpe:2.3:a:rhymix:rhymix:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'rx_sesskey1'

      - type: word
        name: rhymix-2
        cpe: cpe:2.3:a:rhymix:rhymix:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<meta name="generator" content="Rhymix" />'
