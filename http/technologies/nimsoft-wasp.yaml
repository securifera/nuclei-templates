id: nimsoft-wasp

info:
  name: Nimsoft Wasp Detection
  author: Nullfuzz
  severity: info
  description: Detect Nimsoft Wasp WebPage
  classification:
    cpe: cpe:2.3:a:broadcom:nimsoft:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: broadcom
    product: nimsoft
  tags: nimsoft,exposure,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: nimsoft
        cpe: cpe:2.3:a:broadcom:nimsoft:*:*:*:*:*:*:*:*
        words:
          - "Powered by <b>Nimsoft WASP "
          - "<title>WASP</title>"
        condition: or

      - type: status
        status:
          - 200
