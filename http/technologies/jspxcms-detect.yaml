id: jspxcms-detect

info:
  name: Jspxcms Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:jspxcms:jspxcms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: jspxcms
    product: jspxcms
  tags: tech,jspxcms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: jspxcms
        cpe: cpe:2.3:a:jspxcms:jspxcms:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Jspxcms"

      - type: status
        status:
          - 200
