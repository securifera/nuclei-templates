id: artica-web-proxy-detect

info:
  name: Artica Web Proxy Detect
  author: dwisiswant0
  severity: info
  classification:
    cpe: cpe:2.3:a:articatech:artica_web_proxy:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: articatech
    product: artica_web_proxy
  tags: tech,artica,proxy,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/fw.login.php"

    matchers-condition: and
    matchers:
      - type: word
        name: artica_web_proxy
        cpe: cpe:2.3:a:articatech:artica_web_proxy:*:*:*:*:*:*:*:*
        words:
          - "Welcome to the Artica Web Administration Interface"

      - type: status
        status:
          - 200
