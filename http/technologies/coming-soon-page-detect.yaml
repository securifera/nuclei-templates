id: coming-soon-page-detect

info:
  name: Coming Soon Page Detect
  author: tess
  severity: info
  classification:
    cpe: cpe:2.3:a:coming_soon:coming_soon:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Coming Soon"
    vendor: coming_soon
    product: coming_soon
  tags: tech,default-page,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: coming_soon
        cpe: cpe:2.3:a:coming_soon:coming_soon:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Coming Soon"
          - "Future home of something quite cool."
        condition: and

      - type: word
        name: coming_soon-2
        cpe: cpe:2.3:a:coming_soon:coming_soon:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
