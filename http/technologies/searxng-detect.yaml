id: searxng-detect

info:
  name: SearXNG - Detect
  author: rxerium
  severity: info
  description: |
    A SearXNG search engine was detected.
  reference:
    - https://github.com/searxng/searxng
  classification:
    cpe: cpe:2.3:a:searxng:searxng:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:SearXNG
    vendor: searxng
    product: searxng
  tags: searxng,search-engine,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: searxng
        cpe: cpe:2.3:a:searxng:searxng:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>SearXNG</title>"

      - type: status
        status:
          - 200
