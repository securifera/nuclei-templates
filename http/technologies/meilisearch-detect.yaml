id: meilisearch-detect

info:
  name: Meilisearch - Detect
  author: userdehghani
  severity: info
  description: |
    An open-source, blazingly fast, and hyper-relevant search engine that will improve your search experience.
  reference:
    - https://www.meilisearch.com/
  classification:
    cpe: cpe:2.3:a:meilisearch:meilisearch:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="meilisearch"
    vendor: meilisearch
    product: meilisearch
  tags: meilisearch,detect,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: meilisearch
        cpe: cpe:2.3:a:meilisearch:meilisearch:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Meilisearch is running")'
        condition: and
