id: erxes-detect

info:
  name: Erxes Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:erxes:erxes:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"erxes"
    product: erxes
    vendor: erxes
    fofa-query: title="erxes"
    google-query: intitle:"erxes"
  tags: tech,erxes,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        name: erxes
        cpe: cpe:2.3:a:erxes:erxes:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "<title>erxes(.*)</title>"

      - type: status
        status:
          - 200
