id: slims-cms-detect

info:
  name: Slims CMS - Detect
  author: nblirwn
  severity: info
  description: Detects Senayan Library Management System (SLiMS) CMS
  reference:
    - https://github.com/slims
  classification:
    cpe: cpe:2.3:a:slims:senayan_library_management_system:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:'content="SLiMS'
    vendor: slims
    product: senayan_library_management_system
  tags: tech,slims,cms,senayan,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: senayan_library_management_system
        cpe: cpe:2.3:a:slims:senayan_library_management_system:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'content="SLiMS'
