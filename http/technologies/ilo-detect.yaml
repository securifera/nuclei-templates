id: ilo-detect

info:
  name: HP iLO
  author: milo2012
  severity: info
  description: Version of HP iLO
  classification:
    cpe: cpe:2.3:a:hp:integrated_lights-out:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: hp
    product: integrated_lights-out
  tags: tech,ilo,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/xmldata?item=all"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: integrated_lights-out
        cpe: cpe:2.3:a:hp:integrated_lights-out:*:*:*:*:*:*:*:*
        words:
          - text/xml
        part: header

      - type: word
        name: integrated_lights-out-2
        cpe: cpe:2.3:a:hp:integrated_lights-out:*:*:*:*:*:*:*:*
        words:
          - <RIMP>
          - <HSI>
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "<FWRI>([0-9.]+)</FWRI>"
