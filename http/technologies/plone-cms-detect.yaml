id: plone-cms-detect

info:
  name: Plone CMS detect
  author: cyllective
  severity: info
  description: Detects Plone CMS
  reference:
    - https://github.com/plone/Products.CMFPlone
  classification:
    cpe: cpe:2.3:a:plone:plone:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: plone
    product: plone
  tags: tech,plone,cms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: plone
        cpe: cpe:2.3:a:plone:plone:*:*:*:*:*:*:*:*
        part: body
        condition: or
        words:
          - '<meta name="generator" content="Plone - '
          - '<div xmlns:css="http://namespaces.plone.org/diazo/css"'
          - '/++plone++static/plone-compiled.css'
          - '/++plone++static/tinymce-styles.css'
          - '>Powered by Plone &amp; Python</a>'
