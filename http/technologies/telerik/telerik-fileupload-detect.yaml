id: telerik-fileupload-detect

info:
  name: Detect Telerik Web UI Fileupload Handler
  author: organiccrap
  severity: info
  description: This template detects the Telerik Web UI fileupload handler.
  classification:
    cpe: cpe:2.3:a:telerik:ui_for_asp.net_ajax:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: telerik
    product: ui_for_asp.net_ajax
  tags: tech,telerik,fileupload,intrusive,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Telerik.Web.UI.WebResource.axd?type=rau"

    matchers:
      - type: word
        name: ui_for_asp.net_ajax
        cpe: cpe:2.3:a:telerik:ui_for_asp.net_ajax:*:*:*:*:*:*:*:*
        words:
          - "RadAsyncUpload handler is registered succesfully"
