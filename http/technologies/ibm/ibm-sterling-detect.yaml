id: ibm-sterling-detect

info:
  name: IBM Sterling File Gateway Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:ibm:sterling_file_gateway:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ibm
    product: sterling_file_gateway
  tags: tech,sterling,ibm,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: sterling_file_gateway
        cpe: cpe:2.3:a:ibm:sterling_file_gateway:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Welcome to IBM Sterling File Gateway"

      - type: status
        status:
          - 200
