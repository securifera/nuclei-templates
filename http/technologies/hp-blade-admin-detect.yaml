id: hp-blade-system

info:
  name: HP BladeSystem Onboard Administrator Panel - Detector
  author: pussycat0x
  severity: info
  description: HPBladeSystem Onboard Administrator panel was detected.
  classification:
    cpe: cpe:2.3:a:hp:bladesystem_onboard_administrator:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"HP BladeSystem"
    vendor: hp
    product: bladesystem_onboard_administrator
  tags: panel,hp,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: bladesystem_onboard_administrator
        cpe: cpe:2.3:a:hp:bladesystem_onboard_administrator:*:*:*:*:*:*:*:*
        words:
          - "<title>HP BladeSystem Onboard Administrator</title>"

      - type: status
        status:
          - 200
