id: waf-detect

info:
  name: WAF Detection
  author: dwisiswant0,lu4nx
  severity: info
  description: A web application firewall was detected.
  reference:
    - https://github.com/Ekultek/WhatWaf
  classification:
    cpe: cpe:2.3:a:waf:waf:*:*:*:*:*:*:*:*
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: waf
    product: waf
  tags: waf,tech,misc,discovery

http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        _=<script>alert(1)</script>

    matchers:
      - type: regex
        name: instart
        cpe: cpe:2.3:a:instart:instart:*:*:*:*:*:*:*:*
        regex:
          - '(?i)instartrequestid'
        part: body

      - type: regex
        name: perimx
        cpe: cpe:2.3:a:perimx:perimx:*:*:*:*:*:*:*:*
        regex:
          - '(?i)access.to.this.page.has.been.denied.because.we.believe.you.are.using.automation.tool'
          - '(?i)http(s)?://(www.)?perimeterx.\w+.whywasiblocked'
          - '(?i)perimeterx'
          - '(?i)(..)?client.perimeterx.*/[a-zA-Z]{8,15}/*.*.js'
        condition: or
        part: response

      - type: regex
        name: webknight
        cpe: cpe:2.3:a:webknight:webknight:*:*:*:*:*:*:*:*
        regex:
          - '(?i)\bwebknight'
          - '(?i)webknight'
        condition: or
        part: response

      - type: regex
        name: zscaler
        cpe: cpe:2.3:a:zscaler:zscaler:*:*:*:*:*:*:*:*
        regex:
          - '(?i)zscaler(.\d+(.\d+)?)?'
          - '(?i)zscaler'
        condition: or
        part: response

      - type: regex
        name: fortigate
        cpe: cpe:2.3:a:fortigate:fortigate:*:*:*:*:*:*:*:*
        regex:
          - '(?i).>powered.by.fortinet<.'
          - '(?i).>fortigate.ips.sensor<.'
          - '(?i)fortigate'
          - '(?i).fgd_icon'
          - '(?i)\AFORTIWAFSID='
          - '(?i)application.blocked.'
          - '(?i).fortiGate.application.control'
          - '(?i)(http(s)?)?://\w+.fortinet(.\w+:)?'
          - '(?i)fortigate.hostname'
          - '(?i)the.page.cannot.be.displayed..please.contact.[^@]+@[^@]+\.[^@]+.for.additional.information'
        condition: or
        part: response

      - type: regex
        name: fortiweb
        cpe: cpe:2.3:a:fortiweb:fortiweb:*:*:*:*:*:*:*:*
        regex:
          - 'Set-Cookie: cookiesession1='
        part: header

      - type: regex
        name: teros
        cpe: cpe:2.3:a:teros:teros:*:*:*:*:*:*:*:*
        regex:
          - '(?i)st8(id|.wa|.wf)?.?(\d+|\w+)?='
        condition: or
        part: header

      - type: regex
        name: stricthttp
        cpe: cpe:2.3:a:stricthttp:stricthttp:*:*:*:*:*:*:*:*
        regex:
          - '(?i)the.request.was.rejected.because.the.url.contained.a.potentially.malicious.string'
        condition: or
        part: response

      - type: regex
        name: stricthttp
        cpe: cpe:2.3:a:stricthttp:stricthttp:*:*:*:*:*:*:*:*
        regex:
          - '(?i)rejected.by.url.scan'
          - '(?i)/rejected.by.url.scan'
        condition: or
        part: response

      - type: regex
        name: shadowd
        cpe: cpe:2.3:a:shadowd:shadowd:*:*:*:*:*:*:*:*
        regex:
          - '(?i)<h\d>\d{3}.forbidden<.h\d>'
          - '(?i)request.forbidden.by.administrative.rules.'
        condition: and
        part: response

      - type: regex
        name: bigip
        cpe: cpe:2.3:a:bigip:bigip:*:*:*:*:*:*:*:*
        regex:
          - '(?i)\ATS\w{4,}='
          - '(?i)bigipserver(.i)?|bigipserverinternal'
          - '(?i)^TS[a-zA-Z0-9]{3,8}='
          - '(?i)BigIP|BIG-IP|BIGIP'
          - '(?i)bigipserver'
        condition: or
        part: response

      - type: regex
        name: edgecast
        cpe: cpe:2.3:a:edgecast:edgecast:*:*:*:*:*:*:*:*
        regex:
          - '(?i)\Aecdf'
        condition: or
        part: response

      - type: regex
        name: radware
        cpe: cpe:2.3:a:radware:radware:*:*:*:*:*:*:*:*
        regex:
          - '(?i).\bcloudwebsec.radware.com\b.'
          - '(?i).>unauthorized.activity.has.been.detected<.'
          - '(?i)with.the.following.case.number.in.its.subject:.\d+.'
        condition: or
        part: response

      - type: regex
        name: varnish
        cpe: cpe:2.3:a:varnish:varnish:*:*:*:*:*:*:*:*
        regex:
          - '(?i)varnish'
          - '(?i).>.?security.by.cachewall.?<.'
          - '(?i)cachewall'
          - '(?i).>access.is.blocked.according.to.our.site.security.policy.<+'
        condition: or
        part: response

      - type: regex
        name: infosafe
        cpe: cpe:2.3:a:infosafe:infosafe:*:*:*:*:*:*:*:*
        regex:
          - '(?i)infosafe'
          - '(?i)by.(http(s)?(.//)?)?7i24.(com|net)'
          - '(?i)infosafe.\d.\d'
          - '(?i)var.infosafekey='
        condition: or
        part: response

      - type: regex
        name: aliyundun
        cpe: cpe:2.3:a:aliyundun:aliyundun:*:*:*:*:*:*:*:*
        regex:
          - '(?i)error(s)?.aliyun(dun)?.(com|net)'
          - '(?i)http(s)?://(www.)?aliyun.(com|net)'
        condition: or
        part: response

      - type: regex
        name: malcare
        cpe: cpe:2.3:a:malcare:malcare:*:*:*:*:*:*:*:*
        regex:
          - '(?i)malcare'
          - '(?i).>login.protection<.+.><.+>powered.by<.+.>(<.+.>)?(.?malcare.-.pro|blogvault)?'
          - '(?i).>firewall<.+.><.+>powered.by<.+.>(<.+.>)?(.?malcare.-.pro|blogvault)?'
        condition: or
        part: response

      - type: regex
        name: wts
        cpe: cpe:2.3:a:wts:wts:*:*:*:*:*:*:*:*
        regex:
          - '(?i)(<title>)?wts.wa(f)?(\w+(\w+(\w+)?)?)?'
        part: response

      - type: regex
        name: dw
        cpe: cpe:2.3:a:dw:dw:*:*:*:*:*:*:*:*
        regex:
          - '(?i)dw.inj.check'
        part: response

      - type: regex
        name: denyall
        cpe: cpe:2.3:a:denyall:denyall:*:*:*:*:*:*:*:*
        regex:
          - '(?i)\Acondition.intercepted'
          - '(?i)\Asessioncookie='
        condition: or
        part: response

      - type: regex
        name: yunsuo
        cpe: cpe:2.3:a:yunsuo:yunsuo:*:*:*:*:*:*:*:*
        regex:
          - '(?i)<img.class=.yunsuologo.'
          - '(?i)yunsuo.session'
        condition: or
        part: response

      - type: regex
        name: litespeed
        cpe: cpe:2.3:a:litespeed:litespeed:*:*:*:*:*:*:*:*
        regex:
          - '(?i)litespeed.web.server'
        part: response

      - type: regex
        name: cloudfront
        cpe: cpe:2.3:a:cloudfront:cloudfront:*:*:*:*:*:*:*:*
        regex:
          - '(?i)[a-zA-Z0-9]{,60}.cloudfront.net'
          - '(?i)cloudfront'
          - '(?i)x.amz.cf.id|nguardx'
        condition: or
        part: response

      - type: regex
        name: anyu
        cpe: cpe:2.3:a:anyu:anyu:*:*:*:*:*:*:*:*
        regex:
          - '(?i)sorry.{1,2}your.access.has.been.intercept(ed)?.by.anyu'
          - '(?i)anyu'
          - '(?i)anyu-?.the.green.channel'
        condition: or
        part: response

      - type: regex
        name: googlewebservices
        cpe: cpe:2.3:a:googlewebservices:googlewebservices:*:*:*:*:*:*:*:*
        regex:
          - '(?i)your.client.has.issued.a.malformed.or.illegal.request'
          - '(?i)our.systems.have.detected.unusual.traffic'
          - '(?i)block(ed)?.by.g.cloud.security.policy.+'
        condition: or
        part: response

      - type: regex
        name: didiyun
        cpe: cpe:2.3:a:didiyun:didiyun:*:*:*:*:*:*:*:*
        regex:
          - '(?i)(http(s)?://)(sec-waf.|www.)?didi(static|yun)?.com(/static/cloudwafstatic)?'
          - '(?i)didiyun'
        condition: or
        part: response

      - type: regex
        name: blockdos
        cpe: cpe:2.3:a:blockdos:blockdos:*:*:*:*:*:*:*:*
        regex:
          - '(?i)blockdos\.net'
        part: response

      - type: regex
        name: codeigniter
        cpe: cpe:2.3:a:codeigniter:codeigniter:*:*:*:*:*:*:*:*
        regex:
          - '(?i)the.uri.you.submitted.has.disallowed.characters'
        part: response

      - type: regex
        name: stingray
        cpe: cpe:2.3:a:stingray:stingray:*:*:*:*:*:*:*:*
        regex:
          - '(?i)\AX-Mapping-'
        part: response

      - type: regex
        name: west263
        cpe: cpe:2.3:a:west263:west263:*:*:*:*:*:*:*:*
        regex:
          - '(?i)wt\d*cdn'
        part: response

      - type: regex
        name: aws
        cpe: cpe:2.3:a:aws:aws:*:*:*:*:*:*:*:*
        regex:
          - '(?i)<RequestId>[0-9a-zA-Z]{16,25}<.RequestId>'
          - '(?i)<Error><Code>AccessDenied<.Code>'
          - '(?i)x.amz.id.\d+'
          - '(?i)x.amz.request.id'
        condition: or
        part: response

      - type: regex
        name: yundun
        cpe: cpe:2.3:a:yundun:yundun:*:*:*:*:*:*:*:*
        regex:
          - '(?i)YUNDUN'
          - '(?i)^yd.cookie='
          - '(?i)http(s)?.//(www\.)?(\w+.)?yundun(.com)?'
          - '(?i)<title>.403.forbidden:.access.is.denied.{0,2}<.{0,2}title>'
        condition: or
        part: response

      - type: regex
        name: barracuda
        cpe: cpe:2.3:a:barracuda:barracuda:*:*:*:*:*:*:*:*
        regex:
          - '(?i)\Abarra.counter.session=?'
          - '(?i)(\A|\b)?barracuda.'
          - '(?i)barracuda.networks.{1,2}inc'
        condition: or
        part: response

      - type: regex
        name: dodenterpriseprotection
        cpe: cpe:2.3:a:dodenterpriseprotection:dodenterpriseprotection:*:*:*:*:*:*:*:*
        regex:
          - '(?i)dod.enterprise.level.protection.system'
        part: response

      - type: regex
        name: secupress
        cpe: cpe:2.3:a:secupress:secupress:*:*:*:*:*:*:*:*
        regex:
          - '(?i)<h\d*>secupress<.'
          - '(?i)block.id.{1,2}bad.url.contents.<.'
        condition: or
        part: response

      - type: regex
        name: aesecure
        cpe: cpe:2.3:a:aesecure:aesecure:*:*:*:*:*:*:*:*
        regex:
          - '(?i)aesecure.denied.png'
        part: response

      - type: regex
        name: incapsula
        cpe: cpe:2.3:a:incapsula:incapsula:*:*:*:*:*:*:*:*
        regex:
          - '(?i)incap_ses|visid_incap'
          - '(?i)incapsula'
          - '(?i)incapsula.incident.id'
        condition: or
        part: response

      - type: regex
        name: nexusguard
        cpe: cpe:2.3:a:nexusguard:nexusguard:*:*:*:*:*:*:*:*
        regex:
          - '(?i)nexus.?guard'
          - '(?i)((http(s)?://)?speresources.)?nexusguard.com.wafpage'
        condition: or
        part: response

      - type: regex
        name: cloudflare
        cpe: cpe:2.3:a:cloudflare:cloudflare:*:*:*:*:*:*:*:*
        regex:
          - '(?i)cloudflare.ray.id.|var.cloudflare.'
          - '(?i)cloudflare.nginx'
          - '(?i)..cfduid=([a-z0-9]{43})?'
          - '(?i)cf[-|_]ray(..)?([0-9a-f]{16})?[-|_]?(dfw|iad)?'
          - '(?i).>attention.required!.\|.cloudflare<.+'
          - '(?i)http(s)?.//report.(uri.)?cloudflare.com(/cdn.cgi(.beacon/expect.ct)?)?'
          - '(?i)ray.id'
          - '(?i)__cfduid'
        condition: or
        part: response

      - type: regex
        name: akamai
        cpe: cpe:2.3:a:akamai:akamai:*:*:*:*:*:*:*:*
        regex:
          - '(?i).>access.denied<.'
          - '(?i)akamaighost'
          - '(?i)ak.bmsc.'
        condition: or
        part: response

      - type: regex
        name: webseal
        cpe: cpe:2.3:a:webseal:webseal:*:*:*:*:*:*:*:*
        regex:
          - '(?i)webseal.error.message.template'
          - '(?i)webseal.server.received.an.invalid.http.request'
        condition: or
        part: response

      - type: regex
        name: dotdefender
        cpe: cpe:2.3:a:dotdefender:dotdefender:*:*:*:*:*:*:*:*
        regex:
          - '(?i)dotdefender.blocked.your.request'
        part: response

      - type: regex
        name: pk
        cpe: cpe:2.3:a:pk:pk:*:*:*:*:*:*:*:*
        regex:
          - '(?i).>pkSecurityModule\W..\WSecurity.Alert<.'
          - '(?i).http(s)?.//([w]{3})?.kitnetwork.\w'
          - '(?i).>A.safety.critical.request.was.discovered.and.blocked.<.'
        condition: or
        part: response

      - type: regex
        name: expressionengine
        cpe: cpe:2.3:a:expressionengine:expressionengine:*:*:*:*:*:*:*:*
        regex:
          - '(?i).>error.-.expressionengine<.'
          - '(?i).>:.the.uri.you.submitted.has.disallowed.characters.<.'
          - '(?i)invalid.(get|post).data'
        condition: or
        part: response

      - type: regex
        name: comodo
        cpe: cpe:2.3:a:comodo:comodo:*:*:*:*:*:*:*:*
        regex:
          - '(?i)protected.by.comodo.waf'
        part: response

      - type: regex
        name: ciscoacexml
        cpe: cpe:2.3:a:ciscoacexml:ciscoacexml:*:*:*:*:*:*:*:*
        regex:
          - '(?i)ace.xml.gateway'
        part: response

      - type: regex
        name: barikode
        cpe: cpe:2.3:a:barikode:barikode:*:*:*:*:*:*:*:*
        regex:
          - '(?i).>barikode<.'
          - '(?i)<h\d{1}>forbidden.access<.h\d{1}>'
        condition: or
        part: response

      - type: regex
        name: watchguard
        cpe: cpe:2.3:a:watchguard:watchguard:*:*:*:*:*:*:*:*
        regex:
          - '(?i)(request.denied.by.)?watchguard.firewall'
          - '(?i)watchguard(.technologies(.inc)?)?'
        condition: or
        part: response

      - type: regex
        name: binarysec
        cpe: cpe:2.3:a:binarysec:binarysec:*:*:*:*:*:*:*:*
        regex:
          - '(?i)x.binarysec.via'
          - '(?i)x.binarysec.nocache'
          - '(?i)binarysec'
        condition: or
        part: response

      - type: regex
        name: bekchy
        cpe: cpe:2.3:a:bekchy:bekchy:*:*:*:*:*:*:*:*
        regex:
          - '(?i)bekchy.(-.)?access.denied'
          - '(?i)(http(s)?://)(www.)?bekchy.com(/report)?'
        condition: or
        part: response

      - type: regex
        name: bitninja
        cpe: cpe:2.3:a:bitninja:bitninja:*:*:*:*:*:*:*:*
        regex:
          - '(?i)bitninja'
          - '(?i)security.check.by.bitninja'
          - '(?i).>visitor.anti(\S)?robot.validation<.'
        condition: or
        part: response

      - type: regex
        name: apachegeneric
        cpe: cpe:2.3:a:apachegeneric:apachegeneric:*:*:*:*:*:*:*:*
        regex:
          - '(?i)apache'
          - '(?i).>you.don.t.have.permission.to.access+'
          - '(?i)was.not.found.on.this.server'
          - '(?i)<address>apache/([\d+{1,2}](.[\d+]{1,2}(.[\d+]{1,3})?)?)?'
          - '(?i)<title>403 Forbidden</title>'
        condition: or
        part: response

      - type: regex
        name: greywizard
        cpe: cpe:2.3:a:greywizard:greywizard:*:*:*:*:*:*:*:*
        regex:
          - '(?i)greywizard(.\d.\d(.\d)?)?'
          - '(?i)grey.wizard.block'
          - '(?i)(http(s)?.//)?(\w+.)?greywizard.com'
          - '(?i)grey.wizard'
        condition: or
        part: response

      - type: regex
        name: configserver
        cpe: cpe:2.3:a:configserver:configserver:*:*:*:*:*:*:*:*
        regex:
          - '(?i).>the.firewall.on.this.server.is.blocking.your.connection.<+'
        part: response

      - type: regex
        name: viettel
        cpe: cpe:2.3:a:viettel:viettel:*:*:*:*:*:*:*:*
        regex:
          - '(?i)<title>access.denied(...)?viettel.waf</title>'
          - '(?i)viettel.waf.system'
          - '(?i)(http(s).//)?cloudrity.com(.vn)?'
        condition: or
        part: response

      - type: regex
        name: safedog
        cpe: cpe:2.3:a:safedog:safedog:*:*:*:*:*:*:*:*
        regex:
          - '(?i)(http(s)?)?(://)?(www|404|bbs|\w+)?.safedog.\w'
          - '(?i)waf(.?\d+.?\d+)'
        condition: or
        part: response

      - type: regex
        name: baidu
        cpe: cpe:2.3:a:baidu:baidu:*:*:*:*:*:*:*:*
        regex:
          - '(?i)yunjiasu.nginx'
        part: response

      - type: regex
        name: alertlogic
        cpe: cpe:2.3:a:alertlogic:alertlogic:*:*:*:*:*:*:*:*
        regex:
          - '(?i).>requested.url.cannot.be.found<.'
          - '(?i)proceed.to.homepage'
          - '(?i)back.to.previous.page'
          - "(?i)we('re|.are)?sorry.{1,2}but.the.page.you.are.looking.for.cannot"
          - '(?i)reference.id.?'
          - '(?i)page.has.either.been.removed.{1,2}renamed'
        condition: or
        part: response

      - type: regex
        name: armor
        cpe: cpe:2.3:a:armor:armor:*:*:*:*:*:*:*:*
        regex:
          - '(?i)blocked.by.website.protection.from.armour'
        part: response

      - type: regex
        name: dosarrest
        cpe: cpe:2.3:a:dosarrest:dosarrest:*:*:*:*:*:*:*:*
        regex:
          - '(?i)dosarrest'
          - '(?i)x.dis.request.id'
        condition: or
        part: response

      - type: regex
        name: paloalto
        cpe: cpe:2.3:a:paloalto:paloalto:*:*:*:*:*:*:*:*
        regex:
          - 'has.been.blocked.in.accordance.with.company.policy'
          - '.>Virus.Spyware.Download.Blocked<.'
        condition: or
        part: response

      - type: regex
        name: aspgeneric
        cpe: cpe:2.3:a:aspgeneric:aspgeneric:*:*:*:*:*:*:*:*
        regex:
          - '(?i)this.generic.403.error.means.that.the.authenticated'
          - '(?i)request.could.not.be.understood'
          - '(?i)<.+>a.potentially.dangerous.request(.querystring)?.+'
          - '(?i)runtime.error'
          - '(?i).>a.potentially.dangerous.request.path.value.was.detected.from.the.client+'
          - '(?i)asp.net.sessionid'
          - '(?i)errordocument.to.handle.the.request'
          - '(?i)an.application.error.occurred.on.the.server'
          - '(?i)error.log.record.number'
          - '(?i)error.page.might.contain.sensitive.information'
          - "(?i)<.+>server.error.in.'/'.application.+"
          - '(?i)\basp.net\b'
        condition: or
        part: response

      - type: regex
        name: powerful
        cpe: cpe:2.3:a:powerful:powerful:*:*:*:*:*:*:*:*
        regex:
          - '(?i)Powerful Firewall'
          - '(?i)http(s)?...tiny.cc.powerful.firewall'
        condition: or
        part: response

      - type: regex
        name: uewaf
        cpe: cpe:2.3:a:uewaf:uewaf:*:*:*:*:*:*:*:*
        regex:
          - '(?i)http(s)?.//ucloud'
          - '(?i)uewaf(.deny.pages)'
        condition: or
        part: response

      - type: regex
        name: janusec
        cpe: cpe:2.3:a:janusec:janusec:*:*:*:*:*:*:*:*
        regex:
          - '(?i)janusec'
          - '(?i)(http(s)?\W+(www.)?)?janusec.(com|net|org)'
        condition: or
        part: response

      - type: regex
        name: siteguard
        cpe: cpe:2.3:a:siteguard:siteguard:*:*:*:*:*:*:*:*
        regex:
          - '(?i)>Powered.by.SiteGuard.Lite<'
          - '(?i)refuse.to.browse'
        condition: or
        part: response

      - type: regex
        name: sonicwall
        cpe: cpe:2.3:a:sonicwall:sonicwall:*:*:*:*:*:*:*:*
        regex:
          - '(?i)This.request.is.blocked.by.the.SonicWALL'
          - '(?i)Dell.SonicWALL'
          - '(?i)Web.Site.Blocked.+\bnsa.banner'
          - '(?i)SonicWALL'
          - '(?i).>policy.this.site.is.blocked<.'
        condition: or
        part: response

      - type: regex
        name: jiasule
        cpe: cpe:2.3:a:jiasule:jiasule:*:*:*:*:*:*:*:*
        regex:
          - '(?i)^jsl(_)?tracking'
          - '(?i)(__)?jsluid(=)?'
          - '(?i)notice.jiasule'
          - '(?i)(static|www|dynamic).jiasule.(com|net)'
        condition: or
        part: response

      - type: regex
        name: nginxgeneric
        cpe: cpe:2.3:a:nginxgeneric:nginxgeneric:*:*:*:*:*:*:*:*
        regex:
          - '(?i)nginx'
          - '(?i)you.do(not|n.t)?.have.permission.to.access.this.document'
        condition: or
        part: response

      - type: regex
        name: stackpath
        cpe: cpe:2.3:a:stackpath:stackpath:*:*:*:*:*:*:*:*
        regex:
          - '(?i)action.that.triggered.the.service.and.blocked'
          - '(?i)<h2>sorry,.you.have.been.blocked.?<.h2>'
        condition: or
