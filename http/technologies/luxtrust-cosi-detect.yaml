id: luxtrust-cosi-detect

info:
  name: LuxTrust COSI - Detect
  author: righettod
  severity: info
  description: |
     LuxTrust COSI was detected.
  reference:
    - https://luxtrust.com/en/professionals/our-digital-solutions/sign-electronically
  classification:
    cpe: cpe:2.3:a:luxtrust:cosi:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    vendor: luxtrust
    product: cosi
  tags: panel,luxtrust,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/web/thanks"

    matchers:
      - type: dsl
        name: cosi
        cpe: cpe:2.3:a:luxtrust:cosi:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "plateforme de signature", "esign-web")'
        condition: and
