id: hugegraph-studio-detect

info:
  name: HugeGraph Studio - Detect
  author: pussycat0x
  severity: info
  description: |
    HugeGraph Studio was detected.
  reference:
    - https://github.com/hugegraph/hugegraph-studio
  classification:
    cpe: cpe:2.3:a:apache:hugegraph_studio:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="HugeGraph-Studio"
    vendor: apache
    product: hugegraph_studio
  tags: hugegraph,studio,detect,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: hugegraph_studio
        cpe: cpe:2.3:a:apache:hugegraph_studio:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>HugeGraph Studio"

      - type: status
        status:
          - 200
