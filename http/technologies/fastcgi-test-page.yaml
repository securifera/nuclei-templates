id: fastcgi-test-page

info:
  name: FastCGI Test Page
  author: DhiyaneshDk
  severity: info
  description: |
    FastCGI test page was discovered.
  classification:
    cpe: cpe:2.3:a:fastcgi:fastcgi:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    google-query: intitle:"FastCGI test page"
    vendor: fastcgi
    product: fastcgi
  tags: tech,fastcgi,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/test/fcgi/test.html"

    matchers-condition: and
    matchers:
      - type: word
        name: fastcgi
        cpe: cpe:2.3:a:fastcgi:fastcgi:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'FastCGI test page'
          - 'FastCGI possibilities test page'
        condition: and

      - type: status
        status:
          - 200
