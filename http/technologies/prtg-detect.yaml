id: prtg-detect

info:
  name: Detect PRTG
  author: geeknik
  severity: info
  description: Monitor all the systems, devices, traffic, and applications in your IT infrastructure -- https://www.paessler.com/prtg
  classification:
    cpe: cpe:2.3:a:paessler:prtg_network_monitor:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: paessler
    product: prtg_network_monitor
  tags: tech,prtg,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.htm"
      - "{{BaseURL}}/prtg/index.htm"
      - "{{BaseURL}}/PRTG/index.htm"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: prtg_network_monitor
        cpe: cpe:2.3:a:paessler:prtg_network_monitor:*:*:*:*:*:*:*:*
        part: body
        words:
          - "PRTG Network Monitor"

      - type: regex
        name: prtg_network_monitor-2
        cpe: cpe:2.3:a:paessler:prtg_network_monitor:*:*:*:*:*:*:*:*
        part: header
        regex:
          - PRTG

    extractors:
      - type: kval
        part: header
        kval:
          - Server
