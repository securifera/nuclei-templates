id: lexmark-detect

info:
  name: Lexmark Device Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:lexmark:lexmark:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: lexmark
    product: lexmark
  tags: tech,airtame,printer,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        name: lexmark
        cpe: cpe:2.3:a:lexmark:lexmark:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "<title>Lexmark (.*)</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "<title>Lexmark (.*)</title>"
