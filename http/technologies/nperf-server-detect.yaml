id: nperf-server-detect

info:
  name: nPerf Server - Detect
  author: rxerium
  severity: info
  description: |
    A nperf panel was detected.
  reference:
    - https://www.nperf.com
  classification:
    cpe: cpe:2.3:a:nperf:nperf_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"nPerf"
    vendor: nperf
    product: nperf_server
  tags: tech,nperf,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        name: nperf_server
        cpe: cpe:2.3:a:nperf:nperf_server:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>nPerfServer</title>"

      - type: word
        name: nperf_server-2
        cpe: cpe:2.3:a:nperf:nperf_server:*:*:*:*:*:*:*:*
        part: header
        words:
          - "Nperfserver-Remote-Endpoint"
          - "nPerf/"
        condition: or

    extractors:
      - type: kval
        part: header
        kval:
          - Server
