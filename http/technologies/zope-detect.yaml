id: zope-detect

info:
  name: Zope Quick Start Detect
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:zope:zope:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Zope QuickStart"
    vendor: zope
    product: zope
  tags: tech,zope,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        name: zope
        cpe: cpe:2.3:a:zope:zope:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Zope QuickStart</title>"

      - type: word
        name: zope-2
        cpe: cpe:2.3:a:zope:zope:*:*:*:*:*:*:*:*
        part: server
        words:
          - "Zope/"
