id: basic-auth-detect

info:
  name: Basic Auth Detection
  author: w4cky_,bhutch
  severity: info
  classification:
    cpe: cpe:2.3:a:ietf:http_basic_authentication:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: "www-authenticate:"
    vendor: ietf
    product: http_basic_authentication
  tags: tech,basic,auth,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        name: http_basic_authentication
        cpe: cpe:2.3:a:ietf:http_basic_authentication:*:*:*:*:*:*:*:*
        part: header
        regex:
          - "(?i)www-authenticate: basic"

      - type: status
        status:
          - 401

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)www-authenticate: (basic.*)\r\n'
