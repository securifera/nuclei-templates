id: airtame-device-detect

info:
  name: Airtame Device Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:airtame:airtame:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: airtame
    product: airtame
  tags: tech,airtame,iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: airtame
        cpe: cpe:2.3:a:airtame:airtame:*:*:*:*:*:*:*:*
        part: body
        words:
          - "To access the settings of your Airtame"
          - "https://airtame.com/download"
        condition: and

      - type: status
        status:
          - 200
