id: wso2-products-detect

info:
  name: WSO2 Products - Detect
  author: righettod
  severity: info
  description: Try to detect the presence of a WSO2 products instance via the version endpoint
  classification:
    cpe: cpe:2.3:a:wso2:wso2:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wso2
    product: wso2
  tags: tech,wso2,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/services/Version"

    matchers-condition: and
    matchers:
      - type: word
        name: wso2
        cpe: cpe:2.3:a:wso2:wso2:*:*:*:*:*:*:*:*
        words:
          - "version.services.core.carbon.wso2.org"

      - type: status
        status:
          - 200
