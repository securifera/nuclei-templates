id: webswing-api-version-detect

info:
  name: WebSwing REST API Version - Detection
  author: aushack
  severity: info
  description: |
    WebSwing REST API version via the /rest/version endpoint.
  classification:
    cpe: cpe:2.3:a:webswing:webswing:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: 'Server: webswing.org'
    vendor: webswing
    product: webswing
  tags: webswing,rest,api,version,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/rest/version"

    matchers-condition: and
    matchers:
      - type: word
        name: webswing
        cpe: cpe:2.3:a:webswing:webswing:*:*:*:*:*:*:*:*
        part: server
        words:
          - "webswing.org"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - '^(\d+(?:\.\d+)*)$'
        group: 1
