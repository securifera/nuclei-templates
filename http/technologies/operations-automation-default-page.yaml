id: operations-automation-default-page

info:
  name: Operations Automation Default Page
  author: dhiyaneshDK
  severity: info
  classification:
    cpe: cpe:2.3:a:parallels:operations_automation:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Operations Automation Default Page"
    vendor: parallels
    product: operations_automation
  tags: tech,default,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: operations_automation
        cpe: cpe:2.3:a:parallels:operations_automation:*:*:*:*:*:*:*:*
        words:
          - '<title>Operations Automation Default Page</title>'

      - type: status
        status:
          - 200
