id: octobercms-detect

info:
  name: OctoberCMS detect
  author: cyllective
  severity: info
  description: Detects OctoberCMS
  reference:
    - https://github.com/octobercms/october
  classification:
    cpe: cpe:2.3:a:octobercms:october:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: octobercms
    product: october
  tags: tech,octobercms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/modules/system/assets/js/framework.combined-min.js"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 1
    matchers:
      - type: word
        name: october
        cpe: cpe:2.3:a:octobercms:october:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'october_session'

      - type: word
        name: october-2
        cpe: cpe:2.3:a:octobercms:october:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'OctoberCMS'
