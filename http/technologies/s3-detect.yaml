id: s3-detect

info:
  name: Detect Amazon-S3 Bucket
  author: melbadry9
  severity: info
  classification:
    cpe: cpe:2.3:a:amazon:s3:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: amazon
    product: s3
  tags: aws,s3,bucket,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/%c0"

    matchers-condition: or
    matchers:
      - type: regex
        name: s3
        cpe: cpe:2.3:a:amazon:s3:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "(?:InvalidURI|InvalidArgument|NoSuchBucket)"

      - type: dsl
        name: s3-2
        cpe: cpe:2.3:a:amazon:s3:*:*:*:*:*:*:*:*
        dsl:
          - 'contains(to_lower(server), "amazons3")'
          - 'contains(to_lower(header), "x-amz-id")'
          - 'contains(to_lower(header), "x-amz-request-id")'
