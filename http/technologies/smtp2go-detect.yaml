id: smtp2go-detect

info:
  name: SMTP2GO Detect
  author: pikpikcu,righettod
  severity: info
  classification:
    cpe: cpe:2.3:a:smtp2go:smtp2go:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"smtp2go"
    vendor: smtp2go
    product: smtp2go
  tags: tech,smtp2go,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: smtp2go
        cpe: cpe:2.3:a:smtp2go:smtp2go:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>SMTP2GO</title>"
          - "2022 &copy; SMTP2GO."
          - "mailto:ticket@smtp2go.com"
          - 'href="https://www.smtp2go.com/"'
        condition: or

      - type: status
        status:
          - 200
