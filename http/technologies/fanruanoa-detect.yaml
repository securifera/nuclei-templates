id: fanruanoa-detect

info:
  name: FanRuanOA-detect
  author: YanYun
  severity: info
  classification:
    cpe: cpe:2.3:a:fanruan:fanruan_oa:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: fanruan
    product: fanruan_oa
  tags: oa,tech,dotnet,fanruan,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/WebReport/ReportServer"
      - "{{BaseURL}}/ReportServer"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: fanruan_oa
        cpe: cpe:2.3:a:fanruan:fanruan_oa:*:*:*:*:*:*:*:*
        words:
          - 'DeploySuccess._init'
