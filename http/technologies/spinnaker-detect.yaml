id: spinnaker-detect

info:
  name: Spinnaker Detect
  author: Adam Crosser
  severity: info
  description: Detects the Spinnaker continuous delivery software
  classification:
    cpe: cpe:2.3:a:spinnaker:spinnaker:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: spinnaker
    product: spinnaker
  tags: tech,spinnaker,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        name: spinnaker
        cpe: cpe:2.3:a:spinnaker:spinnaker:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<spinnaker ng-if="!authenticating"></spinnaker>'

      - type: dsl
        name: spinnaker-2
        cpe: cpe:2.3:a:spinnaker:spinnaker:*:*:*:*:*:*:*:*
        dsl:
          - "contains(tolower(header), 'x-spinnaker-priority')"
