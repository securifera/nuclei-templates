id: ansible-awx-detect

info:
  name: Ansible AWX Detection
  author: Adam Crosser
  severity: info
  description: Detects Ansible AWX Instance
  reference:
    - https://github.com/ansible/awx
  classification:
    cpe: cpe:2.3:a:ansible:awx:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:'Select a frequency for snapshot retention'
    vendor: ansible
    product: awx
  tags: tech,ansible,awx,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/"

    matchers-condition: and
    matchers:
      - type: word
        name: awx
        cpe: cpe:2.3:a:ansible:awx:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"description":"AWX REST API"'

      - type: status
        status:
          - 200
