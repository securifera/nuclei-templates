id: hubble-detect

info:
  name: Hubble - Detect
  author: righettod
  severity: info
  description: |
    Hubble products was detected.
  reference:
    - https://github.com/cilium/hubble
    - https://docs.cilium.io/en/stable/observability/hubble/
  classification:
    cpe: cpe:2.3:a:cilium:hubble:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Hubble UI"
    vendor: cilium
    product: hubble
  tags: tech,hubble,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    matchers:
      - type: dsl
        name: hubble
        cpe: cpe:2.3:a:cilium:hubble:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>hubble ui enterprise", "<title>hubble ui")'
        condition: and
