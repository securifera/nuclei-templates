id: azure-kubernetes-service

info:
  name: Detect Azure Kubernetes Service
  author: dhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:microsoft:azure_kubernetes_service:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: microsoft
    product: azure_kubernetes_service
  tags: tech,azure,k8s,kubernetes,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: azure_kubernetes_service
        cpe: cpe:2.3:a:microsoft:azure_kubernetes_service:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Welcome to Azure Kubernetes Service (AKS)</title>"

      - type: status
        status:
          - 200
