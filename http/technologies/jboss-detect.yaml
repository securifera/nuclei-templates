id: jboss-detect

info:
  name: JBoss detected
  author: daffainfo,idealphase
  severity: info
  classification:
    cpe: cpe:2.3:a:redhat:jboss_enterprise_application_platform:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: redhat
    product: jboss_enterprise_application_platform
  tags: tech,jboss,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: jboss_enterprise_application_platform
        cpe: cpe:2.3:a:redhat:jboss_enterprise_application_platform:*:*:*:*:*:*:*:*
        part: body
        words:
          - "JBoss EAP 7"

      - type: regex
        name: jboss_enterprise_application_platform-2
        cpe: cpe:2.3:a:redhat:jboss_enterprise_application_platform:*:*:*:*:*:*:*:*
        part: body
        regex:
          - '<title>Welcome to JBoss(.*)</title>'

    extractors:
      - type: regex
        group: 1
        part: body
        regex:
          - '<h1>Welcome to (.+)<\/h1>'
