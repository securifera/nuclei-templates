id: php-proxy-detect

info:
  name: PHP Proxy Detect
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:php-proxy:php-proxy:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: php-proxy
    product: php-proxy
  tags: tech,php,proxy,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/proxy"

    matchers-condition: and
    matchers:
      - type: word
        name: php-proxy
        cpe: cpe:2.3:a:php-proxy:php-proxy:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>PHP-Proxy</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<meta name="version" content="([0-9.]+)">'
