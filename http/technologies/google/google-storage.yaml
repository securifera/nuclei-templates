id: gstorage-detect

info:
  name: Google Bucket detection
  author: 0xTeles
  severity: info
  classification:
    cpe: cpe:2.3:a:google:cloud_storage:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: cloud_storage
  tags: tech,gstorage,google,bucket,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: cloud_storage
        cpe: cpe:2.3:a:google:cloud_storage:*:*:*:*:*:*:*:*
        part: header
        words:
          - "x-goog-metageneration"
          - "x-goog-generation"
        case-insensitive: true
