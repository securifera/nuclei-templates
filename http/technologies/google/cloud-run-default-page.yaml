id: cloud-run-default-page

info:
  name: Google Cloud Run Default Page
  author: dhiyaneshDK
  severity: info
  reference:
    - https://cloud.google.com/run/docs/overview/what-is-cloud-run
  classification:
    cpe: cpe:2.3:a:google:cloud_run:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Congratulations | Cloud Run"
    vendor: google
    product: cloud_run
  tags: tech,cloudrun,google,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: cloud_run
        cpe: cpe:2.3:a:google:cloud_run:*:*:*:*:*:*:*:*
        words:
          - 'Congratulations | Cloud Run'
          - 'alt="A group celebrating'
        condition: and

      - type: status
        status:
          - 200
