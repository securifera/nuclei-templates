id: firebase-detect

info:
  name: firebase detect
  author: organiccrap
  severity: low
  reference:
    - http://ghostlulz.com/google-exposed-firebase-database/
  classification:
    cpe: cpe:2.3:a:google:firebase:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: google
    product: firebase
  tags: tech,firebase,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/.settings/rules.json?auth=FIREBASE_SECRET"

    matchers:
      - type: word
        name: firebase
        cpe: cpe:2.3:a:google:firebase:*:*:*:*:*:*:*:*
        words:
          - "Could not parse auth token"
        part: body
