id: graylog-api-browser

info:
  name: Detect Graylog REST API
  author: PR3R00T
  severity: info
  classification:
    cpe: cpe:2.3:a:graylog:graylog:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: graylog
    product: graylog
  tags: tech,graylog,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/api-browser/"

    matchers-condition: and
    matchers:
      - type: word
        name: graylog
        cpe: cpe:2.3:a:graylog:graylog:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Graylog"
          - "REST API browser"
          - "swagger"
        condition: and

      - type: status
        status:
          - 200
