id: switch-protocol

info:
  name: Switching Protocol Detection
  author: pdteam
  severity: info
  classification:
    cpe: cpe:2.3:a:ietf:http:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: '"connection: upgrade"'
    vendor: ietf
    product: http
  tags: protocol,switching,tech,websocket,h2c,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        name: http
        cpe: cpe:2.3:a:ietf:http:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 101'
          - 'contains(to_lower(header), "switching protocols")'
          - 'contains(to_lower(header), "connection: upgrade")'
          - 'contains(to_lower(header), "upgrade:")'

    extractors:
      - type: dsl
        dsl:
          - upgrade
