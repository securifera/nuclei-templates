id: oracle-access-manager-detect

info:
  name: Oracle Access Manager Detect
  author: tess
  severity: info
  classification:
    cpe: cpe:2.3:a:oracle:access_manager:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: oracle
    product: access_manager
  tags: tech,oracle,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/oamfed/idp/soap'

    matchers-condition: and
    matchers:
      - type: word
        name: access_manager
        cpe: cpe:2.3:a:oracle:access_manager:*:*:*:*:*:*:*:*
        part: body
        words:
          - "processing the SOAP Request"

      - type: word
        name: access_manager-2
        cpe: cpe:2.3:a:oracle:access_manager:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/xml"

      - type: status
        status:
          - 200
