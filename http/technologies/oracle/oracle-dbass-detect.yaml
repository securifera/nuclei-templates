id: oracle-dbass-detect

info:
  name: Oracle DBaaS Monitor Detect
  author: pussycat0x
  severity: info
  classification:
    cpe: cpe:2.3:a:oracle:dbaas_monitor:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: oracle
    product: dbaas_monitor
  tags: oracle,tech,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/dbaas_monitor/login'

    matchers-condition: and
    matchers:
      - type: word
        name: dbaas_monitor
        cpe: cpe:2.3:a:oracle:dbaas_monitor:*:*:*:*:*:*:*:*
        words:
          - '<title>DBaaS Monitor</title>'

      - type: status
        status:
          - 200
