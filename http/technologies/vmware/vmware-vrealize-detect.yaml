id: vmware-vrealize

info:
  name: VMware vRealize
  author: milo2012
  severity: info
  description: Version of VMware vRealize Operations Manager
  classification:
    cpe: cpe:2.3:a:vmware:vrealize_operations_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: vmware
    product: vrealize_operations_manager
  tags: vmware,vrealize,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/login.action"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: vrealize_operations_manager
        cpe: cpe:2.3:a:vmware:vrealize_operations_manager:*:*:*:*:*:*:*:*
        words:
          - text/html
        part: header

      - type: word
        name: vrealize_operations_manager-2
        cpe: cpe:2.3:a:vmware:vrealize_operations_manager:*:*:*:*:*:*:*:*
        words:
          - '<title>vRealize Operations Manager</title>'
        part: body

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "SessionProvider.js\\?version=([0-9.]+)"
