id: vmware-site-recovery-manager

info:
  name: VMware Site Recovery Manager Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: VMware Site Recovery Manger panel was detected.
  classification:
    cpe: cpe:2.3:a:vmware:site_recovery_manager:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Welcome to VMware Site Recovery Manager"
    vendor: vmware
    product: site_recovery_manager
  tags: panel,vmware,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/configure/app/landing/welcome-srm-va.html"

    matchers-condition: and
    matchers:
      - type: word
        name: site_recovery_manager
        cpe: cpe:2.3:a:vmware:site_recovery_manager:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Welcome to VMware Site Recovery Manager</title>"

      - type: status
        status:
          - 200
