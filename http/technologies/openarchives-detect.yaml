id: openarchives-detect

info:
  name: openarchives - Detection
  author: ZeroChill
  severity: info
  description: |
    Detects Open Archives Initiative instance
  reference:
    - https://www.openarchives.org/
  classification:
    cpe: cpe:2.3:a:openarchives:oai-pmh:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    shodan-query: http.html:"</OAI-PMH"
    vendor: openarchives
    product: oai-pmh
  tags: tech,openarchive,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: oai-pmh
        cpe: cpe:2.3:a:openarchives:oai-pmh:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'OAI-PMH'
          - 'www.openarchives.org'
          - '</OAI-PMH'
        condition: and

      - type: status
        status:
          - 200
