id: winrm-detect

info:
  name: Windows Remote Management - Detection
  author: pussycat0x
  severity: info
  description: |
    Detects Windows Remote Management (WinRM) by checking HTTP response headers on ports 5985 (HTTP) and 5986 (HTTPS).
  classification:
    cpe: cpe:2.3:a:microsoft:windows_remote_management:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    shodan-query: product:"WinRM"
    vendor: microsoft
    product: windows_remote_management
  tags: network,winrm,windows,discovery

http:
  - method: POST
    path:
      - "{{BaseURL}}/wsman"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 401

      - type: regex
        name: windows_remote_management
        cpe: cpe:2.3:a:microsoft:windows_remote_management:*:*:*:*:*:*:*:*
        part: header
        regex:
          - 'Microsoft-HTTPAPI\/[0-9\.]+'

      - type: word
        name: windows_remote_management-2
        cpe: cpe:2.3:a:microsoft:windows_remote_management:*:*:*:*:*:*:*:*
        part: header
        words:
          - "Www-Authenticate: NTLM"
          - "Www-Authenticate: Negotiate"
        condition: or
