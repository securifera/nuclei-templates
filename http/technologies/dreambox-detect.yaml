id: dreambox-detect

info:
  name: DreamBox Detect
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:dreambox:webcontrol:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: dreambox
    product: webcontrol
  tags: dreambox,tech,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: webcontrol
        cpe: cpe:2.3:a:dreambox:webcontrol:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Dreambox WebControl</title>'
