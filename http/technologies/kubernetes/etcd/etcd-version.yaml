id: etcd-version

info:
  name: Etcd Version - Detect
  author: pussycat0x
  severity: info
  description: Template detects Etcd version.
  reference:
    - https://etcd.io/
  classification:
    cpe: cpe:2.3:a:etcd:etcd:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"etcd"
    vendor: etcd
    product: etcd
  tags: tech,k8s,kubernetes,devops,etcd,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/version"

    matchers-condition: and
    matchers:
      - type: word
        name: etcd
        cpe: cpe:2.3:a:etcd:etcd:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"etcdserver"'
          - '"etcdcluster"'
        condition: and

      - type: word
        name: etcd-2
        cpe: cpe:2.3:a:etcd:etcd:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200

    extractors:
      - type: dsl
        dsl:
          - 'trim(body,"{}")'
