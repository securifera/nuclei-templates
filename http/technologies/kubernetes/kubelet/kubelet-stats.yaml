id: kubelet-stats

info:
  name: Kubelet Stats
  author: sharath
  severity: info
  description: Scans for kubelet stats
  classification:
    cpe: cpe:2.3:a:kubernetes:kubelet:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kubernetes
    product: kubelet
  tags: tech,k8s,kubernetes,devops,kubelet,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/stats/summary"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: kubelet
        cpe: cpe:2.3:a:kubernetes:kubelet:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"node":'
          - '"nodeName":'
        condition: and
