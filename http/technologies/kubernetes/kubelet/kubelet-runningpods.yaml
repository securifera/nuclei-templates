id: kubelet-scan

info:
  name: Kubelet Running Pods
  author: sharath
  severity: info
  description: Scans for kubelet running pods
  classification:
    cpe: cpe:2.3:a:kubernetes:kubelet:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kubernetes
    product: kubelet
  tags: tech,k8s,kubernetes,devops,kubelet,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/runningpods/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: kubelet
        cpe: cpe:2.3:a:kubernetes:kubelet:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"PodList":'
          - '"items":'
        condition: and
