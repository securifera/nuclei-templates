id: kubelet-healthz

info:
  name: Kubelet Healthz
  author: sharath
  severity: info
  description: Scans for kubelet healthz
  classification:
    cpe: cpe:2.3:a:kubernetes:kubelet:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kubernetes
    product: kubelet
  tags: tech,k8s,kubernetes,devops,kubelet,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/healthz"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        name: kubelet
        cpe: cpe:2.3:a:kubernetes:kubelet:*:*:*:*:*:*:*:*
        part: header
        regex:
          - "text/plain"

      - type: word
        name: kubelet-2
        cpe: cpe:2.3:a:kubernetes:kubelet:*:*:*:*:*:*:*:*
        part: body
        words:
          - "ok"

      - type: word
        name: kubelet-3
        cpe: cpe:2.3:a:kubernetes:kubelet:*:*:*:*:*:*:*:*
        part: header
        words:
          - "Kubernetes"
