id: kube-api-secrets

info:
  name: Kube API Secrets
  author: sharath
  severity: info
  description: Scans for kube secrets endpoint
  classification:
    cpe: cpe:2.3:a:kubernetes:kubernetes:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kubernetes
    product: kubernetes
  tags: tech,k8s,kubernetes,devops,kube,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/namespaces/default/secrets"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: kubernetes
        cpe: cpe:2.3:a:kubernetes:kubernetes:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"SecretList":'
          - '"items":'
        condition: and
