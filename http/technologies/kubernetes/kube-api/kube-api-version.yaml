id: kube-api-version

info:
  name: Kube API Version
  author: sharath,raesene
  severity: info
  description: Searches for exposed Kubernetes API servers which return version information unauthenticated
  classification:
    cpe: cpe:2.3:a:kubernetes:kubernetes:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kubernetes
    product: kubernetes
  tags: tech,k8s,kubernetes,devops,kube,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/version"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: kubernetes
        cpe: cpe:2.3:a:kubernetes:kubernetes:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"major":'
          - '"minor":'
          - '"goVersion":'
        condition: and

    extractors:
      - type: json
        json:
          - ".gitVersion"
