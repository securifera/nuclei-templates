id: intercom

info:
  name: Intercom widget detection
  author: tess
  severity: info
  reference:
    - https://www.intercom.com
  classification:
    cpe: cpe:2.3:a:intercom:intercom:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: intercom
    product: intercom
  tags: intercom,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers:
      - type: word
        name: intercom
        cpe: cpe:2.3:a:intercom:intercom:*:*:*:*:*:*:*:*
        words:
          - 'intercom'
