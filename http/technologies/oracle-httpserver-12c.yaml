id: oracle-httpserver12c

info:
  name: Oracle HTTPServer12c
  author: tess,dhiyaneshDK
  severity: info
  classification:
    cpe: cpe:2.3:a:oracle:http_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Oracle HTTP Server"
    vendor: oracle
    product: http_server
  tags: tech,oracle,httpserver,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: http_server
        cpe: cpe:2.3:a:oracle:http_server:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Oracle HTTP Server 12c</title>'

      - type: word
        name: http_server-2
        cpe: cpe:2.3:a:oracle:http_server:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
