id: owasp-juice-shop-detect

info:
  name: OWASP Juice Shop
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:owasp:juice_shop:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: title="OWASP Juice Shop"
    vendor: owasp
    product: juice_shop
  tags: tech,owasp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: juice_shop
        cpe: cpe:2.3:a:owasp:juice_shop:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>OWASP Juice Shop</title>"

      - type: status
        status:
          - 200
