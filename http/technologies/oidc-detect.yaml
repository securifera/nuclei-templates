id: oidc-detect

info:
  name: Detect OpenID Connect provider
  author: jarijaas
  severity: info
  description: Detects OpenID Connect providers. See https://en.wikipedia.org/wiki/OpenID_Connect
  classification:
    cpe: cpe:2.3:a:openid:openid_connect:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: openid
    product: openid_connect
  tags: tech,oidc,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/openid-configuration"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: openid_connect
        cpe: cpe:2.3:a:openid:openid_connect:*:*:*:*:*:*:*:*
        words:
          - issuer
          - authorization_endpoint
        condition: and
