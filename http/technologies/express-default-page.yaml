id: express-default-page

info:
  name: Express Default Page
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:expressjs:express:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Welcome to Express"
    vendor: expressjs
    product: express
  tags: tech,express,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: express
        cpe: cpe:2.3:a:expressjs:express:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Express</title>"
          - "Welcome to Express"
        condition: and

      - type: word
        name: express-2
        cpe: cpe:2.3:a:expressjs:express:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
