id: tor-socks-proxy

info:
  name: Detect tor SOCKS proxy
  author: geeknik
  severity: info
  classification:
    cpe: cpe:2.3:a:torproject:tor:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: torproject
    product: tor
  tags: tech,tor,proxy,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: tor
        cpe: cpe:2.3:a:torproject:tor:*:*:*:*:*:*:*:*
        words:
          - "This is a SOCKS Proxy"
          - "HTTPTunnelPort"
          - "SOCKSPort"
        condition: and

      - type: status
        status:
          - 501
