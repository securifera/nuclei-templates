id: lobechat-detect

info:
  name: LobeChat - Detect
  author: s4e-io
  severity: info
  description: |
    An instance running LobeChat was detected.
  reference:
    - https://github.com/lobehub/lobe-chat
  classification:
    cpe: cpe:2.3:a:lobehub:lobe_chat:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="1975020705"
    vendor: lobehub
    product: lobe_chat
  tags: lobechat,tech,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/welcome"

    host-redirects: true
    matchers:
      - type: dsl
        name: lobe_chat
        cpe: cpe:2.3:a:lobehub:lobe_chat:*:*:*:*:*:*:*:*
        dsl:
          - 'contains(body, "Welcome to LobeChat")'
          - 'status_code == 200'
        condition: and
