id: mojoportal-detect

info:
  name: Mojoportal - Detect
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:mojoportal:mojoportal:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: mojoportal
    product: mojoportal
  tags: tech,mojoportal,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        name: mojoportal
        cpe: cpe:2.3:a:mojoportal:mojoportal:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "Powered by mojoPortal"
          - "title=['\"]mojoPortal"
          - "alt=['\"]mojoPortal"
        condition: or

      - type: status
        status:
          - 200
