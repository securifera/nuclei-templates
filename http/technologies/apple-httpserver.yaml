id: apple-httpserver

info:
  name: Apple HttpServer Detect
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:apple:httpserver:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "AppleHttpServer"
    fofa-query: app="Apple-HttpServer"
    vendor: apple
    product: httpserver
  tags: tech,apple,httpserver,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: httpserver
        cpe: cpe:2.3:a:apple:httpserver:*:*:*:*:*:*:*:*
        part: header
        words:
          - "X-Apple-Jingle-Correlation-Key"
          - "AppleHttpServer"
          - "X-Apple-Request-UUID"
        condition: or
