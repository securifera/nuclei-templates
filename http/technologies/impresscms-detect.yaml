id: impresscms-detect

info:
  name: ImpressCMS Detect
  author: princechaddha
  severity: info
  reference:
    - https://github.com/ImpressCMS
  classification:
    cpe: cpe:2.3:a:impresscms:impresscms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: impresscms
    product: impresscms
  tags: tech,impresscms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        name: impresscms
        cpe: cpe:2.3:a:impresscms:impresscms:*:*:*:*:*:*:*:*
        regex:
          - '(?i)(ImpressCMS)'

      - type: status
        status:
          - 200
