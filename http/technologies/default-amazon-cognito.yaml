id: default-amazon-cognito

info:
  name: Amazon Cognito Developer Authentication Sample - Detect
  author: pussycat0x
  severity: info
  reference:
    - https://docs.aws.amazon.com/cognito/latest/developerguide/developer-authenticated-identities.html
  classification:
    cpe: cpe:2.3:a:amazon:cognito:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Amazon Cognito Developer Authentication Sample"
    vendor: amazon
    product: cognito
  tags: aws,cognito,default,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        name: cognito
        cpe: cpe:2.3:a:amazon:cognito:*:*:*:*:*:*:*:*
        dsl:
          - 'contains(body, "Amazon Cognito Developer Authentication Sample") && contains(body, "Congratulations!")'
          - 'status_code == 200'
        condition: and
