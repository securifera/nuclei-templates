id: secui-waf-detect

info:
  name: SECUI WAF Panel - Detect
  author: gy741
  severity: info
  description: SECUI WAF panel was detected.
  reference:
    - https://www.secui.com/en/network/bluemaxng
  classification:
    cpe: cpe:2.3:a:secui:bluemax_ng:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-1101206929
    vendor: secui
    product: bluemax_ng
  tags: tech,panel,secui,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/static/login/favicon.ico"

    matchers:
      - type: dsl
        name: bluemax_ng
        cpe: cpe:2.3:a:secui:bluemax_ng:*:*:*:*:*:*:*:*
        dsl:
          - "status_code==200 && (\"-1101206929\" == mmh3(base64_py(body)))"
