id: eyesofnetwork-detect

info:
  name: EyesOfNetwork Detect
  author: praetorian-thendrickson
  severity: info
  description: EyesOfNetwork detection
  reference:
    - https://www.eyesofnetwork.com/en
  classification:
    cpe: cpe:2.3:a:eyesofnetwork:eyesofnetwork:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: eyesofnetwork
    product: eyesofnetwork
  tags: tech,cisa,eyesofnetwork,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php"

    matchers-condition: and
    matchers:
      - type: word
        name: eyesofnetwork
        cpe: cpe:2.3:a:eyesofnetwork:eyesofnetwork:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>EyesOfNetwork</title>"

      - type: status
        status:
          - 200
