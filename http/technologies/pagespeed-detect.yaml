id: pagespeed-detect

info:
  name: Pagespeed Detection
  author: geeknik
  severity: info
  classification:
    cpe: cpe:2.3:a:google:pagespeed_module:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "X-Mod-Pagespeed:"
    vendor: google
    product: pagespeed_module
  tags: tech,pagespeed,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: pagespeed_module
        cpe: cpe:2.3:a:google:pagespeed_module:*:*:*:*:*:*:*:*
        part: header
        words:
          - "X-Mod-Pagespeed:"
