id: uni-gui-framework

info:
  name: UniGUI Framework - Detect
  author: serrapa
  severity: info
  description: |
    Checks for the presence of UniGUI framework and extracts its version along with the Sencha Ext JS version.
  classification:
    cpe: cpe:2.3:a:fmsoft:unigui:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"UniGUI"
    vendor: fmsoft
    product: unigui
  tags: tech,unigui,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        name: unigui
        cpe: cpe:2.3:a:fmsoft:unigui:*:*:*:*:*:*:*:*
        part: body
        words:
          - "uni-xtheme-"
          - "ext-all.js"
          - "uniVars._extVer="
        condition: or

      - type: regex
        name: unigui-2
        cpe: cpe:2.3:a:fmsoft:unigui:*:*:*:*:*:*:*:*
        part: body
        regex:
          - 'uni-(\d+\.\d+\.\d+\.\d+)/'
          - 'uniVars._extVer="(\d+\.\d+\.\d+)"'

    extractors:
      - type: regex
        part: body
        name: uni_gui_version
        regex:
          - 'uni-(\d+\.\d+\.\d+\.\d+)'

      - type: regex
        part: body
        name: ext_js_version
        regex:
          - 'uniVars._extVer="(\d+\.\d+\.\d+)"'
