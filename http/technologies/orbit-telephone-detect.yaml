id: orbit-telephone-detect

info:
  name: Orbit Telephone System - Detect
  author: HeeresS
  severity: info
  description: |
    Orbit Telephone System was detected.
  reference:
    - https://kb.orbitgt.com/214/technology/platforms/index
  classification:
    cpe: cpe:2.3:a:orbitgt:orbit_telephone_system:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Orbit Telephone System"
    fofa-query: body="Orbit Telephone System"
    vendor: orbitgt
    product: orbit_telephone_system
  tags: tech,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/index.html'

    matchers-condition: and
    matchers:
      - type: word
        name: orbit_telephone_system
        cpe: cpe:2.3:a:orbitgt:orbit_telephone_system:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Orbit Telephone System: Administration</title>'

      - type: status
        status:
          - 200
