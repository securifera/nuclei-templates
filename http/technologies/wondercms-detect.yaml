id: wondercms-detect

info:
  name: WonderCMS Detect
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:wondercms:wondercms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wondercms
    product: wondercms
  tags: tech,wondercms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: wondercms
        cpe: cpe:2.3:a:wondercms:wondercms:*:*:*:*:*:*:*:*
        part: header
        words:
          - "Set-Cookie: wondercms_"

      - type: word
        name: wondercms-2
        cpe: cpe:2.3:a:wondercms:wondercms:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Powered by WonderCMS"
          - "https://www.wondercms.com"
        condition: and
