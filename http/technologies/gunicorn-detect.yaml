id: gunicorn-detect

info:
  name: Detect Gunicorn Server
  author: joanbono
  severity: info
  description: Gunicorn Python WSGI HTTP Server for UNIX
  reference:
    - https://github.com/benoitc/gunicorn
  classification:
    cpe: cpe:2.3:a:gunicorn:gunicorn:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: gunicorn
    product: gunicorn
  tags: tech,gunicorn,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        name: gunicorn
        cpe: cpe:2.3:a:gunicorn:gunicorn:*:*:*:*:*:*:*:*
        part: header
        regex:
          - gunicorn+

    extractors:
      - type: kval
        part: header
        kval:
          - Server
