id: kingsoft-webserver-detect

info:
  name: Kingsoft Web Server Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:kingsoft:web_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kingsoft
    product: web_server
  tags: tech,kingsoft,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: web_server
        cpe: cpe:2.3:a:kingsoft:web_server:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Welcome to Kingsoft Web Server!</title>"

      - type: status
        status:
          - 200
