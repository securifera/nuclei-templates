id: bigip-config-utility

info:
  name: BIG-IP Configuration Utility detected
  author: dwisiswant0
  severity: info
  classification:
    cpe: cpe:2.3:a:f5:big-ip:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: f5
    product: big-ip
  tags: tech,bigip,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/tmui/login.jsp"
      - "{{BaseURL}}/tmui/tmui/login/welcome.jsp"

    matchers:
      - type: word
        name: big-ip
        cpe: cpe:2.3:a:f5:big-ip:*:*:*:*:*:*:*:*
        words:
          - "Welcome to the BIG-IP"
          - "Configuration Utility"
        condition: and
        part: body

  - method: GET
    path:
      - "{{BaseURL}}/mgmt/tm/sys/management-ip"

    matchers:
      - type: word
        name: big-ip-2
        cpe: cpe:2.3:a:f5:big-ip:*:*:*:*:*:*:*:*
        words:
          - "Www-Authenticate: Basic realm"
          - "Enterprise Manager"
        condition: and
        part: header

      - type: word
        name: big-ip-3
        cpe: cpe:2.3:a:f5:big-ip:*:*:*:*:*:*:*:*
        words:
          - "check your user-id and password and try again"
        part: body
