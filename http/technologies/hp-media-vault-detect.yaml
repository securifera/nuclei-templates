id: hp-media-vault-detect

info:
  name: HP Media Vault Detect
  author: pussycat0x
  severity: info
  classification:
    cpe: cpe:2.3:a:hp:media_vault:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: 'app="HP-Media-Vault-Media-Server"'
    vendor: hp
    product: media_vault
  tags: tech,hp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: media_vault
        cpe: cpe:2.3:a:hp:media_vault:*:*:*:*:*:*:*:*
        words:
          - "<title>HP Media Vault"
        part: body

      - type: status
        status:
          - 200
