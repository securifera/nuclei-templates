id: froxlor-detect

info:
  name: Froxlor Detect
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:froxlor:froxlor:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: froxlor
    product: froxlor
  tags: tech,froxlor,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: froxlor
        cpe: cpe:2.3:a:froxlor:froxlor:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>Froxlor Server Management Panel</title>"

      - type: status
        status:
          - 200
