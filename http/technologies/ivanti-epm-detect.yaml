id: ivanti-epm-detect

info:
  name: Ivanti Endpoint Manager (EPM) - Detect
  author: rxerium
  severity: info
  description: |
    An Ivanti Endpoint Manager was detected.
  reference:
    - https://www.ivanti.com/en-gb/products/endpoint-manager
  classification:
    cpe: cpe:2.3:a:ivanti:endpoint_manager:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:362091310
    vendor: ivanti
    product: endpoint_manager
  tags: detect,ivanti,emm,tech,mobileiron,epm,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/images/favicon.ico"

    stop-at-first-match: true
    matchers:
      - type: dsl
        name: endpoint_manager
        cpe: cpe:2.3:a:ivanti:endpoint_manager:*:*:*:*:*:*:*:*
        dsl:
          - "status_code==200 && (\"362091310\" == mmh3(base64_py(body)))"
