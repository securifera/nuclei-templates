id: zerof-webserver-detect

info:
  name: ZEROF Web Server Detect
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:zerof:zerof_web_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: zerof
    product: zerof_web_server
  tags: tech,zerof,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: zerof_web_server
        cpe: cpe:2.3:a:zerof:zerof_web_server:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<title>ZEROF Web Server</title>"

      - type: status
        status:
          - 200
