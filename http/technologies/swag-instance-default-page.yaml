id: swag-instance-default-page

info:
  name: Swag Instance Default Page Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: Swag Instance Default Page panel was detected.
  classification:
    cpe: cpe:2.3:a:linuxserver:swag:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Welcome to your SWAG instance"
    vendor: linuxserver
    product: swag
  tags: panel,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: swag
        cpe: cpe:2.3:a:linuxserver:swag:*:*:*:*:*:*:*:*
        words:
          - "<title>Welcome to your SWAG instance</title>"

      - type: word
        name: swag-2
        cpe: cpe:2.3:a:linuxserver:swag:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
