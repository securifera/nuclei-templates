id: twenty-detect

info:
  name: Twenty - Detect
  author: righettod
  severity: info
  description: |
    Twenty products was detected.
  reference:
    - https://github.com/twentyhq/twenty
    - https://twenty.com/
  classification:
    cpe: cpe:2.3:a:twenty:twenty:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Twenty"
    vendor: twenty
    product: twenty
  tags: tech,twenty,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/welcome"

    matchers:
      - type: dsl
        name: twenty
        cpe: cpe:2.3:a:twenty:twenty:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "<title>twenty</title>", "open-source crm")'
        condition: and
