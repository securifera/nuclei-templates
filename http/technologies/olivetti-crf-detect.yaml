id: olivetti-crf-detect

info:
  name: Olivetti CRF Detect
  author: pussycat0x
  severity: info
  classification:
    cpe: cpe:2.3:a:olivetti:crf:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Olivetti CRF"
    vendor: olivetti
    product: crf
  tags: tech,olivetti,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: crf
        cpe: cpe:2.3:a:olivetti:crf:*:*:*:*:*:*:*:*
        words:
          - "<TITLE>Olivetti CRF</TITLE>"
        part: body

      - type: status
        status:
          - 200
