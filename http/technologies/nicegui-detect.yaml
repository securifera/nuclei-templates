id: nicegui-detect

info:
  name: NiceGUI Detection
  author: theamanrawat
  severity: info
  description: |
    An instance running NiceGUI is detected by looking for specific HTTP headers.
  classification:
    cpe: cpe:2.3:a:nicegui:nicegui:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: "x-nicegui-content"
    vendor: nicegui
    product: nicegui
  tags: nicegui,detect,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: nicegui
        cpe: cpe:2.3:a:nicegui:nicegui:*:*:*:*:*:*:*:*
        part: header
        words:
          - "x-nicegui-content"
        case-insensitive: true

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '/_nicegui/([0-9.]+)/'
