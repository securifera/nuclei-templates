id: woodpecker-detect

info:
  name: Woodpecker - Detect
  author: righettod
  severity: info
  description: |
    Woodpecker was detected — a lightweight, powerful CI/CD engine with great extensibility.
  reference:
    - https://github.com/woodpecker-ci/woodpecker
    - https://woodpecker-ci.org/
  classification:
    cpe: cpe:2.3:a:woodpecker-ci:woodpecker:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    shodan-query: http.title:"woodpecker"
    max-request: 1
    vendor: woodpecker-ci
    product: woodpecker
  tags: tech,woodpecker,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/web-config.js"

    matchers:
      - type: dsl
        name: woodpecker
        cpe: cpe:2.3:a:woodpecker-ci:woodpecker:*:*:*:*:*:*:*:*
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "window.woodpecker_")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)window.WOODPECKER_VERSION\s*=\s*"([0-9.]+)"'
