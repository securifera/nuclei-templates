id: abyss-web-server

info:
  name: Detect Abyss Web Server
  author: pussycat0x
  severity: info
  classification:
    cpe: cpe:2.3:a:aprelium:abyss_web_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: app="Abyss-Web-Server"
    vendor: aprelium
    product: abyss_web_server
  tags: tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: abyss_web_server
        cpe: cpe:2.3:a:aprelium:abyss_web_server:*:*:*:*:*:*:*:*
        part: body
        words:
          - "Welcome to Abyss Web Server"

      - type: status
        status:
          - 200
