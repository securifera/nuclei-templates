id: amazon-ec2-detect

info:
  name: Amazon EC2 Server Detect
  author: ritikchaddha
  severity: info
  classification:
    cpe: cpe:2.3:a:amazon:ec2:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Server: EC2ws"
    vendor: amazon
    product: ec2
  tags: tech,aws,ec2,amazon,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: ec2
        cpe: cpe:2.3:a:amazon:ec2:*:*:*:*:*:*:*:*
        part: header
        words:
          - "Server: EC2ws"
