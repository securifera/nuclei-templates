id: default-page-azure-container

info:
  name: Azure Container Instance Default Page
  author: DhiyaneshDK
  severity: info
  classification:
    cpe: cpe:2.3:a:microsoft:azure_container_instances:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Welcome to Azure Container Instances!"
    vendor: microsoft
    product: azure_container_instances
  tags: tech,azure,cloud,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: azure_container_instances
        cpe: cpe:2.3:a:microsoft:azure_container_instances:*:*:*:*:*:*:*:*
        words:
          - '<title>Welcome to Azure Container Instances!</title>'

      - type: status
        status:
          - 200
