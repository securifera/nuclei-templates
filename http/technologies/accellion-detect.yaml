id: accellion-detect

info:
  name: Accellion - Detect
  author: rxerium
  severity: info
  description: |
    Dectection of Accellion File Transfer Appliance.
  classification:
    cpe: cpe:2.3:a:accellion:file_transfer_appliance:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"/cfadmin/img/"
    vendor: accellion
    product: file_transfer_appliance
  tags: accellion,tech,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cfadmin/"

    matchers-condition: and
    matchers:
      - type: word
        name: file_transfer_appliance
        cpe: cpe:2.3:a:accellion:file_transfer_appliance:*:*:*:*:*:*:*:*
        part: body
        words:
          - '/cfadmin/img/accellion-logo.png'
          - 'secured by accellion'
        condition: or

      - type: status
        status:
          - 200
