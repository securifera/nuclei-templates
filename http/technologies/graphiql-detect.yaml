id: graphiql-detect

info:
  name: GraphiQL Detect
  author: Adam Crosser
  severity: info
  description: Detects the GraphiQL application
  classification:
    cpe: cpe:2.3:a:graphql:graphiql:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: graphql
    product: graphiql
  tags: tech,graphiql,graphql,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        name: graphiql
        cpe: cpe:2.3:a:graphql:graphiql:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>GraphiQL'

      - type: status
        status:
          - 200
