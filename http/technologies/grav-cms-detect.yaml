id: grav-cms-detect

info:
  name: Grav CMS Detect
  author: cyllective
  severity: info
  description: Detects Grav CMS
  reference:
    - https://github.com/getgrav/grav
  classification:
    cpe: cpe:2.3:a:getgrav:grav:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: getgrav
    product: grav
  tags: tech,grav,cms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        name: grav
        cpe: cpe:2.3:a:getgrav:grav:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'Set-Cookie: grav-site-'

      - type: word
        name: grav-2
        cpe: cpe:2.3:a:getgrav:grav:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<meta name="generator" content="GravCMS" />'
