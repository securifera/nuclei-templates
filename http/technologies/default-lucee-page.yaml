id: default-lucee-page

info:
  name: Lucee Default Page
  author: dhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:lucee:lucee:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Lucee"
    vendor: lucee
    product: lucee
  tags: tech,lucee,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        name: lucee
        cpe: cpe:2.3:a:lucee:lucee:*:*:*:*:*:*:*:*
        words:
          - "<title>Rapid web development with Lucee!</title>"
        part: body

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "Lucee ([0-9.\\-A-Z]+) on your system"
