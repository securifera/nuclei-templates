id: shopizer-detect

info:
  name: Shopizer Detection
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:shopizer:shopizer:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: shopizer
    product: shopizer
  tags: tech,shopizer,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/shop/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: shopizer
        cpe: cpe:2.3:a:shopizer:shopizer:*:*:*:*:*:*:*:*
        words:
          - 'Powered by <a href="http://www.shopizer.com"'
        part: body
