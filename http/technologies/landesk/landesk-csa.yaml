id: landesk-csa

info:
  name: LANDESK(R) Cloud Services Appliance Detect
  author: 0xNirvana
  severity: info
  classification:
    cpe: cpe:2.3:a:landesk:cloud_services_appliance:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"LANDESK(R)"
    vendor: landesk
    product: cloud_services_appliance
  tags: tech,landesk,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: cloud_services_appliance
        cpe: cpe:2.3:a:landesk:cloud_services_appliance:*:*:*:*:*:*:*:*
        part: body
        words:
          - "LANDESK(R)"
          - "Cloud Services Appliance"
        condition: and
