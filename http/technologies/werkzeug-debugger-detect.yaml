id: werkzeug-debugger-detect

info:
  name: Werkzeug debugger console
  author: pdteam
  severity: info
  classification:
    cpe: cpe:2.3:a:palletsprojects:werkzeug:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: palletsprojects
    product: werkzeug
  tags: tech,werkzeug,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/console"

    matchers:
      - type: word
        name: werkzeug
        cpe: cpe:2.3:a:palletsprojects:werkzeug:*:*:*:*:*:*:*:*
        words:
          - "<h1>Interactive Console</h1>"
        part: body
