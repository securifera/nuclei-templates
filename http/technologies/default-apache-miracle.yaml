id: default-apache-miracle

info:
  name: Default Apache Miracle Linux Web Server Page
  author: DhiyaneshDK
  severity: info
  classification:
    cpe: cpe:2.3:a:apache:http_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Apache Miracle Linux Web Server"
    vendor: apache
    product: http_server
  tags: tech,default-page,apache,miracle,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        name: http_server
        cpe: cpe:2.3:a:apache:http_server:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<TITLE>Apache Miracle Linux Web Server</TITLE>'

      - type: status
        status:
          - 200
