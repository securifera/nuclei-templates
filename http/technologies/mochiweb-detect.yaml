id: mochiweb-detect

info:
  name: MochiWeb - Detect
  author: Shivam Kamboj
  severity: info
  description: |
    Detected servers using the MochiWeb framework through the Server header.
  classification:
    cpe: cpe:2.3:a:mochiweb:mochiweb:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    shodan-query: http.component:"mochiweb" country:"US"
    vendor: mochiweb
    product: mochiweb
  tags: tech,mochiweb

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        name: mochiweb
        cpe: cpe:2.3:a:mochiweb:mochiweb:*:*:*:*:*:*:*:*
        part: header
        regex:
          - 'MochiWeb'

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - 'MochiWeb/([0-9.]+)'
