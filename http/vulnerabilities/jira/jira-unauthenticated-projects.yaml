id: jira-unauthenticated-projects

info:
  name: Jira Unauthenticated Projects
  author: TechbrunchFR
  severity: info
  classification:
    cpe: cpe:2.3:a:jira:jira:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.component:"Atlassian Jira"
    vendor: jira
    product: jira
  tags: atlassian,jira,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/rest/api/2/project?maxResults=100"

    matchers:
      - type: word
        name: jira
        cpe: cpe:2.3:a:jira:jira:*:*:*:*:*:*:*:*
        words:
          - 'projects'
          - 'startAt'
          - 'maxResults'
        condition: and
