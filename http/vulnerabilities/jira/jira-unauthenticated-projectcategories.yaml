id: jira-unauthenticated-projectcategories

info:
  name: Jira Unauthenticated Project Categories
  author: TESS
  severity: info
  classification:
    cpe: cpe:2.3:a:jira:jira:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.component:"Atlassian Jira"
    vendor: jira
    product: jira
  tags: atlassian,jira,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/rest/api/2/projectCategory?maxResults=1000"

    matchers-condition: and
    matchers:
      - type: word
        name: jira
        cpe: cpe:2.3:a:jira:jira:*:*:*:*:*:*:*:*
        words:
          - 'self'
          - 'description'
          - 'name'
        condition: and

      - type: status
        status:
          - 200

      - type: word
        name: jira-2
        cpe: cpe:2.3:a:jira:jira:*:*:*:*:*:*:*:*
        part: header
        words:
          - "atlassian.xsrf.token"
