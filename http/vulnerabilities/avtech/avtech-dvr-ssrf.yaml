id: avtech-dvr-ssrf

info:
  name: AVTECH DVR - SSRF
  author: ritikchaddha
  severity: medium
  description: |
    AVTECH DVR device, Search.cgi can be accessed directly. Search.cgi is responsible for searching and accessing cameras in the local network. Search.cgi provides the cgi_query function.
  classification:
    cpe: cpe:2.3:a:avtech:avtech:*:*:*:*:*:*:*:*
    cwe-id: CWE-918
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"login" product:"Avtech"
    fofa-query: app="AVTECH-视频监控"
    vendor: avtech
    product: avtech
  tags: ssrf,avtech,unauth,iot,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/nobody/Search.cgi?action=scan"

    matchers-condition: and
    matchers:
      - type: word
        name: avtech
        cpe: cpe:2.3:a:avtech:avtech:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Search.Device'
          - 'Proto='
          - 'IPAddress='
        condition: and

      - type: word
        name: avtech-2
        cpe: cpe:2.3:a:avtech:avtech:*:*:*:*:*:*:*:*
        part: header
        words:
          - text/plain

      - type: status
        status:
          - 200
