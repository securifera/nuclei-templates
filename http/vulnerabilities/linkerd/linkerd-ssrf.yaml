id: linkerd-service-detect

info:
  name: Linkerd Service detection
  author: dudez
  severity: info
  reference:
    - https://twitter.com/nirvana_msu/status/1084144955034165248
  classification:
    cpe: cpe:2.3:a:linkerd:linkerd:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: linkerd
    product: linkerd
  tags: tech,linkerd,service,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    headers:
      l5d-dtab: /svc/* => /$/inet/interact.sh/443

    matchers-condition: or
    matchers:
      - type: regex
        name: linkerd
        cpe: cpe:2.3:a:linkerd:linkerd:*:*:*:*:*:*:*:*
        regex:
          - '(?mi)^l5d-err:.*$'
          - '(?mi)^l5d-success-class: 0.*$'
          - '(?mi)^Via\s*?:.*?linkerd.*$'
        part: header
        condition: or

      - type: regex
        name: linkerd-2
        cpe: cpe:2.3:a:linkerd:linkerd:*:*:*:*:*:*:*:*
        regex:
          - '(?mi)Exceeded .*? binding timeout while resolving name'
          - '(?mi)exceeded .*? to unspecified while dyn binding'
        part: body
        condition: or
