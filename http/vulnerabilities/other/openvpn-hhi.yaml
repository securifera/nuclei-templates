id: openvpn-hhi

info:
  name: OpenVPN Host Header Injection
  author: twitter.com/Dheerajmadhukar
  severity: info
  description: A vulnerability in OpenVPN Access Server allows remote attackers to inject arbitrary redirection URLs by using the 'Host' HTTP header field.
  classification:
    cpe: cpe:2.3:a:openvpn:openvpn:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: openvpn
    product: openvpn
  tags: openvpn,hostheader-injection,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    headers:
      Host: "{{randstr}}.tld"

    matchers-condition: and
    matchers:
      - type: word
        name: openvpn
        cpe: cpe:2.3:a:openvpn:openvpn:*:*:*:*:*:*:*:*
        words:
          - "https://{{randstr}}.tld/__session_start__/"
          - "openvpn_sess"
        part: header
        condition: and

      - type: status
        status:
          - 302
