id: netgear-router-exposure

info:
  name: NETGEAR Routers - Serial Number Disclosure
  author: geeknik
  severity: medium
  description: |
    Multiple NETGEAR router models disclose their serial number which can be used to obtain the admin password if password recovery is enabled.
  reference:
    - https://www.exploit-db.com/exploits/47117
  classification:
    cpe: cpe:2.3:a:netgear:netgear:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: netgear
    product: netgear
  tags: edb,netgear,exposure,iot,router,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/rootDesc.xml"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 501
        condition: or

      - type: word
        name: netgear
        cpe: cpe:2.3:a:netgear:netgear:*:*:*:*:*:*:*:*
        words:
          - "<serialNumber>"
          - "<deviceType>"
          - "<modelNumber>"
        condition: and

      - type: word
        name: netgear-2
        cpe: cpe:2.3:a:netgear:netgear:*:*:*:*:*:*:*:*
        part: header
        words:
          - text/xml

    extractors:
      - type: regex
        group: 1
        regex:
          - "<serialNumber>([A-Z0-9]+)<\\/serialNumber>"
