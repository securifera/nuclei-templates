id: tianqing-info-leak

info:
  name: Tianqing Info Leak
  author: ritikchaddha
  severity: medium
  description: Information exposed in Tianqing.
  reference:
    - https://mp.weixin.qq.com/s/wH5luLISE_G381W2ssv93g
  classification:
    cpe: cpe:2.3:a:tianqing:tianqing:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: tianqing
    product: tianqing
  tags: tianqing,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/dbstat/gettablessize"

    matchers-condition: and
    matchers:
      - type: word
        name: tianqing
        cpe: cpe:2.3:a:tianqing:tianqing:*:*:*:*:*:*:*:*
        part: body
        words:
          - "schema_name"
          - "table_name"
          - "table_size"
        condition: and

      - type: word
        name: tianqing-2
        cpe: cpe:2.3:a:tianqing:tianqing:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
