id: unauthenticated-duplicator-disclosure

info:
  name: WordPress Duplicator Plugin - Information disclosure
  author: tess
  severity: medium
  description: |
    Unauthenticated Information disclosure of Duplicator WordPress plugin sensitive files.
  classification:
    cpe: cpe:2.3:a:unauthenticated-duplicator:unauthenticated-duplicator:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: unauthenticated-duplicator
    product: unauthenticated-duplicator
  tags: wordpress,wp,wp-plugin,misconfig,disclosure,unauth,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/backups-dup-lite/tmp/"
      - "{{BaseURL}}/wp-content/backups-dup-lite"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: unauthenticated-duplicator
        cpe: cpe:2.3:a:unauthenticated-duplicator:unauthenticated-duplicator:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'Index of /wp-content/backups-dup-lite/'

      - type: word
        name: unauthenticated-duplicator-2
        cpe: cpe:2.3:a:unauthenticated-duplicator:unauthenticated-duplicator:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
