id: wordpress-tmm-db-migrate

info:
  name: WordPress ThemeMarkers DB Migration File
  author: dwisiswant0
  severity: info
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wordpress
    product: wordpress
  tags: wordpress,wp-plugin,backup,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/uploads/tmm_db_migrate/tmm_db_migrate.zip"

    max-size: 1000

    matchers-condition: and
    matchers:
      - type: word
        name: wordpress
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        words:
          - "application/zip"
        part: header

      - type: regex
        name: wordpress-2
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        regex:
          - "[a-z0-9_]+.dat"
        part: body

      - type: status
        status:
          - 200

      - type: binary
        name: wordpress-3
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        binary:
          - "504B0304" # zip
