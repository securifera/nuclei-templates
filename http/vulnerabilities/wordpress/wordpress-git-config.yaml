id: wordpress-git-config

info:
  name: Wordpress Git Config
  author: nerrorsec
  severity: info
  description: Searches for the pattern /.git/config inside themes and plugins folder.
  reference:
    - https://hackerone.com/reports/248693
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: wordpress
    product: wordpress
  tags: hackerone,config,git,exposure,wordpress,wp-plugin,wp-theme,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/.git/config"
      - "{{BaseURL}}/wp-content/themes/.git/config"

    matchers-condition: and
    matchers:
      - type: word
        name: wordpress
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        words:
          - "[core]"

      - type: dsl
        name: wordpress-2
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        dsl:
          - "!contains(tolower(body), '<html')"
          - "!contains(tolower(body), '<body')"
        condition: and

      - type: status
        status:
          - 200
