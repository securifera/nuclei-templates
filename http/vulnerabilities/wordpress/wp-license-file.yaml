id: wp-license-file

info:
  name: WordPress license file disclosure
  author: yashgoti
  severity: info
  description: Leaked WordPress license file.
  classification:
    cpe: cpe:2.3:a:wp-license-file:wp-license-file:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wp-license-file
    product: wp-license-file
  tags: wordpress,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/license.txt"

    matchers-condition: and
    matchers:
      - type: word
        name: wp-license-file
        cpe: cpe:2.3:a:wp-license-file:wp-license-file:*:*:*:*:*:*:*:*
        words:
          - "WordPress - Web publishing software"

      - type: status
        status:
          - 200
