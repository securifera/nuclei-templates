id: wordpress-user-enum

info:
  name: Wordpress User Enumeration
  author: r3dg33k
  severity: info
  description: This template detects user enumeration in wordpress.
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wordpress
    product: wordpress
  tags: wordpress,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/?author=1"

    matchers-condition: and
    matchers:
      - type: regex
        name: wordpress
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        regex:
          - '(?i)Location: http(s|):\/\/[\w\.\-]+\/author\/\w+'
        part: header

      - type: status
        status:
          - 301

    extractors:
      - type: regex
        part: header
        regex:
          - 'author\/\w+'
