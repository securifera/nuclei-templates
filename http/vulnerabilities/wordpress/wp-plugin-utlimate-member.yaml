id: wordpress-plugins-ultimate-member

info:
  name: WordPress Plugin Ultimate Member
  author: pussycat0x
  severity: info
  description: Searches for sensitive directories present in the ultimate-member plugin.
  reference:
    - https://www.exploit-db.com/ghdb/6998
  classification:
    cpe: cpe:2.3:a:wp-plugin-utlimate-member:wp-plugin-utlimate-member:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wp-plugin-utlimate-member
    product: wp-plugin-utlimate-member
  tags: wordpress,listing,plugin,edb,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/ultimate-member/"

    matchers-condition: and
    matchers:
      - type: word
        name: wp-plugin-utlimate-member
        cpe: cpe:2.3:a:wp-plugin-utlimate-member:wp-plugin-utlimate-member:*:*:*:*:*:*:*:*
        words:
          - "Index of"
          - "/wp-content/plugins/ultimate-member/"
        condition: and

      - type: status
        status:
          - 200
