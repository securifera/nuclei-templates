id: alfacgiapi-wordpress

info:
  name: alfacgiapi
  author: pussycat0x
  severity: low
  description: Searches for sensitive directories present in the alfacgiapi plugin.
  reference:
    - https://www.exploit-db.com/ghdb/6999
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    max-request: 4
    vendor: wordpress
    product: wordpress
  tags: wordpress,listing,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-includes/ALFA_DATA/"
      - "{{BaseURL}}/wp-content/uploads/alm_templates/ALFA_DATA/alfacgiapi/"
      - "{{BaseURL}}/ALFA_DATA/alfacgiapi/"
      - "{{BaseURL}}/cgi-bin/ALFA_DATA/alfacgiapi/"

    matchers-condition: and
    matchers:
      - type: word
        name: wordpress
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        words:
          - "Index of"

      - type: word
        name: wordpress-2
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        words:
          - "/wp-content/plugins/"
          - "/wp-includes/ALFA_DATA/"
          - "/ALFA_DATA/alfacgiapi/"
          - "/cgi-bin/ALFA_DATA/alfacgiapi/"
        condition: or

      - type: status
        status:
          - 200
