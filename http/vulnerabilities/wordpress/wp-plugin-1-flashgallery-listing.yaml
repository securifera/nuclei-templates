id: wp-plugin-1-flashgallery-listing

info:
  name: WordPress 1 flash gallery listing
  author: pussycat0x
  severity: info
  description: Searches for sensitive directories present in the 1-flash-gallery plugin.
  reference:
    - https://www.exploit-db.com/ghdb/6978
  classification:
    cpe: cpe:2.3:a:listing:listing:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: listing
    product: listing
  tags: wordpress,listing,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/1-flash-gallery/"
      - "{{BaseURL}}/blog/wp-content/plugins/1-flash-gallery/"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        name: listing
        cpe: cpe:2.3:a:listing:listing:*:*:*:*:*:*:*:*
        words:
          - "Index of"
          - "/wp-content/plugins/1-flash-gallery"
        condition: and

      - type: status
        status:
          - 200
