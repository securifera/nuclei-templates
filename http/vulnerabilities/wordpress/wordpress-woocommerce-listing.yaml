id: wordpress-woocommerce-listing

info:
  name: WordPress WooCommerce - Directory Search
  author: dhiyaneshDK
  severity: info
  description: WordPress WooCommerce plugin sensitive directory searches were conducted.
  reference:
    - https://www.exploit-db.com/ghdb/6192
  classification:
    cpe: cpe:2.3:a:woocommerce:woocommerce:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: woocommerce
    product: woocommerce
  tags: edb,wordpress,listing,plugin,woocommerce,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/woocommerce/"

    matchers-condition: and
    matchers:
      - type: word
        name: woocommerce
        cpe: cpe:2.3:a:woocommerce:woocommerce:*:*:*:*:*:*:*:*
        words:
          - "Index of"
          - "/wp-content/plugins/woocommerce/"
        condition: and

      - type: status
        status:
          - 200
