id: wordpress-xmlrpc-detect

info:
  name: WordPress XMLRPC
  author: udit_thakkur
  severity: info
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wordpress
    product: wordpress
  tags: wordpress,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/xmlrpc.php"

    matchers:
      - type: word
        name: wordpress
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        words:
          - 'XML-RPC server accepts POST requests only.'
