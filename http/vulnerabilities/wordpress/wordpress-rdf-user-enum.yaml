id: wordpress-rdf-user-enum

info:
  name: Wordpress RDF User Enumeration
  author: r3dg33k
  severity: info
  description: Leaked Wordpress RDF leads to User Emumeration.
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wordpress
    product: wordpress
  tags: wordpress,enum,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/feed/rdf'

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        name: wordpress
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/rdf+xml"

      - type: word
        name: wordpress-2
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<rdf:RDF"
          - "<dc:creator>"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<dc\:creator><\!\[CDATA\[(.*?)\]\]></dc'
