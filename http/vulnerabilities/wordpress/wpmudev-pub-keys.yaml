id: wpmudev-pub-keys

info:
  name: Wpmudev Dashboard Pub Key
  author: dhiyaneshDk
  severity: medium
  description: Wpmudev Wordpress Plugin public key leaked.
  reference:
    - https://www.exploit-db.com/ghdb/6443
  classification:
    cpe: cpe:2.3:a:wpmudev-pub-keys:wpmudev-pub-keys:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wpmudev-pub-keys
    product: wpmudev-pub-keys
  tags: wordpress,edb,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/wp-content/plugins/wpmudev-updates/keys/'

    matchers-condition: and
    matchers:
      - type: word
        name: wpmudev-pub-keys
        cpe: cpe:2.3:a:wpmudev-pub-keys:wpmudev-pub-keys:*:*:*:*:*:*:*:*
        words:
          - "Index of /"
          - ".pub"
          - "wpmudev"
        condition: and
        part: body

      - type: status
        status:
          - 200
