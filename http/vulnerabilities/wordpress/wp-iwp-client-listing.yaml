id: wp-iwp-client-listing

info:
  name: WordPress Plugin Iwp-client Listing
  author: pussycat0x
  severity: info
  description: Searches for sensitive directories present in the iwp-client plugin.
  reference:
    - https://www.exploit-db.com/ghdb/6427
  classification:
    cpe: cpe:2.3:a:listing:listing:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: listing
    product: listing
  tags: wordpress,listing,plugin,edb,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/iwp-client/"

    matchers-condition: and
    matchers:
      - type: word
        name: listing
        cpe: cpe:2.3:a:listing:listing:*:*:*:*:*:*:*:*
        words:
          - "Index of"
          - "wp-content/plugins/iwp-client/"
        condition: and

      - type: status
        status:
          - 200
