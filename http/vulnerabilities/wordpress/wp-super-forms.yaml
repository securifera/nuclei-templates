id: wordpress-super-forms

info:
  name: WordPress super-forms Plugin Directory Listing
  author: pussycat0x
  severity: low
  description: Searches for sensitive directories present in the super-forms plugin.
  reference:
    - https://www.exploit-db.com/ghdb/6776
  classification:
    cpe: cpe:2.3:a:wp-super-forms:wp-super-forms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wp-super-forms
    product: wp-super-forms
  tags: listing,plugin,edb,wordpress,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/super-forms/"

    matchers-condition: and
    matchers:
      - type: word
        name: wp-super-forms
        cpe: cpe:2.3:a:wp-super-forms:wp-super-forms:*:*:*:*:*:*:*:*
        words:
          - "Index of /wp-content/plugins/super-forms/"

      - type: status
        status:
          - 200
