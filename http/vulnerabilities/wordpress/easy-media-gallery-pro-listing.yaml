id: easy-media-gallery-pro-listing

info:
  name: WordPress Plugin Media Gallery Pro Listing
  author: pussycat0x
  severity: info
  description: Searches for sensitive directories present in the easy-media-gallery-pro plugin.
  reference:
    - https://www.exploit-db.com/ghdb/6455
  classification:
    cpe: cpe:2.3:a:listing:listing:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: listing
    product: listing
  tags: wordpress,listing,wp-plugin,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/easy-media-gallery-pro/"

    matchers-condition: and
    matchers:
      - type: word
        name: listing
        cpe: cpe:2.3:a:listing:listing:*:*:*:*:*:*:*:*
        words:
          - "Index of"
          - "wp-content/plugins/easy-media-gallery-pro/"
        condition: and

      - type: status
        status:
          - 200
