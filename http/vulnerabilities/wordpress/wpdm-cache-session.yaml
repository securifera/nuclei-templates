id: wpdm-cache-session

info:
  name: Wpdm-Cache Session
  author: dhiyaneshDk
  severity: medium
  description: Leaked session of Wpdm Cache wordpress plugin.
  reference:
    - https://www.exploit-db.com/ghdb/7004
  classification:
    cpe: cpe:2.3:a:wpdm-cache-session:wpdm-cache-session:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wpdm-cache-session
    product: wpdm-cache-session
  tags: wordpress,edb,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/wp-content/uploads/wpdm-cache/'

    matchers-condition: and
    matchers:
      - type: word
        name: wpdm-cache-session
        cpe: cpe:2.3:a:wpdm-cache-session:wpdm-cache-session:*:*:*:*:*:*:*:*
        words:
          - "Index of /"
          - ".txt"
          - "wpdm-cache"
        condition: and
        part: body

      - type: status
        status:
          - 200
