id: wordpress-installer-log

info:
  name: WordPress Installer Log
  author: dwisiswant0
  severity: info
  description: This file is generated during the installation process of wordpress and is exposed.
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wordpress
    product: wordpress
  tags: wordpress,log,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/installer-log.txt"

    matchers-condition: and
    matchers:
      - type: regex
        name: wordpress
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        regex:
          - "(?mi)DUPLICATOR(-|\\s)?(PRO|LITE)?:? INSTALL-LOG"
        part: body

      - type: status
        status:
          - 200
