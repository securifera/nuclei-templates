id: wordpress-upload-data

info:
  name: wordpress-upload-data
  author: pussycat0x
  severity: medium
  description: The remote WordPress installation contains a file 'data.txt' under the '/wp-content/uploads/' folder that has sensitive information inside it.
  reference:
    - https://www.exploit-db.com/ghdb/7040
  classification:
    cpe: cpe:2.3:a:wp-upload-data:wp-upload-data:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wp-upload-data
    product: wp-upload-data
  tags: wordpress,listing,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/uploads/data.txt"

    matchers-condition: and
    matchers:
      - type: word
        name: wp-upload-data
        cpe: cpe:2.3:a:wp-upload-data:wp-upload-data:*:*:*:*:*:*:*:*
        words:
          - "admin:"

      - type: word
        name: wp-upload-data-2
        cpe: cpe:2.3:a:wp-upload-data:wp-upload-data:*:*:*:*:*:*:*:*
        part: header
        words:
          - "text/plain"

      - type: status
        status:
          - 200
