id: wordpress-db-backup

info:
  name: WordPress DB Backup
  author: dwisiswant0
  severity: medium
  description: This template checks for exposed database in wordpress.
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wordpress
    product: wordpress
  tags: wordpress,backups,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/backup-db/"

    matchers-condition: and
    matchers:
      - type: word
        name: wordpress
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        words:
          - "Index of /"
          - ".sql\">"
        condition: and
        part: body

      - type: status
        status:
          - 200
