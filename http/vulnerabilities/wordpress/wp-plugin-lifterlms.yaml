id: wordpress-plugins-lifterlms

info:
  name: WordPress Plugin lifterlms Listing
  author: pussycat0x
  severity: info
  description: Searches for sensitive directories present in the lifterlms plugin.
  reference:
    - https://www.exploit-db.com/ghdb/6420
  classification:
    cpe: cpe:2.3:a:wp-plugin-lifterlms:wp-plugin-lifterlms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wp-plugin-lifterlms
    product: wp-plugin-lifterlms
  tags: wordpress,listing,plugin,edb,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/lifterlms/"

    matchers-condition: and
    matchers:
      - type: word
        name: wp-plugin-lifterlms
        cpe: cpe:2.3:a:wp-plugin-lifterlms:wp-plugin-lifterlms:*:*:*:*:*:*:*:*
        words:
          - "Index of"
          - "/wp-content/plugins/lifterlms/"
        condition: and

      - type: status
        status:
          - 200
