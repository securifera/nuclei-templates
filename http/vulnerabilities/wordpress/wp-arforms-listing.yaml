id: wp-arforms-listing

info:
  name: WordPress Plugin Arforms Listing
  author: pussycat0x
  severity: info
  description: Searches for sensitive directories present in the arforms plugin.
  reference:
    - https://www.exploit-db.com/ghdb/6424
  classification:
    cpe: cpe:2.3:a:listing:listing:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: listing
    product: listing
  tags: listing,plugin,edb,wordpress,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/arforms/"

    matchers-condition: and
    matchers:
      - type: word
        name: listing
        cpe: cpe:2.3:a:listing:listing:*:*:*:*:*:*:*:*
        words:
          - "Index of"
          - "wp-content/plugins/arforms/"
        condition: and

      - type: status
        status:
          - 200
