id: wordpress-db-repair

info:
  name: Wordpress DB Repair Exposed
  author: _C0wb0y_
  severity: low
  description: Discover enabled Wordpress repair page.
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: wordpress
    product: wordpress
  tags: wordpress,config,fpd,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-admin/maint/repair.php"

    matchers-condition: and
    matchers:
      - type: word
        name: wordpress
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        words:
          - "<title>WordPress"

      - type: status
        status:
          - 200

      - type: word
        name: wordpress-2
        cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
        words:
          - "define"
          - "WP_ALLOW_REPAIR"
          - "true"
        condition: and
        negative: true
