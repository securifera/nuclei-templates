id: unauthenticated-jenkins

info:
  name: Jenkins Dashboard - Unauthenticated Access
  author: dhiyaneshDK
  severity: high
  description: Jenkins Dashboard is exposed to external users.
  classification:
    cpe: cpe:2.3:a:jenkins:jenkins:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: jenkins
    product: jenkins
  tags: jenkins,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/jenkins/"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        name: jenkins
        cpe: cpe:2.3:a:jenkins:jenkins:*:*:*:*:*:*:*:*
        words:
          - Dashboard [Jenkins]

      - type: status
        status:
          - 200
