id: jolokia-heap-info-disclosure

info:
  name: Jolokia Java Heap Information Disclosure
  author: milo2012
  severity: info
  classification:
    cpe: cpe:2.3:a:jolokia:jolokia:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: jolokia
    product: jolokia
  tags: jolokia,disclosure,java,vuln

http:
  - raw:
      - |
        POST /jolokia/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded


        {
           "type":"EXEC",
           "mbean":"com.sun.management:type=HotSpotDiagnostic",
           "operation":"dumpHeap",
           "arguments":[
              "/tmp1234/test1.hprof",
              0
           ]
        }

    matchers:
      - type: word
        name: jolokia
        cpe: cpe:2.3:a:jolokia:jolokia:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'stacktrace":"java.io.IOException: No such file or directory'
