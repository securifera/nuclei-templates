id: idocview-2word-fileupload

info:
  name: IDoc View /html/2word - Arbitrary File Upload
  author: DhiyaneshDK
  severity: high
  classification:
    cpe: cpe:2.3:a:idoc:idoc:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: title=="在线文档预览 - I Doc View"
    vendor: idoc
    product: idoc
  tags: idoc,rce,instrusive,file-upload,vuln

variables:
  file: "{{to_lower(rand_text_alpha(5))}}"

http:
  - method: GET
    path:
      - "{{BaseURL}}/html/2word?url={{file}}"

    matchers-condition: and
    matchers:
      - type: word
        name: idoc
        cpe: cpe:2.3:a:idoc:idoc:*:*:*:*:*:*:*:*
        part: response
        words:
          - "{{md5(file)}}.docx"

      - type: status
        status:
          - 200
