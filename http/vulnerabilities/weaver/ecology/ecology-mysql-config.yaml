id: ecology-mysql-config

info:
  name: Fanwei OA E-Office - Information Disclosure
  author: ritikchaddha
  severity: medium
  description: |
    Fanwei E-Office mysql_config.ini file can be directly accessed, leaking database account password and other information.
  classification:
    cpe: cpe:2.3:a:ecology:ecology:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="泛微-EOffice"
    vendor: ecology
    product: ecology
  tags: fanwei,ecology,exposure,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/mysql_config.ini"

    matchers-condition: and
    matchers:
      - type: word
        name: ecology
        cpe: cpe:2.3:a:ecology:ecology:*:*:*:*:*:*:*:*
        part: body
        words:
          - "dataurl"
          - "datapassword"
          - "datauser"
        condition: and

      - type: word
        name: ecology-2
        cpe: cpe:2.3:a:ecology:ecology:*:*:*:*:*:*:*:*
        part: header
        words:
          - text/plain

      - type: status
        status:
          - 200
