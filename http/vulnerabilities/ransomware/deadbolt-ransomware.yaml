id: deadbolt-ransomware

info:
  name: Deadbolt Ransomware Detection
  author: pdteam
  severity: info
  classification:
    cpe: cpe:2.3:a:deadbolt:ransomware:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: deadbolt
    product: ransomware
  tags: ransomware,deadbolt,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        name: ransomware
        cpe: cpe:2.3:a:deadbolt:ransomware:*:*:*:*:*:*:*:*
        words:
          - "<title>ALL YOUR FILES HAVE BEEN LOCKED BY DEADBOLT.</title>"
