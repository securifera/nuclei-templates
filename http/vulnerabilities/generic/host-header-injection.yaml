id: host-header-injection

info:
  name: Host Header Injection
  author: princechaddha
  severity: info
  description: HTTP header injection is a general class of web application security vulnerability which occurs when Hypertext Transfer Protocol headers are dynamically generated based on user input.
  reference:
    - https://portswigger.net/web-security/host-header
    - https://portswigger.net/web-security/host-header/exploiting
    - https://www.acunetix.com/blog/articles/automated-detection-of-host-header-attacks/
  classification:
    cpe: cpe:2.3:a:host-header:host-header:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: host-header
    product: host-header
  tags: hostheader-injection,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    headers:
      Host: "{{randstr}}.tld"

    matchers-condition: and
    matchers:
      - type: word
        name: host-header
        cpe: cpe:2.3:a:host-header:host-header:*:*:*:*:*:*:*:*
        words:
          - '{{randstr}}.tld'
        part: body
        condition: and

      - type: status
        status:
          - 200
